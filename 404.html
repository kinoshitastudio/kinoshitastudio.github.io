<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>404 — ページが見つかりません | 木下スタジオ</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://kinoshita.studio/404.html">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
  <link rel="apple-touch-icon" href="favicon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400&family=Space+Mono&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    :root{--bg:#EBE8E2;--ink:#1a1a18;--ink-faint:#7a7770;--gold:#a89060;--border:rgba(26,26,24,0.12);}
    html{scroll-behavior:smooth;}
    body{background:var(--bg);color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;font-weight:400;min-height:100vh;display:flex;flex-direction:column;cursor:none;}
    a,button{cursor:none;-webkit-tap-highlight-color:transparent;}
    #cur-dot{position:fixed;pointer-events:none;z-index:9999;width:6px;height:6px;border-radius:50%;background:var(--ink);transform:translate(-50%,-50%);transition:width .2s,height .2s,background .2s;}
    #cur-ring{position:fixed;pointer-events:none;z-index:9998;width:32px;height:32px;border-radius:50%;border:1px solid rgba(26,26,24,0.4);transform:translate(-50%,-50%);transition:width .3s,height .3s,border-color .3s;}

    nav{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;align-items:center;justify-content:space-between;padding:2rem 3rem;border-bottom:1px solid transparent;transition:padding .4s cubic-bezier(0.16,1,0.3,1),border-color .4s ease;}
    .nav-logo{font-family:'Space Mono',monospace;font-size:.75rem;letter-spacing:.15em;text-decoration:none;color:var(--ink);text-transform:uppercase;}

    main{flex:1;display:flex;align-items:center;justify-content:center;padding:8rem 2rem 4rem;}
    .error-wrap{text-align:center;max-width:480px;}
    .error-code{font-family:'Space Mono',monospace;font-size:clamp(5rem,20vw,10rem);line-height:1;color:var(--gold);letter-spacing:-.02em;opacity:.35;margin-bottom:2rem;}
    .error-title{font-size:clamp(1.1rem,3vw,1.4rem);font-weight:300;letter-spacing:.06em;margin-bottom:1rem;line-height:1.7;}
    .error-sub{font-size:.85rem;color:var(--ink-faint);line-height:1.8;margin-bottom:3rem;letter-spacing:.04em;}
    .error-link{display:inline-block;font-family:'Space Mono',monospace;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);text-decoration:none;padding:.9rem 2.5rem;border:1px solid rgba(26,26,24,0.3);transition:border-color .3s,background .3s,color .3s;}
    .error-link:hover{border-color:var(--gold);background:var(--gold);color:#fff;}

    footer{padding:2rem 3rem;border-top:1px solid var(--border);font-family:'Space Mono',monospace;font-size:.6rem;letter-spacing:.15em;color:var(--ink-faint);text-transform:uppercase;}

    @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
    .error-wrap>*{opacity:0;animation:fadeUp .8s ease forwards;}
    .error-code{animation-delay:.1s;}
    .error-title{animation-delay:.25s;}
    .error-sub{animation-delay:.38s;}
    .error-link{animation-delay:.5s;}

    @media(max-width:768px){nav{padding:1.5rem;} main{padding:7rem 1.5rem 3rem;}}
  </style>
</head>
<body>
  <div id="cur-dot"></div>
  <div id="cur-ring"></div>

  <nav>
    <a href="index.html" class="nav-logo">Kinoshita Studio</a>
  </nav>

  <main>
    <div class="error-wrap">
      <div class="error-code">404</div>
      <h1 class="error-title">ページが見つかりません</h1>
      <p class="error-sub">お探しのページは移動・削除されたか、<br>URLが間違っている可能性があります。</p>
      <a href="index.html" class="error-link">トップへ戻る</a>
    </div>
  </main>

  <footer>© Kinoshita Studio</footer>

  <script>
    (function(){
      const dot=document.getElementById('cur-dot');
      const ring=document.getElementById('cur-ring');
      let rx=0,ry=0,mx=0,my=0;
      document.addEventListener('mousemove',e=>{if((window._ksCursorGen||0)>_ksGen)return;mx=e.clientX;my=e.clientY;dot.style.left=mx+'px';dot.style.top=my+'px';});
      (function loop(){if((window._ksCursorGen||0)>_ksGen)return;rx+=(mx-rx)*.12;ry+=(my-ry)*.12;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(loop);})();
      document.querySelectorAll('a,button').forEach(el=>{
        el.addEventListener('mouseenter',()=>document.body.classList.add('cur-hover'));
        el.addEventListener('mouseleave',()=>document.body.classList.remove('cur-hover'));
      });
    })();
  </script>

</body>
</html>
