<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F0EBE2;--bg2:#E4DDD2;--paper:#FAF8F4;
  --wood:#2B1E14;--wood2:#3D2C1E;
  --ink:#1A1814;--ink2:#4A4640;--ink3:#8A8480;
  --border:rgba(26,24,20,0.10);
  --mono:"Space Mono",monospace;--sans:"Zen Kaku Gothic New",sans-serif;
}
html{background:var(--bg);color:var(--ink);font-family:var(--sans)}
body{min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{cursor:pointer;border:none;background:none;font-family:inherit}
/* BGM */
.bgm-btn{font-family:var(--mono);font-size:13px;padding:0 9px;height:28px;border:1px solid var(--border);border-radius:2px;color:var(--ink3);background:transparent;cursor:pointer;transition:all .15s;flex-shrink:0;letter-spacing:.04em}
.bgm-btn:hover{color:var(--ink);border-color:var(--ink)}
.bgm-btn.on{color:var(--ink);border-color:var(--ink);background:var(--bg2)}
/* HEADER */
.header{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);padding:0 24px}
.header-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:14px;height:54px}
.logo{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.12em;white-space:nowrap;flex-shrink:0}
.logo span{font-weight:400;opacity:.4}
.search-wrap{flex:1;max-width:440px;position:relative}
.search-input{width:100%;height:36px;background:var(--paper);border:1px solid var(--border);border-radius:2px;padding:0 38px 0 12px;font-family:var(--mono);font-size:16px;color:var(--ink);outline:none;transition:border-color .15s}
.search-input::placeholder{color:var(--ink3)}
.search-input:focus{border-color:var(--ink2)}
.search-btn{position:absolute;right:0;top:0;width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--ink3)}
.search-btn:hover{color:var(--ink)}
.nav-tabs{display:flex;gap:2px;flex-shrink:0}
.nav-tab{font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding:6px 12px;border-radius:2px;color:var(--ink3);transition:all .12s}
.nav-tab.active,.nav-tab:hover{background:var(--wood);color:var(--paper)}
/* VIEW TOGGLE */
.view-toggle{display:flex;gap:2px;flex-shrink:0}
.view-btn{font-family:var(--mono);font-size:10px;padding:5px 10px;border:1px solid var(--border);border-radius:1px;color:var(--ink3);transition:all .12s}
.view-btn.active{background:var(--ink2);color:var(--paper);border-color:var(--ink2)}
/* GENRE RAIL */
.genre-rail{border-bottom:1px solid var(--border);background:var(--bg2);padding:0 24px;overflow-x:auto;scrollbar-width:none}
.genre-rail::-webkit-scrollbar{display:none}
.genre-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:4px;padding:9px 0}
.lang-seg{display:flex;gap:2px;flex-shrink:0}
.lang-seg-btn{font-family:var(--mono);font-size:10px;letter-spacing:.1em;padding:3px 10px;border-radius:1px;border:1px solid var(--border);color:var(--ink3);transition:all .12s;background:var(--bg);white-space:nowrap}
.lang-seg-btn.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg-div{width:1px;height:18px;background:var(--border);flex-shrink:0;margin:0 6px}
.genre-group{display:contents}
.genre-btn{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 10px;border:1px solid var(--border);border-radius:1px;color:var(--ink2);white-space:nowrap;transition:all .12s;background:var(--bg)}
.genre-btn:hover,.genre-btn.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
/* MAIN */
.main{max-width:1280px;margin:0 auto;padding:28px 24px 100px}
.section-label{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3);margin-bottom:20px;display:flex;align-items:center;gap:12px}
.section-label::after{content:"";flex:1;height:1px;background:var(--border)}
.book-count{font-family:var(--mono);font-size:10px;color:var(--ink3);margin-bottom:24px;letter-spacing:.06em}
/* ── SHELF VIEW ── */
.shelf-unit{margin-bottom:0}
.shelf-board{
  position:relative;
  background:
    linear-gradient(180deg,#080604 0%,#100C08 35%,#181208 65%,#1E1610 100%);
  border-radius:3px 3px 0 0;
  padding:8px 20px 0;
  display:flex;align-items:flex-end;gap:0;overflow:hidden;
  box-shadow:inset 0 -4px 12px rgba(0,0,0,.5);
}
.shelf-surface{
  height:18px;position:relative;border-radius:0 0 4px 4px;
  background:
    repeating-linear-gradient(88deg,
      transparent 0,transparent 10px,
      rgba(0,0,0,.04) 10px,rgba(0,0,0,.04) 11px,
      transparent 11px,transparent 26px,
      rgba(255,255,255,.3) 26px,rgba(255,255,255,.3) 27px,
      transparent 27px,transparent 44px
    ),
    repeating-linear-gradient(93deg,
      transparent 0,transparent 60px,
      rgba(0,0,0,.025) 60px,rgba(0,0,0,.025) 61px
    ),
    linear-gradient(180deg,#E8DDD0 0%,#D8CCBC 25%,#C8BAA8 55%,#BCA898 80%,#B09888 100%);
  box-shadow:0 6px 20px rgba(0,0,0,.18),0 2px 4px rgba(0,0,0,.1),inset 0 1px 0 rgba(255,255,255,.6);
}
.shelf-surface::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.05) 0%,transparent 15%,transparent 85%,rgba(0,0,0,.05) 100%);border-radius:0 0 4px 4px}
/* SPINE */
.book-spine-wrap{position:relative;flex-shrink:0;cursor:grab;-webkit-user-select:none;user-select:none;transition:transform .38s cubic-bezier(.25,.8,.25,1);transform-origin:bottom center;will-change:transform}
.book-spine-wrap>*{pointer-events:none}
.book-spine-wrap img{-webkit-user-drag:none}
.book-spine-wrap:hover{transform:translateY(-14px) scale(1.06) rotate(0deg)!important}
.book-spine-wrap.pop{transform:translateY(-20px) scale(1.09);z-index:5}
.book-spine{border-radius:3px 2px 2px 3px;position:relative;overflow:hidden;box-shadow:2px 0 6px rgba(0,0,0,.4),inset -2px 0 5px rgba(0,0,0,.2);display:flex;align-items:stretch}
/* shelf unit perf */
.shelf-unit{contain:layout}
/* drag & drop */
.book-spine-wrap[draggable]{cursor:grab}
.book-spine-wrap[draggable]:active{cursor:grabbing}
.book-spine-wrap.dragging{opacity:.25;pointer-events:none}
.drop-line{width:3px;background:var(--ink);align-self:stretch;flex-shrink:0;border-radius:2px;opacity:0;transition:opacity .1s;margin:0 1px}
.drop-line.active{opacity:1}
/* window light overlay */
.shelf-light{position:absolute;inset:0;pointer-events:none;z-index:15;transition:background 60s ease}
/* clock */
.live-clock{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ink3);white-space:nowrap;flex-shrink:0;padding-left:6px;border-left:1px solid var(--border)}
.spine-text{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:10px 6px;writing-mode:vertical-rl;text-orientation:mixed;transform:rotate(180deg);position:relative;z-index:1}
.spine-author{font-family:var(--mono);font-size:7px;letter-spacing:.05em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-height:56px;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.spine-title{font-size:10px;font-weight:400;line-height:1.3;flex:1;padding:4px 0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.spine-year{font-family:var(--mono);font-size:7px;opacity:.5;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.spine-edge{position:absolute;right:0;top:0;bottom:0;width:4px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.22));z-index:2}
/* subtle vignette on shelf edges — lightweight replacement for grain */
.shelf-board::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:20;
  background:linear-gradient(90deg,rgba(0,0,0,.08) 0%,transparent 8%,transparent 92%,rgba(0,0,0,.08) 100%);}
/* real cover on spine */
.spine-cover-img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:left center;
  opacity:0.72;
  transition:transform .22s;
}
.book-spine-wrap:hover .spine-cover-img{transform:scale(1.06)}
.spine-text-overlay{
  position:absolute;inset:0;z-index:1;
  background:linear-gradient(to right,rgba(0,0,0,.18) 0%,transparent 60%);
  pointer-events:none;
}
/* ── GRID VIEW ── */
.cover-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:20px;
}
.cover-card{
  cursor:pointer;
  display:flex;flex-direction:column;
  transition:transform .18s cubic-bezier(.34,1.4,.64,1);
}
.cover-card:hover{transform:translateY(-6px)}
.cover-wrap{
  aspect-ratio:2/3;background:var(--bg2);
  border-radius:2px;overflow:hidden;position:relative;
  box-shadow:3px 4px 12px rgba(0,0,0,.22),inset -1px 0 0 rgba(0,0,0,.12);
}
.cover-img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .22s}
.cover-card:hover .cover-img{transform:scale(1.04)}
.cover-ph{
  width:100%;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:14px;gap:8px;
}
.cover-ph .ph-title{font-family:var(--mono);font-size:9px;font-weight:700;text-align:center;line-height:1.5;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.cover-ph .ph-author{font-family:var(--mono);font-size:8px;opacity:.6;text-align:center}
.cover-meta{padding:8px 2px 0}
.cover-title-sm{font-size:11px;line-height:1.4;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:3px}
.cover-author-sm{font-family:var(--mono);font-size:9px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* DETAIL PANEL */
.detail-overlay{position:fixed;inset:0;z-index:300;background:rgba(26,24,20,.72);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
.detail-overlay.open{opacity:1;pointer-events:all}
.detail-panel{background:var(--paper);max-width:720px;width:100%;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;border-radius:2px;box-shadow:0 24px 80px rgba(0,0,0,.4);transform:scale(.96) translateY(20px);transition:transform .22s cubic-bezier(.34,1.2,.64,1);position:relative}
.detail-overlay.open .detail-panel{transform:scale(1) translateY(0)}
.detail-scroll{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.detail-close{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--ink3);transition:background .12s;z-index:10;flex-shrink:0}
.detail-close:hover{background:var(--bg2);color:var(--ink)}
.detail-body{display:flex;flex-direction:column;gap:0}
.detail-visual{width:100%;display:flex;align-items:center;justify-content:center;padding:40px 24px 32px;position:relative;overflow:hidden;border-radius:2px 2px 0 0}
.detail-visual::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent 39px,rgba(255,255,255,.03) 39px,rgba(255,255,255,.03) 40px)}
.detail-book-3d{width:160px;box-shadow:12px 12px 32px rgba(0,0,0,.6),-3px 3px 0 rgba(0,0,0,.3),inset -5px 0 10px rgba(0,0,0,.35);border-radius:2px 5px 5px 2px;overflow:hidden;transform:perspective(500px) rotateY(-10deg);transition:transform .3s}
.detail-book-3d:hover{transform:perspective(500px) rotateY(0deg)}
.detail-cover-img{width:160px;aspect-ratio:2/3;object-fit:cover;display:block;opacity:0;transition:opacity .4s ease}
.detail-cover-img.loaded{opacity:1}
.detail-cover-ph{width:160px;aspect-ratio:2/3;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:8px}
.detail-cover-ph .ph-title{font-family:var(--mono);font-size:10px;font-weight:700;text-align:center;line-height:1.5;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.detail-cover-ph .ph-author{font-family:var(--mono);font-size:9px;opacity:.6;text-align:center}
.detail-info{width:100%;padding:24px 28px 28px}
.detail-badge{display:inline-block;font-family:var(--mono);font-size:8px;letter-spacing:.15em;text-transform:uppercase;padding:2px 7px;border:1px solid var(--border);color:var(--ink3);margin-bottom:12px}
.detail-title{font-size:19px;font-weight:400;line-height:1.35;margin-bottom:5px}
.detail-author{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-bottom:4px}
.detail-pub{font-family:var(--mono);font-size:10px;color:var(--ink3);opacity:.7;margin-bottom:16px}
.detail-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.detail-tag{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border:1px solid var(--border);color:var(--ink3)}
.desc-lang-toggle{display:flex;gap:4px;margin-bottom:8px}
.desc-lang-btn{font-family:var(--mono);font-size:9px;letter-spacing:.1em;padding:2px 9px;border:1px solid var(--border);border-radius:1px;color:var(--ink3);cursor:pointer;background:transparent;transition:all .12s}
.desc-lang-btn.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.detail-desc{font-size:13px;line-height:1.85;color:var(--ink2);margin-bottom:20px;transition:opacity .25s ease}
.detail-desc.dim{opacity:.3}
.author-section{padding:14px 0;border-top:1px solid var(--border);margin-bottom:18px;opacity:0;transition:opacity .3s ease}
.author-section.visible{opacity:1}
/* shimmer on cover while loading */
@keyframes coverShimmer{0%,100%{opacity:.45}50%{opacity:.7}}
.detail-book-3d{position:relative}
.detail-book-3d::after{content:"";position:absolute;inset:0;animation:coverShimmer 1.4s ease infinite;pointer-events:none;border-radius:2px 5px 5px 2px}
.detail-book-3d.img-loaded::after{display:none}
.section-mini-label{font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink3);margin-bottom:10px}
.author-card{display:flex;gap:12px;align-items:flex-start}
.author-avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;color:var(--paper);font-weight:700}
.author-name{font-size:13px;font-weight:400;margin-bottom:4px}
.author-bio{font-size:12px;line-height:1.7;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.buy-section{border-top:1px solid var(--border);padding-top:16px}
.buy-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.buy-link{font-family:var(--mono);font-size:10px;letter-spacing:.06em;padding:7px 14px;border:1px solid var(--border);color:var(--ink2);border-radius:1px;transition:all .12s;white-space:nowrap;display:inline-block}
.buy-link:hover{border-color:var(--ink);color:var(--ink)}
.buy-link.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.buy-link.primary:hover{opacity:.82}
.btn-shelf{font-family:var(--mono);font-size:10px;letter-spacing:.06em;padding:7px 14px;border:1px solid var(--border);color:var(--ink2);border-radius:1px;transition:all .12s;cursor:pointer;background:transparent}
.btn-shelf.saved{border-color:var(--ink);color:var(--ink)}
/* PREVIEW */
.preview-section{border-top:1px solid var(--border);padding-top:16px;margin-top:4px}
.preview-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.btn-preview{font-family:var(--mono);font-size:10px;letter-spacing:.06em;padding:7px 16px;border:1px solid var(--ink);color:var(--ink);border-radius:1px;transition:all .12s;cursor:pointer;background:transparent}
.btn-preview:hover{background:var(--ink);color:var(--paper)}
.btn-preview:disabled{opacity:.35;pointer-events:none}
.preview-unavail{font-family:var(--mono);font-size:10px;color:var(--ink3);padding:6px 0}
.preview-frame-wrap{position:relative;width:100%;aspect-ratio:4/3;border:1px solid var(--border);border-radius:1px;overflow:hidden;margin-top:10px;background:var(--bg2)}
.preview-frame-wrap iframe{width:100%;height:100%;border:none;display:block}
.preview-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:var(--ink3);letter-spacing:.08em}
/* LOAD MORE */
.load-more-wrap{text-align:center;padding:20px 0 40px}
.btn-load-more{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:10px 32px;border:1px solid var(--border);color:var(--ink2);border-radius:1px;transition:all .12s;background:var(--bg)}
.btn-load-more:hover{border-color:var(--ink);color:var(--ink)}
.btn-load-more:disabled{opacity:.3;pointer-events:none}
/* PAGE LOADER BAR */
.page-loader{position:fixed;top:0;left:0;right:0;height:2px;z-index:500;pointer-events:none;
  background:linear-gradient(90deg,transparent 0%,var(--ink2) 35%,var(--ink) 50%,var(--ink2) 65%,transparent 100%);
  background-size:45% 100%;background-repeat:no-repeat;background-position:-45% 0;
  opacity:0;transition:opacity .18s}
.page-loader.active{opacity:1;animation:loaderSlide 1.15s ease-in-out infinite}
@keyframes loaderSlide{from{background-position:-45% 0}to{background-position:145% 0}}
/* genre btn loading state */
.genre-btn.loading{position:relative;overflow:hidden}
.genre-btn.loading::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.18) 50%,transparent 100%);
  background-size:200% 100%;animation:genreShimmer .9s ease infinite}
@keyframes genreShimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
/* skeleton spine rise-up stagger */
@keyframes spineRise{from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1}}
.sk-sp{animation:spineRise .32s ease both, sh 1.8s 0.32s infinite}
/* SKELETON */
.skeleton-shelf{
  min-height:260px;background:
    repeating-linear-gradient(92deg,transparent 0,transparent 1px,rgba(0,0,0,.018) 1px,rgba(0,0,0,.018) 2px),
    linear-gradient(180deg,#FDFAF6 0%,#F8F4EE 40%,#F4EFE8 70%,#F0EBE2 100%);
  background:linear-gradient(180deg,#080604 0%,#100C08 35%,#181208 65%,#1E1610 100%);
  border-radius:3px 3px 0 0;padding:6px 20px 0;display:flex;align-items:flex-end;gap:0;margin-bottom:0;
}
.sk-sp{border-radius:2px;flex-shrink:0;background:rgba(255,255,255,.10);animation:sh 1.6s infinite}
@keyframes sh{0%,100%{opacity:.3}50%{opacity:.8}}
.skeleton-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px;margin-bottom:20px}
.sk-cover{aspect-ratio:2/3;border-radius:2px;background:linear-gradient(90deg,var(--bg2) 0%,rgba(26,24,20,.06) 50%,var(--bg2) 100%);background-size:200%;animation:sg 1.4s infinite}

<script>
const PAL=[
  {bg:"#1C2A38",tx:"#C8DDE8"},{bg:"#6B2424",tx:"#F0DADA"},
  {bg:"#16301E",tx:"#BEE0C8"},{bg:"#242450",tx:"#D4D4F0"},
  {bg:"#342210",tx:"#F0E0C4"},{bg:"#162438",tx:"#B8D4E4"},
  {bg:"#32141E",tx:"#ECC4D0"},{bg:"#22320E",tx:"#D0ECC0"},
  {bg:"#342010",tx:"#F0D8B8"},{bg:"#143030",tx:"#B8ECEC"},
  {bg:"#30243A",tx:"#E4C8F0"},{bg:"#1A2832",tx:"#B0CCDC"},

];
function sc(s){let h=0;for(let i=0;i<s.length;i++)h=((h<<5)-h)+s.charCodeAt(i);return PAL[Math.abs(h)%PAL.length]}
function sh(s){let h=0;for(let i=0;i<s.length;i++)h=((h<<5)-h)+s.charCodeAt(i);return Math.abs(h)}

// ── BOOK SIZE ENGINE ──────────────────────────────────
// Returns {w, h} in px based on page count + deterministic variation
function bookSize(b){
  const pg=b.pages||0;
  const hid=sh(b.id);
  const hid2=sh(b.id+"__sz");
  let w,h;
  if(pg>0){
    // Thickness from pages (roughly 1px per 8 pages + cover ~6px)
    const raw=6+Math.round(pg/8);
    w=Math.max(16,Math.min(66,raw));
    // Height tiers by format
    if(pg<80){h=148+hid%14;}
    else if(pg<180){h=158+hid%18;}
    else if(pg<320){h=172+hid%20;}
    else if(pg<520){h=186+hid%20;}
    else if(pg<800){h=198+hid%18;}
    else{h=210+hid%18;}
  }else{
    // No page data: distribute realistically
    // ~40% medium, ~25% small-medium, ~20% large, ~10% thin, ~5% thick
    const tier=hid%20;
    if(tier<2){w=16+hid2%6;h=148+hid2%14;}        // 10% thin/small
    else if(tier<7){w=22+hid2%10;h=160+hid2%18;}   // 25% small-medium
    else if(tier<15){w=32+hid2%12;h=174+hid2%22;}  // 40% medium
    else if(tier<18){w=44+hid2%12;h=190+hid2%20;}  // 15% large
    else{w=54+hid2%12;h=206+hid2%18;}              // 10% thick/tall
  }
  // Tiny random jitter ±1px for organic feel
  w+=hid2%3-1;
  h+=sh(b.id+"h")%5-2;
  return{w:Math.max(14,w),h:Math.max(140,h)};
}

let lang="en",subject="design",curView="browse",layout="shelf";
let allBooks=[],busy=false;
let shelf=JSON.parse(localStorage.getItem("kl4")||"[]");
let cur=null;
const PG=150;

// ── APIs ───────────────────────────────────────────────
async function olSubj(s,o){
  const r=await fetch("https://openlibrary.org/subjects/"+encodeURIComponent(s)+".json?limit="+PG+"&offset="+o);
  const d=await r.json();
  return(d.works||[]).map(w=>mapOLWork(w));
}
function mapOLWork(w){
  return{id:w.key,key:w.key,title:w.title||"Untitled",
    author:w.authors?.[0]?.name||"—",authorKey:w.authors?.[0]?.key||null,
    coverId:w.cover_id||w.covers?.[0]||null,coverUrl:null,
    year:w.first_publish_year||"",publisher:"",desc:"",isbn:"",infoLink:"",
    pages:w.number_of_pages_median||0,source:"ol"};
}
async function olSearch(q,o){
  const r=await fetch("https://openlibrary.org/search.json?q="+encodeURIComponent(q)+
    "&limit="+PG+"&offset="+o+
    "&fields=key,title,author_name,author_key,cover_i,first_publish_year,number_of_pages_median");
  const d=await r.json();
  return(d.docs||[]).map(w=>({id:w.key,key:w.key,title:w.title||"Untitled",
    author:w.author_name?.[0]||"—",authorKey:w.author_key?.[0]?"/authors/"+w.author_key[0]:null,
    coverId:w.cover_i||null,coverUrl:null,year:w.first_publish_year||"",
    publisher:"",desc:"",isbn:"",infoLink:"",
    pages:w.number_of_pages_median||0,source:"ol"}));
}
const JA_SUBJ={

  "経済":"economics","マーケティング":"marketing","自己啓発":"self-help",

};
function mapOLSearch(w){
  return{id:w.key,key:w.key,title:w.title||"Untitled",
    author:w.author_name?.[0]||"—",authorKey:w.author_key?.[0]?"/authors/"+w.author_key[0]:null,
    coverId:w.cover_i||null,coverUrl:null,year:w.first_publish_year||"",
    publisher:"",desc:"",isbn:"",infoLink:"",
    pages:w.number_of_pages_median||0,source:"ol"};
}

function thumb(b,sz){if(b.coverId)return"https://covers.openlibrary.org/b/id/"+b.coverId+"-"+(sz||"M")+".jpg";return null}

async function loadPreview(workKey){
  const btn=document.getElementById("previewBtn");
  const area=document.getElementById("previewArea");
  btn.disabled=true;btn.textContent="Loading...";
  try{
    // editions エンドポイントで ocaid (Internet Archive ID) を探す
    const r=await fetch("https://openlibrary.org"+workKey+"/editions.json?limit=20");
    const d=await r.json();
    const entry=(d.entries||[]).find(e=>e.ocaid);
    if(entry&&entry.ocaid){
      area.innerHTML=
        "<div class='preview-frame-wrap'>"+
          "<div class='preview-loading' id='previewLoadMsg'>Loading reader...</div>"+
          "<iframe src='https://archive.org/embed/"+encodeURIComponent(entry.ocaid)+
            "?ui_language=en' allowfullscreen"+
            " onload=\"document.getElementById('previewLoadMsg').style.display='none'\">"+
          "</iframe>"+

      btn.disabled=false;

    }else{
      area.innerHTML="<div class='preview-unavail'>Preview not available for this title.</div>";

// ── LOAD ──────────────────────────────────────────────
async function load(offset){
  if(offset===0){skeleton();allBooks=[];window.scrollTo({top:0,behavior:"smooth"});}
  busy=true;
  try{
    const q=document.getElementById("searchInput").value.trim();
    let works;
    if(q)works=lang==="ja"?await jaSearch(q,offset):await olSearch(q,offset);
    else works=lang==="ja"?await jaSubj(subject,offset):await olSubj(subject,offset);
    allBooks=[...allBooks,...works];
    if(offset===0){allBooks=applyOrder(allBooks);render(allBooks,document.getElementById("shelvesContainer"));}
    else append(works);
    const lm=document.getElementById("loadMoreWrap"),lb=document.getElementById("loadMoreBtn");
    if(lm)lm.style.display="block";
    if(lb){lb.textContent="Load more";lb.disabled=works.length<(lang==="ja"?8:20)}
    const bc=document.getElementById("bookCount");if(bc)bc.textContent=allBooks.length+" books";
    hideLoader();
  }catch(e){
    hideLoader();
    if(offset===0){
      document.getElementById("shelvesContainer").innerHTML="<div class='state-msg'><span class='big'>!</span>Failed to load.</div>";
    }
    const lb=document.getElementById("loadMoreBtn");
    if(lb){lb.textContent="Load more";lb.disabled=false;}
  }finally{
    busy=false;
  }
}

// ── SPINE HTML ────────────────────────────────────────
function spineHTML(b){
  const c=sc(b.title);
  const sz=bookSize(b);
  const t=b.coverUrl||thumb(b,"M");
  const fs=sz.w<24?7:sz.w<34?8:sz.w<46?9:10;
  const clamp=sz.w<26?4:sz.w<36?5:sz.w<48?6:7;
  // analog imperfections: tilt ±1.2deg, brightness 0.82–1.0, saturation 0.6–1.0, sink 0–4px
  const tilt=((sh(b.id+"tlt")%9)-4)*0.18;
  const sink=sh(b.id+"sk")%4;
  const op=(88+(sh(b.id+"op")%13)).toFixed(0); // opacity 88-100% instead of filter
  return"<div class='book-spine-wrap' draggable='true' data-id='"+x(b.id)+"' style='width:"+sz.w+"px;transform:rotate("+tilt+"deg) translateY("+sink+"px);opacity:0."+op+"'>"+
    "<div class='book-spine' style='width:"+sz.w+"px;height:"+sz.h+"px;background:"+c.bg+";color:"+c.tx+"'>"+
      (t?"<img class='spine-cover-img' src='"+t+"' loading='lazy' alt='' onerror='this.classList.add(\"no-img\")'>":"")+
      (t?"<div class='spine-text-overlay'></div>":"")+
      (!t?"<div class='spine-text' style='padding:8px "+(Math.max(3,Math.round(sz.w*0.1)))+"px'>"+
        "<span class='spine-author' style='font-size:6px;'>"+x(b.author)+"</span>"+
        "<span class='spine-title' style='font-size:"+fs+"px;-webkit-line-clamp:"+clamp+";'>"+x(b.title)+"</span>"+
        (b.year?"<span class='spine-year'>"+b.year+"</span>":"")+
      "</div>":"")+
      "<div class='spine-edge' style='width:"+(Math.max(3,Math.round(sz.w*0.08)))+"px'></div>"+
    "</div>"+
  "</div>";
}

// ── COVER HTML ───────────────────────────────────────
function coverHTML(b){
  const c=sc(b.title);const t=b.coverUrl||thumb(b,"M");
  return"<div class='cover-card' data-id='"+x(b.id)+"'>"+
    "<div class='cover-wrap' style='background:"+c.bg+";'>"+
      (t?"<img class='cover-img' src='"+t+"' loading='lazy' alt='"+x(b.title)+"' onerror='this.remove()'>":
         "<div class='cover-ph' style='color:"+c.tx+"'><span class='ph-title'>"+x(b.title)+"</span><span class='ph-author'>"+x(b.author)+"</span></div>")+
    "</div>"+
    "<div class='cover-meta'><div class='cover-title-sm'>"+x(b.title)+"</div><div class='cover-author-sm'>"+x(b.author)+"</div></div>"+
  "</div>";
}

// Pack rows — add book first, break after, so right edge is always filled
function packRows(books){
  const maxW=window.innerWidth>1280?1240:window.innerWidth-48;
  const rows=[];let row=[],rowW=0;
  for(const b of books){
    row.push(b);
    rowW+=bookSize(b).w;
    if(rowW>=maxW){rows.push(row);row=[];rowW=0;}
  }
  // last partial row: only show if it has books
  if(row.length)rows.push(row);
  return rows;
}

function stackHTML(books){
  const w=Math.min(220,Math.max(160,Math.max(...books.map(b=>bookSize(b).h))));
  let html="<div class='book-stack-wrap' style='width:"+w+"px;align-self:flex-end;flex-shrink:0;display:flex;flex-direction:column-reverse;border-radius:2px 2px 0 0;overflow:hidden;box-shadow:3px 0 10px rgba(0,0,0,.13),-2px 0 6px rgba(0,0,0,.07);'>";
  for(const b of books){
    const c=sc(b.title);const sz=bookSize(b);const bh=Math.max(16,sz.w);const t=thumb(b,"S");
    html+="<div class='book-stack-item' data-id='"+x(b.id)+"' style='width:100%;height:"+bh+"px;background:"+c.bg+";position:relative;overflow:hidden;cursor:pointer;box-shadow:inset 0 -1px 0 rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.1);'>";
    if(t)html+="<img src='"+t+"' loading='lazy' style='position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.65;' onerror='this.remove()'>";
    html+="<div style='position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.08) 0%,rgba(0,0,0,.12) 100%)'></div>";
    html+="</div>";
  }
  return html+"</div>";
}
function shelfHTML(books){
  const spines="<div class='shelf-board'><div class='shelf-light'></div>"+books.map(spineHTML).join("");
  return"<div class='shelf-unit'>"+spines+"</div><div class='shelf-surface'></div></div>";
}

function render(books,container){
  if(!books.length){container.innerHTML="<div class='state-msg'><span class='big'>&#x2205;</span>No books found.</div>";return}
  let h="";
  if(layout==="shelf"){
    const rows=packRows(books);
    rows.forEach(row=>{h+=shelfHTML(row);});
  }else{
    h="<div class='cover-grid'>"+books.map(coverHTML).join("")+"</div>";
  }
  container.innerHTML=h;bind(container);
  if(typeof updateSunlight==="function")updateSunlight();
}

function append(works){
  const c=document.getElementById("shelvesContainer");
  const lm=document.getElementById("loadMoreWrap");
  if(layout==="shelf"){
    const rows=packRows(works);
    rows.forEach(row=>{
      const div=document.createElement("div");
      div.innerHTML=shelfHTML(row);
      const unit=div.firstElementChild;
      c.insertBefore(unit,lm);bind(unit);
    });
  }else{
    let g=c.querySelector(".cover-grid");
    if(!g){g=document.createElement("div");g.className="cover-grid";c.insertBefore(g,lm);}
    works.forEach(b=>{g.innerHTML+=coverHTML(b);});bind(g);
  }
}
let dragSrcId=null,currentDropLine=null;

function bind(el){
  el.querySelectorAll(".book-spine-wrap,.cover-card,.book-stack-item").forEach(sp=>{
    sp.addEventListener("click",()=>{
      if(dragSrcId)return; // suppress click after drag
      const b=allBooks.find(b=>b.id===sp.dataset.id)||shelf.find(b=>b.id===sp.dataset.id);
      if(b)openDetail(b,sp);
    });

    if(!sp.classList.contains("book-spine-wrap"))return;

    sp.addEventListener("dragstart",e=>{
      dragSrcId=sp.dataset.id;
      setTimeout(()=>sp.classList.add("dragging"),0);
      e.dataTransfer.effectAllowed="move";
      e.dataTransfer.setData("text/plain",dragSrcId);
    });

    sp.addEventListener("dragend",()=>{
      document.querySelectorAll(".book-spine-wrap.dragging").forEach(el=>el.classList.remove("dragging"));
      clearDropLine();
      setTimeout(()=>{dragSrcId=null;},80);
    });

    sp.addEventListener("dragenter",e=>{
      e.preventDefault();
      if(!dragSrcId||dragSrcId===sp.dataset.id)return;
      clearDropLine();
      const line=document.createElement("div");
      line.className="drop-line active";
      sp.parentNode.insertBefore(line,sp);
      currentDropLine=line;
    });

    sp.addEventListener("dragover",e=>{
      e.preventDefault();
      e.dataTransfer.dropEffect="move";
    });

    sp.addEventListener("drop",e=>{
      e.preventDefault();
      e.stopPropagation();
      if(!dragSrcId||dragSrcId===sp.dataset.id)return;
      reorderBooks(dragSrcId,sp.dataset.id);
    });
  });
}

function clearDropLine(){
  if(currentDropLine){currentDropLine.remove();currentDropLine=null;}
}

function reorderBooks(srcId,targetId){
  const si=allBooks.findIndex(b=>b.id===srcId);
  const ti=allBooks.findIndex(b=>b.id===targetId);
  if(si===-1||ti===-1)return;
  const [book]=allBooks.splice(si,1);
  allBooks.splice(ti>si?ti-1:ti,0,book);
  // persist order
  try{localStorage.setItem("kl_order_"+lang+"_"+subject,JSON.stringify(allBooks.map(b=>b.id)));}catch{}
  render(allBooks,document.getElementById("shelvesContainer"));
}

// restore saved order when books load
function applyOrder(books){
  try{
    const saved=JSON.parse(localStorage.getItem("kl_order_"+lang+"_"+subject)||"[]");
    if(!saved.length)return books;
    const map=Object.fromEntries(books.map(b=>[b.id,b]));
    const ordered=saved.map(id=>map[id]).filter(Boolean);
    const rest=books.filter(b=>!saved.includes(b.id));
    return[...ordered,...rest];
  }catch{return books;}
}
function renderMyShelf(){
  const c=document.getElementById("myshelfContainer");
  if(!shelf.length){c.innerHTML="<div class='myshelf-empty'>Your shelf is empty.<br>Browse and add books.</div>";return}
  render(shelf,c);
}

  document.getElementById("pageLoader")?.classList.add("active");
}
function hideLoader(){
  document.getElementById("pageLoader")?.classList.remove("active");

function skeleton(){
  showLoader();
  const c=document.getElementById("shelvesContainer");
  if(layout==="shelf"){
    const widths=[22,38,28,52,20,34,44,26,58,32,42,18,36,48,24,40,30,46,20,54,26,36,42,28];
    const heights=[165,195,175,220,158,188,202,172,218,182,196,155,186,208,168,192,178,204,160,215,170,190,200,162];
    const maxW=window.innerWidth>1280?1240:window.innerWidth-48;
    let h="",idx=0;
    for(let r=0;r<3;r++){
      h+="<div class='shelf-unit'><div class='shelf-board'>";
      let rowW=0;
      while(rowW<maxW){
        const wi=widths[idx%widths.length];
        const hi=heights[idx%heights.length];
        const delay=(idx*18)+"ms";
        h+="<div class='sk-sp' style='width:"+wi+"px;height:"+hi+"px;animation-delay:"+delay+","+delay+"'></div>";
        rowW+=wi;idx++;
      }
      h+="</div><div class='shelf-surface'></div></div>";
    }
    c.innerHTML=h;
  }else{
    let h="<div class='skeleton-grid'>";
    for(let i=0;i<24;i++)h+="<div class='sk-cover' style='animation-delay:"+(i*35)+"ms'></div>";
    h+="</div>";
    c.innerHTML=h;
  }
  document.getElementById("bookCount").textContent="";
  document.getElementById("loadMoreWrap").style.display="none";
}

async function openDetail(b,sp){
  cur=b;

  const bc=thumb(b,"L"),c=sc(b.title);

      (bc?"<img class='detail-cover-img' src='"+bc+"' alt='"+x(b.title)+"' onload=\"this.classList.add('loaded');document.getElementById('detailBook3d')?.classList.add('img-loaded')\" onerror=\"this.remove();document.getElementById('detailBook3d')?.classList.add('img-loaded')\">":
          "<div class='detail-cover-ph' style='background:"+c.bg+";color:"+c.tx+"'><span class='ph-title'>"+x(b.title)+"</span><span class='ph-author'>"+x(b.author)+"</span></div>")+
    "</div>";

  document.getElementById("detailAuthor").textContent=b.author;
  document.getElementById("detailPub").textContent=[b.publisher,b.year,pagesLabel].filter(Boolean).join(" · ");
  document.getElementById("detailTags").innerHTML=b.year?"<span class='detail-tag'>"+b.year+"</span>":"";
  const descEl=document.getElementById("detailDesc");
  descEl.textContent="";descEl.classList.add("dim");
  document.getElementById("authorSection").classList.remove("visible");
  document.getElementById("previewArea").innerHTML="";
  descCache={en:null,ja:null};
  document.querySelectorAll(".desc-lang-btn").forEach(b=>b.classList.toggle("active",b.dataset.dlang==="en"));
  resetPreviewBtn();
  setBuy(b);updateShelfBtn();
  document.getElementById("detailOverlay").classList.add("open");
  document.body.style.overflow="hidden";
  const det=await olDetail(b.key);
  if(det){
    const d=typeof det.description==="string"?det.description:det.description?.value||"";
    const subs=(det.subjects||[]).slice(0,5);
    let m=b.year?"<span class='detail-tag'>"+b.year+"</span>":"";
    if(b.pages)m+="<span class='detail-tag'>"+b.pages+" pages</span>";
    subs.forEach(s=>{m+="<span class='detail-tag'>"+x(s)+"</span>"});
    document.getElementById("detailTags").innerHTML=m;
    requestAnimationFrame(()=>{
      descEl.textContent=d||"No description available.";
      descEl.classList.remove("dim");
    });
  }else{
    requestAnimationFrame(()=>{descEl.textContent="No description available.";descEl.classList.remove("dim");});
  }
  if(b.authorKey){const au=await olAuthor(b.authorKey);if(au)showAuthor(au.name||b.author,typeof au.bio==="string"?au.bio:au.bio?.value||"")}
}

let descCache={en:null,ja:null};
async function translateDesc(text){
  if(!text||text.length<10)return null;
  try{
    const r=await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(text.slice(0,480))+"&langpair=en|ja");
    const d=await r.json();
    return(d.responseStatus===200&&d.responseData?.translatedText)?d.responseData.translatedText:null;
  }catch{return null;}
}

    }
  });
});

document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDetail()});

// Infinite scroll
const sentinel=document.getElementById("sentinel");
const scrollObs=new IntersectionObserver(entries=>{
  if(entries[0].isIntersecting&&!busy&&allBooks.length>0){
    const lb=document.getElementById("loadMoreBtn");
    if(lb&&!lb.disabled){
      lb.disabled=true;lb.textContent="Loading...";
      load(allBooks.length).then(()=>{lb.textContent="Load more";lb.disabled=false;busy=false;});
    }
  }
},{rootMargin:"300px"});
scrollObs.observe(sentinel);

load(0);
initLibraryName();
checkSharedShelf();

// ── SHELF SHARE ──────────────────────────────────────
function showToast(msg){
  const t=document.getElementById("shareToast");
  t.textContent=msg;t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2200);
}

// ── LIBRARY NAME ─────────────────────────────────────
function initLibraryName(){
  const name=localStorage.getItem("kl_name")||"My Library";
  document.getElementById("libraryNameDisplay").textContent=name;
}
function editLibraryName(){
  const el=document.getElementById("libraryNameDisplay");
  const current=el.textContent;
  const inp=document.createElement("input");
  inp.className="name-edit-input";inp.value=current;
  el.replaceWith(inp);inp.focus();inp.select();
  const commit=()=>{
    const v=inp.value.trim()||"My Library";
    localStorage.setItem("kl_name",v);
    const span=document.createElement("span");
    span.id="libraryNameDisplay";span.textContent=v;
    inp.replaceWith(span);
  };
  inp.addEventListener("blur",commit);
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")inp.blur();if(e.key==="Escape"){inp.value=current;inp.blur();}});
}

// ── SHARE ─────────────────────────────────────────────
function shareShelf(){
  if(!shelf.length){showToast("Shelf is empty");return;}
  const name=localStorage.getItem("kl_name")||"";
  const books=shelf.map(b=>({i:b.id,t:b.title,a:b.author,c:b.coverId||null,y:b.year||null}));
  const payload={n:name,b:books};
  const encoded=btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
  const url=location.origin+location.pathname+"#shelf="+encoded;
  navigator.clipboard.writeText(url).then(()=>showToast("Copied! Share this URL ↑")).catch(()=>{prompt("Copy this URL:",url);});
}

let _sharedBooks=null;
function switchToMyShelfTab(){
  document.querySelectorAll(".nav-tab").forEach(t=>t.classList.remove("active"));
  document.querySelector('[data-view="myshelf"]').classList.add("active");
  curView="myshelf";
  document.getElementById("browseView").style.display="none";
  document.getElementById("myshelfView").style.display="";
  document.getElementById("genreRail").style.display="none";
}
function checkSharedShelf(){
  const hash=location.hash;
  if(!hash.startsWith("#shelf="))return;
  const encoded=hash.slice(7);
  try{
    const parsed=JSON.parse(decodeURIComponent(escape(atob(encoded))));
    const raw=Array.isArray(parsed)?parsed:parsed.b||[];
    const ownerName=Array.isArray(parsed)?"":parsed.n||"";
    _sharedBooks=raw.map(d=>({
      id:d.i,key:d.i,title:d.t||"Untitled",author:d.a||"—",authorKey:null,
      coverId:d.c||null,coverUrl:null,year:d.y||"",
      publisher:"",desc:"",isbn:"",infoLink:"",pages:0,source:"ol"
    }));
    switchToMyShelfTab();
    document.getElementById("sharedOwner").textContent=ownerName||"Shared";
    document.getElementById("sharedCount").textContent=_sharedBooks.length;
    document.getElementById("sharedBanner").style.display="flex";
    render(_sharedBooks,document.getElementById("myshelfContainer"));
  }catch{}
}
function mergeSharedShelf(){
  if(!_sharedBooks)return;
  _sharedBooks.forEach(b=>{if(!shelf.find(s=>s.id===b.id))shelf.push(b);});
  localStorage.setItem("kl4",JSON.stringify(shelf));
  _sharedBooks=null;
  history.replaceState(null,null,location.pathname);
  document.getElementById("sharedBanner").style.display="none";
  showToast("Added to your shelf!");
  renderMyShelf();
}

// ── MY BOOK ──────────────────────────────────────────
let _mbCoverDataUrl=null;
function openMyBookModal(){
  _mbCoverDataUrl=null;
  document.getElementById("mb_title").value="";
  document.getElementById("mb_author").value="";
  document.getElementById("mb_year").value="";
  document.getElementById("mb_cover").value="";
  document.getElementById("mb_cover_preview").style.display="none";
  document.getElementById("mybookOverlay").classList.add("open");
  document.getElementById("mb_title").focus();
}
function closeMyBookModal(){
  document.getElementById("mybookOverlay").classList.remove("open");
}
function previewCover(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    _mbCoverDataUrl=e.target.result;
    const img=document.getElementById("mb_cover_preview");
    img.src=_mbCoverDataUrl;img.style.display="block";
  };
  reader.readAsDataURL(file);
}
function saveMyBook(){
  const title=document.getElementById("mb_title").value.trim();
  if(!title){document.getElementById("mb_title").focus();return;}
  const book={
    id:"custom_"+Date.now(),key:null,
    title,
    author:document.getElementById("mb_author").value.trim()||"—",
    year:document.getElementById("mb_year").value.trim()||"",
    coverId:null,coverUrl:_mbCoverDataUrl||null,
    publisher:"",desc:"",isbn:"",infoLink:"",pages:0,source:"custom"
  };
  shelf.push(book);
  localStorage.setItem("kl4",JSON.stringify(shelf));
  closeMyBookModal();
  renderMyShelf();
  showToast("Added to shelf!");
}
document.getElementById("mybookOverlay").addEventListener("click",e=>{
  if(e.target.id==="mybookOverlay")closeMyBookModal();
});

// ── SEARCH ────────────────────────────────────────────
const searchInput=document.getElementById("searchInput");
async function doSearch(){

  if(!q)return;
  document.querySelectorAll(".genre-btn").forEach(b=>b.classList.remove("active"));
  document.getElementById("sectionLabel").textContent='"'+q+'"';
  await load(0);
}

// ── LIBRARY BGM ───────────────────────────────────────
const bgm = {
  ctx: null, master: null, nodes: [], playing: false,
  init() {
    if (this.ctx) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
  },
  // Convolution reverb: procedurally generated impulse response
  makeReverb() {
    const ctx = this.ctx;
    const len = ctx.sampleRate * 3.5;
    const buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < len; i++)
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 1.6);
    }
    const conv = ctx.createConvolver();
    conv.buffer = buf;
    return conv;
  },
  async start() {
    this.init();
    if (this.playing) return;
    this.playing = true;
    // Chrome suspends AudioContext until user gesture — resume explicitly
    if (this.ctx.state === 'suspended') await this.ctx.resume();
    const ctx = this.ctx, now = ctx.currentTime;
    // master — slow fade-in
    const master = ctx.createGain();
    master.gain.setValueAtTime(0, now);
    master.gain.linearRampToValueAtTime(0.70, now + 2.5);
    master.connect(ctx.destination);
    this.master = master;
    // reverb bus
    const reverb = this.makeReverb();
    const rvGain = ctx.createGain(); rvGain.gain.value = 0.55;
    reverb.connect(rvGain); rvGain.connect(master);
    // slow breathing LFO (0.07 Hz ≈ 14s cycle)
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.07;
    const lfoG = ctx.createGain(); lfoG.gain.value = 0.025;
    lfo.connect(lfoG); lfoG.connect(master.gain); lfo.start();
    // drone chord — A minor: A1 E2 A2 C3 E3 (library / reading-room atmosphere)
    [[55,.07],[82.4,.05],[110,.06],[130.8,.035],[164.8,.025]].forEach(([f, amp], i) => {
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = f;
      osc.detune.value = (i % 2 === 0 ? 1 : -1) * 1.5; // micro-detune for warmth
      const g = ctx.createGain(); g.gain.value = amp;
      osc.connect(g); g.connect(master); g.connect(reverb);
      osc.start(); this.nodes.push(osc, g);
    });
    // very soft room-noise (low-pass filtered)
    const nBuf = ctx.createBuffer(1, ctx.sampleRate * 3, ctx.sampleRate);
    const nd = nBuf.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    const noise = ctx.createBufferSource(); noise.buffer = nBuf; noise.loop = true;
    const nFilt = ctx.createBiquadFilter(); nFilt.type = 'lowpass'; nFilt.frequency.value = 180;
    const nGain = ctx.createGain(); nGain.gain.value = 0.008;
    noise.connect(nFilt); nFilt.connect(nGain); nGain.connect(master);
    noise.start();
    this.nodes.push(master, reverb, rvGain, lfo, lfoG, noise, nFilt, nGain);
  },
  stop() {
    if (!this.playing || !this.ctx) return;
    this.playing = false;
    const now = this.ctx.currentTime;
    this.master.gain.linearRampToValueAtTime(0, now + 2.5);
    setTimeout(() => {
      this.nodes.forEach(n => { try { if (n.stop) n.stop(); n.disconnect(); } catch {} });
      this.nodes = []; this.master = null;
    }, 3000);
  },
  toggle() {
    this.playing ? this.stop() : this.start();
    return this.playing;
  }
};
document.getElementById('bgmBtn').addEventListener('click', () => {
  const on = bgm.toggle();
  const btn = document.getElementById('bgmBtn');
  btn.classList.toggle('on', on);
  btn.textContent = on ? '♪ on' : '♪';
});

// ── CLOCK ─────────────────────────────────────────────
function updateClock(){
  const n=new Date();
  const pad=v=>String(v).padStart(2,'0');
  const el=document.getElementById('liveClock');
  if(el)el.textContent=pad(n.getHours())+':'+pad(n.getMinutes())+':'+pad(n.getSeconds());
}
setInterval(updateClock,1000);updateClock();

// ── WINDOW LIGHT ──────────────────────────────────────
function getSunlight(){
  const n=new Date();
  const h=n.getHours()+n.getMinutes()/60;
  if(h<5.5||h>20.5)return null;
  let r,g,b,op,stop;
  if(h<7){r=255;g=170;b=80;op=0.09;stop=35;}       // dawn
  else if(h<9){r=255;g=210;b=130;op=0.17;stop=48;}  // morning
  else if(h<11){r=255;g=230;b=170;op=0.12;stop=55;} // late morning
  else if(h<14){r=255;g=245;b=210;op=0.06;stop=60;} // midday — barely any
  else if(h<16){r=255;g=215;b=120;op=0.11;stop=50;} // afternoon
  else if(h<17.5){r=255;g=175;b=65;op=0.20;stop=44;} // golden hour
  else if(h<19){r=245;g=130;b=45;op=0.24;stop=38;}  // sunset
  else{r=200;g=90;b=50;op=0.09;stop=30;}            // dusk
  return`linear-gradient(to left,rgba(${r},${g},${b},${op}) 0%,rgba(${r},${g},${b},${op*0.35}) ${stop}%,transparent 100%)`;
}
function updateSunlight(){
  const grad=getSunlight();
  document.querySelectorAll('.shelf-light').forEach(el=>{
    el.style.background=grad||'none';
  });
}
setInterval(updateSunlight,60000);updateSunlight();
