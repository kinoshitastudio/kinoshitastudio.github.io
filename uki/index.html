<!-- 2026-10-24 木下「別枠でこういった昔のイラストを作れる道具は作れない？京都などのインバウンド向けにつかいたい」→「浮世絵は進めて」
     浮 UKI（旧名 写 UTSUSHI・2026-10-24 改名＝カメラの道具「写 UTSU」と字がかぶったため）＝著作権の切れた浮世絵を【線画に起こし】、区画を【柄で塗り】、【枠】と【短冊】を置いて1色（＋差し色）で刷る。
     人物はゼロから描かない＝元の版の線を借りる。持ち物・柄・題字を替えて店ごとの1枚にする。
     線を拾う＝「絵全体の白（顔）より暗い」＋「すぐ近くより暗い（細い線）」の2本立て。地が暗い写楽でも細い線が取れる。
     段ごとに控える：線（重い）→塗り→合成（軽い）。つまみはその段から先だけ描き直す。 -->

<div id="panel">

  <p class="lead">浮世絵を線画に起こし、区画を柄で塗り、枠と短冊を置いて1枚にする。人物は描かず、元の版の線を借りる。</p>

  <div class="grp"><div class="t">元の絵</div>

    <label>大きさ<input type="range" id="tzs" min="20" max="120" value="58"><span class="v"></span></label>

  <input type="file" id="jfile" accept=".json,application/json" hidden>
  <p class="lead" style="margin-top:12px">塗る＝絵の区画を押すと柄で埋まる（線が切れていると外へ漏れるので、「描く」で閉じる）。消す＝署名や要らない線を消す。</p>

<div id="stage"><canvas id="cv"></canvas><div id="hint">絵の区画を押すと柄で塗る</div></div>
<script src="samples.js"></script>
<script>
const $=id=>document.getElementById(id);
const OW=1200, OH=1500; const cv=$('cv'); cv.width=OW; cv.height=OH; const ctx=cv.getContext('2d');
const v=id=>+$(id).value;
const mk=(w=OW,h=OH)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
// 🔴iPhone の Safari は canvas の合計メモリに上限がある。描き直すたびに新しく作ると上限を超えて黙って描けなくなる＝名前ごとに1枚を使い回す
const POOL={}; function pc(name,w=OW,h=OH){let c=POOL[name]; if(!c){c=POOL[name]=document.createElement('canvas');c.getContext('2d',{willReadFrequently:true})} if(c.width!==w||c.height!==h){c.width=w;c.height=h}
  const g=c.getContext('2d'); g.setTransform(1,0,0,1,0,0); g.globalCompositeOperation='source-over'; g.globalAlpha=1; g.clearRect(0,0,w,h); return c}
const LINE=['ta','tl','lr','thick','smooth','speck','gapc','ctol'], LAY=['fs','fx','fy','frs','fry','frw','tzs','tzx','tzy','psize','brush'];

// ── 状態（設定JSONにそのまま入る） ─────────────────────────
let src=null;            // {id, img(canvas), w, h, dataURL(読み込んだ画像だけ)}
let acts=[];             // 手直しの記録：{t:'fill',x,y,pat,size,col} / {t:'erase'|'draw',r,pts:[[x,y]..]}（座標は元の絵の 0..1）
let mode='fill', pat='dots';

// ── 柄（1色の型。tile に描いて createPattern） ─────────────────
const PATS={
  dots:['水玉',(g,s)=>{g.beginPath();g.arc(s*.25,s*.25,s*.17,0,7);g.arc(s*.75,s*.75,s*.17,0,7);g.fill()}],
  asanoha:['麻の葉',(g,s)=>{const h=s*Math.sqrt(3)/2; g.lineWidth=Math.max(1,s*.035);
    const tri=(x,y,u)=>{const p=[[x,y],[x+s/2,y+(u?h:-h)],[x-s/2,y+(u?h:-h)]];const c=[x,y+(u?h:-h)*2/3];
      g.beginPath();g.moveTo(...p[0]);g.lineTo(...p[1]);g.lineTo(...p[2]);g.closePath();p.forEach(q=>{g.moveTo(...c);g.lineTo(...q)});
      [[0,1],[1,2],[2,0]].forEach(([a,b])=>{g.moveTo(...c);g.lineTo((p[a][0]+p[b][0])/2,(p[a][1]+p[b][1])/2)});g.stroke()};
    for(let j=-1;j<3;j++)for(let i=-1;i<3;i++){const x=i*s+(j&1?s/2:0),y=j*h;tri(x,y,true);tri(x+s/2,y+h,false)}},true],
  seigaiha:['青海波',(g,s)=>{g.lineWidth=Math.max(1,s*.04);const r=s/2;
    for(let j=-1;j<5;j++)for(let i=-1;i<3;i++){const x=i*s+(j&1?r:0),y=j*r/2;
      for(let k=0;k<4;k++){g.beginPath();g.arc(x,y,r*(1-k*.24),Math.PI,0);g.fillStyle=k%2?'#fff':'#000';}
      g.save();g.globalCompositeOperation='destination-out';g.beginPath();g.arc(x,y,r,Math.PI,0);g.fill();g.restore();
      for(let k=0;k<4;k++){g.beginPath();g.arc(x,y,r*(1-k*.24),Math.PI,0);g.stroke()}}},false,'tall'],
  ichimatsu:['市松',(g,s)=>{g.fillRect(0,0,s/2,s/2);g.fillRect(s/2,s/2,s/2,s/2)}],
  shippo:['七宝',(g,s)=>{g.lineWidth=Math.max(1,s*.04);for(const [x,y] of [[0,0],[s,0],[0,s],[s,s],[s/2,s/2]]){g.beginPath();g.arc(x,y,s/2,0,7);g.stroke()}}],
  shima:['縞',(g,s)=>{g.fillRect(0,0,s*.32,s)}],
  koshi:['格子',(g,s)=>{g.fillRect(0,0,s*.14,s);g.fillRect(0,0,s,s*.14)}],
  beta:['べた',(g,s)=>{g.fillRect(0,0,s,s)}],
};
// 青海波は描き順を簡単にするため、下から重ねる専用の描き方にする
PATS.seigaiha[1]=(g,s)=>{const r=s/2, lw=Math.max(1,s*.04); g.lineWidth=lw;
  for(let j=-2;j<6;j++)for(let i=-1;i<3;i++){const x=i*s+(j&1?r:0),y=j*r/2;
    g.save();g.globalCompositeOperation='destination-out';g.beginPath();g.arc(x,y,r-lw/2,Math.PI,0);g.fill();g.restore();
    for(let k=0;k<4;k++){g.beginPath();g.arc(x,y,r*(1-k*.24)-lw/2,Math.PI,0);g.stroke()}}};
function tile(name,s,color){const T=PATS[name]; const th=T[3]==='tall'?s/2:(T[2]?s*Math.sqrt(3):s);
  const c=mk(Math.max(2,Math.round(s)),Math.max(2,Math.round(th))); const g=c.getContext('2d'); g.fillStyle=color; g.strokeStyle=color; T[1](g,s); return c}

// ── 元の絵を読む ─────────────────────────────────────────
let G=null, RGB=null, SW=0, SH=0;   // 濃さ（0..255）
function setSource(img,id,dataURL){setTimeout(()=>markThumb(),0);
  const sc=Math.min(1,1100/img.height); SW=Math.round(img.width*sc); SH=Math.round(img.height*sc);
  const c=mk(SW,SH); const g=c.getContext('2d'); g.drawImage(img,0,0,SW,SH);
  const d=g.getImageData(0,0,SW,SH).data; G=new Float32Array(SW*SH);
  for(let i=0;i<G.length;i++)G[i]=d[i*4]*.299+d[i*4+1]*.587+d[i*4+2]*.114;
  // 塗る区画を決めるための色（紙の繊維を均すため少しぼかす）
  const ch=k=>{const a=new Float32Array(SW*SH);for(let i=0;i<a.length;i++)a[i]=d[i*4+k];return blurF(a,SW,SH,2)}; RGB=[ch(0),ch(1),ch(2)];
  src={id,img:c,dataURL}; dirty.line=true;
}
function loadSample(i,keepActs){const S=UKI_SAMPLES[i]; const im=new Image(); im.onload=()=>{setSource(im,S.id,null);
  if(!keepActs){$('ta').value=Math.round(S.ta*100);$('tl').value=Math.round(S.tl*100);$('lr').value=S.lr;
    acts=S.erase.map(([x,y,w,h])=>({t:'erase',rect:[x,y,w,h]}))}
  $('credit').textContent='元の絵：'+S.credit; schedule()}; im.src=S.src}

// ── 線を起こす（重い段・つまみか手直しが変わった時だけ） ──────────
let PRE=null; let LM=null, LMver=0;  // 線の形（0/1・元の絵の大きさ）
function blurF(a,w,h,r){if(r<=0)return a; if(r<1){const b=blurF(a,w,h,1),o=new Float32Array(a.length);for(let i=0;i<o.length;i++)o[i]=a[i]*(1-r)+b[i]*r;return o} // 1未満は混ぜる＝細い線を一段で消さない
  const t=new Float32Array(a.length), o=new Float32Array(a.length), k=Math.round(r);
  for(let y=0;y<h;y++){let s=0,n=0;for(let x=-k;x<w;x++){const ad=x+k;if(ad<w){s+=a[y*w+ad];n++}const rm=x-k-1;if(rm>=0){s-=a[y*w+rm];n--}if(x>=0)t[y*w+x]=s/n}}
  for(let x=0;x<w;x++){let s=0,n=0;for(let y=-k;y<h;y++){const ad=y+k;if(ad<h){s+=t[ad*w+x];n++}const rm=y-k-1;if(rm>=0){s-=t[rm*w+x];n--}if(y>=0)o[y*w+x]=s/n}}
  return o}
function maxF(a,w,h,k){const t=new Float32Array(a.length),o=new Float32Array(a.length);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){let m=0;for(let i=Math.max(0,x-k);i<=Math.min(w-1,x+k);i++)if(a[y*w+i]>m)m=a[y*w+i];t[y*w+x]=m}
  for(let x=0;x<w;x++)for(let y=0;y<h;y++){let m=0;for(let i=Math.max(0,y-k);i<=Math.min(h-1,y+k);i++)if(t[i*w+x]>m)m=t[i*w+x];o[y*w+x]=m}
  return o}
// 距離（3-4 の面取り距離・画素の 3 倍で持つ）
function dist(M,w,h,inside){const D=new Float32Array(w*h),INF=1e9;for(let i=0;i<D.length;i++)D[i]=(M[i]===inside)?INF:0;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;if(!D[i])continue;let m=D[i];
    if(x>0)m=Math.min(m,D[i-1]+3);if(y>0){m=Math.min(m,D[i-w]+3);if(x>0)m=Math.min(m,D[i-w-1]+4);if(x<w-1)m=Math.min(m,D[i-w+1]+4)}D[i]=m}
  for(let y=h-1;y>=0;y--)for(let x=w-1;x>=0;x--){const i=y*w+x;if(!D[i])continue;let m=D[i];
    if(x<w-1)m=Math.min(m,D[i+1]+3);if(y<h-1){m=Math.min(m,D[i+w]+3);if(x<w-1)m=Math.min(m,D[i+w+1]+4);if(x>0)m=Math.min(m,D[i+w-1]+4)}D[i]=m}
  return D}
function strokeMask(type){const c=pc('stroke',SW,SH),g=c.getContext('2d');g.fillStyle=g.strokeStyle='#000';g.lineCap=g.lineJoin='round';let any=false;
  for(const a of acts){if(a.t!==type)continue;any=true;
    if(a.rect){const [x,y,w,h]=a.rect;g.fillRect(x*SW,y*SH,w*SW,h*SH);continue}
    g.lineWidth=a.r*SH;g.beginPath();a.pts.forEach(([x,y],i)=>i?g.lineTo(x*SW,y*SH):g.moveTo(x*SW,y*SH));if(a.pts.length===1)g.lineTo(a.pts[0][0]*SW+.01,a.pts[0][1]*SH);g.stroke()}
  if(!any)return null; const d=g.getImageData(0,0,SW,SH).data,o=new Uint8Array(SW*SH);for(let i=0;i<o.length;i++)o[i]=d[i*4+3]>100?1:0;return o}
function buildLines(){

// ── 塗る（区画を押した所から、線で閉じた範囲を埋める） ──────────────
let FILLS=[]; // [{mask:Uint8Array, a}]
// 塗るときだけ線を太らせて切れ目を塞ぐ（線そのものは変えない）
let LMC=null, LMCkey='';
function closedLines(){const g=v('gapc'), key=g+'|'+LMver; if(LMC&&LMCkey===key)return LMC; LMCkey=key;
  if(!g){LMC=LM;return LMC} const D=dist(LM,SW,SH,0); LMC=new Uint8Array(LM.length); for(let i=0;i<LM.length;i++)LMC[i]=D[i]<=g*3?1:0; return LMC}
function region(x,y){const sx=Math.round(x*SW),sy=Math.round(y*SH); if(sx<0||sy<0||sx>=SW||sy>=SH)return null;
  if(LM[sy*SW+sx])return region0(x,y,LM); // 線の上を押した＝その線を塗る（太らせない）
  const R0=region0(x,y,closedLines()); const g=v('gapc'); if(!R0||!g)return R0;
  // 太らせた分だけ広げ戻す（元の線は越えない）
  const D=dist(R0,SW,SH,0), R=new Uint8Array(R0.length); for(let i=0;i<R.length;i++)R[i]=(R0[i]||(D[i]<=g*3+3&&!LM[i]))?1:0; return R}
function region0(x,y,LM){const w=SW,h=SH; let sx=Math.round(x*w),sy=Math.round(y*h);if(sx<0||sy<0||sx>=w||sy>=h)return null;
  const R=new Uint8Array(w*h); if(LM[sy*w+sx]){ // 線の上を押した＝線そのものを塗る
    const st=[sy*w+sx];R[st[0]]=1;while(st.length){const p=st.pop(),px=p%w,py=(p/w)|0;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const X=px+dx,Y=py+dy;if(X<0||Y<0||X>=w||Y>=h)continue;const q=Y*w+X;if(LM[q]&&!R[q]){R[q]=1;st.push(q)}}}
    return R}
  // 走査線で塗る（線は越えない・元の絵で色が変わる所も越えない＝浮世絵は色ごとに版が分かれている）
  const tol=v('ctol'), T2=(tol*1.2)**2, [Rr,Rg,Rb]=RGB, s0=sy*w+sx, c0=[Rr[s0],Rg[s0],Rb[s0]];
  const ok2=q=>tol>=100||(Rr[q]-c0[0])**2+(Rg[q]-c0[1])**2+(Rb[q]-c0[2])**2<=T2; const ok=q=>!LM[q]&&ok2(q);
  if(!ok(s0)){ // 押した所が線の近く（隙間を閉じる帯）なら、近くの塗れる所から始める
    let best=-1; for(let r=1;r<=10&&best<0;r++)for(let dy=-r;dy<=r&&best<0;dy++)for(let dx=-r;dx<=r;dx++){const X=sx+dx,Y=sy+dy;if(X<0||Y<0||X>=w||Y>=h)continue;const q=Y*w+X;if(!LM[q]&&ok2(q)){best=q;break}}

    let l=px;while(l>0&&ok(py*w+l-1)&&!R[py*w+l-1])l--; let r=px;while(r<w-1&&ok(py*w+r+1)&&!R[py*w+r+1])r++;
    for(let X=l;X<=r;X++){R[py*w+X]=1;
      if(py>0){const q=(py-1)*w+X;if(!R[q]&&ok(q))st.push([X,py-1])} if(py<h-1){const q=(py+1)*w+X;if(!R[q]&&ok(q))st.push([X,py+1])}}}

function buildFills(){FILLS=[];for(const a of acts){if(a.t!=='fill')continue;const R=region(a.x,a.y);if(R)FILLS.push({mask:R,a})}}

// ── 合成（軽い段） ─────────────────────────────────────────
let lastLayers=null;
function place(){const s=v('fs')/100*OW*0.9/SW; const w=SW*s,h=SH*s; return {s,x:(OW-w)/2+v('fx')/100*OW, y:(OH-h)/2+v('fy')/100*OH, w,h}}
function maskCanvas(M){const c=pc('mask',SW,SH),g=c.getContext('2d'),id=g.createImageData(SW,SH);for(let i=0;i<M.length;i++)if(M[i])id.data[i*4+3]=255;g.putImageData(id,0,0);return c}
// 小さい型を引き伸ばすとぼやけるので、出す大きさで描いてから縁を 128 で切る（ガタつかない線）
function crisp(c){const g=c.getContext('2d'),id=g.getImageData(0,0,OW,OH),d=id.data;for(let i=3;i<d.length;i+=4)d[i]=d[i]>127?255:0;g.putImageData(id,0,0);return c}
function framePath(g){const f=$('frame').value; if(f==='none')return false; const S=v('frs')/100*OW, cx=OW/2, cy=OH/2+v('fry')/100*OH; g.beginPath();
  if(f==='circle'){g.arc(cx,cy,S/2,0,Math.PI*2)}
  else if(f==='cloud'){ // 雲：楕円の上に小さな弧を並べる（弧の大きさを少しずつ変えて手の跡を残す）
    const rx=S/2,ry=S*0.6,n=13;const P=[];for(let i=0;i<n;i++){const a=-Math.PI/2+i/n*Math.PI*2;P.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry])}
    g.moveTo(...P[0]);for(let i=0;i<n;i++){const A=P[i],B=P[(i+1)%n];const mx=(A[0]+B[0])/2,my=(A[1]+B[1])/2;const ox=mx-cx,oy=my-cy,l=Math.hypot(ox,oy);const k=S*(0.085+0.03*Math.sin(i*2.3));

  else if(f==='fan'){const r=S*0.62,r2=S*0.22,y0=cy+S*0.32,a0=-Math.PI*0.86,a1=-Math.PI*0.14;g.arc(cx,y0,r,a0,a1);g.arc(cx,y0,r2,a1,a0,true);g.closePath()}

function tanzakuDraw(g,col,paper){const t=$('tz').value.trim(); if(!t)return; const [fam,wt]=$('tzf').value.split('|'); const fs=v('tzs'); const chars=[...t];
  const w=fs*1.5, h=fs*(chars.length*1.08)+fs*1.1, x=v('tzx')/100*OW-w/2, y=v('tzy')/100*OH; const lw=Math.max(1.5,fs*0.04);
  g.save(); if(paper!=='none'){g.fillStyle=paper}else{g.fillStyle='rgba(0,0,0,0)'}
  // 短冊：上は角を丸め、下は燕尾（二股）に切る

  g.lineWidth=lw;g.strokeStyle=col;g.stroke(); g.fillStyle=col; g.font=`${wt} ${fs}px "${fam}"`; g.textAlign='center'; g.textBaseline='middle';

function compose(){
  const P=place(), ink=$('ink').value, sub=$('sub').value, paper=$('paper').value;

  const fig=new Uint8Array(SW*SH); for(let i=0;i<fig.length;i++)fig[i]=LM[i]; FILLS.forEach(F=>{for(let i=0;i<fig.length;i++)if(F.mask[i])fig[i]=1});

// ── 段ごとに描き直す（スライダーは毎フレーム1回だけ） ───────────────

function setMode(m){mode=m;document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  $('fillui').style.display=m==='fill'?'':'none'; $('brushui').style.display=(m==='erase'||m==='draw')?'':'none';
  cv.classList.toggle('paint',m!=='move'); cv.style.touchAction=(m==='erase'||m==='draw')?'none':'manipulation';
  $('hint').dataset.base=$('hint').textContent={fill:'絵の区画を押すと柄で塗る',erase:'なぞって消す',draw:'なぞって線を足す（漏れる所を閉じる）',move:'見るだけ'}[m]}
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
function toSrc(e){const r=cv.getBoundingClientRect();const X=(e.clientX-r.left)/r.width*OW,Y=(e.clientY-r.top)/r.height*OH;const P=place();return [(X-P.x)/P.w,(Y-P.y)/P.h]}
let cur=null, flashT=0;

  if(mode==='fill'){if(p[0]<0||p[1]<0||p[0]>1||p[1]>1)return;
    const R=region(p[0],p[1]); if(!R||!R.some(x=>x)){flash('ここは線で塞がっています（「隙間を閉じる」を下げる）');return}
    acts.push({t:'fill',x:p[0],y:p[1],pat,size:v('psize'),col:$('pcol').value}); dirty.fill=true; schedule(); return}

function dl(blob,name){const a=document.createElement('a');a.download=name;a.href=URL.createObjectURL(blob);document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
$('png').onclick=()=>cv.toBlob(b=>dl(b,'uki_'+Date.now()+'.png'),'image/png');
// SVG：色の層ごとに、画素の縁を辿って輪郭にする（evenodd で穴も抜ける）
function trace(c){const W=OW,H=OH,A=c.getContext('2d').getImageData(0,0,W,H).data;const VW=W+1,o1=new Int32Array(VW*(H+1)).fill(-1),o2=new Int32Array(VW*(H+1)).fill(-1);
  const ink=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&A[(y*W+x)*4+3]>127; const add=(x0,y0,x1,y1)=>{const k=y0*VW+x0,t=y1*VW+x1;if(o1[k]<0)o1[k]=t;else o2[k]=t};
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(!ink(x,y))continue;if(!ink(x,y-1))add(x,y,x+1,y);if(!ink(x+1,y))add(x+1,y,x+1,y+1);if(!ink(x,y+1))add(x+1,y+1,x,y+1);if(!ink(x-1,y))add(x,y+1,x,y)}
  let d='';for(let k0=0;k0<o1.length;k0++){while(o1[k0]>=0||o2[k0]>=0){const pts=[];let k=k0;
    do{let t=o1[k];if(t>=0)o1[k]=-1;else{t=o2[k];o2[k]=-1}if(t<0)break;pts.push([k%VW,(k/VW)|0]);k=t}while(k!==k0);
    if(pts.length>=4)d+='M'+rdp(pts,0.7).map(p=>p[0]+' '+p[1]).join('L')+'Z'}}
  return d}
function rdp(P,eps){const keep=new Uint8Array(P.length);keep[0]=1;let far=0,fd=0;P.forEach((p,i)=>{const d=(p[0]-P[0][0])**2+(p[1]-P[0][1])**2;if(d>fd){fd=d;far=i}});keep[far]=1;
  const st=[[0,far],[far,P.length]];while(st.length){const [a,b]=st.pop();const A=P[a],B=P[b%P.length];let md=0,mi=-1;const dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy)||1;
    for(let i=a+1;i<b;i++){const d=Math.abs((P[i][0]-A[0])*dy-(P[i][1]-A[1])*dx)/L;if(d>md){md=d;mi=i}}if(md>eps){keep[mi]=1;st.push([a,mi],[mi,b])}}
  return P.filter((_,i)=>keep[i])}
$('svg').onclick=()=>{if(!lastLayers)return;const paper=$('paper').value;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${OW} ${OH}" width="${OW}" height="${OH}">`+(paper!=='none'?`<rect width="${OW}" height="${OH}" fill="${paper}"/>`:'')+
    `<path fill="${$('sub').value}" fill-rule="evenodd" d="${trace(lastLayers.sub)}"/><path fill="${$('ink').value}" fill-rule="evenodd" d="${trace(lastLayers.ink)}"/></svg>`;
  dl(new Blob([svg],{type:'image/svg+xml'}),'uki_'+Date.now()+'.svg')};
// 設定：つまみ・手直し・元の絵（見本は番号、読み込んだ絵は画像ごと）
const SET=[...LINE,...LAY,'frame','tz','tzf','ink','sub','paper','pcol'];
function settings(){const o={tool:'uki',v:1,source:src&&src.id==='upload'?{upload:src.dataURL}:{sample:src?src.id:null},acts,mode,pat};SET.forEach(k=>o[k]=$(k).value);return o}
function applySettings(o){SET.forEach(k=>{if(k in o)$(k).value=o[k]});acts=Array.isArray(o.acts)?o.acts:[];if(o.pat&&PATS[o.pat]){pat=o.pat;document.querySelectorAll('#pats button').forEach(b=>b.classList.toggle('on',b.dataset.p===pat))}
  const done=()=>{dirty.line=true;fontGo()};
  if(o.source&&o.source.upload){const im=new Image();im.onload=()=>{setSource(im,'upload',o.source.upload);$('credit').textContent='元の絵：読み込んだ画像';done()};im.src=o.source.upload}
  else{const i=Math.max(0,UKI_SAMPLES.findIndex(S=>S.id===(o.source&&o.source.sample)));$('sample').value=i;const S=UKI_SAMPLES[i];const im=new Image();im.onload=()=>{setSource(im,S.id,null);$('credit').textContent='元の絵：'+S.credit;done()};im.src=S.src}}
$('jsave').onclick=()=>dl(new Blob([JSON.stringify(settings())],{type:'application/json'}),'uki_'+Date.now()+'.json');
$('jload').onclick=()=>$('jfile').click();
$('jfile').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(o.tool!=='uki'&&o.tool!=='utsushi')throw 0; /* 改名前に保存した設定も読む */applySettings(o)}catch(_){alert('UKIの設定ファイルではありません')}});e.target.value=''};

setMode('fill'); loadSample(0); fontGo();
