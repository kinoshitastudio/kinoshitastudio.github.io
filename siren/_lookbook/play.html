<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Siren 点 — パターン調整 → 繋ぎ合わせ</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0c;--fg:#e9e9e9;--dim:#8a8a8e;--line:#26262a;--panel:#141416;--panel2:#1a1a1d;--hot:#ff8a3d}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:400 13px/1.6 ui-sans-serif,-apple-system,"Hiragino Sans",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 70px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
h1{font-family:'Anton',sans-serif;font-weight:400;font-size:25px;letter-spacing:.04em;text-transform:uppercase}
h1 .k{font-family:ui-sans-serif,"Hiragino Sans",sans-serif;font-weight:500;font-size:12px;color:var(--dim);margin-left:10px}
.top .note{font-size:11px;color:var(--dim)} .top .note a{color:var(--hot)}
.main{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
@media(max-width:860px){.main{grid-template-columns:1fr}}
.hd{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.pats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pt{border:1.5px solid rgba(255,255,255,0.30);border-radius:11px;overflow:hidden;background:#101012;cursor:pointer;position:relative;transition:border-color .15s,box-shadow .15s}
/* selected: border becomes the pattern's key colour (set inline in markSel) */
.pt canvas{display:block;width:100%;aspect-ratio:1;background:#000;border-bottom:1px solid var(--line)}
.pt .b{display:flex;align-items:center;justify-content:space-between;padding:7px 9px}
.pt .nm{font-family:'Anton',sans-serif;font-size:13px;letter-spacing:.03em;text-transform:uppercase}
.pt .nm i{font-style:normal;font-family:ui-sans-serif,"Hiragino Sans",sans-serif;font-size:10px;color:var(--dim);margin-left:5px}
.pt .add{font-size:10px;padding:3px 8px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--fg);cursor:pointer}
.pt .add:hover{border-color:var(--hot);color:var(--hot)}
.pt .cbar{height:3px;width:100%}
.tl{margin-top:16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:13px}
.tlgrid{display:grid;grid-template-columns:240px 1fr;gap:14px;align-items:start}
@media(max-width:680px){.tlgrid{grid-template-columns:1fr}}
#outC{display:block;width:100%;aspect-ratio:1;background:#000;border:1px solid var(--line);border-radius:10px}
.track{position:relative;display:flex;gap:4px;height:54px;margin-top:2px}
.track.empty{align-items:center;justify-content:center}
.track.empty::after{content:'上の「＋繋ぐ」でパターンを追加';color:var(--dim);font-size:11px}
.clip{position:relative;flex:1 1 auto;min-width:30px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);cursor:pointer;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:5px 6px}
.clip.sel{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg) inset}
.clip .cm{font-family:'Anton',sans-serif;font-size:11px;text-transform:uppercase;line-height:1}
.clip .cd{font-family:ui-monospace,monospace;font-size:9px;color:var(--dim);margin-top:2px}
.clip .cbar{position:absolute;left:0;top:0;height:3px;width:100%}
#head{position:absolute;top:-3px;width:2px;height:60px;background:var(--hot);box-shadow:0 0 6px var(--hot);pointer-events:none}
.tlbtns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
aside{border:1px solid var(--line);border-radius:12px;background:var(--panel);position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto}
.sec{border-bottom:1px solid var(--line);padding:12px 13px} .sec:last-child{border-bottom:0}
.lbl{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin:0 0 9px;display:flex;justify-content:space-between;align-items:center}
button{font:inherit;font-size:12px;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--dim)} button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button.mini{font-size:10px;padding:3px 7px}
.seq{display:grid;grid-template-columns:repeat(16,1fr);gap:3px}
.st{aspect-ratio:1;border:1px solid var(--line);border-radius:3px;cursor:pointer;background:transparent}
.st.on{background:var(--fg);border-color:var(--fg)} .st.acc{background:var(--hot);border-color:var(--hot)} .st.beat{border-color:#3a3a3d} .st.head{box-shadow:0 0 0 2px var(--hot)}
input[type=color].cpick{flex:none;width:42px;height:24px;border:1px solid var(--line);border-radius:5px;background:transparent;padding:0;cursor:pointer}
.row{display:flex;align-items:center;gap:9px;margin-top:7px}
.row label{font-size:10.5px;color:var(--dim);width:58px;flex:none}
input[type=range]{flex:1;accent-color:var(--fg);height:3px}
.val{font-size:10.5px;width:40px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap} .sp{flex:1}
.hint{font-size:10.5px;color:var(--dim);line-height:1.6;margin-top:8px} .hint b{color:var(--fg);font-weight:500}
.pill{display:inline-block;font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:2px 8px;margin-left:6px}
.exp{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.exp button{padding:8px 0;font-size:11px} .exp button small{display:block;font-size:8.5px;color:var(--dim);margin-top:1px}
.exp button.rec{border-color:var(--hot);color:var(--hot)}
.grp{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:14px 0 4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Siren <span class="k">点</span></h1>
    <div class="note">各パターンを個別に調整 → 選んで繋ぐ → 動画/SVGに <span class="pill">MP4録画=実装済</span> · <a href="index.html">← lookbook</a></div>
  </div>

  <div class="main">
    <div>
      <p class="hd"><span>① パターン — クリックで選んで右で調整・「＋繋ぐ」で下へ</span></p>
      <div class="pats" id="pats"></div>

      <div class="tl">
        <p class="hd"><span>② 繋ぎ合わせ（タイムライン）</span><span id="tlTime" style="font-family:ui-monospace,monospace"></span></p>
        <div class="tlgrid">
          <div><canvas id="outC"></canvas></div>
          <div>
            <div class="track empty" id="track"><div id="head"></div></div>
            <div class="tlbtns">
              <button id="clipDel" class="mini">削除</button>
              <button id="clipL" class="mini">◀</button>
              <button id="clipR" class="mini">▶</button>
              <span style="font-size:10.5px;color:var(--dim)">長さ</span>
              <input id="dur" type="range" min="0.3" max="6" step="0.1" style="width:90px">
              <span class="val mono" id="durV" style="width:34px"></span>
              <span class="sp"></span>
              <button id="play" class="on">‖</button>
              <button id="loopBtn" class="on">↻</button>
            </div>
            <div class="exp" style="margin-top:12px">
              <button id="exPlace" class="rec">◆ Figmaに配置<small>現フレーム→ノード</small></button>
              <button id="exVid">● 動画で録画<small>MP4/WebM(web)</small></button>
              <button id="exPng">PNG 現フレーム<small>1枚・ラスタ</small></button>
              <button id="exSvg">SVG 現フレーム<small>1枚・ベクター</small></button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <aside>
      <div class="sec">
        <p class="lbl">調整中のパターン <span id="selName" style="color:var(--fg)"></span></p>
        <div class="hint" id="modeHint" style="margin-top:0"></div>

        <p class="grp">律</p>
        <div class="seq" id="seq"></div>
        <div class="row"><label>拍間</label><input id="tempo" type="range" min="3" max="80" step="1"><span class="val mono" id="tempoV"></span></div>
        <div class="row"><label>swing</label><input id="swing" type="range" min="0" max="0.6" step="0.01"><span class="val mono" id="swingV"></span></div>
        <div class="row"><label>groove</label><input id="groove" type="range" min="0" max="1" step="0.02"><span class="val mono" id="grooveV"></span></div>

        <p class="grp">形・量</p>
        <div class="row"><label>density</label><input id="dens" type="range" min="0.2" max="3" step="0.02"><span class="val mono" id="densV"></span></div>
        <div class="row"><label>size</label><input id="size" type="range" min="0.2" max="4" step="0.02"><span class="val mono" id="sizeV"></span></div>

        <p class="grp">色</p>
        <div class="row"><label>マーク</label><input id="hue" type="range" min="0" max="360" step="1"><span class="val mono" id="hueV"></span></div>
        <div class="row"><label>背景</label><input id="bg" type="color" class="cpick"><label style="width:auto;margin-left:12px">アクセント</label><input id="acc" type="color" class="cpick"></div>

        <p class="grp">演出（高級感）</p>
        <div class="row"><label>glow</label><input id="glow" type="range" min="0" max="0.9" step="0.02"><span class="val mono" id="glowV"></span></div>
        <div class="row"><label>vignette</label><input id="vig" type="range" min="0" max="1" step="0.02"><span class="val mono" id="vigV"></span></div>

        <div class="hint">SVG(部品)以外はすべて<b>このパターン専用</b>。打点はクリックで <b>off→on→<span style="color:var(--hot)">アクセント</span></b>。拍間=右ほど遅い。</div>
      </div>

      <div class="sec">
        <p class="lbl">Part — 部品（共通・全パターン）</p>
        <div class="bar">
          <button id="loadBtn">SVG を読み込む</button>
          <button id="defBtn" class="on">＊ 既定</button>
          <button id="tintBtn">着色</button>
          <input id="file" type="file" accept=".svg,image/svg+xml" hidden>
        </div>
        <div class="hint" id="partName">共通で使う部品はここだけ。色/着色はマーク色（各パターン）で決まります。</div>
        <div class="bar" style="margin-top:9px"><button id="dice">⟳ seed</button><span class="sp"></span><span id="count" style="font-size:10.5px;color:var(--dim)"></span></div>
      </div>
    </aside>
  </div>
</div>

<script>
'use strict'
function rnd(seed){ let a=seed>>>0; return ()=>{ a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296 } }
const hueCss=h=>{const k=n=>(n+h/30)%12,f=n=>Math.round(255*(1-Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)))));return `rgb(${f(0)},${f(8)},${f(4)})`}

/* common = only the part (svg) + seed */
let userImg=null, tint=false, seed=7, playing=true, loopOn=true, selP=0, selC=0
const MHINT={ step:'16ステップが格子に。ヘッドが順に点灯＝シーケンサーが絵になる。',burst:'ビートごとに中心から放射で弾ける。',field:'敷き詰めたマークがリズムで脈打つ地紋。',assemble:'散らばりから形に集まり、また散る。',flow:'フロー場に沿って流れ続ける。打点で粒が注がれる。',orbit:'複数の半径・速度で周回。打点でリング脈打つ。',morph:'何かから何かへ。打点ごとに形（円→格子→線→渦…）へ変わり続ける。',spiral:'渦を巻いて回転。拍で伸縮する銀河のような運動。',wave:'格子を波が伝播。拍で波が高くなる。',bloom:'ゆっくり開いて閉じる、上品な呼吸。',link:'漂う点を細い線でつなぐ星座。上品でテック感。',ripple:'打点から静かに輪が広がる水紋。' }
const MCOL={ step:'#4a90d9',burst:'#ff8a3d',field:'#7ac86b',assemble:'#b98cff',flow:'#59c2c9',orbit:'#e0679b',morph:'#e8b64a',spiral:'#8f7cff',wave:'#4ec0a0',bloom:'#d9a441',link:'#7fb0d0',ripple:'#5fc7bf' }
const MJP={ step:'16歩',burst:'打点',field:'地紋',assemble:'集合',flow:'流れ',orbit:'軌道',morph:'変形',spiral:'渦',wave:'波',bloom:'開花',link:'結線',ripple:'波紋' }

/* each pattern owns EVERYTHING except the shared part */
function pat(mode,pattern,hue){ const steps=new Array(16).fill(0); pattern.forEach(i=>steps[i]=1)
  return {mode,steps,dens:1,size:1,hue:hue==null?28:hue,bg:'#000000',accent:'#ffffff',tempo:12,swing:0,groove:0.6,glow:0.3,vig:0.4,last:-1,S:{}} }
const patterns=[ pat('step',[0,4,6,8,12,14],28), pat('burst',[0,4,8,12],14), pat('field',[0,2,4,6,8,10,12,14],140), pat('assemble',[0,8],270), pat('flow',[2,10],190), pat('orbit',[0,8],330),
  pat('morph',[0,4,8,12],45), pat('spiral',[0,8],262), pat('wave',[0,2,4,6,8,10,12,14],165), pat('bloom',[0,8],40), pat('link',[0,4,8,12],205), pat('ripple',[0,6,12],172) ]
let clips=[ {pi:0,dur:2},{pi:3,dur:2},{pi:1,dur:1.5},{pi:4,dur:2.5} ]

/* ---- mark (into any ctx) ---- */
function tintFor(color){ if(!userImg) return null; if(!userImg.tints) userImg.tints=new Map(); let c=userImg.tints.get(color)
  if(!c){ const bw=180,bh=Math.max(1,Math.round(180*userImg.h/userImg.w)); c=document.createElement('canvas'); c.width=bw; c.height=bh; const x=c.getContext('2d')
    x.drawImage(userImg.img,0,0,bw,bh); x.globalCompositeOperation='source-in'; x.fillStyle=color; x.fillRect(0,0,bw,bh); userImg.tints.set(color,c) } return c }
let capturing=false, svgSink=null, captureReq=false
function markSVGStr(X,Y,r,rot,col,alpha){ const deg=((rot||0)*57.2958).toFixed(1), op=(alpha==null?1:alpha).toFixed(2)
  let inner
  if(userImg&&userImg.src){ const k=(2*r)/userImg.w, fill=tint?` fill="${col}" color="${col}"`:''
    inner=`<g${fill} transform="scale(${k.toFixed(4)}) translate(${(-userImg.w/2).toFixed(1)} ${(-userImg.h/2).toFixed(1)})">${userImg.src}</g>` }
  else { const w=Math.max(1.2,r*0.32); let rt=''; for(let i=0;i<3;i++) rt+=`<rect x="${(-w/2).toFixed(2)}" y="${(-r).toFixed(2)}" width="${w.toFixed(2)}" height="${(2*r).toFixed(2)}" rx="${(w/2).toFixed(2)}" transform="rotate(${i*60})"/>`
    inner=`<g fill="${col}">${rt}</g>` }
  return `<g transform="translate(${X.toFixed(2)} ${Y.toFixed(2)}) rotate(${deg})" opacity="${op}">${inner}</g>` }
function mark(c,W,X,Y,r,rot,col,alpha){
  if(capturing) svgSink.push(markSVGStr(X,Y,r,rot,col,alpha))
  if(userImg){ c.save(); c.globalAlpha=alpha==null?1:alpha; c.translate(X,Y); c.rotate(rot||0); const ar=userImg.h/userImg.w
    if(tint) c.drawImage(tintFor(col),-r,-r*ar,2*r,2*r*ar); else c.drawImage(userImg.img,-r,-r*ar,2*r,2*r*ar); c.restore(); return }
  c.save(); c.translate(X,Y); c.rotate(rot||0); c.globalAlpha=alpha==null?1:alpha; c.fillStyle=col
  const w=Math.max(1.2,r*0.32); for(let i=0;i<3;i++){ c.beginPath(); c.roundRect(-w/2,-r,w,2*r,w/2); c.fill(); c.rotate(Math.PI/3) } c.restore()
}

/* ---- engine ---- */
function initMode(pt,S,W){ const mode=pt.mode,R=rnd((seed*131+mode.length)>>>0),N=Math.round(40*pt.dens)
  S.R=R; S.bursts=[]; S.parts=[]; S.grid=[]; S.ripples=[]; S.pulse=0; S.env=0
  if(mode==='field'){ const Gd=6; for(let i=0;i<Gd;i++)for(let j=0;j<Gd;j++) S.grid.push({x:(i+0.5)/Gd,y:(j+0.5)/Gd,step:Math.floor(i/Gd*16),jx:(R()-0.5)*0.05,jy:(R()-0.5)*0.05}); S.Gd=Gd }
  if(mode==='flow'){ for(let i=0;i<N;i++) S.parts.push({x:R()*W,y:R()*W,ac:R()<0.16}) }
  if(mode==='orbit'){ for(let i=0;i<Math.round(28*pt.dens);i++){ const ring=1+(i%3); S.parts.push({r:(0.10+ring*0.10),sp:(0.010+ring*0.006)*(i%2?1:-1),ph:R()*6.28,ac:i%5===0}) } }
  if(mode==='assemble'){ for(let i=0;i<N;i++){ const a=i/N*6.283,r=0.30; S.parts.push({sx:R(),sy:R(),tx:0.5+Math.cos(a)*r,ty:0.5+Math.sin(a)*r,ac:i%7===0}) } }
  if(mode==='morph'){ const NM=Math.round(50*pt.dens); S.N=NM; S.scatter=[]; for(let i=0;i<NM;i++) S.scatter.push([R(),R()]); S.fromF=0; S.toF=1; S.mo=0 }
  if(mode==='link'){ const NL=Math.round(26*pt.dens); for(let i=0;i<NL;i++) S.parts.push({x:R(),y:R(),vx:(R()-0.5)*0.0016,vy:(R()-0.5)*0.0016}) }
  return S }
function onHit(pt,S,W,acc){ const m=pt.mode; S.env=acc?1.5:1.0
  if(m==='burst') S.bursts.push({age:0,acc:acc})
  if(m==='ripple') S.ripples.push({age:0})
  if(m==='flow'){ const k=acc?5:3; for(let i=0;i<k;i++) S.parts.push({x:W/2+(S.R()-0.5)*20,y:W/2+(S.R()-0.5)*20,ac:true,life:1}) }
  if(m==='orbit'||m==='link') S.pulse=acc?1.4:1
  if(m==='morph'){ if((S.mo||0)>=0.8 || S.toF===S.fromF){ S.fromF=S.toF; S.toF=(S.toF+1)%6; S.mo=0 } } }
function formPos(idx,i,N,scatter){ const t=i/Math.max(1,N-1)
  if(idx===0){ const a=i/N*6.283; return [0.5+Math.cos(a)*0.34,0.5+Math.sin(a)*0.34] }
  if(idx===1){ const g=Math.ceil(Math.sqrt(N)),c=i%g,r=(i/g|0); return [0.15+(c+0.5)/g*0.7,0.15+(r+0.5)/g*0.7] }
  if(idx===2){ return [0.1+t*0.8,0.5] }
  if(idx===3){ const a=t*6.283*3,rr=0.05+t*0.32; return [0.5+Math.cos(a)*rr,0.5+Math.sin(a)*rr] }
  if(idx===4){ return [0.15+t*0.7,0.15+t*0.7] }
  return scatter[i]||[0.5,0.5] }
function drawMode(c,W,pt,S,ph,f){ const mode=pt.mode,steps=pt.steps,col=hueCss(pt.hue==null?28:pt.hue),HL=pt.accent||'#ffffff'
  c.fillStyle=pt.bg||'#000'; c.fillRect(0,0,W,W)
  S.env=(S.env||0)*0.88; const S0=(pt.size==null?1:pt.size)*(1+S.env*0.5*(pt.groove==null?0:pt.groove))
  if(mode==='step'){ const gd=4,gap=W/gd; for(let idx=0;idx<16;idx++){ const i=idx%4,j=(idx/4)|0,x=gap*(i+0.5),y=gap*(j+0.5),on=steps[idx],head=idx===ph
    if(head){ c.strokeStyle=col; c.globalAlpha=.4; c.lineWidth=1.4; c.strokeRect(x-gap*0.42,y-gap*0.42,gap*0.84,gap*0.84); c.globalAlpha=1 }
    if(on) mark(c,W,x,y,gap*0.30*S0*(head?1.15:0.9),head?f*0.05:0,head?HL:col,head?1:0.55) } }
  else if(mode==='burst'){ for(const b of S.bursts) b.age++; S.bursts=S.bursts.filter(b=>b.age<52); const M=Math.round(12*pt.dens)
    for(const b of S.bursts){ const rad=b.age*(W/64)*3.0,al=1-b.age/52; for(let i=0;i<M;i++){ const a=i/M*6.283; mark(c,W,W/2+Math.cos(a)*rad,W/2+Math.sin(a)*rad,W*0.03*S0*(0.5+al*0.6),a,i%3===0?HL:col,al) } }
    mark(c,W,W/2,W/2,W*0.05*S0,f*0.02,col,0.9) }
  else if(mode==='field'){ const base=W/S.Gd*0.32; for(const p of S.grid){ const active=steps[p.step],near=Math.cos((ph-p.step)*0.6)*0.5+0.5,pulse=active?(0.4+0.6*near):0.12
    mark(c,W,(p.x+p.jx)*W,(p.y+p.jy)*W,base*(0.5+pulse)*S0,p.step*0.2+f*0.004,active&&near>0.8?HL:col,0.3+pulse*0.7) } }
  else if(mode==='flow'){ S.parts=S.parts.filter(p=>p.life==null||(p.life-=0.006)>0); const sc=2.1
    for(const p of S.parts){ const ang=(Math.sin(p.x/W*6.28*sc)+Math.cos(p.y/W*6.28*sc*1.2))*1.3; p.x+=Math.cos(ang)*1.5; p.y+=Math.sin(ang)*1.5
      if(p.x<-8)p.x=W+8; if(p.x>W+8)p.x=-8; if(p.y<-8)p.y=W+8; if(p.y>W+8)p.y=-8; mark(c,W,p.x,p.y,W*0.022*S0,ang,p.ac?HL:col,(p.life!=null?p.life:0.75)) } }
  else if(mode==='orbit'){ S.pulse=(S.pulse||0)*0.92; for(const p of S.parts){ const a=p.ph+f*p.sp,rr=p.r*W*(1+S.pulse*0.12); mark(c,W,W/2+Math.cos(a)*rr,W/2+Math.sin(a)*rr,W*0.026*S0*(1+S.pulse*0.4),a+1.57,p.ac?HL:col,0.8) } }
  else if(mode==='assemble'){ const barLen=pt.tempo*16,barPh=(f%barLen)/barLen,k=barPh<0.72?barPh/0.72:1,e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2,scv=barPh>0.92?1-(barPh-0.92)/0.08:1
    for(const p of S.parts){ const x=(p.sx+(p.tx-p.sx)*e*scv)*W,y=(p.sy+(p.ty-p.sy)*e*scv)*W; mark(c,W,x,y,W*0.028*S0,f*0.01,p.ac?HL:col,0.3+e*0.7) } }
  else if(mode==='morph'){ const N=S.N||1; S.mo=Math.min(1,(S.mo||0)+0.03); const m=S.mo,e=m<.5?2*m*m:1-Math.pow(-2*m+2,2)/2
    for(let i=0;i<N;i++){ const a=formPos(S.fromF||0,i,N,S.scatter),b=formPos(S.toF||0,i,N,S.scatter); const x=(a[0]+(b[0]-a[0])*e)*W,y=(a[1]+(b[1]-a[1])*e)*W
      mark(c,W,x,y,W*0.02*S0,f*0.01,i%9===0?HL:col,0.85) } }
  else if(mode==='spiral'){ const N=Math.round(64*pt.dens),rot=f*0.012,conv=1+(S.env||0)*0.35
    for(let i=0;i<N;i++){ const t=i/N,a=t*6.283*4+rot,rr=(0.03+t*0.34)*conv*W; mark(c,W,W/2+Math.cos(a)*rr,W/2+Math.sin(a)*rr,W*0.02*S0*(0.6+t*0.6),a,i%8===0?HL:col,0.4+t*0.55) } }
  else if(mode==='wave'){ const gd=8,amp=0.05*(1+(S.env||0)*2.2)
    for(let i=0;i<gd;i++)for(let j=0;j<gd;j++){ const x=(i+0.5)/gd,by=(j+0.5)/gd,disp=Math.sin(x*6.283*2-f*0.06+j*0.3)*amp,y=by+disp,near=Math.min(1,Math.abs(disp)/(amp+1e-6))
      mark(c,W,x*W,y*W,W*0.026*S0*(0.7+near*0.4),0,near>0.85?HL:col,0.4+near*0.5) } }
  else if(mode==='bloom'){ const N=Math.round(44*pt.dens),open=0.45+0.35*Math.sin(f*0.018)+(S.env||0)*0.25,rot=f*0.005
    for(let i=0;i<N;i++){ const layer=i%3,a=i/N*6.283+rot+layer*0.4,rr=(0.10+layer*0.12)*open*W*1.4
      mark(c,W,W/2+Math.cos(a)*rr,W/2+Math.sin(a)*rr,W*0.022*S0*(0.7+open*0.6),a,i%7===0?HL:col,0.5+open*0.5) } }
  else if(mode==='link'){ const parts=S.parts; for(const p of parts){ p.x+=p.vx; p.y+=p.vy; if(p.x<0.05||p.x>0.95)p.vx*=-1; if(p.y<0.05||p.y>0.95)p.vy*=-1 }
    c.strokeStyle=col; c.lineWidth=Math.max(0.6,W*0.0011)
    for(let i=0;i<parts.length;i++)for(let j=i+1;j<parts.length;j++){ const dx=parts[i].x-parts[j].x,dy=parts[i].y-parts[j].y,d=Math.hypot(dx,dy); if(d<0.24){ c.globalAlpha=(1-d/0.24)*0.5*(0.6+(S.pulse||0)*0.6); c.beginPath(); c.moveTo(parts[i].x*W,parts[i].y*W); c.lineTo(parts[j].x*W,parts[j].y*W); c.stroke() } }
    c.globalAlpha=1; S.pulse=(S.pulse||0)*0.94; for(const p of parts) mark(c,W,p.x*W,p.y*W,W*0.016*S0,f*0.01,col,0.9) }
  else if(mode==='ripple'){ for(const r of S.ripples) r.age++; S.ripples=S.ripples.filter(r=>r.age<90); const M=Math.round(22*pt.dens)
    for(const r of S.ripples){ const rad=r.age*(W/90)*0.9,al=1-r.age/90; for(let i=0;i<M;i++){ const a=i/M*6.283; mark(c,W,W/2+Math.cos(a)*rad,W/2+Math.sin(a)*rad,W*0.014*S0,a,i%6===0?HL:col,al*0.8) } } }
}
function clearC(c,W){ c.clearRect(0,0,W,W); c.fillStyle='#000'; c.fillRect(0,0,W,W) }
/* premium: soft bloom + edge vignette */
function bloom(c,W,amt){ if(amt<=0) return; c.save(); c.globalCompositeOperation='lighter'; c.globalAlpha=Math.min(0.9,amt); c.filter='blur('+Math.max(2,Math.round(W*0.014))+'px)'; c.drawImage(c.canvas,0,0,W,W); c.filter='none'; c.restore() }
function vignette(c,W,amt){ if(amt<=0) return; const g2=c.createRadialGradient(W/2,W/2,W*0.30,W/2,W/2,W*0.72); g2.addColorStop(0,'rgba(0,0,0,0)'); g2.addColorStop(1,'rgba(0,0,0,'+(amt*0.75).toFixed(2)+')'); c.save(); c.fillStyle=g2; c.fillRect(0,0,W,W); c.restore() }

/* ---- tiles ---- */
const patsEl=document.getElementById('pats'), tiles=[]
function fitCanvas(cv){ const dpr=Math.min(2,window.devicePixelRatio||1),w=cv.clientWidth||150; cv.width=Math.round(w*dpr); cv.height=Math.round(w*dpr); const c=cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0); return {c,W:w} }
function buildTiles(){ patsEl.innerHTML=''; tiles.length=0
  patterns.forEach((pt,i)=>{ const el=document.createElement('div'); el.className='pt'+(i===selP?' sel':'')
    el.innerHTML=`<canvas></canvas><div class="b"><span class="nm">${pt.mode}<i>${MJP[pt.mode]}</i></span><button class="add">＋ 繋ぐ</button></div>`
    el.onclick=e=>{ if(e.target.classList.contains('add')) return; selP=i; syncSel(); markSel() }
    el.querySelector('.add').onclick=()=>{ clips.push({pi:i,dur:1.5}); selC=clips.length-1; buildTrack(); syncDur() }
    patsEl.append(el); const cv=el.querySelector('canvas'); const {c,W}=fitCanvas(cv); pt.last=-1; initMode(pt,pt.S,W); tiles.push({pt,cv,c,W}) })
  markSel()
}
function markSel(){ [...patsEl.children].forEach((el,i)=>{ const on=i===selP,kc=MCOL[patterns[i].mode]; el.classList.toggle('sel',on); el.style.borderColor=on?kc:''; el.style.boxShadow=on?`inset 0 0 0 1px ${kc}, 0 0 16px -5px ${kc}`:'' }) }

/* ---- output ---- */
const outCv=document.getElementById('outC'); let outC=null, outW=1080, outS={}, outLast=-1
function fitOut(){ outCv.width=1080; outCv.height=1080; outC=outCv.getContext('2d'); outC.setTransform(1,0,0,1,0,0); outW=1080 }

/* ---- timeline ---- */
const track=document.getElementById('track'), headEl=document.getElementById('head')
function buildTrack(){ [...track.querySelectorAll('.clip')].forEach(e=>e.remove()); track.classList.toggle('empty',clips.length===0)
  clips.forEach((cl,i)=>{ const p=patterns[cl.pi]; const el=document.createElement('div'); el.className='clip'+(i===selC?' sel':''); el.style.flexGrow=cl.dur
    el.innerHTML=`<div class="cbar" style="background:${MCOL[p.mode]}"></div><div class="cm">${p.mode}</div><div class="cd">${cl.dur.toFixed(1)}s</div>`
    el.onclick=()=>{ selC=i; buildTrack(); syncDur() }; track.append(el) })
  if(!track.contains(headEl)) track.append(headEl) }
function syncDur(){ const cl=clips[selC]; const d=document.getElementById('dur'); if(cl){ d.value=cl.dur; document.getElementById('durV').textContent=cl.dur.toFixed(1)+'s' } }
document.getElementById('dur').oninput=e=>{ if(!clips[selC]) return; clips[selC].dur=+e.target.value; document.getElementById('durV').textContent=clips[selC].dur.toFixed(1)+'s'; buildTrack() }
document.getElementById('clipDel').onclick=()=>{ if(!clips.length) return; clips.splice(selC,1); selC=Math.max(0,selC-1); curClip=-1; buildTrack(); syncDur() }
document.getElementById('clipL').onclick=()=>{ if(selC<=0) return; [clips[selC-1],clips[selC]]=[clips[selC],clips[selC-1]]; selC--; curClip=-1; buildTrack() }
document.getElementById('clipR').onclick=()=>{ if(selC>=clips.length-1) return; [clips[selC+1],clips[selC]]=[clips[selC],clips[selC+1]]; selC++; curClip=-1; buildTrack() }

/* ---- per-pattern editor ---- */
const seqEl=document.getElementById('seq')
function stClass(v,i){ return 'st'+(v?' on':'')+(v===2?' acc':'')+(i%4===0?' beat':'') }
function buildSeq(){ const pt=patterns[selP]; seqEl.innerHTML=''; for(let i=0;i<16;i++){ const b=document.createElement('div'); b.className=stClass(pt.steps[i],i); b.onclick=()=>{ pt.steps[i]=(pt.steps[i]+1)%3; b.className=stClass(pt.steps[i],i) }; seqEl.append(b) } }
/* sets patterns[selP][key]; reinit tile state when needed */
function pbind(id,key,fmt,reinit){ const el=document.getElementById(id),out=document.getElementById(id+'V')
  el.oninput=()=>{ const pt=patterns[selP]; pt[key]=+el.value; if(out) out.textContent=fmt(pt[key]); if(reinit){ const t=tiles[selP]; if(t) initMode(pt,pt.S,t.W) }; if(key==='hue'&&userImg&&userImg.tints) userImg.tints.clear() } }
pbind('tempo','tempo',v=>v+'f'); pbind('swing','swing',v=>Math.round(v*100)+'%'); pbind('groove','groove',v=>Math.round(v*100)+'%')
pbind('dens','dens',v=>v.toFixed(2),true); pbind('size','size',v=>v.toFixed(2)); pbind('hue','hue',v=>v+'°')
pbind('glow','glow',v=>Math.round(v*100)+'%'); pbind('vig','vig',v=>Math.round(v*100)+'%')
document.getElementById('bg').oninput=e=>{ patterns[selP].bg=e.target.value }
document.getElementById('acc').oninput=e=>{ patterns[selP].accent=e.target.value; if(userImg&&userImg.tints) userImg.tints.clear() }
function setV(id,val,fmt){ const el=document.getElementById(id); if(el) el.value=val; const o=document.getElementById(id+'V'); if(o&&fmt) o.textContent=fmt(val) }
function syncSel(){ const pt=patterns[selP]
  document.getElementById('selName').textContent=pt.mode.toUpperCase()+' '+MJP[pt.mode]
  document.getElementById('modeHint').textContent=MHINT[pt.mode]
  setV('tempo',pt.tempo,v=>v+'f'); setV('swing',pt.swing,v=>Math.round(v*100)+'%'); setV('groove',pt.groove,v=>Math.round(v*100)+'%')
  setV('dens',pt.dens,v=>v.toFixed(2)); setV('size',pt.size,v=>v.toFixed(2)); setV('hue',pt.hue,v=>v+'°')
  setV('glow',pt.glow,v=>Math.round(v*100)+'%'); setV('vig',pt.vig,v=>Math.round(v*100)+'%')
  document.getElementById('bg').value=pt.bg||'#000000'; document.getElementById('acc').value=pt.accent||'#ffffff'
  buildSeq() }

/* ---- common part + transport ---- */
document.getElementById('loadBtn').onclick=()=>document.getElementById('file').click()
document.getElementById('defBtn').onclick=()=>{ userImg=null; document.getElementById('defBtn').classList.add('on') }
document.getElementById('tintBtn').onclick=()=>{ tint=!tint; document.getElementById('tintBtn').classList.toggle('on',tint) }
document.getElementById('dice').onclick=()=>{ seed=1+Math.floor(Math.random()*998); patterns.forEach(pt=>{ const t=tiles[patterns.indexOf(pt)]; initMode(pt,pt.S,t?t.W:150) }); curClip=-1 }
document.getElementById('file').onchange=e=>{ const file=e.target.files[0]; if(!file) return; const rd=new FileReader()
  rd.onload=()=>{ const doc=new DOMParser().parseFromString(rd.result,'image/svg+xml'),s=doc.querySelector('svg'); if(!s||doc.querySelector('parsererror')){ alert('SVG を読み込めませんでした'); return }
    let vb=s.getAttribute('viewBox'),w,h; if(vb){ const p=vb.split(/[\s,]+/).map(Number); w=p[2]; h=p[3] } else { w=parseFloat(s.getAttribute('width'))||100; h=parseFloat(s.getAttribute('height'))||100 }
    s.setAttribute('width',w||100); s.setAttribute('height',h||100); const src=s.innerHTML
    const blob=new Blob([new XMLSerializer().serializeToString(s)],{type:'image/svg+xml'}),url=URL.createObjectURL(blob),img=new Image()
    img.onload=()=>{ userImg={img,w:w||100,h:h||100,src}; tint=true; document.getElementById('tintBtn').classList.add('on'); document.getElementById('defBtn').classList.remove('on'); document.getElementById('partName').textContent='自作マークを共通で使用中（着色ON・色は各パターンのマーク色）' }; img.src=url }
  rd.readAsText(file) }
const playBtn=document.getElementById('play'); playBtn.onclick=()=>{ playing=!playing; playBtn.classList.toggle('on',playing); playBtn.textContent=playing?'‖':'▶'; if(playing&&tl>=totalFrames()-1) tl=0 }
const loopBtn=document.getElementById('loopBtn'); loopBtn.onclick=()=>{ loopOn=!loopOn; loopBtn.classList.toggle('on',loopOn) }

/* ---- export ---- */
function dl(url,name){ const a=document.createElement('a'); a.href=url; a.download=name; a.click() }
document.getElementById('exPng').onclick=()=>dl(outCv.toDataURL('image/png'),'siren-ten.png')
document.getElementById('exSvg').onclick=()=>{ if(!clips.length){ alert('先に「＋繋ぐ」でパターンを並べてください'); return } captureReq=true }
let placeReq=false
document.getElementById('exPlace').onclick=()=>{ if(!clips.length){ alert('先に「＋繋ぐ」でパターンを並べてください'); return } captureReq=true; placeReq=true }
let recording=false, recorder=null, recChunks=[], recMime='video/webm', wasLoop=true
function finishRec(){ if(!recording) return; recording=false; try{ recorder.stop() }catch(e){} }
document.getElementById('exVid').onclick=()=>{ const btn=document.getElementById('exVid')
  if(recording){ finishRec(); return }
  if(!clips.length){ alert('先に「＋繋ぐ」でパターンを並べてください'); return }
  if(!outCv.captureStream){ alert('この環境は録画に未対応です'); return }
  const types=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm']
  recMime=types.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||'video/webm'
  recorder=new MediaRecorder(outCv.captureStream(30),{mimeType:recMime}); recChunks=[]
  recorder.ondataavailable=e=>{ if(e.data&&e.data.size) recChunks.push(e.data) }
  recorder.onstop=()=>{ const blob=new Blob(recChunks,{type:recMime}); dl(URL.createObjectURL(blob),'siren-ten.'+(recMime.indexOf('mp4')>=0?'mp4':'webm')); btn.classList.remove('on'); btn.textContent='● 動画で録画'; loopOn=wasLoop; loopBtn.classList.toggle('on',loopOn) }
  wasLoop=loopOn; loopOn=false; loopBtn.classList.remove('on'); tl=0; curClip=-1; playing=true; playBtn.classList.add('on'); playBtn.textContent='‖'; recording=true; btn.classList.add('on'); btn.textContent='■ 録画中…'
  recorder.start() }

/* ---- master loop (each scene has its own clock via pt.tempo/swing) ---- */
let f=0, tl=0, curClip=-1
function totalFrames(){ return Math.max(1,Math.round(clips.reduce((a,c)=>a+c.dur,0)*60)) }
function clipAt(fr){ let acc=0; for(let i=0;i<clips.length;i++){ acc+=clips[i].dur*60; if(fr<acc) return i } return clips.length-1 }
function tick(clkOwner,pt){ const spf=pt.tempo,posf=f/spf,g=Math.floor(posf),ph=g%16,frac=posf-g,delay=(ph%2?(pt.swing||0)*0.5:0)
  let fire=false; if(g!==clkOwner.last && frac>=delay){ clkOwner.last=g; fire=true } return {ph,fire} }
const outClk={last:-1}
function loop(){
  f++
  for(const t of tiles){ const {ph,fire}=tick(t.pt,t.pt); if(fire && t.pt.steps[ph]) onHit(t.pt,t.pt.S,t.W,t.pt.steps[ph]===2); clearC(t.c,t.W); drawMode(t.c,t.W,t.pt,t.pt.S,ph,f); bloom(t.c,t.W,t.pt.glow) }
  if(clips.length){
    if(playing){ tl++; const total=totalFrames(); if(tl>=total){ if(recording){ finishRec() } if(loopOn){ tl=0 } else { tl=total-1; playing=false; playBtn.classList.remove('on'); playBtn.textContent='▶' } } }
    const ci=clipAt(tl); if(ci!==curClip){ curClip=ci; outS={}; initMode(patterns[clips[ci].pi],outS,outW); outClk.last=-1 }
    const pt=patterns[clips[curClip].pi]
    const {ph,fire}=tick(outClk,pt)
    if(fire && pt.steps[ph]) onHit(pt,outS,outW,pt.steps[ph]===2)
    clearC(outC,outW)
    if(captureReq){ capturing=true; svgSink=[] }
    drawMode(outC,outW,pt,outS,ph,f)
    if(captureReq){ capturing=false; captureReq=false; const body=svgSink.join(''); svgSink=null
      const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${outW} ${outW}"><rect width="${outW}" height="${outW}" fill="${pt.bg||'#000'}"/>${body}</svg>`
      if(placeReq){ placeReq=false; try{ parent.postMessage({type:'ten-place',svg},'*') }catch(e){} } else dl('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg),'siren-ten.svg') }
    bloom(outC,outW,pt.glow); vignette(outC,outW,pt.vig)
    headEl.style.left=(tl/totalFrames()*100)+'%'
    document.getElementById('tlTime').textContent=(tl/60).toFixed(1)+' / '+(totalFrames()/60).toFixed(1)+'s'
    document.getElementById('count').textContent=MJP[pt.mode]
  } else clearC(outC,outW)
  requestAnimationFrame(loop)
}

addEventListener('resize',()=>{ buildTiles(); fitOut(); markSel(); curClip=-1 })
buildTiles(); fitOut(); buildTrack(); syncSel(); syncDur(); requestAnimationFrame(loop)
</script>
</body>
</html>
