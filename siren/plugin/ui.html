<!doctype html>
<meta charset="utf-8">
<style>
:root{ --bg:#0b0b0c; --fg:#e9e9e9; --dim:#78787b; --line:#242426; --panel:#151516; --hot:#ff8a3d }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:400 12px/1.55 -apple-system,ui-sans-serif,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column}
.mono{font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}

header{padding:9px 14px 8px;border-bottom:1px solid var(--line);flex:none;
  display:flex;align-items:center;justify-content:space-between;gap:9px}
h1{font-family:"Haettenschweiler","Impact","Arial Narrow Bold",sans-serif;font-size:19px;
  letter-spacing:.06em;text-transform:uppercase;margin:0;font-weight:400;cursor:pointer;line-height:1.05}
h1:hover{opacity:.82}
/* the wordmark stacks, so the instrument has room to sit beside it */
.wm{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.by{font-size:6.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);white-space:nowrap;opacity:.75}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{padding:4px 8px;font-size:10px;border-radius:20px}
.sw{width:22px;height:22px;border-radius:5px;border:1px solid var(--line);flex:none;padding:0;
     background:transparent;cursor:pointer}
input[type=color]{-webkit-appearance:none;appearance:none}
input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
input[type=color]::-webkit-color-swatch{border:none;border-radius:3px}
.lang{display:flex;flex:none}
.lang button{border-radius:0;padding:4px 9px;font-size:10.5px}
.lang button:first-child{border-radius:5px 0 0 5px}
.lang button:last-child{border-radius:0 5px 5px 0;margin-left:-1px}

/* the instrument: what everything below this line is about */
.iwrap{position:relative;flex:1;display:flex;justify-content:flex-end;min-width:0}
#instBtn{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;padding:5px 9px;
  background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:500}
.imenu{position:absolute;top:calc(100% + 5px);right:0;z-index:20;background:var(--panel);
  border:1px solid var(--line);border-radius:7px;padding:4px;min-width:150px;
  box-shadow:0 10px 22px -10px #000}
.imenu[hidden]{display:none}
.imenu button{display:block;width:100%;text-align:left;border:none;border-radius:5px;padding:6px 9px;font-size:11px}
.imenu button:hover{background:#1e1e20}
.imenu button.on{background:var(--fg);color:var(--bg)}
.imenu small{display:block;font-size:9px;color:var(--dim);letter-spacing:0;text-transform:none}
.imenu button.on small{color:var(--bg);opacity:.6}
.imenu button i{font-style:normal;float:right;font-size:9.5px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.imenu button.on i{color:var(--bg);opacity:.7}
.trk.silent{opacity:.38}
#instBtn u{text-decoration:none;opacity:.55;margin-left:5px;font-weight:400}

.scroll{flex:1;overflow-y:auto;padding:12px 14px 0;position:relative}
/* the preview earns its keep, but the sequencer has to stay reachable */
#stage{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#000;margin-bottom:10px;
  position:sticky;top:0;z-index:3;box-shadow:0 8px 16px -8px #000;
  display:grid;place-items:center;padding:6px}
#art{display:block}
#stage{min-height:120px}

button{font:inherit;font-size:11px;color:var(--fg);background:transparent;border:1px solid var(--line);
  border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--dim)}
button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.sec{border:1px solid var(--line);border-radius:8px;padding:11px 12px;margin-bottom:9px;background:var(--panel)}
.sec[hidden]{display:none}
.lbl{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin:0 0 8px}
.row{display:flex;align-items:center;gap:8px;margin-top:6px}
.row label{font-size:10px;color:var(--dim);width:58px;flex:none}
input[type=range]{flex:1;accent-color:var(--fg);height:3px}
.val{font-size:10px;width:42px;text-align:right;flex:none}

.seq{display:grid;grid-template-columns:44px repeat(16,1fr);gap:2px;align-items:center}
.trk{font-size:9px;color:var(--dim);cursor:pointer}
.trk.sel{color:var(--fg)}
.st{aspect-ratio:1;border:1px solid var(--line);border-radius:2px;cursor:pointer}
.st.on{background:var(--fg);border-color:var(--fg)}
.st.beat{border-color:#3a3a3d}
.st.mute{opacity:.32}

footer{flex:none;border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:7px;align-items:center}
footer .sp{flex:1}
#make{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:500;padding:7px 16px}
#count.heavy{color:var(--hot)}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.modal[hidden]{display:none}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 20px 16px;width:100%;max-height:88vh;overflow-y:auto}
.mt{font-family:"Haettenschweiler","Impact",sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:24px;margin:0 0 8px;font-weight:400}
.ms{font-size:11.5px;color:var(--dim);margin:0 0 14px;line-height:1.75}
.ms b{color:var(--fg);font-weight:500}
.mlink{display:flex;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:7px;
  margin-bottom:7px;color:var(--fg);text-decoration:none;font-size:11.5px}
.mlink small{color:var(--dim);margin-left:5px}
.mcl{width:100%;margin-top:8px;padding:8px}
</style>

<div id="modal" class="modal" hidden>
  <div class="sheet">
    <p class="mt">Siren</p>
    <p class="ms" id="mSub"></p>
    <p class="ms" id="mBody"></p>
    <a class="mlink" href="https://kinoshita.studio" target="_blank" rel="noopener"><span>kinoshita studio</span><span>↗</span></a>
    <a class="mlink" href="https://99letters.bandcamp.com/album/kaibou-zukan" target="_blank" rel="noopener"><span>99LETTERS — Kaibou Zukan <small>Bandcamp</small></span><span>↗</span></a>
    <button id="mClose" class="mcl"></button>
  </div>
</div>

<header>
  <div class="wm"><h1 id="title">Siren</h1><span class="by">by Kinoshita Studio</span></div>
  <div class="iwrap">
    <button id="instBtn">Kick ▾</button>
    <div id="instMenu" class="imenu" hidden></div>
  </div>
  <div class="lang"><button id="langJa" class="on">JP</button><button id="langEn">EN</button></div>
</header>

<div class="scroll">
  <div id="stage"><svg id="art" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg"></svg></div>

  <div class="sec">
    <p class="lbl" id="lPre">Preset</p>
    <div class="chips" id="chips"></div>
  </div>

  <div class="sec">
    <p class="lbl" id="lSeq">Sequence</p>
    <div class="seq" id="seq"></div>
  </div>

  <!-- one panel per instrument. Only the chosen one is on screen. -->
  <div class="sec" id="vKick">
    <p class="lbl" id="lKick">Kick</p>
    <div class="row"><label>sink</label><input id="k_sink" type="range" min="0" max="1.2" step="0.01" value="0.72"><span class="val mono"></span></div>
    <div class="row"><label>reach</label><input id="k_reach" type="range" min="40" max="420" step="1" value="190"><span class="val mono"></span></div>
    <div class="row"><label>darken</label><input id="k_dark" type="range" min="0" max="1" step="0.01" value="0.62"><span class="val mono"></span></div>
    <div class="row"><label>edge</label><input id="k_curve" type="range" min="0.5" max="5" step="0.05" value="2.2"><span class="val mono"></span></div>
    <div class="row"><label>spread</label><input id="k_spread" type="range" min="0" max="2" step="0.01" value="0.4"><span class="val mono"></span></div>
    <div class="row"><label>debris</label><input id="k_debris" type="range" min="0" max="1" step="0.01" value="0"><span class="val mono"></span></div>
    <div class="row"><label>decay</label><input id="k_decay" type="range" min="0" max="1" step="0.01" value="0.4"><span class="val mono"></span></div>
    <div class="row"><label>glow</label><input id="k_glow" type="range" min="0" max="1.4" step="0.01" value="0.75"><span class="val mono"></span></div>
    <div class="row"><label>bloom</label><input id="k_bloom" type="range" min="0" max="180" step="1" value="70"><span class="val mono"></span></div>
    <div class="row"><label>relief</label><input id="k_relief" type="range" min="0" max="1.5" step="0.01" value="0.9"><span class="val mono"></span></div>
  </div>

  <div class="sec" id="vSnare" hidden>
    <p class="lbl" id="lSnare">Snare</p>
    <div class="row"><label>open</label><input id="s_amt" type="range" min="0" max="1" step="0.01" value="0"><span class="val mono"></span></div>
    <div class="row"><label>width</label><input id="s_w" type="range" min="0.2" max="2.5" step="0.01" value="0.6"><span class="val mono"></span></div>
    <div class="row"><label>length</label><input id="s_len" type="range" min="0.05" max="0.6" step="0.01" value="0.2"><span class="val mono"></span></div>
    <div class="row"><label>ring</label><input id="s_ring" type="range" min="0.1" max="0.95" step="0.01" value="0.5"><span class="val mono"></span></div>
  </div>

  <div class="sec" id="vHat" hidden>
    <p class="lbl" id="lHat">Hat</p>
    <div class="row"><label>grain</label><input id="h_amt" type="range" min="0" max="1" step="0.01" value="0"><span class="val mono"></span></div>
    <div class="row"><label>reach</label><input id="h_reach" type="range" min="40" max="360" step="1" value="120"><span class="val mono"></span></div>
    <div class="row"><label>ring</label><input id="h_ring" type="range" min="0.05" max="0.95" step="0.01" value="0.42"><span class="val mono"></span></div>
  </div>

  <div class="sec" id="vBass" hidden>
    <p class="lbl" id="lBass">Bass</p>
    <div class="row"><label>swell</label><input id="b_amt" type="range" min="0" max="1.2" step="0.01" value="0.5"><span class="val mono"></span></div>
    <div class="row"><label>arc</label><input id="b_arc" type="range" min="0.05" max="1" step="0.01" value="0.75"><span class="val mono"></span></div>
    <div class="row"><label>band</label><input id="b_width" type="range" min="0.05" max="1" step="0.01" value="0.45"><span class="val mono"></span></div>
    <div class="row"><label>ring</label><input id="b_ring" type="range" min="0.05" max="0.95" step="0.01" value="0.55"><span class="val mono"></span></div>
  </div>

  <div class="sec">
    <p class="lbl" id="lField">Field</p>
    <div class="row"><label>grid</label><input id="grid" type="range" min="6" max="64" step="1" value="22"><span class="val mono"></span></div>
    <div class="row"><label>size</label><input id="fill" type="range" min="0.2" max="1" step="0.01" value="1"><span class="val mono"></span></div>
    <div class="row"><label>humanize</label><input id="hum" type="range" min="0" max="1" step="0.01" value="0.35"><span class="val mono"></span></div>
    <div class="row"><label>bars</label><input id="bars" type="range" min="1" max="8" step="1" value="3"><span class="val mono"></span></div>
  </div>

  <div class="sec">
    <p class="lbl" id="lColour">Colour</p>
    <div class="row"><label>wash</label><input id="wash" type="range" min="0" max="1" step="0.01" value="0"><span class="val mono"></span></div>
    <div class="row"><label>sample</label><input id="sample" type="range" min="0" max="1" step="0.01" value="0"><span class="val mono"></span></div>
    <div class="row"><label>hue A</label><input id="h1" type="range" min="0" max="360" step="1" value="262"><span class="val mono"></span></div>
    <div class="row"><label>hue B</label><input id="h2" type="range" min="0" max="360" step="1" value="22"><span class="val mono"></span></div>
  </div>

  <div class="sec">
    <p class="lbl" id="lBg">Background</p>
    <div class="row"><label id="lPick">from art</label>
      <button id="pick" style="flex:1">素材の塗りを拾う</button>
      <button id="drop" class="sw" title="スポイト" hidden>⊙</button>
      <input id="swatch" class="sw" type="color" value="#000000"></div>
    <div class="row"><label>hue</label><input id="bgH" type="range" min="0" max="360" step="1" value="0"><span class="val mono"></span></div>
    <div class="row"><label>sat</label><input id="bgS" type="range" min="0" max="1" step="0.01" value="0"><span class="val mono"></span></div>
    <div class="row"><label>light</label><input id="bgL" type="range" min="0" max="1" step="0.01" value="0"><span class="val mono"></span></div>
  </div>

  <div class="sec">
    <p class="lbl" id="lLook">Look</p>
    <div style="display:flex;gap:6px;align-items:center">
      <button id="sq" class="on">■</button><button id="ci">●</button>
      <button id="flip">反転</button>
      <span style="flex:1"></span>
      <button id="dice">⟳</button>
    </div>
    <div class="row"><label id="lSurf">面</label>
      <button id="mPanel" class="on" style="flex:1">Panel</button>
      <button id="mDots" style="flex:1">Dots</button></div>
    <div class="row"><label id="lClip">形</label>
      <button id="clip" class="on" style="flex:1">素材の形で抜く</button></div>
    <div class="row"><label id="lInk">インク</label>
      <button id="inkAuto" class="on" style="flex:1">地に合わせる</button>
      <input id="inkSw" class="sw" type="color" value="#ebebeb"></div>
    <div class="row"><label>accent</label><input id="hue" type="range" min="0" max="360" step="1" value="55"><span class="val mono"></span></div>
  </div>
</div>

<footer>
  <button id="live">LIVE</button>
  <button id="undo">元に戻す</button>
  <span class="mono" id="count" style="color:var(--dim);font-size:10px"></span>
  <span class="sp"></span>
  <button id="make">鳴らす</button>
</footer>

<script>
'use strict'
const NS = 'http://www.w3.org/2000/svg'
let W = 1000, H = 1000            // set by whatever is selected in figma
const DEF = 1000
const art = document.getElementById('art')

/* Four instruments, four operators on one surface. Not four pictures.
   A kick is not a circle and a hat is not a speck of dust: they are different
   things done to the same field.
     kick  — hits it:      a wide, deep displacement (low frequency), and then
                           decays: what it tore loose comes down as dust
     snare — tears it:     the cells part and the ground shows through the split
     hat   — breaks it up: wherever it lands the grid subdivides (high frequency)
     bass  — swells it:    a sustained arc, not a point, and the band fattens */
const VOICES = ['kick','snare','hat','bass']
const V = {
  kick:  { on:[0,3,8,11], sink:0.72, reach:190, dark:0.48, curve:2.2, spread:0.4, debris:0,
           decay:0.4, glow:0.75, bloom:70, relief:0.9 },
  snare: { on:[4,12], amt:0, w:0.6, len:0.2, ring:0.5 },
  hat:   { on:[0,2,4,6,8,10,12,14], amt:0, reach:120, ring:0.42 },
  bass:  { on:[0,8], amt:0.5, arc:0.75, width:0.45, ring:0.55 },
}
let inst = 'kick'

// The default is the web version: black, white ink, one yellow accent.
// Colour is a preset, not a starting point.
// size 1 = the surface is closed. A hole is something the kick makes, not a
// property of the material. (Circles can never close: four of them always leave
// a diamond. Choose ■ for a rim with no holes at all.)
const P = { grid:22, fill:1, hum:0.35, bars:3, shape:'sq', hue:55, seed:7,
            h1:262, h2:22, wash:0, sample:0,
            bgH:0, bgS:0, bgL:0, useFill:false, flip:false,
            inkAuto:true, inkH:0, inkS:0, inkL:0.92, clip:true }
// light === "the surface is pale, so the ink must be dark"
const isLight = ()=> P.bgL > 0.5
/* The panel used to be whatever the ground was not: white on black, black on
   white. That is a good default and a bad law — a red ground turned the panel
   black and there was no way to say otherwise. The ground and the surface are
   two different colours, so they get two different controls. */
const inkArr = light => P.inkAuto ? (light ? [16,16,16] : [235,235,235])
                                  : hslArr(P.inkH, P.inkS, P.inkL)
let groundTouched = false      // once a ground is chosen by hand, stop guessing
let srcPaint = null            // the selected node's colour, averaged, for the ink maths
let srcFills = null            // the selected node's actual paints — gradients included

/* Light lives on black. Fons works on black for the same reason: SCREEN only
   ever adds, so a dark surface is the only one that has room to be lit. */
/* Not colour variants — one blow, deepening. Read a row left to right and you
   are watching a single hit arrive.

   ⚠ A preset only ever touches ITS OWN instrument, and only the depth of it.
   The ground, the accent, 反転, the shape, humanize — those are yours, and
   stepping through the stages must never take them back. */
const PRESETS = {
  kick: {
    Surface:  { sink:0,    dark:0,    curve:3.0, spread:0,    debris:0,    reach:120, decay:0, glow:0,    bloom:60,  relief:0   },
    Touch:    { sink:0.18, dark:0.18, curve:3.4, spread:0.10, debris:0,    reach:150, decay:0.15, glow:0.28, bloom:60,  relief:0.7 },
    Sink:     { sink:0.42, dark:0.34, curve:2.8, spread:0.25, debris:0,    reach:180, decay:0.28, glow:0.5,  bloom:80,  relief:0.9 },
    Hole:     { sink:0.72, dark:0.48, curve:2.2, spread:0.40, debris:0,    reach:210, decay:0.40, glow:0.75, bloom:70,  relief:0.9 },
    Through:  { sink:0.98, dark:0.66, curve:1.9, spread:0.70, debris:0.12, reach:235, decay:0.60, glow:1.1,  bloom:110, relief:1.1 },
    Collapse: { sink:1.05, dark:0.75, curve:1.6, spread:1.25, debris:0.35, reach:250, decay:0.70, glow:0.85, bloom:190, relief:1.3 },
    Scatter:  { sink:1.05, dark:0.75, curve:1.4, spread:1.9,  debris:0.6,  reach:265, decay:0.80, glow:0.80, bloom:220, relief:1.4 },
  },
  // how far the surface has come apart
  snare: {
    Off:      { amt:0,    w:0.6,  len:0.20, ring:0.50 },
    Hairline: { amt:0.20, w:0.35, len:0.14, ring:0.50 },
    Split:    { amt:0.45, w:0.60, len:0.20, ring:0.50 },
    Rift:     { amt:0.75, w:0.95, len:0.30, ring:0.52 },
    Shatter:  { amt:1,    w:1.40, len:0.44, ring:0.55 },
  },
  // 粒子。粒状の荒れ。how rough the surface has gone
  hat: {
    Off:      { amt:0,    reach:150, ring:0.42 },
    Grain:    { amt:0.28, reach:110, ring:0.42 },
    Sand:     { amt:0.50, reach:140, ring:0.44 },
    Powder:   { amt:0.72, reach:180, ring:0.48 },
    Mist:     { amt:0.95, reach:230, ring:0.54 },
  },
  // how much the sustained band lifts
  bass: {
    Off:      { amt:0,    arc:0.75, width:0.45, ring:0.55 },
    Breath:   { amt:0.25, arc:0.60, width:0.35, ring:0.55 },
    Swell:    { amt:0.50, arc:0.75, width:0.45, ring:0.55 },
    Surge:    { amt:0.80, arc:0.90, width:0.60, ring:0.55 },
    Bloom:    { amt:1.15, arc:1,    width:0.85, ring:0.55 },
  },
}
const DEFPRE = { kick:'Hole', snare:'Off', hat:'Off', bass:'Swell' }
const chosen_ = Object.assign({}, DEFPRE)

let live = false, busy = false

/* ---------------- language ---------------- */
const T = {
  ja:{ seq:'シーケンス', field:'Field — 面', colour:'Colour', look:'Look',
       make:'鳴らす', close:'閉じる',
       pre:'プリセット', bg:'背景', pick:'素材の塗りを拾う', from:'素材から', flip:'反転', surf:'面', ink:'インク', auto:'地に合わせる', shape:'形', clipT:'素材の形で抜く',
       inst:{ kick:'Kick — 面を殴る', snare:'Snare — 面を裂く',
              hat:'Hat — 面が荒れる',  bass:'Bass — 面を持ち上げる' },
       sub:{ kick:'低い周波数。広く、深い変位', snare:'トランジェント。セルが避けて口が開く',
             hat:'粒子。粒状の荒れ', bass:'持続音。点ではなく弧' },
       about:'名前は 99LETTERS のアルバム <i>Kaibou Zukan</i> の9曲目<b>「Siren（鳴物）」</b>から。鳴物は打楽器の総称。',

/* ---------------- rng + colour ---------------- */
function rng(seed){
  let a=seed>>>0
  return ()=>{ a=(a+0x6D2B79F5)|0
    let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t
    return ((t^(t>>>14))>>>0)/4294967296 }
}
function hslArr(h,sat,l){
  const a=sat*Math.min(l,1-l)
  const f=n=>{const k=(n+h/30)%12; return 255*(l-a*Math.max(-1,Math.min(k-3,Math.min(9-k,1))))}
  return [f(0),f(8),f(4)]
}
/* The ground: either the artwork's own paint, or the colour we dialled in. */
const groundArr = ()=> (P.useFill && srcPaint)
  ? [srcPaint.r*255, srcPaint.g*255, srcPaint.b*255]
  : hslArr(P.bgH,P.bgS,P.bgL)
/* rgb 0..1 -> hsl, so a colour picked off the artwork lands on the sliders */
function rgbToHsl(r,g,b){
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), l=(mx+mn)/2, d=mx-mn
  if(!d) return [0,0,l]
  const sat = l>0.5 ? d/(2-mx-mn) : d/(mx+mn)
  let h
  if(mx===r) h=((g-b)/d+(g<b?6:0))
  else if(mx===g) h=(b-r)/d+2
  else h=(r-g)/d+4
  return [h*60, sat, l]
}
const hueArr = h=>{ const k=n=>(n+h/30)%12, f=n=>255*(1-Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1))))
  return [f(0),f(8),f(4)] }
const hueCss = h=>{ const c=hueArr(h); return `rgb(${c.map(v=>Math.round(v)).join(',')})` }
const mix = (a,b,t)=> a.map((v,i)=> v+(b[i]-v)*t)
const css = c => `rgb(${c.map(v=>Math.round(Math.max(0,Math.min(255,v)))).join(',')})`

/* Draw the picked paint the way Figma stacks it: index 0 at the bottom, each
   one over the last at its own opacity. Painting only the top fill and calling
   it the ground is a lie the panel used to tell. */
function drawSrcFills(){
  if(!P.useFill || !srcFills || !srcFills.length) return false
  const defs = document.createElementNS(NS,'defs')
  let drew = false
  srcFills.forEach((p,i)=>{
    if(p.visible===false) return
    let fill
    if(p.type==='SOLID'){
      fill = css([p.color.r*255, p.color.g*255, p.color.b*255])
    } else if(p.gradientStops && p.gradientStops.length){
      const id = 'src'+i
      const stops = p.gradientStops.map(st =>
        `<stop offset="${st.position}" stop-color="rgb(${Math.round(st.color.r*255)},${Math.round(st.color.g*255)},${Math.round(st.color.b*255)})" stop-opacity="${st.color.a==null?1:st.color.a}"/>`
      ).join('')
      defs.innerHTML += p.type==='GRADIENT_RADIAL'
        ? `<radialGradient id="${id}">${stops}</radialGradient>`
        : `<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1">${stops}</linearGradient>`
      fill = `url(#${id})`
    } else return
    if(!drew){ art.append(defs); drew = true }
    const r = document.createElementNS(NS,'rect')
    r.setAttribute('width',W); r.setAttribute('height',H)
    r.setAttribute('fill', fill)
    r.setAttribute('opacity', p.opacity==null ? 1 : p.opacity)
    art.append(r)
  })
  return drew
}

/* A slider fires far faster than the panel can redraw a few thousand nodes.
   Coalesce onto the frame. */
let frameReq = 0
function render(){
  if(frameReq) return
  frameReq = requestAnimationFrame(()=>{ frameReq = 0; draw() })
}

/* ---------------- preview (svg, same maths as the plugin) ----------------
   ⚠ This function and make() in code.js must consume the RNG in exactly the
   same order, or the same seed draws two different pictures. Every `continue`,
   every short-circuited `R()` is part of the contract. Change one, change both. */
function draw(){
  const R = rng(P.seed*7919+13)
  const S = Math.min(W,H)
  art.setAttribute('viewBox', `0 0 ${W} ${H}`)
  // fit the target's shape into the panel: use the full width, cap the height
  const stage = document.getElementById('stage')
  const availW = Math.max(120, stage.clientWidth - 14)
  const k0 = Math.min(availW / W, 236 / H)
  art.style.width  = Math.round(W * k0) + 'px'
  art.style.height = Math.round(H * k0) + 'px'
  while(art.firstChild) art.removeChild(art.firstChild)

  const defs = document.createElementNS(NS,'defs')
  defs.innerHTML = `
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="${hueCss(P.h1)}"/><stop offset="1" stop-color="${hueCss(P.h2)}"/>
    </linearGradient>`
  art.append(defs)

  const chosen = groundArr()
  const pale = P.useFill && srcPaint
    ? (0.2126*chosen[0] + 0.7152*chosen[1] + 0.0722*chosen[2]) / 255 > 0.5
    : isLight()
  /* 反転 swaps the panel and the void. Turning the ink over while the ground
     stays put only makes the surface vanish into it. */
  const panel = pale ? [16,16,16] : [235,235,235]
  const ground = P.flip ? panel : chosen
  const light = P.flip ? !pale : pale
  const ink = inkArr(light)

  const bg = document.createElementNS(NS,'rect')
  bg.setAttribute('width',W); bg.setAttribute('height',H)
  bg.setAttribute('fill', css(ground)); art.append(bg)
  if(!P.flip) drawSrcFills()

  if(P.wash>0){
    const w = document.createElementNS(NS,'rect')
    w.setAttribute('width',W); w.setAttribute('height',H)
    w.setAttribute('fill','url(#wash)'); w.setAttribute('opacity',P.wash.toFixed(2)); art.append(w)
  }

  const F = field(R, W, H, S)
  const cells = paintCells(R, F, W, H, S, ground, ink, light)
  /* The lamps go UNDER the panel. Light on a white surface is a white smudge —
     SCREEN can only add, and a closed panel has nothing to add to. So the light
     lives beneath, the way the dark does, and it shows only where the surface
     broke and let it through. The panel hides its own glow until it is holed. */
  lamps(R, F, W, H, S, light)
  art.append(cells.gF)
  let n = cells.n + band(F, W, H) + dust(R, F, ink)

  const cEl = document.getElementById('count')
  cEl.textContent = n + ' nodes'
  cEl.classList.toggle('heavy', n > 4000)
}

/* ---- the field: run the sequence, build the three height maps + the tears --
   Shared, verbatim, with code.js. sink is what the kick digs; sub is how finely
   the hat has broken the surface; lift is the band the bass holds up. */
function field(R, W, H, S){
  const G=P.grid, cell=S/G
  const GX=Math.ceil(W/cell), GY=Math.ceil(H/cell)
  const sink=new Float32Array(GX*GY), grit=new Float32Array(GX*GY), lift=new Float32Array(GX*GY)
  const jit = a=>(R()*2-1)*a*P.hum
  const hits=[], tears=[], arcs=[]
  const K=V.kick

  for(let bar=0;bar<P.bars;bar++) for(let s=0;s<16;s++){
    const ang = (s/16)*Math.PI*2 - Math.PI/2 + jit(0.06)

    if(K.on.includes(s)){
      const r = S*0.5*0.30*(1+jit(0.10))
      const hx=W/2+Math.cos(ang)*r, hy=H/2+Math.sin(ang)*r
      const reach=K.reach*(1+jit(0.18))*(S/DEF)
      hits.push({x:hx,y:hy,r:reach})
      for(let gy=0;gy<GY;gy++) for(let gx=0;gx<GX;gx++){
        const cx=(gx+0.5)*cell, cy=(gy+0.5)*cell
        const d2=(cx-hx)*(cx-hx)+(cy-hy)*(cy-hy)
        sink[gy*GX+gx] += Math.exp(-d2/(reach*reach))
      }
    }
    /* A crack drawn as a line is an illustration of a crack. Here the cells
       themselves part: each tear pushes the surface aside along its own normal,
       and what shows in the gap is the ground that was always underneath. */
    if(V.snare.on.includes(s) && V.snare.amt>0){
      const r=S*0.5*V.snare.ring*(1+jit(0.06))
      const a=ang+jit(0.05)
      tears.push({ x:W/2+Math.cos(a)*r, y:H/2+Math.sin(a)*r, c:Math.cos(a), s:Math.sin(a),
                   len:S*V.snare.len*(0.6+R()*0.8), w:cell*V.snare.w*(0.7+R()*0.6) })
    }
    /* ハイハット = 粒子。粒状の荒れ。
       Not a shape. Not a smaller kick — a smaller kick belongs inside the kick.
       The hat adds nothing to the field; it roughens what the field already has.
       Where it lands, the cells go grainy: their value scatters and they lose a
       little of their size, so the ground shows between them. Add no nodes. */
    if(V.hat.on.includes(s) && V.hat.amt>0){
      const r=S*0.5*V.hat.ring*(1+jit(0.05))
      const hx=W/2+Math.cos(ang)*r, hy=H/2+Math.sin(ang)*r
      const reach=V.hat.reach*(1+jit(0.20))*(S/DEF)
      for(let gy=0;gy<GY;gy++) for(let gx=0;gx<GX;gx++){
        const cx=(gx+0.5)*cell, cy=(gy+0.5)*cell
        const d2=(cx-hx)*(cx-hx)+(cy-hy)*(cy-hy)
        grit[gy*GX+gx] += Math.exp(-d2/(reach*reach))
      }
    }
    /* A sustained note is not a point. It is held, so it is an arc — and a band
       of the surface stays lifted for as long as it rings. */
    if(V.bass.on.includes(s)){
      const span = V.bass.arc*Math.PI/2
      const ringR = S*0.5*V.bass.ring
      const band = Math.max(cell, V.bass.width*S*0.22)
      arcs.push({ang, span, ringR, band})
      for(let gy=0;gy<GY;gy++) for(let gx=0;gx<GX;gx++){
        const cx=(gx+0.5)*cell, cy=(gy+0.5)*cell
        const dr=Math.sqrt((cx-W/2)*(cx-W/2)+(cy-H/2)*(cy-H/2))-ringR
        const rad=Math.exp(-(dr*dr)/(band*band))
        if(rad<0.02) continue
        let da=Math.atan2(cy-H/2,cx-W/2)-ang
        da=(da%(Math.PI*2)+Math.PI*2)%(Math.PI*2)
        if(da>span) continue
        const e=Math.min(1, Math.min(da, span-da)/(span*0.35+1e-6))   // fade at both ends
        lift[gy*GX+gx] += rad*(e*e*(3-2*e))
      }
    }
  }

  let smax=0; for(const v of sink) if(v>smax) smax=v; if(smax<1e-6) smax=1
  let gmax=0; for(const v of grit) if(v>gmax) gmax=v; if(gmax<1e-6) gmax=1
  let lmax=0; for(const v of lift) if(v>lmax) lmax=v; if(lmax<1e-6) lmax=1
  return {cell,GX,GY,sink,grit,lift,smax,gmax,lmax,hits,tears,arcs}
}

/* the crater floor, sampled anywhere — not just at cell centres, because the
   hat's subcells sit between them */
function kAtF(F,x,y,curve){
  const fx=x/F.cell-0.5, fy=y/F.cell-0.5
  const x0=Math.floor(fx), y0=Math.floor(fy)
  const tx=fx-x0, ty=fy-y0
  const g=(gx,gy)=>F.sink[Math.min(F.GY-1,Math.max(0,gy))*F.GX + Math.min(F.GX-1,Math.max(0,gx))]
  const a=g(x0,y0)+(g(x0+1,y0)-g(x0,y0))*tx
  const b=g(x0,y0+1)+(g(x0+1,y0+1)-g(x0,y0+1))*tx
  return Math.pow(Math.max(0,(a+(b-a)*ty)/F.smax), curve)
}
function biAtF(arr,F,x,y){
  const fx=x/F.cell-0.5, fy=y/F.cell-0.5
  const x0=Math.floor(fx), y0=Math.floor(fy)
  const tx=fx-x0, ty=fy-y0
  const g=(gx,gy)=>arr[Math.min(F.GY-1,Math.max(0,gy))*F.GX + Math.min(F.GX-1,Math.max(0,gx))]
  const a=g(x0,y0)+(g(x0+1,y0)-g(x0,y0))*tx
  const b=g(x0,y0+1)+(g(x0+1,y0+1)-g(x0,y0+1))*tx
  return a+(b-a)*ty
}
const liftAtF = (F,x,y)=> biAtF(F.lift,F,x,y)/F.lmax
/* how far this cell has been pulled apart, and which way it goes */
function tearAt(F,x,y){
  let ox=0, oy=0, near=0
  for(const t of F.tears){
    const rx=x-t.x, ry=y-t.y
    const al=rx*t.c + ry*t.s
    const hl=t.len/2
    if(Math.abs(al)>hl) continue
    const pe=-rx*t.s + ry*t.c
    const ap=Math.abs(pe)
    if(ap>t.w) continue
    const u=al/hl
    const fall=(1-ap/t.w)*(1-u*u)
    if(fall<=0) continue
    const sg = pe<0 ? -1 : 1
    ox += -t.s*sg*fall*F.cell*1.1
    oy +=  t.c*sg*fall*F.cell*1.1
    if(fall>near) near=fall
  }
  return {ox,oy,near}
}

const LX=-0.62, LY=-0.62, LZ=0.48

function paintCells(R, F, W, H, S, ground, ink, light){
  const {cell,GX,GY,grit,gmax} = F
  const K=V.kick, HTv=V.hat, Sn=V.snare, Bs=V.bass
  const accent = hueArr(P.hue), cA = hueArr(P.h1), cB = hueArr(P.h2)
  const base = cell*P.fill
  const gF=document.createElementNS(NS,'g')
  let n=0

  /* ⭐ Only a cell that MOVED has to be a node.
     A fine grid costs thousands of rectangles, and almost all of them are asleep:
     closed, flat, the same colour as the one beside them. Those are not panels,
     they are one panel. Fold each run of sleeping cells into a single rectangle
     and spend the budget where something actually happened. */
  const asleep = new Uint8Array(GX*GY)
  const canFold = P.shape==='sq' && P.fill>0.9 && P.sample<0.02

  for(let gy=0;gy<GY;gy++) for(let gx=0;gx<GX;gx++){
    const gN = Math.min(1, grit[gy*GX+gx]/gmax)*HTv.amt      // how grainy it is here
    const px=(gx+0.5)*cell, py=(gy+0.5)*cell

    if(canFold && gN<0.02){
      const kC = kAtF(F,px,py,K.curve)
      const tC = Sn.amt>0 ? tearAt(F,px,py).near : 0
      // nothing reached this cell. It is still the surface it always was.
      if(kC<0.012 && tC<=0){ asleep[gy*GX+gx]=1; continue }
    }

    const k = kAtF(F,px,py,K.curve)          // the rim stays surface
    const dx=(kAtF(F,px+cell,py,K.curve)-kAtF(F,px-cell,py,K.curve))*0.5
    const dy=(kAtF(F,px,py+cell,K.curve)-kAtF(F,px,py-cell,K.curve))*0.5
    const shade=(dx*LX+dy*LY+LZ)/Math.sqrt(dx*dx+dy*dy+1)-LZ
    // displaced material: shoved down the slope, piled just outside the pit
    const slope=Math.sqrt(dx*dx+dy*dy)
    const swell=1 + K.spread*slope*3.2*(1-k)
    let size = base*(1-k*K.sink)*swell
    /* the hat, again: it roughens, it does not build. A grain of value and a
       grain of size — no new shape, no finer grid, no BIT. */
    let nz = 0
    if(gN>0.02){
      nz = R()*2-1
      size *= 1 - gN*(0.10 + 0.30*R())
    }
    if(!(size>0.6)) continue

    let push = K.spread*slope*cell*5.5
    // torn loose: no longer surface, so it loses its corners and is thrown clear
    const loose = K.debris>0 && k>0.2 && k<0.85 && R()<K.debris
    if(loose){ push *= 1.6+R()*2.4; size *= 0.35+R()*0.4 }
    // only a cell that is already moving gets nudged — a closed rim stays closed
    const j = cell*0.16*Math.min(1, k*3)
    let cx = px - dx/(slope||1)*push + (R()*2-1)*j*P.hum
    let cy = py - dy/(slope||1)*push + (R()*2-1)*j*P.hum

    const tr = tearAt(F,px,py)
    if(tr.near>0){
      cx += tr.ox*Sn.amt; cy += tr.oy*Sn.amt
      size *= 1 - tr.near*Sn.amt*0.5
      if(!(size>0.6)) continue
    }

    const tt=cx/W*0.6+cy/H*0.4
    let col=mix(ink, mix(cA,cB,tt), P.sample*(1-k*0.55))
    col=mix(col, ground, Math.min(1,k*K.dark*1.25))       // it falls into the hole
    if(shade>0)      col=mix(col,[255,255,255],Math.min(1, shade*2.2*K.relief))
    else if(shade<0) col=mix(col, ground,       Math.min(1,-shade*1.5*K.relief))
    const lit=(k-0.82)/0.18                                // only the floor is lit
    if(lit>0) col=mix(col, mix([255,255,255],accent,0.6), Math.min(1,lit*K.glow))
    if(tr.near>0) col=mix(col, ground, tr.near*Sn.amt*0.85)  // the split shows the ground
    if(gN>0.02){
      const g = 1 + nz*0.45*gN
      col = mix(col, ink.map(c=>Math.max(0,Math.min(255,c*g))), Math.min(0.85, gN*0.7))
    }

    const seam = (P.shape==='sq' && !loose && P.fill>0.9 && gN<0.02)
      ? cell*0.09*Math.min(1,(P.fill-0.9)/0.1)*(1-Math.min(1,k*1.5)) : 0
      const dsz = size + seam
      let el
      if(loose || P.shape==='ci'){
        el=document.createElementNS(NS,'circle')
        el.setAttribute('cx',cx.toFixed(2)); el.setAttribute('cy',cy.toFixed(2)); el.setAttribute('r',(size/2).toFixed(2))
      }else{
        el=document.createElementNS(NS,'rect')
        el.setAttribute('x',(cx-dsz/2).toFixed(2)); el.setAttribute('y',(cy-dsz/2).toFixed(2))
        el.setAttribute('width',dsz.toFixed(2)); el.setAttribute('height',dsz.toFixed(2))
      const rot=(R()*2-1)*6*P.hum*Math.min(1, k*3)
        if(Math.abs(rot)>0.2) el.setAttribute('transform',`rotate(${rot.toFixed(2)} ${cx.toFixed(2)} ${cy.toFixed(2)})`)
      }
      el.setAttribute('fill',css(col))
      const op = loose ? Math.max(0.15,(1-k*0.28)*(0.35+R()*0.5)) : (1-k*0.28)
      if(k>0.02 || loose) el.setAttribute('opacity',op.toFixed(2))
    gF.append(el); n++
  }

  /* one rectangle per horizontal run of sleeping cells */
  const flat = css(ink)
  const over = cell*0.14
  for(let gy=0;gy<GY;gy++){
    let x0=-1
    for(let gx=0;gx<=GX;gx++){
      const on = gx<GX && asleep[gy*GX+gx]
      if(on && x0<0) x0=gx
      else if(!on && x0>=0){
        const r=document.createElementNS(NS,'rect')
        r.setAttribute('x',(x0*cell-over).toFixed(2)); r.setAttribute('y',(gy*cell-over).toFixed(2))
        r.setAttribute('width',((gx-x0)*cell+over*2).toFixed(2)); r.setAttribute('height',(cell+over*2).toFixed(2))
        r.setAttribute('fill',flat)
        gF.insertBefore(r, gF.firstChild); n++
        x0=-1
      }
    }
  }
  return {n, gF}
}

/* The same lamps the plugin builds. Keep them identical or the panel lies.
   SCREEN only adds, MULTIPLY only subtracts — so a pale ground can carry the
   shadows and nothing else. Blur radii are fractions of the crater diameter D.
   On a pale ground the SCREEN half adds nothing and the MULTIPLY half survives
   alone as black balls. Place none of them there. */
function lamps(R, F, W, H, S, light){
  const K=V.kick
  if(!(K.glow>0 && F.hits.length && K.relief>0 && !light)) return
  const accent = hueArr(P.hue)
  const LN=Math.sqrt(LX*LX+LY*LY), ux=LX/LN, uy=LY/LN
  const gl=Math.min(1.4,K.glow)
  const defs2=document.createElementNS(NS,'defs')
  art.append(defs2)
  let uid=0
  const lamp=(h,o)=>{
    const D=h.r*2, d=D*o.size
    if(!(d>0.5)) return
    const id='L'+(uid++)
    // a spark flies away from where the hit happened, not from the light
    let dirx = o.away ? -ux : ux, diry = o.away ? -uy : uy
    if(o.burst){
      const rx=h.x-W/2, ry=h.y-H/2, rl=Math.sqrt(rx*rx+ry*ry)
      if(rl>1e-3){ const a=Math.atan2(ry,rx)+(R()*2-1)*0.6; dirx=Math.cos(a); diry=Math.sin(a) }
    }
    defs2.innerHTML +=
      `<radialGradient id="g${id}">`+
      `<stop offset="0" stop-color="${css(o.c)}" stop-opacity="${o.a}"/>`+
      `<stop offset="0.45" stop-color="${css(o.c)}" stop-opacity="${o.a*0.3}"/>`+
      `<stop offset="1" stop-color="${css(o.c)}" stop-opacity="0"/></radialGradient>`+
      `<filter id="f${id}" x="-80%" y="-80%" width="260%" height="260%">`+
      `<feGaussianBlur stdDeviation="${Math.max(0.3, D*o.blur*0.5).toFixed(2)}"/></filter>`
    const c=document.createElementNS(NS,'circle')
    c.setAttribute('cx',(h.x+D*o.off*dirx).toFixed(1))
    c.setAttribute('cy',(h.y+D*o.off*diry).toFixed(1))
    c.setAttribute('r',(d/2).toFixed(1))
    c.setAttribute('fill',`url(#g${id})`)
    c.setAttribute('filter',`url(#f${id})`)
    c.setAttribute('opacity',Math.max(0,Math.min(1,o.op)).toFixed(2))
    c.setAttribute('style','mix-blend-mode:'+o.mode)
    art.append(c)
  }
  const WH=[255,255,255]
  for(const h of F.hits){
    // No occlusion, no shadow. The dark is not painted on: it is the ground,
    // and it appears because the panels fell away from it.
    const throwOut = 0.08 + K.spread*0.10   // it still flies outward, but the panel is over it
    lamp(h,{c:WH,    a:0.90,size:0.20,off:throwOut,burst:1,blur:0.06,mode:'screen',    op:0.75*gl})
    lamp(h,{c:accent,a:0.30,size:0.60,off:throwOut,burst:1,blur:0.20,mode:'soft-light',op:0.7*gl})
  }
}

/* ---- bass: a held note is a surface, not a point ---------------------------
   A drum is a cell. A sustained note is not — it has no edge and no instant, so
   it cannot be a square. It is a band of the field, held up for as long as it
   rings, and the only honest way to draw that is the way Fons draws everything:
   a blurred gradient shape. SOFT_LIGHT, so it lifts the white panel without
   burning it out and lifts the ground without turning it into a lamp.

   Different instrument, different part. That is the whole point of a mixer. */
function band(F, W, H){
  const B=V.bass
  if(!(B.amt>0) || !F.arcs.length) return 0
  let n=0, uid=0
  const defs=document.createElementNS(NS,'defs')
  art.append(defs)
  for(const a of F.arcs){
    const beads=7
    for(let i=0;i<=beads;i++){
      const t=i/beads
      const e=Math.min(1, Math.min(t,1-t)/0.34)      // the note swells and dies
      const op=B.amt*0.45*(e*e*(3-2*e))
      if(op<0.012) continue
      const th=a.ang + a.span*t
      const cx=W/2+Math.cos(th)*a.ringR, cy=H/2+Math.sin(th)*a.ringR
      const d=a.band*1.7
      const id='B'+(uid++)
      defs.innerHTML +=
        `<radialGradient id="b${id}"><stop offset="0" stop-color="#fff" stop-opacity="0.92"/>`+
        `<stop offset="0.5" stop-color="#fff" stop-opacity="0.35"/>`+
        `<stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>`+
        `<filter id="fb${id}" x="-70%" y="-70%" width="240%" height="240%">`+
        `<feGaussianBlur stdDeviation="${(a.band*0.30).toFixed(2)}"/></filter>`
      const c=document.createElementNS(NS,'circle')
      c.setAttribute('cx',cx.toFixed(1)); c.setAttribute('cy',cy.toFixed(1)); c.setAttribute('r',(d/2).toFixed(1))
      c.setAttribute('fill',`url(#b${id})`); c.setAttribute('filter',`url(#fb${id})`)
      c.setAttribute('opacity',op.toFixed(3))
      c.setAttribute('style','mix-blend-mode:soft-light')
      art.append(c); n++
    }
  }
  return n
}

/* ---- dust: the pieces that came down --------------------------------------
   There are no shock rings here, and there is no ripple in the height field
   either. Both were tried. A ring painted over the panel is white light on a
   white surface and it vanishes; a ripple shaded into the cells turns the field
   into a staircase, because every cell is a shape and a thousand shapes look
   like a thousand shapes. Smooth shading is not something a vector synth can
   say. It is what Kaibou is for — blur is reverb, and reverb belongs after the
   instrument, not inside it.

   So the decay is this: debris that has settled. It is the panel's own colour,
   so it can only be seen where the panel is gone — inside the crater, where the
   ground shows through. That is where it fell. */
function dust(R, F, ink){
  const K=V.kick
  if(!(K.decay>0) || !F.hits.length) return 0
  let n=0
  const inkCss=css(ink)
  for(const h of F.hits){
    const cnt = Math.round(K.decay*30)
    for(let i=0;i<cnt;i++){
      const a = R()*Math.PI*2
      const u = R()
      const rr = h.r*(0.18 + Math.pow(u,0.55)*0.92)   // the hollow, not the field
      const sz = F.cell*0.14*(0.3+R()*0.85)
      if(!(sz>0.3)) continue
      const el=document.createElementNS(NS,'rect')
      el.setAttribute('x',(h.x+Math.cos(a)*rr-sz/2).toFixed(2))
      el.setAttribute('y',(h.y+Math.sin(a)*rr-sz/2).toFixed(2))
      el.setAttribute('width',sz.toFixed(2)); el.setAttribute('height',sz.toFixed(2))
      el.setAttribute('fill',inkCss)
      el.setAttribute('opacity',(K.decay*(0.3+0.7*(1-u))*0.8).toFixed(2))
      art.append(el); n++
    }
  }
  return n
}

/* ---------------- to figma ---------------- */
function payload(){
  return Object.assign({}, P, {
    srcFills: P.useFill ? srcFills : null,
    v: JSON.parse(JSON.stringify(V)),
  })
}
let pendingSend = null       // a release that landed mid-flight; never drop it
function send(type){
  if(busy){ pendingSend = type; return }
  busy = true
  parent.postMessage({pluginMessage:{type, p:payload()}}, '*')
  setTimeout(()=>{
    busy = false
    if(pendingSend){ const t2 = pendingSend; pendingSend = null; send(t2) }
  }, 120)
}
function onRelease(){ if(live) send('live') }

const liveBtn = document.getElementById('live')
liveBtn.onclick = ()=>{
  live = !live
  liveBtn.classList.toggle('on', live)
  if(live) send('live')
  else parent.postMessage({pluginMessage:{type:'discard'}}, '*')   // a preview is never kept
}
document.getElementById('undo').onclick = ()=>{
  parent.postMessage({pluginMessage:{type:'discard'}}, '*')
  live = false; liveBtn.classList.remove('on')
}
document.getElementById('make').onclick = ()=>{
  live = false; liveBtn.classList.remove('on')
  send('make')
}

onmessage = e=>{
  const m = e.data.pluginMessage
  if(!m) return
  if(m.type==='target'){
    W = m.w || 1000; H = m.h || 1000
    srcPaint = m.paint || null
    srcFills = m.fills || null
    // Match the artwork by default. Nobody wants to press a button to be told
    // what colour the thing they just selected is.
    if(srcFills && !groundTouched) P.useFill = true
    if(!srcFills){ P.useFill = false }
    document.getElementById('pick').classList.toggle('on', !!P.useFill)
    document.getElementById('pick').disabled = !srcFills
    paintSwatch(); render()
  }
  if(m.type==='error') document.getElementById('count').textContent = 'ERR: ' + m.message
}

applyLang(); paintSwatch(); paintInk(); render()
parent.postMessage({pluginMessage:{type:'target'}}, '*')
