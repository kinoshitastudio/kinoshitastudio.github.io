<!doctype html>
<meta charset="utf-8">
<style>
:root{ --bg:#0b0b0c; --fg:#e9e9e9; --dim:#78787b; --line:#242426; --panel:#151516; --hot:#ff8a3d }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:400 12px/1.55 -apple-system,ui-sans-serif,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column}
.mono{font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}

header{padding:12px 14px 10px;border-bottom:1px solid var(--line);flex:none;
  display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-family:"Haettenschweiler","Impact","Arial Narrow Bold",sans-serif;font-size:20px;
  letter-spacing:.06em;text-transform:uppercase;margin:0;font-weight:400;cursor:pointer}
h1:hover{opacity:.82}
.wm{display:flex;align-items:baseline;gap:6px;min-width:0}
.by{font-size:6.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);white-space:nowrap;opacity:.75}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{padding:4px 8px;font-size:10px;border-radius:20px}
.sw{width:22px;height:22px;border-radius:5px;border:1px solid var(--line);flex:none;padding:0;
     background:transparent;cursor:pointer}
input[type=color]{-webkit-appearance:none;appearance:none}
input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
input[type=color]::-webkit-color-swatch{border:none;border-radius:3px}
.lang{display:flex;flex:none}
.lang button{border-radius:0;padding:4px 9px;font-size:10.5px}
.lang button:first-child{border-radius:5px 0 0 5px}
.lang button:last-child{border-radius:0 5px 5px 0;margin-left:-1px}

.scroll{flex:1;overflow-y:auto;padding:12px 14px 0;position:relative}
/* the preview earns its keep, but the sequencer has to stay reachable */
#stage{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#000;margin-bottom:10px;
  position:sticky;top:0;z-index:3;box-shadow:0 8px 16px -8px #000;
  display:grid;place-items:center;padding:6px}
#art{display:block}
#stage{min-height:120px}

button{font:inherit;font-size:11px;color:var(--fg);background:transparent;border:1px solid var(--line);
  border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--dim)}
button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.sec{border:1px solid var(--line);border-radius:8px;padding:11px 12px;margin-bottom:9px;background:var(--panel)}
.lbl{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin:0 0 8px}
.row{display:flex;align-items:center;gap:8px;margin-top:6px}
.row label{font-size:10px;color:var(--dim);width:58px;flex:none}
input[type=range]{flex:1;accent-color:var(--fg);height:3px}
.val{font-size:10px;width:42px;text-align:right;flex:none}

.seq{display:grid;grid-template-columns:44px repeat(16,1fr);gap:2px;align-items:center}
.trk{font-size:9px;color:var(--dim)}
.st{aspect-ratio:1;border:1px solid var(--line);border-radius:2px;cursor:pointer}
.st.on{background:var(--fg);border-color:var(--fg)}
.st.beat{border-color:#3a3a3d}

footer{flex:none;border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:7px;align-items:center}
footer .sp{flex:1}
#make{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:500;padding:7px 16px}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.modal[hidden]{display:none}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 20px 16px;width:100%;max-height:88vh;overflow-y:auto}
.mt{font-family:"Haettenschweiler","Impact",sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:24px;margin:0 0 8px;font-weight:400}
.ms{font-size:11.5px;color:var(--dim);margin:0 0 14px;line-height:1.75}
.ms b{color:var(--fg);font-weight:500}
.mlink{display:flex;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:7px;
  margin-bottom:7px;color:var(--fg);text-decoration:none;font-size:11.5px}
.mlink small{color:var(--dim);margin-left:5px}
.mcl{width:100%;margin-top:8px;padding:8px}
</style>

<div id="modal" class="modal" hidden>
  <div class="sheet">
    <p class="mt">Siren</p>
    <p class="ms" id="mSub"></p>
    <p class="ms" id="mBody"></p>
    <a class="mlink" href="https://kinoshita.studio" target="_blank" rel="noopener"><span>kinoshita studio</span><span>↗</span></a>
    <a class="mlink" href="https://99letters.bandcamp.com/album/kaibou-zukan" target="_blank" rel="noopener"><span>99LETTERS — Kaibou Zukan <small>Bandcamp</small></span><span>↗</span></a>
    <button id="mClose" class="mcl"></button>
  </div>
</div>

<header>
  <div class="wm"><h1 id="title">Siren</h1><span class="by">by Kinoshita Studio</span></div>
  <div class="lang"><button id="langJa" class="on">JP</button><button id="langEn">EN</button></div>
</header>

<div class="scroll">
  <div id="stage"><svg id="art" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg"></svg></div>

  <div class="sec">
    <p class="lbl" id="lPre">Preset</p>
    <div class="chips" id="chips"></div>
  </div>

  <div class="sec">
    <p class="lbl" id="lSeq">Sequence</p>
    <div class="seq" id="seq"></div>
  </div>

  <div class="sec">
    <p class="lbl" id="lKick">Kick</p>
    <div class="row"><label>sink</label><input id="sink" type="range" min="0" max="1.2" step="0.01" value="0.72"><span class="val mono"></span></div>
    <div class="row"><label>reach</label><input id="reach" type="range" min="40" max="420" step="1" value="190"><span class="val mono"></span></div>
    <div class="row"><label>darken</label><input id="dark" type="range" min="0" max="1" step="0.01" value="0.62"><span class="val mono"></span></div>
    <div class="row"><label>edge</label><input id="curve" type="range" min="0.5" max="5" step="0.05" value="2.2"><span class="val mono"></span></div>
    <div class="row"><label>spread</label><input id="spread" type="range" min="0" max="2" step="0.01" value="0.4"><span class="val mono"></span></div>
    <div class="row"><label>debris</label><input id="debris" type="range" min="0" max="1" step="0.01" value="0"><span class="val mono"></span></div>
  </div>

  <div class="sec">
    <p class="lbl" id="lField">Field</p>
    <div class="row"><label>grid</label><input id="grid" type="range" min="6" max="24" step="1" value="20"><span class="val mono"></span></div>
    <div class="row"><label>size</label><input id="fill" type="range" min="0.2" max="1" step="0.01" value="1"><span class="val mono"></span></div>
    <div class="row"><label>humanize</label><input id="hum" type="range" min="0" max="1" step="0.01" value="0.35"><span class="val mono"></span></div>
    <div class="row"><label>bars</label><input id="bars" type="range" min="1" max="8" step="1" value="3"><span class="val mono"></span></div>
  </div>

  <div class="sec">
    <p class="lbl" id="lLight">Light</p>
    <div class="row"><label>glow</label><input id="glow" type="range" min="0" max="1.4" step="0.01" value="0.75"><span class="val mono"></span></div>
    <div class="row"><label>spread</label><input id="blur" type="range" min="0" max="180" step="1" value="70"><span class="val mono"></span></div>
    <div class="row"><label>wash</label><input id="wash" type="range" min="0" max="1" step="0.01" value="0"><span class="val mono"></span></div>
    <div class="row"><label>relief</label><input id="relief" type="range" min="0" max="1.5" step="0.01" value="0.9"><span class="val mono"></span></div>
    <div class="row"><label>sample</label><input id="sample" type="range" min="0" max="1" step="0.01" value="0"><span class="val mono"></span></div>
    <div class="row"><label>hue A</label><input id="h1" type="range" min="0" max="360" step="1" value="262"><span class="val mono"></span></div>
    <div class="row"><label>hue B</label><input id="h2" type="range" min="0" max="360" step="1" value="22"><span class="val mono"></span></div>
  </div>

  <div class="sec">
    <p class="lbl" id="lVoice">Voices</p>
    <div class="row"><label>snare</label><input id="crack" type="range" min="0" max="1" step="0.01" value="0.7"><span class="val mono"></span></div>
    <div class="row"><label>hat</label><input id="dust" type="range" min="0" max="1" step="0.01" value="0.6"><span class="val mono"></span></div>
    <div class="row"><label>bass</label><input id="bass" type="range" min="0" max="1" step="0.01" value="0.5"><span class="val mono"></span></div>
  </div>

  <div class="sec">
    <p class="lbl" id="lBg">Background</p>
    <div class="row"><label id="lPick">from art</label>
      <button id="pick" style="flex:1">素材の塗りを拾う</button>
      <button id="drop" class="sw" title="スポイト" hidden>⊙</button>
      <input id="swatch" class="sw" type="color" value="#000000"></div>
    <div class="row"><label>hue</label><input id="bgH" type="range" min="0" max="360" step="1" value="0"><span class="val mono"></span></div>
    <div class="row"><label>sat</label><input id="bgS" type="range" min="0" max="1" step="0.01" value="0"><span class="val mono"></span></div>
    <div class="row"><label>light</label><input id="bgL" type="range" min="0" max="1" step="0.01" value="0"><span class="val mono"></span></div>
  </div>

  <div class="sec">
    <p class="lbl" id="lLook">Look</p>
    <div style="display:flex;gap:6px;align-items:center">
      <button id="sq" class="on">■</button><button id="ci">●</button>
      <button id="flip">反転</button>
      <span style="flex:1"></span>
      <button id="dice">⟳</button>
    </div>
    <div class="row"><label>accent</label><input id="hue" type="range" min="0" max="360" step="1" value="55"><span class="val mono"></span></div>
  </div>
</div>

<footer>
  <button id="live">LIVE</button>
  <button id="undo">元に戻す</button>
  <span class="mono" id="count" style="color:var(--dim);font-size:10px"></span>
  <span class="sp"></span>
  <button id="make">鳴らす</button>
</footer>

<script>
'use strict'
const NS = 'http://www.w3.org/2000/svg'
let W = 1000, H = 1000            // set by whatever is selected in figma
const DEF = 1000
const art = document.getElementById('art')

const TRACKS = [
  {key:'kick',  on:[0,3,8,11]},
  {key:'snare', on:[4,12]},
  {key:'hat',   on:[0,2,4,6,8,10,12,14]},
  {key:'bass',  on:[0,8]},
]
// The default is the web version: black, white ink, one yellow accent.
// Colour is a preset, not a starting point.
// size 1 = the surface is closed. A hole is something the kick makes, not a
// property of the material. (Circles can never close: four of them always leave
// a diamond. Choose ■ for a rim with no holes at all.)
const P = { sink:0.72, reach:190, dark:0.62, grid:20, fill:1, hum:0.35, bars:3,
            crack:0.7, dust:0.6, bass:0.5, shape:'sq', hue:55, seed:7, curve:2.2, spread:0.4, debris:0,
            glow:0.75, blur:70, h1:262, h2:22, wash:0, sample:0, relief:0.9,
            bgH:0, bgS:0, bgL:0, useFill:false, flip:false }
// light === "the surface is pale, so the ink must be dark"
const isLight = ()=> P.bgL > 0.5
let groundTouched = false      // once a ground is chosen by hand, stop guessing
let srcPaint = null            // the selected node's colour, averaged, for the ink maths
let srcFills = null            // the selected node's actual paints — gradients included

/* Light lives on black. Fons works on black for the same reason: SCREEN only
   ever adds, so a dark surface is the only one that has room to be lit. */
/* Not colour variants — the same blow, deepening. Read them left to right and
   you are watching one kick arrive.

   A stage only ever touches DEPTH. The ground, the accent, 反転, the shape —
   those are yours, and stepping through the stages must never take them back. */
const PRESETS = {
  Surface:  { sink:0,    dark:0,    glow:0,    blur:60,  curve:3.0, crack:0,   dust:0,    hum:0,    relief:0,   spread:0,    debris:0,    reach:120 },
  Touch:    { sink:0.18, dark:0.25, glow:0.28, blur:60,  curve:3.4, crack:0,   dust:0.15, hum:0.15, relief:0.7, spread:0.10, debris:0,    reach:150 },
  Sink:     { sink:0.42, dark:0.45, glow:0.5,  blur:80,  curve:2.8, crack:0.2, dust:0.35, hum:0.25, relief:0.9, spread:0.25, debris:0,    reach:180 },
  Hole:     { sink:0.72, dark:0.62, glow:0.75, blur:70,  curve:2.2, crack:0.5, dust:0.5,  hum:0.35, relief:0.9, spread:0.40, debris:0,    reach:210 },
  Through:  { sink:0.98, dark:0.85, glow:1.1,  blur:110, curve:1.7, crack:0.7, dust:0.6,  hum:0.45, relief:1.1, spread:0.70, debris:0.12, reach:280 },
  Collapse: { sink:1.2,  dark:1,    glow:1.35, blur:150, curve:1.0, crack:1,   dust:0.95, hum:0.7,  relief:1.3, spread:1.25, debris:0.4,  reach:400 },
  Scatter:  { sink:1.2,  dark:1,    glow:1.4,  blur:170, curve:0.7, crack:1,   dust:1,    hum:0.85, relief:1.4, spread:1.9,  debris:0.85, reach:420 },
}

let live = false, busy = false

/* ---------------- language ---------------- */
const T = {
  ja:{ seq:'シーケンス', kick:'Kick — 面を殴る', field:'Field — 面', light:'Light — 殴った跡は光る',
       voice:'Voices', look:'Look', make:'鳴らす', close:'閉じる',
       pre:'プリセット', bg:'背景', pick:'素材の塗りを拾う', from:'素材から', flip:'反転',
       about:'名前は 99LETTERS のアルバム <i>Kaibou Zukan</i> の9曲目<b>「Siren（鳴物）」</b>から。鳴物は打楽器の総称。',
       body:'<b>キックは丸ではない。キックは、面が受けた打撃の跡。</b>見えないグリッドの上をシーケンスが一周し、キックが鳴った角度のセルが沈む。近いほど深く。<br><br>殴った跡は<b>沈むと同時に光る</b>。光はぼかした放射グラデ。Fons のあの質感は 3D ではなく、<b>ぼかしたグラデ図形を重ねたもの</b>。同じ部品を、手ではなくリズムが置く。<br><br><b>出てくるのは全部ベクター。</b>楕円も矩形もグラデもレイヤーブラーも Figma のネイティブノード。色は後から変えられる。<b>ここから Kaibou に通せば、作品になる。</b>' },
  en:{ seq:'Sequence', kick:'Kick — it hits the surface', field:'Field', light:'Light — the dent glows',
       voice:'Voices', look:'Look', make:'Play', close:'Close',
       pre:'Preset', bg:'Background', pick:'wear the artwork\u2019s paint', from:'from art', flip:'Invert',
       about:'Named after <b>Siren (鳴物)</b>, track 9 of <i>Kaibou Zukan</i> by 99LETTERS. 鳴物 is the word for percussion.',
       body:'<b>A kick is not a circle. A kick is the mark a surface takes.</b> The sequence goes once around an invisible grid; wherever the kick lands, the cells cave in. Closer means deeper.<br><br>The dent <b>sinks and glows at once</b>. Fons\\u2019s surfaces are not 3D — they are <b>blurred gradient shapes, stacked</b>. Here the rhythm places them instead of the hand.<br><br><b>Everything it makes is vector.</b> Ellipses, rectangles, gradients, layer blur — native Figma nodes. Recolour them later. <b>Run it through Kaibou and it becomes a piece.</b>' }
}
let lang = 'ja'
const t = ()=>T[lang]
function applyLang(){
  document.getElementById('lSeq').textContent = t().seq
  document.getElementById('lKick').textContent = t().kick
  document.getElementById('lField').textContent = t().field
  document.getElementById('lLight').textContent = t().light
  document.getElementById('lVoice').textContent = t().voice
  document.getElementById('lLook').textContent = t().look
  document.getElementById('make').textContent = t().make
  document.getElementById('lPre').textContent = t().pre
  document.getElementById('lBg').textContent = t().bg
  document.getElementById('lPick').textContent = t().from
  document.getElementById('pick').textContent = t().pick
  document.getElementById('flip').textContent = t().flip
  document.getElementById('undo').textContent = lang==='ja' ? '元に戻す' : 'Discard'
  document.getElementById('mClose').textContent = t().close
  document.getElementById('mSub').innerHTML = t().about
  document.getElementById('mBody').innerHTML = t().body
  document.getElementById('langJa').classList.toggle('on', lang==='ja')
  document.getElementById('langEn').classList.toggle('on', lang==='en')
}
document.getElementById('langJa').onclick = ()=>{ lang='ja'; applyLang() }
document.getElementById('langEn').onclick = ()=>{ lang='en'; applyLang() }

const modal = document.getElementById('modal')
document.getElementById('title').onclick = ()=>{ modal.hidden=false }
document.getElementById('mClose').onclick = ()=>{ modal.hidden=true }
modal.onclick = e=>{ if(e.target===modal) modal.hidden=true }
addEventListener('keydown', e=>{ if(e.key==='Escape') modal.hidden=true })

/* ---------------- sequencer ---------------- */
const seqEl = document.getElementById('seq')
for(const tr of TRACKS){
  const l = document.createElement('div'); l.className='trk'; l.textContent = tr.key
  seqEl.append(l)
  for(let i=0;i<16;i++){
    const b = document.createElement('div')
    b.className = 'st' + (tr.on.includes(i)?' on':'') + (i%4===0?' beat':'')
    b.onclick = ()=>{
      const k = tr.on.indexOf(i)
      if(k<0) tr.on.push(i); else tr.on.splice(k,1)
      b.classList.toggle('on'); render(); onRelease()
    }
    seqEl.append(b)
  }
}

/* ---------------- params ---------------- */
const pc = v=>Math.round(v*100)+'%'
const SHOW = {}
function bind(id,key,fmt){
  SHOW[key] = fmt
  const el = document.getElementById(id)
  const out = el.parentElement.querySelector('.val')
  const show = ()=>{ out.textContent = fmt(P[key]) }
  el.oninput = ()=>{ P[key]=+el.value; show(); render() }
  el.onchange = onRelease
  show()
}
bind('sink','sink',pc); bind('reach','reach',v=>v); bind('dark','dark',pc)
bind('curve','curve',v=>v.toFixed(1)+'×'); bind('spread','spread',pc); bind('debris','debris',pc)
bind('grid','grid',v=>v); bind('fill','fill',pc); bind('hum','hum',pc); bind('bars','bars',v=>v)
bind('glow','glow',pc); bind('blur','blur',v=>v); bind('wash','wash',pc); bind('sample','sample',pc)
bind('relief','relief',pc)
bind('h1','h1',v=>v+'°'); bind('h2','h2',v=>v+'°')
bind('crack','crack',pc); bind('dust','dust',pc); bind('bass','bass',pc); bind('hue','hue',v=>v+'°')
bind('bgH','bgH',v=>v+'°'); bind('bgS','bgS',pc); bind('bgL','bgL',pc)
for(const id of ['bgH','bgS','bgL']){
  const el = document.getElementById(id), prev = el.oninput
  el.oninput = (e)=>{
    P.useFill = false; groundTouched = true
    document.getElementById('pick').classList.remove('on')
    prev(e)
    // at light 0 every hue is black, so those two knobs would be dead.
    // Lift the ground just off the floor the moment someone reaches for colour.
    if((id==='bgH' || id==='bgS') && P.bgL < 0.02){
      P.bgL = 0.08
      const l = document.getElementById('bgL')
      l.value = P.bgL
      l.parentElement.querySelector('.val').textContent = SHOW.bgL(P.bgL)
      render()
    }
    paintSwatch()
  }
  el.onchange = onRelease
}

const swatch = document.getElementById('swatch')   // <input type="color">
const hex2 = v=>('0'+Math.round(Math.max(0,Math.min(255,v))).toString(16)).slice(-2)
function paintSwatch(){
  const g = groundArr()
  swatch.value = '#' + hex2(g[0]) + hex2(g[1]) + hex2(g[2])
}

/* Any colour, from anywhere. The native picker carries an eyedropper, so a
   ground can be lifted straight off the artwork on screen. */
function setGround(r,g,b){
  const [h,sat,l] = rgbToHsl(r/255, g/255, b/255)
  P.useFill = false; groundTouched = true
  document.getElementById('pick').classList.remove('on')
  P.bgH = Math.round(h); P.bgS = +sat.toFixed(2); P.bgL = +l.toFixed(3)
  syncUI(); render()
}
swatch.oninput = ()=>{
  const v = swatch.value
  setGround(parseInt(v.slice(1,3),16), parseInt(v.slice(3,5),16), parseInt(v.slice(5,7),16))
}
swatch.onchange = onRelease

const drop = document.getElementById('drop')
if(typeof EyeDropper === 'function'){
  drop.hidden = false
  drop.onclick = async ()=>{
    try{
      const { sRGBHex } = await new EyeDropper().open()
      setGround(parseInt(sRGBHex.slice(1,3),16), parseInt(sRGBHex.slice(3,5),16), parseInt(sRGBHex.slice(5,7),16))
      onRelease()
    }catch(e){ /* the user pressed escape */ }
  }
}

/* Pull every knob back to P — presets and picked colours have to show up. */
function syncUI(){
  for(const [id,key] of [['sink','sink'],['reach','reach'],['dark','dark'],['grid','grid'],
      ['curve','curve'],['spread','spread'],['debris','debris'],['fill','fill'],['hum','hum'],['bars','bars'],['glow','glow'],['blur','blur'],['wash','wash'],
      ['sample','sample'],['relief','relief'],['h1','h1'],['h2','h2'],['crack','crack'],['dust','dust'],['bass','bass'],
      ['hue','hue'],['bgH','bgH'],['bgS','bgS'],['bgL','bgL']]){
    const el = document.getElementById(id)
    el.value = P[key]
    el.dispatchEvent(new Event('showonly'))
    const out = el.parentElement.querySelector('.val')
    if(out) out.textContent = SHOW[key] ? SHOW[key](P[key]) : P[key]
  }
  sq.classList.toggle('on', P.shape==='sq')
  ci.classList.toggle('on', P.shape==='ci')
  document.getElementById('flip').classList.toggle('on', !!P.flip)
  paintSwatch()
}

/* Wear the artwork's paint. A gradient averaged into one colour throws away
   the reason it was worth taking. */
document.getElementById('pick').onclick = ()=>{
  if(!srcFills || !srcFills.length){
    document.getElementById('count').textContent = lang==='ja' ? '塗りのある素材を選んで' : 'select a layer that has a fill'
    return
  }
  P.useFill = true; groundTouched = false
  document.getElementById('pick').classList.add('on')
  syncUI(); render(); onRelease()
}

/* ---------------- rng + colour ---------------- */
function rng(seed){
  let a=seed>>>0
  return ()=>{ a=(a+0x6D2B79F5)|0
    let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t
    return ((t^(t>>>14))>>>0)/4294967296 }
}
function hslArr(h,sat,l){
  const a=sat*Math.min(l,1-l)
  const f=n=>{const k=(n+h/30)%12; return 255*(l-a*Math.max(-1,Math.min(k-3,Math.min(9-k,1))))}
  return [f(0),f(8),f(4)]
}
const hslCss = (h,s,l)=> css(hslArr(h,s,l))
/* The ground: either the artwork's own paint, or the colour we dialled in. */
const groundArr = ()=> (P.useFill && srcPaint)
  ? [srcPaint.r*255, srcPaint.g*255, srcPaint.b*255]
  : hslArr(P.bgH,P.bgS,P.bgL)
/* rgb 0..1 -> hsl, so a colour picked off the artwork lands on the sliders */
function rgbToHsl(r,g,b){
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), l=(mx+mn)/2, d=mx-mn
  if(!d) return [0,0,l]
  const sat = l>0.5 ? d/(2-mx-mn) : d/(mx+mn)
  let h
  if(mx===r) h=((g-b)/d+(g<b?6:0))
  else if(mx===g) h=(b-r)/d+2
  else h=(r-g)/d+4
  return [h*60, sat, l]
}
const hueArr = h=>{ const k=n=>(n+h/30)%12, f=n=>255*(1-Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1))))
  return [f(0),f(8),f(4)] }
const hueCss = h=>{ const c=hueArr(h); return `rgb(${c.map(v=>Math.round(v)).join(',')})` }
const mix = (a,b,t)=> a.map((v,i)=> v+(b[i]-v)*t)
const css = c => `rgb(${c.map(v=>Math.round(Math.max(0,Math.min(255,v)))).join(',')})`

/* Draw the picked paint the way Figma stacks it: index 0 at the bottom, each
   one over the last at its own opacity. Painting only the top fill and calling
   it the ground is a lie the panel used to tell. */
function drawSrcFills(){
  if(!P.useFill || !srcFills || !srcFills.length) return false
  const defs = document.createElementNS(NS,'defs')
  let drew = false
  srcFills.forEach((p,i)=>{
    if(p.visible===false) return
    let fill
    if(p.type==='SOLID'){
      fill = css([p.color.r*255, p.color.g*255, p.color.b*255])
    } else if(p.gradientStops && p.gradientStops.length){
      const id = 'src'+i
      const stops = p.gradientStops.map(st =>
        `<stop offset="${st.position}" stop-color="rgb(${Math.round(st.color.r*255)},${Math.round(st.color.g*255)},${Math.round(st.color.b*255)})" stop-opacity="${st.color.a==null?1:st.color.a}"/>`
      ).join('')
      defs.innerHTML += p.type==='GRADIENT_RADIAL'
        ? `<radialGradient id="${id}">${stops}</radialGradient>`
        : `<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1">${stops}</linearGradient>`
      fill = `url(#${id})`
    } else return
    if(!drew){ art.append(defs); drew = true }
    const r = document.createElementNS(NS,'rect')
    r.setAttribute('width',W); r.setAttribute('height',H)
    r.setAttribute('fill', fill)
    r.setAttribute('opacity', p.opacity==null ? 1 : p.opacity)
    art.append(r)
  })
  return drew
}

/* A slider fires far faster than the panel can redraw a few thousand nodes.
   Coalesce onto the frame. */
let frameReq = 0
function render(){
  if(frameReq) return
  frameReq = requestAnimationFrame(()=>{ frameReq = 0; draw() })
}

/* ---------------- preview (svg, same maths as the plugin) ---------------- */
function draw(){
  const R = rng(P.seed*7919+13)
  const S = Math.min(W,H)
  art.setAttribute('viewBox', `0 0 ${W} ${H}`)
  // fit the target's shape into the panel: use the full width, cap the height
  const stage = document.getElementById('stage')
  const availW = Math.max(120, stage.clientWidth - 14)
  const k = Math.min(availW / W, 236 / H)
  art.style.width  = Math.round(W * k) + 'px'
  art.style.height = Math.round(H * k) + 'px'
  while(art.firstChild) art.removeChild(art.firstChild)

  const defs = document.createElementNS(NS,'defs')
  defs.innerHTML = `
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="${hueCss(P.h1)}"/><stop offset="1" stop-color="${hueCss(P.h2)}"/>
    </linearGradient>
    <radialGradient id="hit">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="${P.blur*(S/DEF)}"/></filter>`
  art.append(defs)

  const chosen = groundArr()
  const pale = P.useFill && srcPaint
    ? (0.2126*chosen[0] + 0.7152*chosen[1] + 0.0722*chosen[2]) / 255 > 0.5
    : isLight()
  /* 反転 swaps the panel and the void. Turning the ink over while the ground
     stays put only makes the surface vanish into it. */
  const panel = pale ? [16,16,16] : [235,235,235]
  const ground = P.flip ? panel : chosen
  const light = P.flip ? !pale : pale
  const inkBase = light?16:235

  const bg = document.createElementNS(NS,'rect')
  bg.setAttribute('width',W); bg.setAttribute('height',H)
  bg.setAttribute('fill', css(ground)); art.append(bg)
  if(!P.flip) drawSrcFills()


  if(P.wash>0){
    const w = document.createElementNS(NS,'rect')
    w.setAttribute('width',W); w.setAttribute('height',H)
    w.setAttribute('fill','url(#wash)'); w.setAttribute('opacity',P.wash.toFixed(2)); art.append(w)
  }

  const G=P.grid, cell=S/G
  const GX=Math.ceil(W/cell), GY=Math.ceil(H/cell)
  const sink=new Float32Array(GX*GY)
  const jit = a=>(R()*2-1)*a*P.hum
  const hits=[], cracks=[], dust=[]
  let bassLift=0
  const [kick,snare,hat,bass] = TRACKS.map(t=>t.on)

  for(let bar=0;bar<P.bars;bar++) for(let s=0;s<16;s++){
    const ang = (s/16)*Math.PI*2 - Math.PI/2 + jit(0.06)
    if(kick.includes(s)){
      const r = S*0.5*0.30*(1+jit(0.10))
      const hx=W/2+Math.cos(ang)*r, hy=H/2+Math.sin(ang)*r
      const reach=P.reach*(1+jit(0.18))*(S/DEF)
      hits.push({x:hx,y:hy,r:reach})
      for(let gy=0;gy<GY;gy++) for(let gx=0;gx<GX;gx++){
        const cx=(gx+0.5)*cell, cy=(gy+0.5)*cell
        const d2=(cx-hx)*(cx-hx)+(cy-hy)*(cy-hy)
        sink[gy*GX+gx] += Math.exp(-d2/(reach*reach))
      }
    }
    if(snare.includes(s)&&P.crack>0){
      const r=S*0.5*0.50*(1+jit(0.06))
      cracks.push({ang:ang+jit(0.05), r, len:S*0.16*(0.6+R()*0.8), w:1.4+R()*2.6})
    }
    if(hat.includes(s)&&P.dust>0){
      const r=S*0.5*0.72, n=5+Math.round(R()*7)
      for(let i=0;i<n;i++){
        const aa=ang+(R()-0.5)*0.16, rr=r*(1+(R()-0.5)*0.10)
        dust.push({x:W/2+Math.cos(aa)*rr, y:H/2+Math.sin(aa)*rr, s:1+R()*3.2, o:0.15+R()*0.6})
      }
    }
    if(bass.includes(s)) bassLift+=0.12
  }

  let smax=0; for(const v of sink) smax=Math.max(smax,v); if(smax<1e-6) smax=1


  const accent = hueArr(P.hue), cA = hueArr(P.h1), cB = hueArr(P.h2)
  const base = cell*P.fill*(1+bassLift*P.bass*0.5)
  let n=0
  /* Shrinking cells alone cannot say "dent" — a bump shrinks them identically.
     Light the crater wall and the eye stops guessing. */
  const kAt=(x,y)=>Math.pow(sink[Math.min(GY-1,Math.max(0,y))*GX+Math.min(GX-1,Math.max(0,x))]/smax, P.curve)
  const LX=-0.62, LY=-0.62, LZ=0.48

  const gF=document.createElementNS(NS,'g')
  for(let gy=0;gy<GY;gy++) for(let gx=0;gx<GX;gx++){
    const k=Math.pow(sink[gy*GX+gx]/smax, P.curve)   // the rim stays surface
    const dx=(kAt(gx+1,gy)-kAt(gx-1,gy))*0.5
    const dy=(kAt(gx,gy+1)-kAt(gx,gy-1))*0.5
    const shade=(dx*LX+dy*LY+LZ)/Math.sqrt(dx*dx+dy*dy+1)-LZ
    // displaced material: shoved down the slope, piled just outside the pit
    const slope=Math.sqrt(dx*dx+dy*dy)
    const swell=1+P.spread*slope*3.2*(1-k)
    let push=P.spread*slope*cell*5.5
    // torn loose: no longer surface, so it loses its corners and is thrown clear
    const loose = P.debris>0 && k>0.2 && k<0.85 && R()<P.debris
    if(loose) push *= 1.6 + R()*2.4
    let size=base*(1-k*P.sink)*swell
    if(size<0.6) continue
    if(loose) size *= 0.35 + R()*0.4
    // only a cell that is already moving gets nudged — a closed rim stays closed
    const j = cell*0.16*Math.min(1, k*3)
    const cx=(gx+0.5)*cell - dx/(slope||1)*push + (R()*2-1)*j*P.hum
    const cy=(gy+0.5)*cell - dy/(slope||1)*push + (R()*2-1)*j*P.hum
    const tt=cx/W*0.6+cy/H*0.4
    let col=mix([inkBase,inkBase,inkBase], mix(cA,cB,tt), P.sample*(1-k*0.55))
    col=mix(col, ground, Math.min(1,k*P.dark*1.25))       // it falls into the hole
    if(shade>0)      col=mix(col,[255,255,255],Math.min(1, shade*2.2*P.relief))
    else if(shade<0) col=mix(col, ground,       Math.min(1,-shade*2.2*P.relief))
    const lit=(k-0.82)/0.18                                // only the floor is lit
    if(lit>0) col=mix(col, mix([255,255,255],accent,0.6), Math.min(1,lit*P.glow))
    let el
    if(loose || P.shape==='ci'){
      el=document.createElementNS(NS,'circle')
      el.setAttribute('cx',cx.toFixed(2)); el.setAttribute('cy',cy.toFixed(2)); el.setAttribute('r',(size/2).toFixed(2))
    }else{
      el=document.createElementNS(NS,'rect')
      el.setAttribute('x',(cx-size/2).toFixed(2)); el.setAttribute('y',(cy-size/2).toFixed(2))
      el.setAttribute('width',size.toFixed(2)); el.setAttribute('height',size.toFixed(2))
      const rot=(R()*2-1)*6*P.hum*Math.min(1,k*3)
      if(Math.abs(rot)>0.2) el.setAttribute('transform',`rotate(${rot.toFixed(2)} ${cx.toFixed(2)} ${cy.toFixed(2)})`)
    }
    el.setAttribute('fill',css(col))
    const op = loose ? Math.max(0.15,(1-k*0.28)*(0.35+R()*0.5)) : (1-k*0.28)
    if(k>0.02 || loose) el.setAttribute('opacity',op.toFixed(2))
    gF.append(el); n++
  }
  art.append(gF)

  /* The same lamps the plugin builds. Keep them identical or the panel lies.
     SCREEN only adds, MULTIPLY only subtracts — so a pale ground can carry the
     shadows and nothing else. Blur radii are fractions of the crater diameter D. */
  /* On a pale ground the SCREEN half of the stack adds nothing and the
     MULTIPLY half survives alone as black balls. Place none of them there. */
  if(P.glow>0 && hits.length && P.relief>0 && !light){
    const LN=Math.sqrt(LX*LX+LY*LY), ux=LX/LN, uy=LY/LN
    const gl=Math.min(1.4,P.glow)
    const defs2=document.createElementNS(NS,'defs')
    art.append(defs2)
    let uid=0
    const lamp=(h,o)=>{
      const D=h.r*2, d=D*o.size
      if(!(d>0.5)) return
      const id='L'+(uid++)
      const dirx = o.away ? -ux : ux, diry = o.away ? -uy : uy
      defs2.innerHTML +=
        `<radialGradient id="g${id}">`+
        `<stop offset="0" stop-color="${css(o.c)}" stop-opacity="${o.a}"/>`+
        `<stop offset="0.45" stop-color="${css(o.c)}" stop-opacity="${o.a*0.3}"/>`+
        `<stop offset="1" stop-color="${css(o.c)}" stop-opacity="0"/></radialGradient>`+
        `<filter id="f${id}" x="-80%" y="-80%" width="260%" height="260%">`+
        `<feGaussianBlur stdDeviation="${Math.max(0.3, D*o.blur*0.5).toFixed(2)}"/></filter>`
      const c=document.createElementNS(NS,'circle')
      c.setAttribute('cx',(h.x+D*o.off*dirx).toFixed(1))
      c.setAttribute('cy',(h.y+D*o.off*diry).toFixed(1))
      c.setAttribute('r',(d/2).toFixed(1))
      c.setAttribute('fill',`url(#g${id})`)
      c.setAttribute('filter',`url(#f${id})`)
      c.setAttribute('opacity',Math.max(0,Math.min(1,o.op)).toFixed(2))
      c.setAttribute('style','mix-blend-mode:'+o.mode)
      art.append(c)
    }
    const WH=[255,255,255]
    for(const h of hits){
      // No occlusion, no shadow. The dark is not painted on: it is the ground,
      // and it appears because the panels fell away from it.
      lamp(h,{c:WH,    a:0.90,size:0.20,off:0.30,away:1,blur:0.06,mode:'screen',    op:0.75*gl})
      lamp(h,{c:accent,a:0.30,size:0.60,off:0.30,away:1,blur:0.20,mode:'soft-light',op:0.7*gl})
    }
  }

  for(const c of cracks){
    const x1=W/2+Math.cos(c.ang)*(c.r-c.len/2), y1=H/2+Math.sin(c.ang)*(c.r-c.len/2)
    const x2=W/2+Math.cos(c.ang)*(c.r+c.len/2), y2=H/2+Math.sin(c.ang)*(c.r+c.len/2)
    const el=document.createElementNS(NS,'line')
    el.setAttribute('x1',x1.toFixed(2)); el.setAttribute('y1',y1.toFixed(2))
    el.setAttribute('x2',x2.toFixed(2)); el.setAttribute('y2',y2.toFixed(2))
    el.setAttribute('stroke',light?'#111':'#f4f4f4')
    el.setAttribute('stroke-width',(c.w*P.crack).toFixed(2))
    el.setAttribute('stroke-linecap','round')
    art.append(el); n++
  }
  for(const d of dust){
    const el=document.createElementNS(NS,'rect')
    el.setAttribute('x',d.x.toFixed(2)); el.setAttribute('y',d.y.toFixed(2))
    el.setAttribute('width',d.s.toFixed(2)); el.setAttribute('height',d.s.toFixed(2))
    el.setAttribute('fill',light?'#111':'#fff')
    el.setAttribute('opacity',(d.o*P.dust).toFixed(2))
    art.append(el); n++
  }
  document.getElementById('count').textContent = n + ' nodes'
}

/* ---------------- to figma ---------------- */
function payload(){
  // the tracks travel under `*Seq`, so they never collide with the amounts
  return Object.assign({}, P, {
    srcFills: P.useFill ? srcFills : null,
    kickSeq: TRACKS[0].on.slice(), snareSeq: TRACKS[1].on.slice(),
    hatSeq:  TRACKS[2].on.slice(), bassSeq:  TRACKS[3].on.slice(),
  })
}
let pendingSend = null       // a release that landed mid-flight; never drop it
function send(type){
  if(busy){ pendingSend = type; return }
  busy = true
  parent.postMessage({pluginMessage:{type, p:payload()}}, '*')
  setTimeout(()=>{
    busy = false
    if(pendingSend){ const t2 = pendingSend; pendingSend = null; send(t2) }
  }, 120)
}
function onRelease(){ if(live) send('live') }

const liveBtn = document.getElementById('live')
liveBtn.onclick = ()=>{
  live = !live
  liveBtn.classList.toggle('on', live)
  if(live) send('live')
  else parent.postMessage({pluginMessage:{type:'discard'}}, '*')   // a preview is never kept
}
document.getElementById('undo').onclick = ()=>{
  parent.postMessage({pluginMessage:{type:'discard'}}, '*')
  live = false; liveBtn.classList.remove('on')
}
document.getElementById('make').onclick = ()=>{
  live = false; liveBtn.classList.remove('on')
  send('make')
}

onmessage = e=>{
  const m = e.data.pluginMessage
  if(!m) return
  if(m.type==='target'){
    W = m.w || 1000; H = m.h || 1000
    srcPaint = m.paint || null
    srcFills = m.fills || null
    // Match the artwork by default. Nobody wants to press a button to be told
    // what colour the thing they just selected is.
    if(srcFills && !groundTouched) P.useFill = true
    if(!srcFills){ P.useFill = false }
    document.getElementById('pick').classList.toggle('on', !!P.useFill)
    document.getElementById('pick').disabled = !srcFills
    paintSwatch(); render()
  }
  if(m.type==='error') document.getElementById('count').textContent = 'ERR: ' + m.message
}

applyLang(); paintSwatch(); render()
parent.postMessage({pluginMessage:{type:'target'}}, '*')
</script>
