<!doctype html>
<meta charset="utf-8">
<style>
:root{ --bg:#0b0b0c; --fg:#e9e9e9; --dim:#78787b; --line:#242426; --panel:#151516; --hot:#ff8a3d }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:400 12px/1.55 -apple-system,ui-sans-serif,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column}
.mono{font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}

header{padding:12px 14px 10px;border-bottom:1px solid var(--line);flex:none;
  display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-family:"Haettenschweiler","Impact","Arial Narrow Bold",sans-serif;font-size:20px;
  letter-spacing:.06em;text-transform:uppercase;margin:0;font-weight:400;cursor:pointer}
h1:hover{opacity:.82}
.lang{display:flex;flex:none}
.lang button{border-radius:0;padding:4px 9px;font-size:10.5px}
.lang button:first-child{border-radius:5px 0 0 5px}
.lang button:last-child{border-radius:0 5px 5px 0;margin-left:-1px}

.scroll{flex:1;overflow-y:auto;padding:12px 14px 0;position:relative}
#stage{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#000;margin-bottom:10px;
  position:sticky;top:0;z-index:3;box-shadow:0 8px 16px -8px #000}
#art{display:block;width:100%;aspect-ratio:1}

button{font:inherit;font-size:11px;color:var(--fg);background:transparent;border:1px solid var(--line);
  border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--dim)}
button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.sec{border:1px solid var(--line);border-radius:8px;padding:11px 12px;margin-bottom:9px;background:var(--panel)}
.lbl{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin:0 0 8px}
.row{display:flex;align-items:center;gap:8px;margin-top:6px}
.row label{font-size:10px;color:var(--dim);width:58px;flex:none}
input[type=range]{flex:1;accent-color:var(--fg);height:3px}
.val{font-size:10px;width:42px;text-align:right;flex:none}

.seq{display:grid;grid-template-columns:44px repeat(16,1fr);gap:2px;align-items:center}
.trk{font-size:9px;color:var(--dim)}
.st{aspect-ratio:1;border:1px solid var(--line);border-radius:2px;cursor:pointer}
.st.on{background:var(--fg);border-color:var(--fg)}
.st.beat{border-color:#3a3a3d}

footer{flex:none;border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:7px;align-items:center}
footer .sp{flex:1}
#make{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:500;padding:7px 16px}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.modal[hidden]{display:none}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 20px 16px;width:100%;max-height:88vh;overflow-y:auto}
.mt{font-family:"Haettenschweiler","Impact",sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:24px;margin:0 0 8px;font-weight:400}
.ms{font-size:11.5px;color:var(--dim);margin:0 0 14px;line-height:1.75}
.ms b{color:var(--fg);font-weight:500}
.mlink{display:flex;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:7px;
  margin-bottom:7px;color:var(--fg);text-decoration:none;font-size:11.5px}
.mlink small{color:var(--dim);margin-left:5px}
.mcl{width:100%;margin-top:8px;padding:8px}
</style>

<div id="modal" class="modal" hidden>
  <div class="sheet">
    <p class="mt">Siren</p>
    <p class="ms" id="mSub"></p>
    <p class="ms" id="mBody"></p>
    <a class="mlink" href="https://kinoshita.studio" target="_blank" rel="noopener"><span>kinoshita studio</span><span>↗</span></a>
    <a class="mlink" href="https://99letters.bandcamp.com/album/kaibou-zukan" target="_blank" rel="noopener"><span>99LETTERS — Kaibou Zukan <small>Bandcamp</small></span><span>↗</span></a>
    <button id="mClose" class="mcl"></button>
  </div>
</div>

<header>
  <h1 id="title">Siren</h1>
  <div class="lang"><button id="langJa" class="on">JP</button><button id="langEn">EN</button></div>
</header>

<div class="scroll">
  <div id="stage"><svg id="art" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg"></svg></div>

  <div class="sec">
    <p class="lbl" id="lSeq">Sequence</p>
    <div class="seq" id="seq"></div>
  </div>

  <div class="sec">
    <p class="lbl" id="lKick">Kick</p>
    <div class="row"><label>sink</label><input id="sink" type="range" min="0" max="1" step="0.01" value="0.72"><span class="val mono"></span></div>
    <div class="row"><label>reach</label><input id="reach" type="range" min="40" max="420" step="1" value="190"><span class="val mono"></span></div>
    <div class="row"><label>darken</label><input id="dark" type="range" min="0" max="1" step="0.01" value="0.62"><span class="val mono"></span></div>
  </div>

  <div class="sec">
    <p class="lbl" id="lField">Field</p>
    <div class="row"><label>grid</label><input id="grid" type="range" min="6" max="24" step="1" value="16"><span class="val mono"></span></div>
    <div class="row"><label>size</label><input id="fill" type="range" min="0.2" max="1" step="0.01" value="0.72"><span class="val mono"></span></div>
    <div class="row"><label>humanize</label><input id="hum" type="range" min="0" max="1" step="0.01" value="0.35"><span class="val mono"></span></div>
    <div class="row"><label>bars</label><input id="bars" type="range" min="1" max="8" step="1" value="3"><span class="val mono"></span></div>
  </div>

  <div class="sec">
    <p class="lbl" id="lLight">Light</p>
    <div class="row"><label>glow</label><input id="glow" type="range" min="0" max="1.4" step="0.01" value="0.75"><span class="val mono"></span></div>
    <div class="row"><label>spread</label><input id="blur" type="range" min="0" max="180" step="1" value="70"><span class="val mono"></span></div>
    <div class="row"><label>wash</label><input id="wash" type="range" min="0" max="1" step="0.01" value="0.55"><span class="val mono"></span></div>
    <div class="row"><label>sample</label><input id="sample" type="range" min="0" max="1" step="0.01" value="0.85"><span class="val mono"></span></div>
    <div class="row"><label>hue A</label><input id="h1" type="range" min="0" max="360" step="1" value="262"><span class="val mono"></span></div>
    <div class="row"><label>hue B</label><input id="h2" type="range" min="0" max="360" step="1" value="22"><span class="val mono"></span></div>
  </div>

  <div class="sec">
    <p class="lbl" id="lVoice">Voices</p>
    <div class="row"><label>snare</label><input id="crack" type="range" min="0" max="1" step="0.01" value="0.7"><span class="val mono"></span></div>
    <div class="row"><label>hat</label><input id="dust" type="range" min="0" max="1" step="0.01" value="0.6"><span class="val mono"></span></div>
    <div class="row"><label>bass</label><input id="bass" type="range" min="0" max="1" step="0.01" value="0.5"><span class="val mono"></span></div>
  </div>

  <div class="sec">
    <p class="lbl" id="lLook">Look</p>
    <div style="display:flex;gap:6px;align-items:center">
      <button id="sq" class="on">■</button><button id="ci">●</button>
      <span style="flex:1"></span>
      <button id="inv">反転</button>
      <button id="dice">⟳</button>
    </div>
    <div class="row"><label>accent</label><input id="hue" type="range" min="0" max="360" step="1" value="28"><span class="val mono"></span></div>
  </div>
</div>

<footer>
  <button id="live">LIVE</button>
  <span class="mono" id="count" style="color:var(--dim);font-size:10px"></span>
  <span class="sp"></span>
  <button id="make">鳴らす</button>
</footer>

<script>
'use strict'
const S = 1000, NS = 'http://www.w3.org/2000/svg'
const art = document.getElementById('art')

const TRACKS = [
  {key:'kick',  on:[0,3,8,11]},
  {key:'snare', on:[4,12]},
  {key:'hat',   on:[0,2,4,6,8,10,12,14]},
  {key:'bass',  on:[0,8]},
]
const P = { sink:0.72, reach:190, dark:0.62, grid:16, fill:0.72, hum:0.35, bars:3,
            crack:0.7, dust:0.6, bass:0.5, shape:'sq', invert:false, hue:28, seed:7,
            glow:0.75, blur:70, h1:262, h2:22, wash:0.55, sample:0.85 }

let live = false, busy = false

/* ---------------- language ---------------- */
const T = {
  ja:{ seq:'シーケンス', kick:'Kick — 面を殴る', field:'Field — 面', light:'Light — 殴った跡は光る',
       voice:'Voices', look:'Look', make:'鳴らす', close:'閉じる', inv:'反転',
       about:'名前は 99LETTERS のアルバム <i>Kaibou Zukan</i> の9曲目<b>「Siren（鳴物）」</b>から。鳴物は打楽器の総称。',
       body:'<b>キックは丸ではない。キックは、面が受けた打撃の跡。</b>見えないグリッドの上をシーケンスが一周し、キックが鳴った角度のセルが沈む。近いほど深く。<br><br>殴った跡は<b>沈むと同時に光る</b>。光はぼかした放射グラデ。Fons のあの質感は 3D ではなく、<b>ぼかしたグラデ図形を重ねたもの</b>。同じ部品を、手ではなくリズムが置く。<br><br><b>出てくるのは全部ベクター。</b>楕円も矩形もグラデもレイヤーブラーも Figma のネイティブノード。色は後から変えられる。<b>ここから Kaibou に通せば、作品になる。</b>' },
  en:{ seq:'Sequence', kick:'Kick — it hits the surface', field:'Field', light:'Light — the dent glows',
       voice:'Voices', look:'Look', make:'Play', close:'Close', inv:'Invert',
       about:'Named after <b>Siren (鳴物)</b>, track 9 of <i>Kaibou Zukan</i> by 99LETTERS. 鳴物 is the word for percussion.',
       body:'<b>A kick is not a circle. A kick is the mark a surface takes.</b> The sequence goes once around an invisible grid; wherever the kick lands, the cells cave in. Closer means deeper.<br><br>The dent <b>sinks and glows at once</b>. Fons\\u2019s surfaces are not 3D — they are <b>blurred gradient shapes, stacked</b>. Here the rhythm places them instead of the hand.<br><br><b>Everything it makes is vector.</b> Ellipses, rectangles, gradients, layer blur — native Figma nodes. Recolour them later. <b>Run it through Kaibou and it becomes a piece.</b>' }
}
let lang = 'ja'
const t = ()=>T[lang]
function applyLang(){
  document.getElementById('lSeq').textContent = t().seq
  document.getElementById('lKick').textContent = t().kick
  document.getElementById('lField').textContent = t().field
  document.getElementById('lLight').textContent = t().light
  document.getElementById('lVoice').textContent = t().voice
  document.getElementById('lLook').textContent = t().look
  document.getElementById('make').textContent = t().make
  document.getElementById('inv').textContent = t().inv
  document.getElementById('mClose').textContent = t().close
  document.getElementById('mSub').innerHTML = t().about
  document.getElementById('mBody').innerHTML = t().body
  document.getElementById('langJa').classList.toggle('on', lang==='ja')
  document.getElementById('langEn').classList.toggle('on', lang==='en')
}
document.getElementById('langJa').onclick = ()=>{ lang='ja'; applyLang() }
document.getElementById('langEn').onclick = ()=>{ lang='en'; applyLang() }

const modal = document.getElementById('modal')
document.getElementById('title').onclick = ()=>{ modal.hidden=false }
document.getElementById('mClose').onclick = ()=>{ modal.hidden=true }
modal.onclick = e=>{ if(e.target===modal) modal.hidden=true }
addEventListener('keydown', e=>{ if(e.key==='Escape') modal.hidden=true })

/* ---------------- sequencer ---------------- */
const seqEl = document.getElementById('seq')
for(const tr of TRACKS){
  const l = document.createElement('div'); l.className='trk'; l.textContent = tr.key
  seqEl.append(l)
  for(let i=0;i<16;i++){
    const b = document.createElement('div')
    b.className = 'st' + (tr.on.includes(i)?' on':'') + (i%4===0?' beat':'')
    b.onclick = ()=>{
      const k = tr.on.indexOf(i)
      if(k<0) tr.on.push(i); else tr.on.splice(k,1)
      b.classList.toggle('on'); render(); onRelease()
    }
    seqEl.append(b)
  }
}

/* ---------------- params ---------------- */
const pc = v=>Math.round(v*100)+'%'
function bind(id,key,fmt){
  const el = document.getElementById(id)
  const out = el.parentElement.querySelector('.val')
  const show = ()=>{ out.textContent = fmt(P[key]) }
  el.oninput = ()=>{ P[key]=+el.value; show(); render() }
  el.onchange = onRelease
  show()
}
bind('sink','sink',pc); bind('reach','reach',v=>v); bind('dark','dark',pc)
bind('grid','grid',v=>v); bind('fill','fill',pc); bind('hum','hum',pc); bind('bars','bars',v=>v)
bind('glow','glow',pc); bind('blur','blur',v=>v); bind('wash','wash',pc); bind('sample','sample',pc)
bind('h1','h1',v=>v+'°'); bind('h2','h2',v=>v+'°')
bind('crack','crack',pc); bind('dust','dust',pc); bind('bass','bass',pc); bind('hue','hue',v=>v+'°')

const sq = document.getElementById('sq'), ci = document.getElementById('ci')
sq.onclick = ()=>{ P.shape='sq'; sq.classList.add('on'); ci.classList.remove('on'); render(); onRelease() }
ci.onclick = ()=>{ P.shape='ci'; ci.classList.add('on'); sq.classList.remove('on'); render(); onRelease() }
document.getElementById('inv').onclick = e=>{ P.invert=!P.invert; e.target.classList.toggle('on'); render(); onRelease() }
document.getElementById('dice').onclick = ()=>{ P.seed = 1+Math.floor(Math.random()*998); render(); onRelease() }

/* ---------------- rng + colour ---------------- */
function rng(seed){
  let a=seed>>>0
  return ()=>{ a=(a+0x6D2B79F5)|0
    let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t
    return ((t^(t>>>14))>>>0)/4294967296 }
}
const hueArr = h=>{ const k=n=>(n+h/30)%12, f=n=>255*(1-Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1))))
  return [f(0),f(8),f(4)] }
const hueCss = h=>{ const c=hueArr(h); return `rgb(${c.map(v=>Math.round(v)).join(',')})` }
const mix = (a,b,t)=> a.map((v,i)=> v+(b[i]-v)*t)
const css = c => `rgb(${c.map(v=>Math.round(Math.max(0,Math.min(255,v)))).join(',')})`

/* ---------------- preview (svg, same maths as the plugin) ---------------- */
function render(){
  const R = rng(P.seed*7919+13)
  while(art.firstChild) art.removeChild(art.firstChild)

  const defs = document.createElementNS(NS,'defs')
  defs.innerHTML = `
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="${hueCss(P.h1)}"/><stop offset="1" stop-color="${hueCss(P.h2)}"/>
    </linearGradient>
    <radialGradient id="hit">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="${P.blur}"/></filter>`
  art.append(defs)

  const bg = document.createElementNS(NS,'rect')
  bg.setAttribute('width',S); bg.setAttribute('height',S)
  bg.setAttribute('fill', P.invert?'#f2f0ea':'#0b0b0c'); art.append(bg)

  if(P.wash>0){
    const w = document.createElementNS(NS,'rect')
    w.setAttribute('width',S); w.setAttribute('height',S)
    w.setAttribute('fill','url(#wash)'); w.setAttribute('opacity',P.wash.toFixed(2)); art.append(w)
  }

  const G=P.grid, cell=S/G, sink=new Float32Array(G*G)
  const jit = a=>(R()*2-1)*a*P.hum
  const hits=[], cracks=[], dust=[]
  let bassLift=0
  const [kick,snare,hat,bass] = TRACKS.map(t=>t.on)

  for(let bar=0;bar<P.bars;bar++) for(let s=0;s<16;s++){
    const ang = (s/16)*Math.PI*2 - Math.PI/2 + jit(0.06)
    if(kick.includes(s)){
      const r = S*0.5*0.30*(1+jit(0.10))
      const hx=S/2+Math.cos(ang)*r, hy=S/2+Math.sin(ang)*r
      const reach=P.reach*(1+jit(0.18))
      hits.push({x:hx,y:hy,r:reach})
      for(let gy=0;gy<G;gy++) for(let gx=0;gx<G;gx++){
        const cx=(gx+0.5)*cell, cy=(gy+0.5)*cell
        const d2=(cx-hx)*(cx-hx)+(cy-hy)*(cy-hy)
        sink[gy*G+gx] += Math.exp(-d2/(reach*reach))
      }
    }
    if(snare.includes(s)&&P.crack>0){
      const r=S*0.5*0.50*(1+jit(0.06))
      cracks.push({ang:ang+jit(0.05), r, len:S*0.16*(0.6+R()*0.8), w:1.4+R()*2.6})
    }
    if(hat.includes(s)&&P.dust>0){
      const r=S*0.5*0.72, n=5+Math.round(R()*7)
      for(let i=0;i<n;i++){
        const aa=ang+(R()-0.5)*0.16, rr=r*(1+(R()-0.5)*0.10)
        dust.push({x:S/2+Math.cos(aa)*rr, y:S/2+Math.sin(aa)*rr, s:1+R()*3.2, o:0.15+R()*0.6})
      }
    }
    if(bass.includes(s)) bassLift+=0.12
  }

  let smax=0; for(const v of sink) smax=Math.max(smax,v); if(smax<1e-6) smax=1

  if(P.glow>0 && hits.length){
    const g=document.createElementNS(NS,'g')
    g.setAttribute('filter','url(#soft)'); g.setAttribute('opacity',Math.min(1,P.glow).toFixed(2))
    g.setAttribute('style','mix-blend-mode:screen')
    for(const h of hits){
      const c=document.createElementNS(NS,'circle')
      c.setAttribute('cx',h.x.toFixed(1)); c.setAttribute('cy',h.y.toFixed(1))
      c.setAttribute('r',(h.r*1.15).toFixed(1)); c.setAttribute('fill','url(#hit)')
      g.append(c)
    }
    art.append(g)
  }

  const inkBase = P.invert?16:235
  const accent = hueArr(P.hue), cA = hueArr(P.h1), cB = hueArr(P.h2)
  const base = cell*P.fill*(1+bassLift*P.bass*0.5)
  let n=0
  const gF=document.createElementNS(NS,'g')
  for(let gy=0;gy<G;gy++) for(let gx=0;gx<G;gx++){
    const k=sink[gy*G+gx]/smax
    const size=base*(1-k*P.sink)
    if(size<0.6) continue
    const cx=(gx+0.5)*cell+jit(cell*0.16), cy=(gy+0.5)*cell+jit(cell*0.16)
    const tt=cx/S*0.6+cy/S*0.4
    const grey=inkBase+(P.invert?1:-1)*k*P.dark*(P.invert?180:200)
    let col=mix([grey,grey,grey], mix(cA,cB,tt), P.sample*(1-k*0.55))
    col=mix(col,[255,255,255],Math.max(0,k-0.55)*1.4*P.glow)
    if(k>0.86) col=mix(col,accent,0.75)
    let el
    if(P.shape==='ci'){
      el=document.createElementNS(NS,'circle')
      el.setAttribute('cx',cx.toFixed(2)); el.setAttribute('cy',cy.toFixed(2)); el.setAttribute('r',(size/2).toFixed(2))
    }else{
      el=document.createElementNS(NS,'rect')
      el.setAttribute('x',(cx-size/2).toFixed(2)); el.setAttribute('y',(cy-size/2).toFixed(2))
      el.setAttribute('width',size.toFixed(2)); el.setAttribute('height',size.toFixed(2))
      const rot=jit(6)
      if(Math.abs(rot)>0.2) el.setAttribute('transform',`rotate(${rot.toFixed(2)} ${cx.toFixed(2)} ${cy.toFixed(2)})`)
    }
    el.setAttribute('fill',css(col))
    if(k>0.02) el.setAttribute('opacity',(1-k*0.28).toFixed(2))
    gF.append(el); n++
  }
  art.append(gF)

  for(const c of cracks){
    const x1=S/2+Math.cos(c.ang)*(c.r-c.len/2), y1=S/2+Math.sin(c.ang)*(c.r-c.len/2)
    const x2=S/2+Math.cos(c.ang)*(c.r+c.len/2), y2=S/2+Math.sin(c.ang)*(c.r+c.len/2)
    const el=document.createElementNS(NS,'line')
    el.setAttribute('x1',x1.toFixed(2)); el.setAttribute('y1',y1.toFixed(2))
    el.setAttribute('x2',x2.toFixed(2)); el.setAttribute('y2',y2.toFixed(2))
    el.setAttribute('stroke',P.invert?'#111':'#f4f4f4')
    el.setAttribute('stroke-width',(c.w*P.crack).toFixed(2))
    el.setAttribute('stroke-linecap','round')
    art.append(el); n++
  }
  for(const d of dust){
    const el=document.createElementNS(NS,'rect')
    el.setAttribute('x',d.x.toFixed(2)); el.setAttribute('y',d.y.toFixed(2))
    el.setAttribute('width',d.s.toFixed(2)); el.setAttribute('height',d.s.toFixed(2))
    el.setAttribute('fill',P.invert?'#111':'#fff')
    el.setAttribute('opacity',(d.o*P.dust).toFixed(2))
    art.append(el); n++
  }
  document.getElementById('count').textContent = n + ' nodes'
}

/* ---------------- to figma ---------------- */
function payload(){
  return Object.assign({}, P, {
    kick:TRACKS[0].on.slice(), snare:TRACKS[1].on.slice(),
    hat:TRACKS[2].on.slice(), bass:TRACKS[3].on.slice(),
  })
}
function send(type){
  if(busy) return
  busy = true
  parent.postMessage({pluginMessage:{type, p:payload()}}, '*')
  setTimeout(()=>{ busy = false }, 120)
}
function onRelease(){ if(live) send('live') }

const liveBtn = document.getElementById('live')
