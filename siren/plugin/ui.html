<!doctype html>
<meta charset="utf-8">
<style>
:root{ --bg:#0b0b0c; --fg:#f2f2f3; --dim:#a6a6ab; --dim2:#7c7c81; --line:#2c2c2f; --panel:#161617; --hot:#ff9445 }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:400 12.5px/1.6 "Inter","Helvetica Neue",-apple-system,ui-sans-serif,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{display:flex;flex-direction:column}
.mono{font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}

header{padding:9px 14px 8px;border-bottom:1px solid var(--line);flex:none;
  display:flex;align-items:center;justify-content:space-between;gap:9px}
h1{font-family:"Haettenschweiler","Impact","Arial Narrow Bold",sans-serif;font-size:19px;
  letter-spacing:.06em;text-transform:uppercase;margin:0;font-weight:400;cursor:pointer;line-height:1.05}
h1:hover{opacity:.82}
/* the wordmark stacks, so the instrument has room to sit beside it */
.wm{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.by{font-size:7px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim2);white-space:nowrap}
.wmr{display:flex;align-items:baseline;gap:7px}
.ver{font-family:ui-monospace,Menlo,monospace;font-size:9.5px;letter-spacing:.12em;color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{padding:5px 9px;font-size:10.5px;border-radius:20px}
.sw{width:22px;height:22px;border-radius:5px;border:1px solid var(--line);flex:none;padding:0;
     background:transparent;cursor:pointer}
input[type=color]{-webkit-appearance:none;appearance:none}
input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
input[type=color]::-webkit-color-swatch{border:none;border-radius:3px}
.lang{display:flex;flex:none}
.lang button{border-radius:0;padding:5px 10px;font-size:11px}
.lang button:first-child{border-radius:5px 0 0 5px}
.lang button:last-child{border-radius:0 5px 5px 0;margin-left:-1px}

/* the instrument: what everything below this line is about */
.iwrap{position:relative;flex:1;display:flex;justify-content:flex-end;min-width:0}
#instBtn{font-size:11px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;padding:6px 10px;
  background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:500}
.imenu{position:absolute;top:calc(100% + 5px);right:0;z-index:20;background:var(--panel);
  border:1px solid var(--line);border-radius:7px;padding:4px;min-width:150px;
  box-shadow:0 10px 22px -10px #000}
.imenu[hidden]{display:none}
.imenu button{display:block;width:100%;text-align:left;border:none;border-radius:5px;padding:7px 9px;font-size:11.5px}
.imenu button:hover{background:#1e1e20}
.imenu button.on{background:var(--fg);color:var(--bg)}
.imenu small{display:block;font-size:9.5px;color:var(--dim2);letter-spacing:0;text-transform:none}
.imenu button.on small{color:var(--bg);opacity:.6}
.imenu button i{font-style:normal;float:right;font-size:9.5px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.imenu button.on i{color:var(--bg);opacity:.7}
.trk.silent{opacity:.38}
#instBtn u{text-decoration:none;opacity:.55;margin-left:5px;font-weight:400}

.scroll{flex:1;overflow-y:auto;padding:12px 14px 0;position:relative}
/* the preview earns its keep, but the sequencer has to stay reachable */
#stage{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#000;margin-bottom:10px;
  position:sticky;top:0;z-index:3;box-shadow:0 8px 16px -8px #000;
  display:grid;place-items:center;padding:6px}
#art{display:block}
#stage{min-height:120px}

button{font:inherit;font-size:11.5px;color:var(--fg);background:transparent;border:1px solid var(--line);
  border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--dim)}
button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.sec{border:1px solid var(--line);border-radius:8px;padding:11px 12px;margin-bottom:9px;background:var(--panel)}
.sec[hidden]{display:none}
.lbl{font-size:10px;font-weight:500;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin:0 0 9px}
.row{display:flex;align-items:center;gap:8px;margin-top:6px}
.row label{font-size:11px;color:var(--dim);width:60px;flex:none}
input[type=range]{flex:1;accent-color:var(--fg);height:3px}
.val{font-size:11px;width:44px;text-align:right;flex:none;color:var(--fg)}

.seqhead{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 9px}
.seqhead .bars{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--dim)}
.seqhead .bars input{width:78px}
.seqhead .bars b{color:var(--fg);font-weight:500;font-family:ui-monospace,Menlo,monospace}
.seq{display:grid;grid-template-columns:82px repeat(16,1fr);gap:2px;align-items:center}
/* 16 steps are 360°. Siren folds time into a circle: a step is an angle. */
.deg{font-size:8.5px;color:var(--dim2);text-align:center;letter-spacing:.02em;padding-bottom:3px}
.st.beat{border-color:#454549}
.st{border-left-width:1px}
.st.bar{border-left:1px solid #4a4a4e}
/* the playhead passes over every step; only the ones that SOUND light up */
.st.now{box-shadow:0 0 0 1.5px #55555a;border-radius:3px}
.st.on.now{background:var(--hot);border-color:var(--hot);box-shadow:0 0 0 1.5px var(--hot),0 0 8px -1px var(--hot)}
.st.dim.now{box-shadow:none}
#play{padding:3px 9px;font-size:11px;line-height:1;min-width:30px}
#play.on{background:var(--hot);color:#000;border-color:var(--hot)}
.trk{font-size:10px;color:var(--dim);display:flex;align-items:center;gap:3px}
.trk span{cursor:pointer}
.trk.sel span{color:var(--fg)}
.trk.dim{opacity:.3}
.sbtn,.mbtn{font-size:9px;font-weight:600;line-height:1;padding:3px 6px;border-radius:3px;border:1px solid var(--line);
  background:transparent;color:var(--dim);cursor:pointer;flex:none}
.sbtn.on{background:var(--hot);color:#000;border-color:var(--hot)}
.mbtn.on{background:#7a4a4a;color:#fff;border-color:#7a4a4a}

/* the mixer: where solo, mute and level have always belonged */
.mix{display:grid;grid-template-columns:repeat(4,1fr) 9px repeat(2,1.15fr);gap:6px;align-items:end}
.ch{display:flex;flex-direction:column;align-items:center;gap:5px}
.ch.dim{opacity:.32}
.ch .nm{font-size:9.5px;font-weight:500;letter-spacing:.06em;color:var(--dim);cursor:pointer;text-transform:uppercase}
.ch.sel .nm{color:var(--fg)}
.fader{-webkit-appearance:slider-vertical;appearance:slider-vertical;width:20px;height:88px;accent-color:var(--fg);padding:0;cursor:pointer}
.fader.off{accent-color:var(--dim2)}   /* the voice has left the axis */
.sm{display:flex;gap:3px}
.gap{border-left:1px solid var(--line);height:104px;justify-self:center}
.modes{display:flex;flex-direction:column;gap:2px;width:100%}
.modes button{font-size:8.5px;padding:3px 0;border-radius:3px;line-height:1.2;width:100%}
.modes button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
details.sec>summary{list-style:none;cursor:pointer;font-size:10px;font-weight:500;letter-spacing:.11em;text-transform:uppercase;color:var(--dim)}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:' +';float:right}
details.sec[open]>summary::after{content:' −'}
.st{aspect-ratio:1;border:1px solid var(--line);border-radius:2px;cursor:pointer}
.st.on{background:var(--fg);border-color:var(--fg)}
.st.beat{border-color:#3a3a3d}
.st.other{opacity:.78}          /* not the voice you are editing */
.st.dim{opacity:.18}            /* not sounding at all */

footer{flex:none;border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:7px;align-items:center}
footer .sp{flex:1}
#make{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:500;padding:7px 16px}
#count.heavy{color:var(--hot)}
#solo.on{background:var(--hot);color:#000;border-color:var(--hot)}
#count.err{color:#ff6b6b}
#count.ok{color:var(--fg)}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.modal[hidden]{display:none}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 20px 16px;width:100%;max-height:88vh;overflow-y:auto}
.mt{font-family:"Haettenschweiler","Impact",sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:24px;margin:0 0 8px;font-weight:400}
.ms{font-size:11.5px;color:var(--dim);margin:0 0 14px;line-height:1.75}
.ms b{color:var(--fg);font-weight:500}
.mlink{display:flex;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:7px;
  margin-bottom:7px;color:var(--fg);text-decoration:none;font-size:11.5px}
.mlink small{color:var(--dim);margin-left:5px}
.mcl{width:100%;margin-top:8px;padding:8px}
</style>

<div id="modal" class="modal" hidden>
  <div class="sheet">
    <p class="mt">Siren</p>
    <p class="ms" id="mSub"></p>
    <p class="ms" id="mBody"></p>
    <a class="mlink" href="https://kinoshita.studio" target="_blank" rel="noopener"><span>kinoshita studio</span><span>↗</span></a>
    <a class="mlink" href="https://99letters.bandcamp.com/album/kaibou-zukan" target="_blank" rel="noopener"><span>99LETTERS — Kaibou Zukan <small>Bandcamp</small></span><span>↗</span></a>
    <button id="mClose" class="mcl"></button>
  </div>
</div>

<header>
  <div class="wm"><div class="wmr"><h1 id="title">Siren</h1><span class="ver">V1</span></div><span class="by">by Kinoshita Studio</span></div>
  <div class="iwrap">
    <button id="instBtn">Kick ▾</button>
    <div id="instMenu" class="imenu" hidden></div>
  </div>
  <div class="lang"><button id="langJa" class="on">JP</button><button id="langEn">EN</button></div>
</header>

<div class="scroll">
  <div id="stage"><svg id="art" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg"></svg></div>

  <div class="sec">
    <p class="lbl" id="lPre">Preset</p>
    <div class="chips" id="chips"></div>
    <div class="row" style="margin-top:11px">
      <label id="lDepth">depth</label>
      <input id="depth" type="range" min="0" max="1" step="0.002" value="0.5">
      <span class="val mono" id="depthV" style="width:66px"></span></div>
  </div>

  <div class="sec" id="secSeq">
    <div class="seqhead">
      <p class="lbl" id="lSeq" style="margin:0">Sequence</p>
      <span class="bars"><span id="lBars">周</span>
        <input id="bars2" type="range" min="1" max="8" step="1" value="3"><b id="barsV">3</b></span>
    </div>
    <div class="seq" id="seq"></div>
  </div>

  <div class="sec">
    <p class="lbl" id="lMix">Mix</p>
    <div class="mix" id="mix"></div>
  </div>

  <!-- one panel per instrument. Only the chosen one is on screen. -->
  <div class="sec" id="vKick">
    <p class="lbl" id="lKick">Kick</p>
    <div class="row"><label>sink</label><input id="k_sink" type="range" min="0" max="1.2" step="0.01" value="0.72"><span class="val mono"></span></div>
    <div class="row"><label>reach</label><input id="k_reach" type="range" min="40" max="420" step="1" value="190"><span class="val mono"></span></div>
    <div class="row"><label>darken</label><input id="k_dark" type="range" min="0" max="1" step="0.01" value="0.62"><span class="val mono"></span></div>
    <div class="row"><label>edge</label><input id="k_curve" type="range" min="0.5" max="5" step="0.05" value="2.2"><span class="val mono"></span></div>
    <div class="row"><label>spread</label><input id="k_spread" type="range" min="0" max="2" step="0.01" value="0.4"><span class="val mono"></span></div>
    <div class="row"><label>debris</label><input id="k_debris" type="range" min="0" max="1" step="0.01" value="0"><span class="val mono"></span></div>
    <div class="row"><label>decay</label><input id="k_decay" type="range" min="0" max="1" step="0.01" value="0.4"><span class="val mono"></span></div>
    <div class="row"><label>glow</label><input id="k_glow" type="range" min="0" max="1.4" step="0.01" value="0.75"><span class="val mono"></span></div>
    <div class="row"><label>bloom</label><input id="k_bloom" type="range" min="0" max="180" step="1" value="70"><span class="val mono"></span></div>
    <div class="row"><label>relief</label><input id="k_relief" type="range" min="0" max="1.5" step="0.01" value="0.9"><span class="val mono"></span></div>
  </div>

  <div class="sec" id="vSnare" hidden>
    <p class="lbl" id="lSnare">Snare</p>
    <div class="row"><label>open</label><input id="s_amt" type="range" min="0" max="4" step="0.01" value="0"><span class="val mono"></span></div>
    <div class="row"><label>pieces</label><input id="s_pieces" type="range" min="0" max="1" step="0.01" value="0.4"><span class="val mono"></span></div>
    <div class="row"><label>reach</label><input id="s_reach" type="range" min="40" max="620" step="1" value="200"><span class="val mono"></span></div>
    <div class="row"><label>ring</label><input id="s_ring" type="range" min="0.1" max="0.95" step="0.01" value="0.5"><span class="val mono"></span></div>
  </div>

  <div class="sec" id="vHat" hidden>
    <p class="lbl" id="lHat">Hat</p>
    <div class="row"><label>grain</label><input id="h_amt" type="range" min="0" max="1" step="0.01" value="0"><span class="val mono"></span></div>
    <div class="row"><label>size</label><input id="h_size" type="range" min="0.3" max="3" step="0.05" value="1.1"><span class="val mono"></span></div>
    <div class="row"><label>reach</label><input id="h_reach" type="range" min="40" max="360" step="1" value="120"><span class="val mono"></span></div>
    <div class="row"><label>ring</label><input id="h_ring" type="range" min="0.05" max="0.95" step="0.01" value="0.42"><span class="val mono"></span></div>
  </div>

  <!-- cutoff, not amount: this voice subtracts. There is nothing for it to do
       on a surface the kick has not already bent. -->
  <div class="sec" id="vRim" hidden>
    <p class="lbl" id="lRim">Rim</p>
    <div class="row"><label>cutoff</label><input id="rm_amt" type="range" min="0" max="1" step="0.01" value="0"><span class="val mono"></span></div>
    <div class="row"><label>reach</label><input id="rm_reach" type="range" min="40" max="480" step="1" value="220"><span class="val mono"></span></div>
    <div class="row"><label>ring</label><input id="rm_ring" type="range" min="0.05" max="0.95" step="0.01" value="0.30"><span class="val mono"></span></div>
    <div class="row"><label>weight</label><input id="rm_weight" type="range" min="0.4" max="12" step="0.1" value="3.0"><span class="val mono"></span></div>
  </div>

  <div class="sec" id="vBass" hidden>
    <p class="lbl" id="lBass">Bass</p>
    <div class="row"><label>weight</label><input id="b_amt" type="range" min="0" max="1" step="0.01" value="0.5"><span class="val mono"></span></div>
    <div class="row"><label>planes</label><input id="b_layers" type="range" min="2" max="9" step="1" value="5"><span class="val mono"></span></div>
    <div class="row"><label>gravity</label><input id="b_drop" type="range" min="0" max="1" step="0.01" value="0.5"><span class="val mono"></span></div>
    <div class="row"><label>area</label><input id="b_size" type="range" min="0.3" max="1" step="0.01" value="0.9"><span class="val mono"></span></div>
  </div>

  <div class="sec" id="vReverb" hidden>
    <p class="lbl" id="lReverb">Reverb</p>
    <div class="row"><label id="lRvMode">mode</label>
      <button class="rvm on" data-m="tail" style="flex:1">Tail</button>
      <button class="rvm" data-m="echo" style="flex:1">Echo</button>
      <button class="rvm" data-m="ma" style="flex:1">余白</button></div>
    <div class="row"><label>amount</label><input id="r_amt" type="range" min="0" max="1" step="0.01" value="0"><span class="val mono"></span></div>
    <div class="row"><label>taps</label><input id="r_taps" type="range" min="1" max="9" step="1" value="5"><span class="val mono"></span></div>
    <div class="row"><label>spread</label><input id="r_spread" type="range" min="2" max="90" step="1" value="26"><span class="val mono"></span></div>
    <div class="row"><label id="lRvApply">適用先</label><button id="rvApply" style="flex:1">選択中のレイヤーに掛ける</button></div>
  </div>

  <div class="sec" id="vTape" hidden>
    <p class="lbl" id="lTape">Tape</p>
    <div class="row"><label id="lTpMode">mode</label>
      <button class="tpm on" data-m="auto" style="flex:1">Auto</button>
      <button class="tpm" data-m="rgb" style="flex:1">RGB</button>
      <button class="tpm" data-m="cmy" style="flex:1">CMY</button></div>
    <div class="row"><label>split</label><input id="t_amt" type="range" min="0" max="1" step="0.01" value="0"><span class="val mono"></span></div>
    <div class="row"><label>offset</label><input id="t_off" type="range" min="1" max="26" step="0.5" value="6"><span class="val mono"></span></div>
    <div class="row"><label>wow</label><input id="t_wow" type="range" min="0" max="1" step="0.01" value="0"><span class="val mono"></span></div>
    <div class="row"><label id="lTpApply">適用先</label><button id="tpApply" style="flex:1">選択中のレイヤーに掛ける</button></div>
  </div>

  <details class="sec">
    <summary class="lbl" id="lField">Field</summary>
    <div class="row"><label>grid</label><input id="grid" type="range" min="6" max="64" step="1" value="22"><span class="val mono"></span></div>
    <div class="row"><label>size</label><input id="fill" type="range" min="0.2" max="1" step="0.01" value="1"><span class="val mono"></span></div>
    <div class="row"><label>humanize</label><input id="hum" type="range" min="0" max="1" step="0.01" value="0.35"><span class="val mono"></span></div>
  </details>

  <details class="sec">
    <summary class="lbl" id="lColour">Colour</summary>
    <div class="row"><label>wash</label><input id="wash" type="range" min="0" max="1" step="0.01" value="0"><span class="val mono"></span></div>
    <div class="row"><label>sample</label><input id="sample" type="range" min="0" max="1" step="0.01" value="0"><span class="val mono"></span></div>
    <div class="row"><label>hue A</label><input id="h1" type="range" min="0" max="360" step="1" value="262"><span class="val mono"></span></div>
    <div class="row"><label>hue B</label><input id="h2" type="range" min="0" max="360" step="1" value="22"><span class="val mono"></span></div>
  </details>

  <details class="sec">
    <summary class="lbl" id="lBg">Ground</summary>
    <div class="row"><label id="lPick">from art</label>
      <button id="pick" style="flex:1">素材の塗りを拾う</button>
      <button id="drop" class="sw" title="スポイト" hidden>⊙</button>
      <input id="swatch" class="sw" type="color" value="#000000"></div>
    <div class="row"><label>hue</label><input id="bgH" type="range" min="0" max="360" step="1" value="0"><span class="val mono"></span></div>
    <div class="row"><label>sat</label><input id="bgS" type="range" min="0" max="1" step="0.01" value="0"><span class="val mono"></span></div>
    <div class="row"><label>light</label><input id="bgL" type="range" min="0" max="1" step="0.01" value="0"><span class="val mono"></span></div>
  </details>

  <details class="sec">
    <summary class="lbl" id="lLook">Look</summary>
    <div style="display:flex;gap:6px;align-items:center">
      <button id="sq" class="on">■</button><button id="ci">●</button>
      <button id="flip">反転</button>
      <span style="flex:1"></span>
      <button id="dice">⟳</button>
    </div>
    <div class="row"><label>seed</label><input id="seedR" type="range" min="1" max="999" step="1" value="7"><span class="val mono"></span></div>
    <div class="row"><label id="lSurf">面</label>
      <button id="mPanel" class="on" style="flex:1">Panel</button>
      <button id="mDots" style="flex:1">Dots</button></div>
    <div class="row"><label id="lClip">形</label>
      <button id="clip" class="on" style="flex:1">素材の形で抜く</button></div>
    <div class="row"><label id="lInk">インク</label>
      <button id="inkAuto" class="on" style="flex:1">地に合わせる</button>
      <input id="inkSw" class="sw" type="color" value="#ebebeb"></div>
    <div class="row"><label>accent</label><input id="hue" type="range" min="0" max="360" step="1" value="55"><span class="val mono"></span></div>
  </details>
</div>

<footer>
  <button id="play" title="play">▶</button>
  <button id="live">LIVE</button>
  <button id="undo">元に戻す</button>
  <span class="mono" id="count" style="color:var(--dim);font-size:10.5px"></span>
  <span class="sp"></span>
  <button id="gif" title="ラスター — 確認・共有用">GIF</button>
  <button id="frames">連番</button>
  <button id="make">鳴らす</button>
</footer>

<script>
'use strict'
const NS = 'http://www.w3.org/2000/svg'
let W = 1000, H = 1000            // set by whatever is selected in figma
const DEF = 1000
let art = document.getElementById('art')

/* Four instruments, four operators on one surface. Not four pictures.
   A kick is not a circle and a hat is not a speck of dust: they are different
   things done to the same field.
     kick  — hits it:      a wide, deep displacement (low frequency), and then
                           decays: what it tore loose comes down as dust
     snare — breaks it:    the surface shatters into plates and they move apart.
                           No line is drawn: a crack is the space between two
                           pieces that used to touch
     hat   — breaks it up: wherever it lands the grid subdivides (high frequency)
     bass  — weighs it:    面積・重心・暗さ. Nested planes, each a flat tone,
                           offset downward. MULTIPLY, so it darkens the panel and
                           leaves the ground alone. Nothing happens: that is what
                           being held sounds like */
const VOICES = ['kick','snare','hat','rim','bass']
/* Sends, not instruments. They have no steps: they act on everything at once.
   Kaibou is an effect that comes AFTER the instrument, in raster. These two stay
   inside, in vector, because 木下's chain always runs through tape. */
const SENDS = ['reverb','tape']
const ALL = VOICES.concat(SENDS)
const V = {
  kick:  { on:[0,3,8,11], sink:0.72, reach:190, dark:0.48, curve:2.2, spread:0.4, debris:0,
           decay:0.4, glow:0.75, bloom:70, relief:0.9 },
  snare: { on:[4,12], amt:0, pieces:0.4, reach:200, ring:0.5 },
  hat:   { on:[0,2,4,6,8,10,12,14], amt:0, size:1.1, reach:120, ring:0.42 },
  /* ⭐ Rim is a high-pass, and it is the only voice that takes something away.
     The untouched plain is flat and the floor of the crater is flat; both are
     low frequency, and both leave. What is left is the slope between them —
     which is the rim. So the rim can draw nothing the kick has not made first. */
  rim:   { on:[6,14], amt:0, reach:220, ring:0.30, weight:3.0 },
  bass:  { on:[0,8], amt:0.5, layers:5, drop:0.5, size:0.9 },
  reverb:{ mode:'tail', amt:0, taps:5, spread:26 },
  tape:  { mode:'auto', amt:0, off:6, wow:0 },
}
let inst = 'kick'
/* ⭐ Solo is a set, not a switch. Press kick, then snare, and you hear both —
   which is how anyone actually builds a beat. Empty set means the whole mix.
   And solo alone is not enough: you also want three voices with one taken OUT.
   That is mute, and it is a different question. Solo says what you are listening
   to; mute says what is not playing. Solo decides first, mute has the last word.
   Sends stay on the master bus and always sound: an effect with nothing to act
   on is silence, not a quiet effect. */
/* Open on the kick alone. A beat is built one voice at a time; that is what
   this instrument is for, and the panel should start where the work starts. */
const soloSet = new Set(['kick']), muteSet = new Set()
/* ⭐ Solo works WITHIN a kind. Soloing the kick silences the other instruments and
   leaves the sends alone; soloing the reverb silences the other sends and leaves
   the instruments playing. An effect with nothing to act on is not a quiet
   effect, it is silence — which is the whole reason Siren exists at all.

   So "the reverb's graphic" is the mix with only the reverb on it. The send never
   makes a picture by itself, and it never has to. */
function audible(v){
  const kin = SENDS.includes(v) ? SENDS : VOICES
  const soloed = kin.some(x => soloSet.has(x))
  return (soloed ? soloSet.has(v) : true) && !muteSet.has(v)
}

/* ⭐ Choosing an instrument selects what you EDIT. Solo selects what you HEAR.
   Without it the panel always shows the mix, so switching to the hat shows you
   the kick's hole and the snare's plates and no way to tell what the hat did.
   A mixer's solo changes the output, not just the monitor — so this changes what
   鳴らす makes too. It is a listening mode you can commit. */
function silenced(v){
  /* Turning the amount to zero is not silence — the kick still lays down its
     height field, so cells still refuse to fold and a ghost of the crater stays
     on screen. A voice that is not playing has no steps. */
  if(v==='kick') return { on:[], sink:0, dark:0, glow:0, relief:0, decay:0, spread:0, debris:0 }
  if(v==='tape') return { amt:0, wow:0 }
  if(v==='reverb') return { amt:0 }
  return { on:[], amt:0 }
}
function withSolo(fn){
  if(!soloSet.size && !muteSet.size) return fn()
  const bak = JSON.parse(JSON.stringify(V))
  for(const v of ALL) if(!audible(v)) Object.assign(V[v], silenced(v))
  try { return fn() } finally { for(const v of ALL) Object.assign(V[v], bak[v]) }
}
function paintSolo(){
  /* the same solo set, reachable from the track or from the desk */
  for(const el of document.querySelectorAll('.trk')){
    const v = el.dataset.v
    el.classList.toggle('dim', !audible(v))
    el.querySelector('.sbtn').classList.toggle('on', soloSet.has(v))
    el.querySelector('.mbtn').classList.toggle('on', muteSet.has(v))
  }
  for(const el of document.querySelectorAll('.st')) el.classList.toggle('dim', !audible(el.dataset.v))
  for(const el of document.querySelectorAll('.ch')){
    const v = el.dataset.v
    el.classList.toggle('dim', !audible(v))
    el.querySelector('.sbtn').classList.toggle('on', soloSet.has(v))
    el.querySelector('.mbtn').classList.toggle('on', muteSet.has(v))
    el.classList.toggle('sel', v===inst)
  }
}

// The default is the web version: black, white ink, one yellow accent.
// Colour is a preset, not a starting point.
// size 1 = the surface is closed. A hole is something the kick makes, not a
// property of the material. (Circles can never close: four of them always leave
// a diamond. Choose ■ for a rim with no holes at all.)
const P = { grid:22, fill:1, hum:0.35, bars:3, shape:'sq', hue:55, seed:7,
            h1:262, h2:22, wash:0, sample:0,
            bgH:0, bgS:0, bgL:0, useFill:false, flip:false, until:-1,
            inkAuto:true, inkH:0, inkS:0, inkL:0.92, clip:true }
// light === "the surface is pale, so the ink must be dark"
const isLight = ()=> P.bgL > 0.5
/* The panel used to be whatever the ground was not: white on black, black on
   white. That is a good default and a bad law — a red ground turned the panel
   black and there was no way to say otherwise. The ground and the surface are
   two different colours, so they get two different controls. */
const inkArr = light => P.inkAuto ? (light ? [16,16,16] : [235,235,235])
                                  : hslArr(P.inkH, P.inkS, P.inkL)
let groundTouched = false      // once a ground is chosen by hand, stop guessing
let srcPaint = null            // the selected node's colour, averaged, for the ink maths
let srcFills = null            // the selected node's actual paints — gradients included
let srcShape = null            // the selected node's outline, so the panel clips like the plugin masks

/* The plugin masks its output to the selected node. If the panel keeps drawing a
   rectangle, the panel is lying about what 鳴らす will make. Take the node's own
   SVG and turn it into a clipPath. Strokes carry no area, so a stroke-only node
   yields nothing to clip with — fall back to the full rectangle rather than
   erasing the picture. */
function readShape(svgText){
  srcShape = null
  if(!svgText) return
  try{
    const doc = new DOMParser().parseFromString(svgText, 'image/svg+xml')
    if(doc.querySelector('parsererror')) return
    const bits = doc.documentElement.querySelectorAll('path,rect,circle,ellipse,polygon')
    if(!bits.length) return
    srcShape = Array.from(bits).map(b=>b.cloneNode(true))
  }catch(e){ srcShape = null }
}

/* Light lives on black. Fons works on black for the same reason: SCREEN only
   ever adds, so a dark surface is the only one that has room to be lit. */
/* Not colour variants — one blow, deepening. Read a row left to right and you
   are watching a single hit arrive.

   ⚠ A preset only ever touches ITS OWN instrument, and only the depth of it.
   The ground, the accent, 反転, the shape, humanize — those are yours, and
   stepping through the stages must never take them back. */
const PRESETS = {
  kick: {
    Surface:  { sink:0,    dark:0,    curve:3.0, spread:0,    debris:0,    reach:120, decay:0, glow:0,    bloom:60,  relief:0   },
    Touch:    { sink:0.18, dark:0.18, curve:3.4, spread:0.10, debris:0,    reach:150, decay:0.15, glow:0.28, bloom:60,  relief:0.7 },
    Sink:     { sink:0.42, dark:0.34, curve:2.8, spread:0.25, debris:0,    reach:180, decay:0.28, glow:0.5,  bloom:80,  relief:0.9 },
    Hole:     { sink:0.72, dark:0.48, curve:2.2, spread:0.40, debris:0,    reach:210, decay:0.40, glow:0.75, bloom:70,  relief:0.9 },
    Through:  { sink:0.98, dark:0.66, curve:1.9, spread:0.70, debris:0.12, reach:235, decay:0.60, glow:1.1,  bloom:110, relief:1.1 },
    Collapse: { sink:1.05, dark:0.75, curve:1.6, spread:1.25, debris:0.35, reach:250, decay:0.70, glow:0.85, bloom:190, relief:1.3 },
    Scatter:  { sink:1.05, dark:0.75, curve:1.4, spread:1.9,  debris:0.6,  reach:265, decay:0.80, glow:0.80, bloom:220, relief:1.4 },
  },
  /* how far the surface has come apart. One geometry, one knob: at a whisper the
     plates only shrink and the cracks are hairlines; at a blow they fly apart. */
  /* Off → Hairline → Split → Rift → Shatter → Burst → Scatter → Vanish.
     The story does not end where the surface first opens, and it does not end
     where the plates part. They keep going: turning further, shrinking, thinning,
     until the last of them has left and what remains is the ground. */
  snare: {
    Off:      { amt:0,    reach:200, ring:0.50 },
    Hairline: { amt:0.16, reach:180, ring:0.50 },
    Split:    { amt:0.34, reach:210, ring:0.50 },
    Rift:     { amt:0.62, reach:250, ring:0.52 },
    Shatter:  { amt:1.05, reach:300, ring:0.55 },
    Burst:    { amt:1.70, reach:370, ring:0.58 },
    Scatter:  { amt:2.60, reach:450, ring:0.62 },
    Vanish:   { amt:3.80, reach:600, ring:0.68 },
  },
  // 粒子。粒状の荒れ。how rough the surface has gone
  hat: {
    Off:      { amt:0,    size:1.10, reach:150, ring:0.42 },
    Grain:    { amt:0.28, size:1.35, reach:120, ring:0.42 },
    Sand:     { amt:0.50, size:1.15, reach:150, ring:0.44 },
    Powder:   { amt:0.75, size:0.95, reach:200, ring:0.48 },
    Mist:     { amt:1,    size:0.75, reach:260, ring:0.54 },
  },
  /* ⭐ The cutoff, climbing. One axis: how much of the surface is still allowed
     to be surface. Off → the field as it was. Ghost → the flat has thinned to an
     outline. Contour → nothing survives but the walls of the crater, and the
     picture is a map of its own relief. */
  rim: {
    Off:      { amt:0,    reach:220, ring:0.30, weight:3.0 },
    Ghost:    { amt:0.30, reach:220, ring:0.30, weight:2.4 },
    Hollow:   { amt:0.55, reach:250, ring:0.32, weight:3.0 },
    Outline:  { amt:0.80, reach:280, ring:0.34, weight:3.6 },
    Contour:  { amt:1,    reach:320, ring:0.36, weight:4.2 },
  },
  /* Reverb is a room. Echo you can count; reverb you cannot. */
  reverb: {
    Off:      { amt:0,    taps:5, spread:26 },
    Room:     { amt:0.30, taps:4, spread:16 },
    Hall:     { amt:0.55, taps:6, spread:32 },
    Cathedral:{ amt:0.85, taps:9, spread:56 },
  },
  /* Tape: the ground decides which physics you get. */
  tape: {
    Off:      { amt:0,    off:6,  wow:0 },
    Worn:     { amt:0.28, off:3,  wow:0.14 },
    Loose:    { amt:0.58, off:7,  wow:0.36 },
    Broken:   { amt:1,    off:15, wow:0.72 },
  },
  // 面積・重心・暗さ。how much mass is being held
  bass: {
    Off:      { amt:0,    layers:5, drop:0.50, size:0.90 },
    Breath:   { amt:0.18, layers:4, drop:0.35, size:0.95 },
    Swell:    { amt:0.42, layers:5, drop:0.50, size:0.90 },
    Surge:    { amt:0.70, layers:6, drop:0.68, size:0.82 },
    Bloom:    { amt:1,    layers:8, drop:0.85, size:0.72 },
  },
}
const DEFPRE = { kick:'Hole', snare:'Off', hat:'Off', rim:'Off', bass:'Swell', reverb:'Off', tape:'Off' }
const chosen_ = Object.assign({}, DEFPRE)

/* ⭐ The presets were never seven pictures. They are seven marks on one axis:
   the same blow, deepening. So make the axis real. The chips become the marks,
   and everything between them is reachable.
   (This is why "a preset only touches the depth of its own instrument" had to be
   true first — an axis can only exist if every stage moves the same knobs.) */
const stagesOf = inst => Object.keys(PRESETS[inst])
const depthOf  = {}
for(const v of ALL) depthOf[v] = stagesOf(v).indexOf(DEFPRE[v]) / (stagesOf(v).length-1)

function presetAt(inst, d){
  const names = stagesOf(inst)
  const t = d*(names.length-1)
  const i = Math.min(names.length-2, Math.floor(t)), u = t-i
  const a = PRESETS[inst][names[i]], b = PRESETS[inst][names[i+1]]
  const out = {}
  for(const k in a){ const bv = (k in b) ? b[k] : a[k]; out[k] = a[k] + (bv-a[k])*u }
  return out
}
/* land exactly on a chip and the chip lights; between two, name the span */
function stageName(inst, d){
  const names = stagesOf(inst)
  const t = d*(names.length-1)
  const i = Math.round(t)
  if(Math.abs(t-i) < 0.008) return names[i]
  return null
}
/* ---------------- the mixer ----------------
   ⭐ A fader IS the depth. Not one knob of the voice — the whole axis, seen from
   the desk. Move it and every knob that stage owns moves with it, the chip lights
   when it lands on one, and the depth slider upstairs follows, because they are
   the same number seen twice. A fader that moved only `sink` was lying: the chip
   stayed lit on a sound that had already left it.

   Sends have no S/M: they are on the master bus and they always sound. An effect
   with nothing to act on is silence, not a quiet effect. */
const MODES = { reverb:['tail','echo','ma'], tape:['auto','rgb','cmy'] }
const MODEL = { tail:'Tail', echo:'Echo', ma:'余白', auto:'Auto', rgb:'RGB', cmy:'CMY' }
const mixEl = document.getElementById('mix')
function buildMix(){
  mixEl.innerHTML = ''
  for(const v of ALL){
    if(v==='reverb'){ const g=document.createElement('div'); g.className='gap'; mixEl.append(g) }
    const d = document.createElement('div')
    d.className='ch'; d.dataset.v = v
    d.innerHTML =
      (MODES[v] ? '<div class="modes">'+MODES[v].map(m=>'<button data-m="'+m+'">'+MODEL[m]+'</button>').join('')+'</div>' : '') +
      '<input class="fader" type="range" orient="vertical" min="0" max="1" step="0.002">' +
      '<div class="sm"><button class="sbtn">S</button><button class="mbtn">M</button></div>' +
      '<span class="nm">'+cap(v)+'</span>'
    const f = d.querySelector('.fader')
    f.value = depthOf[v]
    f.oninput = ()=> setDepthOf(v, +f.value)
    f.onchange = onRelease
    d.querySelector('.nm').onclick = ()=>{ inst=v; applyInst() }
    d.querySelector('.sbtn').onclick = ()=>{
      soloSet.has(v) ? soloSet.delete(v) : soloSet.add(v)
      paintSolo(); render(); onRelease()
    }
    d.querySelector('.mbtn').onclick = ()=>{
      muteSet.has(v) ? muteSet.delete(v) : muteSet.add(v)
      paintSolo(); render(); onRelease()
    }
    if(MODES[v]) for(const b of d.querySelectorAll('.modes button')) b.onclick = ()=>{
      V[v].mode = b.dataset.m
      for(const o of d.querySelectorAll('.modes button')) o.classList.toggle('on', o===b)
      for(const o of document.querySelectorAll('.'+v.slice(0,2)+'m')) o.classList.toggle('on', o.dataset.m===b.dataset.m)
      render(); onRelease()
    }
    mixEl.append(d)
  }
  paintMix()
}
function paintMix(){
  for(const el of mixEl.querySelectorAll('.ch')){
    const v = el.dataset.v
    const f = el.querySelector('.fader')
    f.classList.toggle('off', depthOf[v] === null)   // no axis to stand on
    if(depthOf[v] !== null) f.value = depthOf[v]
    if(MODES[v]) for(const b of el.querySelectorAll('.modes button'))
      b.classList.toggle('on', b.dataset.m === V[v].mode)
  }
}

const depthEl = document.getElementById('depth'), depthV = document.getElementById('depthV')
function paintDepth(){
  const d = depthOf[inst]
  paintMix()                       // the fader IS the depth, seen from the desk
  const nm = chosen_[inst]
  if(d === null){ depthV.textContent = 'custom'; return }   // off the axis entirely
  depthEl.value = d
  if(nm){ depthV.textContent = nm }
  else {
    const names = stagesOf(inst)
    const t = d*(names.length-1)
    const i = Math.max(0, Math.min(names.length-2, Math.floor(t)))
    depthV.textContent = names[i].slice(0,4)+'→'+names[i+1].slice(0,4)
  }
}
/* one axis per voice, reachable from the desk or from the depth slider */
function setDepthOf(v, d){
  depthOf[v] = d
  Object.assign(V[v], presetAt(v, d))
  chosen_[v] = stageName(v, d)
  if(v===inst) for(const c of chipsEl.children) c.classList.toggle('on', c.textContent===chosen_[v])
  syncUI(); paintDepth(); state(); paintSolo(); render()
}
const setDepth = d => setDepthOf(inst, d)
depthEl.oninput = ()=> setDepth(+depthEl.value)
depthEl.onchange = onRelease
