<!doctype html>
<meta charset="utf-8">
<style>
:root{ --bg:#0b0b0c; --fg:#e9e9e9; --dim:#78787b; --line:#242426; --panel:#151516; --hot:#ff8a3d }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:400 12px/1.55 -apple-system,ui-sans-serif,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column}
.mono{font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}

header{padding:9px 14px 8px;border-bottom:1px solid var(--line);flex:none;
  display:flex;align-items:center;justify-content:space-between;gap:9px}
h1{font-family:"Haettenschweiler","Impact","Arial Narrow Bold",sans-serif;font-size:19px;
  letter-spacing:.06em;text-transform:uppercase;margin:0;font-weight:400;cursor:pointer;line-height:1.05}
h1:hover{opacity:.82}
/* the wordmark stacks, so the instrument has room to sit beside it */
.wm{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.by{font-size:6.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);white-space:nowrap;opacity:.75}
.wmr{display:flex;align-items:baseline;gap:7px}
.ver{font-family:ui-monospace,Menlo,monospace;font-size:9px;letter-spacing:.12em;color:var(--dim);opacity:.8}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{padding:4px 8px;font-size:10px;border-radius:20px}
.sw{width:22px;height:22px;border-radius:5px;border:1px solid var(--line);flex:none;padding:0;
     background:transparent;cursor:pointer}
input[type=color]{-webkit-appearance:none;appearance:none}
input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
input[type=color]::-webkit-color-swatch{border:none;border-radius:3px}
.lang{display:flex;flex:none}
.lang button{border-radius:0;padding:4px 9px;font-size:10.5px}
.lang button:first-child{border-radius:5px 0 0 5px}
.lang button:last-child{border-radius:0 5px 5px 0;margin-left:-1px}

/* the instrument: what everything below this line is about */
.iwrap{position:relative;flex:1;display:flex;justify-content:flex-end;min-width:0}
#instBtn{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;padding:5px 9px;
  background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:500}
.imenu{position:absolute;top:calc(100% + 5px);right:0;z-index:20;background:var(--panel);
  border:1px solid var(--line);border-radius:7px;padding:4px;min-width:150px;
  box-shadow:0 10px 22px -10px #000}
.imenu[hidden]{display:none}
.imenu button{display:block;width:100%;text-align:left;border:none;border-radius:5px;padding:6px 9px;font-size:11px}
.imenu button:hover{background:#1e1e20}
.imenu button.on{background:var(--fg);color:var(--bg)}
.imenu small{display:block;font-size:9px;color:var(--dim);letter-spacing:0;text-transform:none}
.imenu button.on small{color:var(--bg);opacity:.6}
.imenu button i{font-style:normal;float:right;font-size:9.5px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.imenu button.on i{color:var(--bg);opacity:.7}
.trk.silent{opacity:.38}
#instBtn u{text-decoration:none;opacity:.55;margin-left:5px;font-weight:400}

.scroll{flex:1;overflow-y:auto;padding:12px 14px 0;position:relative}
/* the preview earns its keep, but the sequencer has to stay reachable */
#stage{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#000;margin-bottom:10px;
  position:sticky;top:0;z-index:3;box-shadow:0 8px 16px -8px #000;
  display:grid;place-items:center;padding:6px}
#art{display:block}
#stage{min-height:120px}

button{font:inherit;font-size:11px;color:var(--fg);background:transparent;border:1px solid var(--line);
  border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--dim)}
button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.sec{border:1px solid var(--line);border-radius:8px;padding:11px 12px;margin-bottom:9px;background:var(--panel)}
.sec[hidden]{display:none}
.lbl{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin:0 0 8px}
.row{display:flex;align-items:center;gap:8px;margin-top:6px}
.row label{font-size:10px;color:var(--dim);width:58px;flex:none}
input[type=range]{flex:1;accent-color:var(--fg);height:3px}
.val{font-size:10px;width:42px;text-align:right;flex:none}

.seq{display:grid;grid-template-columns:80px repeat(16,1fr);gap:2px;align-items:center}
.trk{font-size:9px;color:var(--dim);display:flex;align-items:center;gap:4px}
.trk span{cursor:pointer}
.trk.sel span{color:var(--fg)}
.trk.dim{opacity:.3}
.sbtn{font-size:7.5px;line-height:1;padding:2px 4px;border-radius:3px;border:1px solid var(--line);
  background:transparent;color:var(--dim);cursor:pointer;flex:none}
.sbtn.on{background:var(--hot);color:#000;border-color:var(--hot)}
.mbtn.on{background:#7a4a4a;color:#fff;border-color:#7a4a4a}
.st.dim{opacity:.22}
.st{aspect-ratio:1;border:1px solid var(--line);border-radius:2px;cursor:pointer}
.st.on{background:var(--fg);border-color:var(--fg)}
.st.beat{border-color:#3a3a3d}
.st.mute{opacity:.32}

footer{flex:none;border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:7px;align-items:center}
footer .sp{flex:1}
#make{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:500;padding:7px 16px}
#count.heavy{color:var(--hot)}
#solo.on{background:var(--hot);color:#000;border-color:var(--hot)}
#count.err{color:#ff6b6b}
#count.ok{color:var(--fg)}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.modal[hidden]{display:none}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 20px 16px;width:100%;max-height:88vh;overflow-y:auto}
.mt{font-family:"Haettenschweiler","Impact",sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:24px;margin:0 0 8px;font-weight:400}
.ms{font-size:11.5px;color:var(--dim);margin:0 0 14px;line-height:1.75}
.ms b{color:var(--fg);font-weight:500}
.mlink{display:flex;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:7px;
  margin-bottom:7px;color:var(--fg);text-decoration:none;font-size:11.5px}
.mlink small{color:var(--dim);margin-left:5px}
.mcl{width:100%;margin-top:8px;padding:8px}
</style>

<div id="modal" class="modal" hidden>
  <div class="sheet">
    <p class="mt">Siren</p>
    <p class="ms" id="mSub"></p>
    <p class="ms" id="mBody"></p>
    <a class="mlink" href="https://kinoshita.studio" target="_blank" rel="noopener"><span>kinoshita studio</span><span>↗</span></a>
    <a class="mlink" href="https://99letters.bandcamp.com/album/kaibou-zukan" target="_blank" rel="noopener"><span>99LETTERS — Kaibou Zukan <small>Bandcamp</small></span><span>↗</span></a>
    <button id="mClose" class="mcl"></button>
  </div>
</div>

<header>
  <div class="wm"><div class="wmr"><h1 id="title">Siren</h1><span class="ver">V1</span></div><span class="by">by Kinoshita Studio</span></div>
  <div class="iwrap">
    <button id="instBtn">Kick ▾</button>
    <div id="instMenu" class="imenu" hidden></div>
  </div>
  <div class="lang"><button id="langJa" class="on">JP</button><button id="langEn">EN</button></div>
</header>

<div class="scroll">
  <div id="stage"><svg id="art" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg"></svg></div>

  <div class="sec">
    <p class="lbl" id="lPre">Preset</p>
    <div class="chips" id="chips"></div>
    <div class="row" style="margin-top:11px">
      <label id="lDepth">depth</label>
      <input id="depth" type="range" min="0" max="1" step="0.002" value="0.5">
      <span class="val mono" id="depthV" style="width:66px"></span></div>
  </div>

  <div class="sec" id="secSeq">
    <p class="lbl" id="lSeq">Sequence</p>
    <div class="seq" id="seq"></div>
  </div>

  <!-- one panel per instrument. Only the chosen one is on screen. -->
  <div class="sec" id="vKick">
    <p class="lbl" id="lKick">Kick</p>
    <div class="row"><label>sink</label><input id="k_sink" type="range" min="0" max="1.2" step="0.01" value="0.72"><span class="val mono"></span></div>
    <div class="row"><label>reach</label><input id="k_reach" type="range" min="40" max="420" step="1" value="190"><span class="val mono"></span></div>
    <div class="row"><label>darken</label><input id="k_dark" type="range" min="0" max="1" step="0.01" value="0.62"><span class="val mono"></span></div>
    <div class="row"><label>edge</label><input id="k_curve" type="range" min="0.5" max="5" step="0.05" value="2.2"><span class="val mono"></span></div>
    <div class="row"><label>spread</label><input id="k_spread" type="range" min="0" max="2" step="0.01" value="0.4"><span class="val mono"></span></div>
    <div class="row"><label>debris</label><input id="k_debris" type="range" min="0" max="1" step="0.01" value="0"><span class="val mono"></span></div>
    <div class="row"><label>decay</label><input id="k_decay" type="range" min="0" max="1" step="0.01" value="0.4"><span class="val mono"></span></div>
    <div class="row"><label>glow</label><input id="k_glow" type="range" min="0" max="1.4" step="0.01" value="0.75"><span class="val mono"></span></div>
    <div class="row"><label>bloom</label><input id="k_bloom" type="range" min="0" max="180" step="1" value="70"><span class="val mono"></span></div>
    <div class="row"><label>relief</label><input id="k_relief" type="range" min="0" max="1.5" step="0.01" value="0.9"><span class="val mono"></span></div>
  </div>

  <div class="sec" id="vSnare" hidden>
    <p class="lbl" id="lSnare">Snare</p>
    <div class="row"><label>open</label><input id="s_amt" type="range" min="0" max="4" step="0.01" value="0"><span class="val mono"></span></div>
    <div class="row"><label>pieces</label><input id="s_pieces" type="range" min="0" max="1" step="0.01" value="0.4"><span class="val mono"></span></div>
    <div class="row"><label>reach</label><input id="s_reach" type="range" min="40" max="620" step="1" value="200"><span class="val mono"></span></div>
    <div class="row"><label>ring</label><input id="s_ring" type="range" min="0.1" max="0.95" step="0.01" value="0.5"><span class="val mono"></span></div>
  </div>

  <div class="sec" id="vHat" hidden>
    <p class="lbl" id="lHat">Hat</p>
    <div class="row"><label>grain</label><input id="h_amt" type="range" min="0" max="1" step="0.01" value="0"><span class="val mono"></span></div>
    <div class="row"><label>size</label><input id="h_size" type="range" min="0.3" max="3" step="0.05" value="1.1"><span class="val mono"></span></div>
    <div class="row"><label>reach</label><input id="h_reach" type="range" min="40" max="360" step="1" value="120"><span class="val mono"></span></div>
    <div class="row"><label>ring</label><input id="h_ring" type="range" min="0.05" max="0.95" step="0.01" value="0.42"><span class="val mono"></span></div>
  </div>

  <div class="sec" id="vBass" hidden>
    <p class="lbl" id="lBass">Bass</p>
    <div class="row"><label>weight</label><input id="b_amt" type="range" min="0" max="1" step="0.01" value="0.5"><span class="val mono"></span></div>
    <div class="row"><label>planes</label><input id="b_layers" type="range" min="2" max="9" step="1" value="5"><span class="val mono"></span></div>
    <div class="row"><label>gravity</label><input id="b_drop" type="range" min="0" max="1" step="0.01" value="0.5"><span class="val mono"></span></div>
    <div class="row"><label>area</label><input id="b_size" type="range" min="0.3" max="1" step="0.01" value="0.9"><span class="val mono"></span></div>
  </div>

  <div class="sec" id="vReverb" hidden>
    <p class="lbl" id="lReverb">Reverb</p>
    <div class="row"><label id="lRvMode">mode</label>
      <button class="rvm on" data-m="tail" style="flex:1">Tail</button>
      <button class="rvm" data-m="echo" style="flex:1">Echo</button>
      <button class="rvm" data-m="ma" style="flex:1">余白</button></div>
    <div class="row"><label>amount</label><input id="r_amt" type="range" min="0" max="1" step="0.01" value="0"><span class="val mono"></span></div>
    <div class="row"><label>taps</label><input id="r_taps" type="range" min="1" max="9" step="1" value="5"><span class="val mono"></span></div>
    <div class="row"><label>spread</label><input id="r_spread" type="range" min="2" max="90" step="1" value="26"><span class="val mono"></span></div>
    <div class="row"><label id="lRvApply">適用先</label><button id="rvApply" style="flex:1">選択中のレイヤーに掛ける</button></div>
  </div>

  <div class="sec" id="vTape" hidden>
    <p class="lbl" id="lTape">Tape</p>
    <div class="row"><label id="lTpMode">mode</label>
      <button class="tpm on" data-m="auto" style="flex:1">Auto</button>
      <button class="tpm" data-m="rgb" style="flex:1">RGB</button>
      <button class="tpm" data-m="cmy" style="flex:1">CMY</button></div>
    <div class="row"><label>split</label><input id="t_amt" type="range" min="0" max="1" step="0.01" value="0"><span class="val mono"></span></div>
    <div class="row"><label>offset</label><input id="t_off" type="range" min="1" max="26" step="0.5" value="6"><span class="val mono"></span></div>
    <div class="row"><label>wow</label><input id="t_wow" type="range" min="0" max="1" step="0.01" value="0"><span class="val mono"></span></div>
    <div class="row"><label id="lTpApply">適用先</label><button id="tpApply" style="flex:1">選択中のレイヤーに掛ける</button></div>
  </div>

  <div class="sec">
    <p class="lbl" id="lField">Field</p>
    <div class="row"><label>grid</label><input id="grid" type="range" min="6" max="64" step="1" value="22"><span class="val mono"></span></div>
    <div class="row"><label>size</label><input id="fill" type="range" min="0.2" max="1" step="0.01" value="1"><span class="val mono"></span></div>
    <div class="row"><label>humanize</label><input id="hum" type="range" min="0" max="1" step="0.01" value="0.35"><span class="val mono"></span></div>
    <div class="row"><label>bars</label><input id="bars" type="range" min="1" max="8" step="1" value="3"><span class="val mono"></span></div>

  <div class="sec">
    <p class="lbl" id="lColour">Colour</p>
    <div class="row"><label>wash</label><input id="wash" type="range" min="0" max="1" step="0.01" value="0"><span class="val mono"></span></div>
    <div class="row"><label>sample</label><input id="sample" type="range" min="0" max="1" step="0.01" value="0"><span class="val mono"></span></div>
    <div class="row"><label>hue A</label><input id="h1" type="range" min="0" max="360" step="1" value="262"><span class="val mono"></span></div>
    <div class="row"><label>hue B</label><input id="h2" type="range" min="0" max="360" step="1" value="22"><span class="val mono"></span></div>
  </div>

  <div class="sec">
    <p class="lbl" id="lBg">Background</p>
    <div class="row"><label id="lPick">from art</label>
      <button id="pick" style="flex:1">素材の塗りを拾う</button>
      <button id="drop" class="sw" title="スポイト" hidden>⊙</button>
      <input id="swatch" class="sw" type="color" value="#000000"></div>
    <div class="row"><label>hue</label><input id="bgH" type="range" min="0" max="360" step="1" value="0"><span class="val mono"></span></div>
    <div class="row"><label>sat</label><input id="bgS" type="range" min="0" max="1" step="0.01" value="0"><span class="val mono"></span></div>
    <div class="row"><label>light</label><input id="bgL" type="range" min="0" max="1" step="0.01" value="0"><span class="val mono"></span></div>
  </div>

    <p class="lbl" id="lLook">Look</p>
    <div style="display:flex;gap:6px;align-items:center">
      <button id="sq" class="on">■</button><button id="ci">●</button>
      <button id="flip">反転</button>
      <span style="flex:1"></span>
      <button id="dice">⟳</button>
    </div>
    <div class="row"><label>seed</label><input id="seedR" type="range" min="1" max="999" step="1" value="7"><span class="val mono"></span></div>

      <button id="mDots" style="flex:1">Dots</button></div>
    <div class="row"><label id="lClip">形</label>
      <button id="clip" class="on" style="flex:1">素材の形で抜く</button></div>
    <div class="row"><label id="lInk">インク</label>
      <button id="inkAuto" class="on" style="flex:1">地に合わせる</button>
      <input id="inkSw" class="sw" type="color" value="#ebebeb"></div>
    <div class="row"><label>accent</label><input id="hue" type="range" min="0" max="360" step="1" value="55"><span class="val mono"></span></div>
  </div>
</div>

<footer>
  <button id="live">LIVE</button>
  <button id="undo">元に戻す</button>
  <span class="mono" id="count" style="color:var(--dim);font-size:10px"></span>
  <span class="sp"></span>
  <button id="make">鳴らす</button>
</footer>

<script>
'use strict'
const NS = 'http://www.w3.org/2000/svg'
let W = 1000, H = 1000            // set by whatever is selected in figma
const DEF = 1000
let art = document.getElementById('art')

/* Four instruments, four operators on one surface. Not four pictures.
   A kick is not a circle and a hat is not a speck of dust: they are different
   things done to the same field.
     kick  — hits it:      a wide, deep displacement (low frequency), and then
                           decays: what it tore loose comes down as dust
     snare — breaks it:    the surface shatters into plates and they move apart.
                           No line is drawn: a crack is the space between two
                           pieces that used to touch
     hat   — breaks it up: wherever it lands the grid subdivides (high frequency)
     bass  — weighs it:    面積・重心・暗さ. Nested planes, each a flat tone,
                           offset downward. MULTIPLY, so it darkens the panel and
                           leaves the ground alone. Nothing happens: that is what
                           being held sounds like */
const VOICES = ['kick','snare','hat','bass']
/* Sends, not instruments. They have no steps: they act on everything at once.
   Kaibou is an effect that comes AFTER the instrument, in raster. These two stay
   inside, in vector, because 木下's chain always runs through tape. */
const SENDS = ['reverb','tape']
const ALL = VOICES.concat(SENDS)
const V = {
  kick:  { on:[0,3,8,11], sink:0.72, reach:190, dark:0.48, curve:2.2, spread:0.4, debris:0,
           decay:0.4, glow:0.75, bloom:70, relief:0.9 },
  snare: { on:[4,12], amt:0, pieces:0.4, reach:200, ring:0.5 },
  hat:   { on:[0,2,4,6,8,10,12,14], amt:0, size:1.1, reach:120, ring:0.42 },
  bass:  { on:[0,8], amt:0.5, layers:5, drop:0.5, size:0.9 },
  reverb:{ mode:'tail', amt:0, taps:5, spread:26 },
  tape:  { mode:'auto', amt:0, off:6, wow:0 },
}
let inst = 'kick'
/* ⭐ Solo is a set, not a switch. Press kick, then snare, and you hear both —
   which is how anyone actually builds a beat. Empty set means the whole mix.
   And solo alone is not enough: you also want three voices with one taken OUT.
   That is mute, and it is a different question. Solo says what you are listening
   to; mute says what is not playing. Solo decides first, mute has the last word.
   Sends stay on the master bus and always sound: an effect with nothing to act
   on is silence, not a quiet effect. */
const soloSet = new Set(), muteSet = new Set()
const audible = v => (soloSet.size ? soloSet.has(v) : true) && !muteSet.has(v)

/* ⭐ Choosing an instrument selects what you EDIT. Solo selects what you HEAR.
   Without it the panel always shows the mix, so switching to the hat shows you
   the kick's hole and the snare's plates and no way to tell what the hat did.
   A mixer's solo changes the output, not just the monitor — so this changes what
   鳴らす makes too. It is a listening mode you can commit. */
function silenced(v){
  /* Turning the amount to zero is not silence — the kick still lays down its
     height field, so cells still refuse to fold and a ghost of the crater stays
     on screen. A voice that is not playing has no steps. */
  if(v==='kick') return { on:[], sink:0, dark:0, glow:0, relief:0, decay:0, spread:0, debris:0 }
  if(v==='tape') return { amt:0, wow:0 }
  if(v==='reverb') return { amt:0 }
  return { on:[], amt:0 }
}
function withSolo(fn){
  if(!soloSet.size && !muteSet.size) return fn()
  const bak = JSON.parse(JSON.stringify(V))
  for(const v of VOICES) if(!audible(v)) Object.assign(V[v], silenced(v))
  try { return fn() } finally { for(const v of VOICES) Object.assign(V[v], bak[v]) }
}
function paintSolo(){
  for(const el of document.querySelectorAll('.trk')){
    const v = el.dataset.v
    el.classList.toggle('dim', !audible(v))
    el.querySelector('.sbtn').classList.toggle('on', soloSet.has(v))
    el.querySelector('.mbtn').classList.toggle('on', muteSet.has(v))
  }
  for(const el of document.querySelectorAll('.st'))
    el.classList.toggle('dim', !audible(el.dataset.v))
}

// The default is the web version: black, white ink, one yellow accent.
// Colour is a preset, not a starting point.
// size 1 = the surface is closed. A hole is something the kick makes, not a
// property of the material. (Circles can never close: four of them always leave
// a diamond. Choose ■ for a rim with no holes at all.)
const P = { grid:22, fill:1, hum:0.35, bars:3, shape:'sq', hue:55, seed:7,

   yields nothing to clip with — fall back to the full rectangle rather than

  try{

    if(doc.querySelector('parsererror')) return
    const bits = doc.documentElement.querySelectorAll('path,rect,circle,ellipse,polygon')

/* ⭐ The presets were never seven pictures. They are seven marks on one axis:
   the same blow, deepening. So make the axis real. The chips become the marks,
   and everything between them is reachable.
   (This is why "a preset only touches the depth of its own instrument" had to be
   true first — an axis can only exist if every stage moves the same knobs.) */
const stagesOf = inst => Object.keys(PRESETS[inst])
const depthOf  = {}
for(const v of ALL) depthOf[v] = stagesOf(v).indexOf(DEFPRE[v]) / (stagesOf(v).length-1)

function presetAt(inst, d){
  const names = stagesOf(inst)
  const t = d*(names.length-1)
  const i = Math.min(names.length-2, Math.floor(t)), u = t-i
  const a = PRESETS[inst][names[i]], b = PRESETS[inst][names[i+1]]
  const out = {}
  for(const k in a){ const bv = (k in b) ? b[k] : a[k]; out[k] = a[k] + (bv-a[k])*u }
  return out
}
/* land exactly on a chip and the chip lights; between two, name the span */
function stageName(inst, d){
  const names = stagesOf(inst)
  const t = d*(names.length-1)
  const i = Math.round(t)
  if(Math.abs(t-i) < 0.008) return names[i]
  return null
}
const depthEl = document.getElementById('depth'), depthV = document.getElementById('depthV')

  else {
    const names = stagesOf(inst)
    const t = d*(names.length-1)
    const i = Math.max(0, Math.min(names.length-2, Math.floor(t)))
    depthV.textContent = names[i].slice(0,4)+'→'+names[i+1].slice(0,4)
  }
}
function setDepth(d, fromChip){
  depthOf[inst] = d
  Object.assign(V[inst], presetAt(inst, d))
  chosen_[inst] = stageName(inst, d)
  for(const c of chipsEl.children) c.classList.toggle('on', c.textContent===chosen_[inst])
  syncUI(); paintDepth(); state(); render()
}

/* ---------------- rng + colour ---------------- */
function rng(seed){
  let a=seed>>>0
  return ()=>{ a=(a+0x6D2B79F5)|0
    let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t
    return ((t^(t>>>14))>>>0)/4294967296 }
}
function hslArr(h,sat,l){
  const a=sat*Math.min(l,1-l)
  const f=n=>{const k=(n+h/30)%12; return 255*(l-a*Math.max(-1,Math.min(k-3,Math.min(9-k,1))))}
  return [f(0),f(8),f(4)]
}
/* The ground: either the artwork's own paint, or the colour we dialled in. */
const groundArr = ()=> (P.useFill && srcPaint)
  ? [srcPaint.r*255, srcPaint.g*255, srcPaint.b*255]
  : hslArr(P.bgH,P.bgS,P.bgL)
/* rgb 0..1 -> hsl, so a colour picked off the artwork lands on the sliders */
function rgbToHsl(r,g,b){
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), l=(mx+mn)/2, d=mx-mn
  if(!d) return [0,0,l]
  const sat = l>0.5 ? d/(2-mx-mn) : d/(mx+mn)
  let h
  if(mx===r) h=((g-b)/d+(g<b?6:0))
  else if(mx===g) h=(b-r)/d+2
  else h=(r-g)/d+4
  return [h*60, sat, l]
}
const hueArr = h=>{ const k=n=>(n+h/30)%12, f=n=>255*(1-Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1))))
  return [f(0),f(8),f(4)] }
const hueCss = h=>{ const c=hueArr(h); return `rgb(${c.map(v=>Math.round(v)).join(',')})` }
const mix = (a,b,t)=> a.map((v,i)=> v+(b[i]-v)*t)
const css = c => `rgb(${c.map(v=>Math.round(Math.max(0,Math.min(255,v)))).join(',')})`

/* Draw the picked paint the way Figma stacks it: index 0 at the bottom, each
   one over the last at its own opacity. Painting only the top fill and calling
   it the ground is a lie the panel used to tell. */
function drawSrcFills(){
  if(!P.useFill || !srcFills || !srcFills.length) return false
  const defs = document.createElementNS(NS,'defs')
  let drew = false
  srcFills.forEach((p,i)=>{
    if(p.visible===false) return
    let fill
    if(p.type==='SOLID'){
      fill = css([p.color.r*255, p.color.g*255, p.color.b*255])
    } else if(p.gradientStops && p.gradientStops.length){
      const id = 'src'+i
      const stops = p.gradientStops.map(st =>
        `<stop offset="${st.position}" stop-color="rgb(${Math.round(st.color.r*255)},${Math.round(st.color.g*255)},${Math.round(st.color.b*255)})" stop-opacity="${st.color.a==null?1:st.color.a}"/>`
      ).join('')
      defs.innerHTML += p.type==='GRADIENT_RADIAL'
        ? `<radialGradient id="${id}">${stops}</radialGradient>`
        : `<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1">${stops}</linearGradient>`
      fill = `url(#${id})`
    } else return
    if(!drew){ art.append(defs); drew = true }
    const r = document.createElementNS(NS,'rect')
    r.setAttribute('width',W); r.setAttribute('height',H)
    r.setAttribute('fill', fill)
    r.setAttribute('opacity', p.opacity==null ? 1 : p.opacity)
    art.append(r)
  })
  return drew
}

/* A slider fires far faster than the panel can redraw a few thousand nodes.
   Coalesce onto the frame. */
let frameReq = 0
function render(){
  if(frameReq) return
  frameReq = requestAnimationFrame(()=>{ frameReq = 0; withSolo(draw) })
}

/* ---------------- preview (svg, same maths as the plugin) ----------------
   ⚠ This function and make() in code.js must consume the RNG in exactly the
   same order, or the same seed draws two different pictures. Every `continue`,
   every short-circuited `R()` is part of the contract. Change one, change both. */
function draw(){
  const R = rng(P.seed*7919+13)
  const S = Math.min(W,H)
  art.setAttribute('viewBox', `0 0 ${W} ${H}`)
  // fit the target's shape into the panel: use the full width, cap the height
  const stage = document.getElementById('stage')
  const availW = Math.max(120, stage.clientWidth - 14)
  const k0 = Math.min(availW / W, 236 / H)
  art.style.width  = Math.round(W * k0) + 'px'
  art.style.height = Math.round(H * k0) + 'px'
  while(art.firstChild) art.removeChild(art.firstChild)   // art is still the <svg> here

  const defs = document.createElementNS(NS,'defs')
  defs.innerHTML = `
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="${hueCss(P.h1)}"/><stop offset="1" stop-color="${hueCss(P.h2)}"/>
    </linearGradient>`
  art.append(defs)

  /* everything the sequence draws goes inside this, cut to the artwork's shape,
     exactly as the plugin's mask cuts the real thing */
  let stageG = art
  if(P.clip && srcShape){
    const cp = document.createElementNS(NS,'clipPath')
    cp.setAttribute('id','srcclip')
    cp.setAttribute('clipPathUnits','userSpaceOnUse')
    for(const b of srcShape) cp.append(b.cloneNode(true))
    defs.append(cp)
    stageG = document.createElementNS(NS,'g')
    stageG.setAttribute('clip-path','url(#srcclip)')
    art.append(stageG)
  }
  const artOut = art
  art = stageG

  const chosen = groundArr()
  const pale = P.useFill && srcPaint
    ? (0.2126*chosen[0] + 0.7152*chosen[1] + 0.0722*chosen[2]) / 255 > 0.5
    : isLight()
  /* 反転 swaps the panel and the void. Turning the ink over while the ground
     stays put only makes the surface vanish into it. */
  const panel = pale ? [16,16,16] : [235,235,235]
  const ground = P.flip ? panel : chosen
  const light = P.flip ? !pale : pale
  const ink = inkArr(light)

  const bg = document.createElementNS(NS,'rect')
  bg.setAttribute('width',W); bg.setAttribute('height',H)
  bg.setAttribute('fill', css(ground)); art.append(bg)
  if(!P.flip) drawSrcFills()

  if(P.wash>0){
    const w = document.createElementNS(NS,'rect')
    w.setAttribute('width',W); w.setAttribute('height',H)
    w.setAttribute('fill','url(#wash)'); w.setAttribute('opacity',P.wash.toFixed(2)); art.append(w)
  }

  const F = field(R, W, H, S)
  /* Broken or whole — the field is one or the other, never a grid with a net of
     cracks painted over it. */
  const broken = V.snare.amt>0 && F.shards.length>0
  const cells = broken ? paintPlates(R, F, W, H, S, ground, ink, light)
                       : paintCells(R, F, W, H, S, ground, ink, light)
  /* The lamps go UNDER the panel. Light on a white surface is a white smudge —
     SCREEN can only add, and a closed panel has nothing to add to. So the light
     lives beneath, the way the dark does, and it shows only where the surface
     broke and let it through. The panel hides its own glow until it is holed. */
  /* ⭐ A send is on the master bus. Reverb does not act on the surface and leave
     the grain dry — nobody sends only the kick to the reverb. Everything the
     sequence made goes into one `mix`, and the sends act on that. Otherwise you
     cannot tell what the reverb is even touching. */
  const mixG = document.createElementNS(NS,'g')
  art = mixG
  lamps(R, F, W, H, S, light)
  mixG.append(cells.gF)
  let n = cells.n + albers(F, W, H, S, light) + grains(R, F, W, H, S, ground) + dust(R, F, ink)
  art = stageG

  n += reverb(mixG, W, H, S, light)     // the tail decays BEHIND its source
  stageG.append(mixG)
  n += tape(mixG, W, H, S, light)

  art = artOut

  if(!sayTimer){                     // never clobber a status message
    cEl.textContent = n + ' nodes'
    cEl.classList.toggle('heavy', n > 4000)
  }
}

/* ---- the field: run the sequence, build the three height maps + the tears --
   Shared, verbatim, with code.js. sink is what the kick digs; sub is how finely
   the hat has broken the surface; lift is the band the bass holds up. */
function field(R, W, H, S){
  const G=P.grid, cell=S/G
  const GX=Math.ceil(W/cell), GY=Math.ceil(H/cell)
  const sink=new Float32Array(GX*GY), grit=new Float32Array(GX*GY)
  const jit = a=>(R()*2-1)*a*P.hum
  const hits=[], cracks=[]
  let hold=0
  const K=V.kick

  for(let bar=0;bar<P.bars;bar++) for(let s=0;s<16;s++){
    const ang = (s/16)*Math.PI*2 - Math.PI/2 + jit(0.06)

    if(K.on.includes(s)){
      const r = S*0.5*0.30*(1+jit(0.10))
      const hx=W/2+Math.cos(ang)*r, hy=H/2+Math.sin(ang)*r
      const reach=K.reach*(1+jit(0.18))*(S/DEF)
      hits.push({x:hx,y:hy,r:reach})
      for(let gy=0;gy<GY;gy++) for(let gx=0;gx<GX;gx++){
        const cx=(gx+0.5)*cell, cy=(gy+0.5)*cell
        const d2=(cx-hx)*(cx-hx)+(cy-hy)*(cy-hy)
        sink[gy*GX+gx] += Math.exp(-d2/(reach*reach))
      }
    }
    /* A crack drawn as a line is an illustration of a crack. Here the surface
       itself comes apart: the snare marks where it was struck, and the field
       shatters into plates around those points. */
    if(V.snare.on.includes(s) && V.snare.amt>0){
      const r=S*0.5*V.snare.ring*(1+jit(0.06))
      const a=ang+jit(0.05)
      cracks.push({ x:W/2+Math.cos(a)*r, y:H/2+Math.sin(a)*r })
    }
    /* ハイハット = 粒子。粒状の荒れ。
       Not a shape. Not a smaller kick — a smaller kick belongs inside the kick.
       The hat adds nothing to the field and takes nothing from it. This map only
       says WHERE the grain is dense. The grain itself is scattered later as
       points, with a minimum distance between them — the only way a particle can
       be smaller than the space around it. */
    if(V.hat.on.includes(s) && V.hat.amt>0){
      const r=S*0.5*V.hat.ring*(1+jit(0.05))
      const hx=W/2+Math.cos(ang)*r, hy=H/2+Math.sin(ang)*r
      const reach=V.hat.reach*(1+jit(0.20))*(S/DEF)
      for(let gy=0;gy<GY;gy++) for(let gx=0;gx<GX;gx++){
        const cx=(gx+0.5)*cell, cy=(gy+0.5)*cell
        const d2=(cx-hx)*(cx-hx)+(cy-hy)*(cy-hy)
        grit[gy*GX+gx] += Math.exp(-d2/(reach*reach))
      }
    }
    /* A held note has no attack point and no edge, so it draws nothing here. How
       long it is held is all the field needs to know. */
    if(V.bass.on.includes(s)) hold++
  }

  /* ⭐ Voronoi plates. Each seed owns the cells nearest to it, and the whole plate
     moves as one body, away from the blow that broke it. Two neighbouring plates
     go different ways, so a gap opens along the seam they used to share — and
     what you see in the gap is the ground. There is no crack node. A crack is the
     space between two pieces that used to touch. */
  const shards=[]
  if(V.snare.amt>0 && cracks.length){
    const n = Math.round(20 + V.snare.pieces*100)
    const reach = V.snare.reach*(S/DEF)
    for(let i=0;i<n;i++){
      const sx=R()*W, sy=R()*H
      let bx=0, by=0, bd=1e18
      for(const c of cracks){
        const d=(sx-c.x)*(sx-c.x)+(sy-c.y)*(sy-c.y)
        if(d<bd){ bd=d; bx=c.x; by=c.y }
      }
      const dx=sx-bx, dy=sy-by, d=Math.sqrt(dx*dx+dy*dy)||1
      /* mostly away from the blow, partly its own way. Real fracture is not
         radially obedient, and two hits on one axis would otherwise send every
         plate sideways and lay the cracks down in stripes. */
      const ra=R()*Math.PI*2, m=0.6
      let vx=(dx/d)*m + Math.cos(ra)*(1-m), vy=(dy/d)*m + Math.sin(ra)*(1-m)
      const vl=Math.sqrt(vx*vx+vy*vy)||1
      shards.push({ x:sx, y:sy, vx:vx/vl, vy:vy/vl,
                    f:Math.exp(-bd/(reach*reach)), rot:(R()*2-1)*0.10 })
    }
  }

  let smax=0; for(const v of sink) if(v>smax) smax=v; if(smax<1e-6) smax=1
  let gmax=0; for(const v of grit) if(v>gmax) gmax=v; if(gmax<1e-6) gmax=1
  return {cell,GX,GY,sink,grit,smax,gmax,hits,shards,hold}
}

/* the crater floor, sampled anywhere — not just at cell centres, because the
   hat's subcells sit between them */
function kAtF(F,x,y,curve){
  const fx=x/F.cell-0.5, fy=y/F.cell-0.5
  const x0=Math.floor(fx), y0=Math.floor(fy)
  const tx=fx-x0, ty=fy-y0
  const g=(gx,gy)=>F.sink[Math.min(F.GY-1,Math.max(0,gy))*F.GX + Math.min(F.GX-1,Math.max(0,gx))]
  const a=g(x0,y0)+(g(x0+1,y0)-g(x0,y0))*tx
  const b=g(x0,y0+1)+(g(x0+1,y0+1)-g(x0,y0+1))*tx
  return Math.pow(Math.max(0,(a+(b-a)*ty)/F.smax), curve)
}
function biAtF(arr,F,x,y){
  const fx=x/F.cell-0.5, fy=y/F.cell-0.5
  const x0=Math.floor(fx), y0=Math.floor(fy)
  const tx=fx-x0, ty=fy-y0
  const g=(gx,gy)=>arr[Math.min(F.GY-1,Math.max(0,gy))*F.GX + Math.min(F.GX-1,Math.max(0,gx))]
  const a=g(x0,y0)+(g(x0+1,y0)-g(x0,y0))*tx
  const b=g(x0,y0+1)+(g(x0+1,y0+1)-g(x0,y0+1))*tx
  return a+(b-a)*ty
}
/* ---- blue noise: Bridson's Poisson-disc -----------------------------------
   ⭐ Every point is at least r from every other, otherwise random. That kills the
   clumping of white noise AND the regularity of a grid at once. Because there are
   no cells, the grain's size is decoupled from its spacing — and a grain far
   smaller than the gap around it IS the definition of grain. A grid can never do
   this: its dot can never be smaller than its own cell. That was the whole bug. */
function poisson(R, r, w, h){
  const cs=r/Math.SQRT2, gw=Math.ceil(w/cs), gh=Math.ceil(h/cs)
  const grid=new Int32Array(gw*gh).fill(-1), pts=[], act=[]
  const put=p=>{ pts.push(p); act.push(pts.length-1); grid[(p[1]/cs|0)*gw+(p[0]/cs|0)]=pts.length-1 }
  put([R()*w, R()*h])
  while(act.length){
    const ai=R()*act.length|0, p=pts[act[ai]]
    let hit=false
    for(let i=0;i<18;i++){
      const a=R()*Math.PI*2, rr=r*(1+R())
      const q=[p[0]+Math.cos(a)*rr, p[1]+Math.sin(a)*rr]
      if(q[0]<0||q[1]<0||q[0]>=w||q[1]>=h) continue
      const gx=q[0]/cs|0, gy=q[1]/cs|0
      let ok=true
      for(let yy=Math.max(0,gy-2);yy<=Math.min(gh-1,gy+2)&&ok;yy++)
        for(let xx=Math.max(0,gx-2);xx<=Math.min(gw-1,gx+2);xx++){
          const id=grid[yy*gw+xx]
          if(id>=0 && Math.hypot(pts[id][0]-q[0],pts[id][1]-q[1])<r){ ok=false; break }
        }
      if(ok){ put(q); hit=true; break }
    }
    if(!hit) act.splice(ai,1)
  }
  return pts
}

/* ---- Voronoi by half-plane clipping. No library, no Delaunay. -------------
   A cell is the box, clipped once against the bisector with every other seed. */
function clipHalf(poly,a,b){
  const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2, nx=b[0]-a[0], ny=b[1]-a[1]
  const f=p=>(p[0]-mx)*nx+(p[1]-my)*ny
  const out=[]
  for(let i=0;i<poly.length;i++){
    const p=poly[i], q=poly[(i+1)%poly.length]
    const dp=f(p), dq=f(q)
    if(dp<=0) out.push(p)
    if((dp<=0)!==(dq<=0)){ const t=dp/(dp-dq); out.push([p[0]+(q[0]-p[0])*t, p[1]+(q[1]-p[1])*t]) }
  }
  return out
}
function voronoiCells(seeds,W,H){
  const box=[[0,0],[W,0],[W,H],[0,H]]
  return seeds.map((s,i)=>{
    let poly=box
    for(let j=0;j<seeds.length;j++){ if(i!==j){ poly=clipHalf(poly,s,seeds[j]); if(!poly.length) break } }
    return poly
  })
}
const centroid=p=>{ let x=0,y=0; for(const q of p){x+=q[0];y+=q[1]} return [x/p.length,y/p.length] }
const shrinkPoly=(p,c,f)=>p.map(q=>[c[0]+(q[0]-c[0])*f, c[1]+(q[1]-c[1])*f])
const pathD=p=>'M'+p.map(q=>q[0].toFixed(2)+','+q[1].toFixed(2)).join('L')+'Z'

/* which plate this point belongs to. Nearest seed wins — that is Voronoi. */
function shardAt(F,x,y){
  let best=null, bd=1e18
  for(const sh of F.shards){
    const d=(x-sh.x)*(x-sh.x)+(y-sh.y)*(y-sh.y)
    if(d<bd){ bd=d; best=sh }
  }
  return best
}

const LX=-0.62, LY=-0.62, LZ=0.48

/* wow & flutter: a slow sine down the frame plus a fine tremor. Transport speed
   instability, drawn. It is a coordinate transform — no effect, no blend mode. */
function wowAt(y, H){
  const w = V.tape.wow
  if(!(w>0)) return 0
  const t = y/H
  return (Math.sin(t*Math.PI*2.2 + P.seed*0.7)*9 + Math.sin(t*Math.PI*17 + P.seed)*1.6) * w
}

/* ---- the surface, when it has broken --------------------------------------
   ⭐ When the snare sounds, the field is no longer a grid. It IS the plates.
   The kick's hole does not sit on top of them — it is the plates near the impact
   going dark and shrinking away until the ground shows through. One event, not
   two layers. That is why the cells go away instead of being decorated. */
function paintPlates(R, F, W, H, S, ground, ink, light){
  const {cell} = F
  const K=V.kick, Sn=V.snare
  const accent = hueArr(P.hue), cA = hueArr(P.h1), cB = hueArr(P.h2)
  const gF=document.createElementNS(NS,'g')
  const polys = voronoiCells(F.shards.map(s=>[s.x,s.y]), W, H)
  let n=0

  polys.forEach((poly,i)=>{
    if(poly.length<3) return
    const sh=F.shards[i]
    const c=centroid(poly)
    const k=kAtF(F,c[0],c[1],K.curve)
    const dx=(kAtF(F,c[0]+cell,c[1],K.curve)-kAtF(F,c[0]-cell,c[1],K.curve))*0.5
    const dy=(kAtF(F,c[0],c[1]+cell,K.curve)-kAtF(F,c[0],c[1]-cell,K.curve))*0.5
    const shade=(dx*LX+dy*LY+LZ)/Math.sqrt(dx*dx+dy*dy+1)-LZ
    // a surface breaks where the stress is, and the stress is on the crater wall
    const slope=Math.sqrt(dx*dx+dy*dy)
    const sF=Sn.amt*sh.f*(0.28 + 0.72*Math.min(1, slope*6))

    let col=mix(ink, mix(cA,cB,c[0]/W*0.6+c[1]/H*0.4), P.sample*(1-k*0.55))
    col=mix(col, ground, Math.min(1,k*K.dark*1.25))
    if(shade>0)      col=mix(col,[255,255,255],Math.min(1, shade*2.2*K.relief))
    else if(shade<0) col=mix(col, ground,       Math.min(1,-shade*1.5*K.relief))
    const lit=(k-0.82)/0.18
    if(lit>0) col=mix(col, mix([255,255,255],accent,0.6), Math.min(1,lit*K.glow))

    /* the plate shrinks — that is the crack, and it is also the hole: a plate at
       the bottom of the kick shrinks to nothing and the ground is what is left */
    /* A plate that has not moved must not draw its own outline — neighbouring
       polygons that share an edge exactly still leave a hairline where they meet.
       Unbroken plates overlap a little; broken ones open for real. */
    const grow=1 + 0.022*(1-Math.min(1, sF*6))
    const f=(1 - sF*0.145)*(1 - k*K.sink*0.62)*grow
    if(!(f>0.02)) return                    // this plate has gone
    let p=shrinkPoly(poly,c,f)
    // once loose, a plate accelerates: it is no longer part of anything
    const push=Math.pow(sF,1.25)*cell*0.9, rot=sh.rot*sF
    const cs=Math.cos(rot), sn=Math.sin(rot)
    p=p.map(q=>{
      const rx=q[0]-c[0], ry=q[1]-c[1]
      return [c[0]+rx*cs-ry*sn + sh.vx*push + wowAt(q[1],H), c[1]+rx*sn+ry*cs + sh.vy*push]
    })
    const el=document.createElementNS(NS,'path')
    el.setAttribute('d', pathD(p))
    el.setAttribute('fill', css(col))
    // past a certain distance a plate has left the surface, and it thins out
    const gone = Math.max(0, sF-1)
    const op = (1-k*0.28) * Math.max(0.06, 1 - gone*0.34)
    if(k>0.02 || gone>0) el.setAttribute('opacity', op.toFixed(2))
    gF.append(el); n++
  })
  return {n, gF}
}

function paintCells(R, F, W, H, S, ground, ink, light){
  const {cell,GX,GY} = F
  const K=V.kick, Bs=V.bass
  const accent = hueArr(P.hue), cA = hueArr(P.h1), cB = hueArr(P.h2)
  const base = cell*P.fill
  const gF=document.createElementNS(NS,'g')
  let n=0

  /* ⭐ Only a cell that MOVED has to be a node.
     A fine grid costs thousands of rectangles, and almost all of them are asleep:
     closed, flat, the same colour as the one beside them. Those are not panels,
     they are one panel. Fold each run of sleeping cells into a single rectangle
     and spend the budget where something actually happened. */
  const asleep = new Uint8Array(GX*GY)
  const canFold = P.shape==='sq' && P.fill>0.9 && P.sample<0.02

  for(let gy=0;gy<GY;gy++) for(let gx=0;gx<GX;gx++){
    const px=(gx+0.5)*cell, py=(gy+0.5)*cell

    if(canFold){
      const kC = kAtF(F,px,py,K.curve)
      // nothing reached this cell. It is still the surface it always was.
      if(kC<0.012){ asleep[gy*GX+gx]=1; continue }
    }

    const k = kAtF(F,px,py,K.curve)          // the rim stays surface
    const dx=(kAtF(F,px+cell,py,K.curve)-kAtF(F,px-cell,py,K.curve))*0.5
    const dy=(kAtF(F,px,py+cell,K.curve)-kAtF(F,px,py-cell,K.curve))*0.5
    const shade=(dx*LX+dy*LY+LZ)/Math.sqrt(dx*dx+dy*dy+1)-LZ
    // displaced material: shoved down the slope, piled just outside the pit
    const slope=Math.sqrt(dx*dx+dy*dy)
    const swell=1 + K.spread*slope*3.2*(1-k)
    let size = base*(1-k*K.sink)*swell
    if(!(size>0.6)) continue

    let push = K.spread*slope*cell*5.5
    // torn loose: no longer surface, so it loses its corners and is thrown clear
    const loose = K.debris>0 && k>0.2 && k<0.85 && R()<K.debris
    if(loose){ push *= 1.6+R()*2.4; size *= 0.35+R()*0.4 }
    // only a cell that is already moving gets nudged — a closed rim stays closed
    const j = cell*0.16*Math.min(1, k*3)
    let cx = px - dx/(slope||1)*push + (R()*2-1)*j*P.hum
    let cy = py - dy/(slope||1)*push + (R()*2-1)*j*P.hum
    cx += wowAt(py, H)


    const tt=cx/W*0.6+cy/H*0.4
    let col=mix(ink, mix(cA,cB,tt), P.sample*(1-k*0.55))
    col=mix(col, ground, Math.min(1,k*K.dark*1.25))       // it falls into the hole
    if(shade>0)      col=mix(col,[255,255,255],Math.min(1, shade*2.2*K.relief))
    else if(shade<0) col=mix(col, ground,       Math.min(1,-shade*1.5*K.relief))
    const lit=(k-0.82)/0.18                                // only the floor is lit
    if(lit>0) col=mix(col, mix([255,255,255],accent,0.6), Math.min(1,lit*K.glow))

    const seam = (P.shape==='sq' && !loose && P.fill>0.9)
      ? cell*0.09*Math.min(1,(P.fill-0.9)/0.1)*(1-Math.min(1,k*1.5)) : 0
      const dsz = size + seam
      let el
      if(loose || P.shape==='ci'){
        el=document.createElementNS(NS,'circle')
        el.setAttribute('cx',cx.toFixed(2)); el.setAttribute('cy',cy.toFixed(2)); el.setAttribute('r',(size/2).toFixed(2))
      }else{
        el=document.createElementNS(NS,'rect')
        el.setAttribute('x',(cx-dsz/2).toFixed(2)); el.setAttribute('y',(cy-dsz/2).toFixed(2))
        el.setAttribute('width',dsz.toFixed(2)); el.setAttribute('height',dsz.toFixed(2))
      const rot=(R()*2-1)*6*P.hum*Math.min(1, k*3)
        if(Math.abs(rot)>0.2) el.setAttribute('transform',`rotate(${rot.toFixed(2)} ${cx.toFixed(2)} ${cy.toFixed(2)})`)
      }
      el.setAttribute('fill',css(col))
      const op = loose ? Math.max(0.15,(1-k*0.28)*(0.35+R()*0.5)) : (1-k*0.28)
      if(k>0.02 || loose) el.setAttribute('opacity',op.toFixed(2))
    gF.append(el); n++
  }

  /* one rectangle per horizontal run of sleeping cells */
  const flat = css(ink)
  const over = cell*0.14
  for(let gy=0;gy<GY;gy++){
    let x0=-1
    for(let gx=0;gx<=GX;gx++){
      const on = gx<GX && asleep[gy*GX+gx]
      if(on && x0<0) x0=gx
      else if(!on && x0>=0){
        const r=document.createElementNS(NS,'rect')
        r.setAttribute('x',(x0*cell-over).toFixed(2)); r.setAttribute('y',(gy*cell-over).toFixed(2))
        r.setAttribute('width',((gx-x0)*cell+over*2).toFixed(2)); r.setAttribute('height',(cell+over*2).toFixed(2))
        r.setAttribute('fill',flat)
        gF.insertBefore(r, gF.firstChild); n++
        x0=-1
      }
    }
  }
  return {n, gF}
}

/* The same lamps the plugin builds. Keep them identical or the panel lies.
   SCREEN only adds, MULTIPLY only subtracts — so a pale ground can carry the
   shadows and nothing else. Blur radii are fractions of the crater diameter D.
   On a pale ground the SCREEN half adds nothing and the MULTIPLY half survives
   alone as black balls. Place none of them there. */
function lamps(R, F, W, H, S, light){
  const K=V.kick
  if(!(K.glow>0 && F.hits.length && K.relief>0 && !light)) return
  const accent = hueArr(P.hue)
  const LN=Math.sqrt(LX*LX+LY*LY), ux=LX/LN, uy=LY/LN
  const gl=Math.min(1.4,K.glow)
  const defs2=document.createElementNS(NS,'defs')
  art.append(defs2)
  let uid=0
  const lamp=(h,o)=>{
    const D=h.r*2, d=D*o.size
    if(!(d>0.5)) return
    const id='L'+(uid++)
    // a spark flies away from where the hit happened, not from the light
    let dirx = o.away ? -ux : ux, diry = o.away ? -uy : uy
    if(o.burst){
      const rx=h.x-W/2, ry=h.y-H/2, rl=Math.sqrt(rx*rx+ry*ry)
      if(rl>1e-3){ const a=Math.atan2(ry,rx)+(R()*2-1)*0.6; dirx=Math.cos(a); diry=Math.sin(a) }
    }
    defs2.innerHTML +=
      `<radialGradient id="g${id}">`+
      `<stop offset="0" stop-color="${css(o.c)}" stop-opacity="${o.a}"/>`+
      `<stop offset="0.45" stop-color="${css(o.c)}" stop-opacity="${o.a*0.3}"/>`+
      `<stop offset="1" stop-color="${css(o.c)}" stop-opacity="0"/></radialGradient>`+
      `<filter id="f${id}" x="-80%" y="-80%" width="260%" height="260%">`+
      `<feGaussianBlur stdDeviation="${Math.max(0.3, D*o.blur*0.5).toFixed(2)}"/></filter>`
    const c=document.createElementNS(NS,'circle')
    c.setAttribute('cx',(h.x+D*o.off*dirx).toFixed(1))
    c.setAttribute('cy',(h.y+D*o.off*diry).toFixed(1))
    c.setAttribute('r',(d/2).toFixed(1))
    c.setAttribute('fill',`url(#g${id})`)
    c.setAttribute('filter',`url(#f${id})`)
    c.setAttribute('opacity',Math.max(0,Math.min(1,o.op)).toFixed(2))
    c.setAttribute('style','mix-blend-mode:'+o.mode)
    art.append(c)
  }
  const WH=[255,255,255]
  for(const h of F.hits){
    // No occlusion, no shadow. The dark is not painted on: it is the ground,
    // and it appears because the panels fell away from it.
    const throwOut = 0.08 + K.spread*0.10   // it still flies outward, but the panel is over it
    lamp(h,{c:WH,    a:0.90,size:0.20,off:throwOut,burst:1,blur:0.06,mode:'screen',    op:0.75*gl})
    lamp(h,{c:accent,a:0.30,size:0.60,off:throwOut,burst:1,blur:0.20,mode:'soft-light',op:0.7*gl})
  }
}

/* ---- reverb: ぼかし＝畳み込み ---------------------------------------------
   Not a metaphor. A gaussian blur and a reverb tail are the same computation, so
   the tail is drawn the only honest way: copies of the surface, each offset
   further, each blurred more, each fainter. The blur GROWING is the whole thing —
   late reflections diffuse, and a sharp edge dissolves into a wash you can no
   longer count.

   Echo is the sibling, not the same knob: discrete repeats, evenly spaced, NOT
   blurred. You can count them. Never mix the two.

   余白 is not a third mechanism. It is R1 aimed into an emptiness: bias the tail
   one way and leave that way clear, and the eye extrapolates the decay past the
   last copy. Empty space with nothing decaying into it is just a margin. */
function reverb(mix, W, H, S, light){
  const RV=V.reverb
  if(!(RV.amt>0)) return 0
  const N = Math.max(1, Math.round(RV.taps))
  const px = S/DEF
  const defs = document.createElementNS(NS,'defs')
  art.append(defs)
  let n=0
  for(let i=N;i>=1;i--){
    const t = i/N
    const echo = RV.mode==='echo'
    const blur = echo ? 0 : Math.max(0.3, t*RV.spread*0.55*px)
    const step = RV.spread*px
    const dx = echo ? i*step*0.8 : (RV.mode==='ma' ? Math.pow(t,0.8)*step*N*0.45 : t*step*1.1)
    const dy = echo ? i*step*0.35 : (RV.mode==='ma' ? 0 : t*step*0.45)
    const op = (echo ? Math.pow(0.62,i) : Math.pow(0.55,i)*1.6) * RV.amt
    if(op < 0.004) continue
    const c = mix.cloneNode(true)
    if(blur>0.3){
      const id='rv'+i
      defs.innerHTML += `<filter id="${id}" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="${blur.toFixed(2)}"/></filter>`
      c.setAttribute('filter',`url(#${id})`)
    }
    c.setAttribute('transform',`translate(${dx.toFixed(2)},${dy.toFixed(2)})`)
    c.setAttribute('opacity',op.toFixed(3))
    /* ⚠️ NOT screen. A tail is not light — it is the image of the source, fainter.
       SCREEN on a white panel blows the panel out and the surface disappears,
       leaving only whatever was drawn in MULTIPLY (the bass) still visible. Light
       lives on black; a reflection lives anywhere. NORMAL is ground-independent,
       which is exactly what a decaying copy should be. */
    art.append(c); n += c.childElementCount
  }
  return n
}

/* ---- tape: 全体の揺れ、色ズレ ---------------------------------------------
   ⭐ Ink is subtractive: cyan on white paper absorbs red, and two inks overlapping
   make the paper darker. That is MULTIPLY, and it only does anything on a light
   ground. Light is additive: red plus green plus blue is white. That is SCREEN,
   and it only does anything on a dark ground.

   So there is no single misregistration. There are two, and the ground decides
   which physics you are in. Auto asks the ground. Choose by hand if you want the
   wrong one on purpose. */
const CH_RGB = [[255,0,0],[0,255,0],[0,0,255]]
const CH_CMY = [[0,183,200],[229,0,109],[255,216,0]]
function tape(mix, W, H, S, light){
  const TP=V.tape
  if(!(TP.amt>0)) return 0
  const ink = TP.mode==='cmy' || (TP.mode==='auto' && light)
  const ch = ink ? CH_CMY : CH_RGB
  const off = TP.off*(S/DEF)*TP.amt
  const dirs = [[-off,-off*0.4],[0,off*0.5],[off,-off*0.2]]
  let n=0
  mix.setAttribute('style','display:none')      // the channels replace it
  for(let i=0;i<3;i++){
    const c = mix.cloneNode(true)
    c.removeAttribute('style')
    const col = css(ch[i])
    for(const e of c.querySelectorAll('*')) e.setAttribute('fill', col)
    c.setAttribute('transform',`translate(${dirs[i][0].toFixed(2)},${dirs[i][1].toFixed(2)})`)
    c.setAttribute('style','mix-blend-mode:'+(ink?'multiply':'screen'))
    art.append(c); n += c.childElementCount
  }
  return n
}

/* ---- bass: 面積・重心・暗さ ------------------------------------------------
   A drum is an event. A held note is not — it has no attack point and no edge,
   so it cannot be a shape that happens. It is mass: nested planes, each a flat
   tone, offset downward so the visual weight settles low. Area is the mass, the
   low placement is the centre of gravity, the tone is the darkness. Nothing
   happens, and that is what being held looks like.

   MULTIPLY: it darkens the panel and does nothing at all to the ground, because
   the ground is already dark. Same arithmetic that keeps the lamps off a pale
   surface. On a pale ground the panels are the dark thing, so it lightens
   instead — SCREEN — and the weight still reads. */
function albers(F, W, H, S, light){
  const B=V.bass
  if(!(B.amt>0) || !F.hold) return 0
  const held = Math.min(1, F.hold/6)          // how long the note is held = its area
  const N = Math.max(2, Math.round(B.layers))
  const g = document.createElementNS(NS,'g')
  g.setAttribute('style','mix-blend-mode:'+(light?'screen':'multiply'))
  const w0 = Math.min(W,H)*B.size*(0.55+0.45*held)
  for(let i=0;i<N;i++){
    const t = i/(N-1)
    const w = w0*(1 - t*0.72)
    const x = W/2 - w/2
    // the mass settles low: the bottom border thins, the top thickens
    const y = H/2 - w/2 + (w0-w)*0.5*B.drop
    const v = 1 - t*0.86                      // each plane one flat tone, darkening inward
    const c = light ? 255*(1-v*B.amt*0.9) : 255*v
    const r = document.createElementNS(NS,'rect')
    r.setAttribute('x',x.toFixed(1)); r.setAttribute('y',y.toFixed(1))
    r.setAttribute('width',w.toFixed(1)); r.setAttribute('height',w.toFixed(1))
    r.setAttribute('fill', css([c,c,c]))
    r.setAttribute('opacity', (B.amt*(0.30+0.70*held)).toFixed(3))
    g.append(r)
  }
  art.append(g)
  return N
}

/* ---- the hat: 粒子・粒状の荒れ --------------------------------------------
   Grain sits ON the surface and never asks what the surface is made of — cells,
   plates, it does not care. It is the ground showing through where the panel has
   worn away. Dense where the hat landed, absent where it did not. It adds no
   structure, so it cannot add BIT. */
function grains(R, F, W, H, S, ground){
  const HT=V.hat, K=V.kick
  if(!(HT.amt>0)) return 0
  // spacing tightens as the hat opens. The grain gets denser, never bigger.
  const r = Math.max(3, (34 - 14*HT.amt) * (S/DEF))
  const pts = poisson(R, r, W, H)
  const g = document.createElementNS(NS,'g')
  const gcol = css(ground)
  const sz0 = HT.size*2.0*(S/DEF)
  let n=0
  for(const p of pts){
    /* A hi-hat is not a place, it is a texture: it grains the whole surface, and
       the ring it plays on only makes some of that surface grainier. */
    const dens = HT.amt*(0.45 + 0.55*Math.min(1, biAtF(F.grit,F,p[0],p[1])/F.gmax))
    if(R() > dens) continue
    const k = kAtF(F,p[0],p[1],K.curve)
    if(k > 0.72) continue                              // the hole is already ground
    const sz = sz0*(0.30 + Math.pow(R(),2.4)*2.7)      // many tiny, a few larger
    if(!(sz > 0.30)) continue
    const op = 0.35 + R()*0.65
    const c=document.createElementNS(NS,'circle')
    c.setAttribute('cx',p[0].toFixed(2)); c.setAttribute('cy',p[1].toFixed(2))
    c.setAttribute('r',sz.toFixed(2))
    c.setAttribute('fill',gcol)
    c.setAttribute('opacity',op.toFixed(2))
    g.append(c); n++
  }
  art.append(g)
  return n
}

/* ---- dust: the pieces that came down --------------------------------------
   There are no shock rings here, and there is no ripple in the height field
   either. Both were tried. A ring painted over the panel is white light on a
   white surface and it vanishes; a ripple shaded into the cells turns the field
   into a staircase, because every cell is a shape and a thousand shapes look
   like a thousand shapes. Smooth shading is not something a vector synth can
   say. It is what Kaibou is for — blur is reverb, and reverb belongs after the
   instrument, not inside it.

   So the decay is this: debris that has settled. It is the panel's own colour,
   so it can only be seen where the panel is gone — inside the crater, where the
   ground shows through. That is where it fell. */
function dust(R, F, ink){
  const K=V.kick
  if(!(K.decay>0) || !F.hits.length) return 0
  let n=0
  const inkCss=css(ink)
  for(const h of F.hits){
    const cnt = Math.round(K.decay*30)
    for(let i=0;i<cnt;i++){
      const a = R()*Math.PI*2
      const u = R()
      const rr = h.r*(0.18 + Math.pow(u,0.55)*0.92)   // the hollow, not the field
      const sz = F.cell*0.14*(0.3+R()*0.85)
      if(!(sz>0.3)) continue
      const el=document.createElementNS(NS,'rect')
      el.setAttribute('x',(h.x+Math.cos(a)*rr-sz/2).toFixed(2))
      el.setAttribute('y',(h.y+Math.sin(a)*rr-sz/2).toFixed(2))
      el.setAttribute('width',sz.toFixed(2)); el.setAttribute('height',sz.toFixed(2))
      el.setAttribute('fill',inkCss)
      el.setAttribute('opacity',(K.decay*(0.3+0.7*(1-u))*0.8).toFixed(2))
      art.append(el); n++
    }
  }
  return n
}

/* ---------------- to figma ---------------- */
function payload(){
  // what the plugin builds must be what the panel showed
  const v = withSolo(()=> JSON.parse(JSON.stringify(V)))
  // soloed layers stack on the same artwork; they have to say which voice they are
  const on = VOICES.filter(audible)
  const named = (soloSet.size || muteSet.size) ? on.join('+') : null
  return Object.assign({}, P, { srcFills: P.useFill ? srcFills : null, v, soloOf: named })
}
/* The count is also the status line: pressing a button and seeing nothing change
   for half a second is indistinguishable from pressing a button that did nothing. */
const cEl = document.getElementById('count')
let sayTimer = 0
function say(text, kind){
  clearTimeout(sayTimer)
  cEl.textContent = text
  cEl.classList.toggle('err', kind==='err')
  cEl.classList.toggle('ok', kind==='ok')
  cEl.classList.toggle('heavy', kind==='warn')
  if(kind==='busy') sayTimer = -1              // hold the line while it works
  else if(kind) sayTimer = setTimeout(()=>{ sayTimer=0; cEl.className='mono'; render() }, 2600)
  else sayTimer = 0
}

let pendingSend = null       // a release that landed mid-flight; never drop it
function send(type){
  if(busy){ pendingSend = type; return }
  busy = true
  say(lang==='ja' ? '反映しています…' : 'applying…', 'busy')
  parent.postMessage({pluginMessage:{type, p:payload()}}, '*')
  setTimeout(()=>{
    busy = false
    if(pendingSend){ const t2 = pendingSend; pendingSend = null; send(t2) }
  }, 120)
}
function onRelease(){ if(live) send('live') }

/* ⭐ Siren does not have to make a surface. A send can act on what is already
   there — a path, a shape, a group — and never touch the original. */
for(const [id,which] of [['rvApply','reverb'],['tpApply','tape']]){
  document.getElementById(id).onclick = ()=>{
    say(lang==='ja' ? '素材に掛けています…' : 'applying to artwork…', 'busy')
    parent.postMessage({pluginMessage:{type:'send', p:payload(), which}}, '*')
  }
}
const liveBtn = document.getElementById('live')
liveBtn.onclick = ()=>{
  live = !live
  liveBtn.classList.toggle('on', live)
  if(live) send('live')
  else parent.postMessage({pluginMessage:{type:'discard'}}, '*')   // a preview is never kept
}
document.getElementById('undo').onclick = ()=>{
  parent.postMessage({pluginMessage:{type:'discard'}}, '*')
  live = false; liveBtn.classList.remove('on')
}
document.getElementById('make').onclick = ()=>{
  live = false; liveBtn.classList.remove('on')
  send('make')
}

onmessage = e=>{
  const m = e.data.pluginMessage
  if(!m) return
  if(m.type==='target'){
    W = m.w || 1000; H = m.h || 1000
    srcPaint = m.paint || null
    srcFills = m.fills || null
    readShape(m.shape)
    // Match the artwork by default. Nobody wants to press a button to be told
    // what colour the thing they just selected is.
    if(srcFills && !groundTouched) P.useFill = true
    if(!srcFills){ P.useFill = false }
    document.getElementById('pick').classList.toggle('on', !!P.useFill)
    document.getElementById('pick').disabled = !srcFills
    paintSwatch(); render()
  }
  if(m.type==='made'){
    const ja = lang==='ja'
    if(m.many) say(ja ? '素材を1つだけ選んで（複数選択は無視しました）' : 'select exactly one layer', 'err')
    else if(!m.into) say(ja ? `${m.nodes} ノード — 素材が選ばれていないので画面の中央に置きました`
                            : `${m.nodes} nodes — nothing selected, placed at the centre`, 'warn')
    else say(ja ? `${m.nodes} ノードを「${m.into}」に${m.preview?'プレビュー':'反映'}しました`
                : `${m.nodes} nodes ${m.preview?'previewed on':'placed on'} “${m.into}”`, 'ok')
  }
  if(m.type==='sent') say(lang==='ja' ? `${m.which} を素材に掛けました（${m.nodes} ノード）`
                                       : `${m.which} applied to the artwork (${m.nodes} nodes)`, 'ok')
  if(m.type==='error') say('ERR: ' + m.message, 'err')
}

applyLang(); paintSwatch(); paintInk(); paintSolo(); render()
parent.postMessage({pluginMessage:{type:'target'}}, '*')
</script>
