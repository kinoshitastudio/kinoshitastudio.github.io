<!doctype html>
<meta charset="utf-8">
<title>Siren — store art</title>
<!-- Siren store art generator.
     mark() / rnd() / hueCss() are copied verbatim from siren/_lookbook/play.html,
     so the scattered field on the cover is drawn with Siren's own particle mark
     (the 6-point asterisk) and its own colour math. The left of the seam is the
     sequencer line (the beat); it hits the orange strike and scatters into a
     field of your marks. Shot headless — see the neighbouring Kaibou _shoot notes. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#0b0b0c;overflow:hidden}
  canvas{display:block}
</style>
<canvas id="out"></canvas>
<script>
'use strict'

/* ---- verbatim from play.html ---- */
function rnd(seed){ let a=seed>>>0; return ()=>{ a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296 } }
const hueCss=h=>{const k=n=>(n+h/30)%12,f=n=>Math.round(255*(1-Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)))));return `rgb(${f(0)},${f(8)},${f(4)})`}

/* Siren's particle: three rounded bars at 60° = a 6-point asterisk. */
function mark(c,X,Y,r,rot,col,alpha){
  c.save(); c.translate(X,Y); c.rotate(rot||0); c.globalAlpha=alpha==null?1:alpha; c.fillStyle=col
  const w=Math.max(1.2,r*0.32)
  for(let i=0;i<3;i++){ c.beginPath(); c.roundRect(-w/2,-r,w,2*r,w/2); c.fill(); c.rotate(Math.PI/3) }
  c.restore()
}

const cv=(w,h)=>{ const c=document.createElement('canvas'); c.width=w; c.height=h; return c }
const BG='#0b0b0c', FG='#e9e9e9', HOT='#ff8a3d', DIM='#8a8a8e', DIM2='#5a5a5e'
const ORANGE_HUE=28   // Siren's default key hue

/* premium finish, matching play.html's bloom + vignette */
function bloom(c,W,H,amt){ if(amt<=0) return; c.save(); c.globalCompositeOperation='lighter'; c.globalAlpha=Math.min(0.9,amt); c.filter='blur('+Math.max(2,Math.round(W*0.010))+'px)'; c.drawImage(c.canvas,0,0); c.filter='none'; c.restore() }

/* ============================================================
   the scatter — a burst of marks around a point, faithful to
   drawMode('burst'): rings of the asterisk, orange + white accents,
   fading outward. Rendered as one frozen frame.
   ============================================================ */
function scatterField(c, cx, cy, spread, unit, seed, dir){
  const R = rnd(seed>>>0)
  const col = HOT, HL = '#ffffff'      // brand orange, not the yellowish hueCss
  // concentric bursts, biased to the right of the strike, thinning outward
  const RINGS = 5
  for(let ring=0; ring<RINGS; ring++){
    const age = ring/RINGS
    const rad = spread*(0.10 + age*0.92)
    const M = 5 + ring*3
    const al = 1 - age*0.78
    for(let i=0;i<M;i++){
      const a = (i/M*6.283) + R()*0.5 + ring*0.3
      // push everything to the right: cos(a) folded positive, plus a rightward bias
      const rightness = dir>0 ? (Math.abs(Math.cos(a))*0.8 + 0.35) : 1
      const x = cx + Math.cos(a)*rad*rightness + (R()-0.5)*spread*0.06
      const y = cy + Math.sin(a)*rad*0.86 + (R()-0.5)*spread*0.05
      const rr = unit*(0.45 + al*0.6) * (0.75 + R()*0.5)
      mark(c, x, y, rr, a, i%4===0?HL:col, al*(0.45+R()*0.45))
    }
  }
  // a few stray far marks, right side only, for life without clutter
  for(let i=0;i<6;i++){
    const a=R()*6.283, rad=spread*(0.7+R()*0.5)
    const x=cx+Math.abs(Math.cos(a))*rad, y=cy+Math.sin(a)*rad*0.7
    mark(c, x, y, unit*(0.3+R()*0.3), a, R()<0.25?'#ffffff':col, 0.14+R()*0.18)
  }
}

/* ============================================================
   the cover
   ============================================================ */
function drawCover(W,H){
  const out = cv(W,H), g = out.getContext('2d')
  g.fillStyle = BG; g.fillRect(0,0,W,H)

  const CX = W*0.60, CY = H*0.50          // the strike / seam
  const col = hueCss(ORANGE_HUE)

  // ---- warm halo behind the strike ----
  const halo = g.createRadialGradient(CX, CY, 0, CX, CY, H*0.62)
  halo.addColorStop(0,  'rgba(255,138,61,.18)')
  halo.addColorStop(.5, 'rgba(255,138,61,.05)')
  halo.addColorStop(1,  'rgba(255,138,61,0)')
  g.fillStyle = halo; g.fillRect(0,0,W,H)

  // ---- the sequencer line entering from the left of the seam ----
  const unit = H*0.052
  const lineX0 = W*0.30, lineY = CY
  g.strokeStyle = 'rgba(233,233,233,.55)'; g.lineWidth = Math.max(2, H*0.004)
  g.beginPath(); g.moveTo(lineX0, lineY); g.lineTo(CX, lineY); g.stroke()
  // the beat dots on the line — the middle-heavy one is the downbeat, in orange
  const dots = [
    {x:0.30, r:0.36, c:FG},
    {x:0.375, r:0.58, c:HOT},
    {x:0.455, r:0.36, c:FG},
    {x:0.53, r:0.46, c:FG},
  ]
  for(const d of dots){
    g.beginPath(); g.fillStyle = d.c
    g.arc(W*d.x, lineY, unit*d.r, 0, 7); g.fill()
  }

  // ---- the field: the beat scatters into your marks, right of the strike ----
  scatterField(g, CX+H*0.11, CY, H*0.44, unit*0.72, 7, +1)
  bloom(g, W, H, 0.15)

  // ---- the orange strike line ----
  g.strokeStyle = HOT; g.lineWidth = Math.max(3, H*0.006); g.globalAlpha = .92
  g.beginPath(); g.moveTo(CX, H*0.10); g.lineTo(CX, H*0.90); g.stroke()
  g.globalAlpha = 1

  // ---- edge vignette so the field fades into the frame ----
  const vg = g.createRadialGradient(W*0.68, CY, H*0.30, W*0.68, CY, H*0.85)
  vg.addColorStop(0,'rgba(11,11,12,0)'); vg.addColorStop(1,'rgba(11,11,12,.72)')
  g.fillStyle = vg; g.fillRect(0,0,W,H)

  // ---- type, left ----
  const L = W*0.062
  g.textBaseline = 'alphabetic'

  g.fillStyle = DIM
  g.font = `400 ${Math.round(H*0.0205)}px 'Space Mono', ui-monospace, monospace`
  let lx = L; for(const ch of 'FIGMA PLUGIN — SHIAN 志庵'){ g.fillText(ch, lx, H*0.315); lx += g.measureText(ch).width + H*0.0048 }

  g.fillStyle = FG
  g.font = `400 ${Math.round(H*0.152)}px Anton, 'Arial Narrow', Impact, sans-serif`
  g.fillText('SIREN', L - H*0.004, H*0.465)
  const wmW = g.measureText('SIREN').width

  g.fillStyle = DIM
  g.font = `500 ${Math.round(H*0.056)}px 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', sans-serif`
  g.fillText('鳴物', L + wmW + H*0.028, H*0.465)

  g.fillStyle = FG
  g.font = `400 ${Math.round(H*0.038)}px 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', sans-serif`
  g.fillText('マークを、鳴らす。', L, H*0.578)

  g.fillStyle = DIM2
  g.font = `400 ${Math.round(H*0.0215)}px 'Space Mono', ui-monospace, monospace`
  g.fillText('12 distributions  ·  timeline  ·  frames + SVG into Figma', L, H*0.652)

  return out
}

/* ============================================================
   the icon — a single strike scattering, small and legible
   ============================================================ */
/* The icon is the SHIAN Siren brand mark — a beat line with dots, the downbeat
   in orange (assets/img/icon-siren.svg), the way Kaibou's icon is its own glyph.
   Drawn on the 64 grid it was authored on, scaled to fill the tile. */
function drawIcon(S){
  const out = cv(S,S), g = out.getContext('2d')
  g.fillStyle = BG; g.fillRect(0,0,S,S)

  // whisper of a warm halo behind the downbeat, like the site header
  const halo = g.createRadialGradient(S*0.42, S*0.5, 0, S*0.42, S*0.5, S*0.5)
  halo.addColorStop(0,'rgba(255,138,61,.20)'); halo.addColorStop(.6,'rgba(255,138,61,.04)'); halo.addColorStop(1,'rgba(255,138,61,0)')
  g.fillStyle = halo; g.fillRect(0,0,S,S)

  // 64-grid -> icon, centred, filling ~84% of the width
  const span = S*0.84, u = span/(50-14), x0 = (S-span)/2 - 14*u, cy = S*0.5
  const X = v => x0 + v*u
  g.lineCap = 'round'

  // the line
  g.strokeStyle = FG; g.lineWidth = 3*u
  g.beginPath(); g.moveTo(X(14), cy); g.lineTo(X(50), cy); g.stroke()

  // the dots — white, orange downbeat (bigger), white, white
  const dot = (v,r,c)=>{ g.beginPath(); g.fillStyle=c; g.arc(X(v), cy, r*u, 0, 7); g.fill() }
  dot(14, 4,   FG)
  dot(26, 6.5, HOT)
  dot(37, 4,   FG)
  dot(48, 5,   FG)
  return out
}

/* ---- render whatever the url asked for ---- */
async function fonts(){
  const want=["400 100px Anton","400 40px 'Space Mono'","400 40px 'Zen Kaku Gothic New'","500 40px 'Zen Kaku Gothic New'"]
  try{ await Promise.all(want.map(f=>document.fonts.load(f,'SIREN 鳴物 マーク'))); await document.fonts.ready }catch(e){}
}
const q=new URLSearchParams(location.search), what=q.get('t')||'cover', S=parseInt(q.get('s')||'128',10)
async function go(){
  await fonts()
  const o=document.getElementById('out')
  const made = what==='icon' ? drawIcon(S) : drawCover(1920,1080)
  o.width=made.width; o.height=made.height
  o.getContext('2d').drawImage(made,0,0)
  document.title='ready'
}
go()
</script>
