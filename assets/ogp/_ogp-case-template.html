<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Cormorant+Garamond:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{position:relative;font-family:'Zen Kaku Gothic New',sans-serif}
  .grid{position:absolute;inset:0}
  .bar{position:absolute;left:60px;top:62px;width:3px;height:462px}
  .top-l{position:absolute;left:86px;top:70px;font-family:'Space Mono',monospace;font-size:15px;letter-spacing:.12em}
  .top-r{position:absolute;right:100px;top:73px;font-family:'Space Mono',monospace;font-size:15px;letter-spacing:.02em;text-align:right}
  .title{position:absolute;left:84px;top:118px;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:96px;line-height:1;letter-spacing:.005em;white-space:nowrap}
  .sub{position:absolute;left:86px;top:214px;font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700;font-size:40px;line-height:1;letter-spacing:.02em;white-space:nowrap}
  .meta{position:absolute;left:88px;top:272px;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:27px;letter-spacing:.01em}
  .url{position:absolute;left:86px;top:554px;font-family:'Space Mono',monospace;font-size:15px;letter-spacing:.06em}
  .mark{position:absolute;right:64px;top:258px;width:118px;height:118px;
    -webkit-mask:url(/assets/img/logo-mark.png) center/contain no-repeat;
    mask:url(/assets/img/logo-mark.png) center/contain no-repeat}
</style>
</head>
<body>
  <div class="grid" id="grid"></div>
  <div class="bar" id="bar"></div>
  <div class="top-l" id="tl">KINOSHITA STUDIO — Case Study</div>
  <div class="top-r" id="tr">Web Design / Photography</div>
  <div class="title" id="title">Avenir</div>
  <div class="sub" id="sub">写真撮影業 | Webサイト</div>
  <div class="meta" id="meta">2025 — Direction / Design / Shiga</div>
  <div class="url" id="url">kinoshita.studio</div>
  <div class="mark" id="mark"></div>
<script>
  (function(){
    var q=new URLSearchParams(location.search);
    function g(k,d){var v=q.get(k); return v===null?d:v;}
    var bg=g('bg','#EBE8E2'), accent=g('accent','#a89060'),
        fg=g('fg','#1a1a18'), muted=g('muted','#6b675f'), tlc=g('tl_c','#6b675f'),
        gridDark=g('grid','l')==='d';
    document.body.style.background=bg;
    var gl=gridDark?'rgba(255,255,255,0.035)':'rgba(26,26,24,0.05)';
    document.getElementById('grid').style.backgroundImage=
      'linear-gradient('+gl+' 1px,transparent 1px),linear-gradient(90deg,'+gl+' 1px,transparent 1px)';
    document.getElementById('grid').style.backgroundSize='100px 100px';
    document.getElementById('grid').style.backgroundPosition='-1px -1px';
    document.getElementById('bar').style.background=accent;
    document.getElementById('mark').style.background=accent;
    var tl=document.getElementById('tl'); tl.style.color=tlc;
    document.getElementById('tr').style.color=fg;
    document.getElementById('title').style.color=fg;
    document.getElementById('sub').style.color=fg;
    document.getElementById('meta').style.color=muted;
    document.getElementById('url').style.color=fg;
    // テキスト
    function set(id,key){var v=q.get(key); if(v!==null) document.getElementById(id).textContent=v;}
    set('tl','t_tl'); set('title','t_title'); set('sub','t_sub'); set('meta','t_meta');
    var tr=q.get('t_tr');
    if(tr===null||tr===''){document.getElementById('tr').style.display='none';}
    else{document.getElementById('tr').textContent=tr;}
    // タイトル/サブが長い場合は収まるよう自動縮小
    function fit(id,max,base){var el=document.getElementById(id);var s=base;el.style.fontSize=s+'px';
      while(el.scrollWidth>max&&s>28){s-=2;el.style.fontSize=s+'px';}}
    fit('title',1060,96); fit('sub',1060,40);
    document.documentElement.setAttribute('data-ready','1');
  })();
</script>
</body>
</html>
