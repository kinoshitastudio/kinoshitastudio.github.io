<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0e0e0c;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 64px 80px;
    font-family: 'Space Mono', monospace;
  }

  .top {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .top-label {
    font-size: 11px;
    letter-spacing: .32em;
    color: #666;
    text-transform: uppercase;
  }

  .sep {
    color: #333;
    font-size: 11px;
  }

  .top-product {
    font-size: 11px;
    letter-spacing: .24em;
    color: #a89060;
    text-transform: uppercase;
  }

  .center {
    display: flex;
    align-items: center;
    gap: 72px;
    flex: 1;
    padding: 24px 0;
  }

  .icon-wrap {
    width: 160px;
    height: 160px;
    border-radius: 36px;
    overflow: hidden;
    flex-shrink: 0;
    background: #1a1a18;
  }

  .icon-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .text {
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .product-name {
    font-size: 72px;
    font-weight: 700;
    color: #f0ece4;
    letter-spacing: .04em;
    line-height: 1;
  }

  .tagline {
    font-size: 18px;
    color: #888;
    letter-spacing: .08em;
    line-height: 1.5;
  }

  .tagline em {
    font-style: normal;
    color: #c8b890;
  }

  .bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .studio {
    font-size: 11px;
    letter-spacing: .28em;
    color: #444;
    text-transform: uppercase;
  }

  .pill {
    font-size: 10px;
    letter-spacing: .22em;
    color: #666;
    border: 1px solid #333;
    padding: 6px 16px;
    text-transform: uppercase;
  }
</style>
</head>
<body>

  <div class="top">
    <span class="top-label">Case Study</span>
    <span class="sep">/</span>
    <span class="top-product">Chrome Extension</span>
  </div>

  <div class="center">
    <div class="icon-wrap">
      <img src="../../enough/icon128.png" alt="ENOUGH">
    </div>
    <div class="text">
      <div class="product-name">ENOUGH</div>
      <div class="tagline">
        数字を隠すより、<em>問いを置く。</em><br>
        SNS介入 Chrome 拡張の体験翻訳記録。
      </div>
    </div>
  </div>

  <div class="bottom">
    <span class="studio">kinoshita studio</span>
    <span class="pill">kinoshita.studio</span>
  </div>

</body>
</html>
