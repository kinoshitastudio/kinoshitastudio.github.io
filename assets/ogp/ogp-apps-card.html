<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0e0e0c;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 56px 72px;
    font-family: 'Space Mono', monospace;
  }

  .top-label {
    font-size: 11px;
    letter-spacing: .32em;
    color: #a89060;
    text-transform: uppercase;
  }

  .center {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 80px;
    flex: 1;
  }

  .app {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }

  .icon-wrap {
    width: 120px;
    height: 120px;
    border-radius: 28px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .icon-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .app-name {
    font-size: 13px;
    letter-spacing: .16em;
    color: #e8e5de;
    text-align: center;
    font-weight: 700;
    display: block;
    margin-bottom: 6px;
  }

  .app-type {
    font-size: 9.5px;
    letter-spacing: .14em;
    color: #3a3830;
    text-align: center;
    display: block;
  }

  .divider {
    width: 1px;
    height: 100px;
    background: #1e1e1c;
  }

  .bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .tagline {
    font-size: 11px;
    letter-spacing: .12em;
    color: #2e2e2c;
    font-style: italic;
  }

  .url {
    font-size: 10px;
    letter-spacing: .18em;
    color: #3a3830;
  }
</style>
</head>
<body>

  <div class="top-label">Kinoshita Studio &nbsp;·&nbsp; App Products &nbsp;·&nbsp; 2026</div>

  <div class="center">

    <div class="app">
      <div class="icon-wrap" style="background:#111;">
        <img src="../thumbs/bmboard-icon.png" alt="BMBoard">
      </div>
      <span class="app-name">Black Mirror Board</span>
      <span class="app-type">Canvas Tool · Web App</span>
    </div>

    <div class="divider"></div>

    <div class="app">
      <div class="icon-wrap" style="background:#1a1880;">
        <img src="../thumbs/atelier-icon.png" alt="Atelier" style="border-radius:50%;">
      </div>
      <span class="app-name">Ateli.er</span>
      <span class="app-type">Music Platform · Web App</span>
    </div>

    <div class="divider"></div>

    <div class="app">
      <div class="icon-wrap" style="background:#7A9B7E;">
        <img src="../thumbs/kodoco-transparent.svg" alt="KODOCO">
      </div>
      <span class="app-name">KODOCO</span>
      <span class="app-type">Family App · Web App</span>
    </div>
    </div>

  </div>

  <div class="bottom">
    <div class="tagline">Zero dependencies. One person. Shiga, Japan.</div>
    <div class="url">kinoshitastudio.github.io</div>
  </div>

</body>
</html>
