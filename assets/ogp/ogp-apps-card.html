<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0e0e0c;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 52px 80px;
    font-family: 'Space Mono', monospace;
  }

  .top {
    align-self: stretch;
    font-size: 11px;
    letter-spacing: .32em;
    color: #a89060;
    text-transform: uppercase;
  }

  .center {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 72px;
  }

  .app {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .icon-wrap {
    width: 148px;
    height: 148px;
    border-radius: 32px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .icon-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .app-name {
    font-size: 20px;
    letter-spacing: .08em;
    color: #e8e5de;
    text-align: center;
    font-weight: 700;
  }
  .app-type {
    font-size: 11px;
    letter-spacing: .18em;
    color: #555;
    text-align: center;
  }

  .divider {
    width: 1px;
    height: 120px;
    background: #1e1e1c;
    flex-shrink: 0;
  }

  .bottom {
    align-self: stretch;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .tagline {
    font-size: 11px;
    letter-spacing: .14em;
    color: #444;
  }
  .url {
    font-size: 10px;
    letter-spacing: .22em;
    color: #3a3830;
  }
</style>
</head>
<body>

  <div class="top">Kinoshita Studio &nbsp;·&nbsp; App Products &nbsp;·&nbsp; 2026</div>

  <div class="center">

    <div class="app">
      <div class="icon-wrap" style="background:#f0ede8;">
        <img src="/Users/kinoshitatakahiro/Desktop/Github/99letters.github.io/projects/black_mirror/icon-512.png" alt="BMBoard">
      </div>
      <span class="app-name">Black Mirror Board</span>
      <span class="app-type">Canvas Tool · Web App</span>
    </div>

    <div class="divider"></div>

    <div class="app">
      <div class="icon-wrap" style="background:#1a1880;">
        <img src="../thumbs/atelier-icon.webp" alt="Atelier" style="border-radius:50%;">
      </div>
      <span class="app-name">Ateli.er</span>
      <span class="app-type">Music Platform · Web App</span>
    </div>

    <div class="divider"></div>

    <div class="app">
      <div class="icon-wrap" style="background:#7A9B7E;">
        <img src="../thumbs/kodoco-transparent.svg" alt="KODOCO">
      </div>
      <span class="app-name">KODOCO</span>
      <span class="app-type">Family App · Web App</span>
    </div>

  </div>

  <div class="bottom">
    <div class="tagline">Zero dependencies. One person. Shiga, Japan.</div>
    <div class="url">kinoshita.studio</div>
  </div>

</body>
</html>
