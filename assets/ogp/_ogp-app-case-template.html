<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,follow">
<!--
  個人開発ケーススタディ用 OGP カード（1200×630）。
  既存の ogp-case-kodoco.png / -atelier / -bmboard と同じ意匠をクエリ文字列で使い回せるようにしたもの。
  icon にアプリアイコン画像がある時は icon=/assets/img/...、無い時は icon_text=NOA で文字タイルにする。
  ※ 別意匠の 2 種：_ogp-case-template.html（受託ケース・明るい紙）／_ogp-page-template.html（道具・実験ページ）
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&family=Space+Mono:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{position:relative;background:#0e0e0c;font-family:'Zen Kaku Gothic New',sans-serif}
  .top{position:absolute;left:80px;top:64px;font-family:'Space Mono',monospace;font-size:11px;
    letter-spacing:.14em;color:#6f6f6a}
  .top b{font-weight:400;color:#a89060}
  .icon{position:absolute;left:80px;top:220px;width:160px;height:160px;border-radius:28px;overflow:hidden;
    display:flex;align-items:center;justify-content:center;background:#151515}
  .icon img{width:100%;height:100%;object-fit:cover;display:block}
  .icon .txt{font-family:'Space Mono',monospace;font-weight:700;font-size:34px;letter-spacing:.16em;color:#e9e9e4}
  .name{position:absolute;left:280px;top:222px;font-family:'Inter',sans-serif;font-weight:300;
    font-size:64px;line-height:1;letter-spacing:.01em;color:#f0efe9;white-space:nowrap}
  .tag{position:absolute;left:281px;top:316px;font-weight:700;font-size:20px;letter-spacing:.01em;color:#e9e9e4}
  .tag2{position:absolute;left:281px;top:350px;font-weight:400;font-size:18px;letter-spacing:.01em;color:#98988f}
  .sig{position:absolute;left:80px;bottom:64px;font-family:'Space Mono',monospace;font-size:11px;
    letter-spacing:.14em;color:#6f6f6a}
  .badge{position:absolute;right:80px;bottom:56px;font-family:'Space Mono',monospace;font-size:12px;
    letter-spacing:.04em;color:#c9c9c2;border:1px solid #33332f;border-radius:3px;padding:6px 12px}
</style>
</head>
<body>
  <div class="top" id="top">CASE STUDY &nbsp;/&nbsp; <b id="cat">PARENTING APP</b></div>
  <div class="icon" id="icon"><span class="txt" id="icon_text">NOA</span></div>
  <div class="name" id="name">Noa</div>
  <div class="tag" id="tag">iPhoneから、Macを動かす。</div>
  <div class="tag2" id="tag2">ブラウザベースのWebターミナルの体験翻訳。</div>
  <div class="sig">KINOSHITA STUDIO</div>
  <div class="badge">kinoshita.studio</div>
<script>
  (function(){
    var q = new URLSearchParams(location.search);
    function set(id, key){ var v = q.get(key); if (v !== null) document.getElementById(id).textContent = v; }
    set('cat','t_cat'); set('name','t_name'); set('tag','t_tag'); set('tag2','t_tag2'); set('icon_text','t_icon');

    // アイコン画像がある時は文字タイルを差し替える
    var src = q.get('icon');
    if (src){
      var box = document.getElementById('icon');
      box.innerHTML = '';
      var img = new Image();
      img.src = src;
      box.appendChild(img);
    }
    var ibg = q.get('icon_bg'); if (ibg) document.getElementById('icon').style.background = ibg;

    // 名前が長い時は収まるまで縮める
    var name = document.getElementById('name'), s = 64;
    while (name.scrollWidth > 800 && s > 30){ s -= 2; name.style.fontSize = s + 'px'; }

    Promise.all([
      document.fonts ? document.fonts.ready : Promise.resolve(),
      new Promise(function(res){
        var im = document.querySelector('.icon img');
        if (!im) return res();
        im.complete ? res() : (im.onload = res, im.onerror = res);
      })
    ]).then(function(){
      requestAnimationFrame(function(){ document.documentElement.setAttribute('data-ready','1'); });
    });
  })();
</script>
</body>
</html>
