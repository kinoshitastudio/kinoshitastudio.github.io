<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,follow">
<!--
  汎用ページ用 OGP カード（1200×630）。
  体験研究カード（ogp-research-*.png）の意匠を、クエリ文字列で使い回せるようにしたもの。
  例: _ogp-page-template.html?t_kicker=道具 — TOOL&t_sub=作字 — SAKUJI&t_title=作字のための、道具。
  ケーススタディ用の別意匠は _ogp-case-template.html。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{position:relative;font-family:'Zen Kaku Gothic New',sans-serif;background:#4a4a47}
  .frame{position:absolute;inset:24px;border:1px solid rgba(168,144,96,.28)}
  .kicker{position:absolute;left:94px;top:78px;font-family:'Space Mono',monospace;font-weight:700;
    font-size:17px;letter-spacing:.30em;color:#a89060;white-space:nowrap}
  .sub{position:absolute;left:94px;top:114px;font-family:'Space Mono',monospace;
    font-size:15px;letter-spacing:.20em;color:rgba(240,239,233,.62);white-space:nowrap}
  .rule{position:absolute;left:96px;top:200px;width:68px;height:3px;background:#a89060}
  .title{position:absolute;left:94px;top:236px;right:110px;
    font-weight:700;font-size:72px;line-height:1.24;letter-spacing:.01em;color:#f0efe9}
  .sig{position:absolute;left:94px;bottom:96px;font-family:'Space Mono',monospace;font-weight:700;
    font-size:26px;letter-spacing:.14em;color:#f0efe9}
  .sig2{position:absolute;left:96px;bottom:66px;font-size:16px;letter-spacing:.04em;color:rgba(240,239,233,.58)}
  .inf{position:absolute;right:96px;bottom:62px;font-size:40px;line-height:1;color:#a89060}
</style>
</head>
<body>
  <div class="frame" id="frame"></div>
  <div class="kicker" id="kicker">道具 — TOOL</div>
  <div class="sub" id="sub">作字 — SAKUJI</div>
  <div class="rule" id="rule"></div>
  <div class="title" id="title">作字のための、道具。</div>
  <div class="sig">KINOSHITA STUDIO</div>
  <div class="sig2">木下スタジオ — 滋賀 / 木下貴博</div>
  <div class="inf" id="inf">∞</div>
<script>
  (function(){
    var q = new URLSearchParams(location.search);
    function g(k, d){ var v = q.get(k); return (v === null || v === '') ? d : v; }

    // 色（既定＝体験研究カードと同じ）
    var bg     = g('bg', '#4a4a47'),
        accent = g('accent', '#a89060'),
        fg     = g('fg', '#f0efe9');

    document.body.style.background = bg;
    var frame = document.getElementById('frame');
    frame.style.borderColor = accent;   // 枠は accent の薄がけ（opacity で落とす）
    frame.style.opacity = '.30';
    document.getElementById('kicker').style.color = accent;
    document.getElementById('rule').style.background = accent;
    document.getElementById('inf').style.color = accent;
    document.getElementById('title').style.color = fg;

    // テキスト
    function set(id, key){ var v = q.get(key); if (v !== null) document.getElementById(id).textContent = v; }
    set('kicker', 't_kicker'); set('sub', 't_sub'); set('title', 't_title');
    if (q.get('t_sub') === '') document.getElementById('sub').style.display = 'none';

    // 見出しが3行を超えたら収まるまで縮める（2行想定・最大3行）
    var el = document.getElementById('title');
    var size = parseInt(g('title_size', '72'), 10);
    el.style.fontSize = size + 'px';
    var maxH = 258; // 下の署名に被らない高さ
    while (el.scrollHeight > maxH && size > 34){ size -= 2; el.style.fontSize = size + 'px'; }

    // Webフォントが乗り切ってからスクショさせる
    (document.fonts ? document.fonts.ready : Promise.resolve()).then(function(){
      requestAnimationFrame(function(){
        document.documentElement.setAttribute('data-ready', '1');
      });
    });
  })();
</script>
</body>
</html>
