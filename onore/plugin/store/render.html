<!doctype html>
<meta charset="utf-8">
<title>Onore — store art</title>
<!-- Onore store art generator.
     The surface on the right (_metal-source.png) is a genuine render of Onore's
     own MatCap metal engine (onore/lab/onore-lab-metal2.html, UI stripped) — so,
     as with Kaibou and Siren, the cover is literally the plugin's output.
     Left of the orange seam: Onore's brand wave (assets/img/icon-onore.svg) —
     the waveform that Onore turns into a surface. Shot headless. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#0b0b0c;overflow:hidden}
  canvas{display:block}
  #metal{position:absolute;left:-9999px;top:-9999px}
</style>
<canvas id="out"></canvas>
<img id="metal" src="_metal-source.png">
<script>
'use strict'
const cv=(w,h)=>{ const c=document.createElement('canvas'); c.width=w; c.height=h; return c }
const BG='#0b0b0c', FG='#e9e9e9', HOT='#ff8a3d', DIM='#8a8a8e', DIM2='#5a5a5e'

/* Onore's brand wave — icon-onore.svg path, on the 64 grid, mapped into a box */
function wave(g, x0, y0, span, col, lw){
  const u = span/64, X = v=>x0+v*u, Y = v=>y0+v*u
  g.lineCap='round'; g.lineJoin='round'; g.strokeStyle=col; g.lineWidth=lw
  g.beginPath()
  g.moveTo(X(12),Y(40))
  g.bezierCurveTo(X(20),Y(22), X(26),Y(22), X(32),Y(32))
  g.bezierCurveTo(X(38),Y(42), X(44),Y(42), X(52),Y(26))
  g.stroke()
  return {dotX:X(24.5), dotY:Y(24.5), dotR:4.5*u}
}

function drawCover(W,H,metal){
  const out = cv(W,H), g = out.getContext('2d')
  g.fillStyle = BG; g.fillRect(0,0,W,H)

  const CX = W*0.585, CY = H*0.50          // the seam

  // ---- warm halo around where the wave becomes surface ----
  const halo = g.createRadialGradient(CX, CY, 0, CX, CY, H*0.6)
  halo.addColorStop(0,'rgba(255,138,61,.14)'); halo.addColorStop(.5,'rgba(255,138,61,.04)'); halo.addColorStop(1,'rgba(255,138,61,0)')
  g.fillStyle = halo; g.fillRect(0,0,W,H)

  // ---- the metal surface, right of the seam ----
  // the source is 1080² on #0b0b0c, so its square edges vanish into the cover.
  const sph = H*1.02
  // seam sits at the sphere's left edge: the wave (left) becomes the surface (right)
  g.drawImage(metal, CX - sph*0.13, CY - sph*0.5, sph, sph)

  // a soft dark gradient re-establishes the black at the far right & edges
  const vg = g.createRadialGradient(W*0.78, CY, H*0.34, W*0.78, CY, H*0.90)
  vg.addColorStop(0,'rgba(11,11,12,0)'); vg.addColorStop(1,'rgba(11,11,12,.50)')
  g.fillStyle = vg; g.fillRect(0,0,W,H)

  // ---- the brand wave, flowing left-to-seam into the surface ----
  const wspan = H*0.62, wx0 = W*0.30, wy0 = CY - wspan*0.5
  // faint echo waves (the oscillator continuing) behind the main one
  wave(g, wx0, wy0 - H*0.05, wspan, 'rgba(233,233,233,.10)', Math.max(2,H*0.004))
  wave(g, wx0, wy0 + H*0.05, wspan, 'rgba(233,233,233,.10)', Math.max(2,H*0.004))
  const d = wave(g, wx0, wy0, wspan, FG, Math.max(4,H*0.009))
  // the orange node on the wave
  g.beginPath(); g.fillStyle = HOT; g.arc(d.dotX, d.dotY, d.dotR, 0, 7); g.fill()

  // ---- the orange seam ----
  g.strokeStyle = HOT; g.lineWidth = Math.max(3,H*0.006); g.globalAlpha=.9
  g.beginPath(); g.moveTo(CX, H*0.10); g.lineTo(CX, H*0.90); g.stroke()
  g.globalAlpha = 1

  // ---- type, left ----
  const L = W*0.062
  g.textBaseline='alphabetic'
  g.fillStyle = DIM
  g.font = `400 ${Math.round(H*0.0205)}px 'Space Mono', ui-monospace, monospace`
  let lx=L; for(const ch of 'FIGMA PLUGIN — SHIAN 志庵'){ g.fillText(ch, lx, H*0.315); lx += g.measureText(ch).width + H*0.0048 }

  g.fillStyle = FG
  g.font = `400 ${Math.round(H*0.152)}px Anton, 'Arial Narrow', Impact, sans-serif`
  g.fillText('ONORE', L - H*0.004, H*0.465)
  const wmW = g.measureText('ONORE').width
  g.fillStyle = DIM
  g.font = `500 ${Math.round(H*0.056)}px 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', sans-serif`
  g.fillText('己', L + wmW + H*0.028, H*0.465)

  g.fillStyle = FG
  g.font = `400 ${Math.round(H*0.038)}px 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', sans-serif`
  g.fillText('波を、面に。', L, H*0.578)

  g.fillStyle = DIM2
  g.font = `400 ${Math.round(H*0.0215)}px 'Space Mono', ui-monospace, monospace`
  g.fillText('7 oscillators  ·  liquid metal  ·  all vector', L, H*0.652)

  return out
}

/* icon — the brand wave with the orange node, like Kaibou/Siren use their glyph */
function drawIcon(S){
  const out = cv(S,S), g = out.getContext('2d')
  g.fillStyle = BG; g.fillRect(0,0,S,S)
  const halo = g.createRadialGradient(S*0.38, S*0.42, 0, S*0.38, S*0.42, S*0.5)
  halo.addColorStop(0,'rgba(255,138,61,.20)'); halo.addColorStop(.6,'rgba(255,138,61,.04)'); halo.addColorStop(1,'rgba(255,138,61,0)')
  g.fillStyle = halo; g.fillRect(0,0,S,S)
  const span = S*0.92, x0 = (S-span)/2, y0 = (S-span)/2
  const d = wave(g, x0, y0, span, FG, S*0.085)
  g.beginPath(); g.fillStyle = HOT; g.arc(d.dotX, d.dotY, d.dotR, 0, 7); g.fill()
  return out
}

async function fonts(){
  const want=["400 100px Anton","400 40px 'Space Mono'","400 40px 'Zen Kaku Gothic New'","500 40px 'Zen Kaku Gothic New'"]
  try{ await Promise.all(want.map(f=>document.fonts.load(f,'ONORE 己 波'))); await document.fonts.ready }catch(e){}
}
function imgReady(img){ return img.complete && img.naturalWidth ? Promise.resolve() : new Promise(r=>{img.onload=r; img.onerror=r}) }

const q=new URLSearchParams(location.search), what=q.get('t')||'cover', S=parseInt(q.get('s')||'128',10)
async function go(){
  await fonts()
  const metal = document.getElementById('metal'); await imgReady(metal)
  const o=document.getElementById('out')
  const made = what==='icon' ? drawIcon(S) : drawCover(1920,1080,metal)
  o.width=made.width; o.height=made.height
  o.getContext('2d').drawImage(made,0,0)
  document.title='ready'
}
go()
</script>
