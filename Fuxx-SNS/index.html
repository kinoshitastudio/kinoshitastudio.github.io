<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FUXX SNS</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: -apple-system, 'Inter', 'Hiragino Sans', sans-serif; }
body { background: #0D1117; color: #E6EDF3; display: flex; flex-direction: column; overflow: hidden; }

/* ── Header ── */
.app-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; height: 52px; flex-shrink: 0;
  background: #0D1117; border-bottom: 1px solid rgba(255,255,255,.08);
}
.app-logo { font-size: 13px; font-weight: 800; letter-spacing: .12em; color: #fff; }
.app-logo span { color: #3ACFC6; }
.header-right { display: flex; gap: 8px; align-items: center; }
.btn-add {
  display: flex; align-items: center; gap: 5px;
  background: rgba(58,207,198,.12); border: 1px solid rgba(58,207,198,.35);
  color: #3ACFC6; border-radius: 6px; padding: 6px 12px;
  font-size: 11px; font-weight: 700; cursor: pointer; letter-spacing: .04em;
  transition: all .15s;
}
.btn-add:hover { background: rgba(58,207,198,.22); }

/* ── Main ── */
.app-main { display: flex; flex: 1; overflow: hidden; }

/* ── Compose Panel ── */
.compose-panel {
  width: 280px; flex-shrink: 0;
  background: #161B22; border-right: 1px solid rgba(255,255,255,.08);
  display: flex; flex-direction: column; padding: 16px;
}
.compose-label {
  font-size: 10px; font-weight: 700; letter-spacing: .1em;
  color: rgba(255,255,255,.4); text-transform: uppercase; margin-bottom: 10px;
}
.compose-textarea {
  flex: 1; width: 100%; background: #0D1117; border: 1px solid rgba(255,255,255,.1);
  border-radius: 8px; color: #E6EDF3; font-size: 13px; line-height: 1.6;
  padding: 12px; resize: none; font-family: inherit; outline: none; min-height: 120px;
  transition: border-color .15s;
}
.compose-textarea:focus { border-color: rgba(58,207,198,.5); }
.compose-textarea::placeholder { color: rgba(255,255,255,.25); }
.compose-footer { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.compose-char { font-size: 10px; color: rgba(255,255,255,.35); text-align: right; }
.btn-broadcast {
  width: 100%; padding: 9px; background: #3ACFC6; border: none;
  border-radius: 7px; color: #0D1117; font-size: 12px; font-weight: 800;
  cursor: pointer; letter-spacing: .04em; transition: all .15s;
}
.btn-broadcast:hover { background: #2fb8b0; }
.btn-broadcast:disabled { background: rgba(58,207,198,.3); color: rgba(0,0,0,.4); cursor: default; }

/* ── Columns Area ── */
.columns-area {
  flex: 1; display: flex; gap: 0; overflow-x: auto; overflow-y: hidden;
  background: #0D1117;
}
.columns-area::-webkit-scrollbar { height: 6px; }
.columns-area::-webkit-scrollbar-track { background: transparent; }
.columns-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 3px; }

/* ── Empty State ── */
.empty-state {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 12px; color: rgba(255,255,255,.25);
}
.empty-icon { font-size: 32px; opacity: .5; }
.empty-text { font-size: 13px; }
.empty-hint { font-size: 11px; color: rgba(255,255,255,.2); }

/* ── Account Column ── */
.account-col {
  width: 260px; flex-shrink: 0; display: flex; flex-direction: column;
  border-right: 1px solid rgba(255,255,255,.06);
  background: #161B22;
}
.col-header {
  display: flex; align-items: center; gap: 10px; padding: 12px 14px 10px;
  border-bottom: 1px solid rgba(255,255,255,.06); flex-shrink: 0;
}
.platform-badge {
  width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 900; color: #fff;
}
.col-info { flex: 1; min-width: 0; }
.col-handle { font-size: 12px; font-weight: 700; color: #E6EDF3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.col-platform { font-size: 10px; color: rgba(255,255,255,.4); margin-top: 1px; }
.btn-col-delete {
  background: none; border: none; color: rgba(255,255,255,.25);
  font-size: 14px; cursor: pointer; padding: 4px; border-radius: 4px;
  transition: all .12s; line-height: 1; flex-shrink: 0;
}
.btn-col-delete:hover { color: #ff6b6b; background: rgba(255,107,107,.1); }

.col-body { flex: 1; display: flex; flex-direction: column; padding: 12px; gap: 8px; overflow: hidden; }
.col-textarea {
  flex: 1; width: 100%; background: #0D1117; border: 1px solid rgba(255,255,255,.08);
  border-radius: 7px; color: #E6EDF3; font-size: 12px; line-height: 1.6;
  padding: 10px; resize: none; font-family: inherit; outline: none; min-height: 80px;
  transition: border-color .15s;
}
.col-textarea:focus { border-color: rgba(255,255,255,.2); }
.col-textarea.dirty { border-color: rgba(255,200,80,.3); }
.col-textarea::placeholder { color: rgba(255,255,255,.2); }
.col-meta { display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.col-counter { font-size: 10px; color: rgba(255,255,255,.3); }
.col-counter.over { color: #ff6b6b; }
.btn-sync {
  background: none; border: 1px solid rgba(255,255,255,.12); color: rgba(255,255,255,.4);
  border-radius: 4px; padding: 3px 8px; font-size: 10px; cursor: pointer;
  transition: all .12s;
}
.btn-sync:hover { border-color: rgba(255,255,255,.3); color: rgba(255,255,255,.7); }

.col-post-wrap { padding: 0 12px 12px; flex-shrink: 0; }
.btn-post {
  width: 100%; padding: 9px; border: none; border-radius: 7px;
  font-size: 12px; font-weight: 800; cursor: pointer; letter-spacing: .04em;
  transition: all .15s; color: #fff;
}
.btn-post:disabled { opacity: .35; cursor: default; }

.col-add-slot {
  width: 200px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  padding: 20px; border-right: 1px solid rgba(255,255,255,.04);
}
.btn-col-add {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  background: none; border: 1.5px dashed rgba(255,255,255,.12); border-radius: 12px;
  color: rgba(255,255,255,.3); padding: 20px 24px; cursor: pointer;
  transition: all .15s; width: 100%;
}
.btn-col-add:hover { border-color: rgba(58,207,198,.4); color: #3ACFC6; }
.btn-col-add-icon { font-size: 20px; }
.btn-col-add-text { font-size: 11px; }

/* ── Multi-account warning ── */
.col-warn {
  margin: 0 12px 6px; padding: 5px 8px; background: rgba(255,200,80,.08);
  border: 1px solid rgba(255,200,80,.2); border-radius: 5px;
  font-size: 10px; color: rgba(255,200,80,.7); line-height: 1.4;
}

/* ── Modal ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 9999;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .18s;
}
.modal-overlay.on { opacity: 1; pointer-events: auto; }
.modal {
  background: #161B22; border: 1px solid rgba(255,255,255,.12);
  border-radius: 14px; padding: 24px; width: 360px; max-width: 95vw;
}
.modal-title { font-size: 14px; font-weight: 700; margin-bottom: 18px; }
.modal-section { margin-bottom: 14px; }
.modal-label { font-size: 10px; font-weight: 700; letter-spacing: .08em; color: rgba(255,255,255,.4); text-transform: uppercase; margin-bottom: 6px; }
.platform-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
.platform-btn {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  background: #0D1117; border: 1.5px solid rgba(255,255,255,.08);
  border-radius: 9px; padding: 10px 6px; cursor: pointer;
  transition: all .15s; color: rgba(255,255,255,.6); font-size: 10px;
}
.platform-btn .pb-icon { font-size: 18px; font-weight: 900; }
.platform-btn:hover { border-color: rgba(255,255,255,.25); color: #fff; }
.platform-btn.selected { border-color: #3ACFC6; color: #3ACFC6; background: rgba(58,207,198,.08); }
.modal-input {
  width: 100%; background: #0D1117; border: 1px solid rgba(255,255,255,.1);
  border-radius: 7px; color: #E6EDF3; font-size: 13px; padding: 9px 12px;
  font-family: inherit; outline: none; transition: border-color .15s;
}
.modal-input:focus { border-color: rgba(58,207,198,.5); }
.modal-input::placeholder { color: rgba(255,255,255,.25); }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
.btn-cancel {
  background: none; border: 1px solid rgba(255,255,255,.12); color: rgba(255,255,255,.5);
  border-radius: 7px; padding: 8px 16px; font-size: 12px; cursor: pointer; transition: all .15s;
}
.btn-cancel:hover { border-color: rgba(255,255,255,.3); color: #fff; }
.btn-confirm {
  background: #3ACFC6; border: none; color: #0D1117; border-radius: 7px;
  padding: 8px 18px; font-size: 12px; font-weight: 800; cursor: pointer; transition: all .15s;
}
.btn-confirm:hover { background: #2fb8b0; }
.btn-confirm:disabled { background: rgba(58,207,198,.3); color: rgba(0,0,0,.4); cursor: default; }

/* Mobile */
@media (max-width: 640px) {
  .compose-panel { width: 100%; height: 200px; flex-shrink: 0; }
  .app-main { flex-direction: column; overflow-y: auto; }
  .columns-area { flex-direction: column; overflow-y: auto; overflow-x: hidden; height: auto; }
  .account-col { width: 100%; flex-shrink: 0; height: auto; }
  body { overflow: auto; }
}
</style>
</head>
<body>

<header class="app-header">
  <div class="app-logo">FUXX <span>SNS</span></div>
  <div class="header-right">
    <button class="btn-add" onclick="openModal()">+ アカウント追加</button>
  </div>
</header>

<main class="app-main">
  <aside class="compose-panel">
    <div class="compose-label">共有投稿文</div>
    <textarea class="compose-textarea" id="sharedText"
      placeholder="全アカウントへの投稿内容をここに入力..."
      oninput="onSharedInput()"></textarea>
    <div class="compose-footer">
      <div class="compose-char" id="sharedChar">0文字</div>
      <button class="btn-broadcast" id="btnBroadcast" onclick="broadcast()" disabled>
        全アカウントに反映
      </button>
    </div>
  </aside>

  <section class="columns-area" id="columnsArea">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">◎</div>
      <div class="empty-text">アカウントを追加して始めましょう</div>
      <div class="empty-hint">X / Threads / Bluesky / Mastodon に対応</div>
    </div>
  </section>
</main>

<!-- Add Account Modal -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-title">アカウントを追加</div>
    <div class="modal-section">
      <div class="modal-label">プラットフォーム</div>
      <div class="platform-grid" id="platformGrid"></div>
    </div>
    <div class="modal-section" id="handleSection">
      <div class="modal-label">ハンドル名</div>
      <input class="modal-input" id="handleInput" placeholder="@username" oninput="validateModal()">
    </div>
    <div class="modal-section" id="instanceSection" style="display:none">
      <div class="modal-label">インスタンス (例: mastodon.social)</div>
      <input class="modal-input" id="instanceInput" placeholder="mastodon.social" oninput="validateModal()">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">キャンセル</button>
      <button class="btn-confirm" id="btnConfirm" onclick="addAccount()" disabled>追加</button>
    </div>
  </div>
</div>

<script>
// ── Platform definitions ──────────────────────────────
const PLATFORMS = {
  x: {
    name: 'X', icon: '𝕏', color: '#000000', limit: 280,
    intent: t => `https://twitter.com/intent/tweet?text=${enc(t)}`
  },
  threads: {
    name: 'Threads', icon: '@', color: '#000000', limit: 500,
    intent: t => `https://www.threads.net/intent/post?text=${enc(t)}`
  },
  bluesky: {
    name: 'Bluesky', icon: '☁', color: '#0085FF', limit: 300,
    intent: t => `https://bsky.app/intent/compose?text=${enc(t)}`
  },
  mastodon: {
    name: 'Mastodon', icon: 'M', color: '#6364FF', limit: 500,
    intent: (t, inst) => `https://${inst || 'mastodon.social'}/share?text=${enc(t)}`
  },
  note: {
    name: 'note', icon: 'n', color: '#41C9B4', limit: null,
    intent: t => `https://note.com/notes/new?body=${enc(t)}`
  },
  linkedin: {
    name: 'LinkedIn', icon: 'in', color: '#0A66C2', limit: 3000,
    intent: t => `https://www.linkedin.com/feed/?shareActive=true`
  },
};

function enc(t) { return encodeURIComponent(t); }

// ── State ─────────────────────────────────────────────
let accounts = [];
let selectedPlatform = null;
let uidCtr = 0;

function loadAccounts() {
  try {
    const saved = localStorage.getItem('fuxxsns_accounts');
    if (saved) accounts = JSON.parse(saved);
    accounts.forEach(a => { if (a.uid >= uidCtr) uidCtr = a.uid + 1; });
  } catch(e) {}
}
function saveAccounts() {
  try { localStorage.setItem('fuxxsns_accounts', JSON.stringify(accounts)); } catch(e) {}
}
function loadTexts() {
  try {
    const t = localStorage.getItem('fuxxsns_shared');
    if (t) {
      document.getElementById('sharedText').value = t;
      onSharedInput();
    }
    accounts.forEach(a => {
      const saved = localStorage.getItem('fuxxsns_col_' + a.uid);
      if (saved) a._text = saved;
    });
  } catch(e) {}
}

// ── Render ────────────────────────────────────────────
function render() {
  const area = document.getElementById('columnsArea');
  const empty = document.getElementById('emptyState');
  if (accounts.length === 0) {
    empty.style.display = '';
    area.innerHTML = '';
    area.appendChild(empty);
    return;
  }
  empty.style.display = 'none';

  const sharedText = document.getElementById('sharedText').value;

  // Count accounts per platform (for multi-account warning)
  const platformCount = {};
  accounts.forEach(a => { platformCount[a.platform] = (platformCount[a.platform] || 0) + 1; });

  let html = '';
  accounts.forEach(a => {
    const p = PLATFORMS[a.platform];
    const text = a._text !== undefined ? a._text : sharedText;
    const isDirty = a._dirty;
    const limit = p.limit;
    const len = [...text].length; // Unicode-safe
    const over = limit && len > limit;
    const counterText = limit ? `${len} / ${limit}` : `${len}`;
    const multiWarn = platformCount[a.platform] > 1
      ? `<div class="col-warn">⚠ 同じプラットフォームのアカウントが複数あります。ブラウザのプロフィールを切り替えて投稿してください。</div>`
      : '';

    html += `<div class="account-col" data-uid="${a.uid}">
      <div class="col-header">
        <div class="platform-badge" style="background:${p.color}">${p.icon}</div>
        <div class="col-info">
          <div class="col-handle">${escHtml(a.handle)}</div>
          <div class="col-platform">${p.name}</div>
        </div>
        <button class="btn-col-delete" onclick="deleteAccount(${a.uid})" title="削除">✕</button>
      </div>
      ${multiWarn}
      <div class="col-body">
        <textarea class="col-textarea${isDirty ? ' dirty' : ''}" data-uid="${a.uid}"
          placeholder="${p.name}に投稿..."
          oninput="onColInput(${a.uid}, this)">${escHtml(text)}</textarea>
        <div class="col-meta">
          <span class="col-counter${over ? ' over' : ''}">${counterText}</span>
          <button class="btn-sync" onclick="syncCol(${a.uid})" title="共有投稿文と同期">↺ 同期</button>
        </div>
      </div>
      <div class="col-post-wrap">
        <button class="btn-post" style="background:${p.color}"
          onclick="postAccount(${a.uid})" ${over ? 'disabled' : ''}>
          ${p.name} に投稿
        </button>
      </div>
    </div>`;
  });

  // Add account slot at end
  html += `<div class="col-add-slot">
    <button class="btn-col-add" onclick="openModal()">
      <span class="btn-col-add-icon">+</span>
      <span class="btn-col-add-text">追加</span>
    </button>
  </div>`;

  area.innerHTML = html;
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// ── Shared compose ────────────────────────────────────
function onSharedInput() {
  const text = document.getElementById('sharedText').value;
  document.getElementById('sharedChar').textContent = `${[...text].length}文字`;
  document.getElementById('btnBroadcast').disabled = text.length === 0;

  // Auto-sync non-dirty columns
  accounts.forEach(a => {
    if (!a._dirty) a._text = undefined;
  });
  try { localStorage.setItem('fuxxsns_shared', text); } catch(e) {}
  render();
}

function broadcast() {
  const text = document.getElementById('sharedText').value;
  accounts.forEach(a => {
    a._dirty = false;
    a._text = undefined;
    try { localStorage.removeItem('fuxxsns_col_' + a.uid); } catch(e) {}
  });
  render();
}

// ── Column actions ────────────────────────────────────
function onColInput(uid, el) {
  const a = accounts.find(x => x.uid === uid);
  if (!a) return;
  a._text = el.value;
  a._dirty = true;
  try { localStorage.setItem('fuxxsns_col_' + uid, el.value); } catch(e) {}

  // Update counter + over state without full re-render
  const p = PLATFORMS[a.platform];
  const len = [...el.value].length;
  const over = p.limit && len > p.limit;
  const col = el.closest('.account-col');
  col.querySelector('.col-counter').textContent = p.limit ? `${len} / ${p.limit}` : `${len}`;
  col.querySelector('.col-counter').classList.toggle('over', !!over);
  col.querySelector('.btn-post').disabled = !!over;
  el.classList.add('dirty');
}

function syncCol(uid) {
  const a = accounts.find(x => x.uid === uid);
  if (!a) return;
  a._dirty = false;
  a._text = undefined;
  try { localStorage.removeItem('fuxxsns_col_' + uid); } catch(e) {}
  render();
}

function postAccount(uid) {
  const a = accounts.find(x => x.uid === uid);
  if (!a) return;
  const p = PLATFORMS[a.platform];
  const text = a._text !== undefined ? a._text : document.getElementById('sharedText').value;
  const url = a.platform === 'mastodon'
    ? p.intent(text, a.instance)
    : p.intent(text);
  window.open(url, '_blank', 'noopener');
}

function deleteAccount(uid) {
  accounts = accounts.filter(a => a.uid !== uid);
  try { localStorage.removeItem('fuxxsns_col_' + uid); } catch(e) {}
  saveAccounts();
  render();
}

// ── Modal ─────────────────────────────────────────────
function buildPlatformGrid() {
  const grid = document.getElementById('platformGrid');
  grid.innerHTML = Object.entries(PLATFORMS).map(([key, p]) =>
    `<button class="platform-btn" data-key="${key}" onclick="selectPlatform('${key}')">
      <span class="pb-icon">${p.icon}</span>
      <span>${p.name}</span>
    </button>`
  ).join('');
}

function openModal() {
  selectedPlatform = null;
  document.getElementById('handleInput').value = '';
  document.getElementById('instanceInput').value = 'mastodon.social';
  document.getElementById('instanceSection').style.display = 'none';
  document.getElementById('btnConfirm').disabled = true;
  document.querySelectorAll('.platform-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById('addModal').classList.add('on');
  document.getElementById('handleInput').focus();
}

function closeModal() {
  document.getElementById('addModal').classList.remove('on');
}

function selectPlatform(key) {
  selectedPlatform = key;
  document.querySelectorAll('.platform-btn').forEach(b =>
    b.classList.toggle('selected', b.dataset.key === key)
  );
  document.getElementById('instanceSection').style.display = key === 'mastodon' ? '' : 'none';
  validateModal();
}

function validateModal() {
  const handle = document.getElementById('handleInput').value.trim();
  document.getElementById('btnConfirm').disabled = !selectedPlatform || !handle;
}

function addAccount() {
  const handle = document.getElementById('handleInput').value.trim();
  if (!selectedPlatform || !handle) return;
  const instance = document.getElementById('instanceInput').value.trim() || 'mastodon.social';
  accounts.push({
    uid: uidCtr++,
    platform: selectedPlatform,
    handle: handle.startsWith('@') ? handle : '@' + handle,
    instance,
    _dirty: false,
    _text: undefined,
  });
  saveAccounts();
  closeModal();
  render();
}

// ── Keyboard shortcuts ────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') broadcast();
});
document.getElementById('addModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

// ── Init ─────────────────────────────────────────────
buildPlatformGrid();
loadAccounts();
loadTexts();
render();
</script>
</body>
</html>
