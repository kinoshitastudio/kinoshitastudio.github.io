<!-- 2026-11-03 木下「（南國再見、南國 のポスターの題字）このタイポグラフィを作りたい。道具はあるか？ないのであれば作ろう」
     既存で近いのは 署SHO（平芯＝太さは芯の向き）と 奔HON（欧文を骨から）。丸い筆で【線の途中で太さが変わる】漢字を手で書く道具は無かった。
     ⭐ 字の形は木下の手が作る（崩しの道具では題字は出ない＝feedback_dont_rebuild_what_is_finished）。道具が持つのは【筆】だけ。

<style>

</style></head><body>
<div id="panel">
  <div style="font-size:11px;margin-bottom:10px"><a href="/interaction-design.html" style="color:inherit;opacity:.6;text-decoration:none">← 木下スタジオ</a></div>
  <h1><b>揮</b> KI</h1>
  <p class="lead">丸い筆で、手で字を書く。太さは<b>筆圧</b>（ペン）か<b>速さ</b>（マウス・指）で決まる。入りは鋭く、速く抜けば<b>払い</b>が伸び、ゆっくり止めれば<b>溜まる</b>。</p>
  <div class="grp"><div class="t">お手本（読むと、いま書いている字と入れ替わる）</div>
    <div class="row" style="margin-top:0"><button id="ex3">南國再見、南國</button><button id="ex2">同じ字・前の書き</button></div>
  </div>
  <div class="grp"><div class="t">筆の型（書いた線はそのまま、筆だけ替わる）</div><div class="presets" id="presets"></div></div>
  <div class="grp"><div class="t">書く</div>
    <div class="row" style="margin-top:0"><button id="mWrite" class="on">書く <kbd>B</kbd></button><button id="mMove">字を動かす <kbd>V</kbd></button></div>
    <div class="row"><button id="next">次の字へ <kbd>space</kbd></button><button id="undo">1画もどす <kbd>⌘Z</kbd></button></div>
    <div class="row"><button id="delChar">この字を消す</button><button id="clear">ぜんぶ消す</button></div>
    <label>なめらか<input type="range" id="smooth" min="0" max="12" value="4"><span class="v"></span></label>
  </div>

    <label>筆の重さ<input type="range" id="omo" min="0" max="100" value="40"><span class="v"></span></label>

    <label>横の位置<input type="range" id="gX" min="0" max="100" value="50"><span class="v"></span></label>

  </div>

    <label>長辺<select id="outL"><option value="2400">2400px</option><option value="3600" selected>3600px</option><option value="6000">6000px</option></select></label>
    <div class="row"><button class="p" id="png">PNG</button><button id="svg">SVG（字ごと）</button></div>
    <div class="row"><button id="jsave">控えを保存</button><button id="jload">控えを読む</button></div>

  </div>
  <p class="lead" style="margin-top:12px">筆は丸い。1画は、太さの変わる円を線に沿って滑らせた跡。<b>字を動かす</b>では、字をつかんで引くと動き、ホイールで大きさ、shift＋ホイールで傾き。字を重ねて組むための機能。SVG は見えている墨の縁をなぞって字ごとの &lt;g&gt; に入れる（かすれも入る）。</p>
</div>
<div id="stage"><canvas id="cv"></canvas><div id="hint">ここに書く（ペン・指・マウス）</div><div id="stat"></div></div>
<script>
const $=id=>document.getElementById(id), v=id=>+$(id).value;
const KN=['smooth','size','haya','omo','iri','uchi','harai','tome','kasu','bure','seed','gSize','gY','gX','gOp','gImgOp'];
const SET=[...KN,'ink','ratio','paper','gTxt','gFont','outL'];
const RAT={tate:[1000,1400],sq:[1000,1000],yoko:[1400,1000]};
let BW=1000,BH=1400;
// ── 字＝画の束。画は点 [x,y,時刻ms,筆圧(ペン以外は-1)] の列。t＝字ごとの動かし（px,py＝回す中心）
let chars=[{s:[],t:{x:0,y:0,k:1,r:0}}], curC=0, cur=null, mode='write', sel=-1, hist=[];
let gImg=null;
const cv=$('cv'), ctx=cv.getContext('2d');
const stat=t=>{$('stat').textContent=t};

// ── 乱れ：種で決まる 1次元の値ノイズ（同じ種なら同じかすれ）
const hash=(a,b)=>{let h=(a*374761393+b*668265263+v('seed')*2246822519)|0;h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)/4294967296};
function vnoise(i,x){const x0=Math.floor(x),f=x-x0,u=f*f*(3-2*f);return hash(i,x0)*(1-u)+hash(i,x0+1)*u}
const ss=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};

// ── 1画の形：点の列 → 中心線と太さ（盤の単位）
function geom(st){
  const P=st.p, n0=P.length, size=v('size');
  if(n0<2)return{pts:[[P[0][0],P[0][1]]],w:[size*0.9],dot:1};
  // 速さ（盤の単位/ms）
  const sp=P.map((q,i)=>{const a=P[Math.max(0,i-2)],b=P[Math.min(n0-1,i+2)];const dt=Math.max(4,b[2]-a[2]);return Math.hypot(b[0]-a[0],b[1]-a[1])/dt});
  const k=v('haya')/100, pen=P[0][3]>=0;
  const f=P.map((q,i)=>{let s=0,c=0;for(let j=-3;j<=3;j++){s+=sp[Math.min(n0-1,Math.max(0,i+j))];c++}const vv=ss(0.04,1.6,s/c);
    const g=pen?(0.06+1.7*Math.pow(Math.max(0,q[3]),1.8))*(1-0.4*k*vv):1.28-1.08*k*vv;return Math.max(0.16,g)}); // ⭐ 太細の比は参考の題字で実測 p90/p10＝5.3（11-03・前は 2.6 で筆ペンに見えた）
  // 位置をならす
  const n=v('smooth'), sm=P.map((_,i)=>{let x=0,y=0,c=0;for(let j=-n;j<=n;j++){const q=P[Math.min(n0-1,Math.max(0,i+j))];x+=q[0];y+=q[1];c++}return[x/c,y/c]});
  sm[0]=[P[0][0],P[0][1]];
  // 等間隔に刻み直す
  const step=Math.max(0.6,size/6), pts=[], ff=[]; let acc=0;
  pts.push(sm[0]);ff.push(f[0]);
  for(let i=1;i<n0;i++){const a=sm[i-1],b=sm[i],L=Math.hypot(b[0]-a[0],b[1]-a[1]);if(L<1e-6)continue;let d=step-acc;
    while(d<=L){const t=d/L;pts.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]);ff.push(f[i-1]+(f[i]-f[i-1])*t);d+=step}acc=L-(d-step)}
  if(pts.length<2){pts.push(sm[n0-1]);ff.push(f[n0-1])}
  // 筆の重さ＝太さは急に変わらない
  const al=1/(1+v('omo')*0.12);for(let i=1;i<ff.length;i++)ff[i]=ff[i-1]+(ff[i]-ff[i-1])*al;
  const N=pts.length, L=[0];for(let i=1;i<N;i++)L.push(L[i-1]+step);const Lt=L[N-1];
  // 入り：細い穂先から太くなる／打ち込み：入ってすぐの溜まり
  // 🔴 入りを長く細く引くと、穂先が旗のように波打った（11-03 試し書き）＝入りは短く、太りきる手前で少しだけ溜める
  const Lin=size*(0.25+1.4*v('iri')/100), uchi=v('uchi')/100, bure=v('bure')/100, sid=st.id||0;
  const w=ff.map((x,i)=>{const l=L[i];let m=0.55+0.45*ss(0,Lin,l);m*=1+uchi*0.3*Math.exp(-Math.pow((l-Lin)/(Lin*0.6+1),2));
    m*=1+bure*0.28*(vnoise(sid*7+1,l/(size*1.3))-0.5)*ss(0,Lin*1.5,l)*ss(0,size*2,Lt-l);return size*x*m});
  // 終わり：速く抜けたら払い（向きと曲がりを延ばして細る）、遅ければ止め（溜まる）
  if(st.done&&N>3){let ve=0,c=0;for(let i=Math.max(1,n0-7);i<n0-1;i++){ve+=sp[i];c++}ve/=Math.max(1,c);
    const vn=ss(0.35,1.7,ve);
    if(vn>0.05&&v('harai')>0){const Lh=v('harai')/100*size*4.5*vn*(0.6+0.4*Math.min(1,Lt/(size*8))); // 🔴 9倍では針が刺さったように長かった
      const kb=Math.max(1,Math.round(size*1.2/step)), a=pts[Math.max(0,N-1-kb)], b=pts[N-1], a2=pts[Math.max(0,N-1-2*kb)];
      let ang=Math.atan2(b[1]-a[1],b[0]-a[0]); let cv0=ang-Math.atan2(a[1]-a2[1],a[0]-a2[0]); if(cv0>Math.PI)cv0-=2*Math.PI; if(cv0<-Math.PI)cv0+=2*Math.PI;
      const turn=cv0/(kb*step), we=w[N-1], m=Math.max(2,Math.round(Lh/step)); let x=b[0],y=b[1];
      for(let j=1;j<=m;j++){const t=j/m;ang+=turn*step*0.6*(1-t);x+=Math.cos(ang)*step;y+=Math.sin(ang)*step;pts.push([x,y]);w.push(we*Math.pow(1-t,0.85)*(1+0.15*(1-t)));}
    } else { const tm=v('tome')/100, Lt2=size*1.8; for(let i=0;i<N;i++){const r=Lt-L[i];if(r<Lt2)w[i]*=1+tm*0.75*Math.sin(Math.PI*0.5*(1-r/Lt2))} }
  }
  // ⭐ 打ち込み＝穂先が左上から斜め45°に降りてから進む（角のある頭）。🔴 丸い点から細い首で太るとマッチ棒に見えた（11-03）
  if(uchi>0&&N>3){const hx=Math.SQRT1_2,hy=Math.SQRT1_2,kk=Math.min(w.length-1,Math.max(1,Math.round(Lin*1.4/step)));let w0=0;for(let i=0;i<=kk;i++)w0=Math.max(w0,w[i]);w0*=1+uchi*0.35;for(let i=0;i<=kk;i++)w[i]=Math.max(w[i],w0*(1-0.25*i/kk)); // 頭は太いまま（細い首を作らない）
    const hl=size*(0.3+0.9*uchi)*Math.max(0.6,ff[0]),m=Math.max(2,Math.round(hl/step)),p0=pts[0];
    for(let j=1;j<=m;j++){const t=j/m;pts.unshift([p0[0]-hx*hl*t,p0[1]-hy*hl*t]);w.unshift(w0*(1-0.75*t))}}
  return{pts,w,step};
}

// ── 字の動かし：盤の点 ↔ 字の元の点
function pivot(c){const t=c.t;if(t.px==null){const b=rawBox(c);t.px=b?(b[0]+b[2])/2:BW/2;t.py=b?(b[1]+b[3])/2:BH/2}return[t.px,t.py]}
function rawBox(c){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9,ok=0;c.s.forEach(s=>s.p.forEach(q=>{ok=1;x0=Math.min(x0,q[0]);y0=Math.min(y0,q[1]);x1=Math.max(x1,q[0]);y1=Math.max(y1,q[1])}));return ok?[x0,y0,x1,y1]:null}
function moved(c){const t=c.t;return t.x||t.y||t.k!==1||t.r}
function fwd(c,x,y){if(!moved(c))return[x,y];const[px,py]=pivot(c),t=c.t,co=Math.cos(t.r),si=Math.sin(t.r),dx=(x-px)*t.k,dy=(y-py)*t.k;return[px+t.x+dx*co-dy*si,py+t.y+dx*si+dy*co]}
function inv(c,x,y){if(!moved(c))return[x,y];const[px,py]=pivot(c),t=c.t,co=Math.cos(-t.r),si=Math.sin(-t.r),dx=x-px-t.x,dy=y-py-t.y;return[px+(dx*co-dy*si)/t.k,py+(dx*si+dy*co)/t.k]}
function setCharXf(g,c,s){g.setTransform(s,0,0,s,0,0);if(!moved(c))return;const[px,py]=pivot(c),t=c.t;g.translate(px+t.x,py+t.y);g.rotate(t.r);g.scale(t.k,t.k);g.translate(-px,-py)}

// ── 墨を置く：太さの変わる円を滑らせる（線分ごとに丸い端で引く＝つながりに隙間が出ない）
function inkStroke(g,G,sid){
  const {pts,w}=G; g.strokeStyle='#000';g.fillStyle='#000';g.lineCap='round';g.lineJoin='round';
  if(G.dot){g.beginPath();g.arc(pts[0][0],pts[0][1],w[0]/2,0,Math.PI*2);g.fill();return}
  const kas=v('kasu')/100, size=v('size'), step=G.step; let l=0;
  for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],ww=(w[i]+w[i+1])/2;l+=step;
    const segL=Math.hypot(b[0]-a[0],b[1]-a[1])||1, nx=-(b[1]-a[1])/segL, ny=(b[0]-a[0])/segL;
    const D=kas*(0.25+0.75*ss(0,size*90,l))*(0.55+0.9*Math.max(0,1-ww/(size*1.1)));
    if(D<0.06){g.lineWidth=ww;g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();continue}
    // かすれ：穂を細い毛に分け、毛ごとに筆の進む向きへ長い筋で途切れさせる
    const B=Math.max(5,Math.min(16,Math.round(ww/(size*0.1)))), lw=ww/B*1.9;g.lineWidth=lw;g.beginPath();
    for(let j=0;j<B;j++){const u=-1+2*(j+0.5)/B;if(vnoise(sid*31+j,l/(size*2.2))<D*(0.5+0.7*Math.abs(u)))continue;
      const o=u*ww/2*0.9;g.moveTo(a[0]+nx*o,a[1]+ny*o);g.lineTo(b[0]+nx*o,b[1]+ny*o)}
    g.stroke()}
}

// 墨の層を作る：s＝盤1単位あたりの画素
const POOL={};function layer(name,W,H){let c=POOL[name];if(!c)c=POOL[name]=document.createElement('canvas');if(c.width!==W||c.height!==H){c.width=W;c.height=H}const g=c.getContext('2d');g.setTransform(1,0,0,1,0,0);g.globalCompositeOperation='source-over';g.globalAlpha=1;g.clearRect(0,0,W,H);return c}
function inkLayer(W,H,s,only){
  const L=layer('ink'+(only!=null?'1':''),W,H),g=L.getContext('2d');
  chars.forEach((c,ci)=>{if(only!=null&&ci!==only)return;setCharXf(g,c,s);c.s.forEach((st,si)=>inkStroke(g,geom(st),st.id||si+ci*97))});
  if(only==null&&cur){const c=chars[curC];setCharXf(g,c,s);inkStroke(g,geom(cur),cur.id)}
  g.setTransform(1,0,0,1,0,0);g.globalCompositeOperation='source-in';g.fillStyle=$('ink').value;g.fillRect(0,0,W,H);g.globalCompositeOperation='source-over';
  return L}
function paper(g,W,H){const p=$('paper').value;
  if(p==='none')return;
  if(p==='yoru'){const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#3b1611');gr.addColorStop(.5,'#1d1d14');gr.addColorStop(1,'#0d1711');g.fillStyle=gr}else g.fillStyle=p;
  g.fillRect(0,0,W,H)}

// ── 盤に描く
let VW=0,VH=0,VS=1;
function fit(){const st=$('stage'),r=st.getBoundingClientRect(),pad=window.innerWidth<760?20:48,dpr=Math.min(2,window.devicePixelRatio||1);
  const sc=Math.min((r.width-pad)/BW,(r.height-pad)/BH);const cw=Math.max(50,Math.floor(BW*sc)),ch=Math.max(50,Math.floor(BH*sc));
  cv.style.width=cw+'px';cv.style.height=ch+'px';VW=Math.round(cw*dpr);VH=Math.round(ch*dpr);if(cv.width!==VW||cv.height!==VH){cv.width=VW;cv.height=VH}VS=VW/BW}
function render(){
  KN.forEach(k=>{const s=$(k).parentNode.querySelector('.v');if(s)s.textContent=$(k).value});
  const g=ctx;g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,VW,VH);
  if($('paper').value==='none'){const q=12*VS;for(let y=0;y<VH;y+=q)for(let x=0;x<VW;x+=q){g.fillStyle=((x/q+y/q)|0)%2?'#cfcac2':'#e2ddd5';g.fillRect(x,y,q,q)}}
  paper(g,VW,VH);
  // 下敷き
  if(gImg&&v('gImgOp')>0){g.globalAlpha=v('gImgOp')/100;const s=Math.max(VW/gImg.width,VH/gImg.height);g.drawImage(gImg,(VW-gImg.width*s)/2,(VH-gImg.height*s)/2,gImg.width*s,gImg.height*s);g.globalAlpha=1}
  const tx=$('gTxt').value;if(tx&&v('gOp')>0){const fs=v('gSize')*VS;g.globalAlpha=v('gOp')/100;g.fillStyle=$('paper').value==='yoru'||$('paper').value==='#141312'?'#f1e9dc':'#3a2f2a';
    g.font=`${fs}px "${$('gFont').value}", serif`;g.textAlign='center';g.textBaseline='middle';const x=v('gX')/100*VW;let y=v('gY')/100*VH+fs/2;
    [...tx].forEach(ch=>{if('、。，,'.includes(ch)){g.fillText(ch,x+fs*0.32,y-fs*0.35);y+=fs*0.35}else{g.fillText(ch,x,y);y+=fs}});g.globalAlpha=1}
  g.drawImage(inkLayer(VW,VH,VS),0,0);
  // 選んだ字の枠（出す絵には入らない）
  if(mode==='move'&&sel>=0&&chars[sel]){const b=charBox(sel);if(b){g.setTransform(1,0,0,1,0,0);g.strokeStyle='#5fb0ff';g.lineWidth=1.5;g.setLineDash([6,5]);g.strokeRect(b[0]*VS-6,b[1]*VS-6,(b[2]-b[0])*VS+12,(b[3]-b[1])*VS+12);g.setLineDash([])}}
  const nS=chars.reduce((a,c)=>a+c.s.length,0);$('hint').hidden=nS>0||!!cur;
  stat(mode==='write'?`書く：${curC+1}字目（${chars[curC].s.length}画）・ぜんぶで ${chars.filter(c=>c.s.length).length}字 ${nS}画`:(sel>=0?`字を動かす：${sel+1}字目をつかんでいる（ドラッグ＝動かす／ホイール＝大きさ ${Math.round(chars[sel].t.k*100)}%／shift＋ホイール＝傾き ${Math.round(chars[sel].t.r*180/Math.PI)}°）`:'字を動かす：動かしたい字の線をつかむ'));
}
function charBox(ci){const c=chars[ci];let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9,ok=0;const pad=v('size');c.s.forEach(s=>s.p.forEach(q=>{const[x,y]=fwd(c,q[0],q[1]);ok=1;x0=Math.min(x0,x-pad);y0=Math.min(y0,y-pad);x1=Math.max(x1,x+pad);y1=Math.max(y1,y+pad)}));return ok?[x0,y0,x1,y1]:null}
let raf=0;const later=()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;render()})};

// ── 控え（ブラウザの中に自動で）
let saveT=0;const autosave=()=>{clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem('ki-v1',JSON.stringify(snapshot()))}catch(e){}},400)};
function snapshot(){const o={tool:'ki',v:1};SET.forEach(k=>o[k]=$(k).value);o.chars=chars.map(c=>({t:{x:+c.t.x.toFixed(2),y:+c.t.y.toFixed(2),k:+c.t.k.toFixed(4),r:+c.t.r.toFixed(4),px:c.t.px,py:c.t.py},s:c.s.map(s=>({id:s.id,p:s.p.map(q=>[+q[0].toFixed(2),+q[1].toFixed(2),Math.round(q[2]),q[3]<0?-1:+q[3].toFixed(3)])}))}));o.curC=curC;return o}
function load(o){SET.forEach(k=>{if(k in o)$(k).value=o[k]});const r=RAT[$('ratio').value];BW=r[0];BH=r[1];
  if(Array.isArray(o.chars)&&o.chars.length){chars=o.chars.map(c=>({t:Object.assign({x:0,y:0,k:1,r:0},c.t),s:(c.s||[]).map(s=>({id:s.id||Math.floor(Math.random()*1e6),done:1,p:s.p}))}))}
  curC=Math.min(chars.length-1,o.curC||chars.length-1);hist=[];fit();render()}

// ── 書く／動かす
const at=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*BW,(e.clientY-r.top)/r.height*BH]};
let drag=null;
cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);const[x,y]=at(e);
  if(mode==='write'){const c=chars[curC],[ix,iy]=inv(c,x,y);cur={id:Math.floor(Math.random()*1e6),p:[[ix,iy,e.timeStamp,e.pointerType==='pen'?e.pressure:-1]]};later();return}
  // 動かす：いちばん近い線の字をつかむ
  let best=-1,bd=40/VS*2;chars.forEach((c,ci)=>c.s.forEach(s=>s.p.forEach(q=>{const[fx,fy]=fwd(c,q[0],q[1]);const d=Math.hypot(fx-x,fy-y);if(d<bd){bd=d;best=ci}})));
  sel=best;if(sel>=0){pivot(chars[sel]);drag={x,y,ox:chars[sel].t.x,oy:chars[sel].t.y}}later()});
cv.addEventListener('pointermove',e=>{
  if(cur){const c=chars[curC];(e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const[x,y]=at(ev),[ix,iy]=inv(c,x,y);cur.p.push([ix,iy,ev.timeStamp,ev.pointerType==='pen'?ev.pressure:-1])});later();return}
  if(drag&&sel>=0){const[x,y]=at(e);chars[sel].t.x=drag.ox+x-drag.x;chars[sel].t.y=drag.oy+y-drag.y;later()}});
const up=()=>{if(cur){cur.done=1;if(cur.p.length>=1){chars[curC].s.push(cur);hist.push(curC)}cur=null;autosave();later()}if(drag){drag=null;autosave()}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{if(mode!=='move'||sel<0)return;e.preventDefault();const t=chars[sel].t;
  if(e.shiftKey)t.r+=(e.deltaY+e.deltaX)*0.0025;else t.k=Math.min(6,Math.max(0.15,t.k*Math.exp(-e.deltaY*0.0015)));later();autosave()},{passive:false});
function setMode(m){mode=m;document.body.classList.toggle('move',m==='move');$('mWrite').classList.toggle('on',m==='write');$('mMove').classList.toggle('on',m==='move');if(m==='write')sel=-1;else sel=chars[curC].s.length?curC:-1;later()}
$('mWrite').onclick=()=>setMode('write');$('mMove').onclick=()=>setMode('move');
function nextChar(){if(chars[curC].s.length===0){stat('この字はまだ白紙（書いてから次へ）');return}chars.push({s:[],t:{x:0,y:0,k:1,r:0}});curC=chars.length-1;setMode('write');autosave()}
$('next').onclick=nextChar;
function undo(){const ci=hist.length?hist.pop():(()=>{for(let i=chars.length-1;i>=0;i--)if(chars[i].s.length)return i;return -1})();if(ci<0)return;chars[ci].s.pop();
  if(!chars[ci].s.length&&chars.length>1&&ci===chars.length-1&&curC===ci){/* 空の字は残す（次に書く場所） */}stat('1画もどした');autosave();later()}
$('undo').onclick=undo;
$('delChar').onclick=()=>{const ci=mode==='move'&&sel>=0?sel:curC;if(chars.length>1){chars.splice(ci,1);curC=chars.length-1}else chars=[{s:[],t:{x:0,y:0,k:1,r:0}}];sel=-1;hist=[];stat(`${ci+1}字目を消した`);autosave();later()};
$('clear').onclick=()=>{if(!confirm('書いた字をぜんぶ消しますか？（控えを保存していなければ戻せません）'))return;chars=[{s:[],t:{x:0,y:0,k:1,r:0}}];curC=0;sel=-1;hist=[];autosave();later()};
addEventListener('keydown',e=>{const tg=e.target.tagName;if(tg==='INPUT'&&e.target.type==='text'||tg==='SELECT')return;
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();return}
  if(e.key===' '){e.preventDefault();nextChar();return}
  if(e.key==='b'||e.key==='B')setMode('write');if(e.key==='v'||e.key==='V')setMode('move');
  if(mode==='move'&&sel>=0){const t=chars[sel].t,d=e.shiftKey?10:2;let hit=1;
    if(e.key==='ArrowLeft')t.x-=d;else if(e.key==='ArrowRight')t.x+=d;else if(e.key==='ArrowUp')t.y-=d;else if(e.key==='ArrowDown')t.y+=d;else if(e.key===']')t.k*=1.03;else if(e.key==='[')t.k/=1.03;else if(e.key==='.')t.r+=0.02;else if(e.key===',')t.r-=0.02;else hit=0;
    if(hit){e.preventDefault();later();autosave()}}});

// ── 筆の型
const PRESETS=[
  ['細筆（題字）',{size:10,haya:70,omo:40,iri:65,uchi:15,harai:65,tome:35,kasu:12,bure:20,smooth:4}],
  ['太筆',{size:24,haya:55,omo:55,iri:45,uchi:55,harai:50,tome:55,kasu:28,bure:25,smooth:5}],
  ['乾いた筆',{size:14,haya:65,omo:45,iri:60,uchi:30,harai:70,tome:25,kasu:70,bure:35,smooth:4}],
  ['筆ペン',{size:7,haya:45,omo:25,iri:75,uchi:15,harai:55,tome:30,kasu:0,bure:8,smooth:3}],
  ['極太（看板）',{size:34,haya:35,omo:70,iri:70,uchi:65,harai:60,tome:60,kasu:6,bure:12,smooth:6}], // 2026-11-05 まほろば商店街の題字（太い丸筆・鋭い入り・白抜き）から
];
PRESETS.forEach(([n,o],i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{Object.entries(o).forEach(([k,x])=>$(k).value=x);document.querySelectorAll('#presets button').forEach((bb,j)=>bb.classList.toggle('on',j===i));stat(`筆を「${n}」にした（書いた線はそのまま）`);render();autosave()};$('presets').appendChild(b)});
document.querySelector('#presets button').classList.add('on');

// ── つまみ
document.querySelectorAll('#panel input,#panel select').forEach(e=>{if(e.type==='file')return;e.addEventListener('input',()=>{if(e.id==='ratio'){const r=RAT[e.value];BW=r[0];BH=r[1];fit()}later();autosave()})});
$('gImgBtn').onclick=()=>$('gImg').click();$('gImgOff').onclick=()=>{gImg=null;later()};
$('gImg').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{gImg=im;stat('画像を敷いた（書き出しには入らない）');later()};im.src=URL.createObjectURL(f);e.target.value=''};

// ── 出す
function dl(blob,name){const a=document.createElement('a');a.download=name;a.href=URL.createObjectURL(blob);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
function outSize(){const L=v('outL'),s=L/Math.max(BW,BH);return[Math.round(BW*s),Math.round(BH*s),s]}
$('png').onclick=()=>{const[W,H,s]=outSize(),c=layer('out',W,H),g=c.getContext('2d');paper(g,W,H);g.drawImage(inkLayer(W,H,s),0,0);
  c.toBlob(b=>{dl(b,'ki_'+Date.now()+'.png');stat(`PNG を出した（${W}×${H}・${$('paper').value==='none'?'地なし':'地あり'}・下敷きは入らない）`)},'image/png')};
// SVG：見えている墨の縁をなぞる（かすれも形のまま入る）。字ごとに <g>
function trace(A,W,H,ox,oy){const VWp=W+1,o1=new Int32Array(VWp*(H+1)).fill(-1),o2=new Int32Array(VWp*(H+1)).fill(-1);
  const ink=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&A[(y*W+x)*4+3]>127;const add=(x0,y0,x1,y1)=>{const k=y0*VWp+x0,t=y1*VWp+x1;if(o1[k]<0)o1[k]=t;else o2[k]=t};
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(!ink(x,y))continue;if(!ink(x,y-1))add(x,y,x+1,y);if(!ink(x+1,y))add(x+1,y,x+1,y+1);if(!ink(x,y+1))add(x+1,y+1,x,y+1);if(!ink(x-1,y))add(x,y+1,x,y)}
  const loops=[];for(let k0=0;k0<o1.length;k0++){while(o1[k0]>=0||o2[k0]>=0){const pts=[];let k=k0;
    do{let t=o1[k];if(t>=0)o1[k]=-1;else{t=o2[k];o2[k]=-1}if(t<0)break;pts.push([k%VWp+ox,((k/VWp)|0)+oy]);k=t}while(k!==k0);if(pts.length>=4)loops.push(rdp(pts,0.75))}}
  return loops}
function rdp(P,eps){const keep=new Uint8Array(P.length);keep[0]=1;const far=P.reduce((b,p,i)=>{const d=(p[0]-P[0][0])**2+(p[1]-P[0][1])**2;return d>b[0]?[d,i]:b},[0,0])[1];keep[far]=1;const st=[[0,far],[far,P.length]];
  while(st.length){const[a,b]=st.pop();const A=P[a],B=P[b%P.length];let md=0,mi=-1;const dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy)||1;for(let i=a+1;i<b;i++){const d=Math.abs((P[i][0]-A[0])*dy-(P[i][1]-A[1])*dx)/L;if(d>md){md=d;mi=i}}if(md>eps){keep[mi]=1;st.push([a,mi],[mi,b])}}
  return P.filter((_,i)=>keep[i])}
function makeSVG(){const L=Math.min(3600,v('outL')),s=L/Math.max(BW,BH),W=Math.round(BW*s),H=Math.round(BH*s);let body='',n=0;
  chars.forEach((c,ci)=>{if(!c.s.length)return;const b=charBox(ci);const x0=Math.max(0,Math.floor((b[0]-v('size')*10)*s)),y0=Math.max(0,Math.floor((b[1]-v('size')*10)*s)),x1=Math.min(W,Math.ceil((b[2]+v('size')*10)*s)),y1=Math.min(H,Math.ceil((b[3]+v('size')*10)*s));
    const Lr=inkLayer(W,H,s,ci),d=Lr.getContext('2d').getImageData(x0,y0,x1-x0,y1-y0).data,loops=trace(d,x1-x0,y1-y0,x0,y0);
    body+=`<g class="ch" id="ch${++n}" style="--i:${n-1}"><path d="${loops.map(l=>'M'+l.map(p=>p[0]+' '+p[1]).join('L')+'Z').join('')}"/></g>\n`});
  const p=$('paper').value,bg=p==='none'?'':p==='yoru'?`<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b1611"/><stop offset=".5" stop-color="#1d1d14"/><stop offset="1" stop-color="#0d1711"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#bg)"/>`:`<rect width="${W}" height="${H}" fill="${p}"/>`;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${bg}<g fill="${$('ink').value}" fill-rule="evenodd">\n${body}</g></svg>`;
  return{svg,n}}
$('svg').onclick=()=>{stat('SVG を作っている…');setTimeout(()=>{const{svg,n}=makeSVG();dl(new Blob([svg],{type:'image/svg+xml'}),'ki_'+Date.now()+'.svg');stat(`SVG を出した（${n}字・字ごとの <g class="ch">・${Math.round(svg.length/1024)}KB）`)},30)};
$('jsave').onclick=()=>{dl(new Blob([JSON.stringify(snapshot())],{type:'application/json'}),'ki_'+Date.now()+'.json');stat('控えを保存した（筆のつまみと書いた線ぜんぶ）')};
$('jload').onclick=()=>$('jfile').click();
// お手本＝控えの JSON と同じ形。読むと筆のつまみ・紙・字の置き方まで、その時のままに戻る
function example(name,label){if(chars.some(c=>c.s.length)&&!confirm('いま書いている字を、お手本と入れ替えますか？（控えを保存していなければ戻せません）'))return;
  stat('お手本を読んでいる…');fetch('samples/'+name+'.json').then(r=>{if(!r.ok)throw 0;return r.json()}).then(o=>{load(o);document.querySelectorAll('#presets button').forEach(b=>b.classList.remove('on'));stat(`お手本「${label}」を読んだ（${o.chars.length}字・${o.chars.reduce((a,c)=>a+c.s.length,0)}画）。筆のつまみを動かすと、同じ線のまま筆だけ替わる`)})
  .catch(()=>stat('お手本を読めなかった（ファイルを直接開いているときは読めない。サイトの上で開く）'))}
$('ex3').onclick=()=>example('nangoku_v3','南國再見、南國');$('ex2').onclick=()=>example('nangoku_v2','同じ字・前の書き');
$('jfile').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(o.tool!=='ki')throw 0;load(o);stat('控えを読んだ')}catch(_){alert('揮 KI の控えではありません')}});e.target.value=''};

addEventListener('resize',()=>{fit();render()});
window.__ki={load,snapshot,render,makeSVG};
try{const o=JSON.parse(localStorage.getItem('ki-v1')||'null');if(o&&o.tool==='ki')load(o);else{fit();render()}}catch(e){fit();render()}
</script></body></html>
