<!-- 2026-10-23 木下「右下のフォントを作る道具を作るのはどうか？」→「作ってくれ」
     斬 ZAN＝明朝を土台に、刃で【斬る】・墨を【飛ばす】・1色で【刷る】。書体は替えず、壊すのはインクの側。
     斬る＝刃の線で字を2つに割り、片側を刃の向きにずらす＋刃の通り道を細い楔で抜く（乱数で欠けさせない）。
     飛ばす＝刃が字を抜けた所から、刃の向きに墨が飛ぶ（大きい粒は近く・小さい粒は遠く）。 -->

<style>
:root{--bg:#1b1a19;--panel:#24221f;--line:#3a3733;--tx:#e9e4da;--sub:#9a9388;--ac:#d23a4a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hiragino Kaku Gothic ProN",sans-serif;display:flex;height:100vh;overflow:hidden}

label{display:grid;grid-template-columns:78px 1fr 34px;gap:8px;align-items:center;font-size:12px;margin:5px 0}
label span.v{font-size:11px;color:var(--sub);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--ac)}

</style></head><body>
<div id="panel">
  <div style="font-size:11px;margin-bottom:10px"><a href="/interaction-design.html" style="color:inherit;opacity:.6;text-decoration:none">← 木下スタジオ</a></div>
  <h1><b>斬</b> ZAN</h1>
  <p class="lead">明朝を、刃で斬って、墨を飛ばして、1色で刷る。書体は替えず、壊すのはインクの側。</p>
  <div class="grp"><div class="t">字</div>
    <textarea id="txt">一刀
両断</textarea>
    <label>書体<select id="font" style="grid-column:2/4"><option value="Shippori Mincho B1|800">しっぽり明朝 B1</option><option value="Zen Old Mincho|900">Zen Old 明朝</option></select></label>
    <label>大きさ<input type="range" id="size" min="80" max="420" value="300"><span class="v"></span></label>
    <label>字間<input type="range" id="track" min="-30" max="20" value="-6"><span class="v"></span></label>
    <label>行間<input type="range" id="lead" min="70" max="130" value="92"><span class="v"></span></label>

  </div>
  <div class="grp"><div class="t">斬る</div>
    <label>刃の本数<input type="range" id="cuts" min="0" max="14" value="4"><span class="v"></span></label>
    <label>角度<input type="range" id="ang" min="-80" max="80" value="-28"><span class="v"></span></label>

  </div>

    <label>粒の大きさ<input type="range" id="drop" min="2" max="30" value="11"><span class="v"></span></label>
    <label>霧<input type="range" id="mist" min="0" max="100" value="35"><span class="v"></span></label>
  </div>
  <div class="grp"><div class="t">刷る</div>
    <label>ムラ<input type="range" id="mura" min="0" max="100" value="30"><span class="v"></span></label>
    <label>かすれ<input type="range" id="kasu" min="0" max="100" value="18"><span class="v"></span></label>
    <label>色<input type="color" id="ink" value="#d2234a" style="grid-column:2/4;height:30px;padding:2px"></label>
    <label>地<select id="paper" style="grid-column:2/4"><option value="none">なし（透明）</option><option value="#f2efe8">白</option><option value="#d8cfb9">わら半紙</option><option value="#141312">黒</option></select></label>
    <label>種<input type="range" id="seed" min="1" max="999" value="17"><span class="v"></span></label>
  </div>
  <div class="row"><button id="re">刃を振り直す</button><button class="p" id="png">PNGで保存</button></div>
  <div class="row"><button id="svg">SVGで保存</button><button id="jsave">設定を保存</button><button id="jload">設定を読む</button></div>
  <input type="file" id="jfile" accept=".json,application/json" hidden>
  <p class="lead" style="margin-top:12px">刃は乱数で欠けさせず、線で通す。墨は、刃が字を抜けた所から刃の向きに飛ぶ。削ぎは字の端（止め・はらい）を刃の側へ尖らせ、刃の光は刃の線を字の外まで伸ばす。</p>
</div>
<div id="stage"><canvas id="cv"></canvas></div>
<script>
const $=id=>document.getElementById(id);
const K=['size','track','lead','cuts','ang','angj','shift','gap','sogi','hikari','spl','force','drop','mist','mura','kasu','seed'];
const W=1600,H=1600; const cv=$('cv'); cv.width=W; cv.height=H; const ctx=cv.getContext('2d');
let rnd; function seedR(s){let a=s>>>0||1;rnd=()=>{a=(a*1664525+1013904223)>>>0;return a/4294967296}}
const mk=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;return c};
function v(id){return +$(id).value}

function drawText(c){
  const g=c.getContext('2d'); g.clearRect(0,0,W,H); g.fillStyle='#000';
  const [fam,wt]=$('font').value.split('|'); const sz=v('size'); g.font=`${wt} ${sz}px "${fam}"`;
  g.textBaseline='middle'; const lines=$('txt').value.split('\n'); const tr=v('track')/100*sz, ld=v('lead')/100*sz;
  if(!$('vert').checked){
    g.textAlign='left';
    const ws=lines.map(l=>[...l].reduce((s,ch)=>s+g.measureText(ch).width+tr,0)-tr);
    const tot=ld*(lines.length-1); lines.forEach((l,i)=>{let x=(W-ws[i])/2; const y=H/2-tot/2+i*ld;
      for(const ch of l){g.fillText(ch,x,y); x+=g.measureText(ch).width+tr}});
  }else{
    g.textAlign='center'; const tot=ld*(lines.length-1);
    lines.forEach((l,i)=>{const x=W/2+tot/2-i*ld; const n=[...l].length; let y=H/2-(n*(sz+tr)-tr)/2+sz/2;
      for(const ch of l){g.fillText(ch,x,y); y+=sz+tr}});
  }
}
function bbox(c){const d=c.getContext('2d').getImageData(0,0,W,H).data;let x0=W,y0=H,x1=0,y1=0;
  for(let y=0;y<H;y+=4)for(let x=0;x<W;x+=4)if(d[(y*W+x)*4+3]>40){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  return x1<x0?null:{x0,y0,x1,y1}}

// 1本の刃：線で2つに割り、片側を刃の向きにずらし、通り道を楔で抜く
function slash(src,cx,cy,th,shift,gap){
  const dx=Math.cos(th),dy=Math.sin(th), nx=-dy,ny=dx, L=W*2;
  const out=mk(), g=out.getContext('2d');
  const half=(side,ox,oy)=>{g.save();g.beginPath();
    g.moveTo(cx-dx*L,cy-dy*L);g.lineTo(cx+dx*L,cy+dy*L);g.lineTo(cx+dx*L+side*nx*L,cy+dy*L+side*ny*L);g.lineTo(cx-dx*L+side*nx*L,cy-dy*L+side*ny*L);g.closePath();g.clip();
    g.drawImage(src,ox,oy);g.restore()};
  half(-1,0,0); half(1,dx*shift+nx*shift*0.15,dy*shift+ny*shift*0.15);
  if(gap>0){ // 楔：入りは細く、抜けで太い＝刃が通った向きが分かる
    g.save();g.globalCompositeOperation='destination-out';g.beginPath();
    const a=-W*0.9,b=W*0.9;
    g.moveTo(cx+dx*a+nx*gap*0.1,cy+dy*a+ny*gap*0.1);g.lineTo(cx+dx*b+nx*gap,cy+dy*b+ny*gap);
    g.lineTo(cx+dx*b-nx*gap*0.25,cy+dy*b-ny*gap*0.25);g.lineTo(cx+dx*a-nx*gap*0.02,cy+dy*a-ny*gap*0.02);g.closePath();g.fill();g.restore();
  }
  return out;
}
// 刃が字を抜けた点を探す（刃の線に沿って、墨→地 に変わる所）
function exits(c,cx,cy,th){const d=c.getContext('2d').getImageData(0,0,W,H).data;const dx=Math.cos(th),dy=Math.sin(th);
  const pts=[];let prev=0;for(let t=-W;t<W;t+=3){const x=Math.round(cx+dx*t),y=Math.round(cy+dy*t);if(x<0||y<0||x>=W||y>=H){prev=0;continue}
    const a=d[(y*W+x)*4+3]>100?1:0; if(prev&&!a)pts.push([x,y]); prev=a} return pts}

// 削ぎ：止め・はらいの先（字の端）を見つけ、刃で削いだように斜めの尖りに替える
// 端＝輪郭の上で、周りの墨が少なく、墨の重心から遠い所（細い横画の脇は重心が近いので拾わない）
function sogi(c,amt,th,sz){
  if(amt<=0) return; const g=c.getContext('2d'); const D=g.getImageData(0,0,W,H).data;
  const s=3, gw=Math.ceil(W/s), gh=Math.ceil(H/s), A=new Uint8Array(gw*gh);
  for(let y=0;y<gh;y++)for(let x=0;x<gw;x++)A[y*gw+x]=D[((y*s)*W+x*s)*4+3]>100?1:0;
  const I=new Float64Array((gw+1)*(gh+1)),IX=new Float64Array(I.length),IY=new Float64Array(I.length);
  for(let y=0;y<gh;y++){let a=0,ax=0,ay=0;for(let x=0;x<gw;x++){const k=A[y*gw+x];a+=k;ax+=k*x;ay+=k*y;const q=(y+1)*(gw+1)+x+1;
    I[q]=I[q-gw-1]+a;IX[q]=IX[q-gw-1]+ax;IY[q]=IY[q-gw-1]+ay}}
  const box=(T,x0,y0,x1,y1)=>T[y1*(gw+1)+x1]-T[y0*(gw+1)+x1]-T[y1*(gw+1)+x0]+T[y0*(gw+1)+x0];
  const R=sz*0.1, r=Math.max(3,Math.round(R/s)), cand=[];
  for(let y=r+1;y<gh-r-1;y++)for(let x=r+1;x<gw-r-1;x++){if(!A[y*gw+x])continue;
    if(A[y*gw+x-1]&&A[y*gw+x+1]&&A[(y-1)*gw+x]&&A[(y+1)*gw+x])continue; // 輪郭だけ
    const x0=x-r,y0=y-r,x1=x+r+1,y1=y+r+1, n=box(I,x0,y0,x1,y1), f=n/((2*r+1)**2); if(f>0.36)continue;
    const cx=box(IX,x0,y0,x1,y1)/n, cy=box(IY,x0,y0,x1,y1)/n, ox=x-cx, oy=y-cy, l=Math.hypot(ox,oy); if(l<r*0.42)continue;
    cand.push([f-l/r*0.2,x*s,y*s,ox/l,oy/l])}
  cand.sort((a,b)=>a[0]-b[0]); const tips=[];
  for(const c0 of cand){if(tips.some(t=>Math.hypot(t[1]-c0[1],t[2]-c0[2])<R*2.2))continue;tips.push(c0);if(tips.length>160)break}
  const ink=(x,y)=>{x=Math.round(x);y=Math.round(y);return x>=0&&y>=0&&x<W&&y<H&&D[(y*W+x)*4+3]>100};
  const bx=Math.cos(th),by=Math.sin(th);
  for(const [,px,py,ox,oy] of tips){ if(rnd()>amt) continue;
    const nx=-oy,ny=ox, back=R*0.9, qx=px-ox*back, qy=py-oy*back;
    if(!ink(qx,qy)) continue; // 端の手前が墨でない＝見誤り
    let wp=0,wm=0; while(wp<R*1.6&&ink(qx+nx*(wp+1),qy+ny*(wp+1)))wp++; while(wm<R*1.6&&ink(qx-nx*(wm+1),qy-ny*(wm+1)))wm++;
    if(wp+wm<3) continue;
    // 尖りは刃の側へ寄せる（削いだ向きがそろうと、同じ1本の刃で削いだに見える）
    const side=(bx*nx+by*ny)>=0?1:-1, len=R*(0.6+amt*1.1)*(0.7+rnd()*0.6);
    const tx=qx+ox*len+nx*side*(side>0?wp:wm)*0.85, ty=qy+oy*len+ny*side*(side>0?wp:wm)*0.85;
    g.save(); g.globalCompositeOperation='destination-out'; g.beginPath(); // 元の端を消す
    g.moveTo(qx+nx*(wp+2),qy+ny*(wp+2)); g.lineTo(qx+nx*(wp+2)+ox*R*1.7,qy+ny*(wp+2)+oy*R*1.7);
    g.lineTo(qx-nx*(wm+2)+ox*R*1.7,qy-ny*(wm+2)+oy*R*1.7); g.lineTo(qx-nx*(wm+2),qy-ny*(wm+2)); g.closePath(); g.fill(); g.restore();
    g.fillStyle='#000'; g.beginPath(); g.moveTo(qx+nx*wp-ox,qy+ny*wp-oy); g.lineTo(tx,ty); g.lineTo(qx-nx*wm-ox,qy-ny*wm-oy); g.closePath(); g.fill();
  }
}
// 刃の線が字のどこからどこまでを通るか（字の外へ光を伸ばす起点）
function span(c,cx,cy,th){const d=c.getContext('2d').getImageData(0,0,W,H).data;const dx=Math.cos(th),dy=Math.sin(th);let a=null,b=null;
  for(let t=-W;t<W;t+=3){const x=Math.round(cx+dx*t),y=Math.round(cy+dy*t);if(x<0||y<0||x>=W||y>=H)continue;if(d[(y*W+x)*4+3]>100){if(a===null)a=t;b=t}}
  return a===null?null:[a,b]}

function render(){
  seedR(v('seed')); K.forEach(k=>{const s=$(k).parentNode.querySelector('.v');if(s)s.textContent=$(k).value});
  let m=mk(); drawText(m); sogi(m,v('sogi')/100,v('ang')*Math.PI/180,v('size')); const bb=bbox(m); if(!bb){ctx.clearRect(0,0,W,H);return}
  const cuts=v('cuts'), base=v('ang')*Math.PI/180, jit=v('angj')*Math.PI/180, sh=v('shift')/100*v('size')*0.6, gp=v('gap')/100*v('size')*0.5;
  const blades=[];
  for(let i=0;i<cuts;i++){ // 刃は字の中を通るように置く（字の外を斬っても何も起きない）
    const t=(i+0.5)/cuts; const cx=bb.x0+(bb.x1-bb.x0)*(0.15+0.7*rnd()); const cy=bb.y0+(bb.y1-bb.y0)*(t*0.9+0.05+(rnd()-.5)*0.08);
    const th=base+(rnd()-.5)*2*jit; blades.push([cx,cy,th,exits(m,cx,cy,th),span(m,cx,cy,th)]); // 刃の通り道は楔で抜けるので、抜ける前に探す
    m=slash(m,cx,cy,th,sh*(0.5+rnd()),gp*(0.4+rnd()*0.9));
  }
  // 飛ばす
  const sp=mk(), sg=sp.getContext('2d'); sg.fillStyle='#000';
  const amt=v('spl')/100, force=v('force')/100*v('size')*2.2, drop=v('drop')/10*v('size')/60, mist=v('mist')/100;
  blades.forEach(([cx,cy,th,ex])=>{
    ex.forEach(([x,y])=>{
      if(rnd()>amt) return;
      const n=Math.round(4+amt*22);
      for(let k=0;k<n;k++){const far=Math.pow(rnd(),1.6); const dist=far*force; const a=th+(rnd()-.5)*0.5*(1-far*0.5);
        const r=drop*(1-far*0.85)*(0.3+rnd()*0.9); const px=x+Math.cos(a)*dist, py=y+Math.sin(a)*dist;
        sg.save();sg.translate(px,py);sg.rotate(a);sg.beginPath();sg.ellipse(0,0,r*(1+ (1-far)*1.8*rnd()),r*0.7,0,0,Math.PI*2);sg.fill();sg.restore();}
      // 霧：細かい粒を広く
      const mN=Math.round(mist*120);for(let k=0;k<mN;k++){const dist=rnd()*force*1.3;const a=th+(rnd()-.5)*1.2;
        sg.beginPath();sg.arc(x+Math.cos(a)*dist,y+Math.sin(a)*dist,Math.max(.6,drop*0.12*rnd()),0,Math.PI*2);sg.fill();}
    });
  });
  // 合成：字＋飛沫 → 1色で刷る
  const ink=mk(), ig=ink.getContext('2d'); ig.drawImage(m,0,0); ig.drawImage(sp,0,0);
  const id=ig.getImageData(0,0,W,H), d=id.data;
  lastA=new Uint8Array(W*H); for(let i=0;i<lastA.length;i++)lastA[i]=d[i*4+3]; lastFlash=[]; // SVG用：刷る前の墨の形
 const mura=v('mura')/100, kasu=v('kasu')/100;
  // ムラ＝低い周波数の濃淡（版に乗ったインクの厚み）
  const g=48, gw=Math.ceil(W/g)+2, gh=Math.ceil(H/g)+2, field=new Float32Array(gw*gh); for(let i=0;i<field.length;i++)field[i]=rnd();
  const col=$('ink').value; const R=parseInt(col.slice(1,3),16),G=parseInt(col.slice(3,5),16),B=parseInt(col.slice(5,7),16);
  for(let y=0;y<H;y++){const fy=y/g,iy=fy|0,ty=fy-iy;for(let x=0;x<W;x++){const p=(y*W+x)*4;const a=d[p+3];if(!a)continue;
    const fx=x/g,ix=fx|0,tx=fx-ix; const f=(field[iy*gw+ix]*(1-tx)+field[iy*gw+ix+1]*tx)*(1-ty)+(field[(iy+1)*gw+ix]*(1-tx)+field[(iy+1)*gw+ix+1]*tx)*ty;
    let al=a/255*(1-mura*0.55*f); if(kasu>0&&rnd()<kasu*0.35*f)al*=0.15;
    d[p]=R;d[p+1]=G;d[p+2]=B;d[p+3]=al*255}}
  ig.putImageData(id,0,0);
  ctx.clearRect(0,0,W,H); const pp=$('paper').value; if(pp!=='none'){ctx.fillStyle=pp;ctx.fillRect(0,0,W,H)}
  ctx.drawImage(ink,0,0);
  // 刃の光：刃の線を字の外まで細く伸ばす。字の近くで太く、外へ行くほど消える。刷りのムラは掛けない（光は版でなく刃）
  const hk=v('hikari')/100; if(hk>0){ctx.fillStyle=col; const ext=hk*v('size')*2.4, w=Math.max(1.2,v('size')*0.007);
    blades.forEach(([cx,cy,th,,sp])=>{if(!sp)return; const dx=Math.cos(th),dy=Math.sin(th),nx=-dy,ny=dx;
      const P=t=>[cx+dx*t,cy+dy*t]; const [a,b]=sp; const e1=ext*(0.5+rnd()*0.7), e2=ext*(0.6+rnd()*0.9);
      const A=P(a-e1),B=P(a),C=P(b),E=P(b+e2);
      lastFlash.push([A,[B[0]+nx*w*0.6,B[1]+ny*w*0.6],[C[0]+nx*w,C[1]+ny*w],E,[C[0]-nx*w,C[1]-ny*w],[B[0]-nx*w*0.6,B[1]-ny*w*0.6]]);
      ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0]+nx*w*0.6,B[1]+ny*w*0.6);ctx.lineTo(C[0]+nx*w,C[1]+ny*w);ctx.lineTo(E[0],E[1]);
      ctx.lineTo(C[0]-nx*w,C[1]-ny*w);ctx.lineTo(B[0]-nx*w*0.6,B[1]-ny*w*0.6);ctx.closePath();ctx.fill();});}
}
let lastA=null, lastFlash=[];
// SVG：墨の形（画素）の縁を辿って輪郭にする。ムラ・かすれは画素の表現なので入れない（1色のベタ）
function trace(A){
  const VW=W+1, o1=new Int32Array(VW*(H+1)).fill(-1), o2=new Int32Array(VW*(H+1)).fill(-1);
  const ink=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&A[y*W+x]>127;
  const add=(x0,y0,x1,y1)=>{const k=y0*VW+x0,t=y1*VW+x1; if(o1[k]<0)o1[k]=t; else o2[k]=t};
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(!ink(x,y))continue;
    if(!ink(x,y-1))add(x,y,x+1,y); if(!ink(x+1,y))add(x+1,y,x+1,y+1); if(!ink(x,y+1))add(x+1,y+1,x,y+1); if(!ink(x-1,y))add(x,y+1,x,y)}
  const loops=[];
  for(let k0=0;k0<o1.length;k0++){ while(o1[k0]>=0||o2[k0]>=0){
    const pts=[]; let k=k0;
    do{ let t=o1[k]; if(t>=0)o1[k]=-1; else {t=o2[k]; o2[k]=-1} if(t<0)break; pts.push([k%VW,(k/VW)|0]); k=t }while(k!==k0);
    if(pts.length>=4)loops.push(rdp(pts,0.9));
  }}
  return loops;
}
function rdp(P,eps){ // 閉じた折れ線を間引く（階段を直線に）
  const keep=new Uint8Array(P.length); keep[0]=1; const far=P.reduce((b,p,i)=>{const d=(p[0]-P[0][0])**2+(p[1]-P[0][1])**2;return d>b[0]?[d,i]:b},[0,0])[1]; keep[far]=1;
  const st=[[0,far],[far,P.length]];
  while(st.length){const [a,b]=st.pop(); const A=P[a],B=P[b%P.length]; let md=0,mi=-1; const dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy)||1;
    for(let i=a+1;i<b;i++){const d=Math.abs((P[i][0]-A[0])*dy-(P[i][1]-A[1])*dx)/L; if(d>md){md=d;mi=i}}
    if(md>eps){keep[mi]=1;st.push([a,mi],[mi,b])}}
  return P.filter((_,i)=>keep[i]);
}
function svgOut(){
  if(!lastA) return; const loops=trace(lastA), col=$('ink').value, pp=$('paper').value, f=n=>Math.round(n*10)/10;
  const d=loops.map(L=>'M'+L.map(p=>p[0]+' '+p[1]).join('L')+'Z').join('');
  const fl=lastFlash.map(L=>'M'+L.map(p=>f(p[0])+' '+f(p[1])).join('L')+'Z').join('');
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`+(pp!=='none'?`<rect width="${W}" height="${H}" fill="${pp}"/>`:'')+
    `<path fill="${col}" fill-rule="evenodd" d="${d}"/>`+(fl?`<path fill="${col}" d="${fl}"/>`:'')+'</svg>';
  dl(new Blob([svg],{type:'image/svg+xml'}),'zan_'+Date.now()+'.svg');
}
function dl(blob,name){const a=document.createElement('a');a.download=name;a.href=URL.createObjectURL(blob);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
// 設定：つまみの値をそのまま書き出し、読むときはつまみに戻してから描き直す
const SET=[...K,'txt','font','vert','ink','paper'];
function settings(){const o={tool:'zan',v:1};SET.forEach(k=>{const e=$(k);o[k]=e.type==='checkbox'?e.checked:e.value});return o}
function applySettings(o){SET.forEach(k=>{if(!(k in o))return;const e=$(k);if(e.type==='checkbox')e.checked=!!o[k];else e.value=o[k]});go()}
async function go(){const [fam,wt]=$('font').value.split('|');try{await document.fonts.load(`${wt} 100px "${fam}"`,$('txt').value||'字')}catch(e){}render()}
let tm; const later=()=>{clearTimeout(tm);tm=setTimeout(go,30)};
document.querySelectorAll('input,select,textarea').forEach(e=>e.addEventListener('input',later));
$('re').onclick=()=>{$('seed').value=1+Math.floor(Math.random()*998);go()};
$('svg').onclick=svgOut;
$('jsave').onclick=()=>dl(new Blob([JSON.stringify(settings(),null,1)],{type:'application/json'}),'zan_'+Date.now()+'.json');
$('jload').onclick=()=>$('jfile').click();
$('jfile').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(o.tool&&o.tool!=='zan')throw 0;applySettings(o)}catch(_){alert('ZANの設定ファイルではありません')}});e.target.value=''};
$('png').onclick=()=>{const a=document.createElement('a');a.download='zan_'+Date.now()+'.png';a.href=cv.toDataURL('image/png');a.click()};
// 書体が届いてから描く（届く前は別の明朝で描かれる）
const fams=['800 100px "Shippori Mincho B1"','900 100px "Zen Old Mincho"'];
Promise.all(fams.map(f=>document.fonts.load(f,'一刀両断'))).then(()=>document.fonts.ready).then(go);
