<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" role="img" aria-label="織り（綾織り）">
  <!-- Label -->
  <text x="100" y="28" fill="#1A1A18" font-family="'Inter','Helvetica',sans-serif" font-weight="800"
        font-size="11" letter-spacing="4" text-anchor="middle">TWILL 3 / 1</text>

  <!-- Frame -->
  <rect x="28" y="44" width="144" height="176" fill="#F8F5EE" stroke="#1A1A18" stroke-width="2.4" rx="8"/>

  <!-- Clip to frame (inner), draw vertical warp threads (indigo) -->
  <defs>
    <clipPath id="weaveClip">
      <rect x="32" y="48" width="136" height="168" rx="6"/>
    </clipPath>
  </defs>

  <g clip-path="url(#weaveClip)">
    <!-- 縦糸（warp）: indigo rectangles filling the frame -->
    <g fill="#2A4A7F">
      <rect x="32"  y="40" width="14" height="184"/>
      <rect x="54"  y="40" width="14" height="184"/>
      <rect x="76"  y="40" width="14" height="184"/>
      <rect x="98"  y="40" width="14" height="184"/>
      <rect x="120" y="40" width="14" height="184"/>
      <rect x="142" y="40" width="14" height="184"/>
    </g>
    <!-- warpの境界ライン（隙間に見える白地の暗示）-->
    <g stroke="#1A2A4A" stroke-width="0.6" opacity="0.5">
      <line x1="46" y1="40" x2="46" y2="224"/>
      <line x1="68" y1="40" x2="68" y2="224"/>
      <line x1="90" y1="40" x2="90" y2="224"/>
      <line x1="112" y1="40" x2="112" y2="224"/>
      <line x1="134" y1="40" x2="134" y2="224"/>
      <line x1="156" y1="40" x2="156" y2="224"/>
    </g>

    <!-- 横糸（weft）: 3/1ツイルパターン = 各行で1本だけ横糸が表に出る -->
    <!-- 各 weft は白クリーム色。ステップで右下に1つずつずらす -->
    <g fill="#F0E9D5" stroke="#1A1A18" stroke-width="0.6">
      <!-- row 0: warp x=32 -->
      <rect x="32" y="52"  width="14" height="10"/>
      <rect x="54" y="66"  width="14" height="10"/>
      <rect x="76" y="80"  width="14" height="10"/>
      <rect x="98" y="94"  width="14" height="10"/>
      <rect x="120" y="108" width="14" height="10"/>
      <rect x="142" y="122" width="14" height="10"/>

      <rect x="32" y="80"  width="14" height="10"/>
      <rect x="54" y="94"  width="14" height="10"/>
      <rect x="76" y="108" width="14" height="10"/>
      <rect x="98" y="122" width="14" height="10"/>
      <rect x="120" y="136" width="14" height="10"/>
      <rect x="142" y="150" width="14" height="10"/>

      <rect x="32" y="108" width="14" height="10"/>
      <rect x="54" y="122" width="14" height="10"/>
      <rect x="76" y="136" width="14" height="10"/>
      <rect x="98" y="150" width="14" height="10"/>
      <rect x="120" y="164" width="14" height="10"/>
      <rect x="142" y="178" width="14" height="10"/>

      <rect x="32" y="136" width="14" height="10"/>
      <rect x="54" y="150" width="14" height="10"/>
      <rect x="76" y="164" width="14" height="10"/>
      <rect x="98" y="178" width="14" height="10"/>
      <rect x="120" y="192" width="14" height="10"/>

      <rect x="32" y="164" width="14" height="10"/>
      <rect x="54" y="178" width="14" height="10"/>
      <rect x="76" y="192" width="14" height="10"/>
      <rect x="98" y="206" width="14" height="10"/>

      <rect x="32" y="192" width="14" height="10"/>
      <rect x="54" y="206" width="14" height="10"/>
    </g>
  </g>

  <!-- 対角の綾目を指す赤い矢印（Right-twill） -->
  <g>
    <line x1="52" y1="200" x2="158" y2="64" stroke="#D4453E" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M 152 62 L 160 62 L 156 70" fill="#D4453E"/>
  </g>

  <!-- Bottom footnote -->
  <text x="100" y="242" fill="#4A4A45" font-family="'Inter','Helvetica',sans-serif" font-weight="600"
        font-size="10" letter-spacing="3" text-anchor="middle">WARP × WEFT × DIAGONAL</text>
</svg>
