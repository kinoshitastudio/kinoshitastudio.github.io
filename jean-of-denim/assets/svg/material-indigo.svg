<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" role="img" aria-label="インディゴ染め">
  <!-- Label -->
  <text x="100" y="22" fill="#1A1A18" font-family="'Inter','Helvetica',sans-serif" font-weight="800"
        font-size="11" letter-spacing="4" text-anchor="middle">INDIGO DYE</text>

  <!-- Hanging thread + dipping rope (rope dyeing hint) -->
  <line x1="100" y1="32" x2="100" y2="60" stroke="#1A1A18" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="100" cy="32" r="3" fill="#1A1A18"/>

  <!-- Drop — outer indigo shell -->
  <path d="M 100 50 Q 60 100 60 150 Q 60 192 100 206 Q 140 192 140 150 Q 140 100 100 50 Z"
        fill="#2A4A7F" stroke="#1A1A18" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Highlight (wet sheen) -->
  <path d="M 80 82 Q 72 110 74 138" fill="none" stroke="#7895D0" stroke-width="6" stroke-linecap="round" opacity="0.65"/>

  <!-- Inner "ring" (dye doesn't penetrate core) -->
  <path d="M 100 84 Q 80 120 80 154 Q 80 184 100 194 Q 120 184 120 154 Q 120 120 100 84 Z"
        fill="#F8F5EE" stroke="#1A1A18" stroke-width="1.4"/>

  <!-- White core -->
  <path d="M 100 110 Q 92 140 92 166 Q 92 180 100 184 Q 108 180 108 166 Q 108 140 100 110 Z"
        fill="#FFFFFF" opacity="0.92"/>

  <!-- Small dripping drop -->
  <path d="M 100 208 Q 94 222 100 236 Q 106 222 100 208 Z"
        fill="#2A4A7F" stroke="#1A1A18" stroke-width="1.6"/>
  <path d="M 100 214 Q 96 222 100 230 Q 104 222 100 214 Z" fill="#1A2A4A" opacity="0.6"/>

  <!-- Ripples below (dye vat surface) -->
  <ellipse cx="100" cy="244" rx="44" ry="4.5" fill="none" stroke="#2A4A7F" stroke-width="1.6" opacity="0.55"/>
  <ellipse cx="100" cy="252" rx="66" ry="4.5" fill="none" stroke="#2A4A7F" stroke-width="1" opacity="0.3"/>

  <!-- Red selvedge thread through the drop (brand signal) -->
  <line x1="140" y1="58" x2="160" y2="44" stroke="#D4453E" stroke-width="2" stroke-linecap="round"/>
</svg>
