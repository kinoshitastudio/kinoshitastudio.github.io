<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="INDIGO INDEX logo">
  <!-- インディゴの「I」を本にも見えるように。左：開いた本 / 右：藍染めの糸 -->
  <rect x="4" y="4" width="56" height="56" rx="8" fill="#2A4A7F"/>
  <!-- 本の見開き -->
  <path d="M 12 16 Q 22 14 32 18 L 32 50 Q 22 46 12 48 Z" fill="#F8F5EE" opacity="0.95"/>
  <path d="M 52 16 Q 42 14 32 18 L 32 50 Q 42 46 52 48 Z" fill="#EFE9DD" opacity="0.9"/>
  <!-- 中央の背 -->
  <line x1="32" y1="16" x2="32" y2="50" stroke="#1A2A4A" stroke-width="1.3"/>
  <!-- 本文行（藍インクの文字） -->
  <line x1="16" y1="24" x2="28" y2="25.5" stroke="#1A2A4A" stroke-width="1.2" opacity="0.6"/>
  <line x1="16" y1="30" x2="26" y2="31" stroke="#1A2A4A" stroke-width="1.2" opacity="0.6"/>
  <line x1="16" y1="36" x2="28" y2="37.5" stroke="#1A2A4A" stroke-width="1.2" opacity="0.6"/>
  <line x1="36" y1="25.5" x2="48" y2="24" stroke="#1A2A4A" stroke-width="1.2" opacity="0.5"/>
  <line x1="36" y1="31" x2="46" y2="30" stroke="#1A2A4A" stroke-width="1.2" opacity="0.5"/>
  <line x1="36" y1="37.5" x2="48" y2="36" stroke="#1A2A4A" stroke-width="1.2" opacity="0.5"/>
  <!-- セルヴィッジ赤線 -->
  <line x1="32" y1="16" x2="32" y2="50" stroke="#D4453E" stroke-width="0.8" opacity="0.9"/>
</svg>
