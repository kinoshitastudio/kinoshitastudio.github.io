<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" role="img" aria-label="オンス（重さ）">
  <!-- Hanging string -->
  <line x1="100" y1="8" x2="100" y2="48" stroke="#1A1A18" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="100" cy="8" r="3.5" fill="#1A1A18"/>

  <!-- Paper tag / hangtag -->
  <path d="M 54 50 L 146 50 L 146 210 Q 100 226 54 210 Z"
        fill="#F3EEE2" stroke="#1A1A18" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Tag crease -->
  <path d="M 54 50 L 66 62 L 134 62 L 146 50" fill="none" stroke="#1A1A18" stroke-width="1.4"/>

  <!-- Hole / grommet -->
  <circle cx="100" cy="44" r="5" fill="#F3EEE2" stroke="#1A1A18" stroke-width="1.6"/>
  <circle cx="100" cy="44" r="2.4" fill="#1A2A4A"/>

  <!-- Big indigo disc with OZ -->
  <circle cx="100" cy="120" r="44" fill="#2A4A7F" stroke="#1A1A18" stroke-width="2.4"/>
  <circle cx="100" cy="120" r="34" fill="none" stroke="#1A2A4A" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="100" y="118" fill="#FFFFFF" font-family="'Inter','Helvetica',sans-serif" font-weight="900"
        font-size="11" letter-spacing="4" text-anchor="middle">WEIGHT</text>
  <text x="100" y="148" fill="#FFFFFF" font-family="'Inter','Helvetica',sans-serif" font-weight="900"
        font-size="30" text-anchor="middle" letter-spacing="-1">oz</text>

  <!-- Fabric layers (thickness scale) -->
  <g transform="translate(64, 178)">
    <rect x="0"  y="0"  width="72" height="4"  fill="#6B89AB" stroke="#1A1A18" stroke-width="1"/>
    <rect x="0"  y="8"  width="72" height="7"  fill="#4A6AA0" stroke="#1A1A18" stroke-width="1"/>
    <rect x="0"  y="19" width="72" height="10" fill="#2A4A7F" stroke="#1A1A18" stroke-width="1"/>
    <!-- red selvedge on the right edge of thickest layer -->
    <rect x="70" y="19" width="3" height="10" fill="#D4453E"/>
  </g>

  <!-- OZ numbers in tag bottom corner -->
  <text x="100" y="204" fill="#1A1A18" font-family="'Inter','Helvetica',sans-serif" font-weight="700"
        font-size="9" letter-spacing="3" text-anchor="middle">8 · 13 · 18</text>
</svg>
