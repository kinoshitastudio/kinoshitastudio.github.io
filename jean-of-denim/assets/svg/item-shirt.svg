<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 240" role="img" aria-label="シャンブレーシャツ">
  <!-- 左袖 -->
  <path d="M 44 62 Q 20 84 14 140 L 26 214 L 58 210 L 52 140 Q 52 98 66 76 Z" fill="#6B89AB" stroke="#1A1A18" stroke-width="2.2" stroke-linejoin="round"/>
