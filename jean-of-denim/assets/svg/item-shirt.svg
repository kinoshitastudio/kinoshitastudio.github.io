  <rect x="104" y="78" width="12" height="138" fill="#6B89AB" stroke="#1A1A18" stroke-width="1.4"/>
  <!-- ボタン -->
  <circle cx="110" cy="96"  r="2.6" fill="#F3EEE2" stroke="#1A1A18" stroke-width="1"/>
  <circle cx="110" cy="122" r="2.6" fill="#F3EEE2" stroke="#1A1A18" stroke-width="1"/>
  <circle cx="110" cy="148" r="2.6" fill="#F3EEE2" stroke="#1A1A18" stroke-width="1"/>
  <circle cx="110" cy="174" r="2.6" fill="#F3EEE2" stroke="#1A1A18" stroke-width="1"/>
  <circle cx="110" cy="200" r="2.6" fill="#F3EEE2" stroke="#1A1A18" stroke-width="1"/>
  <!-- 左チェストポケット（フラップ付き） -->
  <path d="M 62 102 L 90 102 L 90 134 L 62 134 Z" fill="#5A7A9B" stroke="#1A1A18" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M 62 102 L 76 112 L 90 102" fill="none" stroke="#1A1A18" stroke-width="1.5"/>
  <circle cx="76" cy="108" r="1.8" fill="#F3EEE2" stroke="#1A1A18" stroke-width="0.8"/>
  <!-- 右チェストポケット -->
  <path d="M 130 102 L 158 102 L 158 134 L 130 134 Z" fill="#5A7A9B" stroke="#1A1A18" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M 130 102 L 144 112 L 158 102" fill="none" stroke="#1A1A18" stroke-width="1.5"/>
  <circle cx="144" cy="108" r="1.8" fill="#F3EEE2" stroke="#1A1A18" stroke-width="0.8"/>
  <!-- 平織りの横目 -->
  <g stroke="#8BA8C6" stroke-width="0.6" opacity="0.5">
    <line x1="48" y1="160" x2="100" y2="160"/>
    <line x1="120" y1="160" x2="172" y2="160"/>
    <line x1="48" y1="180" x2="100" y2="180"/>
    <line x1="120" y1="180" x2="172" y2="180"/>
    <line x1="48" y1="200" x2="100" y2="200"/>
    <line x1="120" y1="200" x2="172" y2="200"/>
  </g>
  <!-- 袖口 -->
  <rect x="24" y="200" width="36" height="16" fill="#5A7A9B" stroke="#1A1A18" stroke-width="1.6" rx="2"/>
  <rect x="160" y="200" width="36" height="16" fill="#5A7A9B" stroke="#1A1A18" stroke-width="1.6" rx="2"/>
  <circle cx="52" cy="208" r="1.8" fill="#F3EEE2" stroke="#1A1A18" stroke-width="0.8"/>
  <circle cx="168" cy="208" r="1.8" fill="#F3EEE2" stroke="#1A1A18" stroke-width="0.8"/>
