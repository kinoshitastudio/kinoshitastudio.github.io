<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-label="Jean — デニムのジーン">
  <!-- iOS applies its own mask, but we draw a filled square bg -->
  <rect x="0" y="0" width="180" height="180" fill="#2A4A7F"/>
  <!-- denim twill subtle texture -->
  <g opacity="0.16">
    <path d="M 0 0 L 180 180 M 20 0 L 180 160 M 40 0 L 180 140 M 60 0 L 180 120 M -20 20 L 160 180 M -40 40 L 140 180"
          stroke="#FFFFFF" stroke-width="0.9"/>
  </g>
  <!-- selvedge red stripe, right edge -->
  <rect x="168" y="0" width="3" height="180" fill="#D4453E" opacity="0.85"/>
  <!-- Jean — centered, larger -->
  <g transform="translate(90 96) scale(2.1) translate(-32 -32)">
    <!-- hair -->
    <path d="M 14 30 Q 10 16 22 12 Q 32 7 42 12 Q 54 16 52 30 Q 54 42 46 46 Q 44 52 40 52 Q 32 54 24 52 Q 16 50 14 42 Q 12 36 14 30 Z"
          fill="#7A5632" stroke="#1A1A18" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- face -->
    <path d="M 20 32 Q 20 23 28 22 Q 36 21 42 24 Q 46 28 46 35 Q 45 43 38 45 Q 30 46 24 42 Q 20 38 20 32 Z"
          fill="#F3C9A2" stroke="#1A1A18" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- ears -->
    <ellipse cx="15" cy="33" rx="3.2" ry="4" fill="#7A5632" stroke="#1A1A18" stroke-width="1.2"/>
    <ellipse cx="15" cy="33" rx="1.8" ry="2.4" fill="#F3C9A2"/>
    <ellipse cx="51" cy="33" rx="3.2" ry="4" fill="#7A5632" stroke="#1A1A18" stroke-width="1.2"/>
    <ellipse cx="51" cy="33" rx="1.8" ry="2.4" fill="#F3C9A2"/>
    <!-- eyes -->
    <circle cx="28" cy="33" r="2.2" fill="#1A1A18"/>
    <circle cx="38" cy="33" r="2.2" fill="#1A1A18"/>
    <circle cx="28.6" cy="32.2" r="0.7" fill="#FFFFFF"/>
    <circle cx="38.6" cy="32.2" r="0.7" fill="#FFFFFF"/>
    <!-- smile -->
    <path d="M 27 39 Q 33 44 39 39" stroke="#1A1A18" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- cheeks -->
    <circle cx="24" cy="38" r="1.6" fill="#E89A7A" opacity="0.55"/>
    <circle cx="42" cy="38" r="1.6" fill="#E89A7A" opacity="0.55"/>
  </g>
  <!-- nameplate at bottom -->
  <text x="90" y="164" fill="#FFFFFF" font-family="'Inter',-apple-system,sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="3">JEAN</text>
</svg>
