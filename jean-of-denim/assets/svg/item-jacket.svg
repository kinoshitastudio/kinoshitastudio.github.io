<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="デニムジャケット Type III">
  <!-- 左袖 -->
  <path d="M 48 68 Q 22 92 16 150 L 28 218 L 64 212 L 58 150 Q 58 104 72 82 Z" fill="#2A4A7F" stroke="#1A1A18" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- 右袖 -->
  <path d="M 192 68 Q 218 92 224 150 L 212 218 L 176 212 L 182 150 Q 182 104 168 82 Z" fill="#2A4A7F" stroke="#1A1A18" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- 袖口（ボタン付き） -->
  <rect x="24" y="200" width="40" height="16" fill="#1A2A4A" stroke="#1A1A18" stroke-width="1.8" rx="2"/>
  <rect x="176" y="200" width="40" height="16" fill="#1A2A4A" stroke="#1A1A18" stroke-width="1.8" rx="2"/>
  <circle cx="54" cy="208" r="2" fill="#D4A555" stroke="#1A1A18" stroke-width="0.8"/>
  <circle cx="186" cy="208" r="2" fill="#D4A555" stroke="#1A1A18" stroke-width="0.8"/>

  <!-- ボディ -->
  <path d="M 56 64 Q 66 52 86 48 L 96 60 Q 104 66 120 66 Q 136 66 144 60 L 154 48 Q 174 52 184 64 L 190 218 L 50 218 Z" fill="#2A4A7F" stroke="#1A1A18" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- ヨーク（肩切替）-->
  <path d="M 56 64 Q 100 78 120 78 Q 140 78 184 64" fill="#1A2A4A" stroke="#1A1A18" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- カラー -->
  <path d="M 96 60 L 120 80 L 144 60 L 150 48 L 120 68 L 90 48 Z" fill="#1A2A4A" stroke="#1A1A18" stroke-width="2" stroke-linejoin="round"/>

  <!-- センタープラケット -->
  <rect x="114" y="80" width="12" height="136" fill="#1A2A4A" stroke="#1A1A18" stroke-width="1.4"/>

  <!-- フロントボタン -->
  <circle cx="120" cy="100" r="3"   fill="#D4A555" stroke="#1A1A18" stroke-width="1"/>
  <circle cx="120" cy="128" r="3"   fill="#D4A555" stroke="#1A1A18" stroke-width="1"/>
  <circle cx="120" cy="156" r="3"   fill="#D4A555" stroke="#1A1A18" stroke-width="1"/>
  <circle cx="120" cy="184" r="3"   fill="#D4A555" stroke="#1A1A18" stroke-width="1"/>

  <!-- Type III V字胸ポケット（左） -->
  <path d="M 58 106 L 100 106 L 100 144 L 58 144 Z" fill="#1A2A4A" stroke="#1A1A18" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M 58 106 L 79 128 L 100 106" fill="none" stroke="#D4A555" stroke-width="1.4" stroke-dasharray="3 2"/>
  <circle cx="79" cy="112" r="2" fill="#D4A555" stroke="#1A1A18" stroke-width="0.8"/>
  <!-- Type III V字胸ポケット（右） -->
  <path d="M 140 106 L 182 106 L 182 144 L 140 144 Z" fill="#1A2A4A" stroke="#1A1A18" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M 140 106 L 161 128 L 182 106" fill="none" stroke="#D4A555" stroke-width="1.4" stroke-dasharray="3 2"/>
  <circle cx="161" cy="112" r="2" fill="#D4A555" stroke="#1A1A18" stroke-width="0.8"/>

  <!-- プリーツの縦ライン -->
  <line x1="76" y1="80" x2="76" y2="158" stroke="#1A1A18" stroke-width="1" opacity="0.55"/>
  <line x1="164" y1="80" x2="164" y2="158" stroke="#1A1A18" stroke-width="1" opacity="0.55"/>

  <!-- 赤タブ（右胸） -->
  <rect x="162" y="108" width="4" height="11" fill="#D4453E" stroke="#1A1A18" stroke-width="0.6"/>

  <!-- 裾ステッチ -->
  <line x1="52" y1="214" x2="188" y2="214" stroke="#D4A555" stroke-width="1.2" stroke-dasharray="3 2"/>

  <!-- サイドアジャスター -->
  <rect x="40" y="196" width="12" height="5" fill="#1A2A4A" stroke="#1A1A18" stroke-width="1"/>
  <rect x="188" y="196" width="12" height="5" fill="#1A2A4A" stroke="#1A1A18" stroke-width="1"/>
  <circle cx="44" cy="198.5" r="1.2" fill="#D4A555"/>
  <circle cx="196" cy="198.5" r="1.2" fill="#D4A555"/>
</svg>
