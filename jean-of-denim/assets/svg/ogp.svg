<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="デニムのジーン — Jean of Denim">
  <!-- Paper background -->
  <rect width="1200" height="630" fill="#F8F5EE"/>

  <!-- Subtle denim stripes texture -->
  <g opacity="0.18">
    <path d="M 0 0 L 1200 0 L 1200 630 L 0 630 Z" fill="url(#diag)"/>
  </g>
  <defs>
    <pattern id="diag" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 0 0 L 60 60" stroke="#2A4A7F" stroke-width="0.6"/>
      <path d="M 30 0 L 90 60" stroke="#2A4A7F" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- Large indigo disk behind character -->
  <circle cx="940" cy="330" r="310" fill="#E0E5ED" opacity="0.75"/>
  <circle cx="940" cy="330" r="240" fill="none" stroke="#2A4A7F" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.35"/>

  <!-- Selvedge red line on the right edge -->
  <rect x="1186" y="0" width="4" height="630" fill="#D4453E" opacity="0.9"/>

  <!-- Rivets -->
  <g fill="#2A4A7F">
    <circle cx="70"  cy="80"  r="5"/>
    <circle cx="70"  cy="550" r="5"/>
    <circle cx="1120" cy="80"  r="5"/>
    <circle cx="1120" cy="550" r="5"/>
  </g>

  <!-- Eyebrow -->
  <text x="80" y="120" fill="#2A4A7F" font-family="'Inter',-apple-system,Helvetica,sans-serif" font-size="22" font-weight="800" letter-spacing="6">
    A QUIET GUIDE TO DENIM · NO.01
  </text>

  <!-- Japanese main title -->
  <text x="80" y="260" fill="#1A1A18" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="130" font-weight="900" letter-spacing="-6">
    デニムの、
  </text>
  <g>
    <rect x="80" y="322" width="430" height="18" fill="#D4453E" opacity="0.32" rx="4"/>
    <text x="80" y="400" fill="#2A4A7F" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="150" font-weight="900" letter-spacing="-6">
      ジーン。
    </text>
  </g>

  <!-- English subtitle -->
  <text x="80" y="470" fill="#4A4A45" font-family="'Inter',-apple-system,Helvetica,sans-serif" font-size="34" font-weight="700" letter-spacing="4">
    JEAN OF DENIM
  </text>
  <text x="80" y="510" fill="#8A8880" font-family="'Inter',-apple-system,Helvetica,sans-serif" font-size="20" font-weight="500" letter-spacing="2">
    The quiet field guide — history, material, styling.
  </text>

  <!-- Byline / studio -->
  <text x="80" y="580" fill="#8A8880" font-family="'Inter',-apple-system,Helvetica,sans-serif" font-size="16" font-weight="600" letter-spacing="3">
    © 2026 KINOSHITA STUDIO
  </text>

  <!-- Jean character — happy version inline -->
  <g transform="translate(820 140)">
    <!-- Hair -->
    <path d="M 58 70 Q 50 40 80 28 Q 106 16 132 28 Q 162 38 170 64 Q 176 94 160 118 Q 154 136 150 146 Q 130 170 110 170 Q 88 170 70 152 Q 54 134 52 108 Q 50 86 58 70 Z"
          fill="#7A5632" stroke="#1A1A18" stroke-width="2.4" stroke-linejoin="round"/>
    <!-- Face -->
    <path d="M 78 86 Q 74 72 88 66 Q 102 60 118 62 Q 140 62 144 82 Q 148 98 146 114 Q 144 130 134 138 Q 122 146 108 146 Q 92 144 82 132 Q 76 118 76 104 Q 76 92 78 86 Z"
          fill="#F3C9A2" stroke="#1A1A18" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Cheek blush -->
    <ellipse cx="90" cy="120" rx="7" ry="5" fill="#E89A7A" opacity="0.55"/>
    <ellipse cx="134" cy="120" rx="7" ry="5" fill="#E89A7A" opacity="0.55"/>
    <!-- Ears -->
    <ellipse cx="58" cy="100" rx="13" ry="16" fill="#7A5632" stroke="#1A1A18" stroke-width="2.2"/>
    <ellipse cx="58" cy="100" rx="7" ry="9" fill="#F3C9A2"/>
    <ellipse cx="162" cy="100" rx="13" ry="16" fill="#7A5632" stroke="#1A1A18" stroke-width="2.2"/>
    <ellipse cx="162" cy="100" rx="7" ry="9" fill="#F3C9A2"/>
    <!-- Eyes (happy closed arcs) -->
    <path d="M 88 102 Q 96 94 104 102" stroke="#1A1A18" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 118 102 Q 126 94 134 102" stroke="#1A1A18" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Smile -->
    <path d="M 94 126 Q 110 140 128 126" stroke="#1A1A18" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M 100 130 Q 110 136 120 130" fill="#2C2A26"/>
    <!-- Body/Shirt (indigo) -->
    <path d="M 54 178 L 50 240 L 80 250 L 80 210 Q 92 216 110 216 Q 128 216 140 210 L 140 250 L 170 240 L 166 178 Q 138 164 110 164 Q 82 164 54 178 Z"
          fill="#2A4A7F" stroke="#1A1A18" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M 110 166 L 110 216" stroke="#D4A555" stroke-width="1.4" stroke-dasharray="4 3"/>
    <!-- Sparkle highlights (happy) -->
    <path d="M 28 38 L 32 44 L 38 40 L 32 50" stroke="#D4A555" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 184 54 L 188 60 L 194 56 L 188 66" stroke="#D4A555" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</svg>
