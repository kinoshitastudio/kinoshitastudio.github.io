<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 240" role="img" aria-label="ジーン（通常）">
  <!-- 手描き風：わざと線を少し波立たせて、おさるのジョージっぽい癖を出す -->
  <g fill="none" stroke="#1A1A18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- 頭 outer hair outline (少し歪む) -->
    <path d="M 60 78 Q 54 46 80 34 Q 105 22 130 32 Q 158 40 166 68 Q 172 96 160 120 Q 154 136 150 146 Q 130 170 110 170 Q 88 170 70 152 Q 56 136 54 110 Q 52 94 60 78 Z" fill="#7A5632"/>
    <!-- 顔 (肌色) -->
    <path d="M 78 88 Q 74 74 88 68 Q 102 62 118 64 Q 138 64 144 82 Q 148 98 146 114 Q 144 130 134 138 Q 122 146 108 146 Q 92 144 82 132 Q 76 120 76 104 Q 76 94 78 88 Z" fill="#F3C9A2"/>
    <!-- ほっぺ -->
    <ellipse cx="90" cy="118" rx="8" ry="5" fill="#E89A7A" opacity="0.55" stroke="none"/>
    <ellipse cx="134" cy="118" rx="8" ry="5" fill="#E89A7A" opacity="0.55" stroke="none"/>
    <!-- 耳 (monkey らしく大きめ) -->
    <ellipse cx="58" cy="104" rx="11" ry="14" fill="#7A5632"/>
    <ellipse cx="58" cy="104" rx="6" ry="8" fill="#F3C9A2" stroke="none"/>
    <ellipse cx="162" cy="104" rx="11" ry="14" fill="#7A5632"/>
    <ellipse cx="162" cy="104" rx="6" ry="8" fill="#F3C9A2" stroke="none"/>
    <!-- 目（丸いドット・白目あり） -->
    <circle cx="96" cy="100" r="5" fill="#FFFFFF"/>
    <circle cx="128" cy="100" r="5" fill="#FFFFFF"/>
    <circle cx="97" cy="101" r="2.8" fill="#1A1A18" stroke="none"/>
    <circle cx="129" cy="101" r="2.8" fill="#1A1A18" stroke="none"/>
    <!-- 口（控えめな微笑） -->
    <path d="M 102 130 Q 112 134 120 130" />
    <!-- 鼻穴 -->
    <path d="M 110 116 L 110 120" stroke-width="1.6"/>
    <!-- デニム服（首から下） -->
    <path d="M 54 178 L 50 220 L 80 230 L 80 192 Q 92 198 110 198 Q 128 198 140 192 L 140 230 L 170 220 L 166 178 Q 138 164 110 164 Q 82 164 54 178 Z" fill="#2A4A7F"/>
    <!-- デニムのステッチ -->
    <path d="M 110 166 L 110 198" stroke="#D4A555" stroke-width="1" stroke-dasharray="3 2"/>
    <path d="M 86 170 L 86 200" stroke="#D4A555" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6"/>
    <path d="M 134 170 L 134 200" stroke="#D4A555" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6"/>
  </g>
</svg>
