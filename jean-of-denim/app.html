<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="UTF-8">

<!-- Favicons -->
<link rel="icon" type="image/svg+xml" href="./assets/svg/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="./assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./assets/img/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="./assets/img/apple-touch-icon.png">

<!-- Open Graph / Twitter -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="デニムのジーン">
<meta property="og:title" content="デニムのジーン — App">
<meta property="og:description" content="片手で読める、デニムのジーン アプリ版。歴史・素材・着こなしまで、本を開く速さで。">

<meta property="og:image:height" content="630">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="デニムのジーン — App">
<meta name="twitter:description" content="片手で読める、デニムのジーン アプリ版。">
<meta name="twitter:image" content="./assets/img/ogp.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/css/style.css">
<style>
/* ═══ APP SHELL ═══ */
:root {
  --app-h: 100dvh;
}
html, body { height: 100%; }
body.app {
  background: var(--paper);
  overflow: hidden;
  overscroll-behavior: contain;
}
.app-root {
  display: grid;
  grid-template-rows: auto 1fr auto;
  height: var(--app-h);
}

/* ── TOP BAR ── */
.app-bar {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  padding-top: max(10px, env(safe-area-inset-top));
  background: var(--indigo-deep);
  color: #fff;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  position: relative;
  z-index: 10;
}
.app-bar .app-brand {
  display: flex; align-items: center; gap: 8px;
  color: #fff;
}
.app-bar .app-brand img { width: 26px; height: 26px; }
.app-bar .app-brand-name {
  font-family: 'Inter', sans-serif; font-weight: 900;
  font-size: 14px; letter-spacing: 0.02em;
}
.app-bar .app-brand-name small {
  display: block;
  font-size: 9px; letter-spacing: 0.3em; font-weight: 500;
  opacity: 0.7;
  margin-top: 1px;
}
.app-bar .spacer { flex: 1; }
.app-icon-btn {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  color: #fff;
  width: 34px; height: 34px;
  border-radius: 10px;
  font-size: 14px;
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: background .15s var(--ease), transform .1s;
}
.app-icon-btn:hover { background: rgba(255,255,255,0.16); }
.app-icon-btn:active { transform: scale(0.95); }

/* ── PROGRESS BAR ── */
.app-progress {
  position: absolute;
  bottom: -1px; left: 0;
  height: 2px;
  background: var(--selvedge);
  width: 0%;
  transition: width .25s var(--ease);
}

/* ── VIEW ── */
.app-view {
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  scroll-behavior: smooth;
  padding: 40px 22px 80px;
  padding-bottom: max(80px, env(safe-area-inset-bottom));
}
.app-view.fade > * { animation: appPageIn .4s var(--ease) both; }
@keyframes appPageIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── BOTTOM NAV (tabs) ── */
.app-tabs {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  background: var(--card);
  border-top: 1px solid var(--line);
  padding-bottom: max(4px, env(safe-area-inset-bottom));
  position: relative;
  z-index: 10;
}
.app-tab {
  display: flex; flex-direction: column; align-items: center;
  gap: 3px;
  padding: 9px 4px 7px;
  border: none; background: transparent;
  color: var(--ink-faint);
  font-family: inherit;
  font-size: 10.5px;
  font-weight: 600;
  cursor: pointer;
  position: relative;
  transition: color .15s var(--ease);
}
.app-tab.active { color: var(--indigo); }
.app-tab.active::before {
  content: '';
  position: absolute;
  top: 0; left: 24%; right: 24%;
  height: 2px;
  background: var(--indigo);
  border-radius: 0 0 2px 2px;
}
.app-tab svg { width: 22px; height: 22px; display: block; }

/* ── DRAWER (chapter list) ── */
.app-drawer {
  position: fixed; inset: 0;
  z-index: 50;
  display: none;
}
.app-drawer.open { display: block; }
.app-drawer-bg {
  position: absolute; inset: 0;
  background: rgba(26,42,74,0.4);
  animation: appFadeIn .25s var(--ease);
}
.app-drawer-panel {
  position: absolute; top: 0; bottom: 0; left: 0;
  width: min(86vw, 340px);
  background: var(--paper);
  box-shadow: 4px 0 40px rgba(0,0,0,0.3);
  animation: appSlideIn .3s var(--ease);
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top);
}
@keyframes appFadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes appSlideIn { from { transform: translateX(-100%); } to { transform: translateX(0); } }

.app-drawer-head {
  padding: 18px 20px;
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 10px;
}
.app-drawer-head img { width: 28px; height: 28px; }
.app-drawer-head .t { font-weight: 900; font-size: 15px; letter-spacing: 0.02em; }
.app-drawer-head .t small { display: block; font-size: 10px; letter-spacing: 0.25em; color: var(--ink-faint); font-weight: 500; margin-top: 2px; }
.app-drawer-close {
  margin-left: auto;
  background: none; border: none;
  font-size: 22px;
  color: var(--ink-soft); cursor: pointer; padding: 4px 8px;
}

.app-drawer-list {
  overflow-y: auto;
  padding: 8px;
  flex: 1;
}
.app-drawer-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
  border-radius: 10px;
  color: var(--ink);
  cursor: pointer;
  transition: background .15s;
}
.app-drawer-item:hover { background: var(--paper-warm); }
.app-drawer-item.on { background: var(--indigo-soft); color: var(--indigo-deep); font-weight: 700; }
.app-drawer-item .n {
  font-family: 'Inter',sans-serif; font-weight: 900;
  font-size: 13px;
  color: var(--indigo);
  min-width: 24px;
}
.app-drawer-item .t { font-size: 14px; }
.app-drawer-sub {
  padding: 4px 20px 4px 48px;
  font-size: 12.5px;
  color: var(--ink-soft);
  cursor: pointer;
  border-radius: 6px;
  margin: 2px 8px;
}
.app-drawer-sub:hover { background: var(--paper-warm); }
.app-drawer-sub.on { color: var(--indigo); font-weight: 700; }

.app-drawer-foot {
  padding: 14px 20px;
  border-top: 1px solid var(--line);
  font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: 0.1em;
  font-family: 'Inter', sans-serif;
}

/* ── HOME CARD HERO (app-only) ── */
.app-hero {
  position: relative;
  background: linear-gradient(135deg, var(--indigo) 0%, var(--indigo-deep) 100%);
  color: #fff;
  border-radius: 20px;
  padding: 36px 24px 32px;
  margin-bottom: 48px;
  overflow: hidden;
  box-shadow: 0 10px 28px rgba(26,42,74,0.25);
}
.app-home-section {
  margin-top: 52px;
}
.app-home-section:first-of-type { margin-top: 0; }
.app-home-section-title {
  font-family: 'Inter', sans-serif;
  font-size: 10.5px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--ink-faint);
  font-weight: 700;
  margin-bottom: 18px;
  padding-left: 2px;
}
.app-hero::before {
  content: '';
  position: absolute; inset: 0;
  background:
    repeating-linear-gradient(110deg, transparent 0 28px, rgba(255,255,255,0.06) 28px 30px, transparent 30px 60px);
  animation: heroStripeDrift 20s linear infinite;
  opacity: 0.6;
}
.app-hero-inner { position: relative; z-index: 1; }
.app-hero-eyebrow {
  font-family: 'Inter', sans-serif;
  font-size: 10px;
  letter-spacing: 0.3em;
  font-weight: 700;
  opacity: 0.75;
  margin-bottom: 10px;
}
.app-hero-title {
  font-size: 30px; font-weight: 900;
  letter-spacing: -0.03em;
  line-height: 1.15;
  margin-bottom: 10px;
}
.app-hero-title .selvedge {
  display: inline-block;
  border-bottom: 3px solid var(--selvedge);
  padding-bottom: 2px;
}
.app-hero-lead {
  font-size: 13px;
  line-height: 1.7;
  opacity: 0.9;
}
.app-hero-jean {
  position: absolute;
  right: -8px; bottom: -4px;
  width: 120px;
  opacity: 0.95;
  filter: drop-shadow(0 6px 16px rgba(0,0,0,0.35));
  animation: appJeanBounce 3s ease-in-out infinite;
  pointer-events: none;
}
@keyframes appJeanBounce {
  0%, 100% { transform: translateY(0) rotate(-2deg); }
  50%      { transform: translateY(-6px) rotate(1deg); }
}

/* ── HOME CARD LIST ── */
.app-card-list { display: flex; flex-direction: column; gap: 16px; }
.app-card {
  display: flex; align-items: center; gap: 14px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 22px 20px;
  cursor: pointer;
  transition: transform .1s, border-color .15s, background .15s;
  text-align: left;
  width: 100%;
  font-family: inherit;
  color: inherit;
}
.app-card:active { transform: scale(0.98); }
.app-card:hover { border-color: var(--indigo); background: var(--paper-warm); }
.app-card-num {
  font-family: 'Inter',sans-serif; font-weight: 900;
  font-size: 20px;
  color: var(--indigo);
  min-width: 34px;
}
.app-card-body { flex: 1; min-width: 0; }
.app-card-title { font-weight: 800; font-size: 15px; letter-spacing: -0.01em; margin-bottom: 2px; }
.app-card-sub { font-size: 12px; color: var(--ink-soft); line-height: 1.5; }
.app-card-arrow { color: var(--ink-faint); font-size: 18px; }

/* ── CHAPTER (inside view) ── */
.app-view h1 {
  font-size: 28px; font-weight: 900;
  line-height: 1.25; letter-spacing: -0.03em;
  margin: 10px 0 20px;
}
.app-view h2 {
  font-size: 19px; font-weight: 800;
  margin: 64px 0 18px;
  letter-spacing: -0.02em;
  padding-top: 6px;
  position: relative;
}
.app-view h2::before {
  content: '';
  position: absolute;
  top: -18px; left: 0;
  width: 36px; height: 2px;
  background: var(--indigo);
  border-radius: 2px;
}
.app-view .app-kicker {
  font-family: 'Inter', sans-serif;
  font-size: 10px; letter-spacing: 0.25em;
  color: var(--indigo); font-weight: 700;
  text-transform: uppercase;
  margin-bottom: 12px;
}
.app-view p { font-size: 14.5px; line-height: 1.95; margin-bottom: 22px; }
.app-view .lead {
  color: var(--ink-soft);
  font-size: 15px;
  line-height: 2;
  margin-bottom: 52px;
  padding-bottom: 28px;
  border-bottom: 1px solid var(--line-soft);
}
.app-view .kv-table { font-size: 13px; margin: 28px 0 36px; }
.app-view .kv-table th,
.app-view .kv-table td { padding: 14px 14px; }
.app-view .kv-table th { width: 36%; font-size: 12.5px; }
.app-view .callout { margin: 32px 0; padding: 18px 20px; }
.app-view .jean-note { margin: 40px 0; padding: 20px 20px; }
.app-view .jean-note-portrait { width: 54px; height: 54px; }
.app-view .jean-note-portrait svg { width: 48px; height: 48px; }

/* blockの連続する要素どうしにも最低限のリズム */
.app-view h2 + .kv-table,
.app-view h2 + .callout,
.app-view h2 + .jean-note { margin-top: 20px; }

.app-chapter-nav {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 72px;
  padding-top: 32px;
  border-top: 1px solid var(--line);
}
.app-chapter-nav button { padding: 16px 14px; }

/* ── CHAPTER HERO ILLUSTRATION ── */
.app-illust {
  margin: 4px -22px 32px;
  padding: 28px 22px 32px;
  background: linear-gradient(180deg, var(--paper-warm) 0%, transparent 100%);
  display: flex; justify-content: center; align-items: center;
  border-radius: 0 0 28px 28px;
  position: relative;
  overflow: hidden;
}
.app-illust::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 30% 40%, rgba(42,74,127,0.08), transparent 60%),
    repeating-linear-gradient(110deg, transparent 0 26px, rgba(42,74,127,0.04) 26px 27px, transparent 27px 54px);
  pointer-events: none;
}
.app-illust img {
  position: relative;
  height: 180px; width: auto;
  filter: drop-shadow(0 8px 24px rgba(26,42,74,0.18));
}
[data-theme="dark"] .app-illust { background: linear-gradient(180deg, var(--paper-warm) 0%, transparent 100%); }

/* ── ITEMS HUB (category picker) ── */
.app-hub-grid {
  display: flex; flex-direction: column;
  gap: 18px;
  margin: 8px 0 16px;
}
.app-hub-card {
  display: grid;
  grid-template-columns: 96px 1fr 20px;
  gap: 18px;
  align-items: center;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 18px 18px;
  cursor: pointer;
  transition: border-color .18s var(--ease), background .18s var(--ease), transform .1s;
  text-align: left;
  width: 100%;
  font-family: inherit;
  color: inherit;
  position: relative;
  overflow: hidden;
}
.app-hub-card::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, var(--indigo-soft) 0%, transparent 55%);
  opacity: 0;
  transition: opacity .2s var(--ease);
  pointer-events: none;
}
.app-hub-card:hover::before { opacity: 1; }
.app-hub-card:hover { border-color: var(--indigo); }
.app-hub-card:active { transform: scale(0.98); }
.app-hub-illust {
  width: 96px; height: 112px;
  display: flex; align-items: center; justify-content: center;
  background:
    radial-gradient(circle at 30% 30%, rgba(42,74,127,0.1), transparent 60%),
    var(--paper-warm);
  border-radius: 14px;
  position: relative; z-index: 1;
  overflow: hidden;
}
.app-hub-illust::after {
  content: '';
  position: absolute;
  top: 0; bottom: 0; right: 10px;
  width: 1.5px;
  background: var(--selvedge);
  opacity: 0.35;
}
.app-hub-illust img {
  width: 76px; height: 100px;
  object-fit: contain;
  filter: drop-shadow(0 4px 10px rgba(26,42,74,0.2));
}
.app-hub-body { position: relative; z-index: 1; min-width: 0; }
.app-hub-num {
  font-family: 'Inter', sans-serif;
  font-size: 10px; font-weight: 800;
  letter-spacing: 0.25em;
  color: var(--indigo);
  text-transform: uppercase;
  margin-bottom: 4px;
}
.app-hub-name {
  font-size: 18px; font-weight: 800;
  letter-spacing: -0.015em;
  margin-bottom: 4px;
  line-height: 1.3;
}
.app-hub-sub {
  font-size: 12.5px;
  color: var(--ink-soft);
  line-height: 1.6;
}
.app-hub-arrow {
  color: var(--ink-faint);
  font-size: 18px;
  position: relative; z-index: 1;
  transition: transform .18s var(--ease), color .15s;
}
.app-hub-card:hover .app-hub-arrow { color: var(--indigo); transform: translateX(4px); }
.app-chapter-nav button {
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  border-radius: 12px;
  padding: 12px;
  text-align: left;
  font-family: inherit;
  cursor: pointer;
  font-size: 12px;
  transition: background .15s, border-color .15s;
}
.app-chapter-nav button:hover { border-color: var(--indigo); background: var(--paper-warm); }
.app-chapter-nav button .hint {
  display: block;
  font-family: 'Inter', sans-serif;
  font-size: 9.5px;
  letter-spacing: 0.2em;
  color: var(--ink-faint);
  font-weight: 700;
  text-transform: uppercase;
  margin-bottom: 3px;
}
.app-chapter-nav button .ti { font-weight: 700; font-size: 13px; }
.app-chapter-nav .next { text-align: right; }
.app-chapter-nav button:disabled { opacity: 0.4; cursor: not-allowed; }

/* ── Weight slider inside app ── */
.app-view .weight-slider { padding: 18px; }
.app-view .weight-value  { font-size: 28px; }

/* ── Search sheet ── */
.app-search {
  position: fixed; inset: 0;
  z-index: 60;
  background: var(--paper);
  display: none;
  flex-direction: column;
  padding-top: env(safe-area-inset-top);
}
.app-search.open { display: flex; }
.app-search-bar {
  display: flex; gap: 10px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
  align-items: center;
}
.app-search-bar input {
  flex: 1;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  border-radius: 10px;
  padding: 10px 14px;
  font-family: inherit;
  font-size: 14px;
  outline: none;
}
.app-search-bar input:focus { border-color: var(--indigo); }
.app-search-bar button {
  background: none; border: none; color: var(--ink-soft);
  font-size: 14px; cursor: pointer;
  padding: 6px 10px;
}
.app-search-results {
  flex: 1; overflow-y: auto;
  padding: 8px 0;
}
.app-search-item {
  padding: 12px 18px;
  border-bottom: 1px solid var(--line-soft);
  cursor: pointer;
}
.app-search-item:hover { background: var(--paper-warm); }
.app-search-item .sk { font-size: 10px; letter-spacing: 0.2em; color: var(--indigo); font-weight: 700; text-transform: uppercase; }
.app-search-item .sn { font-size: 14px; font-weight: 700; margin-top: 2px; }
.app-search-item .sp { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
.app-search-empty { padding: 40px 24px; text-align: center; color: var(--ink-faint); font-size: 13px; }

/* ── Installed & wider screen ── */
@media (min-width: 720px) {
  .app-root { max-width: 440px; margin: 0 auto; box-shadow: 0 0 40px rgba(0,0,0,0.08); }
  body.app { background: var(--paper-warm); overflow: auto; display: flex; justify-content: center; padding: 20px 0; }
  .app-root { height: min(860px, calc(100dvh - 40px)); border-radius: 24px; overflow: hidden; }
  .app-drawer-panel { border-radius: 0; }
}

/* ── Reduced motion ── */
@media (prefers-reduced-motion: reduce) {
  .app-hero::before, .app-hero-jean, .app-view.fade > * { animation: none !important; }
}
</style>
</head>
<body class="app">

<div class="app-root" id="appRoot">

  <!-- TOP BAR -->
  <header class="app-bar">
    <button class="app-icon-btn" id="openDrawer" aria-label="メニューを開く">☰</button>
    <a href="#" class="app-brand" id="appHome" aria-label="ホームへ">
      <img src="./assets/svg/favicon.svg" alt="">
      <span class="app-brand-name">デニムのジーン<small>A GUIDE TO DENIM</small></span>
    </a>
    <span class="spacer"></span>
    <button class="app-icon-btn" id="openSearch" aria-label="検索">🔍</button>
    <button class="app-icon-btn" id="toggleTheme" aria-label="テーマ切替">☾</button>
    <div class="app-progress" id="appProgress"></div>
  </header>

  <!-- VIEW -->
  <main class="app-view" id="appView" aria-live="polite"></main>

  <!-- BOTTOM NAV -->
  <nav class="app-tabs" aria-label="主要ナビ">
    <button class="app-tab active" data-tab="home" aria-label="ホーム">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a2 2 0 01-2 2h-4v-6h-6v6H5a2 2 0 01-2-2v-9z"/></svg>
      <span>Home</span>
    </button>
    <button class="app-tab" data-tab="history" aria-label="歴史">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span>History</span>

  (function initTheme() {
    const saved = localStorage.getItem(THEME_KEY);
    const dark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
    applyTheme(dark ? 'dark' : 'light');
  })();
  document.getElementById('toggleTheme').addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    localStorage.setItem(THEME_KEY, next);
    applyTheme(next);
  });

  // ─── Progress bar (reading progress inside view) ───
  view.addEventListener('scroll', () => {
    const max = view.scrollHeight - view.clientHeight;
    progress.style.width = max > 0 ? Math.min(100, (view.scrollTop / max) * 100) + '%' : '0%';
  });

  // ─── Render helpers ───
  function esc(s) { return s; /* content is hand-authored */ }
  function renderTable(rows) {
    return `<table class="kv-table">${rows.map(([k,v]) => `<tr><th>${k}</th><td>${v}</td></tr>`).join('')}</table>`;
  }
  function renderCallout(c) {
    return `<div class="callout"><div class="callout-emoji">${c.e}</div><div class="callout-body">${c.t}</div></div>`;
  }
  function renderJean(j) {
    const src = JEAN_SVG[j.img] || JEAN_SVG.normal;
    return `<div class="jean-note">
      <div class="jean-note-portrait"><img src="${src}" alt=""></div>
      <div class="jean-note-body">
        <div class="jean-note-name">JEAN SAYS</div>
        <div class="jean-note-text">${j.text}</div>
      </div>
    </div>`;
  }
  function renderBlock(b) {
    let html = '';
    if (b.h)     html += `<h2>${b.h}</h2>`;
    if (b.p)     html += b.p.map(p => `<p>${p}</p>`).join('');
    if (b.table) html += renderTable(b.table);
    if (b.callout) html += renderCallout(b.callout);
    if (b.html)  html += b.html;
    if (b.jean)  html += renderJean(b.jean);
    return html;
  }

  function renderHome() {
    // ハブ章の子は家では伏せて、ハブ章自体だけを見せる
    const hubChildren = new Set();
    CHAPTERS.forEach(c => { if (c.hub) c.hub.forEach(h => hubChildren.add(h.key)); });
    const list = CHAPTERS
      .filter(c => c.key !== 'home' && !hubChildren.has(c.key))
      .map(c => `
      <button class="app-card" data-go="${c.key}">
        <div class="app-card-num">${c.num}</div>
        <div class="app-card-body">
          <div class="app-card-title">${c.title}</div>
          <div class="app-card-sub">${c.sub}</div>
        </div>
        <div class="app-card-arrow">→</div>
      </button>
    `).join('');
    return `
      <div class="app-hero">
        <div class="app-hero-inner">
          <div class="app-hero-eyebrow">A QUIET GUIDE · No.01</div>
          <div class="app-hero-title">デニムの、<br><span class="selvedge">ジーン。</span></div>
          <div class="app-hero-lead">歴史も、素材も、着こなしも。<br>片手で、本を開く速さで。</div>
        </div>
        <img class="app-hero-jean" src="./assets/svg/jean-happy.svg" alt="">
      </div>
      <div class="app-home-section">
        <div class="app-home-section-title">— Chapters</div>
        <div class="app-card-list">${list}</div>
      </div>
    `;
  }

  function renderHub(c) {
    const cards = c.hub.map(h => `
      <button class="app-hub-card" data-go="${h.key}">
        <div class="app-hub-illust"><img src="${h.svg}" alt=""></div>
        <div class="app-hub-body">
          <div class="app-hub-num">Chapter ${h.num}</div>
          <div class="app-hub-name">${h.name}</div>
          <div class="app-hub-sub">${h.sub}</div>
        </div>
        <div class="app-hub-arrow">→</div>
      </button>
    `).join('');
    return `
      <div class="app-kicker">Chapter ${c.num}</div>
      <h1>${c.title}</h1>
      <p class="lead">${c.lead}</p>
      <div class="app-hub-grid">${cards}</div>
    `;
  }

  function renderChapter(c) {
    if (c.hub) return renderHub(c);
    const idx = CHAPTERS.findIndex(x => x.key === c.key);
    // Prev/Nextはhub章をスキップ（連続する中身だけで回す）
    const readable = CHAPTERS.filter(x => x.key !== 'home' && !x.hub);
    const rIdx = readable.findIndex(x => x.key === c.key);
    const prev = readable[rIdx - 1];
    const next = readable[rIdx + 1];
    const illust = c.illust ? `<div class="app-illust"><img src="${c.illust}" alt=""></div>` : '';
    const body = c.blocks.map(renderBlock).join('');
    return `
      <div class="app-kicker">Chapter ${c.num}</div>
      <h1>${c.title}</h1>
      ${illust}
      <p class="lead">${c.lead}</p>
      ${body}
      <div class="app-chapter-nav">
        <button ${prev ? `data-go="${prev.key}"` : 'disabled'}>
          <span class="hint">← Prev</span>
          <span class="ti">${prev ? prev.title.split(' / ').pop() : '—'}</span>
        </button>
        <button class="next" ${next ? `data-go="${next.key}"` : 'disabled'}>
          <span class="hint">Next →</span>
          <span class="ti">${next ? next.title.split(' / ').pop() : '完'}</span>
        </button>
      </div>
    `;
  }

  // ─── Weight slider (hook after render) ───
  function setupWeightSlider() {
    const sl = document.getElementById('weightSlider');
    if (!sl) return;
    const val = document.getElementById('weightValue');
    const cat = document.getElementById('weightFabric');
    const info = [
      { max:  8,   name: '薄手（サマーウェイト）', desc: '初夏〜夏向け。軽く涼しい。シャツや薄手ジーンズに' },
      { max: 11,   name: 'ミッドライト',           desc: 'オールシーズン。色落ちは比較的ゆっくり' },
      { max: 13.5, name: 'レギュラーウェイト',     desc: 'スタンダード。多くのジーンズがこの帯' },
      { max: 15,   name: 'ヘビーウェイト',         desc: '厚手でしっかり。色落ちが深い' },
      { max: 17,   name: 'セルヴィッジ定番',       desc: '13.5〜16ozの本格デニム。耳付きの多くがこの帯' },
      { max: 99,   name: 'スーパーヘビー',         desc: '17oz以上の超厚手。変化が劇的' },
    ];
    function update() {
      const oz = parseFloat(sl.value);
      val.textContent = oz.toFixed(1) + ' oz';
      const row = info.find(x => oz <= x.max) || info[info.length - 1];
      cat.innerHTML = `<strong>${row.name}</strong><br>${row.desc}`;
    }
    sl.addEventListener('input', update);
    update();
  }

  // ─── Router ───
  function go(key) {
    const c = CHAPTERS.find(x => x.key === key);
    if (!c) return;
    currentKey = key;
    view.classList.remove('fade');
    void view.offsetWidth;   // reflow
    view.classList.add('fade');
    view.innerHTML = (key === 'home') ? renderHome() : renderChapter(c);
    view.scrollTop = 0;
    progress.style.width = '0%';
    setupWeightSlider();
    updateTabs();
    updateDrawerActive();
    location.hash = key === 'home' ? '' : ('#' + key);
  }

  function updateTabs() {
    const c = CHAPTERS.find(x => x.key === currentKey);
    const tabKey = c ? c.tab : 'home';
    document.querySelectorAll('.app-tab').forEach(t => {
      t.classList.toggle('active', t.dataset.tab === tabKey);
    });
  }

  // ─── Tab bar ───
  document.querySelectorAll('.app-tab').forEach(t => {
    t.addEventListener('click', () => {
      const k = t.dataset.tab;
      // tab → first chapter of that group
      const c = CHAPTERS.find(x => x.tab === k && x.key !== 'home') || CHAPTERS.find(x => x.key === k);
      if (k === 'home') go('home'); else if (c) go(c.key);
    });
  });

  document.getElementById('appHome').addEventListener('click', (e) => {
    e.preventDefault();
    go('home');
  });

  // ─── Delegation: any data-go → navigate ───
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-go]');
    if (el) { e.preventDefault(); go(el.dataset.go); closeDrawer(); }
  });

  // ─── Drawer ───
  const drawer = document.getElementById('drawer');
  const drawerList = document.getElementById('drawerList');

  function buildDrawer() {
    const groups = [
      { k: 'home',       label: 'はじめに',         num: '00', children: [] },
      { k: 'history',    label: 'History / 歴史',   num: '01', children: [] },
      { k: 'material_hub', label: 'Material / 素材',   num: '02', children: ['weight','weave','indigo'] },
      { k: 'items_hub',  label: 'Items / アイテム',  num: '03', children: ['jeans','shirts','jackets'] },
      { k: 'makers',     label: 'Makers / メーカー', num: '04', children: [] },
      { k: 'styling',    label: 'Styling / 着こなし', num: '05', children: [] },
      { k: 'glossary',   label: 'Glossary / 用語集',  num: '06', children: [] },
    ];
    drawerList.innerHTML = groups.map(g => {
      let h = '';
      if (g.k) {
        h += `<div class="app-drawer-item" data-go="${g.k}"><span class="n">${g.num}</span><span class="t">${g.label}</span></div>`;
      } else {
        h += `<div class="app-drawer-item" style="cursor:default;"><span class="n">${g.num}</span><span class="t">${g.label}</span></div>`;
      }
      (g.children || []).forEach(cKey => {
        const c = CHAPTERS.find(x => x.key === cKey);
        if (c) h += `<div class="app-drawer-sub" data-go="${cKey}">— ${c.title.replace(/^.+ \/ /,'')}</div>`;
      });
      return h;
    }).join('');
  }
  buildDrawer();

  function updateDrawerActive() {
    drawerList.querySelectorAll('[data-go]').forEach(el => {
      el.classList.toggle('on', el.dataset.go === currentKey);
    });
  }

  function openDrawer() { drawer.classList.add('open'); }
  function closeDrawer() { drawer.classList.remove('open'); }

  document.getElementById('openDrawer').addEventListener('click', openDrawer);
  drawer.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', closeDrawer));

  // ─── Search ───
  const searchSheet = document.getElementById('searchSheet');
  const searchInput = document.getElementById('searchInput');
  const searchResults = document.getElementById('searchResults');

  function openSearch() {
    searchSheet.classList.add('open');
    setTimeout(() => searchInput.focus(), 50);
    renderSearch('');
  }
  function closeSearchSheet() {
    searchSheet.classList.remove('open');
    searchInput.value = '';
  }
  document.getElementById('openSearch').addEventListener('click', openSearch);
  document.getElementById('closeSearch').addEventListener('click', closeSearchSheet);

  function collectIndex() {
    const idx = [];
    CHAPTERS.forEach(c => {
      if (c.key === 'home') return;
      idx.push({ key: c.key, section: c.title, term: c.title, body: c.sub, head: true });
      (c.blocks || []).forEach(b => {
        if (b.h) idx.push({ key: c.key, section: c.title, term: b.h, body: (b.p || []).join(' ').replace(/<[^>]+>/g,'').slice(0, 80) });
        (b.table || []).forEach(([k,v]) => idx.push({ key: c.key, section: c.title, term: k, body: v.replace(/<[^>]+>/g,'') }));
      });
    });
    return idx;
  }
  const SEARCH_INDEX = collectIndex();

  function renderSearch(q) {
    q = q.trim();
    if (!q) {
      searchResults.innerHTML = `<div class="app-search-empty">章名・用語・人名などで検索<br>（例：セルヴィッジ、501、児島）</div>`;
      return;
    }
    const lc = q.toLowerCase();
    const hits = SEARCH_INDEX.filter(i =>
      (i.term + ' ' + i.body + ' ' + i.section).toLowerCase().includes(lc)
    ).slice(0, 40);
    if (!hits.length) {
      searchResults.innerHTML = `<div class="app-search-empty">一致なし</div>`;
      return;
    }
    searchResults.innerHTML = hits.map(h => `
      <div class="app-search-item" data-go="${h.key}">
        <div class="sk">${h.section}</div>
        <div class="sn">${h.term}</div>
        <div class="sp">${h.body || ''}</div>
      </div>
    `).join('');
  }
  searchInput.addEventListener('input', (e) => renderSearch(e.target.value));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && searchSheet.classList.contains('open')) closeSearchSheet();
  });

  // Close search on nav
  searchResults.addEventListener('click', () => closeSearchSheet());

  // ─── Boot ───
  function boot() {
    const key = location.hash.replace('#','') || 'home';
    go(CHAPTERS.find(c => c.key === key) ? key : 'home');
  }
  window.addEventListener('hashchange', boot);
  boot();

  // Dynamic viewport height (mobile URL bar)
  function setVH() {
    document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px');
  }
  setVH();
  window.addEventListener('resize', setVH);
})();
</script>

</body>
</html>
