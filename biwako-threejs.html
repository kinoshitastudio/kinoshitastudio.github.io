<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,follow">
<title>BIWAKO — Three.js</title>
<style>
* { margin:0; padding:0; }
body { overflow:hidden; background:#000; }
</style>
<script type="importmap">
{
  "imports": {
    "three":           "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
    "three/addons/":   "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE           from 'three';
import { Water }            from 'three/addons/objects/Water.js';
import { Sky }              from 'three/addons/objects/Sky.js';
import { EffectComposer }   from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }       from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass }  from 'three/addons/postprocessing/UnrealBloomPass.js';

// ── Renderer ────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.48;
document.body.appendChild(renderer.domElement);

// ── Scene ────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x06101e, 0.00055);

// ── Camera ───────────────────────────────────────────────────────
const W = window.innerWidth, H = window.innerHeight;
const camera = new THREE.PerspectiveCamera(58, W / H, 0.1, 20000);
camera.position.set(0, 17, 125);
camera.lookAt(0, 3, -50);

// ── Sky ─────────────────────────────────────────────────────────
const sky = new Sky();
sky.scale.setScalar(10000);
scene.add(sky);
const skyU = sky.material.uniforms;
skyU['turbidity'].value       = 5.5;
skyU['rayleigh'].value        = 1.1;
skyU['mieCoefficient'].value  = 0.006;
skyU['mieDirectionalG'].value = 0.82;

// Sun direction — low on horizon = sunrise
const sun = new THREE.Vector3();
sun.setFromSphericalCoords(
  1,
  THREE.MathUtils.degToRad(90 - 3.8),  // 3.8° elevation
  THREE.MathUtils.degToRad(162)          // azimuth
);
skyU['sunPosition'].value.copy(sun);

// ── Water ───────────────────────────────────────────────────────
const water = new Water(new THREE.PlaneGeometry(10000, 10000), {
  textureWidth:   512,
  textureHeight:  512,
  waterNormals: new THREE.TextureLoader().load(
    'https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/waternormals.jpg',
    t => { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
  ),
  sunDirection:   sun.clone().normalize(),
  sunColor:       0xffe8cc,
  waterColor:     0x001528,
  distortionScale: 4.2,
  fog: false,
});
water.rotation.x = -Math.PI / 2;
scene.add(water);

// ── Mountains ───────────────────────────────────────────────────
function makePeak(x, z, h, r) {
  const geo = new THREE.ConeGeometry(r, h, 9, 3);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const t = (pos.getY(i) + h * .5) / h; // 0=base 1=peak
    const v = r * .28 * (1 - t * t);
    if (t < .88) {
      pos.setX(i, pos.getX(i) + (Math.random() - .5) * v);
      pos.setZ(i, pos.getZ(i) + (Math.random() - .5) * v);
    }
  }
  geo.computeVertexNormals();
  const mat = new THREE.MeshLambertMaterial({ color: 0x04080e, fog: true });
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, h * .5 - .5, z);
  return m;
}
[
  [-145, -230, 92, 68], [  18, -270, 125, 88], [ 160, -245, 82, 62],
  [ -65, -315, 108, 78], [ 228, -295, 72, 55], [-258, -285, 78, 60],
  [  95, -330, 98, 74],  [ -30, -200, 60, 45], [ 280, -250, 65, 50],
].forEach(([x,z,h,r]) => scene.add(makePeak(x,z,h,r)));

// ── Lighting ─────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x182540, 3));
const sunLight = new THREE.DirectionalLight(0xff9040, 4);
sunLight.position.set(-90, 35, -210);
scene.add(sunLight);
scene.add(new THREE.HemisphereLight(0x3060a0, 0x00101e, 1));

// ── Fish geometry ────────────────────────────────────────────────
function buildFish() {
  const g = new THREE.Group();

  // Body: LatheGeometry (profile radius vs height, swept around Y)
  const profile = [
    new THREE.Vector2(.02, 2.25),
    new THREE.Vector2(.30, 1.85),
    new THREE.Vector2(.58, 1.25),
    new THREE.Vector2(.82, .45),
    new THREE.Vector2(.78, -.25),
    new THREE.Vector2(.62, -.95),
    new THREE.Vector2(.42, -1.55),
    new THREE.Vector2(.22, -1.95),
    new THREE.Vector2(.02, -2.20),
  ];
  const bodyGeo = new THREE.LatheGeometry(profile, 14);
  bodyGeo.rotateZ(-Math.PI / 2); // swim along +X

  const bodyMat = new THREE.MeshPhysicalMaterial({
    color: 0x1c4e78,
    metalness: .32,
    roughness: .32,
    iridescence: .92,
    iridescenceIOR: 1.85,
    iridescenceThicknessRange: [80, 380],
  });
  g.add(new THREE.Mesh(bodyGeo, bodyMat));

  const finMat = new THREE.MeshLambertMaterial({ color: 0x0a1c30, side: THREE.DoubleSide });

  // Forked tail
  for (const s of [1, -1]) {
    const verts = new Float32Array([
       .0, s*.05,  .0,
      -1.55, s*.52,  .0,
      -1.58, s*.08,  .0,
    ]);
    const tg = new THREE.BufferGeometry();
    tg.setAttribute('position', new THREE.BufferAttribute(verts, 3));
    tg.computeVertexNormals();
    g.add(new THREE.Mesh(tg, finMat));
  }

  // Dorsal fin
  const dv = new Float32Array([
    -.30, .80, .0,
     .62, .80, .0,
     .08, 1.75, .0,
  ]);
  const dg = new THREE.BufferGeometry();
  dg.setAttribute('position', new THREE.BufferAttribute(dv, 3));
  dg.computeVertexNormals();
  g.add(new THREE.Mesh(dg, finMat));

  // Pectoral fin
  const pv = new Float32Array([
    .28, .05, .0,
    .28, .05, -.02,
    .02, -.55, .55,
  ]);
  const pg = new THREE.BufferGeometry();
  pg.setAttribute('position', new THREE.BufferAttribute(pv, 3));
  pg.computeVertexNormals();
  g.add(new THREE.Mesh(pg, finMat));

  g.scale.setScalar(.85 + Math.random() * .55);
  return g;
}

// ── Fish entity ───────────────────────────────────────────────────
class FishEnt {
  constructor(delay) {
    this.mesh  = buildFish();
    this.mesh.visible = false;
    scene.add(this.mesh);
    this.state = 'wait';
    this.timer = delay;
    this.vx = this.vy = this.vz = 0;
    this.didExit = this.didEntry = false;
    this._up = new THREE.Vector3(0, 1, 0);
    this._vel = new THREE.Vector3();
    this._q   = new THREE.Quaternion();
    this._xAxis = new THREE.Vector3(1, 0, 0);
  }

  launch() {
    const side = Math.random() > .5 ? 1 : -1;
    this.mesh.position.set(
      (Math.random() - .5) * 90,
      .1,
      (Math.random() - .5) * 35 - 8
    );
    this.vx = side * (1.8 + Math.random() * 2.8);
    this.vy = 7.5 + Math.random() * 7;
    this.vz = (Math.random() - .5) * .8;
    this.mesh.visible = true;
    this.state = 'air';
    this.didExit = this.didEntry = false;
  }

  update(dt) {
    if (this.state === 'wait') {
      this.timer -= dt * 60;
      if (this.timer <= 0) this.launch();
      return;
    }

    this.vy -= .21;
    const scale = dt * 60 * .115;
    this.mesh.position.x += this.vx * scale;
    this.mesh.position.y += this.vy * scale;
    this.mesh.position.z += this.vz * scale;

    // Orient along velocity
    this._vel.set(this.vx, this.vy, this.vz).normalize();
    this._q.setFromUnitVectors(this._xAxis, this._vel);
    this.mesh.setRotationFromQuaternion(this._q);

    if (!this.didExit && this.mesh.position.y > .8) {
      this.didExit = true;
      spawnSplash(this.mesh.position.x, this.mesh.position.z, .9);
    }

    if (this.mesh.position.y <= 0) {
      if (!this.didEntry) {
        this.didEntry = true;
        spawnSplash(this.mesh.position.x, this.mesh.position.z, 1.3);
      }
      this.mesh.visible = false;
      this.state = 'wait';
      this.timer = Math.random() * 340 + 110;
    }
  }
}

// ── Person entity (rare emergence) ───────────────────────────────
class PersonEnt {
  constructor() {
    this.g = this._build();
    this.g.visible = false;
    scene.add(this.g);
    this.state = 'wait';
    this.timer = 600 + Math.random() * 900;
    this.vy = 0; this.splashed = false;
  }

  _build() {
    const g = new THREE.Group();
    const mat = new THREE.MeshLambertMaterial({ color: 0x0e1e32 });

    // Head
    const head = new THREE.Mesh(new THREE.SphereGeometry(.9, 8, 8), mat);
    head.position.y = 4.2;
    g.add(head);

    // Torso
    const torso = new THREE.Mesh(new THREE.CylinderGeometry(.55, .7, 2.2, 7), mat);
    torso.position.y = 2.5;
    g.add(torso);

    // Arms (raised)
    for (const s of [-1, 1]) {
      const arm = new THREE.Mesh(new THREE.CylinderGeometry(.22, .18, 2.2, 5), mat);
      arm.position.set(s * 1.0, 3.5, 0);
      arm.rotation.z = s * -1.1;
      g.add(arm);
    }
    return g;
  }

  launch() {
    this.g.position.set(
      (Math.random() - .5) * 60,
      .1,
      (Math.random() - .5) * 25 - 5
    );
    this.vy = 13 + Math.random() * 5;
    this.state = 'air';
    this.g.visible = true;
    this.splashed = false;
  }

  update(dt) {
    if (this.state === 'wait') {
      this.timer -= dt * 60;
      if (this.timer <= 0) this.launch();
      return;
    }
    this.vy -= .18;
    this.g.position.y += this.vy * dt * 60 * .115;

    if (!this.splashed && this.g.position.y > 1) {
      this.splashed = true;
      spawnSplash(this.g.position.x, this.g.position.z, 1.2);
    }

    if (this.g.position.y <= 0) {
      spawnSplash(this.g.position.x, this.g.position.z, 1.6);
      this.g.visible = false;
      this.state = 'wait';
      this.timer = 700 + Math.random() * 1100;
    }
  }
}

// ── Splash particles ──────────────────────────────────────────────
const PMAX = 500;
const pPos = new Float32Array(PMAX * 3).fill(-9999);
const pVel = Array.from({length: PMAX}, () => [0,0,0]);
const pLife = new Float32Array(PMAX);
const pActv = new Uint8Array(PMAX);
let   pPtr  = 0;

const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
const pMat = new THREE.PointsMaterial({
  color: 0x80c8e8, size: .35, transparent: true, opacity: .8, sizeAttenuation: true,
});
scene.add(new THREE.Points(pGeo, pMat));

function spawnSplash(x, z, strength) {
  const n = Math.floor(28 * strength);
  for (let i = 0; i < n; i++) {
    const idx = pPtr % PMAX; pPtr++;
    pPos[idx*3]   = x + (Math.random()-.5) * 1.8;
    pPos[idx*3+1] = .1;
    pPos[idx*3+2] = z + (Math.random()-.5) * 1.8;
    pVel[idx] = [
      (Math.random()-.5) * 3.8 * strength,
      (Math.random() * 4.5 + 1.5) * strength,
      (Math.random()-.5) * 3.8 * strength,
    ];
    pLife[idx] = 1.0;
    pActv[idx] = 1;
  }
}

function tickParticles(dt) {
  const s = dt * 60 * .09;
  for (let i = 0; i < PMAX; i++) {
    if (!pActv[i]) { pPos[i*3+1] = -9999; continue; }
    pVel[i][1] -= .16;
    pPos[i*3]   += pVel[i][0] * s;
    pPos[i*3+1] += pVel[i][1] * s;
    pPos[i*3+2] += pVel[i][2] * s;
    pVel[i][0]  *= .97;
    pVel[i][2]  *= .97;
    pLife[i] -= dt * 1.1;
    if (pLife[i] <= 0 || pPos[i*3+1] < 0) { pActv[i] = 0; pPos[i*3+1] = -9999; }
  }
  pGeo.attributes.position.needsUpdate = true;
}

// ── Entities ──────────────────────────────────────────────────────
const fishes  = [0,120,240,360,480,590].map(d => new FishEnt(d));
const persons = [new PersonEnt()];

// ── Post-processing ───────────────────────────────────────────────
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.52, .42, .80  // strength, radius, threshold
));

// ── Loop ─────────────────────────────────────────────────────────
const clock = new THREE.Clock();
(function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .05);

  water.material.uniforms['time'].value += dt * .42;

  fishes.forEach(f  => f.update(dt));
  persons.forEach(p => p.update(dt));
  tickParticles(dt);

  composer.render();
})();

// ── Resize ───────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
