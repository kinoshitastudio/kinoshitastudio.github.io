<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex,follow">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Remix — concepts, interwoven</title>
<meta name="description" content="概念を重み付きで混ぜて、両義的な抽象アートを作る。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500&family=Space+Mono&display=swap" rel="stylesheet" />
<style>
  :root{ --paper:#f4f3ee; --ink:#16150f; --faint:#8a877d; --line:rgba(22,21,15,.13); --card:#fff; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:'Zen Kaku Gothic New',system-ui,sans-serif;font-weight:300;
    -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:0 1.2rem 5rem}
  .mono{font-family:'Space Mono',ui-monospace,monospace}

  header{text-align:center;padding:3rem 0 1.4rem}
  .title{font-size:1.45rem;letter-spacing:.42em;font-weight:400;padding-left:.42em}
  .sub{font-family:'Space Mono',monospace;font-size:.56rem;letter-spacing:.26em;color:var(--faint);text-transform:uppercase;margin-top:.85rem}

  .layout{display:flex;gap:2.4rem;width:min(900px,94vw);align-items:flex-start;flex-wrap:wrap;justify-content:center}

  /* ── stage ── */
  .stage{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:1rem}
  .frame{width:min(380px,84vw);aspect-ratio:1;background:#eceae3;border:1px solid var(--line);
    box-shadow:0 1px 2px rgba(0,0,0,.05),0 30px 60px rgba(22,21,15,.13);overflow:hidden;position:relative}
  .frame canvas{width:100%;height:100%;display:block}
  .frame .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-size:.8rem;text-align:center;padding:2rem;line-height:2}
  .frame .loading{position:absolute;inset:0;z-index:3;display:grid;place-items:center;background:rgba(236,234,227,.86);
    font-family:'Space Mono',monospace;font-size:.6rem;letter-spacing:.22em;color:var(--ink);
    opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
  .frame.is-loading .loading{opacity:1;visibility:visible;animation:breathe 1.7s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
  .caption{font-family:'Space Mono',monospace;font-size:.64rem;letter-spacing:.04em;color:var(--faint);max-width:380px;text-align:center;min-height:1.1em;line-height:1.7}

  /* ── controls ── */
  .panel{flex:1 1 320px;min-width:280px;max-width:420px}
  .panel h2{font-family:'Space Mono',monospace;font-size:.56rem;letter-spacing:.22em;color:var(--faint);text-transform:uppercase;margin-bottom:.9rem}

  .concepts{display:flex;flex-direction:column;gap:.5rem;margin-bottom:1rem}
  .chip{background:var(--card);border:1px solid var(--line);padding:.55rem .7rem;display:flex;align-items:center;gap:.6rem}
  .chip .nm{flex:0 0 auto;font-size:.9rem;min-width:4.2em}
  .chip input[type=range]{flex:1;-webkit-appearance:none;height:2px;background:var(--line);outline:none;cursor:pointer}
  .chip input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--ink);cursor:pointer}
  .chip .wt{font-family:'Space Mono',monospace;font-size:.6rem;color:var(--faint);width:2.4em;text-align:right}
  .chip .rm{border:0;background:none;color:var(--faint);cursor:pointer;font-size:1rem;line-height:1}
  .chip .rm:hover{color:var(--ink)}
  .concepts .empty{color:var(--faint);font-size:.78rem;padding:.4rem 0;line-height:1.8}

  .addrow{display:flex;gap:.5rem;border-bottom:1px solid var(--line);padding:.45rem .1rem;margin-bottom:1.4rem}
  .addrow input{flex:1;border:0;outline:0;background:transparent;color:var(--ink);font-family:inherit;font-weight:300;font-size:.92rem}
  .addrow input::placeholder{color:var(--faint)}
  .addrow button{border:0;background:none;cursor:pointer;color:var(--faint);font-family:'Space Mono',monospace;font-size:.72rem}
  .addrow button:hover{color:var(--ink)}

  .modes{display:flex;gap:.4rem;margin-bottom:1.3rem}
  .modes button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--faint);font-family:'Space Mono',monospace;
    font-size:.62rem;letter-spacing:.08em;padding:.55rem;cursor:pointer;transition:.18s}
  .modes button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  .gen{width:100%;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-family:'Space Mono',monospace;
    font-size:.78rem;letter-spacing:.12em;padding:.85rem;cursor:pointer;transition:opacity .18s}
  .gen:hover{opacity:.82}
  .gen:disabled{opacity:.4;cursor:default}
  .basebar{font-family:'Space Mono',monospace;font-size:.58rem;color:var(--faint);margin:.7rem 0 0;display:none;align-items:center;gap:.5rem}
  .basebar.on{display:flex}
  .basebar button{border:0;background:none;color:var(--faint);cursor:pointer;text-decoration:underline}

  /* ── reference grid ── */
  .refs-wrap{width:min(900px,94vw);margin-top:3rem}
  .refs-label{font-family:'Space Mono',monospace;font-size:.55rem;letter-spacing:.22em;color:var(--faint);text-transform:uppercase;
    border-top:1px solid var(--line);padding-top:1.3rem;margin-bottom:1.1rem}
  .refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:.7rem}
  .ref{cursor:pointer;border:1px solid var(--line);background:#eceae3;aspect-ratio:1;overflow:hidden;position:relative;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
  .ref:hover{transform:translateY(-3px)}
  .ref::after{content:"";position:absolute;inset:0;z-index:0;
    background:linear-gradient(100deg,#e9e7e0 30%,#f4f3ee 50%,#e9e7e0 70%);background-size:220% 100%;animation:sh 1.7s linear infinite}
  @keyframes sh{0%{background-position:220% 0}100%{background-position:-220% 0}}
  .ref img{position:relative;z-index:1;width:100%;height:100%;display:block;object-fit:cover;filter:saturate(.92)}
  .ref .lb{position:absolute;left:0;right:0;bottom:0;z-index:2;background:linear-gradient(transparent,rgba(0,0,0,.5));color:#fff;
    font-size:.66rem;padding:.5rem .4rem .3rem;letter-spacing:.04em}
  .ref.added{outline:3px solid var(--ink);outline-offset:-3px}
  .ref.added::before{content:"✓";position:absolute;z-index:3;top:.4rem;right:.4rem;width:1.5rem;height:1.5rem;border-radius:50%;
    background:var(--ink);color:var(--paper);font-family:'Space Mono',monospace;font-size:.8rem;display:grid;place-items:center}
  .ref.added img{filter:saturate(.92) brightness(.82)}

  #toast{position:fixed;left:50%;bottom:2rem;transform:translateX(-50%) translateY(1rem);background:var(--ink);color:var(--paper);
    font-family:'Space Mono',monospace;font-size:.72rem;letter-spacing:.05em;padding:.65rem 1.1rem;border-radius:7px;
    opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ── gallery ── */
  .gallery-wrap{width:min(900px,94vw);margin-top:3rem}
  .gallery-label{font-family:'Space Mono',monospace;font-size:.55rem;letter-spacing:.22em;color:var(--faint);text-transform:uppercase;
    border-top:1px solid var(--line);padding-top:1.3rem;margin-bottom:1.1rem;display:flex;justify-content:space-between;align-items:center}
  .gallery-label button{border:0;background:none;color:var(--faint);font-family:inherit;font-size:.55rem;letter-spacing:.16em;cursor:pointer}
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:.7rem}
  .g-item{cursor:pointer;border:1px solid var(--line);background:#eceae3;aspect-ratio:1;overflow:hidden;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
  .g-item:hover{transform:translateY(-3px)}
  .g-item img{width:100%;height:100%;display:block;object-fit:cover}
  .g-empty{color:var(--faint);font-size:.78rem;grid-column:1/-1;padding:1rem 0}

  footer{margin-top:4rem;font-family:'Space Mono',monospace;font-size:.52rem;letter-spacing:.16em;color:var(--faint)}
  footer a{color:var(--faint)}
</style>
</head>
<body>
  <header>
    <h1 class="title">Remix</h1>
    <p class="sub">concepts, interwoven — kinoshita studio</p>
  </header>

  <div class="layout">
    <div class="stage">
      <div class="frame" id="frame">
        <canvas id="cv" width="512" height="512"></canvas>
        <div class="ph" id="ph">概念を 2 つ以上足して、<br>Remix する。</div>
        <div class="loading" id="loading">混ぜている…</div>
      </div>
      <p class="caption" id="capOut"></p>
    </div>

    <div class="panel">
      <h2>Concepts &mdash; 重みで混ぜる</h2>
      <div class="concepts" id="concepts"></div>
      <div class="addrow">
        <input id="addInput" type="text" placeholder="概念を入力…  (例: 海 / fire / 静寂)" autocomplete="off" />
        <button id="addBtn" class="mono">+ 足す</button>
      </div>

      <div class="modes">
        <button data-mode="fuse" class="on">融合 / fuse</button>
        <button data-mode="layer">重ね / layer</button>
      </div>

      <button class="gen mono" id="gen">REMIX ⏎</button>
      <div class="basebar" id="basebar"><span id="baseLabel"></span><button id="baseClear">種画像を外す</button></div>
    </div>
  </div>

  <div class="refs-wrap">
    <div class="refs-label">— Add concepts from below / 参考から足す</div>
    <div class="refs" id="refs"></div>
  </div>

  <div class="gallery-wrap">
    <div class="gallery-label"><span>— Remixed / 過去作（クリックで種画像に）</span><button id="clear">clear</button></div>
    <div class="gallery" id="gallery"></div>
  </div>

  <div id="toast"></div>
  <footer>made by <a href="https://kinoshita.studio/">kinoshita studio</a> · Shiga, Japan</footer>

<script>
(function(){
  "use strict";
  const KEY = "remix-gallery";
  const STYLE = ", contemporary abstract generative art, bold graphic composition, high quality, no text, no watermark";
  const W = 512, H = 512;

  // ── deterministic hash (seed) ──
  function hashStr(s){ let h=2166136261>>>0; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }

  // ── Pollinations (free / keyless) ──
  function pollURL(prompt, size){
    size = size || W;
    return "https://image.pollinations.ai/prompt/" + encodeURIComponent(prompt) +
      "?width=" + size + "&height=" + size + "&seed=" + hashStr(prompt.toLowerCase()) + "&nologo=true";
  }
  function loadPoll(prompt, size, tries){
    tries = tries || 3;
    return new Promise((res,rej)=>{
      let left = tries;
      (function go(){
        const img = new Image(); img.crossOrigin = "anonymous";
        const to = setTimeout(fail, 20000);
        function ok(){ clearTimeout(to); res(img); }
        function fail(){ clearTimeout(to); if(--left>0) setTimeout(go,700); else rej(new Error("fail")); }
        img.onload = ok; img.onerror = fail; img.src = pollURL(prompt, size);
      })();
    });
  }

  // ── state ──
  let concepts = [];           // {id,label,text,w}
  let mode = "fuse";
  let baseImg = null, baseLabel = "";
  let genId = 0, nextId = 1;

  const $ = id => document.getElementById(id);
  const ctx = $("cv").getContext("2d");

  // ── prompts ──
  function fusePrompt(cs){
    const sorted = [...cs].sort((a,b)=>b.w-a.w);
    let s = (sorted[0].w>=0.7 ? "predominantly " : "") + sorted[0].text;
    for(let i=1;i<sorted.length;i++){
      const c = sorted[i];
      s += (c.w<0.35 ? ", with a faint trace of " : ", blended with ") + c.text;
    }
    return s + STYLE;
  }
  const conceptPrompt = t => t + STYLE;

  // ── render ──
  function drawSmooth(img){
    ctx.imageSmoothingEnabled = true;
    const dur = 900, t0 = performance.now(), my = genId;
    (function tick(now){
      if(my!==genId) return;
      const p = Math.min(1,(now-t0)/dur), e = p*p*(3-2*p);
      ctx.clearRect(0,0,W,H);
      ctx.fillStyle = "#eceae3"; ctx.fillRect(0,0,W,H);
      ctx.globalAlpha = e; ctx.drawImage(img,0,0,W,H); ctx.globalAlpha = 1;
      if(p<1) requestAnimationFrame(tick);
    })(t0);
  }
  function compositeLayers(cs, imgs){
    ctx.imageSmoothingEnabled = true;
    ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
    ctx.fillStyle = "#efede6"; ctx.fillRect(0,0,W,H);
    if(baseImg){ ctx.globalAlpha = 0.55; ctx.drawImage(baseImg,0,0,W,H); }
    const total = cs.reduce((s,c)=>s+c.w,0) || 1;
    imgs.forEach((img,i)=>{
      if(!img) return;
      ctx.globalAlpha = Math.max(0.2, cs[i].w/total);
      ctx.globalCompositeOperation = (i===0 && !baseImg) ? "source-over" : "multiply";
      ctx.drawImage(img,0,0,W,H);
    });
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  }

  function setLoading(on){ $("frame").classList.toggle("is-loading", on); $("ph").style.display = on ? "none" : ($("cv").dataset.drawn ? "none":"grid"); }

  // ── generate ──
  async function generate(){
    const cs = concepts.filter(c=>c.text.trim());
    if(cs.length < 1){ return; }
    const my = ++genId;
    $("ph").style.display = "none";
    setLoading(true);
    $("gen").disabled = true;
    const labelTxt = cs.map(c=>c.label+"·"+c.w.toFixed(2)).join("  +  ") + "   [" + mode + "]";
    $("capOut").textContent = labelTxt;

    try{
      if(mode === "fuse"){
        const img = await loadPoll(fusePrompt(cs), W);
        if(my!==genId) return;
        drawSmooth(img);
      } else {
        const imgs = await Promise.all(cs.map(c=>loadPoll(conceptPrompt(c.text), W).catch(()=>null)));
        if(my!==genId) return;
        if(!imgs.some(Boolean)) throw new Error("all fail");
        compositeLayers(cs, imgs);
      }
      $("cv").dataset.drawn = "1";
      saveGallery(cs, mode);
    }catch(e){
      if(my===genId) $("capOut").textContent = "混ざらなかった… もう一度 Remix を。";
    }finally{
      if(my===genId){ setLoading(false); $("gen").disabled = false; }
    }
  }

  // ── toast ──
  let toastT;
  function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),1500); }

  // ── concepts UI ──
  function addConcept(label, text, w){
    text = (text||"").trim(); if(!text) return;
    if(concepts.some(c=>c.text===text)){ toast("「"+(label||text)+"」は追加済み"); syncRefTiles(); return; }  // 重複防止
    if(concepts.length >= 5){ toast("概念は最大5つまで"); return; }
    concepts.push({ id: nextId++, label: label||text, text: text, w: (w==null?0.6:w) });
    renderConcepts(); syncRefTiles(); toast("＋ "+(label||text)+" を追加");
  }
  function removeConcept(pred, msg){
    concepts = concepts.filter(c=>!pred(c)); renderConcepts(); syncRefTiles(); if(msg) toast(msg);
  }
  function renderConcepts(){
    const el = $("concepts");
    if(!concepts.length){ el.innerHTML = '<p class="empty">まだ概念がない。下の参考か、入力から足す。<br>2つ以上で「両義的」な像になる。</p>'; return; }
    el.innerHTML = "";
    concepts.forEach(c=>{
      const row = document.createElement("div"); row.className = "chip";
      row.innerHTML =
        '<span class="nm" title="'+c.text+'">'+c.label+'</span>' +
        '<input type="range" min="0.1" max="1" step="0.05" value="'+c.w+'">' +
        '<span class="wt mono">'+c.w.toFixed(2)+'</span>' +
        '<button class="rm" title="外す">×</button>';
      const range = row.querySelector("input"), wt = row.querySelector(".wt");
      range.addEventListener("input", ()=>{ c.w = parseFloat(range.value); wt.textContent = c.w.toFixed(2); });
      row.querySelector(".rm").addEventListener("click", ()=> removeConcept(x=>x.id===c.id, "− "+c.label+" を外した"));
      el.append(row);
    });
  }

  // ── reference grid ──
  // 美学＝Remix Images 参照（オプアート/グリッチ/色面/シュール/クローム…）。サムネは assets/remix-refs/ に事前ベイク。
  const REFS = [
    {f:"01", jp:"オプ",   en:"op art concentric circles, high contrast black and white, single orange accent"},
    {f:"02", jp:"グリッチ",en:"glitch art horizontal bands, datamosh, warm red and cream tones"},
    {f:"03", jp:"色面",   en:"bold horizontal color field stripes, blue and red gradient"},
    {f:"04", jp:"靄",     en:"soft green and blue gradient haze, blurred atmosphere"},
    {f:"05", jp:"球体",   en:"surreal minimal landscape with a single floating sphere, muted earth tones"},
    {f:"06", jp:"クローム",en:"dark scene with a chrome metallic object, 3d render, reflective"},
    {f:"07", jp:"虹彩",   en:"iridescent holographic gradient, pearlescent sheen"},
    {f:"08", jp:"干渉",   en:"moire interference pattern, fine concentric lines"},
    {f:"09", jp:"液体",   en:"liquid metal fluid abstract, mercury, chrome"},
    {f:"10", jp:"ノイズ", en:"analog crt noise, scanlines, broken signal"},
    {f:"11", jp:"結晶",   en:"crystalline prismatic facets, light refraction"},
    {f:"12", jp:"渦",     en:"swirling marbled vortex, suminagashi ink"},
    {f:"13", jp:"グラデ", en:"smooth gradient color field, dusk tones"},
    {f:"14", jp:"影",     en:"minimal dark composition with a single beam of light"},
    {f:"15", jp:"砂丘",   en:"surreal desert dune with a tiny lone figure, muted"},
    {f:"16", jp:"回路",   en:"circuit board traces, schematic, technical lines"}
  ];
  // local欠落時のフォールバック：その場でPollinations生成（間隔＋リトライ）
  function loadRefImg(imgEl, prompt, tries){
    tries = (tries==null ? 4 : tries);
    const probe = new Image(); probe.crossOrigin = "anonymous";
    probe.onload  = ()=>{ imgEl.src = probe.src; imgEl.style.opacity = 1; };
    probe.onerror = ()=>{ if(--tries>0) setTimeout(()=>loadRefImg(imgEl, prompt, tries), 1600); };
    probe.src = pollURL(prompt, 256);
  }
  let refTiles = {};   // f -> tile el
  function syncRefTiles(){
    Object.keys(refTiles).forEach(f=>{
      const r = REFS.find(x=>x.f===f);
      refTiles[f].classList.toggle("added", concepts.some(c=>c.text===r.en));
    });
  }
  function renderRefs(){
    const el = $("refs"); el.innerHTML = ""; refTiles = {};
    REFS.forEach((r)=>{
      const d = document.createElement("div"); d.className = "ref"; d.title = r.jp + " を 追加 / 解除";
      const img = document.createElement("img");
      img.alt = r.jp; img.loading = "lazy"; img.style.opacity = 0; img.style.transition = "opacity .4s";
      img.onload  = ()=>{ img.style.opacity = 1; };
      img.onerror = ()=>{ img.onerror = null; loadRefImg(img, r.en + STYLE); };  // ベイク欠落→ライブ生成
      img.src = "assets/remix-refs/ref-" + r.f + ".jpg";                          // 事前ベイク（瞬時）
      const lb = document.createElement("div"); lb.className = "lb"; lb.textContent = r.jp;
      d.append(img, lb);
      d.addEventListener("click", ()=>{
        if(concepts.some(c=>c.text===r.en)) removeConcept(c=>c.text===r.en, "− "+r.jp+" を外した");  // トグル
        else addConcept(r.jp, r.en, 0.6);
      });
      el.append(d); refTiles[r.f] = d;
    });
  }

  // ── gallery ──
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)||"[]"); }catch(e){ return []; } }
  function save(a){ localStorage.setItem(KEY, JSON.stringify(a.slice(0,40))); }
  function saveGallery(cs, m){
    try{
      const th = document.createElement("canvas"); th.width = th.height = 200;
      th.getContext("2d").drawImage($("cv"),0,0,200,200);
      const arr = load();
      arr.unshift({ img: th.toDataURL("image/png"), concepts: cs.map(c=>({label:c.label,text:c.text,w:c.w})), mode:m, ts:Date.now() });
      save(arr); renderGallery();
    }catch(e){ /* tainted → skip */ }
  }
  function renderGallery(){
    const el = $("gallery"), arr = load(); el.innerHTML = "";
    if(!arr.length){ el.innerHTML = '<p class="g-empty">まだ Remix はない。</p>'; return; }
    arr.forEach(it=>{
      const d = document.createElement("div"); d.className = "g-item";
      d.title = (it.concepts||[]).map(c=>c.label).join(" + ");
      const img = document.createElement("img"); img.src = it.img; img.loading = "lazy";
      d.append(img);
      d.addEventListener("click", ()=> useAsBase(it));
      el.append(d);
    });
  }
  // existing Remix → 種画像 にして混ぜ直す
  function useAsBase(it){
    const img = new Image();
    img.onload = ()=>{
      baseImg = img; baseLabel = (it.concepts||[]).map(c=>c.label).join("+");
      $("baseLabel").textContent = "種画像: " + baseLabel + "（重ねモードで合成）";
      $("basebar").classList.add("on");
      // restore its concepts as a starting point
      concepts = (it.concepts||[]).map(c=>({ id: nextId++, label:c.label, text:c.text, w:c.w }));
      renderConcepts(); syncRefTiles();
      mode = "layer"; document.querySelectorAll(".modes button").forEach(b=>b.classList.toggle("on", b.dataset.mode==="layer"));
      ctx.imageSmoothingEnabled = true; ctx.clearRect(0,0,W,H); ctx.drawImage(img,0,0,W,H); $("cv").dataset.drawn="1"; $("ph").style.display="none";
      window.scrollTo({top:0, behavior:"smooth"});
    };
    img.src = it.img;
  }

  // ── wire up ──
  $("addBtn").addEventListener("click", ()=>{ addConcept(null, $("addInput").value); $("addInput").value=""; $("addInput").focus(); });
  $("addInput").addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); addConcept(null, $("addInput").value); $("addInput").value=""; } });
  $("gen").addEventListener("click", generate);
  document.querySelectorAll(".modes button").forEach(b=>{
    b.addEventListener("click", ()=>{ mode = b.dataset.mode; document.querySelectorAll(".modes button").forEach(x=>x.classList.toggle("on", x===b)); });
  });
  $("baseClear").addEventListener("click", ()=>{ baseImg=null; baseLabel=""; $("basebar").classList.remove("on"); });
  $("clear").addEventListener("click", ()=>{ if(confirm("過去の Remix を全て消しますか？")){ localStorage.removeItem(KEY); renderGallery(); } });

  renderConcepts(); renderRefs(); renderGallery();
})();
</script>
</body>
</html>
