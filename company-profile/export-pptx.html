<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>PPTX Export — kinoshita studio</title>
  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
  <script src="images.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#1a1a18;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Helvetica Neue',sans-serif;flex-direction:column;gap:12px}
    .btn{background:none;border:1px solid #a89060;color:#a89060;font-size:13px;letter-spacing:.2em;text-transform:uppercase;padding:18px 48px;cursor:pointer;transition:background .3s}
    .btn:hover{background:rgba(168,144,96,.15)}
    .btn:disabled{opacity:.4;cursor:default}
    .status{color:rgba(240,237,232,.4);font-size:11px;letter-spacing:.15em;text-align:center;max-width:400px}
  </style>
</head>
<body>
  <button class="btn" id="btn">PPTX を生成してダウンロード</button>
  <p class="status" id="status">クリックで生成します</p>
<script>
document.getElementById('btn').addEventListener('click', generatePptx);

async function generatePptx() {
  const btn    = document.getElementById('btn');
  const status = document.getElementById('status');
  btn.disabled = true;

  // IMGS は images.js で定義済み（base64 DataURL）
  const imgs = typeof IMGS !== 'undefined' ? IMGS : {};
  const loaded = Object.values(imgs).filter(Boolean).length;
  status.textContent = `画像 ${loaded} 件読み込み済み。PPTX生成中...`;

  const pres = new PptxGenJS();
  pres.layout = 'LAYOUT_WIDE';
  const W = 13.33, H = 7.5;

  const BG='EBE8E2', BG_ALT='E2DED6', DARK='1A1A18', INK='1A1A18',
        FAINT='7A7770', GOLD='A89060', WHITE='F0EDE8',
        DARK2='252522', DARK3='2A2A28';
  const FJ='Hiragino Sans', FE='Courier New';

  const sf = c => ({type:'solid', color:c});

  function bgRect(s, c) {
    s.addShape(pres.ShapeType.rect, {x:0,y:0,w:W,h:H, fill:sf(c), line:{color:c,width:0}});
  }
  function eyebrow(s, t) {
    s.addText(t, {x:0.6,y:0.42,w:W-1.2,h:0.3, fontFace:FE,fontSize:9,color:GOLD,charSpacing:4});
    s.addShape(pres.ShapeType.line, {x:0.6,y:0.8,w:W-1.2,h:0, line:{color:'C8C4BE',width:0.6}});
  }
  function eyebrowDark(s, t) {
    s.addText(t, {x:0.6,y:0.42,w:W-1.2,h:0.3, fontFace:FE,fontSize:9,color:GOLD,charSpacing:4});
    s.addShape(pres.ShapeType.line, {x:0.6,y:0.8,w:W-1.2,h:0, line:{color:DARK3,width:0.6}});
  }
  function hline(s, y, x, w, c) {
    s.addShape(pres.ShapeType.line, {x,y,w,h:0, line:{color:c||'C8C4BE',width:0.5}});
  }
  function addImg(s, data, x, y, w, h) {
    if (!data) return;
    s.addImage({data, x, y, w, h, sizing:{type:'cover',w,h}});
  }

  // ===== SLIDE 01 — COVER =====
  {
    const s = pres.addSlide();
    bgRect(s, BG);

    // 右半分に琵琶湖写真
    addImg(s, imgs.biwa, 6.8, 0, 6.53, H);
    // 写真の上に薄いクリームオーバーレイ
    s.addShape(pres.ShapeType.rect, {x:6.8,y:0,w:6.53,h:H, fill:sf(BG_ALT), line:{color:BG_ALT,width:0}, transparency:60});

    s.addText('— STUDIO PROFILE  2026', {x:0.7,y:1.0,w:5.8,h:0.35, fontFace:FE,fontSize:9,color:GOLD,charSpacing:5});
    s.addText('ブランドを、\n体験として\n翻訳する。', {x:0.7,y:1.55,w:5.8,h:3.6, fontFace:FJ,fontSize:52,color:INK,lineSpacingMultiple:1.1});
    s.addText('kinoshita studio  —  Experience Translator', {x:0.7,y:5.4,w:5.8,h:0.35, fontFace:FE,fontSize:9,color:FAINT,charSpacing:2});

    const rows=[['STUDIO','kinoshita studio'],['NAME','木下 貴博  /  Takahiro Kinoshita'],['ROLE','体験翻訳家  /  Experience Translator'],['SKILL','UX  /  UI  /  Art Direction  /  Dev'],['BASE','滋賀・琵琶湖  /  Shiga, Japan'],['WEB','kinoshita.studio']];
    rows.forEach(([label,val],i) => {
      const y=1.0+i*1.0;
      s.addShape(pres.ShapeType.rect, {x:7.2,y,w:5.5,h:0.85, fill:sf(BG_ALT), line:{color:'C8C4BE',width:0.6}});
      s.addText(label, {x:7.42,y:y+0.1, w:5.06,h:0.25, fontFace:FE,fontSize:7,color:GOLD,charSpacing:3});
      s.addText(val,   {x:7.42,y:y+0.42,w:5.06,h:0.32, fontFace:FE,fontSize:9,color:INK});
    });
  }

  // ===== SLIDE 02 — CONCEPT =====
  {
    const s = pres.addSlide();
    bgRect(s, BG);
    eyebrow(s, '01 — STUDIO CONCEPT');

    addImg(s, imgs.translator, 7.0, 0.9, 5.8, 5.5);

    s.addShape(pres.ShapeType.rect, {x:0.6,y:1.1,w:0.06,h:5.0, fill:sf(GOLD), line:{color:GOLD,width:0}});
    s.addText('届けたい体験と\n届いている体験の\nズレを揃える。', {x:0.9,y:1.15,w:5.5,h:4.8, fontFace:FJ,fontSize:34,color:INK,lineSpacingMultiple:1.45});
    s.addText('ブランドはロゴではなく、体験で記憶される。\n\n「思想が伝わらない」「デザインはあるのに何かが足りない」——そのズレの正体を発見し、UX・デザインとして整えるのが木下スタジオの仕事です。\n\nリサーチから戦略立案、実装まで一貫して一人で担うことで、思想が摩耗せず体験として届きます。',
      {x:0.9,y:3.9,w:5.5,h:2.8, fontFace:FJ,fontSize:11,color:'3A3A34',lineSpacingMultiple:1.9});
  }

  // ===== SLIDE 03 — PROFILE =====
  {
    const s = pres.addSlide();
    bgRect(s, BG);
    eyebrow(s, '02 — FOUNDER PROFILE');

    addImg(s, imgs.studio, 0.6, 1.1, 2.6, 5.6);

    s.addText('木下 貴博', {x:3.5,y:1.1,w:9.2,h:1.0, fontFace:FJ,fontSize:42,color:INK});
    s.addText('Takahiro Kinoshita  —  Experience Translator', {x:3.5,y:2.2,w:9.2,h:0.35, fontFace:FE,fontSize:9,color:GOLD,charSpacing:2});
    s.addText('滋賀・琵琶湖を拠点に活動するデザイナー・プロダクト開発者。UX/UIデザイン・アートディレクション・プロダクト開発を一人で担う木下スタジオ代表。\n\n「体験翻訳家」として地域中小企業から個人開発プロダクトまで幅広く手がける。BMBoard・Ateli.er・KODOCOを個人開発・世界公開。Product Hunt ローンチ経験あり。',
      {x:3.5,y:2.7,w:9.2,h:2.5, fontFace:FJ,fontSize:11.5,color:'3A3A34',lineSpacingMultiple:1.9});

    const tags=['UX Design','UI Design','Art Direction','Web Design','Product Dev','Chrome Ext'];
    tags.forEach((t,i) => {
      const col=i%3, row=Math.floor(i/3);
      s.addShape(pres.ShapeType.rect, {x:3.5+col*3.1,y:5.4+row*0.65,w:2.9,h:0.52, fill:sf(BG), line:{color:'C0BCB5',width:0.6}});
      s.addText(t, {x:3.5+col*3.1,y:5.4+row*0.65,w:2.9,h:0.52, fontFace:FE,fontSize:8,color:FAINT,charSpacing:2,align:'center',valign:'middle'});
    });
  }

  // ===== SLIDE 04 — DIFFERENCE =====
  {
    const s = pres.addSlide();
    bgRect(s, BG);
    eyebrow(s, '03 — OUR DIFFERENCE');

    const cw=3.9, gap=0.15, ox=0.6;
    const cols=[
      {label:'一般的なデザイン会社',rows:['課題のヒアリング','デザイン制作','納品'],tag:'見た目から始まる',bg:BG_ALT,dark:false},
      {label:'UXデザイン会社',      rows:['ユーザーリサーチ','UX設計','UI実装'],   tag:'ユーザーから始まる',bg:BG_ALT,dark:false},
      {label:'kinoshita studio',    rows:['ブランドの価値を理解する','顧客体験として設計する','UX / デザインで実装する','ズレを観察・改善する','音・余白・時間・トーンで\n体験の質感を整える'],tag:'We design not only visuals,\nbut the quality of experience.',bg:DARK,dark:true},
    ];
    cols.forEach((col,ci) => {
      const cx=ox+ci*(cw+gap);
      s.addShape(pres.ShapeType.rect, {x:cx,y:0.95,w:cw,h:6.3, fill:sf(col.bg), line:{color:col.dark?DARK3:'C8C4BE',width:0.6}});
      s.addText(col.label, {x:cx+0.25,y:1.1,w:cw-0.5,h:0.35, fontFace:FE,fontSize:8,color:col.dark?GOLD:FAINT,charSpacing:2});
      col.rows.forEach((r,ri) => {
        const isGold=col.dark&&ri===col.rows.length-1;
        s.addText(r, {x:cx+0.25,y:1.65+ri*0.82,w:cw-0.5,h:0.68, fontFace:FJ,fontSize:11.5,color:isGold?GOLD:col.dark?'C8C4BE':'3A3A34',lineSpacingMultiple:1.4});
        if (ri<col.rows.length-1)
          s.addText('↓', {x:cx+0.25,y:2.09+ri*0.82,w:0.4,h:0.22, fontFace:FE,fontSize:9,color:col.dark?GOLD:'C8C4BE'});
      });
      s.addText(col.tag, {x:cx+0.25,y:6.65,w:cw-0.5,h:0.55, fontFace:FE,fontSize:8,color:col.dark?GOLD:FAINT,charSpacing:1,lineSpacingMultiple:1.6});
    });
  }

  // ===== SLIDE 05 — PROCESS =====
  {
    const s = pres.addSlide();
    bgRect(s, BG);
    eyebrow(s, '04 — PROCESS  /  3つのプロセス');

    const cw=3.9, gap=0.15, ox=0.6;
    const steps=[
      {num:'01 — Experience Research',verb:'Observe.',ja:'体験の観察と分析',
       desc:'ブランドが届けたい体験と、顧客が実際に感じている体験のズレを特定する。ユーザーリサーチ・フィールド観察・ブランド分析によって「見えていなかった課題」を可視化する。',
       out:'Experience Research Report\nズレのマッピング  /  インサイト抽出'},
      {num:'02 — Experience Strategy',verb:'Translate.',ja:'ブランド体験の設計',
       desc:'リサーチで発見したズレを解消するための体験設計。ブランドコンセプト・ペルソナ・カスタマージャーニーを統合し、「届けるべき感覚」を言語化・構造化する。',
       out:'Brand Experience Map\nPersona  /  Journey  /  Experience Strategy'},
      {num:'03 — Experience Design',verb:'Implement.',ja:'体験の実装',
       desc:'戦略を実際のUX/デザインとして実装する。Web・UI・ビジュアル・コンテンツすべての接点で、ブランドが意図する体験を届ける形に整える。',
       out:'UX / UI Design  /  Web Design\nDesign System  /  + 音・余白・時間・トーン'},
    ];
    steps.forEach((st,i) => {
      const cx=ox+i*(cw+gap);
      s.addShape(pres.ShapeType.rect, {x:cx,y:0.95,w:cw,h:6.3, fill:sf(BG_ALT), line:{color:'C8C4BE',width:0.6}});
      s.addText(st.num,  {x:cx+0.25,y:1.1, w:cw-0.5,h:0.3,  fontFace:FE,fontSize:8, color:GOLD,charSpacing:2});
      s.addText(st.verb, {x:cx+0.25,y:1.5, w:cw-0.5,h:0.72, fontFace:FJ,fontSize:32,color:INK});
      s.addText(st.ja,   {x:cx+0.25,y:2.28,w:cw-0.5,h:0.3,  fontFace:FE,fontSize:8, color:FAINT,charSpacing:2});
      s.addText(st.desc, {x:cx+0.25,y:2.7, w:cw-0.5,h:2.5,  fontFace:FJ,fontSize:10.5,color:'3A3A34',lineSpacingMultiple:1.85});
      hline(s,5.5,cx+0.25,cw-0.5);
      s.addText('— OUTPUT',{x:cx+0.25,y:5.6, w:cw-0.5,h:0.25, fontFace:FE,fontSize:7.5,color:GOLD,charSpacing:3});
      s.addText(st.out,  {x:cx+0.25,y:5.92,w:cw-0.5,h:0.9,  fontFace:FE,fontSize:9,  color:FAINT,lineSpacingMultiple:1.7});
    });
  }

  // ===== SLIDE 06 — PRODUCTS =====
  {
    const s = pres.addSlide();
    bgRect(s, BG);
    eyebrow(s, '05 — ORIGINAL PRODUCTS  /  個人開発プロダクト');

    const cw=3.9, gap=0.15, ox=0.6;
    const prods=[
      {name:'BMBoard', tag:'Black Mirror Board',
       desc:'iPhone・Mac 対応のミニマルなホワイトボードアプリ。鉛筆・テキスト・付箋・GIFを組み合わせたキャンバス。Product Hunt ローンチ済み。',
       badges:['Web App','Chrome Ext','Product Hunt'], url:'bmboard.studio', imgKey:'bmboard'},
      {name:'Ateli.er', tag:'Music Curation Studio',
       desc:'音楽・映像・テキストをチャンネルに集めて共有するキュレーションスタジオ。マルチユーザー対応。Chrome拡張「Atelier Clip」もCWS公開済み。',
       badges:['Web App','Supabase','Chrome Ext'], url:'atelistudio.com', imgKey:'atelier'},
      {name:'KODOCO', tag:'Child Record App',
       desc:'子どもの成長・日常を記録するプライベートアプリ。独自ドメイン（kodoco.jp）取得済み。Supabase 認証・DB 完全連携。',
       badges:['Web App','Supabase','kodoco.jp'], url:'kodoco.jp', imgKey:'kodoco'},
    ];
    prods.forEach((p,i) => {
      const cx=ox+i*(cw+gap);
      s.addShape(pres.ShapeType.rect, {x:cx,y:0.95,w:cw,h:6.3, fill:sf(BG_ALT), line:{color:'C8C4BE',width:0.6}});
      addImg(s, imgs[p.imgKey], cx, 0.95, cw, 2.4);
      // スクショ下のテキストエリア背景
      s.addShape(pres.ShapeType.rect, {x:cx,y:3.35,w:cw,h:3.9, fill:sf(BG_ALT), line:{color:'C8C4BE',width:0}});
      s.addText('— 0'+(i+1), {x:cx+0.25,y:3.45,w:cw-0.5,h:0.28, fontFace:FE,fontSize:8, color:FAINT});
      s.addText(p.name,       {x:cx+0.25,y:3.78,w:cw-0.5,h:0.65, fontFace:FJ,fontSize:30,color:INK});
      s.addText(p.tag,        {x:cx+0.25,y:4.48,w:cw-0.5,h:0.3,  fontFace:FE,fontSize:8, color:GOLD,charSpacing:2});
      s.addText(p.desc,       {x:cx+0.25,y:4.85,w:cw-0.5,h:1.3,  fontFace:FJ,fontSize:9.5,color:'3A3A34',lineSpacingMultiple:1.75});
      p.badges.forEach((b,bi) => {
        s.addShape(pres.ShapeType.rect, {x:cx+0.25+bi*1.22,y:6.28,w:1.1,h:0.32, fill:sf(BG), line:{color:'C0BCB5',width:0.6}});
        s.addText(b, {x:cx+0.25+bi*1.22,y:6.28,w:1.1,h:0.32, fontFace:FE,fontSize:7,color:GOLD,align:'center',valign:'middle',charSpacing:1});
      });
      hline(s,6.7,cx+0.25,cw-0.5,'C8C4BE');
      s.addText(p.url, {x:cx+0.25,y:6.78,w:cw-0.5,h:0.28, fontFace:FE,fontSize:9,color:GOLD});
    });
  }

  // ===== SLIDE 07 — WORKS =====
  {
    const s = pres.addSlide();
    bgRect(s, BG);
    eyebrow(s, '06 — CLIENT WORKS  /  制作実績');

    const cw=3.9, gap=0.15, ox=0.6;
    const works=[
      {cat:'Web Design',          name:'まるいち',            meta:'Maruichi  —  自転車業 / 2022', imgKey:'maruichi'},
      {cat:'Web Design',          name:'木山合金',             meta:'Kiyama Gokin  —  工業 / 2022', imgKey:'kiyama'},
      {cat:'Web Design',          name:'RINCARS',             meta:'RINCARS  —  自動車製造業 / 2022', imgKey:'rincars'},
      {cat:'Brand Experience',    name:'道頓堀 屋台村 祭',    meta:'屋台村 祭  —  飲食業 / 2023',  imgKey:'yatai'},
      {cat:'Web Design',          name:'Avenir',              meta:'Avenir  —  写真撮影業 / 2025', imgKey:'avenir'},
      {cat:'Web Design',          name:'Mirise',              meta:'Mirise  —  飲食業 / 2022',     imgKey:'wireframe'},
    ];
    works.forEach((w,i) => {
      const col=i%3, row=Math.floor(i/3);
      const cx=ox+col*(cw+gap), cy=0.95+row*3.25;
      addImg(s, imgs[w.imgKey], cx, cy, cw, 1.9);
      // 画像なしのときのプレースホルダー
      if (!imgs[w.imgKey]) {
        s.addShape(pres.ShapeType.rect, {x:cx,y:cy,w:cw,h:1.9, fill:sf(BG_ALT), line:{color:'C8C4BE',width:0.6}});
        s.addText(w.cat.toUpperCase(), {x:cx,y:cy,w:cw,h:1.9, fontFace:FE,fontSize:9,color:GOLD,align:'center',valign:'middle',charSpacing:2});
      }
      // カテゴリバッジ
      s.addShape(pres.ShapeType.rect, {x:cx,y:cy,w:cw*0.45,h:0.28, fill:sf('0D0D0C'), line:{color:'0D0D0C',width:0}});
      s.addText(w.cat, {x:cx+0.05,y:cy+0.04,w:cw*0.45-0.06,h:0.22, fontFace:FE,fontSize:6.5,color:GOLD,charSpacing:1});

      s.addText(w.name, {x:cx+0.1,y:cy+2.0, w:cw-0.2,h:0.48, fontFace:FJ,fontSize:17,color:INK});
      s.addText(w.meta, {x:cx+0.1,y:cy+2.52,w:cw-0.2,h:0.3,  fontFace:FE,fontSize:8.5,color:FAINT});
    });
  }

  // ===== SLIDE 08 — FLOW =====
  {
    const s = pres.addSlide();
    bgRect(s, BG);
    eyebrow(s, '07 — HOW WE WORK  /  依頼から納品まで');

    const flows=[
      {num:'01',title:'まず話すだけでいい',  desc:'LINE・X・Webフォームでお気軽にご連絡ください。課題が整理されていなくても大丈夫です。',period:'Day 1'},
      {num:'02',title:'ヒアリング',          desc:'ブランドの価値・課題・目標・予算・スケジュールを丁寧に伺います。オンライン・対面どちらでも。',period:'Day 3–7'},
      {num:'03',title:'提案・見積り',        desc:'プロセス・成果物・スケジュール・費用をご提示します。内容に合わせてカスタマイズします。',period:'Day 7–14'},
      {num:'04',title:'制作・実装',          desc:'リサーチ・戦略・デザイン・実装を一貫して担います。途中経過を随時共有しながら進めます。',period:'プロジェクトによる'},
      {num:'05',title:'納品・継続サポート',  desc:'成果物をお渡しします。納品後のフォローアップ・改善サポートにも対応。長期継続も歓迎。',period:'納品後'},
    ];
    flows.forEach((f,i) => {
      const y=0.95+i*1.2;
      s.addShape(pres.ShapeType.rect, {x:0.6,y,w:W-1.2,h:1.05, fill:sf(BG_ALT), line:{color:'C8C4BE',width:0.6}});
      s.addText(f.num,    {x:0.85, y:y+0.1,w:0.65,h:0.85, fontFace:FE,fontSize:11,color:GOLD,charSpacing:3,valign:'middle'});
      s.addText(f.title,  {x:1.65, y:y+0.1,w:4.0, h:0.38, fontFace:FJ,fontSize:15,color:INK});
      s.addText(f.desc,   {x:1.65, y:y+0.52,w:9.0,h:0.42, fontFace:FJ,fontSize:11,color:'3A3A34'});
      s.addText(f.period, {x:11.2, y:y+0.1,w:1.5, h:0.38, fontFace:FE,fontSize:9, color:FAINT,align:'right'});
    });
  }

  // ===== SLIDE 09 — PRICING =====
  {
    const s = pres.addSlide();
    bgRect(s, BG);
    eyebrow(s, '08 — PRICING  /  料金の考え方');

    s.addText('料金はプロジェクトの規模・内容・期間によって異なります。以下はあくまで目安です。詳細はお気軽にご相談ください。',
      {x:0.6,y:0.9,w:W-1.2,h:0.38, fontFace:FJ,fontSize:11,color:FAINT});

    const cw=3.9, gap=0.15, ox=0.6;
    const tiers=[
      {label:'LIGHT',    name:'ポスター・フライヤー\nロゴ・バナー制作',price:'¥30,000〜',
       items:['アートディレクション','デザイン制作（1–3点）','修正2回まで'],dark:false},
      {label:'STANDARD', name:'Webサイト制作\nUX / UI設計',       price:'¥150,000〜',
