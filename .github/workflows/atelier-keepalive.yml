# Atelier の Supabase（Free）が7日使われないと一時停止するので、週2回だけ軽く読む
name: atelier-keepalive
on:
  schedule:
    - cron: '17 0 * * 1,4'   # 月・木 9:17 JST
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: read one row
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 \
            "https://boaslcfdjdjaryahpged.supabase.co/rest/v1/profiles?select=handle&limit=1" \
            -H "apikey: sb_publishable_063kSonhC4HBJu-Dr3kUaw_4dRD7vPi")
          echo "status=$code"
          test "$code" = "200"
      - name: read one row (KODOCO)
        continue-on-error: true   # KODOCO が止まっていても Atelier の方は通す
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 \
            "https://vpvsngmpxwevizkvbhtn.supabase.co/rest/v1/kodoco_reviews?select=id&limit=1" \
            -H "apikey: sb_publishable_D4HutMoqm4croGrsNHENpQ_T47tP6__")
          echo "status=$code"
          test "$code" = "200"
