# Atelier と KODOCO の Supabase（Free）が7日使われないと一時停止するので、毎日軽く読む
# 11-21 週2回の読み取りでも KODOCO に「活動が足りない」警告が来た → 毎日・3つの表と auth も叩く
name: atelier-keepalive
on:
  schedule:
    - cron: '17 0 * * *'   # 毎日 9:17 JST
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: read one row
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 \
            "https://boaslcfdjdjaryahpged.supabase.co/rest/v1/profiles?select=handle&limit=1" \
            -H "apikey: sb_publishable_063kSonhC4HBJu-Dr3kUaw_4dRD7vPi")
          echo "status=$code"
          test "$code" = "200"
      - name: read (KODOCO)
        continue-on-error: true   # KODOCO が止まっていても Atelier の方は通す
        run: |
          K="sb_publishable_D4HutMoqm4croGrsNHENpQ_T47tP6__"; U="https://vpvsngmpxwevizkvbhtn.supabase.co"
          ok=0
          for t in kodoco_reviews profiles; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 "$U/rest/v1/$t?select=*&limit=1" -H "apikey: $K" -H "Authorization: Bearer $K")
            echo "$t=$code"; [ "$code" = "200" ] && ok=1
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 "$U/auth/v1/health" -H "apikey: $K"); echo "auth=$code"
          test "$ok" = "1"
