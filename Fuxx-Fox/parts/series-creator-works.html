<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creator Works</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Space Grotesk', 'Noto Sans JP', sans-serif; background: #0A0A0A; color: #fff; }
.sec { padding: 100px 60px; }
.header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 60px; }
h2 { font-size: clamp(2rem,4vw,3.5rem); font-weight: 700; letter-spacing: -.02em; line-height: 1; }
h2 span { color: #00FF87; }
.view-all { font-size: 12px; letter-spacing: .12em; color: rgba(255,255,255,.35); text-decoration: none; border-bottom: 1px solid rgba(255,255,255,.15); padding-bottom: 2px; transition: all .2s; }
.view-all:hover { color: #00FF87; border-color: #00FF87; }
.grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 2px; }
.item { position: relative; overflow: hidden; cursor: pointer; }
.item img { width: 100%; display: block; object-fit: cover; transition: transform .6s cubic-bezier(.25,.46,.45,.94); }
.item:nth-child(1) img, .item:nth-child(4) img { aspect-ratio: 16/10; }
.item:nth-child(2) img, .item:nth-child(3) img { aspect-ratio: 4/3; }
.item:hover img { transform: scale(1.04); }
.overlay { position: absolute; inset: 0; background: rgba(10,10,10,.7); opacity: 0; transition: opacity .3s; display: flex; flex-direction: column; justify-content: flex-end; padding: 32px; }
.item:hover .overlay { opacity: 1; }
.cats { display: flex; gap: 8px; margin-bottom: 12px; }
.cat { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 3px 10px; border: 1px solid rgba(0,255,135,.4); color: #00FF87; border-radius: 2px; }
.work-title { font-size: 1.4rem; font-weight: 700; letter-spacing: -.01em; margin-bottom: 6px; line-height: 1.2; }
.work-sub { font-size: 13px; color: rgba(255,255,255,.55); }
.arrow { position: absolute; top: 24px; right: 24px; width: 40px; height: 40px; border: 1px solid rgba(255,255,255,.2); display: flex; align-items: center; justify-content: center; font-size: 16px; transition: all .2s; }
.item:hover .arrow { background: #00FF87; border-color: #00FF87; color: #0A0A0A; }
@media (max-width: 768px) { .grid { grid-template-columns: 1fr; } .sec { padding: 60px 24px; } .header { flex-direction: column; gap: 20px; } }
</style>
</head>
<body>
<section class="sec">
  <div class="header">
    <h2 data-ff-anim><span class="jp">Selected<br><span>Works</span></span><span class="en" style="display:none">Selected<br><span>Works</span></span></h2>
    <a href="#" class="view-all" data-ff-anim><span class="jp">すべて見る →</span><span class="en" style="display:none">View all →</span></a>
  </div>
  <div class="grid">
    <div class="item" data-ff-anim data-ff-delay="2">
      <img data-editable="image" src="https://images.unsplash.com/photo-1561070791-2526d30994b5?w=800&q=80&auto=format&fit=crop" alt="work1">
      <div class="overlay">
        <div class="cats"><span class="cat">Branding</span><span class="cat">Identity</span></div>
        <div class="work-title"><span class="jp">Nomad — ブランドシステム</span><span class="en" style="display:none">Nomad — Brand System</span></div>
        <div class="work-sub">2026</div>
      </div>
      <div class="arrow">↗</div>
    </div>
    <div class="item" data-ff-anim data-ff-delay="3">
      <img data-editable="image" src="https://images.unsplash.com/photo-1545235617-9465d2a55698?w=600&q=80&auto=format&fit=crop" alt="work2">
      <div class="overlay">
        <div class="cats"><span class="cat">UI/UX</span></div>
        <div class="work-title"><span class="jp">Fintech アプリデザイン</span><span class="en" style="display:none">Fintech App Design</span></div>
        <div class="work-sub">2025</div>
      </div>
      <div class="arrow">↗</div>
    </div>
    <div class="item" data-ff-anim data-ff-delay="4">
      <img data-editable="image" src="https://images.unsplash.com/photo-1586717791821-3f44a563fa4c?w=600&q=80&auto=format&fit=crop" alt="work3">
      <div class="overlay">
        <div class="cats"><span class="cat">Web</span><span class="cat">Motion</span></div>
        <div class="work-title"><span class="jp">Vela — コーポレートサイト</span><span class="en" style="display:none">Vela — Corporate Site</span></div>
        <div class="work-sub">2025</div>
      </div>
      <div class="arrow">↗</div>
    </div>
    <div class="item" data-ff-anim data-ff-delay="4">
      <img data-editable="image" src="https://images.unsplash.com/photo-1558655146-d09347e92766?w=800&q=80&auto=format&fit=crop" alt="work4">
      <div class="overlay">
        <div class="cats"><span class="cat">Editorial</span></div>
        <div class="work-title"><span class="jp">架空の雑誌 MONO — 装丁</span><span class="en" style="display:none">MONO Magazine — Art Direction</span></div>
        <div class="work-sub">2024</div>
      </div>
      <div class="arrow">↗</div>
    </div>
  </div>
</section>
<script>
window.addEventListener('message', e => {
  if (!e.data || e.data.type !== 'setLang') return;
  const jp = e.data.lang === 'jp';
  document.querySelectorAll('.jp').forEach(el => el.style.display = jp ? '' : 'none');
  document.querySelectorAll('.en').forEach(el => el.style.display = jp ? 'none' : '');
});
</script>
</body>
</html>
