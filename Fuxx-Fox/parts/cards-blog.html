<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cards Blog</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans JP','Inter',sans-serif; background: #fff; }
.blog { padding: 80px 40px; }
.blog-label { font-size: 12px; font-weight: 700; letter-spacing: .12em; color: #6366f1; text-transform: uppercase; margin-bottom: 12px; }
h2 { font-size: 2rem; font-weight: 800; color: #09090b; margin-bottom: 48px; }
.grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 24px; max-width: 960px; }
.card { border: 1px solid #e4e4e7; border-radius: 14px; overflow: hidden; }
.thumb { height: 180px; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.body { padding: 20px; }
.meta { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.cat { font-size: 11px; font-weight: 700; letter-spacing: .08em; color: #6366f1; background: #eef2ff; padding: 3px 8px; border-radius: 4px; }
.date { font-size: 11px; color: #71717a; }
h3 { font-size: 15px; font-weight: 700; color: #09090b; line-height: 1.5; margin-bottom: 8px; }
p { font-size: 13px; color: #71717a; line-height: 1.65; }
@media (max-width: 768px) { .grid { grid-template-columns: 1fr; } .blog { padding: 60px 20px; } }
</style>
</head>
<body>
<section class="blog">
  <div class="blog-label" data-ff-anim>ブログ</div>
  <h2 data-ff-anim data-ff-delay="1">最新の記事</h2>
  <div class="grid">
    <div class="card" data-ff-anim data-ff-delay="2"><div class="thumb"><img data-editable="image" src="https://images.unsplash.com/photo-1551434678-e076c223a692?w=600&q=80&auto=format&fit=crop" alt="blog1"></div><div class="body"><div class="meta"><span class="cat">プロダクト</span><span class="date">2026.05.20</span></div><h3>新機能「スマート分析」のご紹介</h3><p>データをより深く理解するための新しい分析ツールが登場しました。</p></div></div>
    <div class="card" data-ff-anim data-ff-delay="3"><div class="thumb"><img data-editable="image" src="https://images.unsplash.com/photo-1600880292203-757bb62b4baf?w=600&q=80&auto=format&fit=crop" alt="blog2"></div><div class="body"><div class="meta"><span class="cat">活用事例</span><span class="date">2026.05.12</span></div><h3>導入企業インタビュー：生産性を3倍にした方法</h3><p>実際に導入された企業の担当者に使い方のコツを聞きました。</p></div></div>
    <div class="card" data-ff-anim data-ff-delay="4"><div class="thumb"><img data-editable="image" src="https://images.unsplash.com/photo-1519389950473-47ba0277781c?w=600&q=80&auto=format&fit=crop" alt="blog3"></div><div class="body"><div class="meta"><span class="cat">お知らせ</span><span class="date">2026.05.01</span></div><h3>料金プランをリニューアルしました</h3><p>より使いやすい料金体系に変更。既存ユーザーへの影響はありません。</p></div></div>
  </div>
</section>
<script>
window.addEventListener('message', e => {
  if (!e.data || e.data.type !== 'setLang') return;
  const jp = e.data.lang === 'jp';
  document.querySelectorAll('.jp').forEach(el => el.style.display = jp ? '' : 'none');
  document.querySelectorAll('.en').forEach(el => el.style.display = jp ? 'none' : '');
});
</script>
</body>
</html>
