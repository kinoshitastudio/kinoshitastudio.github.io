<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero Dark Gradient</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans JP','Inter',sans-serif; }
@keyframes gradShift {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
.hero { padding: 110px 40px; text-align: center; background: linear-gradient(135deg, #0f0c29, #1a0536, #24243e, #0f2027); background-size: 300% 300%; animation: gradShift 8s ease infinite; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .2em; color: #a78bfa; text-transform: uppercase; margin-bottom: 24px; }
h1 { font-size: clamp(2.2rem, 5vw, 3.8rem); font-weight: 900; color: #fff; line-height: 1.15; letter-spacing: -.02em; margin-bottom: 20px; }
.accent { background: linear-gradient(90deg, #a78bfa, #60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.sub { font-size: 1rem; color: rgba(255,255,255,.65); line-height: 1.8; max-width: 500px; margin: 0 auto 40px; }
.btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.btn-primary { background: linear-gradient(90deg,#7c3aed,#4f46e5); color: #fff; padding: 14px 32px; border-radius: 8px; font-weight: 700; font-size: 14px; text-decoration: none; }
.btn-ghost { border: 1px solid rgba(255,255,255,.25); color: rgba(255,255,255,.85); padding: 14px 28px; border-radius: 8px; font-weight: 600; font-size: 14px; text-decoration: none; }
@media (max-width: 640px) { .hero { padding: 72px 20px; } }
</style>
</head>
<body>
<section class="hero">
  <div class="eyebrow" data-ff-anim><span class="jp">プロダクト紹介</span><span class="en" style="display:none">Introducing</span></div>
  <h1 data-ff-anim data-ff-delay="1"><span class="jp">未来を動かす<br><span class="accent">プロダクトを。</span></span><span class="en" style="display:none">Build Products<br><span class="accent">That Move the Future.</span></span></h1>
  <p class="sub" data-ff-anim data-ff-delay="2"><span class="jp">次世代のユーザー体験を実現するための、最もシンプルで力強いプラットフォーム。</span><span class="en" style="display:none">The simplest and most powerful platform for delivering next-generation user experiences.</span></p>
  <div class="btns" data-ff-anim data-ff-delay="3">
    <a href="#" class="btn-primary"><span class="jp">今すぐ始める →</span><span class="en" style="display:none">Start Now →</span></a>
    <a href="#" class="btn-ghost"><span class="jp">デモを見る</span><span class="en" style="display:none">View Demo</span></a>
  </div>
</section>
<script>
window.addEventListener('message', e => {
  if (!e.data || e.data.type !== 'setLang') return;
  const jp = e.data.lang === 'jp';
  document.querySelectorAll('.jp').forEach(el => el.style.display = jp ? '' : 'none');
  document.querySelectorAll('.en').forEach(el => el.style.display = jp ? 'none' : '');
});
</script>
</body>
</html>
