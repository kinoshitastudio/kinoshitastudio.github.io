<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero Center</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans JP','Inter',sans-serif; background: #09090b; color: #fafafa; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.hero { text-align: center; padding: 80px 24px; max-width: 680px; }
.badge { display: inline-block; background: #1c1c1e; border: 1px solid #3f3f46; color: #a1a1aa; font-size: 12px; font-weight: 600; padding: 5px 16px; border-radius: 999px; margin-bottom: 28px; letter-spacing: .08em; }
h1 { font-size: clamp(36px,5vw,60px); font-weight: 800; line-height: 1.15; margin-bottom: 20px; }
h1 span { background: linear-gradient(135deg,#3ACFC6,#5ee7df); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
p { color: #a1a1aa; font-size: 18px; line-height: 1.75; margin-bottom: 40px; }
.btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.btn-p { background: #3ACFC6; color: #09090b; padding: 14px 32px; border-radius: 8px; font-weight: 700; text-decoration: none; font-size: 15px; }
.btn-s { border: 1px solid #3f3f46; color: #fafafa; padding: 14px 32px; border-radius: 8px; font-weight: 600; text-decoration: none; font-size: 15px; }
</style>
</head>
<body>
<div class="hero">
  <span class="badge">NEW LAUNCH 2026</span>
  <h1><span class="jp">あなたのサービスを<br><span>伝えるタイトル</span></span><span class="en" style="display:none">Your Product<br><span>Starts Here</span></span></h1>
  <p><span class="jp">サービスの価値を端的に説明するサブコピーが入ります。ユーザーのペインとゲインを意識して書きましょう。</span><span class="en" style="display:none">A short tagline that connects with your audience. Focus on their pain point and your solution.</span></p>
  <div class="btns">
    <a href="#" class="btn-p"><span class="jp">今すぐ始める</span><span class="en" style="display:none">Get Started</span></a>
    <a href="#" class="btn-s"><span class="jp">デモを見る</span><span class="en" style="display:none">See Demo</span></a>
  </div>
</div>
<script>
window.addEventListener('message', e => {
  if (!e.data || e.data.type !== 'setLang') return;
  const jp = e.data.lang === 'jp';
  document.querySelectorAll('.jp').forEach(el => el.style.display = jp ? '' : 'none');
  document.querySelectorAll('.en').forEach(el => el.style.display = jp ? 'none' : '');
});
</script>
</body>
</html>
