<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Section Contact</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans JP','Inter',sans-serif; background: #fff; }
.contact { padding: 80px 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 64px; max-width: 960px; margin: 0 auto; align-items: start; }
.contact-left .label { font-size: 12px; font-weight: 700; letter-spacing: .12em; color: #6366f1; text-transform: uppercase; margin-bottom: 12px; }
.contact-left h2 { font-size: 2rem; font-weight: 800; color: #09090b; margin-bottom: 16px; }
.contact-left p { font-size: 14px; color: #71717a; line-height: 1.75; margin-bottom: 28px; }
.info { display: flex; flex-direction: column; gap: 12px; }
.info-item { display: flex; gap: 10px; align-items: center; font-size: 13px; color: #52525b; }
.info-icon { width: 32px; height: 32px; border-radius: 8px; background: #f4f4f5; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
form { display: flex; flex-direction: column; gap: 14px; }
label { font-size: 12px; font-weight: 600; color: #3f3f46; margin-bottom: 4px; display: block; }
input, textarea { width: 100%; padding: 11px 14px; border: 1px solid #e4e4e7; border-radius: 8px; font-size: 14px; font-family: inherit; outline: none; }
input:focus, textarea:focus { border-color: #6366f1; }
textarea { min-height: 120px; resize: vertical; }
button { background: #09090b; color: #fff; border: none; padding: 13px 24px; border-radius: 9px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
@media (max-width: 768px) { .contact { grid-template-columns: 1fr; gap: 40px; padding: 60px 20px; } }
</style>
</head>
<body>
<section class="contact">
  <div class="contact-left">
    <div class="label">お問い合わせ</div>
    <h2>気軽にご相談ください</h2>
    <p>製品に関するご質問・ご要望・導入のご相談など、何でもお気軽にどうぞ。1営業日以内にご返信します。</p>
    <div class="info">
      <div class="info-item"><div class="info-icon">📧</div>info@example.com</div>
      <div class="info-item"><div class="info-icon">📞</div>03-0000-0000</div>
      <div class="info-item"><div class="info-icon">🕐</div>平日 10:00〜18:00</div>
    </div>
  </div>
  <form>
    <div><label>お名前</label><input type="text" placeholder="山田 太郎"></div>
    <div><label>メールアドレス</label><input type="email" placeholder="your@email.com"></div>
    <div><label>お問い合わせ内容</label><textarea placeholder="ご質問・ご要望をご記入ください"></textarea></div>
    <button>送信する →</button>
  </form>
</section>
<script>
window.addEventListener('message', e => {
  if (!e.data || e.data.type !== 'setLang') return;
  const jp = e.data.lang === 'jp';
  document.querySelectorAll('.jp').forEach(el => el.style.display = jp ? '' : 'none');
  document.querySelectorAll('.en').forEach(el => el.style.display = jp ? 'none' : '');
});
</script>
</body>
</html>
