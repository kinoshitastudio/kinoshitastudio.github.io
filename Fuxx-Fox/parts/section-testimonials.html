<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Section Testimonials</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans JP','Inter',sans-serif; background: #fafafa; }
.testimonials { padding: 80px 40px; }
.testimonials-label { font-size: 12px; font-weight: 700; letter-spacing: .12em; color: #6366f1; text-transform: uppercase; margin-bottom: 12px; text-align: center; }
h2 { font-size: 2rem; font-weight: 800; color: #09090b; text-align: center; margin-bottom: 48px; }
.grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 20px; max-width: 960px; margin: 0 auto; }
.card { background: #fff; border: 1px solid #e4e4e7; border-radius: 14px; padding: 28px; }
.stars { color: #f59e0b; font-size: 14px; margin-bottom: 16px; letter-spacing: 2px; }
.quote { font-size: 14px; color: #3f3f46; line-height: 1.75; margin-bottom: 20px; }
.author { display: flex; align-items: center; gap: 10px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #6366f1, #8b5cf6); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #fff; flex-shrink: 0; }
.name { font-size: 13px; font-weight: 700; color: #09090b; }
.role { font-size: 11px; color: #71717a; }
@media (max-width: 768px) { .grid { grid-template-columns: 1fr; } .testimonials { padding: 60px 20px; } }
</style>
</head>
<body>
<section class="testimonials">
  <div class="testimonials-label" data-ff-anim>お客様の声</div>
  <h2 data-ff-anim data-ff-delay="1">導入企業からの評価</h2>
  <div class="grid">
    <div class="card" data-ff-anim data-ff-delay="2">
      <div class="stars">★★★★★</div>
      <p class="quote">「導入してから3ヶ月で業務効率が40%向上しました。UIが直感的で、チーム全員がすぐに使いこなせています。」</p>
      <div class="author"><div class="avatar">田</div><div><div class="name">田中 裕子</div><div class="role">株式会社〇〇 / 事業部長</div></div></div>
    </div>
    <div class="card" data-ff-anim data-ff-delay="3">
      <div class="stars">★★★★★</div>
      <p class="quote">「他のツールと比較しましたが、コスパと機能のバランスが最高。サポートの対応も迅速で助かっています。」</p>
      <div class="author"><div class="avatar">山</div><div><div class="name">山本 健一</div><div class="role">△△合同会社 / CTO</div></div></div>
    </div>
    <div class="card" data-ff-anim data-ff-delay="4">
      <div class="stars">★★★★★</div>
      <p class="quote">「スタートアップにとって初期コストを抑えながら高機能を使えるのは大きな価値。成長フェーズでも十分に対応できます。」</p>
      <div class="author"><div class="avatar">鈴</div><div><div class="name">鈴木 あや</div><div class="role">□□株式会社 / 代表取締役</div></div></div>
    </div>
  </div>
</section>
<script>
window.addEventListener('message', e => {
  if (!e.data || e.data.type !== 'setLang') return;
  const jp = e.data.lang === 'jp';
  document.querySelectorAll('.jp').forEach(el => el.style.display = jp ? '' : 'none');
  document.querySelectorAll('.en').forEach(el => el.style.display = jp ? 'none' : '');
});
</script>
</body>
</html>
