<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CTA Dark</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans JP','Inter',sans-serif; background: #09090b; }
.sec { padding: 80px 40px; text-align: center; }
.inner { max-width: 600px; margin: 0 auto; }
h2 { font-size: 40px; font-weight: 800; color: #fafafa; line-height: 1.2; margin-bottom: 16px; }
p { color: #a1a1aa; font-size: 17px; line-height: 1.7; margin-bottom: 36px; }
.btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.btn-p { background: #3ACFC6; color: #09090b; padding: 15px 36px; border-radius: 8px; font-weight: 700; text-decoration: none; font-size: 16px; }
.btn-s { border: 1px solid #3f3f46; color: #fafafa; padding: 15px 36px; border-radius: 8px; font-weight: 600; text-decoration: none; font-size: 16px; }
</style>
</head>
<body>
<section class="sec">
  <div class="inner">
    <h2 data-ff-anim><span class="jp">今すぐ始めましょう</h2>
    <p data-ff-anim data-ff-delay="1">無料トライアルで全機能をお試しいただけます。<br>クレジットカード登録不要。</p>
    <div class="btns" data-ff-anim data-ff-delay="2">
      <a href="#" class="btn-p">無料で始める</a>
      <a href="#" class="btn-s">デモを申し込む</a>
    </div>
  </div>
</section>
<script>
window.addEventListener('message', e => {
  if (!e.data || e.data.type !== 'setLang') return;
  const jp = e.data.lang === 'jp';
  document.querySelectorAll('.jp').forEach(el => el.style.display = jp ? '' : 'none');
  document.querySelectorAll('.en').forEach(el => el.style.display = jp ? 'none' : '');
});
</script>
</body>
</html>
