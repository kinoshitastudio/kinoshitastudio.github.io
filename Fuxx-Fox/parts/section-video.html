<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Section Video</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans JP','Inter',sans-serif; background: #fff; }
.sec { padding: 80px 40px; text-align: center; }
.label { font-size: 12px; font-weight: 700; letter-spacing: .12em; color: #6366f1; text-transform: uppercase; margin-bottom: 12px; }
h2 { font-size: 2rem; font-weight: 800; color: #09090b; margin-bottom: 12px; }
.sub { font-size: 15px; color: #71717a; max-width: 480px; margin: 0 auto 48px; line-height: 1.7; }
.video-wrap { max-width: 800px; margin: 0 auto; border-radius: 16px; overflow: hidden; box-shadow: 0 24px 64px rgba(0,0,0,.12); position: relative; }
.video-ratio { position: relative; padding-bottom: 56.25%; background: #09090b; }
.video-thumb { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .6; }
.play-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 72px; height: 72px; background: rgba(255,255,255,.95); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 8px 32px rgba(0,0,0,.3); }
.play-btn svg { width: 28px; height: 28px; fill: #09090b; margin-left: 4px; }
.video-label { position: absolute; bottom: 20px; left: 24px; color: rgba(255,255,255,.8); font-size: 12px; letter-spacing: .08em; }
@media (max-width: 640px) { .sec { padding: 60px 20px; } }
</style>
</head>
<body>
<section class="sec">
  <div class="label"><span class="jp">プロダクト動画</span><span class="en" style="display:none">Watch Video</span></div>
  <h2><span class="jp">2分で全部わかる</span><span class="en" style="display:none">Everything in 2 Minutes</span></h2>
  <p class="sub"><span class="jp">プロダクトの使い方から導入効果まで、短い動画でご紹介します。</span><span class="en" style="display:none">From how to use the product to its impact — all explained in a short video.</span></p>
  <div class="video-wrap">
    <div class="video-ratio">
      <img data-editable="image" class="video-thumb" src="https://images.unsplash.com/photo-1551434678-e076c223a692?w=900&q=80&auto=format&fit=crop" alt="video thumbnail">
      <div class="play-btn">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
      <div class="video-label"><span class="jp">▶ 再生する</span><span class="en" style="display:none">▶ Play</span></div>
    </div>
  </div>
</section>
<script>
window.addEventListener('message', e => {
  if (!e.data || e.data.type !== 'setLang') return;
  const jp = e.data.lang === 'jp';
  document.querySelectorAll('.jp').forEach(el => el.style.display = jp ? '' : 'none');
  document.querySelectorAll('.en').forEach(el => el.style.display = jp ? 'none' : '');
});
</script>
</body>
</html>
