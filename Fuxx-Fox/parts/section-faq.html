<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Section FAQ</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans JP','Inter',sans-serif; background: #fff; }
.faq { max-width: 680px; margin: 0 auto; padding: 80px 24px; }
.faq-label { font-size: 12px; font-weight: 700; letter-spacing: .12em; color: #6366f1; text-transform: uppercase; margin-bottom: 12px; }
h2 { font-size: 2rem; font-weight: 800; color: #09090b; margin-bottom: 48px; }
.item { border-top: 1px solid #e4e4e7; }
.item:last-child { border-bottom: 1px solid #e4e4e7; }
.q { width: 100%; text-align: left; background: none; border: none; padding: 20px 0; display: flex; justify-content: space-between; align-items: center; font-size: 15px; font-weight: 600; color: #09090b; cursor: pointer; gap: 16px; font-family: inherit; }
.icon { width: 20px; height: 20px; border-radius: 50%; background: #f4f4f5; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; transition: transform .2s; }
.item.open .icon { transform: rotate(45deg); }
.a { font-size: 14px; color: #52525b; line-height: 1.75; padding-bottom: 20px; display: none; }
.item.open .a { display: block; }
</style>
</head>
<body>
<section class="faq">
  <div class="faq-label" data-ff-anim>よくある質問</div>
  <h2 data-ff-anim data-ff-delay="1">FAQ</h2>
  <div class="item open" data-ff-anim data-ff-delay="2">
    <button class="q">無料プランはありますか？<span class="icon">+</span></button>
    <div class="a">はい、クレジットカード不要で無料でお使いいただけます。チームメンバー3名まで、主要機能をすべてお試しいただけます。</div>
  </div>
  <div class="item" data-ff-anim data-ff-delay="3">
    <button class="q">解約はいつでもできますか？<span class="icon">+</span></button>
    <div class="a">いつでも解約可能です。解約後も請求期間終了まで引き続きご利用いただけます。</div>
  </div>
  <div class="item" data-ff-anim data-ff-delay="4">
    <button class="q">データのエクスポートはできますか？<span class="icon">+</span></button>
    <div class="a">CSV・JSONなど複数形式でいつでもエクスポート可能です。データは完全にお客様のものです。</div>
  </div>
  <div class="item" data-ff-anim data-ff-delay="5">
    <button class="q">サポートの対応時間は？<span class="icon">+</span></button>
    <div class="a">平日10:00〜18:00にメールサポートを提供しています。プロプラン以上ではチャットサポートもご利用いただけます。</div>
  </div>
</section>
<script>
document.querySelectorAll('.q').forEach(btn => {
  btn.addEventListener('click', () => btn.closest('.item').classList.toggle('open'));
});
window.addEventListener('message', e => {
  if (!e.data || e.data.type !== 'setLang') return;
  const jp = e.data.lang === 'jp';
  document.querySelectorAll('.jp').forEach(el => el.style.display = jp ? '' : 'none');
  document.querySelectorAll('.en').forEach(el => el.style.display = jp ? 'none' : '');
});
</script>
</body>
</html>
