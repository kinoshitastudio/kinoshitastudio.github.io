<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Footer Minimal</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans JP','Inter',sans-serif; background: #fff; }
footer { border-top: 1px solid #e4e4e7; padding: 24px 40px; display: flex; align-items: center; justify-content: space-between; }
.brand { font-weight: 800; font-size: 15px; color: #09090b; }
.links { display: flex; gap: 20px; }
.links a { font-size: 13px; color: #71717a; text-decoration: none; }
.links a:hover { color: #09090b; }
.copy { font-size: 12px; color: #a1a1aa; }
@media (max-width: 600px) { footer { flex-direction: column; gap: 12px; text-align: center; padding: 20px; } }
</style>
</head>
<body>
<footer data-ff-anim>
  <div class="brand">Brand</div>
  <div class="links">
    <a href="#">プライバシー</a>
    <a href="#">利用規約</a>
    <a href="#">お問い合わせ</a>
  </div>
  <div class="copy">© 2026 Brand Inc.</div>
</footer>
<script>
window.addEventListener('message', e => {
  if (!e.data || e.data.type !== 'setLang') return;
  const jp = e.data.lang === 'jp';
  document.querySelectorAll('.jp').forEach(el => el.style.display = jp ? '' : 'none');
  document.querySelectorAll('.en').forEach(el => el.style.display = jp ? 'none' : '');
});
</script>
</body>
</html>
