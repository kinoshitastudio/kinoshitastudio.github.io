<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Section Stats</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans JP','Inter',sans-serif; background: #09090b; }
.stats { padding: 80px 40px; text-align: center; }
.stats-label { font-size: 12px; font-weight: 700; letter-spacing: .12em; color: #818cf8; text-transform: uppercase; margin-bottom: 12px; }
h2 { font-size: 1.9rem; font-weight: 800; color: #fff; margin-bottom: 60px; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.08); border-radius: 16px; overflow: hidden; max-width: 900px; margin: 0 auto; }
.stat { background: #09090b; padding: 40px 24px; }
.num { font-size: 3rem; font-weight: 800; color: #fff; line-height: 1; margin-bottom: 8px; }
.num span { color: #818cf8; }
.lbl { font-size: 13px; color: rgba(255,255,255,.45); }
@media (max-width: 640px) { .grid { grid-template-columns: 1fr 1fr; } .stats { padding: 60px 20px; } }
</style>
</head>
<body>
<section class="stats">
  <div class="stats-label" data-ff-anim>実績</div>
  <h2 data-ff-anim data-ff-delay="1">数字で見る成果</h2>
  <div class="grid">
    <div class="stat" data-ff-anim data-ff-delay="2"><div class="num">12<span>K+</span></div><div class="lbl">導入企業数</div></div>
    <div class="stat" data-ff-anim data-ff-delay="3"><div class="num">98<span>%</span></div><div class="lbl">顧客満足度</div></div>
    <div class="stat" data-ff-anim data-ff-delay="4"><div class="num">4.2<span>x</span></div><div class="lbl">平均生産性向上</div></div>
    <div class="stat" data-ff-anim data-ff-delay="5"><div class="num">24<span>/7</span></div><div class="lbl">サポート対応</div></div>
  </div>
</section>
<script>
window.addEventListener('message', e => {
  if (!e.data || e.data.type !== 'setLang') return;
  const jp = e.data.lang === 'jp';
  document.querySelectorAll('.jp').forEach(el => el.style.display = jp ? '' : 'none');
  document.querySelectorAll('.en').forEach(el => el.style.display = jp ? 'none' : '');
});
</script>
</body>
</html>
