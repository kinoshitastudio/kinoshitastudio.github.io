<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wedding Hero</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Noto+Serif+JP:wght@300;400&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Cormorant Garamond', 'Noto Serif JP', serif; background: #FAF8F5; color: #2C1A0E; overflow-x: hidden; }
.hero { position: relative; min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
.hero-left { position: relative; overflow: hidden; }
.hero-left img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero-right { display: flex; flex-direction: column; justify-content: center; padding: 80px 64px; }
.deco-line { width: 40px; height: 1px; background: #B8977E; margin-bottom: 28px; }
.eyebrow { font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: #B8977E; font-family: 'Noto Sans JP', sans-serif; font-weight: 300; margin-bottom: 20px; }
h1 { font-size: clamp(3rem,4.5vw,5.5rem); font-weight: 300; line-height: 1.15; letter-spacing: -.01em; margin-bottom: 28px; }
h1 em { color: #B8977E; }
.sub { font-size: 15px; line-height: 2; color: rgba(44,26,14,.5); font-weight: 300; font-family: 'Noto Sans JP', sans-serif; max-width: 360px; margin-bottom: 40px; }
.date-badge { display: inline-flex; align-items: center; gap: 16px; padding: 16px 28px; border: 1px solid rgba(184,151,126,.3); margin-bottom: 40px; }
.date-label { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: rgba(44,26,14,.35); font-family: 'Noto Sans JP', sans-serif; }
.date-val { font-size: 22px; font-weight: 300; color: #B8977E; }
.btns { display: flex; gap: 12px; flex-wrap: wrap; }
.btn-p { padding: 15px 36px; background: #2C1A0E; color: #FAF8F5; font-size: 12px; letter-spacing: .15em; text-transform: uppercase; border: none; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; font-weight: 300; }
.btn-s { padding: 15px 32px; border: 1px solid rgba(44,26,14,.25); color: rgba(44,26,14,.6); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; background: transparent; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; font-weight: 300; }
@media (max-width: 768px) { .hero { grid-template-columns: 1fr; } .hero-left { height: 60vw; } .hero-right { padding: 48px 28px; } }
</style>
</head>
<body>
<section class="hero">
  <div class="hero-left" data-ff-anim data-ff-anim-type="fade-left">
    <img data-editable="image" src="https://images.unsplash.com/photo-1519741497674-611481863552?w=900&q=90&auto=format&fit=crop" alt="wedding">
  </div>
  <div class="hero-right">
    <div class="deco-line" data-ff-anim></div>
    <div class="eyebrow" data-ff-anim data-ff-delay="1"><span class="jp">ふたりの物語がはじまる</span><span class="en" style="display:none">Where Your Story Begins</span></div>
    <h1 data-ff-anim data-ff-delay="2">
      <span class="jp">永遠の<br><em>愛を</em><br>誓う日</span>
      <span class="en" style="display:none">The Day<br>You Say<br><em>Forever</em></span>
    </h1>
    <p class="sub" data-ff-anim data-ff-delay="3">
      <span class="jp">おふたりの大切な一日を、私たちがすべてプロデュースします。心に残る、唯一無二のウェディングを。</span>
      <span class="en" style="display:none">We produce every detail of your most precious day — a one-of-a-kind wedding that stays in your heart forever.</span>
    </p>
    <div class="date-badge" data-ff-anim data-ff-delay="3">
      <div>
        <div class="date-label"><span class="jp">ブライダルフェア</span><span class="en" style="display:none">Bridal Fair</span></div>
        <div class="date-val"><span class="jp">毎週末 開催</span><span class="en" style="display:none">Every Weekend</span></div>
      </div>
    </div>
    <div class="btns" data-ff-anim data-ff-delay="4">
      <button class="btn-p"><span class="jp">相談を予約する</span><span class="en" style="display:none">Book Consultation</span></button>
      <button class="btn-s"><span class="jp">式場を見る</span><span class="en" style="display:none">View Venue</span></button>
    </div>
  </div>
</section>
<script>
window.addEventListener('message', e => {
  if (!e.data || e.data.type !== 'setLang') return;
  const jp = e.data.lang === 'jp';
  document.querySelectorAll('.jp').forEach(el => el.style.display = jp ? '' : 'none');
  document.querySelectorAll('.en').forEach(el => el.style.display = jp ? 'none' : '');
});
</script>
</body>
</html>
