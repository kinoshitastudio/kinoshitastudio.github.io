<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Section Timeline</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans JP','Inter',sans-serif; background: #fff; }
.timeline { padding: 80px 40px; max-width: 640px; margin: 0 auto; }
.timeline-label { font-size: 12px; font-weight: 700; letter-spacing: .12em; color: #6366f1; text-transform: uppercase; margin-bottom: 12px; }
h2 { font-size: 2rem; font-weight: 800; color: #09090b; margin-bottom: 48px; }
.items { position: relative; padding-left: 32px; }
.items::before { content: ''; position: absolute; left: 7px; top: 8px; bottom: 8px; width: 2px; background: #e4e4e7; }
.item { position: relative; margin-bottom: 36px; }
.item:last-child { margin-bottom: 0; }
.dot { position: absolute; left: -32px; top: 4px; width: 16px; height: 16px; border-radius: 50%; background: #6366f1; border: 3px solid #fff; box-shadow: 0 0 0 2px #e4e4e7; }
.year { font-size: 12px; font-weight: 700; color: #6366f1; letter-spacing: .08em; margin-bottom: 4px; }
h3 { font-size: 15px; font-weight: 700; color: #09090b; margin-bottom: 6px; }
p { font-size: 13px; color: #71717a; line-height: 1.65; }
@media (max-width: 600px) { .timeline { padding: 60px 20px; } }
</style>
</head>
<body>
<section class="timeline">
  <div class="timeline-label">沿革</div>
  <h2>あゆみ</h2>
  <div class="items">
    <div class="item"><div class="dot"></div><div class="year">2020</div><h3>創業</h3><p>東京にて株式会社〇〇を設立。最初のプロダクトのベータ版をリリース。</p></div>
    <div class="item"><div class="dot"></div><div class="year">2022</div><h3>シリーズA調達</h3><p>3億円の資金調達を完了。チームを20名に拡大し、プロダクト開発を加速。</p></div>
    <div class="item"><div class="dot"></div><div class="year">2024</div><h3>1,000社突破</h3><p>導入企業数が1,000社を突破。エンタープライズ向けプランの提供を開始。</p></div>
    <div class="item"><div class="dot"></div><div class="year">2026</div><h3>グローバル展開</h3><p>アジア・欧米市場への展開を開始。多言語対応・グローバルサポート体制を整備。</p></div>
  </div>
</section>
<script>
window.addEventListener('message', e => {
  if (!e.data || e.data.type !== 'setLang') return;
  const jp = e.data.lang === 'jp';
  document.querySelectorAll('.jp').forEach(el => el.style.display = jp ? '' : 'none');
  document.querySelectorAll('.en').forEach(el => el.style.display = jp ? 'none' : '');
});
</script>
</body>
</html>
