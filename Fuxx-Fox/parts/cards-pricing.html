<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cards Pricing</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans JP','Inter',sans-serif; background: #fff; }
.sec { padding: 80px 40px; }
.inner { max-width: 980px; margin: 0 auto; text-align: center; }
h2 { font-size: 36px; font-weight: 800; color: #09090b; margin-bottom: 12px; }
.sub { color: #71717a; font-size: 16px; margin-bottom: 52px; }
.grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 20px; align-items: start; }
.card { background: #fafafa; border: 1px solid #e4e4e7; border-radius: 16px; padding: 32px 24px; }
.card.featured { background: #09090b; border: 2px solid #3ACFC6; transform: scale(1.04); }
.plan { font-size: 14px; font-weight: 600; color: #71717a; margin-bottom: 8px; }
.card.featured .plan { color: #a1a1aa; }
.price { font-size: 40px; font-weight: 800; color: #09090b; margin-bottom: 4px; }
.card.featured .price { color: #fafafa; }
.period { font-size: 13px; color: #a1a1aa; margin-bottom: 24px; }
.features { display: flex; flex-direction: column; gap: 9px; margin-bottom: 24px; text-align: left; }
.f { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #52525b; }
.card.featured .f { color: #d4d4d8; }
.check { color: #22c55e; }
.cta-btn { display: block; text-align: center; background: #09090b; color: #fff; padding: 12px; border-radius: 8px; font-weight: 600; text-decoration: none; font-size: 14px; }
.card.featured .cta-btn { background: #3ACFC6; color: #09090b; }
@media (max-width: 640px) {
  .sec { padding: 48px 20px; }
  .grid { grid-template-columns: 1fr; gap: 16px; }
  .card.featured { transform: none; }
}
</style>
</head>
<body>
<section class="sec">
  <div class="inner">
    <h2 data-ff-anim>シンプルな料金体系</h2>
    <p class="sub" data-ff-anim data-ff-delay="1">すべてのプランに14日間の無料トライアル付き。</p>
    <div class="grid">
      <div class="card" data-ff-anim data-ff-delay="2">
        <div class="plan">フリー</div><div class="price">¥0</div><div class="period">ずっと無料</div>
        <div class="features"><div class="f"><span class="check">✓</span>最大3プロジェクト</div><div class="f"><span class="check">✓</span>5GBストレージ</div><div class="f"><span class="check">✓</span>メールサポート</div></div>
        <a href="#" class="cta-btn">無料で始める</a>
      </div>
      <div class="card featured" data-ff-anim data-ff-delay="3">
        <div class="plan">スタンダード</div><div class="price">¥2,980</div><div class="period">/ 月</div>
        <div class="features"><div class="f"><span class="check">✓</span>無制限プロジェクト</div><div class="f"><span class="check">✓</span>50GBストレージ</div><div class="f"><span class="check">✓</span>チャットサポート</div><div class="f"><span class="check">✓</span>API連携</div></div>
        <a href="#" class="cta-btn">14日間無料で試す</a>
      </div>
      <div class="card" data-ff-anim data-ff-delay="4">
        <div class="plan">ビジネス</div><div class="price">¥9,800</div><div class="period">/ 月</div>
        <div class="features"><div class="f"><span class="check">✓</span>エンタープライズ向け</div><div class="f"><span class="check">✓</span>500GBストレージ</div><div class="f"><span class="check">✓</span>専任サポート</div><div class="f"><span class="check">✓</span>SLA保証</div></div>
        <a href="#" class="cta-btn">お問い合わせ</a>
      </div>
    </div>
  </div>
</section>
<script>
window.addEventListener('message', e => {
  if (!e.data || e.data.type !== 'setLang') return;
  const jp = e.data.lang === 'jp';
  document.querySelectorAll('.jp').forEach(el => el.style.display = jp ? '' : 'none');
  document.querySelectorAll('.en').forEach(el => el.style.display = jp ? 'none' : '');
});
</script>
</body>
</html>
