<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fashion Collection</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Cormorant Garamond', 'Noto Sans JP', serif; background: #1A1A1A; color: #F9F7F4; }
.sec { padding: 88px 48px; }
.head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 48px; }
h2 { font-size: clamp(2.5rem,4vw,4rem); font-weight: 300; letter-spacing: -.01em; line-height: 1; }
h2 em { }
.view-all { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: rgba(249,247,244,.35); text-decoration: none; border-bottom: 1px solid rgba(249,247,244,.15); padding-bottom: 2px; transition: all .2s; }
.view-all:hover { color: #F9F7F4; border-color: #F9F7F4; }
.grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; }
.item { position: relative; cursor: pointer; }
.item-img { position: relative; overflow: hidden; }
.item-img img { width: 100%; display: block; object-fit: cover; transition: transform .7s cubic-bezier(.25,.46,.45,.94); }
.item:nth-child(1) .item-img img,
.item:nth-child(3) .item-img img { aspect-ratio: 3/4; }
.item:nth-child(2) .item-img img { aspect-ratio: 2/3; }
.item:hover .item-img img { transform: scale(1.04); }
.overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 24px 20px; background: linear-gradient(to top, rgba(26,26,26,.85) 0%, transparent 100%); opacity: 0; transition: opacity .3s; }
.item:hover .overlay { opacity: 1; }
.item-cat { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: rgba(249,247,244,.5); margin-bottom: 6px; }
.item-name { font-size: 18px; font-weight: 300; margin-bottom: 4px; }
.item-name em { }
.item-price { font-size: 14px; color: rgba(249,247,244,.6); font-weight: 300; }
.sold-out { position: absolute; top: 16px; right: 16px; padding: 4px 10px; background: rgba(26,26,26,.8); color: rgba(249,247,244,.6); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; border: 1px solid rgba(249,247,244,.2); }
.item-meta { padding: 14px 0; border-bottom: 1px solid rgba(249,247,244,.06); display: flex; justify-content: space-between; align-items: baseline; }
.item-label { font-size: 14px; font-weight: 300; color: rgba(249,247,244,.7); }
.item-tag { font-size: 10px; letter-spacing: .12em; color: rgba(249,247,244,.25); text-transform: uppercase; }
@media (max-width: 768px) { .grid { grid-template-columns: repeat(2,1fr); gap: 10px; } .sec { padding: 60px 20px; } }
em { font-style: normal; }
</style>
</head>
<body>
<section class="sec">
  <div class="head">
    <h2 data-ff-anim><span class="jp"><em>Collection</em><br>2026 A/W</span><span class="en" style="display:none"><em>Collection</em><br>2026 A/W</span></h2>
    <a href="#" class="view-all" data-ff-anim><span class="jp">すべて見る</span><span class="en" style="display:none">View All</span></a>
  </div>
  <div class="grid">
    <div class="item" data-ff-anim data-ff-delay="2">
      <div class="item-img">
        <img data-editable="image" src="https://images.unsplash.com/photo-1434389677669-e08b4cac3105?w=600&q=85&auto=format&fit=crop" alt="item1">
        <div class="overlay">
          <div class="item-cat"><span class="jp">アウター</span><span class="en" style="display:none">Outerwear</span></div>
          <div class="item-name"><span class="jp"><em>静</em> コート</span><span class="en" style="display:none"><em>Sei</em> Coat</span></div>
          <div class="item-price">¥98,000</div>
        </div>
      </div>
      <div class="item-meta">
        <div class="item-label"><span class="jp">静コート</span><span class="en" style="display:none">Sei Coat</span></div>
        <div class="item-tag">¥98,000</div>
      </div>
    </div>
    <div class="item" data-ff-anim data-ff-delay="3">
      <div class="item-img">
        <img data-editable="image" src="https://images.unsplash.com/photo-1539109136881-3be0616acf4b?w=600&q=85&auto=format&fit=crop" alt="item2">
        <div class="overlay">
          <div class="item-cat"><span class="jp">ドレス</span><span class="en" style="display:none">Dress</span></div>
          <div class="item-name"><span class="jp"><em>間</em> ドレス</span><span class="en" style="display:none"><em>Ma</em> Dress</span></div>
          <div class="item-price">¥76,000</div>
        </div>
        <div class="sold-out"><span class="jp">売り切れ</span><span class="en" style="display:none">Sold Out</span></div>
      </div>
      <div class="item-meta">
        <div class="item-label"><span class="jp">間ドレス</span><span class="en" style="display:none">Ma Dress</span></div>
        <div class="item-tag">SOLD OUT</div>
      </div>
    </div>
    <div class="item" data-ff-anim data-ff-delay="4">
      <div class="item-img">
        <img data-editable="image" src="https://images.unsplash.com/photo-1509631179647-0177331693ae?w=600&q=85&auto=format&fit=crop" alt="item3">
        <div class="overlay">
          <div class="item-cat"><span class="jp">トップス</span><span class="en" style="display:none">Tops</span></div>
          <div class="item-name"><span class="jp"><em>空</em> ブラウス</span><span class="en" style="display:none"><em>Sora</em> Blouse</span></div>
          <div class="item-price">¥52,000</div>
        </div>
      </div>
      <div class="item-meta">
        <div class="item-label"><span class="jp">空ブラウス</span><span class="en" style="display:none">Sora Blouse</span></div>
        <div class="item-tag">¥52,000</div>
      </div>
    </div>
  </div>
</section>
<script>
window.addEventListener('message', e => {
  if (!e.data || e.data.type !== 'setLang') return;
  const jp = e.data.lang === 'jp';
  document.querySelectorAll('.jp').forEach(el => el.style.display = jp ? '' : 'none');
  document.querySelectorAll('.en').forEach(el => el.style.display = jp ? 'none' : '');
});
</script>
</body>
</html>
