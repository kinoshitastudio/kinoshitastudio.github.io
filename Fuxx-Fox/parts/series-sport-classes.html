<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sport Classes</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', 'Noto Sans JP', sans-serif; background: #0F0F14; color: #F5F5F5; }
.sec { padding: 80px 48px; }
.head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 48px; }
.head-left { }
.label { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #FF3D00; margin-bottom: 10px; font-weight: 700; }
h2 { font-size: clamp(2rem,3.5vw,3rem); font-weight: 800; letter-spacing: -.03em; }
.filter { display: flex; gap: 8px; }
.f-btn { padding: 8px 18px; border-radius: 100px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; border: 1px solid rgba(245,245,245,.15); color: rgba(245,245,245,.45); background: transparent; cursor: pointer; font-family: inherit; }
.f-btn.on { border-color: #FF3D00; color: #FF3D00; background: rgba(255,61,0,.1); }
.grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; }
.card { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.07); border-radius: 12px; overflow: hidden; position: relative; }
.card-img { width: 100%; aspect-ratio: 16/9; object-fit: cover; opacity: .7; display: block; }
.card-body { padding: 20px; }
.card-tag { display: inline-block; background: rgba(255,61,0,.15); color: #FF6B35; font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; padding: 3px 10px; border-radius: 100px; margin-bottom: 10px; }
.card-name { font-size: 17px; font-weight: 700; margin-bottom: 6px; letter-spacing: -.01em; }
.card-meta { display: flex; gap: 16px; margin-bottom: 12px; }
.card-meta-item { font-size: 12px; color: rgba(245,245,245,.4); display: flex; align-items: center; gap: 4px; }
.card-badge { position: absolute; top: 12px; right: 12px; background: #FF3D00; color: #fff; font-size: 9px; font-weight: 800; letter-spacing: .1em; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; }
.card-level { width: 100%; height: 3px; background: rgba(255,255,255,.08); border-radius: 2px; overflow: hidden; }
.card-level-fill { height: 100%; background: linear-gradient(90deg, #FF3D00, #FF6B35); border-radius: 2px; }
@media (max-width: 768px) { .grid { grid-template-columns: 1fr; } .sec { padding: 60px 20px; } .head { flex-direction: column; align-items: flex-start; gap: 20px; } }
</style>
</head>
<body>
<section class="sec">
  <div class="head">
    <div class="head-left">
      <div class="label" data-ff-anim><span class="jp">クラス一覧</span><span class="en" style="display:none">All Classes</span></div>
      <h2 data-ff-anim data-ff-delay="1"><span class="jp">あなたに合った<br>プログラムを</span><span class="en" style="display:none">Find Your<br>Perfect Program</span></h2>
    </div>
    <div class="filter" data-ff-anim data-ff-delay="1">
      <button class="f-btn on"><span class="jp">すべて</span><span class="en" style="display:none">All</span></button>
      <button class="f-btn"><span class="jp">筋トレ</span><span class="en" style="display:none">Strength</span></button>
      <button class="f-btn"><span class="jp">有酸素</span><span class="en" style="display:none">Cardio</span></button>
    </div>
  </div>
  <div class="grid">
    <div class="card" data-ff-anim data-ff-delay="2">
      <img class="card-img" data-editable="image" src="https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?w=600&q=80&auto=format&fit=crop" alt="class">
      <div class="card-badge">NEW</div>
      <div class="card-body">
        <div class="card-tag"><span class="jp">筋トレ</span><span class="en" style="display:none">Strength</span></div>
        <div class="card-name"><span class="jp">パワーリフティング</span><span class="en" style="display:none">Power Lifting</span></div>
        <div class="card-meta">
          <span class="card-meta-item">⏱ 60min</span>
          <span class="card-meta-item">🔥 <span class="jp">高強度</span><span class="en" style="display:none">High</span></span>
        </div>
        <div class="card-level"><div class="card-level-fill" style="width:85%"></div></div>
      </div>
    </div>
    <div class="card" data-ff-anim data-ff-delay="3">
      <img class="card-img" data-editable="image" src="https://images.unsplash.com/photo-1518611012118-696072aa579a?w=600&q=80&auto=format&fit=crop" alt="class2">
      <div class="card-body">
        <div class="card-tag"><span class="jp">有酸素</span><span class="en" style="display:none">Cardio</span></div>
        <div class="card-name"><span class="jp">HIT サーキット</span><span class="en" style="display:none">HIIT Circuit</span></div>
        <div class="card-meta">
          <span class="card-meta-item">⏱ 45min</span>
          <span class="card-meta-item">🔥 <span class="jp">超高強度</span><span class="en" style="display:none">Intense</span></span>
        </div>
        <div class="card-level"><div class="card-level-fill" style="width:100%"></div></div>
      </div>
    </div>
    <div class="card" data-ff-anim data-ff-delay="4">
      <img class="card-img" data-editable="image" src="https://images.unsplash.com/photo-1506126613408-eca07ce68773?w=600&q=80&auto=format&fit=crop" alt="class3">
      <div class="card-body">
        <div class="card-tag"><span class="jp">リカバリー</span><span class="en" style="display:none">Recovery</span></div>
        <div class="card-name"><span class="jp">ヨガ & ストレッチ</span><span class="en" style="display:none">Yoga & Stretch</span></div>
        <div class="card-meta">
          <span class="card-meta-item">⏱ 60min</span>
          <span class="card-meta-item">🌿 <span class="jp">低強度</span><span class="en" style="display:none">Low</span></span>
        </div>
        <div class="card-level"><div class="card-level-fill" style="width:35%"></div></div>
      </div>
    </div>
  </div>
</section>
<script>
window.addEventListener('message', e => {
  if (!e.data || e.data.type !== 'setLang') return;
  const jp = e.data.lang === 'jp';
  document.querySelectorAll('.jp').forEach(el => el.style.display = jp ? '' : 'none');
  document.querySelectorAll('.en').forEach(el => el.style.display = jp ? 'none' : '');
});
</script>
</body>
</html>
