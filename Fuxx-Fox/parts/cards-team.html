<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cards Team</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans JP','Inter',sans-serif; background: #fafafa; }
.team { padding: 80px 40px; }
.team-label { font-size: 12px; font-weight: 700; letter-spacing: .12em; color: #6366f1; text-transform: uppercase; margin-bottom: 12px; }
h2 { font-size: 2rem; font-weight: 800; color: #09090b; margin-bottom: 48px; }
.grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 20px; max-width: 900px; }
.card { background: #fff; border: 1px solid #e4e4e7; border-radius: 14px; padding: 28px 20px; text-align: center; }
.avatar { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; color: #fff; }
.a1 { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
.a2 { background: linear-gradient(135deg, #06b6d4, #0284c7); }
.a3 { background: linear-gradient(135deg, #10b981, #059669); }
.a4 { background: linear-gradient(135deg, #f59e0b, #ef4444); }
.name { font-size: 14px; font-weight: 700; color: #09090b; margin-bottom: 4px; }
.role { font-size: 12px; color: #71717a; margin-bottom: 12px; }
.bio { font-size: 12px; color: #a1a1aa; line-height: 1.6; }
@media (max-width: 768px) { .grid { grid-template-columns: 1fr 1fr; } .team { padding: 60px 20px; } }
</style>
</head>
<body>
<section class="team">
  <div class="team-label" data-ff-anim>チーム</div>
  <h2 data-ff-anim data-ff-delay="1">メンバー紹介</h2>
  <div class="grid">
    <div class="card" data-ff-anim data-ff-delay="2"><div class="avatar a1">田</div><div class="name">田中 太郎</div><div class="role">CEO / 代表取締役</div><div class="bio">10年以上のスタートアップ経験。プロダクト戦略を担当。</div></div>
    <div class="card" data-ff-anim data-ff-delay="3"><div class="avatar a2">山</div><div class="name">山田 花子</div><div class="role">CTO / 技術責任者</div><div class="bio">元大手IT企業エンジニア。インフラ・AIが専門。</div></div>
    <div class="card" data-ff-anim data-ff-delay="4"><div class="avatar a3">鈴</div><div class="name">鈴木 健</div><div class="role">デザイナー</div><div class="bio">UX/UIデザイン歴8年。ユーザー体験設計を主導。</div></div>
    <div class="card" data-ff-anim data-ff-delay="5"><div class="avatar a4">中</div><div class="name">中村 あや</div><div class="role">マーケティング</div><div class="bio">BtoBマーケ専門。コンテンツ・SEO戦略を担当。</div></div>
  </div>
</section>
<script>
window.addEventListener('message', e => {
  if (!e.data || e.data.type !== 'setLang') return;
  const jp = e.data.lang === 'jp';
  document.querySelectorAll('.jp').forEach(el => el.style.display = jp ? '' : 'none');
  document.querySelectorAll('.en').forEach(el => el.style.display = jp ? 'none' : '');
});
</script>
</body>
</html>
