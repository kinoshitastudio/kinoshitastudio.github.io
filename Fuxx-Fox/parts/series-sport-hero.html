<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sport Hero</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', 'Noto Sans JP', sans-serif; background: #0A0A0F; color: #F5F5F5; overflow-x: hidden; }
.hero { position: relative; min-height: 100vh; display: flex; align-items: center; }
.bg-img { position: absolute; inset: 0; object-fit: cover; width: 100%; height: 100%; opacity: .35; }
.overlay { position: absolute; inset: 0; background: linear-gradient(135deg, rgba(10,10,15,.9) 0%, rgba(255,61,0,.08) 100%); }
.content { position: relative; z-index: 2; padding: 80px 64px; max-width: 760px; }
.badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,61,0,.15); border: 1px solid rgba(255,61,0,.4); color: #FF6B35; font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; padding: 6px 16px; border-radius: 100px; margin-bottom: 28px; }
.badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #FF3D00; }
h1 { font-size: clamp(3.5rem,7vw,7rem); font-weight: 900; line-height: 1.0; letter-spacing: -.04em; text-transform: uppercase; margin-bottom: 24px; }
h1 span.accent { color: #FF3D00; }
.sub { font-size: 16px; line-height: 1.8; color: rgba(245,245,245,.55); max-width: 440px; margin-bottom: 40px; font-weight: 300; }
.btns { display: flex; gap: 14px; flex-wrap: wrap; }
.btn-p { background: #FF3D00; color: #fff; padding: 16px 40px; font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; border: none; cursor: pointer; font-family: inherit; clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px)); }
.btn-s { border: 1px solid rgba(245,245,245,.25); color: rgba(245,245,245,.75); padding: 16px 36px; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; background: transparent; cursor: pointer; font-family: inherit; }
.stats { position: absolute; right: 64px; bottom: 64px; z-index: 2; display: flex; gap: 40px; }
.stat-val { font-size: 2.8rem; font-weight: 900; letter-spacing: -.04em; color: #FF3D00; line-height: 1; }
.stat-label { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: rgba(245,245,245,.35); margin-top: 4px; }
@media (max-width: 768px) { .content { padding: 60px 28px; } .stats { position: static; padding: 0 28px 48px; gap: 24px; } h1 { font-size: 3.2rem; } .hero { flex-direction: column; } }
</style>
</head>
<body>
<section class="hero">
  <img class="bg-img" data-editable="image" src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=1400&q=85&auto=format&fit=crop" alt="gym">
  <div class="overlay"></div>
  <div class="content">
    <div class="badge" data-ff-anim><span class="jp">2026年 新規オープン</span><span class="en" style="display:none">Now Open 2026</span></div>
    <h1 data-ff-anim data-ff-delay="1">
      <span class="jp">限界を<br><span class="accent">超えろ。</span></span>
      <span class="en" style="display:none">PUSH YOUR<br><span class="accent">LIMITS.</span></span>
    </h1>
    <p class="sub" data-ff-anim data-ff-delay="2">
      <span class="jp">最高の設備と専属トレーナーが、あなたの理想の身体へ導きます。今日から変わる。</span>
      <span class="en" style="display:none">State-of-the-art equipment and personal trainers to guide you toward your best self. Start today.</span>
    </p>
    <div class="btns" data-ff-anim data-ff-delay="3">
      <button class="btn-p"><span class="jp">無料体験を予約</span><span class="en" style="display:none">Book Free Trial</span></button>
      <button class="btn-s"><span class="jp">施設を見る</span><span class="en" style="display:none">Tour Facility</span></button>
    </div>
  </div>
  <div class="stats" data-ff-anim data-ff-delay="4">
    <div>
      <div class="stat-val">500<span style="font-size:1.4rem">+</span></div>
      <div class="stat-label"><span class="jp">会員数</span><span class="en" style="display:none">Members</span></div>
    </div>
    <div>
      <div class="stat-val">40<span style="font-size:1.4rem">+</span></div>
      <div class="stat-label"><span class="jp">週間クラス</span><span class="en" style="display:none">Classes/wk</span></div>
    </div>
    <div>
      <div class="stat-val">12</div>
      <div class="stat-label"><span class="jp">専属トレーナー</span><span class="en" style="display:none">Trainers</span></div>
    </div>
  </div>
</section>
<script>
window.addEventListener('message', e => {
  if (!e.data || e.data.type !== 'setLang') return;
  const jp = e.data.lang === 'jp';
  document.querySelectorAll('.jp').forEach(el => el.style.display = jp ? '' : 'none');
  document.querySelectorAll('.en').forEach(el => el.style.display = jp ? 'none' : '');
});
</script>
</body>
</html>
