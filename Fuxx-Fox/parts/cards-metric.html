<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cards Metric</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans JP','Inter',sans-serif; background: #09090b; color: #fff; }
.sec { padding: 88px 40px; }
.label { font-size: 11px; font-weight: 700; letter-spacing: .18em; color: #34d399; text-transform: uppercase; margin-bottom: 14px; }
h2 { font-size: 2.2rem; font-weight: 800; color: #f1f5f9; margin-bottom: 12px; }
.sub { font-size: 15px; color: #64748b; margin-bottom: 52px; max-width: 480px; line-height: 1.7; }
.grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; max-width: 1040px; }
.card { background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; padding: 28px 24px; position: relative; overflow: hidden; }
.card::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px; }
.card.up::after { background: linear-gradient(to right, #34d399, transparent); }
.card.down::after { background: linear-gradient(to right, #f87171, transparent); }
.card.neutral::after { background: linear-gradient(to right, #64748b, transparent); }
.card-label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #64748b; margin-bottom: 16px; }
.val { font-size: 2.4rem; font-weight: 800; color: #f1f5f9; letter-spacing: -.02em; line-height: 1; margin-bottom: 12px; }
.val span { font-size: 1.1rem; font-weight: 600; color: #64748b; }
.trend { display: flex; align-items: center; gap: 6px; margin-bottom: 16px; }
.arrow { font-size: 14px; font-weight: 700; }
.up .arrow { color: #34d399; }
.down .arrow { color: #f87171; }
.trend-val { font-size: 13px; font-weight: 700; }
.up .trend-val { color: #34d399; }
.down .trend-val { color: #f87171; }
.neutral .trend-val { color: #64748b; }
.trend-period { font-size: 11px; color: #475569; }
.sparkline { width: 100%; height: 40px; }
.sparkline polyline { fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.up .sparkline polyline { stroke: #34d399; }
.down .sparkline polyline { stroke: #f87171; }
.neutral .sparkline polyline { stroke: #64748b; }
.sparkline .area { stroke: none; }
.up .sparkline .area { fill: rgba(52,211,153,.08); }
.down .sparkline .area { fill: rgba(248,113,113,.08); }
.neutral .sparkline .area { fill: rgba(100,116,139,.08); }
@media (max-width: 900px) { .grid { grid-template-columns: repeat(2,1fr); } }
@media (max-width: 520px) { .grid { grid-template-columns: 1fr; } .sec { padding: 60px 20px; } h2 { font-size: 1.7rem; } }
</style>
</head>
<body>
<section class="sec">
  <div class="label" data-ff-anim><span class="jp">実績</span><span class="en" style="display:none">Metrics</span></div>
  <h2 data-ff-anim data-ff-delay="1"><span class="jp">今月の主要指標</span><span class="en" style="display:none">Key Metrics This Month</span></h2>
  <p class="sub" data-ff-anim data-ff-delay="2"><span class="jp">リアルタイムで追跡するビジネスの核心数値です。</span><span class="en" style="display:none">Core business numbers tracked in real time.</span></p>
  <div class="grid">
    <div class="card up" data-ff-anim data-ff-delay="3">
      <div class="card-label"><span class="jp">月次売上</span><span class="en" style="display:none">Monthly Revenue</span></div>
      <div class="val">¥4.2<span><span class="jp">M</span><span class="en" style="display:none">M</span></span></div>
      <div class="trend"><span class="arrow">↑</span><span class="trend-val">+18.4%</span><span class="trend-period"><span class="jp">前月比</span><span class="en" style="display:none">vs last month</span></span></div>
      <svg class="sparkline" viewBox="0 0 120 40" preserveAspectRatio="none">
        <polygon class="area" points="0,40 10,32 25,28 40,20 55,24 70,14 85,10 100,6 120,8 120,40" />
        <polyline points="0,32 10,32 25,28 40,20 55,24 70,14 85,10 100,6 120,8" />
      </svg>
    </div>
    <div class="card up" data-ff-anim data-ff-delay="3">
      <div class="card-label"><span class="jp">アクティブユーザー</span><span class="en" style="display:none">Active Users</span></div>
      <div class="val">12,847</div>
      <div class="trend"><span class="arrow">↑</span><span class="trend-val">+9.2%</span><span class="trend-period"><span class="jp">前月比</span><span class="en" style="display:none">vs last month</span></span></div>
      <svg class="sparkline" viewBox="0 0 120 40" preserveAspectRatio="none">
        <polygon class="area" points="0,40 10,36 25,30 40,28 55,22 70,18 85,16 100,12 120,10 120,40" />
        <polyline points="0,36 10,36 25,30 40,28 55,22 70,18 85,16 100,12 120,10" />
      </svg>
    </div>
    <div class="card down" data-ff-anim data-ff-delay="4">
      <div class="card-label"><span class="jp">解約率</span><span class="en" style="display:none">Churn Rate</span></div>
      <div class="val">2.1<span>%</span></div>
      <div class="trend"><span class="arrow">↓</span><span class="trend-val">-0.4pt</span><span class="trend-period"><span class="jp">前月比</span><span class="en" style="display:none">vs last month</span></span></div>
      <svg class="sparkline" viewBox="0 0 120 40" preserveAspectRatio="none">
        <polygon class="area" points="0,40 10,14 25,18 40,22 55,16 70,20 85,24 100,28 120,30 120,40" />
        <polyline points="0,14 10,14 25,18 40,22 55,16 70,20 85,24 100,28 120,30" />
      </svg>
    </div>
    <div class="card neutral" data-ff-anim data-ff-delay="4">
      <div class="card-label">NPS</div>
      <div class="val">72</div>
      <div class="trend"><span class="arrow">→</span><span class="trend-val">±0</span><span class="trend-period"><span class="jp">前月比</span><span class="en" style="display:none">vs last month</span></span></div>
      <svg class="sparkline" viewBox="0 0 120 40" preserveAspectRatio="none">
        <polygon class="area" points="0,40 10,22 25,24 40,20 55,22 70,18 85,22 100,20 120,22 120,40" />
        <polyline points="0,22 10,22 25,24 40,20 55,22 70,18 85,22 100,20 120,22" />
      </svg>
    </div>
  </div>
</section>
<script>
window.addEventListener('message', e => {
  if (!e.data || e.data.type !== 'setLang') return;
  const jp = e.data.lang === 'jp';
  document.querySelectorAll('.jp').forEach(el => el.style.display = jp ? '' : 'none');
  document.querySelectorAll('.en').forEach(el => el.style.display = jp ? 'none' : '');
});
</script>
</body>
</html>
