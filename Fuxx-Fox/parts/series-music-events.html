<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Events</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Syne', 'Noto Sans JP', sans-serif; background: #0D0D14; color: #F8F8FF; }
.sec { padding: 80px 60px; }
.head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 48px; }
.label { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #A855F7; font-weight: 700; margin-bottom: 10px; }
h2 { font-size: clamp(2rem,3.5vw,3.2rem); font-weight: 800; letter-spacing: -.03em; }
.view-all { font-size: 11px; letter-spacing: .15em; text-transform: uppercase; color: rgba(248,248,255,.3); border-bottom: 1px solid rgba(248,248,255,.1); padding-bottom: 2px; text-decoration: none; }
.list { display: flex; flex-direction: column; gap: 0; }
.event { display: grid; grid-template-columns: 80px 1fr auto; gap: 24px; align-items: center; padding: 24px 0; border-bottom: 1px solid rgba(248,248,255,.06); position: relative; }
.event::before { content: ''; position: absolute; left: -60px; right: -60px; top: 0; bottom: 0; background: rgba(168,85,247,.04); opacity: 0; transition: opacity .2s; border-radius: 8px; }
.event:hover::before { opacity: 1; }
.event-date { text-align: center; }
.date-day { font-size: 2.5rem; font-weight: 800; letter-spacing: -.04em; line-height: 1; color: #A855F7; }
.date-mon { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: rgba(248,248,255,.35); font-weight: 600; }
.event-info { }
.event-city { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: rgba(248,248,255,.35); margin-bottom: 6px; font-weight: 600; }
.event-venue { font-size: 18px; font-weight: 700; margin-bottom: 4px; letter-spacing: -.01em; }
.event-tags { display: flex; gap: 8px; }
.etag { font-size: 10px; letter-spacing: .1em; color: rgba(248,248,255,.35); border: 1px solid rgba(248,248,255,.1); padding: 2px 8px; border-radius: 100px; }
.etag.sold { border-color: rgba(239,68,68,.3); color: #F87171; }
.event-btn { padding: 10px 24px; border: 1px solid rgba(168,85,247,.4); color: #A855F7; font-size: 12px; font-weight: 700; background: transparent; border-radius: 100px; cursor: pointer; font-family: inherit; white-space: nowrap; }
.event-btn.sold { border-color: rgba(248,248,255,.1); color: rgba(248,248,255,.25); cursor: default; }
@media (max-width: 640px) { .event { grid-template-columns: 60px 1fr; } .event-btn { display: none; } .sec { padding: 60px 20px; } }
</style>
</head>
<body>
<section class="sec">
  <div class="head">
    <div>
      <div class="label" data-ff-anim><span class="jp">ツアー日程</span><span class="en" style="display:none">Tour Dates</span></div>
      <h2 data-ff-anim data-ff-delay="1"><span class="jp">VOID TOUR 2026</span><span class="en" style="display:none">VOID TOUR 2026</span></h2>
    </div>
    <a href="#" class="view-all" data-ff-anim data-ff-delay="1"><span class="jp">すべて見る</span><span class="en" style="display:none">See All</span></a>
  </div>
  <div class="list">
    <div class="event" data-ff-anim data-ff-delay="2">
      <div class="event-date"><div class="date-day">14</div><div class="date-mon">JUN</div></div>
      <div class="event-info">
        <div class="event-city"><span class="jp">東京</span><span class="en" style="display:none">Tokyo</span></div>
        <div class="event-venue"><span class="jp">Zepp Shinjuku</span><span class="en" style="display:none">Zepp Shinjuku</span></div>
        <div class="event-tags"><span class="etag sold">SOLD OUT</span></div>
      </div>
      <button class="event-btn sold" disabled><span class="jp">完売</span><span class="en" style="display:none">Sold Out</span></button>
    </div>
    <div class="event" data-ff-anim data-ff-delay="3">
      <div class="event-date"><div class="date-day">21</div><div class="date-mon">JUN</div></div>
      <div class="event-info">
        <div class="event-city"><span class="jp">大阪</span><span class="en" style="display:none">Osaka</span></div>
        <div class="event-venue"><span class="jp">なんばHatch</span><span class="en" style="display:none">Namba Hatch</span></div>
        <div class="event-tags"><span class="etag"><span class="jp">残席わずか</span><span class="en" style="display:none">Almost Full</span></span></div>
      </div>
      <button class="event-btn"><span class="jp">チケット</span><span class="en" style="display:none">Tickets</span></button>
    </div>
    <div class="event" data-ff-anim data-ff-delay="4">
      <div class="event-date"><div class="date-day">28</div><div class="date-mon">JUN</div></div>
      <div class="event-info">
        <div class="event-city"><span class="jp">名古屋</span><span class="en" style="display:none">Nagoya</span></div>
        <div class="event-venue"><span class="jp">ボトムライン</span><span class="en" style="display:none">Bottom Line</span></div>
        <div class="event-tags"><span class="etag"><span class="jp">販売中</span><span class="en" style="display:none">Available</span></span></div>
      </div>
      <button class="event-btn"><span class="jp">チケット</span><span class="en" style="display:none">Tickets</span></button>
    </div>
    <div class="event" data-ff-anim data-ff-delay="5">
      <div class="event-date"><div class="date-day">05</div><div class="date-mon">JUL</div></div>
      <div class="event-info">
        <div class="event-city"><span class="jp">福岡</span><span class="en" style="display:none">Fukuoka</span></div>
        <div class="event-venue"><span class="jp">Zepp Fukuoka</span><span class="en" style="display:none">Zepp Fukuoka</span></div>
        <div class="event-tags"><span class="etag"><span class="jp">販売中</span><span class="en" style="display:none">Available</span></span></div>
      </div>
      <button class="event-btn"><span class="jp">チケット</span><span class="en" style="display:none">Tickets</span></button>
    </div>
  </div>
</section>
<script>
window.addEventListener('message', e => {
  if (!e.data || e.data.type !== 'setLang') return;
  const jp = e.data.lang === 'jp';
  document.querySelectorAll('.jp').forEach(el => el.style.display = jp ? '' : 'none');
  document.querySelectorAll('.en').forEach(el => el.style.display = jp ? 'none' : '');
});
</script>
</body>
</html>
