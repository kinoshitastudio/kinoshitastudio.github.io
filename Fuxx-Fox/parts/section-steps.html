<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Section Steps</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans JP','Inter',sans-serif; background: #fafafa; }
.sec { padding: 80px 40px; }
.inner { max-width: 680px; margin: 0 auto; text-align: center; }
h2 { font-size: 36px; font-weight: 800; color: #09090b; margin-bottom: 48px; }
.step { display: flex; align-items: flex-start; gap: 24px; text-align: left; padding: 28px 0; border-bottom: 1px solid #e4e4e7; }
.step:last-child { border-bottom: none; }
.num { width: 40px; height: 40px; background: #09090b; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 16px; flex-shrink: 0; }
h3 { font-size: 18px; font-weight: 700; color: #09090b; margin-bottom: 8px; }
p { color: #71717a; font-size: 14px; line-height: 1.7; }
</style>
</head>
<body>
<section class="sec">
  <div class="inner">
    <h2 data-ff-anim>かんたん3ステップ</h2>
    <div class="step" data-ff-anim data-ff-delay="1"><div class="num">1</div><div><h3>アカウント登録</h3><p>メールアドレスだけで30秒で完了します。クレジットカード不要。</p></div></div>
    <div class="step" data-ff-anim data-ff-delay="2"><div class="num">2</div><div><h3>設定する</h3><p>シンプルなウィザードに沿って設定。ガイドが丁寧にサポートします。</p></div></div>
    <div class="step" data-ff-anim data-ff-delay="3"><div class="num">3</div><div><h3>利用開始</h3><p>設定完了後すぐに使い始められます。いつでも解約できます。</p></div></div>
  </div>
</section>
<script>
window.addEventListener('message', e => {
  if (!e.data || e.data.type !== 'setLang') return;
  const jp = e.data.lang === 'jp';
  document.querySelectorAll('.jp').forEach(el => el.style.display = jp ? '' : 'none');
  document.querySelectorAll('.en').forEach(el => el.style.display = jp ? 'none' : '');
});
</script>
</body>
</html>
