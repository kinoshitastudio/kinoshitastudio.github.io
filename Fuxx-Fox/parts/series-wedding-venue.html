<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wedding Venue</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Cormorant Garamond', serif; background: #FAF8F5; color: #2C1A0E; }
.sec { padding: 88px 60px; }
.head { text-align: center; margin-bottom: 56px; }
.eyebrow { font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: #B8977E; font-family: 'Noto Sans JP', sans-serif; font-weight: 300; margin-bottom: 14px; }
h2 { font-size: clamp(2.2rem,3.5vw,3.8rem); font-weight: 300; }
h2 em { color: #B8977E; }
.gallery { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto; gap: 12px; margin-bottom: 48px; }
.g-main { grid-row: 1 / 3; }
.g-main img { width: 100%; height: 100%; object-fit: cover; display: block; aspect-ratio: 2/3; }
.g-sub img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; }
.features { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border-top: 1px solid rgba(44,26,14,.1); border-left: 1px solid rgba(44,26,14,.1); }
.feat { padding: 28px 24px; border-right: 1px solid rgba(44,26,14,.1); border-bottom: 1px solid rgba(44,26,14,.1); }
.feat-icon { font-size: 24px; margin-bottom: 10px; }
.feat-label { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: rgba(44,26,14,.35); font-family: 'Noto Sans JP', sans-serif; font-weight: 300; margin-bottom: 6px; }
.feat-val { font-size: 17px; font-weight: 300; }
.feat-val em { color: #B8977E; }
@media (max-width: 768px) { .gallery { grid-template-columns: 1fr; } .g-main { grid-row: auto; } .features { grid-template-columns: repeat(2,1fr); } .sec { padding: 60px 28px; } }
em { font-style: normal; }
</style>
</head>
<body>
<section class="sec">
  <div class="head">
    <div class="eyebrow" data-ff-anim><span class="jp">会場案内</span><span class="en" style="display:none">Our Venue</span></div>
    <h2 data-ff-anim data-ff-delay="1"><span class="jp">特別な<br><em>空間</em>で</span><span class="en" style="display:none">A <em>Space</em><br>Like No Other</span></h2>
  </div>
  <div class="gallery" data-ff-anim data-ff-delay="2">
    <div class="g-main"><img data-editable="image" src="https://images.unsplash.com/photo-1464366400600-7168b8af9bc3?w=700&q=85&auto=format&fit=crop" alt="venue main"></div>
    <div class="g-sub"><img data-editable="image" src="https://images.unsplash.com/photo-1519225421980-715cb0215aed?w=600&q=80&auto=format&fit=crop" alt="venue 2"></div>
    <div class="g-sub"><img data-editable="image" src="https://images.unsplash.com/photo-1507504031003-b417219a0fde?w=600&q=80&auto=format&fit=crop" alt="venue 3"></div>
  </div>
  <div class="features" data-ff-anim data-ff-delay="3">
    <div class="feat">
      <div class="feat-icon">🕊️</div>
      <div class="feat-label"><span class="jp">収容人数</span><span class="en" style="display:none">Capacity</span></div>
      <div class="feat-val"><em>80</em> <span class="jp">名</span><span class="en" style="display:none">guests</span></div>
    </div>
    <div class="feat">
      <div class="feat-icon">🌸</div>
      <div class="feat-label"><span class="jp">スタイル</span><span class="en" style="display:none">Style</span></div>
      <div class="feat-val"><span class="jp"><em>和</em>洋折衷</span><span class="en" style="display:none">Japanese &amp; <em>Western</em></span></div>
    </div>
    <div class="feat">
      <div class="feat-icon">🍽️</div>
      <div class="feat-label"><span class="jp">料理</span><span class="en" style="display:none">Cuisine</span></div>
      <div class="feat-val"><em><span class="jp">フレンチ</span><span class="en" style="display:none">French</span></em></div>
    </div>
    <div class="feat">
      <div class="feat-icon">📍</div>
      <div class="feat-label"><span class="jp">アクセス</span><span class="en" style="display:none">Access</span></div>
      <div class="feat-val"><span class="jp">駅徒歩 <em>3</em>分</span><span class="en" style="display:none"><em>3</em>min walk</span></div>
    </div>
  </div>
</section>
<script>
window.addEventListener('message', e => {
  if (!e.data || e.data.type !== 'setLang') return;
  const jp = e.data.lang === 'jp';
  document.querySelectorAll('.jp').forEach(el => el.style.display = jp ? '' : 'none');
  document.querySelectorAll('.en').forEach(el => el.style.display = jp ? 'none' : '');
});
</script>
</body>
</html>
