<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero Minimal</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans JP','Inter',sans-serif; background: #fafafa; }
.hero { padding: 100px 40px; text-align: center; background: linear-gradient(135deg, #f0f4ff 0%, #fafafa 60%, #fff0f6 100%); }
.badge { display: inline-block; background: #eef2ff; color: #4f46e5; font-size: 11px; font-weight: 700; letter-spacing: .12em; padding: 5px 14px; border-radius: 999px; margin-bottom: 28px; text-transform: uppercase; }
h1 { font-size: clamp(2.4rem, 5vw, 4rem); font-weight: 900; color: #09090b; line-height: 1.15; letter-spacing: -.02em; margin-bottom: 24px; }
.sub { font-size: 1.05rem; color: #52525b; line-height: 1.8; max-width: 520px; margin: 0 auto 40px; }
.btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.btn-primary { background: #09090b; color: #fff; padding: 14px 32px; border-radius: 8px; font-weight: 700; font-size: 14px; text-decoration: none; }
.btn-ghost { border: 1.5px solid #d4d4d8; color: #3f3f46; padding: 14px 28px; border-radius: 8px; font-weight: 600; font-size: 14px; text-decoration: none; background: #fff; }
@media (max-width: 640px) { .hero { padding: 72px 20px; } }
</style>
</head>
<body>
<section class="hero">
  <div class="badge" data-ff-anim><span class="jp">NEW ✦ 2026</span><span class="en" style="display:none">NEW ✦ 2026</span></div>
  <h1 data-ff-anim data-ff-delay="1"><span class="jp">アイデアを、<br>世界へ届ける。</span><span class="en" style="display:none">Bring Your Ideas<br>to the World.</span></h1>
  <p class="sub" data-ff-anim data-ff-delay="2"><span class="jp">あなたのプロダクトやサービスの価値を、最短で最大の人に伝えるためのプラットフォームがここにあります。</span><span class="en" style="display:none">The platform to communicate the value of your product or service to the largest audience in the shortest time.</span></p>
  <div class="btns" data-ff-anim data-ff-delay="3">
    <a href="#" class="btn-primary"><span class="jp">無料で始める →</span><span class="en" style="display:none">Get Started Free →</span></a>
    <a href="#" class="btn-ghost"><span class="jp">詳しく見る</span><span class="en" style="display:none">Learn More</span></a>
  </div>
</section>
<script>
window.addEventListener('message', e => {
  if (!e.data || e.data.type !== 'setLang') return;
  const jp = e.data.lang === 'jp';
  document.querySelectorAll('.jp').forEach(el => el.style.display = jp ? '' : 'none');
  document.querySelectorAll('.en').forEach(el => el.style.display = jp ? 'none' : '');
});
</script>
</body>
</html>
