<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nav Simple</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans JP','Inter',sans-serif; }
nav { height: 64px; border-bottom: 1px solid #e4e4e7; display: flex; align-items: center; padding: 0 40px; background: #fff; }
.brand { font-weight: 800; font-size: 18px; color: #09090b; flex: 1; }
.links { display: flex; gap: 28px; align-items: center; }
.links a { color: #52525b; text-decoration: none; font-size: 14px; font-weight: 500; }
.cta { background: #09090b; color: #fff !important; padding: 9px 20px; border-radius: 7px; font-size: 13px; font-weight: 600 !important; }
@media (max-width: 640px) {
  nav { padding: 0 20px; }
  .links a:not(.cta) { display: none; }
}
</style>
</head>
<body>
<nav>
  <div class="brand">Brand</div>
  <div class="links">
    <a href="#">製品</a>
    <a href="#">料金</a>
    <a href="#">会社情報</a>
    <a href="#" class="cta">始める →</a>
  </div>
</nav>
<script>
window.addEventListener('message', e => {
  if (!e.data || e.data.type !== 'setLang') return;
  const jp = e.data.lang === 'jp';
  document.querySelectorAll('.jp').forEach(el => el.style.display = jp ? '' : 'none');
  document.querySelectorAll('.en').forEach(el => el.style.display = jp ? 'none' : '');
});
</script>
</body>
</html>
