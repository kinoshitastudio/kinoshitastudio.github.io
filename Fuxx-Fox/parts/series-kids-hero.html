<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kids Hero</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@300;400;700;800&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'M PLUS Rounded 1c', 'Noto Sans JP', sans-serif; background: #FFF9F0; color: #3D2C1E; overflow-x: hidden; }
.hero { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; align-items: center; padding: 60px 48px; gap: 48px; position: relative; overflow: hidden; }
.bg-circle { position: absolute; border-radius: 50%; opacity: .06; pointer-events: none; }
.bc1 { width: 500px; height: 500px; background: #FF8FAB; top: -100px; right: -100px; }
.bc2 { width: 300px; height: 300px; background: #4A90D9; bottom: -50px; left: -50px; }
.bc3 { width: 200px; height: 200px; background: #FFD166; top: 50%; left: 40%; }
.left { }
.tag { display: inline-flex; align-items: center; gap: 6px; background: #FF8FAB; color: #fff; font-size: 12px; font-weight: 700; padding: 6px 16px; border-radius: 100px; margin-bottom: 24px; }
h1 { font-size: clamp(2.8rem,5vw,5rem); font-weight: 800; line-height: 1.15; margin-bottom: 20px; color: #3D2C1E; }
h1 .pink { color: #FF8FAB; }
h1 .blue { color: #4A90D9; }
.sub { font-size: 15px; line-height: 1.9; color: rgba(61,44,30,.55); margin-bottom: 36px; font-weight: 300; }
.btns { display: flex; gap: 12px; flex-wrap: wrap; }
.btn-p { padding: 14px 32px; background: #FF8FAB; color: #fff; font-size: 14px; font-weight: 700; border: none; border-radius: 100px; cursor: pointer; font-family: inherit; box-shadow: 0 6px 20px rgba(255,143,171,.35); }
.btn-s { padding: 14px 28px; border: 2px solid rgba(61,44,30,.15); color: rgba(61,44,30,.6); font-size: 14px; font-weight: 700; border-radius: 100px; background: transparent; cursor: pointer; font-family: inherit; }
.right { position: relative; }
.right img { width: 100%; aspect-ratio: 4/5; object-fit: cover; border-radius: 40px 8px 40px 8px; display: block; }
.badge { position: absolute; bottom: -16px; left: -16px; background: #FFD166; border-radius: 20px; padding: 14px 18px; box-shadow: 0 8px 24px rgba(255,209,102,.3); }
.badge-val { font-size: 22px; font-weight: 800; color: #3D2C1E; }
.badge-label { font-size: 11px; font-weight: 700; color: rgba(61,44,30,.6); }
@media (max-width: 768px) { .hero { grid-template-columns: 1fr; } .right { order: -1; } }
</style>
</head>
<body>
<section class="hero">
  <div class="bg-circle bc1"></div>
  <div class="bg-circle bc2"></div>
  <div class="bg-circle bc3"></div>
  <div class="left">
    <div class="tag" data-ff-anim>🌟 <span class="jp">子どものために</span><span class="en" style="display:none">Made for Kids</span></div>
    <h1 data-ff-anim data-ff-delay="1">
      <span class="jp"><span class="pink">こどもの</span><br><span class="blue">えがお</span>が<br>みたくて。</span>
      <span class="en" style="display:none">Made to<br>Make <span class="pink">Kids</span><br><span class="blue">Smile.</span></span>
    </h1>
    <p class="sub" data-ff-anim data-ff-delay="2">
      <span class="jp">安心・安全にこだわった素材と、子どもの感性を育てるデザインで、成長を応援します。</span>
      <span class="en" style="display:none">Safe materials and designs that nurture children's creativity and growth, crafted with love.</span>
    </p>
    <div class="btns" data-ff-anim data-ff-delay="3">
      <button class="btn-p"><span class="jp">ショップを見る</span><span class="en" style="display:none">Shop Now</span></button>
      <button class="btn-s"><span class="jp">詳しく見る</span><span class="en" style="display:none">Learn More</span></button>
    </div>
  </div>
  <div class="right" data-ff-anim data-ff-anim-type="fade-left" data-ff-delay="1">
    <img data-editable="image" src="https://images.unsplash.com/photo-1545558014-8692077e9b5c?w=700&q=85&auto=format&fit=crop" alt="kids">
    <div class="badge" data-ff-anim data-ff-delay="3">
      <div class="badge-val">100%</div>
      <div class="badge-label"><span class="jp">安全素材</span><span class="en" style="display:none">Safe Materials</span></div>
    </div>
  </div>
</section>
<script>
window.addEventListener('message', e => {
  if (!e.data || e.data.type !== 'setLang') return;
  const jp = e.data.lang === 'jp';
  document.querySelectorAll('.jp').forEach(el => el.style.display = jp ? '' : 'none');
  document.querySelectorAll('.en').forEach(el => el.style.display = jp ? 'none' : '');
});
</script>
</body>
</html>
