<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Hero</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Syne', 'Noto Sans JP', sans-serif; background: #0D0D14; color: #F8F8FF; overflow-x: hidden; }
.hero { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; position: relative; }
.hero-left { position: relative; overflow: hidden; }
.hero-left img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero-left::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to right, rgba(13,13,20,.6) 0%, transparent 100%); }
.hero-right { display: flex; flex-direction: column; justify-content: center; padding: 80px 60px 80px 48px; position: relative; }
.hero-right::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 80% 50%, rgba(168,85,247,.08) 0%, transparent 60%); pointer-events: none; }
.tag { font-size: 11px; letter-spacing: .25em; text-transform: uppercase; color: #A855F7; font-weight: 600; margin-bottom: 20px; }
h1 { font-size: clamp(3rem,5vw,5.5rem); font-weight: 800; line-height: 1.0; margin-bottom: 16px; letter-spacing: -.03em; }
h1 .purple { background: linear-gradient(135deg, #A855F7, #22D3EE); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.artist-name { font-size: 1.2rem; font-weight: 600; color: rgba(248,248,255,.4); letter-spacing: .15em; text-transform: uppercase; margin-bottom: 24px; }
.sub { font-size: 14px; line-height: 1.85; color: rgba(248,248,255,.45); max-width: 380px; margin-bottom: 36px; font-family: 'Noto Sans JP', sans-serif; font-weight: 300; }
.btns { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 48px; }
.btn-p { padding: 14px 36px; background: linear-gradient(135deg, #A855F7, #7C3AED); color: #fff; font-size: 13px; font-weight: 700; letter-spacing: .08em; border: none; border-radius: 100px; cursor: pointer; font-family: inherit; }
.btn-s { padding: 14px 32px; border: 1px solid rgba(248,248,255,.15); color: rgba(248,248,255,.6); font-size: 13px; border-radius: 100px; background: transparent; cursor: pointer; font-family: inherit; }
.social-row { display: flex; gap: 20px; align-items: center; }
.social-label { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: rgba(248,248,255,.25); }
.social-stats { display: flex; gap: 20px; }
.s-stat { }
.s-val { font-size: 18px; font-weight: 700; color: #F8F8FF; }
.s-name { font-size: 10px; color: rgba(248,248,255,.35); letter-spacing: .1em; }
@media (max-width: 768px) { .hero { grid-template-columns: 1fr; } .hero-left { height: 60vw; } .hero-right { padding: 48px 28px; } }
</style>
</head>
<body>
<section class="hero">
  <div class="hero-left" data-ff-anim data-ff-anim-type="fade-left">
    <img data-editable="image" src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=900&q=85&auto=format&fit=crop" alt="artist">
  </div>
  <div class="hero-right">
    <div class="tag" data-ff-anim><span class="jp">NEW ALBUM — 2026</span><span class="en" style="display:none">NEW ALBUM — 2026</span></div>
    <h1 data-ff-anim data-ff-delay="1">
      <span class="jp"><span class="purple">音楽</span>が<br>世界を<br>変える</span>
      <span class="en" style="display:none"><span class="purple">Music</span><br>Changes<br>the World</span>
    </h1>
    <div class="artist-name" data-ff-anim data-ff-delay="2">YUKI × THE SOUND</div>
    <p class="sub" data-ff-anim data-ff-delay="2">
      <span class="jp">3rdアルバム「VOID」2026年6月リリース。10都市ツアーも同時開催。</span>
      <span class="en" style="display:none">3rd album "VOID" drops June 2026. Accompanied by a 10-city tour.</span>
    </p>
    <div class="btns" data-ff-anim data-ff-delay="3">
      <button class="btn-p"><span class="jp">🎵 先行試聴</span><span class="en" style="display:none">🎵 Listen Now</span></button>
      <button class="btn-s"><span class="jp">チケット予約</span><span class="en" style="display:none">Book Tickets</span></button>
    </div>
    <div class="social-row" data-ff-anim data-ff-delay="4">
      <div class="social-label"><span class="jp">フォロワー</span><span class="en" style="display:none">Followers</span></div>
      <div class="social-stats">
        <div class="s-stat"><div class="s-val">2.1M</div><div class="s-name">Instagram</div></div>
        <div class="s-stat"><div class="s-val">890K</div><div class="s-name">X / Twitter</div></div>
        <div class="s-stat"><div class="s-val">5.4M</div><div class="s-name">Spotify</div></div>
      </div>
    </div>
  </div>
</section>
<script>
window.addEventListener('message', e => {
  if (!e.data || e.data.type !== 'setLang') return;
  const jp = e.data.lang === 'jp';
  document.querySelectorAll('.jp').forEach(el => el.style.display = jp ? '' : 'none');
  document.querySelectorAll('.en').forEach(el => el.style.display = jp ? 'none' : '');
});
</script>
</body>
</html>
