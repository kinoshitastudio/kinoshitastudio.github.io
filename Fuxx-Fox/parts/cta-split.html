<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CTA Split</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans JP','Inter',sans-serif; background: #fff; }
.cta { border-top: 1px solid #e4e4e7; border-bottom: 1px solid #e4e4e7; padding: 40px; display: flex; align-items: center; justify-content: space-between; gap: 32px; }
.cta-text h3 { font-size: 1.2rem; font-weight: 800; color: #09090b; margin-bottom: 6px; }
.cta-text p { font-size: 14px; color: #71717a; }
.btns { display: flex; gap: 10px; flex-shrink: 0; }
.btn { padding: 11px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; text-decoration: none; white-space: nowrap; font-family: inherit; border: none; cursor: pointer; }
.btn-primary { background: #09090b; color: #fff; }
.btn-outline { background: transparent; color: #09090b; border: 1px solid #e4e4e7; }
@media (max-width: 640px) { .cta { flex-direction: column; align-items: flex-start; padding: 28px 20px; } }
</style>
</head>
<body>
<section class="cta">
  <div class="cta-text" data-ff-anim>
    <h3>今すぐ始めませんか？</h3>
    <p>14日間無料トライアル。クレジットカード不要。</p>
  </div>
  <div class="btns" data-ff-anim data-ff-delay="1">
    <button class="btn btn-outline">デモを見る</button>
    <button class="btn btn-primary">無料で始める →</button>
  </div>
</section>
<script>
window.addEventListener('message', e => {
  if (!e.data || e.data.type !== 'setLang') return;
  const jp = e.data.lang === 'jp';
  document.querySelectorAll('.jp').forEach(el => el.style.display = jp ? '' : 'none');
  document.querySelectorAll('.en').forEach(el => el.style.display = jp ? 'none' : '');
});
</script>
</body>
</html>
