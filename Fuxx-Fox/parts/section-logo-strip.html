<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Section Logo Strip</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans JP','Inter',sans-serif; background: #fff; }
.logos { padding: 56px 40px; border-top: 1px solid #e4e4e7; border-bottom: 1px solid #e4e4e7; }
.logos-label { text-align: center; font-size: 12px; color: #a1a1aa; letter-spacing: .1em; margin-bottom: 32px; }
.grid { display: flex; align-items: center; justify-content: center; gap: 48px; flex-wrap: wrap; }
.logo-item { font-size: 18px; font-weight: 800; color: #d4d4d8; letter-spacing: -.02em; }
@media (max-width: 600px) { .grid { gap: 28px; } .logos { padding: 40px 20px; } }
</style>
</head>
<body>
<section class="logos">
  <div class="logos-label">導入企業・パートナー</div>
  <div class="grid">
    <div class="logo-item">Acme Corp</div>
    <div class="logo-item">Globex</div>
    <div class="logo-item">Initech</div>
    <div class="logo-item">Umbrella</div>
    <div class="logo-item">Massive Dyn</div>
    <div class="logo-item">Soylent</div>
  </div>
</section>
<script>
window.addEventListener('message', e => {
  if (!e.data || e.data.type !== 'setLang') return;
  const jp = e.data.lang === 'jp';
  document.querySelectorAll('.jp').forEach(el => el.style.display = jp ? '' : 'none');
  document.querySelectorAll('.en').forEach(el => el.style.display = jp ? 'none' : '');
});
</script>
</body>
</html>
