<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Section Comparison</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans JP','Inter',sans-serif; background: #fff; }
.sec { padding: 80px 40px; }
.label { font-size: 12px; font-weight: 700; letter-spacing: .12em; color: #6366f1; text-transform: uppercase; margin-bottom: 12px; text-align: center; }
h2 { font-size: 2rem; font-weight: 800; color: #09090b; margin-bottom: 48px; text-align: center; }
.table-wrap { max-width: 720px; margin: 0 auto; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
thead th { padding: 14px 20px; font-size: 13px; font-weight: 700; color: #09090b; border-bottom: 2px solid #09090b; text-align: center; }
thead th:first-child { text-align: left; color: #71717a; font-weight: 500; }
thead th.highlight { background: #09090b; color: #fff; border-radius: 10px 10px 0 0; }
tbody tr { border-bottom: 1px solid #f0f0f0; }
tbody tr:last-child { border-bottom: none; }
td { padding: 14px 20px; font-size: 14px; color: #3f3f46; text-align: center; vertical-align: middle; }
td:first-child { text-align: left; color: #09090b; font-weight: 500; }
.c { color: #22c55e; font-size: 18px; }
.x { color: #d1d5db; font-size: 18px; }
td.highlight-col { background: #fafafe; }
.plan-name { font-size: 15px; font-weight: 800; }
.plan-price { font-size: 12px; color: rgba(255,255,255,.7); margin-top: 2px; }
.plan-price-dark { font-size: 12px; color: #71717a; margin-top: 2px; }
@media (max-width: 640px) { .sec { padding: 60px 20px; } td, th { padding: 12px 10px; font-size: 12px; } }
</style>
</head>
<body>
<section class="sec">
  <div class="label" data-ff-anim><span class="jp">プラン比較</span><span class="en" style="display:none">Plan Comparison</span></div>
  <h2 data-ff-anim data-ff-delay="1"><span class="jp">あなたに最適な<br>プランを選ぼう</span><span class="en" style="display:none">Choose the Right<br>Plan for You</span></h2>
  <div class="table-wrap" data-ff-anim data-ff-delay="2">
    <table>
      <thead>
        <tr>
          <th></th>
          <th><div class="plan-name"><span class="jp">フリー</span><span class="en" style="display:none">Free</span></div><div class="plan-price-dark">¥0 / <span class="jp">月</span><span class="en" style="display:none">mo</span></div></th>
          <th class="highlight"><div class="plan-name"><span class="jp">プロ</span><span class="en" style="display:none">Pro</span></div><div class="plan-price">¥2,980 / <span class="jp">月</span><span class="en" style="display:none">mo</span></div></th>
          <th><div class="plan-name"><span class="jp">チーム</span><span class="en" style="display:none">Team</span></div><div class="plan-price-dark">¥9,800 / <span class="jp">月</span><span class="en" style="display:none">mo</span></div></th>
        </tr>
      </thead>
      <tbody>
        <tr><td><span class="jp">プロジェクト数</span><span class="en" style="display:none">Projects</span></td><td>3</td><td class="highlight-col">無制限</td><td>無制限</td></tr>
        <tr><td><span class="jp">ストレージ</span><span class="en" style="display:none">Storage</span></td><td>1 GB</td><td class="highlight-col">50 GB</td><td>500 GB</td></tr>
        <tr><td><span class="jp">カスタムドメイン</span><span class="en" style="display:none">Custom Domain</span></td><td><span class="x">✕</span></td><td class="highlight-col"><span class="c">✓</span></td><td><span class="c">✓</span></td></tr>
        <tr><td><span class="jp">分析ダッシュボード</span><span class="en" style="display:none">Analytics</span></td><td><span class="x">✕</span></td><td class="highlight-col"><span class="c">✓</span></td><td><span class="c">✓</span></td></tr>
        <tr><td><span class="jp">チームメンバー</span><span class="en" style="display:none">Team Members</span></td><td>1</td><td class="highlight-col">5</td><td>無制限</td></tr>
        <tr><td><span class="jp">優先サポート</span><span class="en" style="display:none">Priority Support</span></td><td><span class="x">✕</span></td><td class="highlight-col"><span class="x">✕</span></td><td><span class="c">✓</span></td></tr>
      </tbody>
    </table>
  </div>
</section>
<script>
window.addEventListener('message', e => {
  if (!e.data || e.data.type !== 'setLang') return;
  const jp = e.data.lang === 'jp';
  document.querySelectorAll('.jp').forEach(el => el.style.display = jp ? '' : 'none');
  document.querySelectorAll('.en').forEach(el => el.style.display = jp ? 'none' : '');
});
</script>
</body>
</html>
