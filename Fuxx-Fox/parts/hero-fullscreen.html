<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero Fullscreen</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans JP','Inter',sans-serif; }
.hero { min-height: 100vh; background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%); display: flex; align-items: center; justify-content: center; text-align: center; padding: 80px 24px; position: relative; overflow: hidden; }
.hero::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 60% 40%, rgba(99,102,241,.25) 0%, transparent 60%); }
.hero-inner { position: relative; z-index: 1; max-width: 720px; }
.badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); border-radius: 100px; padding: 6px 16px; font-size: 12px; color: rgba(255,255,255,.7); letter-spacing: .06em; margin-bottom: 32px; }
h1 { font-size: clamp(2.4rem, 6vw, 5rem); font-weight: 800; color: #fff; line-height: 1.1; letter-spacing: -.02em; margin-bottom: 24px; }
h1 span { background: linear-gradient(135deg, #818cf8, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
p { font-size: 1.1rem; color: rgba(255,255,255,.55); line-height: 1.75; max-width: 540px; margin: 0 auto 40px; }
.btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.btn-primary { background: #fff; color: #09090b; padding: 14px 32px; border-radius: 10px; font-weight: 700; font-size: 15px; text-decoration: none; }
.btn-ghost { background: rgba(255,255,255,.08); color: #fff; padding: 14px 32px; border-radius: 10px; font-weight: 600; font-size: 15px; text-decoration: none; border: 1px solid rgba(255,255,255,.14); }
</style>
</head>
<body>
<section class="hero">
  <div class="hero-inner">
    <div class="badge" data-ff-anim>✦ 新機能リリース</div>
    <h1 data-ff-anim data-ff-delay="1">未来を<span>加速する</span><br>プラットフォーム</h1>
    <p data-ff-anim data-ff-delay="2">チームの生産性を10倍にする唯一のツール。今すぐ無料で始めて、違いを実感してください。</p>
    <div class="btns" data-ff-anim data-ff-delay="3">
      <a href="#" class="btn-primary">無料で始める →</a>
      <a href="#" class="btn-ghost">デモを見る</a>
    </div>
  </div>
</section>
<script>
window.addEventListener('message', e => {
  if (!e.data || e.data.type !== 'setLang') return;
  const jp = e.data.lang === 'jp';
  document.querySelectorAll('.jp').forEach(el => el.style.display = jp ? '' : 'none');
  document.querySelectorAll('.en').forEach(el => el.style.display = jp ? 'none' : '');
});
</script>
</body>
</html>
