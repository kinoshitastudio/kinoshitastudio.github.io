<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nav Dark</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans JP','Inter',sans-serif; }
nav { height: 64px; display: flex; align-items: center; padding: 0 40px; background: #09090b; border-bottom: 1px solid rgba(255,255,255,.08); }
.brand { font-weight: 800; font-size: 18px; color: #fff; flex: 1; }
.links { display: flex; gap: 28px; align-items: center; }
.links a { color: rgba(255,255,255,.6); text-decoration: none; font-size: 14px; font-weight: 500; transition: color .15s; }
.links a:hover { color: #fff; }
.cta { background: #2563eb; color: #fff !important; padding: 9px 20px; border-radius: 7px; font-size: 13px; font-weight: 600 !important; }
.cta:hover { background: #1d4ed8 !important; }
@media (max-width: 640px) {
  nav { padding: 0 20px; }
  .links a:not(.cta) { display: none; }
}
</style>
</head>
<body>
<nav data-ff-anim>
  <div class="brand">Brand</div>
  <div class="links">
    <a href="#">製品</a>
    <a href="#">料金</a>
    <a href="#">ドキュメント</a>
    <a href="#" class="cta">無料で始める</a>
  </div>
</nav>
<script>
window.addEventListener('message', e => {
  if (!e.data || e.data.type !== 'setLang') return;
  const jp = e.data.lang === 'jp';
  document.querySelectorAll('.jp').forEach(el => el.style.display = jp ? '' : 'none');
  document.querySelectorAll('.en').forEach(el => el.style.display = jp ? 'none' : '');
});
</script>
</body>
</html>
