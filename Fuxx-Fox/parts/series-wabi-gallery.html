<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wabi Gallery</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans JP', sans-serif; background: #F2EDE4; color: #1A1A1A; }
.sec { padding: 100px 64px; }
.header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 60px; }
.header-left { display: flex; flex-direction: column; gap: 12px; }
.label { font-size: 11px; letter-spacing: .24em; color: #B5451B; text-transform: uppercase; }
h2 { font-family: 'Noto Serif JP', serif; font-size: clamp(1.8rem,3vw,2.6rem); font-weight: 300; line-height: 1.5; letter-spacing: .04em; }
.view-all { font-size: 12px; letter-spacing: .12em; color: #5A5048; border-bottom: 1px solid currentColor; padding-bottom: 2px; text-decoration: none; white-space: nowrap; margin-bottom: 4px; }
.grid { display: grid; grid-template-columns: 2fr 1fr 1fr; grid-template-rows: auto auto; gap: 3px; }
.item { overflow: hidden; position: relative; cursor: pointer; }
.item img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s cubic-bezier(.25,.46,.45,.94); filter: sepia(8%) contrast(1.05); }
.item:hover img { transform: scale(1.06); }
.item.tall { grid-row: span 2; }
.item.tall img { height: 560px; }
.item:not(.tall) img { height: 276px; }
.caption { position: absolute; bottom: 0; left: 0; right: 0; padding: 20px 18px 16px; background: linear-gradient(to top, rgba(26,26,26,.72) 0%, transparent 100%); opacity: 0; transition: opacity .3s; }
.item:hover .caption { opacity: 1; }
.cap-num { font-family: 'Noto Serif JP', serif; font-size: 11px; color: rgba(242,237,228,.5); margin-bottom: 4px; letter-spacing: .12em; }
.cap-title { font-size: 13px; font-weight: 400; color: #F2EDE4; letter-spacing: .06em; }
.footer { display: flex; justify-content: center; margin-top: 48px; }
.btn { padding: 14px 48px; border: 1px solid #1A1A1A; background: none; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; cursor: pointer; font-family: inherit; color: #1A1A1A; transition: all .2s; }
.btn:hover { background: #1A1A1A; color: #F2EDE4; }
@media (max-width: 768px) { .grid { grid-template-columns: 1fr 1fr; } .item.tall { grid-row: span 1; } .item.tall img, .item:not(.tall) img { height: 200px; } .sec { padding: 60px 24px; } .header { flex-direction: column; align-items: flex-start; gap: 20px; } }
</style>
</head>
<body>
<section class="sec">
  <div class="header">
    <div class="header-left">
      <div class="label" data-ff-anim><span class="jp">作品集</span><span class="en" style="display:none">Gallery</span></div>
      <h2 data-ff-anim data-ff-delay="1"><span class="jp">職人の手から生まれた<br>作品たち</span><span class="en" style="display:none">Works born<br>from artisan hands</span></h2>
    </div>
    <a href="#" class="view-all" data-ff-anim><span class="jp">すべての作品を見る →</span><span class="en" style="display:none">View all works →</span></a>
  </div>
  <div class="grid">
    <div class="item tall" data-ff-anim data-ff-delay="2">
      <img data-editable="image" src="https://images.unsplash.com/photo-1541123437800-1bb1317badc2?w=700&q=80&auto=format&fit=crop" alt="work1">
      <div class="caption"><div class="cap-num">No.01</div><div class="cap-title"><span class="jp">青磁茶碗 — 冬枯れ</span><span class="en" style="display:none">Celadon Bowl — Barren Winter</span></div></div>
    </div>
    <div class="item" data-ff-anim data-ff-delay="3">
      <img data-editable="image" src="https://images.unsplash.com/photo-1610701596061-2ecf227e85b2?w=500&q=80&auto=format&fit=crop" alt="work2">
      <div class="caption"><div class="cap-num">No.02</div><div class="cap-title"><span class="jp">漆器盆 — 朱塗り</span><span class="en" style="display:none">Lacquer Tray — Vermilion</span></div></div>
    </div>
    <div class="item" data-ff-anim data-ff-delay="3">
      <img data-editable="image" src="https://images.unsplash.com/photo-1603189042612-12d0c3c5e69b?w=500&q=80&auto=format&fit=crop" alt="work3">
      <div class="caption"><div class="cap-num">No.03</div><div class="cap-title"><span class="jp">鉄瓶 — 霞文様</span><span class="en" style="display:none">Iron Kettle — Mist Pattern</span></div></div>
    </div>
    <div class="item" data-ff-anim data-ff-delay="4">
      <img data-editable="image" src="https://images.unsplash.com/photo-1587974928442-77dc3e0dba72?w=500&q=80&auto=format&fit=crop" alt="work4">
      <div class="caption"><div class="cap-num">No.04</div><div class="cap-title"><span class="jp">竹籠 — 六つ目編み</span><span class="en" style="display:none">Bamboo Basket — Six-eye Weave</span></div></div>
    </div>
    <div class="item" data-ff-anim data-ff-delay="4">
      <img data-editable="image" src="https://images.unsplash.com/photo-1526045431048-f857369baa09?w=500&q=80&auto=format&fit=crop" alt="work5">
      <div class="caption"><div class="cap-num">No.05</div><div class="cap-title"><span class="jp">和紙照明 — 月光</span><span class="en" style="display:none">Washi Lamp — Moonlight</span></div></div>
    </div>
  </div>
  <div class="footer" data-ff-anim data-ff-delay="5">
    <button class="btn"><span class="jp">作品一覧を見る</span><span class="en" style="display:none">View All Works</span></button>
  </div>
</section>
<script>
window.addEventListener('message', e => {
  if (!e.data || e.data.type !== 'setLang') return;
  const jp = e.data.lang === 'jp';
  document.querySelectorAll('.jp').forEach(el => el.style.display = jp ? '' : 'none');
  document.querySelectorAll('.en').forEach(el => el.style.display = jp ? 'none' : '');
});
</script>
</body>
</html>
