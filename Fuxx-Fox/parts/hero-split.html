<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero Split — Fuxx Fox</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
/* ━━ CSS Variables — edit here to retheme ━━━━━━━━━ */
:root {
  --accent:      #3ACFC6;
  --accent-dark: #2C9D96;
  --text:        #1a2e2c;
  --text-mid:    #4a6260;
  --bg:          #f7fffe;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans JP', 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

/* ━━ Hero ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.hero {
  display: grid;
  grid-template-columns: 1fr 1fr;
  height: 100vh;
  min-height: 600px;
  overflow: hidden;
}

/* ── Left ── */
.hero-left {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 64px 56px 64px 72px;
}

.hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  width: fit-content;
  font-size: 11px; font-weight: 600;
  letter-spacing: .12em; text-transform: uppercase;
  color: var(--accent-dark);
  background: rgba(58,207,198,.1);
  border: 1px solid rgba(58,207,198,.3);
  border-radius: 999px;
  padding: 5px 14px;
  margin-bottom: 28px;
}

.hero-h1 {
  font-size: clamp(32px, 3.6vw, 54px);
  font-weight: 800;
  line-height: 1.2;
  letter-spacing: -.03em;
  margin-bottom: 20px;
}
.hero-h1 em { color: var(--accent); font-style: normal; }

.hero-sub {
  font-size: 16px; font-weight: 300;
  color: var(--text-mid);
  line-height: 1.85;
  max-width: 400px;
  margin-bottom: 40px;
}

.hero-actions {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}
.btn-primary {
  display: inline-flex; align-items: center; gap: 8px;
  background: linear-gradient(135deg, var(--accent), var(--accent-dark));
  color: #fff;
  font-size: 15px; font-weight: 700;
  padding: 16px 36px;
  border-radius: 999px; border: none;
  text-decoration: none; cursor: pointer;
  box-shadow: 0 8px 24px rgba(58,207,198,.35);
  transition: transform .2s, box-shadow .2s;
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(58,207,198,.45); }

.btn-secondary {
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--accent-dark);
  font-size: 14px; font-weight: 600;
  text-decoration: none;
  border: 1.5px solid rgba(58,207,198,.4);
  padding: 14px 24px;
  border-radius: 999px;
  transition: border-color .2s, color .2s;
}
.btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

/* ── Right ── */
.hero-right {
  background: linear-gradient(145deg, #e4f9f7 0%, #b2f0ea 55%, #7de0d8 100%);
  position: relative;
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}

.hero-deco {
  position: absolute; inset: 0; pointer-events: none;
}
.deco-circle {
  position: absolute; border-radius: 50%;
  background: rgba(255,255,255,.22);
}
.dc1 { width: 380px; height: 380px; top: -90px; right: -90px; }
.dc2 { width: 240px; height: 240px; bottom: 30px; left: 10px; }
.dc3 { width: 130px; height: 130px; top: 42%; right: 14%; }

.image-area {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  z-index: 1;
}

/* ── Responsive ── */
@media (max-width: 768px) {
  .hero { grid-template-columns: 1fr; height: auto; min-height: 100vh; }
  .hero-right { height: 260px; order: -1; }
  .hero-left  { padding: 48px 28px 56px; }
}
</style>
</head>
<body>

<section class="hero">

  <div class="hero-left">
    <span class="hero-eyebrow">✦ New · 2026</span>
    <h1 class="hero-h1">
      <span class="jp">キャッチコピーが<br><em>ここに入ります</em></span>
      <span class="en" style="display:none">Your Compelling<br><em>Headline Here</em></span>
    </h1>
    <p class="hero-sub">
      <span class="jp">サービスの価値を伝える一文。ユーザーが共感できる言葉で、短く・具体的に書きましょう。</span>
      <span class="en" style="display:none">One sentence that communicates your value. Be specific, concise, and human.</span>
    </p>
    <div class="hero-actions">
      <a href="#" class="btn-primary"><span class="jp">はじめる →</span><span class="en" style="display:none">Get Started →</span></a>
      <a href="#" class="btn-secondary"><span class="jp">詳しく見る</span><span class="en" style="display:none">Learn More</span></a>
    </div>
  </div>

  <div class="hero-right">
    <div class="hero-deco">
      <div class="deco-circle dc1"></div>
      <div class="deco-circle dc2"></div>
      <div class="deco-circle dc3"></div>
    </div>
    <img class="image-area" data-editable="image"
      src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=800&q=80&auto=format&fit=crop"
      alt="Image Area">
  </div>

</section>

<script>
window.addEventListener('message', e => {
  if (!e.data || e.data.type !== 'setLang') return;
  const jp = e.data.lang === 'jp';
  document.querySelectorAll('.jp').forEach(el => el.style.display = jp ? '' : 'none');
  document.querySelectorAll('.en').forEach(el => el.style.display = jp ? 'none' : '');
});
</script>
</body>
</html>
