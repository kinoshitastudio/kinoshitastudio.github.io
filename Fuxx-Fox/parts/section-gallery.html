<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Section Gallery</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans JP','Inter',sans-serif; background: #fff; }
.gallery { padding: 80px 40px; }
.gallery-label { font-size: 12px; font-weight: 700; letter-spacing: .12em; color: #6366f1; text-transform: uppercase; margin-bottom: 12px; }
h2 { font-size: 2rem; font-weight: 800; color: #09090b; margin-bottom: 32px; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 220px 220px; gap: 12px; max-width: 900px; }
.cell { border-radius: 12px; overflow: hidden; }
.cell:first-child { grid-row: span 2; }
.cell:nth-child(2) { grid-column: span 1; }
.cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
@media (max-width: 640px) { .grid { grid-template-columns: 1fr 1fr; grid-template-rows: auto; } .cell:first-child { grid-row: span 1; } .gallery { padding: 60px 20px; } }
</style>
</head>
<body>
<section class="gallery">
  <div class="gallery-label" data-ff-anim>ギャラリー</div>
  <h2 data-ff-anim data-ff-delay="1">プロダクトの世界観</h2>
  <div class="grid">
    <div class="cell" data-ff-anim data-ff-delay="2"><img data-editable="image" src="https://images.unsplash.com/photo-1519389950473-47ba0277781c?w=600&q=80&auto=format&fit=crop" alt="gallery1"></div>
    <div class="cell" data-ff-anim data-ff-delay="3"><img data-editable="image" src="https://images.unsplash.com/photo-1551434678-e076c223a692?w=600&q=80&auto=format&fit=crop" alt="gallery2"></div>
    <div class="cell" data-ff-anim data-ff-delay="4"><img data-editable="image" src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=600&q=80&auto=format&fit=crop" alt="gallery3"></div>
    <div class="cell" data-ff-anim data-ff-delay="5"><img data-editable="image" src="https://images.unsplash.com/photo-1600880292203-757bb62b4baf?w=600&q=80&auto=format&fit=crop" alt="gallery4"></div>
    <div class="cell" data-ff-anim data-ff-delay="6"><img data-editable="image" src="https://images.unsplash.com/photo-1553877522-43269d4ea984?w=600&q=80&auto=format&fit=crop" alt="gallery5"></div>
  </div>
</section>
<script>
window.addEventListener('message', e => {
  if (!e.data || e.data.type !== 'setLang') return;
  const jp = e.data.lang === 'jp';
  document.querySelectorAll('.jp').forEach(el => el.style.display = jp ? '' : 'none');
  document.querySelectorAll('.en').forEach(el => el.style.display = jp ? 'none' : '');
});
</script>
</body>
</html>
