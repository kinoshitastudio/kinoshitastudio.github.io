<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Section 2col</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans JP','Inter',sans-serif; background: #fff; }
.sec { padding: 80px 40px; }
.inner { max-width: 1040px; margin: 0 auto; display: flex; align-items: center; gap: 72px; }
.badge { display: inline-block; background: #dbeafe; color: #2563eb; font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 999px; margin-bottom: 16px; }
h2 { font-size: 38px; font-weight: 800; color: #09090b; margin-bottom: 18px; line-height: 1.25; }
p { color: #52525b; font-size: 16px; line-height: 1.8; margin-bottom: 32px; }
a { background: #09090b; color: #fff; padding: 13px 28px; border-radius: 7px; font-weight: 600; text-decoration: none; font-size: 14px; }
.img { flex: 1; min-height: 320px; border-radius: 16px; overflow: hidden; }
@media (max-width: 640px) {
  .sec { padding: 48px 20px; }
  .inner { flex-direction: column; gap: 32px; }
  .img { min-height: 220px; width: 100%; flex: none; }
}
</style>
</head>
<body>
<section class="sec">
  <div class="inner">
    <div style="flex:1">
      <span class="badge">FEATURE</span>
      <h2><span class="jp">機能をわかりやすく<br>伝えるタイトル</span><span class="en" style="display:none">A Clear Title That<br>Explains Your Feature</span></h2>
      <p><span class="jp">この機能がどのようにユーザーの課題を解決するかを説明します。具体的な数字や事例を交えると説得力が増します。</span><span class="en" style="display:none">Describe how this feature solves your users' problems. Add real numbers or examples for credibility.</span></p>
      <a href="#"><span class="jp">詳細を見る →</span><span class="en" style="display:none">Learn More →</span></a>
    </div>
    <img class="img" data-editable="image" src="https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=700&q=80&auto=format&fit=crop" alt="Feature Image" style="width:100%;height:100%;object-fit:cover;display:block;">
  </div>
</section>
<script>
window.addEventListener('message', e => {
  if (!e.data || e.data.type !== 'setLang') return;
  const jp = e.data.lang === 'jp';
  document.querySelectorAll('.jp').forEach(el => el.style.display = jp ? '' : 'none');
  document.querySelectorAll('.en').forEach(el => el.style.display = jp ? 'none' : '');
});
</script>
</body>
</html>
