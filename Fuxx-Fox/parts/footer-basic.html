<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Footer Basic</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans JP','Inter',sans-serif; background: #09090b; }
footer { padding: 48px 40px 24px; }
.inner { max-width: 1040px; margin: 0 auto; }
.top { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 40px; margin-bottom: 40px; }
.brand { font-size: 20px; font-weight: 800; color: #fafafa; margin-bottom: 12px; }
.desc { color: #71717a; font-size: 13px; line-height: 1.7; max-width: 260px; }
.col-title { font-size: 12px; font-weight: 600; color: #fafafa; margin-bottom: 14px; letter-spacing: .05em; }
.col-links { display: flex; flex-direction: column; gap: 10px; }
.col-links a { color: #71717a; text-decoration: none; font-size: 13px; }
.bottom { border-top: 1px solid #3f3f46; padding-top: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
.copy { color: #52525b; font-size: 12px; }
.bottom-links { display: flex; gap: 20px; }
.bottom-links a { color: #52525b; text-decoration: none; font-size: 12px; }
@media (max-width: 768px) {
  footer { padding: 40px 24px 20px; }
  .top { grid-template-columns: 1fr 1fr; gap: 24px; }
}
@media (max-width: 480px) {
  .top { grid-template-columns: 1fr; gap: 20px; }
  .bottom { flex-direction: column; align-items: flex-start; gap: 8px; }
  .bottom-links { flex-wrap: wrap; gap: 12px; }
}
</style>
</head>
<body>
<footer>
  <div class="inner">
    <div class="top">
      <div><div class="brand">Brand</div><p class="desc">サービスの簡単な説明文が入ります。会社の理念やサービスの価値を一言で伝えましょう。</p></div>
      <div><div class="col-title">製品</div><div class="col-links"><a href="#">機能</a><a href="#">料金</a><a href="#">セキュリティ</a><a href="#">ロードマップ</a></div></div>
      <div><div class="col-title">会社</div><div class="col-links"><a href="#">会社概要</a><a href="#">採用情報</a><a href="#">ブログ</a><a href="#">プレスリリース</a></div></div>
      <div><div class="col-title">サポート</div><div class="col-links"><a href="#">ドキュメント</a><a href="#">API</a><a href="#">コミュニティ</a><a href="#">お問い合わせ</a></div></div>
    </div>
    <div class="bottom">
      <span class="copy">© 2024 Brand. All rights reserved.</span>
      <div class="bottom-links"><a href="#">プライバシーポリシー</a><a href="#">利用規約</a><a href="#">特定商取引法</a></div>
    </div>
  </div>
</footer>
<script>
window.addEventListener('message', e => {
  if (!e.data || e.data.type !== 'setLang') return;
  const jp = e.data.lang === 'jp';
  document.querySelectorAll('.jp').forEach(el => el.style.display = jp ? '' : 'none');
  document.querySelectorAll('.en').forEach(el => el.style.display = jp ? 'none' : '');
});
</script>
</body>
</html>
