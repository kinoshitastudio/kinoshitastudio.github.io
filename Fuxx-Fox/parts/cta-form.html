<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CTA Form</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans JP','Inter',sans-serif; background: #fff; }
.cta { padding: 80px 40px; text-align: center; background: linear-gradient(135deg, #f5f3ff, #ede9fe); }
.cta-label { font-size: 12px; font-weight: 700; letter-spacing: .12em; color: #7c3aed; text-transform: uppercase; margin-bottom: 12px; }
h2 { font-size: 2rem; font-weight: 800; color: #09090b; margin-bottom: 12px; }
p { font-size: 15px; color: #52525b; margin-bottom: 36px; }
.form { display: flex; gap: 10px; max-width: 440px; margin: 0 auto; }
input { flex: 1; padding: 13px 18px; border: 1px solid #d4d4d8; border-radius: 9px; font-size: 14px; font-family: inherit; outline: none; background: #fff; }
input:focus { border-color: #7c3aed; }
button { background: #7c3aed; color: #fff; border: none; padding: 13px 24px; border-radius: 9px; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; font-family: inherit; }
.note { font-size: 12px; color: #71717a; margin-top: 12px; }
@media (max-width: 480px) { .form { flex-direction: column; } .cta { padding: 60px 20px; } }
</style>
</head>
<body>
<section class="cta">
  <div class="cta-label" data-ff-anim>ニュースレター</div>
  <h2 data-ff-anim data-ff-delay="1">最新情報をお届け</h2>
  <p data-ff-anim data-ff-delay="2">プロダクトの最新情報・活用ヒントをメールでお届けします。</p>
  <div class="form" data-ff-anim data-ff-delay="3">
    <input type="email" placeholder="your@email.com">
    <button>登録する →</button>
  </div>
  <p class="note">スパムは送りません。いつでも解除できます。</p>
</section>
<script>
window.addEventListener('message', e => {
  if (!e.data || e.data.type !== 'setLang') return;
  const jp = e.data.lang === 'jp';
  document.querySelectorAll('.jp').forEach(el => el.style.display = jp ? '' : 'none');
  document.querySelectorAll('.en').forEach(el => el.style.display = jp ? 'none' : '');
});
</script>
</body>
</html>
