<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Section App Preview</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans JP','Inter',sans-serif; background: #f8f8fb; }
.sec { padding: 80px 40px; text-align: center; }
.label { font-size: 12px; font-weight: 700; letter-spacing: .12em; color: #6366f1; text-transform: uppercase; margin-bottom: 12px; }
h2 { font-size: 2rem; font-weight: 800; color: #09090b; margin-bottom: 12px; }
.sub { font-size: 15px; color: #71717a; max-width: 460px; margin: 0 auto 48px; line-height: 1.7; }
.browser { max-width: 860px; margin: 0 auto; border-radius: 14px; overflow: hidden; box-shadow: 0 32px 80px rgba(0,0,0,.14); border: 1px solid #e4e4e7; }
.browser-bar { background: #f4f4f5; padding: 10px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #e4e4e7; }
.dots { display: flex; gap: 6px; }
.dot { width: 12px; height: 12px; border-radius: 50%; }
.dot:nth-child(1){background:#fc5f57;} .dot:nth-child(2){background:#febc2e;} .dot:nth-child(3){background:#28c840;}
.url-bar { flex: 1; background: #fff; border: 1px solid #e4e4e7; border-radius: 6px; padding: 5px 12px; font-size: 11px; color: #71717a; font-family: monospace; }
.browser-body { background: #fff; }
.browser-body img { width: 100%; height: auto; display: block; }
@media (max-width: 640px) { .sec { padding: 60px 20px; } .browser { border-radius: 10px; } }
</style>
</head>
<body>
<section class="sec">
  <div class="label"><span class="jp">プロダクト画面</span><span class="en" style="display:none">App Preview</span></div>
  <h2><span class="jp">直感的なUI、<br>シンプルな操作。</span><span class="en" style="display:none">Intuitive UI,<br>Simple to Use.</span></h2>
  <p class="sub"><span class="jp">複雑な設定は不要。すぐに使い始められるシンプルなインターフェースを設計しました。</span><span class="en" style="display:none">No complex setup required. We designed a simple interface you can start using right away.</span></p>
  <div class="browser">
    <div class="browser-bar">
      <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      <div class="url-bar">https://yourapp.com/dashboard</div>
    </div>
    <div class="browser-body">
      <img data-editable="image" src="https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=900&q=80&auto=format&fit=crop" alt="App screenshot">
    </div>
  </div>
</section>
<script>
window.addEventListener('message', e => {
  if (!e.data || e.data.type !== 'setLang') return;
  const jp = e.data.lang === 'jp';
  document.querySelectorAll('.jp').forEach(el => el.style.display = jp ? '' : 'none');
  document.querySelectorAll('.en').forEach(el => el.style.display = jp ? 'none' : '');
});
</script>
</body>
</html>
