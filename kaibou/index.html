  /* ⭐ モバイル ── 見た目の大きさより「掴める領域」を先に確保する。

<script>
'use strict'
const N = 720                 // working resolution
const EX = document.getElementById('ex'), DV = document.getElementById('dv')
EX.width=EX.height=N; DV.width=DV.height=N
const ex = EX.getContext('2d',{willReadFrequently:true})
const dv = DV.getContext('2d',{willReadFrequently:true})

const buf = ()=>{ const c=document.createElement('canvas'); c.width=c.height=N; return c }
const T1=buf(), T2=buf(), T3=buf()
const t1=T1.getContext('2d',{willReadFrequently:true}), t2=T2.getContext('2d',{willReadFrequently:true}), t3=T3.getContext('2d')

/* ---------------- exposure ---------------- */
const STEPS=16, KICK=[0,3,8,11], SNARE=[4,12], HAT=[0,2,4,6,8,10,12,14]
const R_K=0.30, R_S=0.50, R_H=0.70
let bars=0, playing=false, t0=0, lastStep=-1
const BPM=110, stepDur=60/BPM/4

const jit = a => (Math.random()*2-1)*a
function polar(step,rN,aj,rj){
  const a=(step/STEPS)*Math.PI*2 - Math.PI/2 + aj
  const r=N*0.5*rN*(1+rj)
  return [N/2+Math.cos(a)*r, N/2+Math.sin(a)*r, a, r]
}
function kick(c,s){
  const [x,y,a]=polar(s,R_K,jit(0.035),jit(0.05))
  const len=N*0.20*(1+jit(0.18))
  const x2=N/2+Math.cos(a)*(N*0.5*R_K+len), y2=N/2+Math.sin(a)*(N*0.5*R_K+len)
  const g=c.createLinearGradient(N/2,N/2,x2,y2)
  g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(0.5,'rgba(255,244,226,0.085)'); g.addColorStop(1,'rgba(255,255,255,0)')
  c.strokeStyle=g; c.lineWidth=N*0.07*(1+jit(0.2)); c.lineCap='round'
  c.beginPath(); c.moveTo(N/2,N/2); c.lineTo(x2,y2); c.stroke()
  const rg=c.createRadialGradient(x,y,0,x,y,N*0.08)
  rg.addColorStop(0,'rgba(255,248,236,0.11)'); rg.addColorStop(1,'rgba(255,255,255,0)')
  c.fillStyle=rg; c.beginPath(); c.arc(x,y,N*0.08,0,7); c.fill()
}
function snare(c,s){
  const [,,a,r]=polar(s,R_S,jit(0.03),jit(0.04))
  const sp=0.30*(1+jit(0.3))
  c.strokeStyle='rgba(255,255,255,0.16)'; c.lineWidth=1.3
  c.beginPath(); c.arc(N/2,N/2,r,a-sp/2,a+sp/2); c.stroke()
  for(let i=0;i<6;i++){
    const aa=a+(Math.random()-0.5)*sp
    const r1=r*(1-Math.random()*0.10), r2=r*(1+Math.random()*0.12)
    c.strokeStyle='rgba(255,255,255,'+(0.03+Math.random()*0.07)+')'
    c.beginPath(); c.moveTo(N/2+Math.cos(aa)*r1,N/2+Math.sin(aa)*r1)
    c.lineTo(N/2+Math.cos(aa)*r2,N/2+Math.sin(aa)*r2); c.stroke()
  }
}
function hat(c,s){
  const [,,a,r]=polar(s,R_H,jit(0.02),0)
  for(let i=0;i<24;i++){
    const aa=a+(Math.random()-0.5)*0.12, rr=r*(1+(Math.random()-0.5)*0.09)
    c.fillStyle='rgba(255,255,255,'+(0.02+Math.random()*0.09)+')'
    const sz=0.7+Math.random()*1.6
    c.fillRect(N/2+Math.cos(aa)*rr, N/2+Math.sin(aa)*rr, sz, sz)
  }
}
/* light is accumulated linearly, in float. 8-bit addition always clips;
   film does not. the exposure knob tone-maps at the end: v = 1 - exp(-L·gain) */
const acc = new Float32Array(N*N)

function exposeBar(){
  const c = t2
  c.setTransform(1,0,0,1,0,0)
  c.globalCompositeOperation='source-over'
  c.fillStyle='#000'; c.fillRect(0,0,N,N)
  c.globalCompositeOperation='lighter'
  // wow & flutter: the whole bar is laid down slightly off
  c.save()
  c.translate(N/2,N/2); c.rotate((Math.random()-0.5)*0.006)
  c.scale(1+(Math.random()-0.5)*0.004, 1+(Math.random()-0.5)*0.004)
  c.translate(-N/2,-N/2)
  for(let s=0;s<STEPS;s++){
    if(KICK.includes(s)) kick(c,s)
    if(SNARE.includes(s)) snare(c,s)
    if(HAT.includes(s)) hat(c,s)
  }
  c.restore()
  const a = c.getImageData(0,0,N,N).data
  for(let i=0,p=0;i<acc.length;i++,p+=4){
    acc[i] += (0.299*a[p] + 0.587*a[p+1] + 0.114*a[p+2])/255
  }
  for(let i=0;i<140;i++) acc[(Math.random()*acc.length)|0] += Math.random()*0.06   // grain
  bars++
}
function clearEx(){ acc.fill(0); bars=0 }

/* the source: either the accumulated light, or an image you drop in (the sampler) */
let srcImg = null, mode = 'expose'

function drawCover(ctx, img){
  const s = Math.max(N/img.width, N/img.height)
  const w = img.width*s, h = img.height*s
  ctx.setTransform(1,0,0,1,0,0)
  ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1; ctx.filter='none'
  ctx.fillStyle='#000'; ctx.fillRect(0,0,N,N)
  ctx.drawImage(img, (N-w)/2, (N-h)/2, w, h)
}

// tone-map the accumulator (or the sample) into the exposure canvas
function renderBase(){
  const g = P.expo.on ? P.expo.gain : 1
  if(mode==='image' && srcImg){
    drawCover(ex, srcImg)
    if(g !== 1){
      const img = ex.getImageData(0,0,N,N), d = img.data
      for(let i=0;i<d.length;i+=4){
        // same film curve, so the knob means the same thing on a photo
        for(let k=0;k<3;k++) d[i+k] = (1 - Math.exp(-(d[i+k]/255)*g*1.6))*255
      }
      ex.putImageData(img,0,0)
    }
    return
  }
  const img = ex.createImageData(N,N), d = img.data
  for(let i=0,p=0;i<acc.length;i++,p+=4){
    const v = 1 - Math.exp(-acc[i]*g)
    const c = v*255
    d[p]=c; d[p+1]=c*0.985; d[p+2]=c*0.955; d[p+3]=255   // the light is a touch warm
  }
  ex.putImageData(img,0,0)
}

function loadImage(file){
  const url = URL.createObjectURL(file)
  const im = new Image()
  im.onload = ()=>{ srcImg = im; setMode('image'); URL.revokeObjectURL(url) }
  im.src = url
}
function setMode(m){
  if(m==='image' && !srcImg) return
  mode = m
  const be = document.getElementById('srcExpo'), bs = document.getElementById('srcSample')
  be.classList.toggle('on', m==='expose')
  bs.classList.toggle('on', m==='image')
  bs.disabled = !srcImg; bs.style.opacity = srcImg ? 1 : .45
  document.getElementById('exCap').textContent = t().srcCap
  refresh()
}

/* ---------------- the chain ---------------- */
const P = {
  expo: {on:true, gain:1.0},
  eq:   {on:true,  blur:0.6},
  dec:  {on:true,  down:2, levels:12, jitter:0.15, dither:0.80},
  amp:  {on:true,  drive:1.2, bias:0.35},
  rev:  {on:true,  size:18, amount:0.15, dark:0.75},
  echo: {on:false, fb:0.31, taps:2, lp:6, rot:0, dist:14, ang:20},
  filt: {on:true,  blur:0.3},
  reg:  {on:false, amount:0, ang:20},
  util: {on:true,  width:0.90, bassMono:0.1},
  tint: {on:false, shadow:250, highlight:40, amount:0, accent:0},
  noise:{on:true,  amount:0.11, size:1, color:0.20, tone:0.35, clump:0.20, shards:0, variance:0.5, blotch:0, seed:7},
  mix:  {on:true,  wet:0.22}
}

function blurTo(dstCtx, srcCanvas, px){
  dstCtx.setTransform(1,0,0,1,0,0)
  dstCtx.globalCompositeOperation='source-over'; dstCtx.globalAlpha=1
  dstCtx.filter = px>0 ? `blur(${px}px)` : 'none'
  dstCtx.clearRect(0,0,N,N); dstCtx.drawImage(srcCanvas,0,0)
  dstCtx.filter='none'
}

/* Decimort2 — resample, then quantize with Floyd–Steinberg error diffusion.
   a copier does not crush into blocks; it pushes the error into the neighbours.
   `resample` sets the size of the grain. `diffusion` at 0 gives plain posterise. */
function decimort(ctx){
  const d = P.dec
  const w = Math.max(2, Math.round(N/Math.max(1,d.down)))

  t2.setTransform(1,0,0,1,0,0); t2.globalCompositeOperation='source-over'; t2.filter='none'
  t2.clearRect(0,0,N,N)
  t2.imageSmoothingEnabled = true
  t2.drawImage(DV, 0,0,N,N, 0,0,w,w)

  const img = t2.getImageData(0,0,w,w), a = img.data
  const lv = Math.max(2, d.levels), step = 255/(lv-1)
  const df = d.dither, jt = d.jitter*22

  const buf = new Float32Array(w*w*3)
  for(let i=0,p=0;i<w*w;i++,p+=4){ buf[i*3]=a[p]; buf[i*3+1]=a[p+1]; buf[i*3+2]=a[p+2] }

  for(let y=0;y<w;y++){
    const ltr = (y%2===0)                       // serpentine: kills the diagonal banding
    for(let xi=0;xi<w;xi++){
      const x = ltr ? xi : w-1-xi
      const i = (y*w+x)*3, dx = ltr?1:-1
      for(let k=0;k<3;k++){
        const v = buf[i+k] + (Math.random()-0.5)*jt
        const q = Math.min(255, Math.max(0, Math.round(v/step)*step))
        const e = (v-q)*df
        buf[i+k] = q
        if(e){
          const put=(xx,yy,f)=>{ if(xx<0||xx>=w||yy>=w) return; buf[(yy*w+xx)*3+k] += e*f }
          put(x+dx, y,   7/16)
          put(x-dx, y+1, 3/16)
          put(x,    y+1, 5/16)
          put(x+dx, y+1, 1/16)
        }
      }
    }
  }
  for(let i=0,p=0;i<w*w;i++,p+=4){
    a[p]  = buf[i*3]  <0?0:buf[i*3]  >255?255:buf[i*3]
    a[p+1]= buf[i*3+1]<0?0:buf[i*3+1]>255?255:buf[i*3+1]
    a[p+2]= buf[i*3+2]<0?0:buf[i*3+2]>255?255:buf[i*3+2]
    a[p+3]= 255
  }
  t2.putImageData(img,0,0)

  ctx.setTransform(1,0,0,1,0,0); ctx.globalCompositeOperation='source-over'
  ctx.globalAlpha=1; ctx.filter='none'
  ctx.imageSmoothingEnabled = false
  ctx.clearRect(0,0,N,N)
  ctx.drawImage(T2, 0,0,w,w, 0,0,N,N)
  ctx.imageSmoothingEnabled = true
}

// Amp — saturation. highlights clip, shadows lift.
function ampStage(ctx){
  const g = P.amp.drive, b = P.amp.bias
  const img = ctx.getImageData(0,0,N,N), a = img.data
  const k = Math.tanh(g)
  for(let i=0;i<a.length;i+=4){
    for(let j=0;j<3;j++){
      const x = a[i+j]/255
      let y = Math.tanh(x*g)/k
      y = y*(1-b) + b*x
      a[i+j] = Math.round(Math.min(1,Math.max(0,y))*255)
    }
  }
  ctx.putImageData(img,0,0)
}

// pull the current image down before adding a wet signal (dry/wet, not just add)
function duck(k){
  t2.setTransform(1,0,0,1,0,0); t2.globalCompositeOperation='source-over'
  t2.clearRect(0,0,N,N); t2.drawImage(DV,0,0)
  dv.save(); dv.globalCompositeOperation='source-over'; dv.globalAlpha=1
  dv.filter=`brightness(${k})`; dv.clearRect(0,0,N,N); dv.drawImage(T2,0,0)
  dv.filter='none'; dv.restore()
}

// Reverb — hi-cut the input, then bloom. dark: the bloom never brightens.
function reverbStage(){
  blurTo(t1, DV, P.rev.size)
  duck(1 - P.rev.amount*0.55)
  dv.save()
  dv.globalCompositeOperation='lighter'
  dv.globalAlpha = P.rev.amount
  dv.filter = `brightness(${P.rev.dark})`
  dv.drawImage(T1,0,0)
  dv.filter='none'; dv.restore()
}

/* Echo — a 1/4 delay. on a circle that is 90° of rotation; on a rectangle it is
   simply a shift. same knob, different coordinate system. */
function echoStage(){
  const {fb,taps,lp,rot,dist,ang} = P.echo
  t3.setTransform(1,0,0,1,0,0); t3.clearRect(0,0,N,N); t3.drawImage(DV,0,0)
  duck(1 - fb*0.5)
  dv.save(); dv.globalCompositeOperation='lighter'
  const a = ang*Math.PI/180
  let amp = fb
  for(let i=1;i<=taps;i++){
    dv.globalAlpha = amp
    dv.filter = `blur(${lp*i*0.5}px) brightness(0.85)`
    dv.save()
    if(rot>0.5){
      dv.translate(N/2,N/2); dv.rotate(i*Math.PI/2); dv.translate(-N/2,-N/2)
    }else{
      dv.translate(Math.cos(a)*dist*i, Math.sin(a)*dist*i)
    }
    dv.drawImage(T3,0,0)
    dv.restore()
    amp *= fb
  }
  dv.filter='none'; dv.restore()
}

/* Registration — the plates do not line up. R and B drift apart, G holds.
   in audio terms this is a few samples of delay between the channels. */
function regStage(){
  const {amount, ang} = P.reg
  if(amount < 0.4) return
  const a = ang*Math.PI/180
  const dx = Math.cos(a)*amount, dy = Math.sin(a)*amount
  const src = dv.getImageData(0,0,N,N).data
  const out = dv.createImageData(N,N), o = out.data
  const at = (x,y,k)=>{
    const xx = x<0?0:x>=N?N-1:x, yy = y<0?0:y>=N?N-1:y
    return src[(yy*N+xx)*4+k]
  }
  for(let y=0;y<N;y++){
    for(let x=0;x<N;x++){
      const p = (y*N+x)*4
      o[p]   = at(Math.round(x-dx), Math.round(y-dy), 0)
      o[p+1] = src[p+1]
      o[p+2] = at(Math.round(x+dx), Math.round(y+dy), 2)
      o[p+3] = 255
    }
  }
  dv.putImageData(out,0,0)
}

// Utility — Width 40% : keep mid (symmetric), reduce side (asymmetric)
// out = mid + w*side,  mid=(img+mirror)/2, side=(img-mirror)/2
//     = ((1+w)/2)*img + ((1-w)/2)*mirror
function utilStage(){
  const w = P.util.width
  const mix = (1-w)/2
  t3.clearRect(0,0,N,N)
  t3.setTransform(-1,0,0,1,N,0); t3.drawImage(DV,0,0); t3.setTransform(1,0,0,1,0,0)
  dv.save(); dv.globalCompositeOperation='source-over'; dv.globalAlpha=mix
  dv.drawImage(T3,0,0); dv.restore()
  // bass mono: the large forms become fully symmetric
  if(P.util.bassMono>0){
    blurTo(t1, DV, 26)
    t3.clearRect(0,0,N,N)
    t3.setTransform(-1,0,0,1,N,0); t3.drawImage(T1,0,0); t3.setTransform(1,0,0,1,0,0)
    dv.save(); dv.globalCompositeOperation='lighter'
    dv.globalAlpha = P.util.bassMono*0.14
    dv.drawImage(T3,0,0); dv.restore()
  }
}

function hue2rgb(h){                       // h in degrees → a saturated rgb
  const k = n => (n + h/30) % 12
  const f = n => 255*(1 - Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n), 1))))
  return [f(0), f(8), f(4)]
}

/* Tint — a duotone. shadows take one colour, highlights the other.
   amount 0 leaves the original colour alone. */
function tintStage(){
  const {shadow, highlight, amount, accent} = P.tint
  const S = hue2rgb(shadow), H = hue2rgb(highlight)
  const img = dv.getImageData(0,0,N,N), a = img.data
  for(let i=0;i<a.length;i+=4){
    const l = (0.299*a[i] + 0.587*a[i+1] + 0.114*a[i+2])/255
    const d = [ S[0]+(H[0]-S[0])*l, S[1]+(H[1]-S[1])*l, S[2]+(H[2]-S[2])*l ]
    for(let k=0;k<3;k++) a[i+k] = a[i+k]*(1-amount) + d[k]*amount
    if(accent>0 && l>0.34 && l<0.62){
      a[i]   = a[i]  *(1-accent) + 122*accent
      a[i+1] = a[i+1]*(1-accent) + 178*accent
      a[i+2] = a[i+2]*(1-accent) + 214*accent
    }
  }
  dv.putImageData(img,0,0)
}


/* deterministic rng, so the preview and the final render agree */
function rng(seed){
  let a = seed >>> 0
  return ()=>{ a = (a + 0x6D2B79F5)|0
    let t = Math.imul(a ^ (a>>>15), 1 | a)
    t = (t + Math.imul(t ^ (t>>>7), 61 | t)) ^ t
    return ((t ^ (t>>>14)) >>> 0) / 4294967296 }
}

/* Noise — toner, not video static.
   `tone` weights the grain toward the midtones: paper stays white, ink stays
   black. `clump` mixes in a coarser layer so the grain gathers.
   `shards` cuts the plane with straight lines and gives every piece its own
   dose — a collage where one fragment is clean and the next is wrecked.
   `blotch` adds a slow cloud on top of that, the way a copier smears. */
function noiseStage(){
  const {amount, size, color, tone, clump, shards, variance, blotch, seed} = P.noise
  if(amount <= 0) return
  const s  = Math.max(1, Math.round(size))
  const s2 = s*4
  const c1 = Math.ceil(N/s), c2 = Math.ceil(N/s2)
  const amp = amount * 150

  const R = rng((seed|0) * 7919 + 13)
  const mk = (cols)=>{
    const b = new Float32Array(cols*cols*3)
    for(let i=0;i<cols*cols;i++){
      const m = (R()*2-1)*amp
      for(let k=0;k<3;k++) b[i*3+k] = m*(1-color) + (R()*2-1)*amp*color
    }
    return b
  }
  const fine = mk(c1), coarse = mk(c2)

  // straight cuts across the plane; each region gets its own dose
  const K = Math.max(0, Math.min(8, Math.round(shards)))
  const lines = []
  for(let i=0;i<K;i++){
    const a = R()*Math.PI
    lines.push([Math.cos(a), Math.sin(a), (R()*0.9+0.05)*N])
  }
  const gains = new Float32Array(1<<K)
  for(let i=0;i<gains.length;i++) gains[i] = 1 - variance + R()*variance*2

  // a slow cloud, so the dose drifts even inside one region
  const bc = 6
  const cloud = new Float32Array(bc*bc)
  for(let i=0;i<cloud.length;i++) cloud[i] = R()

  const img = dv.getImageData(0,0,N,N), a = img.data
  for(let y=0;y<N;y++){
    const fy=(y/s)|0, cy=(y/s2)|0
    for(let x=0;x<N;x++){
      const p=(y*N+x)*4
      const fi=(fy*c1+((x/s)|0))*3, ci=(cy*c2+((x/s2)|0))*3

      const l=(0.299*a[p]+0.587*a[p+1]+0.114*a[p+2])/255
      let wt=(1-tone)+tone*(4*l*(1-l))

      if(K){
        let id=0
        for(let i=0;i<K;i++) if(x*lines[i][0] + y*lines[i][1] > lines[i][2]) id |= (1<<i)
        wt *= gains[id]
      }
      if(blotch>0){
        const u = Math.min(bc-1,(x/N*bc)|0), v = Math.min(bc-1,(y/N*bc)|0)
        wt *= 1 - blotch + cloud[v*bc+u]*blotch*2
      }

      for(let k=0;k<3;k++){
        const n = (1-clump)*fine[fi+k] + clump*coarse[ci+k]
        const val = a[p+k] + n*wt
        a[p+k] = val<0?0:val>255?255:val
      }
    }
  }
  dv.putImageData(img,0,0)
}

function develop(){
  renderBase()
  dv.setTransform(1,0,0,1,0,0); dv.globalCompositeOperation='source-over'; dv.globalAlpha=1; dv.filter='none'
  dv.clearRect(0,0,N,N)
  dv.filter = (P.eq.on && P.eq.blur>0) ? `blur(${P.eq.blur}px)` : 'none'
  dv.drawImage(EX,0,0)
  dv.filter='none'
  if(P.dec.on) decimort(dv)
  if(P.amp.on) ampStage(dv)
  if(P.rev.on) reverbStage()
  if(P.echo.on) echoStage()
  if(P.filt.on){ t1.clearRect(0,0,N,N); t1.drawImage(DV,0,0); blurTo(dv, T1, P.filt.blur) }
  if(P.reg.on) regStage()
  if(P.util.on) utilStage()
  if(P.tint.on) tintStage()
  if(P.noise.on) noiseStage()

  // Master — how much of the chain actually reaches the page.
  // at 15–20% it is a house sound, not an effect.
  if(P.mix.on && P.mix.wet < 1){
    dv.save()
    dv.setTransform(1,0,0,1,0,0); dv.globalCompositeOperation='source-over'; dv.filter='none'
    dv.globalAlpha = 1 - P.mix.wet
    dv.drawImage(EX,0,0)
    dv.restore()
  }
}

const rack = document.getElementById('rack')
function buildRack(){
  rack.innerHTML=''
  devEls = []
  for(const [key,name,meta,rows] of RACK()){
    const d = document.createElement('div'); d.className='dev'
    devEls.push(d)
    const h = document.createElement('div'); h.className='dh'
    const led = document.createElement('div'); led.className='led'+(P[key].on?' on':'')
    led.onclick = ()=>{ P[key].on=!P[key].on; led.classList.toggle('on',P[key].on); markNav(); develop() }
    const nm = document.createElement('span'); nm.className='dn'; nm.textContent=name
    const mt = document.createElement('span'); mt.className='dm'; mt.textContent=meta
    h.append(led,nm,mt); d.append(h)
    for(const [prop,label,min,max,step,fmt] of rows){
      const r = document.createElement('div'); r.className='row'
      const l = document.createElement('label'); l.textContent=label
      const i = document.createElement('input'); i.type='range'; i.min=min; i.max=max; i.step=step; i.value=P[key][prop]
      const v = document.createElement('span'); v.className='val mono'; v.textContent=fmt(P[key][prop])
      i.oninput = ()=>{ P[key][prop]=+i.value; v.textContent=fmt(+i.value); develop() }
      r.append(l,i,v); d.append(r)
    }
    rack.append(d)
  }
}

const nav = document.getElementById('chainNav')
let devEls = []
function buildNav(){
  nav.innerHTML = '<span class="lbl">'+t().chain+'</span>'
  RACK().forEach(([key,name],i)=>{
    const b = document.createElement('button')
    b.innerHTML = '<span class="dot"></span>' + name
    b.dataset.i = i
    if(!P[key].on) b.classList.add('off')
    b.onclick = ()=>{
      const el = devEls[i]
      rack.scrollTo({ left: el.offsetLeft - 8, behavior:'smooth' })
    }
    nav.append(b)
  })
}
function markNav(){
  const x = rack.scrollLeft
  let best = 0, bd = 1e9
  devEls.forEach((el,i)=>{ const d = Math.abs(el.offsetLeft - 8 - x); if(d<bd){bd=d;best=i} })
  ;[...nav.querySelectorAll('button')].forEach((b,i)=>{
    b.classList.toggle('here', i===best)
    b.classList.toggle('off', !P[RACK()[i][0]].on)
  })
}
rack.addEventListener('scroll', markNav)

const LS = 'chain.presets.v1'
const mine = ()=>{ try{ return JSON.parse(localStorage.getItem(LS)||'{}') }catch(_){ return {} } }

function applyPreset(o){
  if(!o.mix) P.mix.wet = 1
  for(const k in o){ for(const prop in o[k]) P[k][prop] = (prop==='on') ? !!o[k][prop] : o[k][prop] }
  buildRack(); markNav(); develop()
}
function buildPresets(){
  const bar = document.getElementById('presets'); bar.innerHTML=''
  const add = (name, obj, own)=>{
    const b = document.createElement('button'); b.textContent = name
    if(name==='Kaibou') b.classList.add('on')
    b.onclick = ()=>{ applyPreset(obj); [...bar.querySelectorAll('button')].forEach(x=>x.classList.remove('on')); b.classList.add('on') }
    if(own){ b.title='右クリックで削除'
      b.oncontextmenu = e=>{ e.preventDefault(); const m=mine(); delete m[name]; localStorage.setItem(LS,JSON.stringify(m)); buildPresets() } }
    bar.append(b)
  }
  for(const k in PRESETS) add(k, PRESETS[k], false)
  const m = mine()
  for(const k in m) add(k, m[k], true)
}
buildPresets()
applyPreset(PRESETS.Kaibou)

document.getElementById('savePreset').onclick = ()=>{
  openPrompt(
    lang==='ja' ? 'この設定を保存' : 'Save preset',
    lang==='ja' ? 'このブラウザに保存されます。プリセットのバッジを右クリックで削除。'
                : 'Stored in this browser. Right-click a preset badge to remove it.',
    '', name=>{
      const m = mine(); m[name] = JSON.parse(JSON.stringify(P))
      localStorage.setItem(LS, JSON.stringify(m)); buildPresets()
    })
}

/* ---------------- the sampler: drop an image ---------------- */
const fileIn = document.getElementById('file')
document.getElementById('pick').onclick = ()=> fileIn.click()
document.getElementById('srcExpo').onclick = ()=> setMode('expose')
document.getElementById('srcSample').onclick = ()=> setMode('image')
fileIn.onchange = ()=>{ if(fileIn.files[0]) loadImage(fileIn.files[0]) }
addEventListener('dragover', e=>{ e.preventDefault() })
addEventListener('drop', e=>{
  e.preventDefault()
  const f = [...(e.dataTransfer.files||[])].find(f=>f.type.startsWith('image/'))
  if(f) loadImage(f)
})

/* ---------------- transport ---------------- */
const meta = document.getElementById('meta')
function refresh(){ meta.textContent = srcImg ? '' : t().demo; develop() }
document.getElementById('more').onclick = ()=>{
  for(let i=0;i<16;i++) exposeBar()
  if(mode!=='expose') setMode('expose'); else refresh() }
document.getElementById('reset').onclick = ()=>{
  if(mode==='image'){ srcImg=null; setMode('expose'); return }
  clearEx(); for(let i=0;i<16;i++) exposeBar(); refresh() }
document.getElementById('save').onclick = ()=>{
  openPrompt(
    lang==='ja' ? '現像を保存' : 'Save result',
    lang==='ja' ? 'PNG で書き出します。' : 'Exports a PNG.',
    'kaibou', name=>{
      const a=document.createElement('a'); a.download = name.replace(/\.png$/i,'') + '.png'
      a.href = DV.toDataURL('image/png'); a.click()
    })
}
const pb = document.getElementById('play')
pb.onclick = ()=>{
  if(mode!=='expose') setMode('expose')
  playing=!playing; pb.textContent = playing?'⏸ 止める':'▶ 露光する'
  if(playing){ t0=performance.now()/1000; lastStep=-1; loop() }
}
function loop(){
  if(!playing) return
  const bar = Math.floor((performance.now()/1000-t0)/(stepDur*STEPS))
  if(bar!==lastStep){ lastStep=bar; exposeBar(); refresh() }
  requestAnimationFrame(loop)
}

clearEx()
for(let i=0;i<18;i++) exposeBar()   // a built-in demo material, so the page is never empty
applyLang()                          // builds the rack + nav, then refreshes
