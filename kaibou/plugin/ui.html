<!doctype html>
<meta charset="utf-8">
<style>
:root{ --bg:#0b0b0c; --fg:#e9e9e9; --dim:#78787b; --line:#242426; --panel:#151516; --hot:#ff8a3d }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:400 12px/1.55 -apple-system,ui-sans-serif,"Inter",sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column}
.mono{font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}

header{padding:12px 14px 10px;border-bottom:1px solid var(--line);flex:none;
  display:flex;align-items:center;justify-content:space-between;gap:10px}
/* ⚠️ .wm/.by used to sit INSIDE this declaration block, which made all three
   rules invalid — the wordmark's byline never got its 6.5px. */
h1{font-family:"Haettenschweiler","Impact","Arial Narrow Bold",sans-serif;
  font-size:20px;letter-spacing:.06em;text-transform:uppercase;margin:0;font-weight:400}
.wm{display:flex;align-items:baseline;gap:6px;min-width:0}
.by{font-size:6.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);white-space:nowrap;opacity:.75}
.ver{font-family:ui-monospace,Menlo,monospace;font-size:9px;letter-spacing:.12em;color:var(--dim);opacity:.8}
.sub{font-size:10px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0 0 8px}
.lang{display:flex;flex:none}
.lang button{border-radius:0;padding:4px 9px;font-size:10.5px}
.lang button:first-child{border-radius:5px 0 0 5px}
.lang button:last-child{border-radius:0 5px 5px 0;margin-left:-1px}
.prow2{margin-bottom:7px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.seg{display:flex;flex:none}
.seg button{border-radius:0;font-size:10.5px;padding:4px 10px}
.seg button:first-child{border-radius:5px 0 0 5px}
.seg button:last-child{border-radius:0 5px 5px 0;margin-left:-1px}
.seg button:disabled{opacity:.35}
.chev{font-size:9.5px;letter-spacing:.09em;padding:4px 9px}

.scroll{flex:1;overflow-y:auto;padding:12px 14px 0;position:relative}

/* The stage hugs the preview so a portrait image doesn't float in a wide
   checkerboard. width:fit-content shrinks it to the canvas; the empty state
   keeps a full box via #empty's own width. */
#stage{border:1px solid var(--line);border-radius:8px;background:
  repeating-conic-gradient(#191919 0 25%, #141414 0 50%) 0 0/16px 16px;
  overflow:hidden;display:grid;place-items:center;min-height:150px;margin:0 auto 12px;
  width:fit-content;max-width:100%;
  position:sticky;top:0;z-index:3;box-shadow:0 8px 16px -8px #000}
.sub{position:sticky;top:0;z-index:4;background:var(--bg);padding-top:2px}
#prev{max-width:100%;max-height:300px;display:block}
#empty{color:var(--dim);font-size:11.5px;padding:40px 16px;text-align:center;line-height:1.7;
  width:min(100vw,340px);box-sizing:border-box;writing-mode:horizontal-tb}

.chips{display:flex;gap:5px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
button{font:inherit;font-size:11px;color:var(--fg);background:transparent;border:1px solid var(--line);
  border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--dim)}
button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button:disabled{opacity:.4;cursor:default}

.master{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.mrow{display:flex;align-items:center;gap:9px}
.mrow label{font-size:10.5px;color:var(--dim);width:52px;flex:none}
input[type=range]{flex:1;accent-color:var(--fg);height:3px}
.val{font-size:10.5px;width:40px;text-align:right;flex:none}
.hint{font-size:10px;color:var(--dim);margin:7px 0 0;line-height:1.6}

#chainNav{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin:0 0 7px}
#chainNav .lbl{font-size:9.5px;letter-spacing:.09em;color:var(--dim);margin-right:2px}
#chainNav button{font-size:10px;padding:3px 8px;border-radius:99px;opacity:.62}
#chainNav button.here{opacity:1;border-color:var(--fg)}
#chainNav button.off{opacity:.3}
#chainNav .dot{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--hot);margin-right:4px;vertical-align:1px}
#chainNav button.off .dot{background:#3a3a3d}

#rack{display:flex;overflow-x:auto;overflow-y:hidden;border:1px solid var(--line);border-radius:8px;
  margin-bottom:10px;scrollbar-width:thin}
#rack::-webkit-scrollbar{height:7px}
#rack::-webkit-scrollbar-thumb{background:#2e2e31;border-radius:8px}
.dev{padding:10px 12px;min-width:196px;flex:none;border-right:1px solid var(--line)}
.dev:last-child{border-right:0}
.dh{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.led{width:7px;height:7px;border-radius:50%;background:#333;border:1px solid #444;cursor:pointer;flex:none}
.led.on{background:var(--hot);border-color:var(--hot)}
.dn{font-size:11px;font-weight:500}
.dm{font-size:9.5px;color:var(--dim);margin-left:auto;text-align:right}
.row{display:flex;align-items:center;gap:8px;margin-top:6px}
.row label{font-size:10px;color:var(--dim);width:58px;flex:none}

footer{flex:none;border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:7px;align-items:center}
footer .sp{flex:1}
#apply{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:500;padding:7px 16px}
#note{font-size:10px;color:var(--dim);padding:0 2px 14px;line-height:1.6;margin:0}
.warn{color:var(--hot)}
/* Haettenschweiler has no kana. The nearest thing a system font can do is a
   heavy gothic, squeezed — condensed weight is what the latin face is made of.
   Same treatment as Siren 鳴物; the two are one signal chain. */
h1 .jp{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",-apple-system,sans-serif;
  font-weight:800;font-size:15px;letter-spacing:.02em;margin-left:7px;
  display:inline-block;transform:scaleX(.86);transform-origin:left center;vertical-align:baseline}
h1{cursor:pointer}
h1:hover{opacity:.82}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.modal[hidden]{display:none}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 20px 16px;
  width:100%;max-height:88vh;overflow-y:auto}
.mt{font-family:"Haettenschweiler","Impact",sans-serif;text-transform:uppercase;letter-spacing:.06em;
  font-size:24px;margin:0 0 8px;font-weight:400}
.ms{font-size:11.5px;color:var(--dim);margin:0 0 14px;line-height:1.75}
.ms b{color:var(--fg);font-weight:500}
.mlink{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border:1px solid var(--line);
  border-radius:7px;margin-bottom:7px;color:var(--fg);text-decoration:none;font-size:11.5px}
.mlink:hover{border-color:var(--dim)}
.mlink small{color:var(--dim);margin-left:5px}
.ar{color:var(--dim)}
.mcl{width:100%;margin-top:8px;padding:8px}
</style>

  <div class="sheet">
    <p class="mt">Kaibou</p>
    <p class="ms" id="mSub"></p>
    <p class="ms" id="mBody"></p>
    <a class="mlink" href="https://kinoshita.studio" target="_blank" rel="noopener"><span>kinoshita studio</span><span class="ar">↗</span></a>
    <a class="mlink" href="https://99letters.bandcamp.com/album/kaibou-zukan" target="_blank" rel="noopener"><span>99LETTERS — Kaibou Zukan <small>Bandcamp</small></span><span class="ar">↗</span></a>
    <button id="mClose" class="mcl"></button>

</footer>

<script>
'use strict'
// surface anything that breaks, straight into the panel
window.onerror = (m,src,line,col)=>{
  const e = document.getElementById('empty')
  if(e){ e.hidden=false; e.style.color='#ff6b5e'; e.textContent = 'UI ERROR: '+m+' (line '+line+')' }
}


/* deterministic rng, so the preview and the final render agree */
function rng(seed){
  let a = seed >>> 0
  return ()=>{ a = (a + 0x6D2B79F5)|0
    let t = Math.imul(a ^ (a>>>15), 1 | a)
    t = (t + Math.imul(t ^ (t>>>7), 61 | t)) ^ t
    return ((t ^ (t>>>14)) >>> 0) / 4294967296 }
}

/* Noise — toner, not video static.
   `tone` weights the grain toward the midtones: paper stays white, ink stays
   black. `clump` mixes in a coarser layer so the grain gathers.
   `shards` cuts the plane with straight lines and gives every piece its own
   dose — a collage where one fragment is clean and the next is wrecked.
   `blotch` adds a slow cloud on top of that, the way a copier smears. */
function noiseStage(a, w, h){
  const {amount, size, color, tone, clump, shards, variance, blotch, seed} = P.noise
  if(amount <= 0) return
  const s  = Math.max(1, Math.round(size))
  const s2 = s*4
  const c1w = Math.ceil(w/s), c1h = Math.ceil(h/s), c2w = Math.ceil(w/s2), c2h = Math.ceil(h/s2)
  const amp = amount * 150

  const R = rng((seed|0) * 7919 + 13)
  const mk = (cw,ch)=>{
    const b = new Float32Array(cw*ch*3)
    for(let i=0;i<cw*ch;i++){
      const m = (R()*2-1)*amp
      for(let k=0;k<3;k++) b[i*3+k] = m*(1-color) + (R()*2-1)*amp*color
    }
    return b
  }
  const fine = mk(c1w,c1h), coarse = mk(c2w,c2h)

  // straight cuts across the plane; each region gets its own dose
  const K = Math.max(0, Math.min(8, Math.round(shards)))
  const lines = []
  for(let i=0;i<K;i++){
    const a = R()*Math.PI
    lines.push([Math.cos(a), Math.sin(a), (R()*0.9+0.05)*Math.max(w,h)])
  }
  const gains = new Float32Array(1<<K)
  for(let i=0;i<gains.length;i++) gains[i] = 1 - variance + R()*variance*2

  // a slow cloud, so the dose drifts even inside one region
  const bc = 6
  const cloud = new Float32Array(bc*bc)
  for(let i=0;i<cloud.length;i++) cloud[i] = R()

  const img = a.getImageData(0,0,w,h), d = img.data
  for(let y=0;y<h;y++){
    const fy=(y/s)|0, cy=(y/s2)|0
    for(let x=0;x<w;x++){
      const p=(y*w+x)*4
      const fi=(fy*c1w+((x/s)|0))*3, ci=(cy*c2w+((x/s2)|0))*3

      const l=(0.299*d[p]+0.587*d[p+1]+0.114*d[p+2])/255
      let wt=(1-tone)+tone*(4*l*(1-l))

      if(K){
        let id=0
        for(let i=0;i<K;i++) if(x*lines[i][0] + y*lines[i][1] > lines[i][2]) id |= (1<<i)
        wt *= gains[id]
      }
      if(blotch>0){
        const u = Math.min(bc-1,(x/w*bc)|0), v = Math.min(bc-1,(y/h*bc)|0)
        wt *= 1 - blotch + cloud[v*bc+u]*blotch*2
      }

      for(let k=0;k<3;k++){
        const n = (1-clump)*fine[fi+k] + clump*coarse[ci+k]
        const val = d[p+k] + n*wt
        d[p+k] = val<0?0:val>255?255:val
      }
    }
  }
  a.putImageData(img,0,0)
}

/* Which stages move pixels around? Those cannot stay as live layers. */
const DESTRUCTIVE = ['dec','echo','reg','util','filt','eq']
const destructive = ()=> DESTRUCTIVE.some(k => P[k].on && (
  (k==='dec' && (P.dec.down>1 || P.dec.levels<16)) ||
  (k==='echo' && P.echo.fb>0) ||
  (k==='reg' && P.reg.amount>=0.4) ||
  (k==='util' && P.util.width<1) ||
  (k==='eq' && P.eq.blur>0) ||
  (k==='filt' && P.filt.blur>0)
))

/* ---------------- the chain, at any size ---------------- */
const cv = (w,h)=>{ const c=document.createElement('canvas'); c.width=w; c.height=h; return c }

function hue2rgb(h){
  const k = n => (n + h/30) % 12
  const f = n => 255*(1 - Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n), 1))))
  return [f(0), f(8), f(4)]
}

/* `s` scales every pixel-sized knob, so the preview and the final render agree.
   The knobs are authored against a 720px long edge. */
function runChain(src, w, h){
  const s = Math.max(w,h)/720
  const px = v => v*s
  const A = cv(w,h), a = A.getContext('2d',{willReadFrequently:true})
  const B = cv(w,h), b = B.getContext('2d',{willReadFrequently:true})
  const C = cv(w,h), c = C.getContext('2d')

  const blurTo = (ctx, from, r)=>{
    ctx.setTransform(1,0,0,1,0,0); ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1
    ctx.filter = r>0 ? `blur(${r}px)` : 'none'
    ctx.clearRect(0,0,w,h); ctx.drawImage(from,0,0); ctx.filter='none'
  }
  const duck = k=>{
    b.setTransform(1,0,0,1,0,0); b.globalCompositeOperation='source-over'
    b.clearRect(0,0,w,h); b.drawImage(A,0,0)
    a.save(); a.globalCompositeOperation='source-over'; a.globalAlpha=1
    a.filter=`brightness(${k})`; a.clearRect(0,0,w,h); a.drawImage(B,0,0)
    a.filter='none'; a.restore()
  }

  // Exposure + Hi-Cut
  a.filter = (P.eq.on && P.eq.blur>0) ? `blur(${px(P.eq.blur)}px)` : 'none'
  a.drawImage(src,0,0,w,h); a.filter='none'

  if(P.expo.on && P.expo.gain !== 1){
    const g = P.expo.gain, im = a.getImageData(0,0,w,h), d = im.data
    for(let i=0;i<d.length;i+=4)
      for(let k=0;k<3;k++) d[i+k] = (1 - Math.exp(-(d[i+k]/255)*g*1.6))*255
    a.putImageData(im,0,0)
  }

  // Crush — resample, then quantise with error diffusion
  if(P.dec.on){
    const D = P.dec
    const down = Math.max(1, Math.round(D.down*s))
    const ww = Math.max(2, Math.round(w/down)), hh = Math.max(2, Math.round(h/down))
    b.setTransform(1,0,0,1,0,0); b.globalCompositeOperation='source-over'; b.filter='none'
    b.clearRect(0,0,w,h); b.imageSmoothingEnabled = true
    b.drawImage(A, 0,0,w,h, 0,0,ww,hh)

    const im = b.getImageData(0,0,ww,hh), d = im.data
    const lv = Math.max(2, D.levels), step = 255/(lv-1), df = D.dither, jt = D.jitter*22
    const buf = new Float32Array(ww*hh*3)
    for(let i=0,p=0;i<ww*hh;i++,p+=4){ buf[i*3]=d[p]; buf[i*3+1]=d[p+1]; buf[i*3+2]=d[p+2] }
    for(let y=0;y<hh;y++){
      const ltr = (y%2===0)
      for(let xi=0;xi<ww;xi++){
        const x = ltr?xi:ww-1-xi, i=(y*ww+x)*3, dx = ltr?1:-1
        for(let k=0;k<3;k++){
          const v = buf[i+k] + (Math.random()-0.5)*jt
          const q = Math.min(255, Math.max(0, Math.round(v/step)*step))
          const e = (v-q)*df
          buf[i+k] = q
          if(e){
            const put=(xx,yy,f)=>{ if(xx<0||xx>=ww||yy>=hh) return; buf[(yy*ww+xx)*3+k] += e*f }
            put(x+dx,y,7/16); put(x-dx,y+1,3/16); put(x,y+1,5/16); put(x+dx,y+1,1/16)
          }
        }
      }
    }
    for(let i=0,p=0;i<ww*hh;i++,p+=4){
      for(let k=0;k<3;k++){ const v=buf[i*3+k]; d[p+k] = v<0?0:v>255?255:v }
      d[p+3]=255
    }
    b.putImageData(im,0,0)
    a.setTransform(1,0,0,1,0,0); a.globalCompositeOperation='source-over'; a.globalAlpha=1; a.filter='none'
    a.imageSmoothingEnabled = false
    a.clearRect(0,0,w,h); a.drawImage(B, 0,0,ww,hh, 0,0,w,h)
    a.imageSmoothingEnabled = true
  }

  // Drive
  if(P.amp.on){
    const g = P.amp.drive, bi = P.amp.bias, k = Math.tanh(g)
    const im = a.getImageData(0,0,w,h), d = im.data
    for(let i=0;i<d.length;i+=4)
      for(let j=0;j<3;j++){
        const x = d[i+j]/255
        let y = Math.tanh(x*g)/k
        y = y*(1-bi) + bi*x
        d[i+j] = Math.round(Math.min(1,Math.max(0,y))*255)
      }
    a.putImageData(im,0,0)
  }

  // Bloom
  if(P.rev.on && P.rev.amount>0){
    blurTo(c, A, px(P.rev.size))
    duck(1 - P.rev.amount*0.55)
    a.save(); a.globalCompositeOperation='lighter'; a.globalAlpha = P.rev.amount
    a.filter = `brightness(${P.rev.dark})`; a.drawImage(C,0,0); a.filter='none'; a.restore()
  }

  // Echo — rotation on a circle, a shift on a rectangle
  if(P.echo.on && P.echo.fb>0){
    const {fb,taps,lp,rot,dist,ang} = P.echo
    c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,w,h); c.drawImage(A,0,0)
    duck(1 - fb*0.5)
    const rad = ang*Math.PI/180
    a.save(); a.globalCompositeOperation='lighter'
    let amp = fb
    for(let i=1;i<=taps;i++){
      a.globalAlpha = amp
      a.filter = `blur(${px(lp)*i*0.5}px) brightness(0.85)`
      a.save()
      if(rot>0.5){ a.translate(w/2,h/2); a.rotate(i*Math.PI/2); a.translate(-w/2,-h/2) }
      else { a.translate(Math.cos(rad)*px(dist)*i, Math.sin(rad)*px(dist)*i) }
      a.drawImage(C,0,0); a.restore()
      amp *= fb
    }
    a.filter='none'; a.restore()
  }

  // Low-Pass
  if(P.filt.on && P.filt.blur>0){
    c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,w,h); c.drawImage(A,0,0)
    blurTo(a, C, px(P.filt.blur))
  }

  // Registration
  if(P.reg.on && P.reg.amount>=0.4){
    const rad = P.reg.ang*Math.PI/180, r = px(P.reg.amount)
    const dx = Math.cos(rad)*r, dy = Math.sin(rad)*r
    const srcD = a.getImageData(0,0,w,h).data
    const out = a.createImageData(w,h), o = out.data
    const at = (x,y,k)=>{
      const xx = x<0?0:x>=w?w-1:x, yy = y<0?0:y>=h?h-1:y
      return srcD[(yy*w+xx)*4+k]
    }
    for(let y=0;y<h;y++) for(let x=0;x<w;x++){
      const p=(y*w+x)*4
      o[p]   = at(Math.round(x-dx), Math.round(y-dy), 0)
      o[p+1] = srcD[p+1]
      o[p+2] = at(Math.round(x+dx), Math.round(y+dy), 2)
      o[p+3] = 255
    }
    a.putImageData(out,0,0)
  }

  // Width
  if(P.util.on && P.util.width<1){
    const mix = (1-P.util.width)/2
    c.setTransform(-1,0,0,1,w,0); c.clearRect(0,0,w,h); c.drawImage(A,0,0); c.setTransform(1,0,0,1,0,0)
    a.save(); a.globalCompositeOperation='source-over'; a.globalAlpha=mix; a.drawImage(C,0,0); a.restore()
    if(P.util.bassMono>0){
      blurTo(b, A, px(26))
      c.setTransform(-1,0,0,1,w,0); c.clearRect(0,0,w,h); c.drawImage(B,0,0); c.setTransform(1,0,0,1,0,0)
      a.save(); a.globalCompositeOperation='lighter'; a.globalAlpha = P.util.bassMono*0.14
      a.drawImage(C,0,0); a.restore()
    }
  }

  // Duotone
  if(P.tint.on && (P.tint.amount>0 || P.tint.accent>0)){
    const S = hue2rgb(P.tint.shadow), H = hue2rgb(P.tint.highlight), am = P.tint.amount, ac = P.tint.accent
    const im = a.getImageData(0,0,w,h), d = im.data
    for(let i=0;i<d.length;i+=4){
      const l = (0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2])/255
      for(let k=0;k<3;k++){
        const t = S[k] + (H[k]-S[k])*l
        d[i+k] = d[i+k]*(1-am) + t*am
      }
      if(ac>0 && l>0.34 && l<0.62){
        d[i]  = d[i]  *(1-ac) + 122*ac
        d[i+1]= d[i+1]*(1-ac) + 178*ac
        d[i+2]= d[i+2]*(1-ac) + 214*ac
      }
    }
    a.putImageData(im,0,0)
  }

  // Noise — toner, per fragment
  if(P.noise.on && P.noise.amount>0) noiseStage(a, w, h)

  // Master — dry/wet against the untouched source
  if(P.mix.on && P.mix.wet<1){
    a.save(); a.globalCompositeOperation='source-over'; a.globalAlpha = 1-P.mix.wet
    a.drawImage(src,0,0,w,h); a.restore()
  }

  // Put the original alpha back. A logo keeps its transparent background.
  {
    b.setTransform(1,0,0,1,0,0); b.globalCompositeOperation='source-over'; b.globalAlpha=1; b.filter='none'
    b.clearRect(0,0,w,h); b.drawImage(src,0,0,w,h)
    const srcA = b.getImageData(0,0,w,h).data
    const im = a.getImageData(0,0,w,h), d = im.data
    for(let i=3;i<d.length;i+=4) d[i] = srcA[i]
    a.putImageData(im,0,0)
  }
  return A
}

/* A flat colour, painted at any size — the source for paint-only mode. */
function paintCanvas(w,h){
  const c = cv(w,h), x = c.getContext('2d')
  if(paint && paint.type==='SOLID'){
    const {r,g,b} = paint.color
    x.fillStyle = `rgba(${Math.round(r*255)},${Math.round(g*255)},${Math.round(b*255)},${paint.opacity})`
  } else {
    x.fillStyle = '#808080'
  }
  x.fillRect(0,0,w,h)
  return c
}
function setMode(m){
  if(m==='fill' && !(paint && paint.type==='SOLID')) return
  mode = m
  document.getElementById('mBake').classList.toggle('on', m==='bake')
  document.getElementById('mFill').classList.toggle('on', m==='fill')
  preview()
}

function buildNav(){
  const nav = document.getElementById('chainNav')
  nav.innerHTML = '<span class="lbl">'+t().chain+'</span>'
  RACK.forEach(([key,name],i)=>{
    const b = document.createElement('button')
    b.innerHTML = '<span class="dot"></span>' + name
    if(!P[key].on) b.classList.add('off')
    b.onclick = ()=> rack.scrollTo({ left: devEls[i].offsetLeft - 6, behavior:'smooth' })
    nav.append(b)
  })
}
function markNav(){
  const nav = document.getElementById('chainNav')
  const x = rack.scrollLeft
  let best = 0, bd = 1e9
  devEls.forEach((el,i)=>{ const d = Math.abs(el.offsetLeft - 6 - x); if(d<bd){bd=d;best=i} })
  ;[...nav.querySelectorAll('button')].forEach((b,i)=>{
    b.classList.toggle('here', i===best)
    b.classList.toggle('off', !P[RACK[i][0]].on)
  })
}

function buildRack(){
  rack.innerHTML = ''
  devEls = []
  for(const [key,name,meta,rows] of RACK){
    const d = document.createElement('div'); d.className='dev'
    devEls.push(d)
    const h = document.createElement('div'); h.className='dh'
    const led = document.createElement('div'); led.className='led'+(P[key].on?' on':'')
    led.onclick = ()=>{ P[key].on=!P[key].on; led.classList.toggle('on',P[key].on); markNav(); preview(); onRelease() }
    const nm = document.createElement('span'); nm.className='dn'; nm.textContent=name
    const mt = document.createElement('span'); mt.className='dm'; mt.textContent=meta
    h.append(led,nm,mt); d.append(h)
    for(const [prop,label,min,max,step,fmt] of rows){
      const r = document.createElement('div'); r.className='row'
      const l = document.createElement('label'); l.textContent=label
      const i = document.createElement('input'); i.type='range'; i.min=min; i.max=max; i.step=step; i.value=P[key][prop]
      const v = document.createElement('span'); v.className='val mono'; v.textContent=fmt(P[key][prop])
      i.oninput = ()=>{ P[key][prop]=+i.value; v.textContent=fmt(+i.value); preview() }
      i.onchange = onRelease
      r.append(l,i,v); d.append(r)
    }
    rack.append(d)
  }
}
function syncMaster(){ wet.value = P.mix.wet; wetV.textContent = Math.round(P.mix.wet*100)+'%' }
wet.oninput = ()=>{ P.mix.wet = +wet.value; wetV.textContent = Math.round(P.mix.wet*100)+'%'; preview() }
wet.onchange = onRelease

function preview(){
  if(!small && mode!=='fill') return
  clearTimeout(timer)
  timer = setTimeout(()=>{
    let src, w, h
    if(mode==='fill'){
      const k = Math.min(1, 420/Math.max(nodeW||1, nodeH||1))
      w = Math.max(1, Math.round((nodeW||100)*k)); h = Math.max(1, Math.round((nodeH||100)*k))
      src = paintCanvas(w,h)
    } else {
      src = small; w = pw; h = ph
    }
    const out = runChain(src, w, h)
    prev.width = w; prev.height = h
    prev.getContext('2d').drawImage(out,0,0)
    prev.hidden = false; empty.hidden = true
    note.innerHTML = mode==='fill' ? t().fill : destructive() ? t().bake : t().safe
  }, 90)
}

/* ---------------- talking to figma ---------------- */
onmessage = async (e)=>{
  const msg = e.data.pluginMessage
  if(!msg) return

  if(msg.type === 'no-selection'){
    full = small = null
    prev.hidden = true; empty.hidden = false
    empty.style.color = ''
    empty.textContent = msg.count > 1 ? t().many : msg.count === 1 ? t().bad : t().empty
    applyBtn.disabled = true
    document.getElementById('target').textContent = '—'
    note.textContent = ''
    return
  }

  if(msg.type === 'error'){
    prev.hidden = true; empty.hidden = false
    empty.style.color = '#ff6b5e'
    empty.textContent = 'PLUGIN ERROR: ' + msg.message
    return
  }

  if(msg.type === 'source'){
    const blob = new Blob([msg.bytes], {type:'image/png'})
    const bmp = await createImageBitmap(blob)

    // bake the bitmap into a canvas: drawImage() is picky about ImageBitmap here
    full = cv(bmp.width, bmp.height)
    full.getContext('2d').drawImage(bmp,0,0)

    const k = Math.min(1, 420/Math.max(bmp.width, bmp.height))
    pw = Math.max(1, Math.round(bmp.width*k)); ph = Math.max(1, Math.round(bmp.height*k))
    small = cv(pw,ph)
    small.getContext('2d').drawImage(bmp,0,0,pw,ph)
    if(bmp.close) bmp.close()

    paint = msg.paint || null
    nodeW = msg.w || bmp.width; nodeH = msg.h || bmp.height
    const canFill = !!(paint && paint.type==='SOLID')
    const mf = document.getElementById('mFill')
    mf.disabled = !canFill
    mf.title = canFill ? '' : 'このレイヤーには単色の塗りがありません'
    if(!canFill && mode==='fill') mode = 'bake'
    if(msg.isFilled) mode = 'fill'
    document.getElementById('mBake').classList.toggle('on', mode==='bake')
    mf.classList.toggle('on', mode==='fill')

    if(msg.settings){
      for(const k2 in msg.settings) if(P[k2]) Object.assign(P[k2], msg.settings[k2])
      buildRack(); buildNav(); markNav(); syncMaster()
    }
    document.getElementById('target').textContent = msg.name.slice(0,26)
    applyBtn.disabled = false
    preview()
  }
}

/* `cap` limits the long edge. Live pushes at 1024 so the canvas keeps up;
   Apply goes to 2048. `preview` marks the layer as a fitting: switching LIVE
   off, or 元に戻す, takes it straight back off again. Only 適用 commits. */
let pending = null         // a release that arrived while we were rendering
async function push(cap, preview){
  if(busy){ pending = {cap, preview}; return }   // never drop the last one
  if(!full && mode!=='fill') return
  busy = true

  let out
  if(mode==='fill'){
    const k = Math.min(2, cap/Math.max(nodeW,nodeH))
    const w = Math.max(1, Math.round(nodeW*k)), h = Math.max(1, Math.round(nodeH*k))
    out = runChain(paintCanvas(w,h), w, h)
  } else {
    const k = Math.min(1, cap/Math.max(full.width, full.height))
    const w = Math.max(1, Math.round(full.width*k)), h = Math.max(1, Math.round(full.height*k))
    if(k < 1){
      const tmp = cv(w,h); tmp.getContext('2d').drawImage(full,0,0,w,h)
      out = runChain(tmp, w, h)
    } else {
      out = runChain(full, full.width, full.height)
    }
  }
  await new Promise(res => out.toBlob(async blob=>{
    const bytes = new Uint8Array(await blob.arrayBuffer())
    parent.postMessage({pluginMessage:{type:'apply', bytes, settings:P, mode, preview:!!preview}}, '*')
    res()
  }, 'image/png'))
  busy = false
  if(pending){ const q = pending; pending = null; push(q.cap, q.preview) }
}

const liveBtn = document.getElementById('live')
applyBtn.onclick = async ()=>{
  applyBtn.disabled = true
  applyBtn.textContent = t().working
  await new Promise(r=>setTimeout(r,16))
  await push(2048, false)
  live = false; liveBtn.classList.remove('on')
  applyBtn.textContent = t().apply
  applyBtn.disabled = false
}

liveBtn.onclick = ()=>{
  live = !live
  liveBtn.classList.toggle('on', live)
  if(live) push(1024, true)
  else parent.postMessage({pluginMessage:{type:'discard'}}, '*')   // a fitting is never kept
}
function onRelease(){ if(live) push(1024, true) }
document.getElementById('restore').onclick = ()=>{
  live = false; liveBtn.classList.remove('on')
  parent.postMessage({pluginMessage:{type:'restore'}}, '*')
}
