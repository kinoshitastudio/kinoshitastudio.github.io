<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,follow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>site clay — サイト全体を粘土化</title>
<style>
  html,body{margin:0;height:100%;background:#f3efe6;overflow:hidden;font-family:ui-monospace,"Space Mono",monospace}
  /* ライブサイトを丸ごと包む枠 */
  #stage{position:fixed;inset:0;}
  #site{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;
    /* ← ここが肝：揺らぎ(SVG) + パステルのクレイ色(CSS) */
    filter:url(#clayfx) saturate(.72) brightness(1.06) contrast(.92) sepia(.10) hue-rotate(-6deg);
    transition:filter .25s;}
  #site.off{filter:none}
  .panel{position:fixed;left:14px;bottom:14px;z-index:10;background:rgba(255,255,255,.85);
    border:1px solid rgba(0,0,0,.15);border-radius:10px;padding:10px 12px;display:flex;gap:14px;align-items:center;
    box-shadow:0 6px 20px rgba(0,0,0,.12);font-size:11px;color:#333;flex-wrap:wrap;max-width:94vw}
  .panel label{display:flex;flex-direction:column;gap:4px}
  .panel input[type=range]{width:120px}
  .panel input[type=text]{width:230px;font:11px ui-monospace,monospace;padding:5px 7px;border:1px solid #ccc;border-radius:5px}
  .panel button{font:11px ui-monospace,monospace;padding:7px 12px;border:1px solid #bbb;border-radius:6px;background:#fff;cursor:pointer}
  .panel button:hover{background:#eee}
  .note{position:fixed;right:14px;top:12px;z-index:10;font-size:10px;color:#998;background:rgba(255,255,255,.7);padding:6px 9px;border-radius:6px;max-width:280px;line-height:1.5}
</style>
</head>
<body>

<!-- 揺らぎフィルター。seed/scale を JS で動かして“ずっと生成され続ける”感を出す -->
<svg width="0" height="0" style="position:absolute">
  <filter id="clayfx" x="-6%" y="-6%" width="112%" height="112%" color-interpolation-filters="sRGB">
    <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.006 0.009" numOctaves="2" seed="3" result="n"/>
    <feGaussianBlur in="n" stdDeviation="1.2" result="ns"/>
    <feDisplacementMap id="disp" in="SourceGraphic" in2="ns" scale="20" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div id="stage">
  <iframe id="site" src="https://kinoshita.studio" referrerpolicy="no-referrer"></iframe>
</div>

<div class="note">本物のサイト（iframe）に SVG＋CSS フィルターを重ねています。スクロール・クリックはそのまま効きます。<br>※ 表示されない/枠が出るサイトは frame拒否(X-Frame-Options)です。</div>

<div class="panel">
  <label>うねりの強さ<input id="scale" type="range" min="0" max="55" value="20"></label>
  <label>うねりの細かさ<input id="freq" type="range" min="2" max="20" value="7"></label>
  <label>動く速さ<input id="speed" type="range" min="0" max="100" value="40"></label>
  <button id="toggle">クレイ: ON</button>
  <input id="url" type="text" value="https://kinoshita.studio" placeholder="https://...">
  <button id="go">読込</button>
</div>

<script>
const turb=document.getElementById('turb'), disp=document.getElementById('disp'), site=document.getElementById('site');
let baseScale=20, baseFreq=0.007, speed=0.4, on=true, t0=performance.now(), last=0;

// quasi-非周期で揺らぎを更新（単調＋無理数比の和で“ループ感”を消す）
function loop(now){
  requestAnimationFrame(loop);
  if(now-last < 1000/22) return; last=now;          // 22fps スロットル（カクつき＝生成感）
  if(!on) return;
  const t=(now-t0)/1000*speed;
  // baseFrequency をゆっくりドリフト（非周期）
  const fx=baseFreq*(1+0.18*Math.sin(t*0.37)+0.12*Math.sin(t*0.91+1.3));
  const fy=baseFreq*(1+0.18*Math.sin(t*0.31+2.1)+0.12*Math.sin(t*0.83));
  turb.setAttribute('baseFrequency', fx.toFixed(5)+' '+fy.toFixed(5));
  // 変位スケールも軽く呼吸
  const sc=baseScale*(1+0.12*Math.sin(t*0.5+0.4));
  disp.setAttribute('scale', sc.toFixed(2));
  // たまに seed を進めて模様そのものを作り直す（＝生成され直す）
  if(Math.floor(t)%2===0 && Math.floor(t)!==loop._s){ loop._s=Math.floor(t); turb.setAttribute('seed', (parseInt(turb.getAttribute('seed'))+1)); }
}
requestAnimationFrame(loop);

document.getElementById('scale').oninput=e=>baseScale=+e.target.value;
document.getElementById('freq').oninput=e=>baseFreq=(+e.target.value)/1000;
document.getElementById('speed').oninput=e=>speed=(+e.target.value)/100;
document.getElementById('toggle').onclick=e=>{ on=!on; site.classList.toggle('off',!on);
  if(!on){ disp.setAttribute('scale','0'); } e.target.textContent='クレイ: '+(on?'ON':'OFF'); };
document.getElementById('go').onclick=()=>{ site.src=document.getElementById('url').value; };
document.getElementById('url').addEventListener('keydown',e=>{ if(e.key==='Enter') site.src=e.target.value; });
</script>
</body>
</html>
