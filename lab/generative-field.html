<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,follow">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>realtime generative — prototype</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:ui-monospace,"Space Mono",monospace}
  #c{display:block;width:100vw;height:100vh}
  .hud{position:fixed;left:14px;bottom:12px;color:rgba(255,255,255,.6);font-size:11px;letter-spacing:.04em;
       mix-blend-mode:difference;pointer-events:none;line-height:1.6}
  .hud b{color:rgba(255,255,255,.9)}
  .err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#e55;font-size:14px;padding:24px;text-align:center}
  .bar{position:fixed;right:14px;bottom:12px;display:flex;gap:6px;align-items:center}
  .bar button{font:11px/1 ui-monospace,monospace;color:#ddd;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.25);border-radius:4px;padding:6px 10px;cursor:pointer}
  .bar button:hover{background:rgba(255,255,255,.18)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">realtime generative field · <b id="fpslabel">20fps</b><br>クリックで再シード · F でフルスクリーン</div>
<div class="bar">
  <button id="speed">速度: 20fps</button>
  <button id="reseed">再シード</button>
</div>
<script>
const cv = document.getElementById('c');
const gl = cv.getContext('webgl2', { antialias:false, preserveDrawingBuffer:false });
if (!gl) { document.body.innerHTML = '<div class="err">WebGL2 が使えないブラウザです。Chrome / Safari 最新版でお試しください。</div>'; }

// ---- float color buffer (なければ8bitにフォールバック) ----
const hasFloat = gl.getExtension('EXT_color_buffer_float');
const STATE_TYPE = hasFloat ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;
const STATE_IFMT = hasFloat ? gl.RGBA16F : gl.RGBA8;

// ---- shaders ----
const VERT = `#version 300 es
const vec2 V[3]=vec2[3](vec2(-1.,-1.),vec2(3.,-1.),vec2(-1.,3.));
out vec2 vUv;
void main(){ vec2 p=V[gl_VertexID]; vUv=p*0.5+0.5; gl_Position=vec4(p,0.,1.); }`;

const NOISE = `
float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float vnoise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
  float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y); }
float fbm(vec2 p){ float v=0.,a=.5; mat2 m=mat2(1.6,1.2,-1.2,1.6);
  for(int i=0;i<5;i++){ v+=a*vnoise(p); p=m*p; a*=.5; } return v; }
vec2 curl(vec2 p){ float e=.01;
  float n1=fbm(p+vec2(0,e)),n2=fbm(p-vec2(0,e)),n3=fbm(p+vec2(e,0)),n4=fbm(p-vec2(e,0));
  return vec2(n1-n2, -(n3-n4))/(2.*e); }`;

// シミュレーション: 前フレームを流れに沿って移流 + ノイズ注入（生成され育っていく感じ）
const SIM = `#version 300 es
precision highp float;
${NOISE}
uniform sampler2D uState; uniform vec2 uRes; uniform float uTime; uniform int uFrame; uniform float uSeed;
in vec2 vUv; out vec4 o;
void main(){
  float t=uTime*0.08;
  // ドメインワープした流れ場で前フレームを移流
  vec2 fl = curl(vUv*3.0 + t*0.6 + uSeed) * 0.0016;
  vec3 adv = texture(uState, vUv + fl).rgb;
  // 注入する生成ノイズ（チャンネルごとに少しずらして色がにじむ）
  float nR=fbm(vUv*4.2 + vec2(t,0.0)      + fl*40.0 + uSeed);
  float nG=fbm(vUv*4.2 + vec2(0.0,t)      + 7.3);
  float nB=fbm(vUv*4.2 - vec2(t*0.8,t)    + 19.1);
  vec3 seed=vec3(nR,nG,nB);
  vec3 next=mix(adv, seed, 0.065);
  next=(next-0.5)*1.045+0.5;            // 軽いコントラストで構造を保つ
  if(uFrame<2) next=seed;              // 初期シード
  o=vec4(clamp(next,0.,1.),1.);
}`;

// 表示: フィールド→色（昔のAI生成っぽい濁り・粒状・色収差・ポスタライズ）
const DISP = `#version 300 es
precision highp float;
uniform sampler2D uState; uniform vec2 uRes; uniform float uTime;
in vec2 vUv; out vec4 o;
vec3 pal(float x){ return 0.5+0.5*cos(6.28318*(x + vec3(0.0,0.36,0.62))); }
float grain(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
void main(){
  vec3 s=texture(uState,vUv).rgb;
  float v=dot(s,vec3(0.4,0.35,0.25));
  vec3 col=mix(s, pal(v*1.5 + uTime*0.015), 0.55);
  col=pow(col,vec3(0.85));
  float ca=0.0018;                      // 色収差
  col.r=mix(col.r, texture(uState,vUv+vec2(ca,0)).r,0.5);
  col.b=mix(col.b, texture(uState,vUv-vec2(ca,0)).b,0.5);
  col=floor(col*22.0)/22.0;             // ポスタライズ（バンディング）
  col+=(grain(vUv*uRes+uTime)*2.0-1.0)*0.045; // フィルムグレイン
  float vg=smoothstep(1.25,0.35,length(vUv-0.5));
  col*=mix(0.8,1.0,vg);                  // ビネット
  o=vec4(clamp(col,0.,1.),1.);
}`;

function sh(type, src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){ console.error(gl.getShaderInfoLog(s),src); } return s; }
function prog(fs){ const p=gl.createProgram(); gl.attachShader(p,sh(gl.VERTEX_SHADER,VERT));
  gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs)); gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p)); return p; }
const simP=prog(SIM), dispP=prog(DISP);
const vao=gl.createVertexArray(); gl.bindVertexArray(vao);

// ---- ping-pong framebuffers ----
let texA,texB,fboA,fboB,simW,simH;
function mkTex(w,h){ const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,STATE_IFMT,w,h,0,gl.RGBA,STATE_TYPE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.MIRRORED_REPEAT);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.MIRRORED_REPEAT); return t; }
function mkFbo(t){ const f=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0); return f; }

let frame=0, seed=Math.random()*10;
function resize(){
  const dpr=Math.min(window.devicePixelRatio||1, 2);
  cv.width=Math.floor(innerWidth*dpr); cv.height=Math.floor(innerHeight*dpr);
  // シムは低解像度（生成っぽい質感＋軽さ）。横900pxを上限に。
  const scale=Math.min(1, 900/(innerWidth));
  simW=Math.max(64,Math.floor(innerWidth*scale)); simH=Math.max(64,Math.floor(innerHeight*scale));
  texA=mkTex(simW,simH); texB=mkTex(simW,simH); fboA=mkFbo(texA); fboB=mkFbo(texB); frame=0;
}
window.addEventListener('resize', resize); resize();

let readT=()=>texA, writeT=()=>texB, readF=()=>fboA, writeF=()=>fboB, swap=false;
function getRead(){ return swap?texB:texA; } function getWriteFbo(){ return swap?fboA:fboB; }

// ---- 20fps スロットル ----
let fps=20, interval=1000/fps, last=0, t0=performance.now();
function setFps(v){ fps=v; interval=1000/fps; document.getElementById('speed').textContent='速度: '+v+'fps';
  document.getElementById('fpslabel').textContent=v+'fps'; }

function render(now){
  requestAnimationFrame(render);
  if(now-last < interval) return; last=now;
  const time=(now-t0)/1000;

  // --- sim pass ---
  gl.useProgram(simP); gl.viewport(0,0,simW,simH);
  gl.bindFramebuffer(gl.FRAMEBUFFER, getWriteFbo());
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, getRead());
  gl.uniform1i(gl.getUniformLocation(simP,'uState'),0);
  gl.uniform2f(gl.getUniformLocation(simP,'uRes'),simW,simH);
  gl.uniform1f(gl.getUniformLocation(simP,'uTime'),time);
  gl.uniform1i(gl.getUniformLocation(simP,'uFrame'),frame);
  gl.uniform1f(gl.getUniformLocation(simP,'uSeed'),seed);
  gl.drawArrays(gl.TRIANGLES,0,3);
  swap=!swap; frame++;

  // --- display pass ---
  gl.useProgram(dispP); gl.viewport(0,0,cv.width,cv.height);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, getRead());
  gl.uniform1i(gl.getUniformLocation(dispP,'uState'),0);
  gl.uniform2f(gl.getUniformLocation(dispP,'uRes'),cv.width,cv.height);
  gl.uniform1f(gl.getUniformLocation(dispP,'uTime'),time);
  gl.drawArrays(gl.TRIANGLES,0,3);
}
requestAnimationFrame(render);

// ---- controls ----
cv.addEventListener('click', ()=>{ seed=Math.random()*10; frame=0; });
document.getElementById('reseed').addEventListener('click', e=>{ e.stopPropagation(); seed=Math.random()*10; frame=0; });
document.getElementById('speed').addEventListener('click', e=>{ e.stopPropagation();
  const order=[12,20,30,60]; setFps(order[(order.indexOf(fps)+1)%order.length]); });
addEventListener('keydown', e=>{ if(e.key==='f'||e.key==='F'){ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }});
setFps(20);
</script>
</body>
</html>
