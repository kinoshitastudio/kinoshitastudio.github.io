<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 280px;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      padding: 28px 24px 24px;
    }

    h1 {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.25em;
      margin-bottom: 24px;
    }

    h1 img {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
    }

    label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.1em;
      color: #555;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      background: #111;
      border: 1px solid #222;
      border-radius: 4px;
      color: #fff;
      font-size: 14px;
      line-height: 1.6;
      padding: 10px 12px;
      resize: none;
      height: 80px;
      outline: none;
      font-family: inherit;
      letter-spacing: 0.03em;
    }

    textarea:focus { border-color: #444; }
    textarea::placeholder { color: #333; }

    .duration-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
    }

    .duration-row label { margin-bottom: 0; flex: 1; }

    input[type="number"] {
      width: 56px;
      background: #111;
      border: 1px solid #222;
      border-radius: 4px;
      color: #fff;
      font-size: 14px;
      padding: 6px 10px;
      outline: none;
      font-family: inherit;
      text-align: center;
    }

    input[type="number"]:focus { border-color: #444; }
    .unit { font-size: 11px; color: #555; }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #1a1a1a;
    }

    .toggle-label {
      font-size: 13px;
      color: #aaa;
      letter-spacing: 0.03em;
    }

    .toggle-sub {
      font-size: 11px;
      color: #444;
      margin-top: 2px;
      letter-spacing: 0.02em;
    }

    .switch {
      position: relative;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      inset: 0;
      background: #222;
      border-radius: 22px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .slider:before {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      left: 3px;
      top: 3px;
      background: #555;
      border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }

    .switch input:checked + .slider { background: #fff; }
    .switch input:checked + .slider:before {
      transform: translateX(18px);
      background: #000;
    }

    button {
      margin-top: 20px;
      width: 100%;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      padding: 10px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }

    button:hover { background: #ddd; }

    #status {
      text-align: center;
      font-size: 11px;
      color: #555;
      margin-top: 10px;
      height: 16px;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <h1><img src="icon48.png" alt="">ENOUGH</h1>

  <label>あなたの言葉</label>
  <textarea id="message" placeholder="数字は、あなたじゃない。"></textarea>

  <div class="duration-row">
    <label>表示時間</label>
    <input type="number" id="duration" min="1" max="30" value="1">
    <span class="unit">秒</span>
  </div>

  <div class="toggle-row">
    <div>
      <div class="toggle-label">数字を隠す</div>
      <div class="toggle-sub">いいね・フォロワー数を非表示</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="hideMetrics" checked>
      <span class="slider"></span>
    </label>
  </div>

  <button id="save">保存</button>
  <p id="status"></p>

  <script src="popup.js"></script>
</body>
</html>
