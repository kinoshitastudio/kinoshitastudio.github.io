<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research Admin — Kinoshita Studio</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400&family=Space+Mono&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{--bg:#4a4a47;--fg:#f0ede8;--gray:#a8a8a3;--border:#5a5a57;--subtle:#3d3d3a;--gold:#a89060;--err:#c0604a}
    html,body{min-height:100%;background:var(--bg);color:var(--fg);font-family:'Zen Kaku Gothic New',sans-serif;font-weight:300;-webkit-font-smoothing:antialiased}
    a,button{cursor:pointer}

    /* ── LOCK SCREEN ── */
    #lock{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2rem;z-index:500;transition:opacity .3s}
    #lock.hide{opacity:0;pointer-events:none}
    .lock-label{font-family:'Space Mono',monospace;font-size:.6rem;letter-spacing:.25em;text-transform:uppercase;color:var(--gray)}
    .lock-input{background:transparent;border:none;border-bottom:1px solid var(--border);padding:.7rem 0;font-family:'Space Mono',monospace;font-size:1rem;color:var(--fg);outline:none;width:240px;text-align:center;letter-spacing:.2em;transition:border-color .2s}
    .lock-input:focus{border-bottom-color:var(--fg)}
    .lock-input::placeholder{color:var(--border);letter-spacing:.1em}
    .lock-btn{background:var(--fg);color:var(--bg);border:none;padding:.7rem 2rem;font-family:'Space Mono',monospace;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:opacity .2s}
    .lock-btn:hover{opacity:.8}
    .lock-err{font-family:'Space Mono',monospace;font-size:.55rem;color:var(--err);letter-spacing:.1em;min-height:1em}

    /* ── ADMIN UI ── */
    #admin{display:none;padding:4rem 3rem;max-width:860px;margin:0 auto}
    #admin.show{display:block}

    .admin-header{margin-bottom:3rem;border-bottom:1px solid var(--border);padding-bottom:2rem;display:flex;justify-content:space-between;align-items:flex-end}
    .admin-title-group .tag{font-family:'Space Mono',monospace;font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gray);margin-bottom:.5rem}
    .admin-title-group h1{font-size:1.1rem;font-weight:300}
    .logout-btn{background:none;border:none;font-family:'Space Mono',monospace;font-size:.52rem;color:var(--gray);letter-spacing:.12em;cursor:pointer;text-decoration:underline;text-underline-offset:3px;transition:color .2s}
    .logout-btn:hover{color:var(--fg)}

    /* FORM */
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem 2.5rem;margin-bottom:2rem}
    .form-full{grid-column:1/-1}
    .form-group{display:flex;flex-direction:column;gap:.4rem}
    .form-group label{font-family:'Space Mono',monospace;font-size:.52rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gray)}
    .form-group input,
    .form-group textarea,
    .form-group select{background:transparent;border:none;border-bottom:1px solid var(--border);padding:.6rem 0;font-family:'Zen Kaku Gothic New',sans-serif;font-size:.9rem;font-weight:300;color:var(--fg);outline:none;transition:border-color .2s;-webkit-appearance:none}
    .form-group select{cursor:pointer}
    .form-group select option{background:#3d3d3a;color:var(--fg)}
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus{border-bottom-color:var(--fg)}
    .form-group textarea{resize:vertical;min-height:140px;line-height:1.8}
    .form-hint{font-size:.62rem;color:var(--gray);line-height:1.6;margin-top:.3rem}

    /* ACTIONS */
    .actions{display:flex;gap:1rem;margin-bottom:3rem;flex-wrap:wrap}
    .btn-generate{background:var(--fg);color:var(--bg);border:none;padding:.8rem 1.8rem;font-family:'Space Mono',monospace;font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;transition:opacity .2s}
    .btn-generate:hover{opacity:.8}
    .btn-reset{background:none;border:1px solid var(--border);color:var(--gray);padding:.8rem 1.5rem;font-family:'Space Mono',monospace;font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;transition:border-color .2s,color .2s}
    .btn-reset:hover{border-color:var(--gray);color:var(--fg)}

    /* PREVIEW */
    .preview-section{border:1px solid var(--border);padding:2rem;margin-bottom:2rem}
    .preview-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem}
    .preview-label{font-family:'Space Mono',monospace;font-size:.52rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gray)}
    .btn-copy{background:var(--gold);color:var(--bg);border:none;padding:.5rem 1.2rem;font-family:'Space Mono',monospace;font-size:.52rem;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:opacity .2s}
    .btn-copy:hover{opacity:.85}
    .btn-copy.copied{background:#6a9060}

    /* Preview render — mirrors experience-research.html styles */
    .preview-render{border-top:1px solid var(--border);padding-top:2rem}
    .p-feed-item{display:grid;grid-template-columns:180px 1fr;gap:3rem}
    .p-feed-date{font-family:'Space Mono',monospace;font-size:.5rem;color:#8a8a85;letter-spacing:.15em;margin-bottom:.8rem}
    .p-feed-tag{display:inline-block;font-family:'Space Mono',monospace;font-size:.48rem;color:var(--gray);letter-spacing:.2em;text-transform:uppercase;border:1px solid var(--border);padding:.3rem .7rem}
    .p-feed-theme{font-family:'Space Mono',monospace;font-size:.55rem;color:var(--gray);letter-spacing:.2em;text-transform:uppercase;margin-bottom:1.2rem}
    .p-feed-title{font-family:'Zen Kaku Gothic New',sans-serif;font-weight:400;font-size:1.1rem;letter-spacing:.05em;margin-bottom:1.2rem;line-height:1.6}
    .p-feed-text{font-family:'Zen Kaku Gothic New',sans-serif;font-weight:400;font-size:.88rem;color:var(--gray);line-height:2.4;margin-bottom:.8rem}
    .p-feed-img{width:100%;margin-top:1.5rem;background:var(--subtle);display:block}
    @media(max-width:600px){.p-feed-item{grid-template-columns:1fr;gap:1rem}}

    /* HTML output */
    .output-section{margin-bottom:3rem}
    .output-label{font-family:'Space Mono',monospace;font-size:.52rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gray);margin-bottom:1rem;display:flex;justify-content:space-between;align-items:center}
    .html-output{background:var(--subtle);padding:1.5rem;font-family:'Space Mono',monospace;font-size:.65rem;line-height:1.8;color:var(--gray);white-space:pre-wrap;word-break:break-all;border:1px solid var(--border);max-height:400px;overflow:auto}

    /* IMPORT */
    .import-section{border:1px solid var(--border);padding:1.8rem;margin-bottom:2.5rem;background:var(--subtle)}
    .import-label{font-family:'Space Mono',monospace;font-size:.52rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gray);margin-bottom:1rem}
    .btn-import{margin-top:1rem;background:none;border:1px solid var(--border);color:var(--gray);padding:.55rem 1.2rem;font-family:'Space Mono',monospace;font-size:.55rem;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;transition:border-color .2s,color .2s}
    .btn-import:hover{border-color:var(--fg);color:var(--fg)}
    .import-err{font-family:'Space Mono',monospace;font-size:.5rem;color:var(--err);margin-top:.5rem;min-height:1em}

    /* PASTE GUIDE */
    .guide{border-left:2px solid rgba(168,144,96,0.35);padding:1rem 1.5rem;margin-top:2rem}
    .guide p{font-size:.78rem;color:var(--gray);line-height:2;margin-bottom:.3rem}
    .guide code{font-family:'Space Mono',monospace;font-size:.62rem;color:var(--gold)}

    @media(max-width:600px){
      #admin{padding:3rem 1.5rem}
      .form-grid{grid-template-columns:1fr}
      .form-full{grid-column:1}
      .admin-header{flex-direction:column;align-items:flex-start;gap:1rem}
      .p-feed-item{grid-template-columns:1fr;gap:1rem}
    }
  </style>
</head>
<body>

<!-- ── LOCK SCREEN ── -->
<div id="lock">
  <div class="lock-label">Research Admin</div>
  <input class="lock-input" id="pw-input" type="password" placeholder="password" autocomplete="current-password">
  <button class="lock-btn" onclick="tryLogin()">Enter</button>
  <div class="lock-err" id="pw-err"></div>
</div>

<!-- ── ADMIN ── -->
<div id="admin">

  <div class="admin-header">
    <div class="admin-title-group">
      <div class="tag">Research Admin</div>
      <h1>体験研究ログ — 新規投稿</h1>
    </div>
    <button class="logout-btn" onclick="logout()">ログアウト</button>
  </div>

  <!-- IMPORT (既存記事の編集) -->
  <div class="import-section">
    <div class="import-label">既存記事を編集する（任意）</div>
    <div class="form-group">
      <label>既存の feed-item HTML を貼り付け → 読み込む</label>
      <textarea id="import-html" placeholder="<div class=&quot;feed-item&quot;>...を貼り付けてください" style="min-height:90px;font-family:'Space Mono',monospace;font-size:.62rem;color:var(--gray);"></textarea>
    </div>
    <button class="btn-import" onclick="importHTML()">HTMLをフォームに読み込む</button>
    <div class="import-err" id="import-err"></div>
  </div>

  <!-- FORM -->
  <div class="form-grid">
    <div class="form-group">
      <label>日付</label>
      <input type="text" id="f-date" placeholder="2026.06" maxlength="10">
    </div>
    <div class="form-group">
      <label>タグ</label>
      <input type="text" id="f-tag" placeholder="Interface / App">
    </div>
    <div class="form-group form-full">
      <label>テーマライン</label>
      <input type="text" id="f-theme" placeholder="インターフェースの体験 — Behavior Change">
    </div>
    <div class="form-group form-full">
      <label>タイトル</label>
      <input type="text" id="f-title" placeholder="記事のタイトルをここに">
    </div>
    <div class="form-group form-full">
      <label>本文</label>
      <textarea id="f-body" placeholder="段落ごとに空行で区切ってください。&#10;&#10;複数段落の場合、それぞれが &lt;p&gt; タグになります。&#10;&#10;**太字**で強調できます。"></textarea>
      <div class="form-hint">空行で段落を区切る。**テキスト** で &lt;strong&gt; を挿入。</div>
    </div>
    <div class="form-group">
      <label>画像 URL（任意）</label>
      <input type="text" id="f-img" placeholder="assets/projects/research/xxx.png">
    </div>
    <div class="form-group">
      <label>画像スタイル</label>
      <select id="f-img-style">
        <option value="16/9">横長 (16/9)</option>
        <option value="1/1">正方形 (1/1)</option>
        <option value="3/4">縦長 (3/4)</option>
        <option value="none">なし</option>
      </select>
    </div>
    <div class="form-group">
      <label>追記リンク テキスト（任意）</label>
      <input type="text" id="f-link-text" placeholder="Project Page →">
    </div>
    <div class="form-group">
      <label>追記リンク URL（任意）</label>
      <input type="text" id="f-link-url" placeholder="project-xxx.html">
    </div>
  </div>

  <div class="actions">
    <button class="btn-generate" onclick="generate()">プレビュー生成</button>
    <button class="btn-reset" onclick="resetForm()">リセット</button>
  </div>

  <!-- PREVIEW -->
  <div class="preview-section" id="preview-section" style="display:none">
    <div class="preview-header">
      <div class="preview-label">Preview</div>
      <button class="btn-copy" id="copy-btn" onclick="copyHTML()">HTMLをコピー</button>
    </div>
    <div class="preview-render" id="preview-render"></div>
  </div>

  <!-- HTML OUTPUT -->
  <div class="output-section" id="output-section" style="display:none">
    <div class="output-label">
      <span>生成 HTML</span>
    </div>
    <div class="html-output" id="html-output"></div>
    <div class="guide">
      <p>① 上の「HTMLをコピー」ボタンでクリップボードにコピー</p>
      <p>② <code>experience-research.html</code> を開く</p>
      <p>③ <code>&lt;!-- ──── feed start ──── --&gt;</code> の直後（または既存の <code>.feed-item</code> の上）にペースト</p>
      <p>④ GitHub にアップロードして完了</p>
    </div>
  </div>

</div>

<script>
  // ── AUTH ───────────────────────────────────────
  const PW_KEY = 'ks_research_admin';
  const PW     = 'ks2026';  // ← パスワードをここで変更

  function tryLogin() {
    const val = document.getElementById('pw-input').value;
    if (val === PW) {
      sessionStorage.setItem(PW_KEY, '1');
      document.getElementById('lock').classList.add('hide');
      document.getElementById('admin').classList.add('show');
      document.getElementById('pw-err').textContent = '';
    } else {
      document.getElementById('pw-err').textContent = 'incorrect password';
      document.getElementById('pw-input').value = '';
      document.getElementById('pw-input').focus();
    }
  }

  function logout() {
    sessionStorage.removeItem(PW_KEY);
    document.getElementById('admin').classList.remove('show');
    document.getElementById('lock').classList.remove('hide');
    document.getElementById('pw-input').value = '';
  }

  document.getElementById('pw-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') tryLogin();
  });

  // ── AUTO LOGIN ─────────────────────────────────
  if (sessionStorage.getItem(PW_KEY)) {
    document.getElementById('lock').classList.add('hide');
    document.getElementById('admin').classList.add('show');
  }

  // ── GENERATE ───────────────────────────────────
  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function parseBody(raw) {
    return raw.trim().split(/\n\n+/).map(para => {
      const escaped = escapeHtml(para.trim())
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      return `    <p class="feed-text">${escaped}</p>`;
    }).join('\n');
  }

  let generatedHTML = '';

  function generate() {
    const date      = document.getElementById('f-date').value.trim();
    const tag       = document.getElementById('f-tag').value.trim();
    const theme     = document.getElementById('f-theme').value.trim();
    const title     = document.getElementById('f-title').value.trim();
    const body      = document.getElementById('f-body').value;
    const imgUrl    = document.getElementById('f-img').value.trim();
    const imgStyle  = document.getElementById('f-img-style').value;
    const linkText  = document.getElementById('f-link-text').value.trim();
    const linkUrl   = document.getElementById('f-link-url').value.trim();

    if (!title || !body.trim()) {
      alert('タイトルと本文は必須です。');
      return;
    }

    const paragraphs = parseBody(body);

    let imgHTML = '';
    if (imgUrl && imgStyle !== 'none') {
      imgHTML = `\n    <img src="${escapeHtml(imgUrl)}" alt="木下スタジオ 体験研究：${escapeHtml(title)}" class="feed-img" style="aspect-ratio:${imgStyle};object-fit:cover;object-position:top;" loading="lazy">`;
    }

    let linkHTML = '';
    if (linkText && linkUrl) {
      linkHTML = `\n    <div style="margin-top:1.2rem;"><a href="${escapeHtml(linkUrl)}" style="font-family:'Space Mono',monospace;font-size:.52rem;letter-spacing:.18em;color:#a89060;text-decoration:none;border-bottom:1px solid rgba(168,144,96,0.35);padding-bottom:.15rem;">${escapeHtml(linkText)}</a></div>`;
    }

    generatedHTML =
`    <div class="feed-item">
      <div class="feed-meta">
        <div class="feed-date">${escapeHtml(date)}</div>
        <div class="feed-tag">${escapeHtml(tag)}</div>
      </div>
      <div class="feed-body">
        <div class="feed-theme">${escapeHtml(theme)}</div>
        <div class="feed-title">${escapeHtml(title)}</div>
${paragraphs}${imgHTML}${linkHTML}
      </div>
    </div>`;

    renderPreview({ date, tag, theme, title, body, imgUrl, imgStyle, linkText, linkUrl });
    document.getElementById('html-output').textContent = generatedHTML;
    document.getElementById('preview-section').style.display = '';
    document.getElementById('output-section').style.display = '';
    document.getElementById('copy-btn').textContent = 'HTMLをコピー';
    document.getElementById('copy-btn').classList.remove('copied');
    document.getElementById('preview-section').scrollIntoView({ behavior: 'smooth' });
  }

  function renderPreview({ date, tag, theme, title, body, imgUrl, imgStyle, linkText, linkUrl }) {
    const paras = body.trim().split(/\n\n+/).map(p => {
      const html = p.trim().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
      return `<p class="p-feed-text">${html}</p>`;
    }).join('');

    let imgEl = '';
    if (imgUrl && imgStyle !== 'none') {
      imgEl = `<img src="${imgUrl}" class="p-feed-img" style="aspect-ratio:${imgStyle};object-fit:cover;object-position:top;" loading="lazy">`;
    }

    let linkEl = '';
    if (linkText && linkUrl) {
      linkEl = `<div style="margin-top:1rem;"><a href="${linkUrl}" style="font-family:'Space Mono',monospace;font-size:.52rem;letter-spacing:.18em;color:#a89060;text-decoration:none;border-bottom:1px solid rgba(168,144,96,0.35);padding-bottom:.1rem;">${linkText}</a></div>`;
    }

    document.getElementById('preview-render').innerHTML = `
      <div class="p-feed-item">
        <div>
          <div class="p-feed-date">${date}</div>
          <div class="p-feed-tag">${tag}</div>
        </div>
        <div>
          <div class="p-feed-theme">${theme}</div>
          <div class="p-feed-title">${title}</div>
          ${paras}${imgEl}${linkEl}
        </div>
      </div>`;
  }

  function copyHTML() {
    if (!generatedHTML) return;
    navigator.clipboard.writeText(generatedHTML).then(() => {
      const btn = document.getElementById('copy-btn');
      btn.textContent = 'コピーしました ✓';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = 'HTMLをコピー';
        btn.classList.remove('copied');
      }, 2500);
    }).catch(() => {
      // fallback
      const ta = document.createElement('textarea');
      ta.value = generatedHTML;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    });
  }

  // ── IMPORT ─────────────────────────────────────
  function importHTML() {
    const raw = document.getElementById('import-html').value.trim();
    document.getElementById('import-err').textContent = '';
    if (!raw) return;

    let doc;
    try {
      const parser = new DOMParser();
      // wrap to ensure valid parsing
      doc = parser.parseFromString('<div>' + raw + '</div>', 'text/html');
    } catch(e) {
      document.getElementById('import-err').textContent = 'parse error';
      return;
    }

    const item = doc.querySelector('.feed-item');
    if (!item) {
      document.getElementById('import-err').textContent = '.feed-item が見つかりません。';
      return;
    }

    const get = sel => (item.querySelector(sel) || {}).textContent || '';

    document.getElementById('f-date').value  = get('.feed-date').trim();
    document.getElementById('f-tag').value   = get('.feed-tag').trim();
    document.getElementById('f-theme').value = get('.feed-theme').trim();
    document.getElementById('f-title').value = get('.feed-title').trim();

    // body: each .feed-text → paragraph, <strong> → **...**
    const paras = Array.from(item.querySelectorAll('.feed-text')).map(p => {
      return p.innerHTML
        .replace(/<strong>(.*?)<\/strong>/gi, '**$1**')
        .replace(/<[^>]+>/g, '')
        .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"')
        .trim();
    });
    document.getElementById('f-body').value = paras.join('\n\n');

    // image
    const img = item.querySelector('img.feed-img');
    if (img) {
      document.getElementById('f-img').value = img.getAttribute('src') || '';
      const ar = (img.style.aspectRatio || '16/9').trim();
      const sel = document.getElementById('f-img-style');
      if (['16/9','1/1','3/4'].includes(ar)) sel.value = ar;
      else sel.value = '16/9';
    } else {
      document.getElementById('f-img').value = '';
      document.getElementById('f-img-style').value = 'none';
    }

    // link
    const linkEl = item.querySelector('.feed-body a, .feed-body [style*="color:#a89060"] a, a[style*="a89060"]');
    if (linkEl) {
      document.getElementById('f-link-text').value = linkEl.textContent.trim();
      document.getElementById('f-link-url').value  = linkEl.getAttribute('href') || '';
    } else {
      document.getElementById('f-link-text').value = '';
      document.getElementById('f-link-url').value  = '';
    }

    document.getElementById('import-html').value = '';
    document.getElementById('import-err').textContent = '✓ 読み込み完了。フォームを編集してプレビューを生成してください。';
    setTimeout(() => { document.getElementById('import-err').textContent = ''; }, 3000);
    document.getElementById('f-title').scrollIntoView({ behavior: 'smooth' });
  }

  function resetForm() {
    ['f-date','f-tag','f-theme','f-title','f-body','f-img','f-link-text','f-link-url','import-html']
      .forEach(id => document.getElementById(id).value = '');
    document.getElementById('f-img-style').value = '16/9';
    document.getElementById('preview-section').style.display = 'none';
    document.getElementById('output-section').style.display = 'none';
    generatedHTML = '';
  }
</script>
</body>
</html>
