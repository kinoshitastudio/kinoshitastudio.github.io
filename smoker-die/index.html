<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smoker Die — Kinoshita Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400&family=Space+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:        #EBE8E2;
      --ink:       #1a1a18;
      --ink-light: #3a3a34;
      --ink-faint: #7a7770;
      --gold:      #a89060;
      --border:    rgba(26,26,24,0.12);
    }

    html { height: 100%; }

    body {
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Zen Kaku Gothic New', sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 1000; opacity: 0.5;
    }

    /* SCREENS */
    .screen {
      display: none;
      min-height: 100svh;
      padding: 3.5rem 2rem;
      flex-direction: column;
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
      animation: fadeIn 0.3s ease;
    }
    .screen.active { display: flex; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* TYPOGRAPHY */
    .mono { font-family: 'Space Mono', monospace; }
    .tag {
      font-family: 'Space Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }

    /* FORMS */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .form-group label {
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      color: var(--ink-faint);
      line-height: 1.5;
    }
    .form-group input,
    .form-group textarea {
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      padding: 0.6rem 0;
      font-family: 'Zen Kaku Gothic New', sans-serif;
      font-size: 1rem;
      font-weight: 300;
      color: var(--ink);
      outline: none;
      width: 100%;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }
    .form-group input:focus,
    .form-group textarea:focus { border-bottom-color: var(--ink); }
    .form-group textarea { resize: none; height: 72px; line-height: 1.7; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }

    /* BUTTONS */
    .btn-primary {
      background: var(--ink); color: var(--bg);
      border: none; padding: 1rem 2rem;
      font-family: 'Zen Kaku Gothic New', sans-serif;
      font-size: 0.9rem; font-weight: 300;
      letter-spacing: 0.06em; cursor: pointer; width: 100%;
      transition: opacity 0.2s; -webkit-appearance: none;
    }
    .btn-primary:active { opacity: 0.7; }

    .btn-ghost {
      background: none; border: none;
      font-family: 'Zen Kaku Gothic New', sans-serif;
      font-size: 0.72rem; color: var(--ink-faint);
      cursor: pointer; text-align: center;
      text-decoration: underline; text-underline-offset: 3px;
      padding: 0.3rem; -webkit-appearance: none;
    }

    /* ───────────────────────────────── SETUP */
    #setup { justify-content: center; gap: 2.4rem; }

    .setup-header { }
    .setup-header h1 {
      font-size: 1.4rem; font-weight: 300;
      margin-top: 0.6rem; line-height: 1.5;
    }

    /* ───────────────────────────────── MAIN */
    #main { justify-content: space-between; padding-top: 4rem; padding-bottom: 4rem; }

    .main-header {
      display: flex; justify-content: space-between; align-items: center;
    }

    .counter-area {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1.2rem;
      text-align: center;
    }
    .counter-label { font-size: 0.68rem; letter-spacing: 0.12em; color: var(--ink-faint); }
    .counter-time {
      font-family: 'Space Mono', monospace;
      font-size: clamp(2.2rem, 9vw, 3.8rem);
      letter-spacing: 0.04em; line-height: 1.1;
    }
    .counter-unit {
      font-family: 'Space Mono', monospace;
      font-size: 0.55rem; color: var(--ink-faint);
      letter-spacing: 0.12em; margin-top: -0.4rem;
      display: flex; justify-content: center; gap: 2.2rem;
    }
    .counter-unit span { width: 2.4em; text-align: center; }

    .counter-sub {
      display: flex; justify-content: center;
      gap: 2.5rem; margin-top: 0.4rem;
    }
    .counter-sub-item { text-align: center; }
    .counter-sub-item .val {
      font-family: 'Space Mono', monospace; font-size: 1rem;
    }
    .counter-sub-item .key {
      font-size: 0.62rem; color: var(--ink-faint);
      letter-spacing: 0.04em; margin-top: 0.2rem;
    }

    .motivation-strip {
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 1.2rem 0; text-align: center;
    }
    .motivation-strip .why-hint {
      font-size: 0.6rem; letter-spacing: 0.12em;
      color: var(--ink-faint); text-transform: uppercase; margin-bottom: 0.5rem;
    }
    .motivation-strip p {
      font-size: 0.85rem; color: var(--ink-light);
      line-height: 1.8; letter-spacing: 0.02em;
    }

    .main-actions { display: flex; flex-direction: column; gap: 0.8rem; }

    /* ───────────────────────────────── CRAVING */
    #craving { justify-content: space-between; padding-top: 4rem; padding-bottom: 4rem; }

    .craving-header { text-align: center; }
    .craving-header p {
      font-size: 0.78rem; color: var(--ink-faint);
      margin-top: 0.5rem; letter-spacing: 0.02em;
    }

    .breath-area {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 2rem;
    }
    .breath-circle-wrap {
      width: 140px; height: 140px;
      display: flex; align-items: center; justify-content: center;
    }
    .breath-circle {
      width: 80px; height: 80px; border-radius: 50%;
      border: 1px solid var(--ink);
      animation: breathe 16s ease-in-out infinite;
    }
    @keyframes breathe {
      0%   { transform: scale(0.7); opacity: 0.18; }
      25%  { transform: scale(1.4); opacity: 0.85; }
      50%  { transform: scale(1.4); opacity: 0.85; }
      100% { transform: scale(0.7); opacity: 0.18; }
    }
    .breath-instruction {
      font-size: 0.82rem; color: var(--ink-faint);
      letter-spacing: 0.06em; min-height: 1.4em; text-align: center;
      transition: opacity 0.4s;
    }
    .craving-timer {
      font-family: 'Space Mono', monospace;
      font-size: 3.2rem; text-align: center; color: var(--ink);
    }
    .craving-timer.done { color: var(--gold); }

    .craving-motivation {
      border-top: 1px solid var(--border); padding-top: 1.2rem; text-align: center;
    }
    .craving-motivation .why-label {
      font-size: 0.6rem; letter-spacing: 0.12em;
      color: var(--ink-faint); text-transform: uppercase; margin-bottom: 0.5rem;
    }
    .craving-motivation p {
      font-size: 0.88rem; color: var(--ink); line-height: 1.8;
    }

    .craving-actions { display: flex; flex-direction: column; gap: 0.8rem; }

    /* ───────────────────────────────── LAPSE */
    #lapse { justify-content: center; gap: 2.5rem; }

    .lapse-message { text-align: center; }
    .lapse-message .big {
      font-size: 1.5rem; font-weight: 300; line-height: 1.6;
    }
    .lapse-message .sub {
      font-size: 0.82rem; color: var(--ink-faint);
      margin-top: 0.8rem; line-height: 1.8;
    }

    .lapse-record {
      border: 1px solid var(--border); padding: 1.6rem; text-align: center;
    }
    .lapse-record .record-label {
      font-size: 0.6rem; letter-spacing: 0.12em;
      color: var(--ink-faint); text-transform: uppercase;
    }
    .lapse-record .record-val {
      font-family: 'Space Mono', monospace; font-size: 1.3rem; margin-top: 0.6rem;
    }
    .lapse-record .record-note {
      font-size: 0.75rem; color: var(--ink-faint);
      margin-top: 0.6rem; line-height: 1.8;
    }

    .lapse-actions { display: flex; flex-direction: column; gap: 0.8rem; }

    /* ───────────────────────────────── MILESTONE TOAST */
    #toast {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(80px);
      background: var(--ink); color: var(--bg);
      padding: 0.8rem 1.4rem; font-size: 0.78rem; letter-spacing: 0.04em;
      white-space: nowrap; transition: transform 0.4s ease, opacity 0.4s ease;
      opacity: 0; z-index: 500; pointer-events: none;
    }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>

<!-- ── SETUP ───────────────────────────────────── -->
<div id="setup" class="screen active">
  <div class="setup-header">
    <div class="tag">SMOKER DIE</div>
    <h1>禁煙を、始めましょう。</h1>
  </div>

  <div class="form-group">
    <label>なぜ、やめたいのですか？<br>
      <span style="opacity:0.7">あなた自身の言葉で。この言葉が、あなたを支えます。</span>
    </label>
    <textarea id="motivation" placeholder="例：子どもが大きくなるのを、煙草なしで見届けたい。"></textarea>
  </div>

  <div class="form-group">
    <label>禁煙開始日時</label>
    <input type="datetime-local" id="quit-date">
  </div>

  <div class="form-row">
    <div class="form-group">
      <label>1日の本数</label>
      <input type="number" id="cigs-per-day" value="20" min="1" max="100">
    </div>
    <div class="form-group">
      <label>1箱の価格（円）</label>
      <input type="number" id="price-per-pack" value="650" min="100">
    </div>
  </div>

  <button class="btn-primary" onclick="startJourney()">始める</button>
</div>

<!-- ── MAIN ────────────────────────────────────── -->
<div id="main" class="screen">
  <div class="main-header">
    <div class="tag">SMOKER DIE</div>
    <button class="btn-ghost" onclick="showSetup()">設定</button>
  </div>

  <div class="counter-area">
    <div class="counter-label">禁煙 継続中</div>
    <div class="counter-time" id="counter-time">00:00:00:00</div>
    <div class="counter-unit">
      <span>日</span><span>時</span><span>分</span><span>秒</span>
    </div>
    <div class="counter-sub">
      <div class="counter-sub-item">
        <div class="val" id="saved-money">¥0</div>
        <div class="key">節約金額</div>
      </div>
      <div class="counter-sub-item">
        <div class="val" id="cigs-avoided">0本</div>
        <div class="key">吸わなかった本数</div>
      </div>
    </div>
  </div>

  <div class="motivation-strip">
    <div class="why-hint">あなたの理由</div>
    <p id="main-motivation">—</p>
  </div>

  <div class="main-actions">
    <button class="btn-primary" onclick="showCraving()">今、吸いたい</button>
    <button class="btn-ghost" onclick="showLapse()">1本吸ってしまった</button>
  </div>
</div>

<!-- ── CRAVING ─────────────────────────────────── -->
<div id="craving" class="screen">
  <div class="craving-header">
    <div class="tag">渇望タイマー</div>
    <p>渇望は波。平均3〜5分で引きます。</p>
  </div>

  <div class="breath-area">
    <div class="breath-circle-wrap">
      <div class="breath-circle" id="breath-circle"></div>
    </div>
    <div class="breath-instruction" id="breath-instruction">息をゆっくり吸って</div>
    <div class="craving-timer" id="craving-timer">5:00</div>
  </div>

  <div class="craving-motivation">
    <div class="why-label">あなたの理由</div>
    <p id="craving-motivation">—</p>
  </div>

  <div class="craving-actions">
    <button class="btn-primary" onclick="survived()">乗り越えました</button>
    <button class="btn-ghost" onclick="showLapse()">吸ってしまった</button>
  </div>
</div>

<!-- ── LAPSE ───────────────────────────────────── -->
<div id="lapse" class="screen">
  <div class="lapse-message">
    <p class="big">1本は、<br>失敗じゃない。</p>
    <p class="sub">
      禁煙はまっすぐな道じゃない。<br>
      つまずきも、旅の一部です。
    </p>
  </div>

  <div class="lapse-record">
    <div class="record-label">あなたが吸わなかった時間</div>
    <div class="record-val" id="lapse-time">—</div>
    <div class="record-note">この時間は消えません。<br>今から、また始めましょう。</div>
  </div>

  <div class="lapse-actions">
    <button class="btn-primary" onclick="restartFromNow()">今から、やり直す</button>
    <button class="btn-ghost" onclick="showMain()">記録はそのままで戻る</button>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
  const STORE = 'smokerdie_v1';

  const MILESTONES = [
    { hours: 1,    label: '1時間達成。ニコチンが体から抜け始めています。' },
    { hours: 12,   label: '12時間。血中の一酸化炭素が正常値に近づきました。' },
    { hours: 24,   label: '1日達成。心臓発作のリスクが下がり始めています。' },
    { hours: 48,   label: '2日。神経終末が再生中。嗅覚・味覚が戻ってきます。' },
    { hours: 72,   label: '3日。身体的な禁断症状の山を越えました。' },
    { hours: 168,  label: '1週間。肺の繊毛が再生し始めています。' },
    { hours: 720,  label: '1ヶ月。循環機能が大幅に改善しています。' },
    { hours: 2160, label: '3ヶ月。肺機能が10〜15%向上しています。' },
  ];

  let state = {
    quitDate: null,
    motivation: '',
    cigsPerDay: 20,
    pricePerPack: 650,
    lapses: [],
    shownMilestones: []
  };

  let counterInterval = null;
  let cravingInterval = null;
  let breathInterval  = null;
  let cravingSeconds  = 300;

  // ── INIT ──────────────────────────────────────
  function init() {
    const saved = localStorage.getItem(STORE);
    if (saved) {
      try { state = { ...state, ...JSON.parse(saved) }; } catch(e) {}
      showMain();
    } else {
      const now = new Date();
      const local = toLocalISO(now);
      document.getElementById('quit-date').value = local;
      showScreen('setup');
    }
  }

  function save() {
    localStorage.setItem(STORE, JSON.stringify(state));
  }

  function toLocalISO(date) {
    return new Date(date - date.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  }

  // datetime-local の値を確実にローカル時刻として解析（Safari対策）
  function parseDatetimeLocal(val) {
    const [datePart, timePart] = val.split('T');
    const [y, mo, d] = datePart.split('-').map(Number);
    const [h, mi]    = timePart.split(':').map(Number);
    return new Date(y, mo - 1, d, h, mi, 0, 0);
  }

  // ── SCREENS ───────────────────────────────────
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function showSetup() {
    clearAll();
    if (state.quitDate) {
      document.getElementById('quit-date').value = toLocalISO(new Date(state.quitDate));
    }
    document.getElementById('motivation').value     = state.motivation     || '';
    document.getElementById('cigs-per-day').value   = state.cigsPerDay;
    document.getElementById('price-per-pack').value = state.pricePerPack;
    showScreen('setup');
  }

  function showMain() {
    clearAll();
    document.getElementById('main-motivation').textContent =
      state.motivation || '理由を設定から登録してください。';
    startCounter();
    showScreen('main');
  }

  function showCraving() {
    clearAll();
    document.getElementById('craving-motivation').textContent =
      state.motivation || '—';
    // reset breath animation
    const circle = document.getElementById('breath-circle');
    circle.style.animation = 'none';
    void circle.offsetWidth;
    circle.style.animation = '';
    startCravingTimer();
    startBreathing();
    showScreen('craving');
  }

  function showLapse() {
    clearAll();
    const elapsed = Date.now() - new Date(state.quitDate).getTime();
    document.getElementById('lapse-time').textContent =
      elapsed > 0 ? formatDuration(elapsed) : '—';
    showScreen('lapse');
  }

  // ── SETUP ─────────────────────────────────────
  function startJourney() {
    const motivation  = document.getElementById('motivation').value.trim();
    const quitDateVal = document.getElementById('quit-date').value;
    const cigsPerDay  = parseInt(document.getElementById('cigs-per-day').value)   || 20;
    const pricePerPack= parseInt(document.getElementById('price-per-pack').value) || 650;

    if (!motivation)  { document.getElementById('motivation').focus();  return; }
    if (!quitDateVal) { document.getElementById('quit-date').focus();   return; }

    state = {
      ...state,
      quitDate: parseDatetimeLocal(quitDateVal).toISOString(),
      motivation,
      cigsPerDay,
      pricePerPack,
    };
    save();
    showMain();
  }

  // ── COUNTER ───────────────────────────────────
  function startCounter() {
    updateCounter();
    counterInterval = setInterval(updateCounter, 1000);
  }

  function updateCounter() {
    const elapsed = Date.now() - new Date(state.quitDate).getTime();
    if (elapsed < 0) {
      document.getElementById('counter-time').textContent = '00:00:00:00';
      return;
    }

    const d = Math.floor(elapsed / 86400000);
    const h = Math.floor((elapsed % 86400000) / 3600000);
    const m = Math.floor((elapsed % 3600000)  / 60000);
    const s = Math.floor((elapsed % 60000)    / 1000);
    document.getElementById('counter-time').textContent =
      `${pad(d)}:${pad(h)}:${pad(m)}:${pad(s)}`;

    const elapsedHours  = elapsed / 3600000;
    const cigsAvoided   = Math.floor(elapsedHours * state.cigsPerDay / 24);
    const saved         = Math.floor(cigsAvoided * state.pricePerPack / 20);
    document.getElementById('saved-money').textContent  = `¥${saved.toLocaleString()}`;
    document.getElementById('cigs-avoided').textContent = `${cigsAvoided}本`;

    checkMilestones(elapsedHours);
  }

  // ── MILESTONES ────────────────────────────────
  function checkMilestones(elapsedHours) {
    for (const m of MILESTONES) {
      const key = `h${m.hours}`;
      if (elapsedHours >= m.hours && !(state.shownMilestones || []).includes(key)) {
        state.shownMilestones = [...(state.shownMilestones || []), key];
        save();
        showToast(m.label);
        break;
      }
    }
  }

  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 4000);
  }

  // ── CRAVING TIMER ─────────────────────────────
  function startCravingTimer() {
    cravingSeconds = 300;
    renderCraving();
    clearInterval(cravingInterval);
    cravingInterval = setInterval(() => {
      cravingSeconds--;
      renderCraving();
      if (cravingSeconds <= 0) {
        clearInterval(cravingInterval);
        document.getElementById('craving-timer').classList.add('done');
        document.getElementById('breath-instruction').textContent = '渇望が引きました。';
      }
    }, 1000);
  }

  function renderCraving() {
    const m = Math.floor(cravingSeconds / 60);
    const s = cravingSeconds % 60;
    document.getElementById('craving-timer').textContent = `${m}:${pad(s)}`;
  }

  // ── BREATHING ─────────────────────────────────
  const BREATH_PHASES = [
    { text: '息をゆっくり吸って', secs: 4 },
    { text: '止めて',             secs: 4 },
    { text: 'ゆっくり吐いて',     secs: 8 },
  ];
  let bPhase = 0;
  let bTick  = 0;

  function startBreathing() {
    bPhase = 0; bTick = 0;
    updateBreath();
    clearInterval(breathInterval);
    breathInterval = setInterval(() => {
      bTick++;
      if (bTick >= BREATH_PHASES[bPhase].secs) {
        bTick  = 0;
        bPhase = (bPhase + 1) % BREATH_PHASES.length;
        updateBreath();
      }
    }, 1000);
  }

  function updateBreath() {
    document.getElementById('breath-instruction').textContent = BREATH_PHASES[bPhase].text;
  }

  // ── ACTIONS ───────────────────────────────────
  function survived() {
    clearAll();
    showMain();
  }

  function restartFromNow() {
    state.lapses = [...(state.lapses || []),
      { at: new Date().toISOString(), from: state.quitDate }];
    state.quitDate = new Date().toISOString();
    state.shownMilestones = [];
    save();
    showMain();
  }

  // ── UTILS ─────────────────────────────────────
  function pad(n) { return String(n).padStart(2, '0'); }

  function formatDuration(ms) {
    if (ms <= 0) return '0分';
    const d = Math.floor(ms / 86400000);
    const h = Math.floor((ms % 86400000) / 3600000);
    const m = Math.floor((ms % 3600000)  / 60000);
    if (d > 0)  return `${d}日 ${h}時間 ${m}分`;
    if (h > 0)  return `${h}時間 ${m}分`;
    return `${m}分`;
  }

  function clearAll() {
    clearInterval(counterInterval);
    clearInterval(cravingInterval);
    clearInterval(breathInterval);
    document.getElementById('craving-timer').classList.remove('done');
  }

  // ── BOOT ──────────────────────────────────────
  init();
</script>
</body>
</html>
