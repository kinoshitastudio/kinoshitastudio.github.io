<!DOCTYPE html>
<!-- ⭐ 既定は【紙】（木下 2026-08-23）。
     ⚠️ ここで先に書いておくこと。JS で後から入れると、一瞬だけ墨が出てから紙に切り替わる。
     ⚠️ 一度でも自分で選んだ人は、その選択が勝つ（下の disaster_theme が上書きする）。 -->
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,follow">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DISASTER — Font Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0a;--bg2:#141414;--bg3:#1e1e1e;
  --line:rgba(255,255,255,0.09);--line2:rgba(255,255,255,0.16);
  --ink:#f0ede8;--faint:rgba(240,237,232,0.34);--dim:rgba(240,237,232,0.62);
  --accent:#e8e020;--accent-soft:rgba(232,224,32,0.14);
  --shadow:0 24px 70px rgba(0,0,0,.66);
}
/* ⭐ クリーム（紙）。⚠️ 暗い方の色を1つずつ裏返すのではなく、役どころで組み直す。
   🔴 前は --accent が地の色と同じ #1a1a18 だった＝紙にすると【目印が全部消えて】
      いま選んでいる札も、描き終わった字も、無印と見分けが付かなかった。
      紙の側の目印は、地の反対で かつ 墨とも違う色＝焼けた朱にする。 */
[data-theme="light"]{
  --bg:#f2efe9;--bg2:#eae6de;--bg3:#e0dbd1;
  --line:rgba(26,22,18,0.13);--line2:rgba(26,22,18,0.24);
  --ink:#1a1614;--faint:rgba(26,22,18,0.40);--dim:rgba(26,22,18,0.66);
  --accent:#b8431a;--accent-soft:rgba(184,67,26,0.10);
  --shadow:0 24px 70px rgba(60,40,20,.20);
}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Space Mono',monospace;
  overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
a,button{cursor:pointer;font-family:inherit}
::selection{background:var(--accent);color:var(--bg)}

/* header */
header{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--line);
  padding:1rem 1.6rem;display:flex;align-items:center;gap:1rem}
.hd-logo{font-size:.95rem;font-weight:700;letter-spacing:.34em;color:var(--ink);flex-shrink:0}
.hd-logo span{color:var(--accent)}
.hd-sub{font-size:.6rem;letter-spacing:.2em;color:var(--faint);flex-shrink:0}
.hd-spacer{flex:1}
/* ⭐ 地の切り替えは【札に文字を書く】。丸いつまみだけだと何のつまみか分からない。 */
.hd-mode{display:flex;align-items:center;gap:.5rem;font-size:.6rem;letter-spacing:.16em;
  padding:.4rem .7rem;border:1px solid var(--line2);background:none;color:var(--dim);
  transition:border-color .18s,color .18s}
.hd-mode:hover{border-color:var(--ink);color:var(--ink)}
.hd-mode .sw{width:26px;height:14px;border-radius:7px;background:var(--bg3);border:1px solid var(--line2);position:relative;flex-shrink:0}
.hd-mode .sw::after{content:'';position:absolute;top:2px;left:2px;width:8px;height:8px;border-radius:50%;
  background:var(--dim);transition:transform .2s}
[data-theme="light"] .hd-mode .sw::after{transform:translateX(12px);background:var(--accent)}
.btn{font-family:'Space Mono',monospace;font-size:.66rem;letter-spacing:.14em;padding:.5rem 1rem;
  border:1px solid var(--line2);background:none;color:var(--dim);
  transition:border-color .18s,color .18s,background .18s;white-space:nowrap}
.btn:hover{border-color:var(--ink);color:var(--ink)}
.btn-primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn-primary:hover{opacity:.85}
.btn-accent{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:700}
[data-theme="light"] .btn-accent{color:#fff}
.btn-accent:hover{opacity:.88}
.btn-sm{font-size:.6rem;padding:.38rem .75rem}
.btn:disabled{opacity:.35;cursor:default}
.btn:disabled:hover{border-color:var(--line2);color:var(--dim)}

/* tabs */
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--bg);padding:0 1.6rem}
.tab{font-size:.68rem;letter-spacing:.18em;padding:.85rem 1.4rem;background:none;border:none;
  color:var(--faint);border-bottom:2px solid transparent;transition:color .18s,border-color .18s;text-transform:uppercase}
.tab:hover{color:var(--dim)}
.tab.active{color:var(--ink);border-bottom-color:var(--accent)}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* char set tabs */
.charset-tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--bg);padding:0 1.6rem}
.cst-tab{font-size:.62rem;letter-spacing:.12em;padding:.7rem 1rem;background:none;border:none;
  border-bottom:2px solid transparent;color:var(--faint);transition:color .18s,border-color .18s;
  display:flex;align-items:baseline;gap:.45rem}
.cst-tab:hover{color:var(--dim)}
.cst-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
/* ⭐ 何文字描けたかを札そのものに出す。別の場所に小さく書いても読まれない。 */
.cst-n{font-size:.52rem;letter-spacing:.04em;color:var(--faint);font-variant-numeric:tabular-nums}
.cst-tab.active .cst-n{color:var(--accent)}
.cst-n.done{color:var(--accent)}

/* glyph grid */
.grid-wrap{padding:1.5rem 1.6rem 3rem;max-width:1500px}
.grid-bar{display:flex;align-items:center;gap:1rem;margin-bottom:1.1rem;flex-wrap:wrap}
.grid-hint{font-size:.62rem;letter-spacing:.08em;color:var(--faint);line-height:1.7}
.grid-hint b{color:var(--accent);font-weight:400}
.meter{height:2px;background:var(--line);flex:1;min-width:120px;max-width:320px;position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--accent);width:0;transition:width .3s}
/* 🔴 前は grid そのものに地の色を敷いて隙間を線に見せていた＝
      文字が尽きたあとの空きマスまで色が付いて、大きな灰色の板が残っていた。
   ⭐ 隙間は透明にして、線は【マス自身】に持たせる。 */
.glyph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px;background:none}
.glyph-cell{background:var(--bg2);border:1px solid var(--line);aspect-ratio:3/4;display:flex;
  flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;
  transition:border-color .14s,background .14s,transform .14s;overflow:hidden}
.glyph-cell:hover{border-color:var(--line2);background:var(--bg3);transform:translateY(-2px)}
.glyph-cell.has-glyph{background:var(--bg2);border-color:var(--line2)}
.glyph-cell.has-glyph::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent)}
.glyph-cell.has-glyph:hover{border-color:var(--accent)}
.glyph-label{font-size:.6rem;letter-spacing:.08em;color:var(--faint);position:absolute;top:.5rem;left:.55rem;line-height:1}
.glyph-cell.has-glyph .glyph-label{color:var(--accent)}
.glyph-thumb{width:84%;height:78%;pointer-events:none}
.glyph-ghost{font-size:2.2rem;color:rgba(255,255,255,0.10);font-family:sans-serif;line-height:1;user-select:none}
[data-theme="light"] .glyph-ghost{color:rgba(26,22,18,0.10)}

/* 生きているのを見せる帯（描いた字がその場で並ぶ） */
.live{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg2);
  padding:.9rem 1.6rem;display:flex;align-items:center;gap:1rem;overflow:hidden}
.live-lbl{font-size:.56rem;letter-spacing:.18em;color:var(--faint);flex-shrink:0}
.live-in{background:none;border:none;border-bottom:1px solid var(--line2);color:var(--ink);
  font-family:'Space Mono',monospace;font-size:.7rem;letter-spacing:.1em;padding:.2rem .3rem;width:150px;flex-shrink:0}
.live-in:focus{outline:none;border-bottom-color:var(--accent)}
.live-strip{flex:1;min-width:0;height:64px;overflow:hidden;display:flex;align-items:center}
#live-canvas{display:block;height:64px;max-width:100%}

/* overlay / drawer */
.overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.86);display:flex;align-items:center;
  justify-content:center;opacity:0;pointer-events:none;transition:opacity .18s;padding:1rem}
[data-theme="light"] .overlay{background:rgba(40,30,20,.55)}
.overlay.open{opacity:1;pointer-events:all}
/* ⭐ 描く所がこの道具の主役。小さい箱に押し込めない。 */
/* ⚠️ 広ければ良いのではない。盤は 360:440 の縦長なので、横を広げても【左右が余るだけ】。
   高さから決まる幅（96vh ぶん）に道具の列がぎりぎり収まる所で止める。 */
.drawer{background:var(--bg2);border:1px solid var(--line2);box-shadow:var(--shadow);
  width:min(820px,98vw);display:flex;flex-direction:column;max-height:96vh;overflow:hidden}
.drawer-header{padding:.85rem 1.1rem;border-bottom:1px solid var(--line);display:flex;align-items:center;
  gap:1rem;flex-shrink:0}
.drawer-char{font-size:2.4rem;font-weight:700;line-height:1;font-family:sans-serif;min-width:1.6em;text-align:center}
.drawer-nav{display:flex;align-items:center;gap:.5rem}
/* ⭐ 隣の字へ。フォントは1字だけ描いて終わりではないので、ここが無いと道具にならない。 */
.navbtn{width:34px;height:34px;border:1px solid var(--line2);background:none;color:var(--dim);
  font-size:.85rem;line-height:1;display:flex;align-items:center;justify-content:center;transition:.15s}
.navbtn:hover{border-color:var(--ink);color:var(--ink)}
.drawer-sub{font-size:.5rem;letter-spacing:.18em;color:var(--faint);margin-bottom:.25rem}
.drawer-header-right{margin-left:auto;display:flex;gap:.45rem;align-items:center;flex-wrap:wrap}

/* canvas */
/* ⚠️ 台と紙を同じ色にすると【紙の縁が消えて】、どこまでが版面か分からなくなる。
   台は一段沈めて、紙に縁を付ける。 */
.canvas-outer{background:var(--bg3);flex:1;min-height:0;overflow:hidden;line-height:0;display:flex;
  align-items:center;justify-content:center;padding:.7rem}
#draw-canvas{display:block;touch-action:none;cursor:crosshair;flex-shrink:0;
  background:#0d0d0d;border:1px solid var(--line2)}
[data-theme="light"] #draw-canvas{background:#faf8f3}

/* toolbar */
.toolbar{padding:.6rem 1.1rem;border-bottom:1px solid var(--line);display:flex;align-items:center;
  gap:.6rem;flex-wrap:wrap;flex-shrink:0}
.tool-group{display:flex;gap:3px}
.tool-btn{width:36px;height:36px;background:none;border:1px solid var(--line2);display:flex;
  align-items:center;justify-content:center;transition:background .12s,border-color .12s,color .12s;color:var(--dim)}
.tool-btn:hover{border-color:var(--ink);color:var(--ink)}
.tool-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.tool-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.weight-btns{display:flex;gap:3px}
.weight-btn{width:36px;height:36px;background:none;border:1px solid var(--line2);display:flex;
  align-items:center;justify-content:center;transition:border-color .12s}
.weight-btn:hover{border-color:var(--ink)}
.weight-btn.active{border-color:var(--accent)}
.weight-dot{background:var(--ink);border-radius:50%;display:block}
.tool-sep{width:1px;height:26px;background:var(--line2);margin:0 .2rem;flex-shrink:0}
#path-hint{font-size:.52rem;letter-spacing:.05em;color:var(--faint);line-height:1.55}
.grid-btn{font-size:.58rem;letter-spacing:.1em;padding:.42rem .8rem;border:1px solid var(--line2);
  background:none;color:var(--faint);transition:.15s}
.grid-btn:hover{border-color:var(--ink);color:var(--ink)}
.grid-btn.on{border-color:var(--accent);color:var(--accent)}
.tool-lbl{font-size:.5rem;letter-spacing:.14em;color:var(--faint);flex-shrink:0}
.import-bar{padding:.5rem 1.1rem;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.45rem;flex-shrink:0}
.import-bar input[type=text],#svg-paste-input{background:var(--bg);border:1px solid var(--line2);color:var(--ink);
  font-family:'Space Mono',monospace;font-size:.56rem;padding:.35rem .55rem;min-width:0}
.import-bar input[type=text]::placeholder,#svg-paste-input::placeholder{color:var(--faint)}

/* preview */
.preview-wrap{padding:1.5rem 1.6rem;max-width:1500px}
.field-row{display:flex;align-items:center;gap:.8rem;margin-bottom:1rem}
.field-row label{font-size:.58rem;letter-spacing:.14em;color:var(--faint);white-space:nowrap;width:52px}
#preview-text{flex:1;background:var(--bg2);border:1px solid var(--line2);color:var(--ink);
  font-family:'Space Mono',monospace;font-size:.9rem;padding:.55rem .8rem;min-width:0}
#preview-text:focus,#font-name-input:focus{outline:none;border-color:var(--accent)}
.size-row{display:flex;gap:.4rem;margin-bottom:1rem;align-items:center}
.size-row label{font-size:.58rem;letter-spacing:.14em;color:var(--faint);margin-right:.35rem;width:52px}
.size-btn{font-size:.58rem;letter-spacing:.1em;padding:.4rem .85rem;background:none;border:1px solid var(--line2);
  color:var(--faint);transition:.15s}
.size-btn:hover{border-color:var(--ink);color:var(--ink)}
.size-btn.active{border-color:var(--accent);color:var(--accent)}
.preview-canvas-wrap{background:#0d0d0d;border:1px solid var(--line);overflow-x:auto;line-height:0}
[data-theme="light"] .preview-canvas-wrap{background:#faf8f3}
#preview-canvas{display:block;height:auto}

/* export */
.export-wrap{padding:1.5rem 1.6rem;max-width:820px}
.export-card{border:1px solid var(--line);background:var(--bg2);padding:1.4rem;margin-bottom:1rem}
.export-title{font-size:.62rem;letter-spacing:.18em;color:var(--ink);margin-bottom:.7rem}
.export-desc{font-size:.58rem;letter-spacing:.03em;color:var(--faint);line-height:2;margin-bottom:1rem}
#font-name-input{background:var(--bg);border:1px solid var(--line2);color:var(--ink);
  font-family:'Space Mono',monospace;font-size:.8rem;padding:.5rem .7rem;width:220px}
.count-badge{font-size:.58rem;letter-spacing:.08em;color:var(--faint);display:inline-block;margin-top:.5rem}
.count-badge span{color:var(--accent)}
.btn-row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}

/* drag-drop */
.canvas-outer.dragover{outline:2px dashed var(--accent);outline-offset:-6px}

@media(max-width:760px){
  header{padding:.75rem 1rem;gap:.6rem}
  .hd-logo{font-size:.78rem}
  .hd-sub{display:none}
  .tabs,.charset-tabs{padding:0 .6rem}
  .tab{padding:.7rem .9rem;font-size:.6rem}
  .cst-tab{padding:.6rem .65rem;font-size:.56rem}
  .grid-wrap{padding:1rem 1rem 2rem}
  .glyph-grid{grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:7px}
  .glyph-ghost{font-size:1.7rem}
  .live{padding:.7rem 1rem;flex-wrap:wrap}
  .live-in{width:110px}
  .preview-wrap,.export-wrap{padding:1rem}
  .drawer-char{font-size:1.7rem}
  .drawer-header-right{flex-wrap:wrap}
  .overlay{padding:0}
  .drawer{max-height:100vh;width:100vw}
}
</style>
</head>
<body>

<header>
  <div class="hd-logo">DIS<span>A</span>STER</div>
  <div class="hd-sub">FONT MAKER</div>
  <div class="hd-spacer"></div>
  <a href="manual.html" class="btn btn-sm" style="text-decoration:none">MANUAL</a>
  <!-- ⭐ 丸いつまみだけだと「何のつまみか」分からない。地の名前を札に書く。 -->
  <button class="hd-mode" id="btn-mode" title="地の色を切り替える"><span class="sw"></span><span id="mode-lbl">墨</span></button>
  <button class="btn btn-sm btn-accent" id="btn-export-hd">EXPORT .OTF</button>
</header>

<div class="tabs">
  <button class="tab active" data-tab="glyphs">GLYPHS</button>
  <button class="tab" data-tab="preview">PREVIEW</button>
  <button class="tab" data-tab="export">EXPORT</button>
</div>

<!-- GLYPHS -->
<div class="tab-panel active" id="tab-glyphs">
  <div class="charset-tabs">
    <button class="cst-tab active" data-cs="upper">A-Z<span class="cst-n"></span></button>
    <button class="cst-tab" data-cs="lower">a-z<span class="cst-n"></span></button>
    <button class="cst-tab" data-cs="num">0-9<span class="cst-n"></span></button>
    <button class="cst-tab" data-cs="sym">記号<span class="cst-n"></span></button>
    <button class="cst-tab" data-cs="hira">ひらがな<span class="cst-n"></span></button>
    <button class="cst-tab" data-cs="kata">カタカナ<span class="cst-n"></span></button>
  </div>

  <!-- ⭐ 描いた字がその場で言葉になって並ぶ。作っている手ごたえは、これが一番出る。 -->
  <div class="live">
    <div class="live-lbl">いま出来ている字で</div>
    <input class="live-in" id="live-text" type="text" value="DISASTER" maxlength="24"
           autocomplete="off" autocorrect="off" spellcheck="false">
    <div class="live-strip"><canvas id="live-canvas"></canvas></div>
  </div>

  <div class="grid-wrap">
    <div class="grid-bar">
      <div class="grid-hint" id="grid-hint"></div>
      <div class="meter"><i id="meter-bar"></i></div>
    </div>
    <div class="glyph-grid" id="glyph-grid"></div>
  </div>
</div>

<!-- PREVIEW -->
<div class="tab-panel" id="tab-preview">
  <div class="preview-wrap">
    <div class="field-row">
      <label>TEXT</label>
      <input id="preview-text" type="text" value="DISASTER" maxlength="80" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
    <div class="size-row">
      <label>SIZE</label>
      <button class="size-btn active" data-size="72">S</button>
      <button class="size-btn" data-size="130">M</button>
      <button class="size-btn" data-size="200">L</button>
      <button class="size-btn" data-size="300">XL</button>
    </div>
    <div class="preview-canvas-wrap"><canvas id="preview-canvas"></canvas></div>
  </div>
</div>

<!-- EXPORT -->
<div class="tab-panel" id="tab-export">
  <div class="export-wrap">
    <div class="export-card">
      <div class="export-title">— OPENTYPE FONT (.OTF)</div>
      <div class="export-desc">手描きストロークとベジェパスをフォントファイルに変換します。<br>Figma / Illustrator / Word など全アプリで使用可能。</div>
      <div class="field-row" style="margin-bottom:.4rem">
        <label>NAME</label>
        <input id="font-name-input" type="text" value="Disaster">
      </div>
      <div class="count-badge">描画済み: <span id="export-count">0</span> グリフ</div>
      <div class="btn-row"><button class="btn btn-primary" id="btn-export2">GENERATE & DOWNLOAD</button></div>
    </div>
    <div class="export-card">
      <div class="export-title">— データ管理</div>
      <div class="export-desc">グリフデータはlocalStorageに自動保存されます。</div>
      <div class="btn-row">
        <button class="btn btn-sm" id="btn-save">SAVE</button>
        <button class="btn btn-sm" id="btn-load">LOAD</button>
        <button class="btn btn-sm" id="btn-clear-all">CLEAR ALL</button>
      </div>
    </div>
  </div>
</div>

<!-- DRAWING OVERLAY -->
<div class="overlay" id="overlay">
  <div class="drawer" id="drawer">
    <div class="drawer-header">
      <!-- ⭐ 隣の字へ移れること。1字描いて閉じて探して開く、を26回やらせない。
           ⚠️ 移るときは黙って控える（描いたものを捨てない）。 -->
      <div class="drawer-nav">
        <button class="navbtn" id="btn-prev" title="前の字へ（←）">‹</button>
        <div>
          <div class="drawer-sub" id="drawer-pos">A — 1/26</div>
          <div class="drawer-char" id="drawer-char">A</div>
        </div>
        <button class="navbtn" id="btn-next" title="次の字へ（→）">›</button>
      </div>
      <div class="drawer-header-right">
        <button class="btn btn-sm" id="btn-undo">UNDO</button>
        <button class="btn btn-sm" id="btn-clear-draw">CLEAR</button>
        <button class="btn btn-sm btn-accent" id="btn-accept">保存して閉じる</button>
        <button class="btn btn-sm" id="btn-close-drawer">✕</button>
      </div>
    </div>

    <div class="toolbar">
      <div class="tool-group">
        <button class="tool-btn active" data-tool="pen" title="フリーハンド">
          <svg viewBox="0 0 24 24"><path d="M3 21l6-2L20 8a2 2 0 00-3-3L6 16l-3 5z"/></svg>
        </button>
        <button class="tool-btn" data-tool="path" title="ベジェペンツール — クリックでアンカー追加 / ドラッグでカーブ / ①クリックで閉じる">
          <svg viewBox="0 0 24 24" stroke-width="1.6"><path d="M6 19 C6 11 18 13 18 6" stroke-dasharray="2.5 2"/><circle cx="6" cy="19" r="2.5" fill="none"/><circle cx="18" cy="6" r="2.5" fill="none"/><circle cx="12" cy="13" r="2" fill="currentColor" stroke="none"/><line x1="12" y1="13" x2="16" y2="9" stroke-width="1" stroke-dasharray="1.5 1.5"/><circle cx="16" cy="9" r="1.5" fill="currentColor" stroke="none"/></svg>
        </button>
      </div>
      <div class="tool-sep"></div>
      <div class="weight-btns" id="weight-btns">
        <button class="weight-btn" data-w="8"><span class="weight-dot" style="width:3px;height:3px"></span></button>
        <button class="weight-btn active" data-w="18"><span class="weight-dot" style="width:6px;height:6px"></span></button>
        <button class="weight-btn" data-w="32"><span class="weight-dot" style="width:10px;height:10px"></span></button>
        <button class="weight-btn" data-w="52"><span class="weight-dot" style="width:14px;height:14px"></span></button>
      </div>
      <div id="path-hint" style="display:none;font-size:.4rem;letter-spacing:.06em;color:var(--faint);line-height:1.5">クリック: 点追加<br>ドラッグ: カーブ<br>①クリック: 閉じる / Enter: 完成</div>
      <div class="tool-sep"></div>
      <button id="grid-toggle" class="grid-btn on">升目</button>
      <!-- ⭐ 手本を薄く敷く。何も無い所に字を描くのは難しい。⚠️ 既定は入。 -->
      <button id="ref-toggle" class="grid-btn on" title="下敷きの手本を出す・消す">手本</button>
      <div style="margin-left:auto;display:flex;gap:.4rem;align-items:center">
        <span class="tool-lbl">SVG</span>
        <input id="svg-paste-input" type="text" placeholder='d="M..." ペースト' style="width:120px;background:var(--bg);border:1px solid var(--line2);color:var(--ink);font-family:'Space Mono',monospace;font-size:.42rem;padding:.25rem .45rem">
        <button class="btn btn-sm" id="btn-import-paste" style="font-size:.42rem;padding:.25rem .55rem">IMPORT</button>
        <label class="btn btn-sm" style="display:inline-flex;align-items:center;cursor:pointer;font-size:.42rem;padding:.25rem .55rem">
          FILE<input type="file" accept=".svg,image/svg+xml" id="svg-file-input" style="display:none">
        </label>
      </div>
    </div>

    <div class="canvas-outer" id="canvas-outer">
      <canvas id="draw-canvas"></canvas>
    </div>
  </div>
</div>

<script>
// ── character sets ─────────────────────────────────────────────
const CHAR_SETS = {
  upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''),
  lower: 'abcdefghijklmnopqrstuvwxyz'.split(''),
  num:   '0123456789'.split(''),
  sym:   '.,!?;:\'"-()[]{}@#$%&*+=/<>~^_|\\'.split(''),
  hira:  'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをんがぎぐげござじずぜぞだぢづでどばびぶべぼぱぴぷぺぽゃゅょっ'.split(''),
  kata:  'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲンガギグゲゴザジズゼゾダヂヅデドバビブベボパピプペポャュョッ'.split(''),
};

// ── canvas logical coordinate space ───────────────────────────
const CW = 360, CH = 440;
const DPR = window.devicePixelRatio || 1;

// Glyphs-style guide proportions (y-ratio from top)
// base=0.75, desc=0.95 → 20% descender zone (same as Glyphs default -200/1000)
const G = { asc:0.07, cap:0.15, x:0.38, base:0.75, desc:0.95, lsb:0.07, rsb:0.93 };

const CLOSE_DIST = 14;

// ── state ─────────────────────────────────────────────────────
const S = {
  glyphs:{}, cur:null, layers:[],
  tool:'pen', weight:18, previewSize:72, charSet:'upper', showGrid:true, showRef:true,
  penDrawing:false, penPts:[],
  pathSegs:[], pathDragging:false, pathDragIdx:null,
  pathCursor:null, pathHoverClose:false, pathDone:false,
};

// ── DOM ───────────────────────────────────────────────────────
const gridEl        = document.getElementById('glyph-grid');
const overlay       = document.getElementById('overlay');
const drawerChar    = document.getElementById('drawer-char');
const drawCanvas    = document.getElementById('draw-canvas');
const canvasOuter   = document.getElementById('canvas-outer');
const previewCanvas = document.getElementById('preview-canvas');
const previewInput  = document.getElementById('preview-text');
const drawnCount    = document.getElementById('drawn-count');
const exportCount   = document.getElementById('export-count');
const svgPasteInput = document.getElementById('svg-paste-input');
const pathHint      = document.getElementById('path-hint');
const weightBtns    = document.getElementById('weight-btns');
const gridToggle    = document.getElementById('grid-toggle');
let dc, pc; // canvas contexts set after HiDPI init

// ── theme helpers ─────────────────────────────────────────────
function isDark()    { return document.documentElement.dataset.theme !== 'light'; }
function inkColor()  { return isDark() ? '#f0ede8' : '#1a1a18'; }
function hdlColor()  { return isDark() ? '#e8e020' : '#c05020'; }
function canvasBg()  { return isDark() ? '#0d0d0d' : '#fafaf8'; }
function guideBase() { return isDark() ? 'rgba(232,224,32,0.22)' : 'rgba(180,80,20,0.28)'; }

function modeSync(){
  const el = document.getElementById('mode-lbl');
  if (el) el.textContent = isDark() ? '墨' : '紙';
}
/* 🔴🔴 木下＝「グリフとを入れたのが白色で見づらい」。
   ⚠️ マスの絵は canvas に【焼いた画素】なので、地を切り替えても勝手には変わらない。
      ここで刷り直していなかったので、墨の色（白）のまま紙の上に残っていた＝ほぼ見えない。
   ⭐ 地を変えたら【描いてある物を全部】刷り直す。1つでも忘れると、そこだけ消える。 */
function themeRedrawAll(){
  modeSync();
  buildGrid();        /* ← これが抜けていた */
  renderLive();
  renderPreview();
  if (overlay.classList.contains('open')) redraw();
}
document.getElementById('btn-mode').addEventListener('click', () => {
  const t = isDark() ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  localStorage.setItem('disaster_theme', t);
  themeRedrawAll();
});
const savedTheme = localStorage.getItem('disaster_theme');
if (savedTheme) document.documentElement.dataset.theme = savedTheme;

// ── HiDPI canvas init ─────────────────────────────────────────
// All drawing uses logical coords 0..CW, 0..CH.
// Physical canvas pixels = logical * DPR (crisp on Retina).
function initDrawCanvas() {
  drawCanvas.width  = CW * DPR;
  drawCanvas.height = CH * DPR;
  drawCanvas.style.width  = CW + 'px';
  drawCanvas.style.height = CH + 'px';
  // Make canvas fill the drawer width via CSS transform-scale:
  // We let CSS width:100% + height:auto handle it instead.
  drawCanvas.style.width  = '100%';
  drawCanvas.style.height = 'auto';
  dc = drawCanvas.getContext('2d');
  dc.scale(DPR, DPR);
  return dc;
}
function initPreviewCanvas(cssW, cssH) {
  previewCanvas.width  = cssW * DPR;
  previewCanvas.height = cssH * DPR;
  previewCanvas.style.width  = cssW + 'px';
  previewCanvas.style.height = cssH + 'px';
  pc = previewCanvas.getContext('2d');
  pc.resetTransform ? pc.resetTransform() : pc.setTransform(1,0,0,1,0,0);
  pc.scale(DPR, DPR);
  return pc;
}
initDrawCanvas();

// ── fit canvas to available drawer height ──────────────────────
function sizeCanvas() {
  const drawerEl  = document.getElementById('drawer');
  const toolbarEl = document.querySelector('.toolbar');
  const dhEl      = document.querySelector('.drawer-header');
  if (!drawerEl || !toolbarEl || !dhEl) return;

  const vhPx      = window.innerHeight * 0.96;
  const nonCanvas = dhEl.offsetHeight + toolbarEl.offsetHeight + 6; // px
  const availH    = vhPx - nonCanvas;
  const drawerW   = drawerEl.offsetWidth || Math.min(480, window.innerWidth * 0.97);

  const scale = Math.min(drawerW / CW, availH / CH);
  const cssW  = Math.floor(CW * scale);
  const cssH  = Math.floor(CH * scale);

  drawCanvas.style.width  = cssW + 'px';
  drawCanvas.style.height = cssH + 'px';
}
window.addEventListener('resize', sizeCanvas);

// ── getPos: CSS px → logical coords ───────────────────────────
function getPos(e) {
  const r   = drawCanvas.getBoundingClientRect();
  const scx = CW / r.width;
  const scy = CH / r.height;
  const src = e.touches ? e.touches[0] : e;
  return { x: (src.clientX - r.left) * scx, y: (src.clientY - r.top) * scy };
}

// ── grid toggle ───────────────────────────────────────────────
gridToggle.addEventListener('click', () => {
  S.showGrid = !S.showGrid;
  gridToggle.classList.toggle('on', S.showGrid);
  redraw();
});
document.getElementById('ref-toggle').addEventListener('click', function(){
  S.showRef = !S.showRef;
  this.classList.toggle('on', S.showRef);
  redraw();
});

// ── Glyphs-style grid ─────────────────────────────────────────
function drawGrid(ctx) {
  ctx.clearRect(0, 0, CW, CH);
  ctx.fillStyle = canvasBg();
  ctx.fillRect(0, 0, CW, CH);
  if (!S.showGrid) return;

  const dark = isDark();

  // vertical subdivision lines
  ctx.lineWidth = 1;
  ctx.strokeStyle = dark ? 'rgba(255,255,255,0.04)' : 'rgba(26,26,24,0.05)';
  for (let i = 1; i < 8; i++) {
    const x = Math.round(CW * i / 8) + .5;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, CH); ctx.stroke();
  }

  // horizontal guides
  function hLine(ratio, color, dash) {
    const y = Math.round(CH * ratio) + .5;
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.setLineDash(dash || []);
    ctx.moveTo(0, y); ctx.lineTo(CW, y); ctx.stroke();
    ctx.setLineDash([]);
  }
  if (dark) {
    hLine(G.asc,  'rgba(255,255,255,0.05)', [3,7]);
    hLine(G.cap,  'rgba(255,255,255,0.09)', [3,7]);
    hLine(G.x,    'rgba(255,255,255,0.06)', [3,7]);
    hLine(G.base, guideBase());
    hLine(G.desc, 'rgba(255,255,255,0.04)', [3,7]);
  } else {
    hLine(G.asc,  'rgba(26,26,24,0.06)', [3,7]);
    hLine(G.cap,  'rgba(26,26,24,0.11)', [3,7]);
    hLine(G.x,    'rgba(26,26,24,0.07)', [3,7]);
    hLine(G.base, guideBase());
    hLine(G.desc, 'rgba(26,26,24,0.05)', [3,7]);
  }

  // sidebearing verticals
  ctx.strokeStyle = dark ? 'rgba(255,255,255,0.07)' : 'rgba(26,26,24,0.09)';
  ctx.lineWidth = 1;
  ctx.setLineDash([2, 5]);
  [G.lsb, G.rsb].forEach(rx => {
    const x = Math.round(CW * rx) + .5;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, CH); ctx.stroke();
  });
  ctx.setLineDash([]);

  // tiny labels
  ctx.font = `${8 * DPR / DPR}px Space Mono, monospace`; // 8px logical
  ctx.fillStyle = dark ? 'rgba(255,255,255,0.16)' : 'rgba(26,26,24,0.2)';
  ctx.textAlign = 'left';
  [['ASC',G.asc],['CAP',G.cap],['X',G.x],['BASE',G.base],['DESC',G.desc]].forEach(([lbl,r]) => {
    ctx.fillText(lbl, 4, CH*r - 2);
  });
}


// ── glyph grid ────────────────────────────────────────────────
function buildGrid() {
  gridEl.innerHTML = '';
  const chars = CHAR_SETS[S.charSet];
  chars.forEach(ch => {
    const cell = document.createElement('div');
    cell.className = 'glyph-cell' + (S.glyphs[ch]?.length ? ' has-glyph' : '');
    const lbl = document.createElement('div');
    lbl.className = 'glyph-label';
    lbl.textContent = ch;
    cell.appendChild(lbl);
    if (S.glyphs[ch]?.length) {
      const th = document.createElement('canvas');
      th.className = 'glyph-thumb';
      cell.appendChild(th);
      setTimeout(() => renderThumb(ch, th), 0);
    } else {
      const g = document.createElement('div');
      g.className = 'glyph-ghost'; g.textContent = ch;
      cell.appendChild(g);
    }
    cell.addEventListener('click', () => openDrawer(ch));
    gridEl.appendChild(cell);
  });
  const n = Object.values(S.glyphs).filter(v => v?.length).length;
  exportCount.textContent = n;
  progressSync();
}

/* ⭐ どこまで来たかを【札そのもの】と【帯】に出す。
   🔴 前は 7px の灰色で「2 グリフ描画済み」と書いてあるだけで、読まれようが無かった。 */
function drawnIn(set){ return CHAR_SETS[set].filter(c => S.glyphs[c]?.length).length; }
function progressSync(){
  document.querySelectorAll('.cst-tab').forEach(tab => {
    const set = tab.dataset.cs, all = CHAR_SETS[set].length, got = drawnIn(set);
    const s = tab.querySelector('.cst-n');
    if (s){ s.textContent = got + '/' + all; s.classList.toggle('done', got === all && all > 0); }
  });
  const set = S.charSet, all = CHAR_SETS[set].length, got = drawnIn(set);
  const bar = document.getElementById('meter-bar');
  if (bar) bar.style.width = (all ? got/all*100 : 0) + '%';
  const hint = document.getElementById('grid-hint');
  if (hint){
    const total = Object.values(S.glyphs).filter(v => v?.length).length;
    hint.innerHTML = got === 0
      ? 'まだ1字も無い — マスを押すと描ける'
      : 'この組は <b>'+got+'</b> / '+all+' 字　ぜんぶで <b>'+total+'</b> 字';
  }
}

/* ⭐ 出来ている字だけで言葉を組んで、その場に出す。まだ無い字は薄い枠で場所だけ取る。 */
function renderLive(){
  const cv = document.getElementById('live-canvas');
  const inp = document.getElementById('live-text');
  if (!cv || !inp) return;
  const fh = 52, scl = fh/CH, adv = CW*scl*0.76, spc = adv*0.42;
  const chars = (inp.value||'').split('');
  const w = Math.max(chars.reduce((s,c)=>s+(c===' '?spc:adv),0)+8, 10), h = 64;
  cv.width = w*DPR; cv.height = h*DPR;
  cv.style.width = w+'px'; cv.style.height = h+'px';
  const c = cv.getContext('2d');
  c.setTransform(1,0,0,1,0,0); c.scale(DPR,DPR);
  c.clearRect(0,0,w,h);
  let x = 4;
  for (const ch of chars){
    if (ch===' '){ x+=spc; continue; }
    const layers = S.glyphs[ch] || S.glyphs[ch.toUpperCase()];
    if (layers?.length){ c.save(); c.translate(x,(h-fh)/2); drawLayers(c,layers,scl,scl,inkColor()); c.restore(); }
    else {
      c.strokeStyle = isDark() ? 'rgba(255,255,255,0.10)' : 'rgba(26,22,18,0.13)';
      c.lineWidth = 1; c.strokeRect(x+1.5,(h-fh)/2+0.5,adv-4,fh-1);
    }
    x += adv;
  }
}

function renderThumb(ch, canvas) {
  const layers = S.glyphs[ch];
  if (!layers?.length) return;
  const w = canvas.offsetWidth  || 52;
  const h = canvas.offsetHeight || 68;
  canvas.width  = w * DPR;
  canvas.height = h * DPR;
  canvas.style.width  = w + 'px';
  canvas.style.height = h + 'px';
  const ctx = canvas.getContext('2d');
  ctx.resetTransform ? ctx.resetTransform() : ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(DPR, DPR);
  drawLayers(ctx, layers, w/CW, h/CH, inkColor());
}

// ── char-set tabs ─────────────────────────────────────────────
document.querySelectorAll('.cst-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.cst-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    S.charSet = tab.dataset.cs;
    buildGrid();
  });
});
document.getElementById('live-text').addEventListener('input', renderLive);

// ── open / close drawer ───────────────────────────────────────
function openDrawer(ch) {
  S.cur = ch;
  S.layers = deepClone(S.glyphs[ch] || []);
  resetTool();
  drawerChar.textContent = ch;
  posSync();
  overlay.classList.add('open');
  // size after layout settles
  requestAnimationFrame(() => { sizeCanvas(); redraw(); });
}

/* ⭐ いま何字目かを出す（26字あるうちの何番目か分からないと、終わりが見えない） */
function posSync(){
  const list = CHAR_SETS[S.charSet], i = list.indexOf(S.cur);
  const el = document.getElementById('drawer-pos');
  if (el) el.textContent = i < 0 ? S.cur : (S.cur + ' — ' + (i+1) + '/' + list.length);
  const p = document.getElementById('btn-prev'), n = document.getElementById('btn-next');
  if (p) p.disabled = i <= 0;
  if (n) n.disabled = i < 0 || i >= list.length-1;
}

/* ⭐⭐ 描いたものを【控えてから】隣へ移る。
   🔴 移るたびに捨てていたら、続けて描くという使い方そのものが成り立たない。
   ⚠️ 空にしたときは、その字を消したという意味なので、控えからも消す。 */
function stashCurrent(){
  if (!S.cur) return;
  if (S.tool==='path' && S.pathSegs.length>=2) commitPath();
  if (S.layers.length > 0) S.glyphs[S.cur] = deepClone(S.layers);
  else delete S.glyphs[S.cur];
  saveToStorage();
}
function step(d){
  const list = CHAR_SETS[S.charSet], i = list.indexOf(S.cur);
  if (i < 0) return;
  const j = i + d;
  if (j < 0 || j >= list.length) return;
  stashCurrent(); buildGrid(); renderLive();
  openDrawer(list[j]);
}
document.getElementById('btn-prev').addEventListener('click', () => step(-1));
document.getElementById('btn-next').addEventListener('click', () => step( 1));

function closeDrawer() { resetTool(); overlay.classList.remove('open'); }
document.getElementById('btn-close-drawer').addEventListener('click', () => closeAndKeep());
overlay.addEventListener('click', e => { if (e.target === overlay) closeAndKeep(); });

function deepClone(layers) {
  return layers.map(l => {
    const c = {...l};
    if (l.points) c.points = l.points.map(p => ({...p}));
    if (l.segs)   c.segs   = l.segs.map(s => ({...s, cpIn:s.cpIn?{...s.cpIn}:null, cpOut:s.cpOut?{...s.cpOut}:null}));
    return c;
  });
}
function resetTool() {
  S.penDrawing=false; S.penPts=[];
  S.pathSegs=[]; S.pathDragging=false; S.pathDragIdx=null;
  S.pathCursor=null; S.pathHoverClose=false; S.pathDone=false;
}

// ── accept ────────────────────────────────────────────────────
document.getElementById('btn-accept').addEventListener('click', () => {
  stashCurrent(); buildGrid(); renderLive(); renderPreview();
  closeDrawer();
});
/* ⚠️ ✕ や 盤の外を押したときも【捨てない】。描いたものが黙って消えるのがいちばん困る。 */
function closeAndKeep(){ stashCurrent(); buildGrid(); renderLive(); renderPreview(); closeDrawer(); }
document.getElementById('btn-clear-draw').addEventListener('click', () => { S.layers=[]; resetTool(); redraw(); });
document.getElementById('btn-undo').addEventListener('click', () => {
  if (S.pathSegs.length>0) { S.pathSegs.pop(); S.pathDone=false; }
  else S.layers.pop();
  redraw();
});

// ── tools ─────────────────────────────────────────────────────
document.querySelectorAll('.tool-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (S.tool==='path') commitPath();
    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    S.tool = btn.dataset.tool;
    pathHint.style.display   = S.tool==='path' ? 'block' : 'none';
    weightBtns.style.display = S.tool==='pen'  ? 'flex'  : 'none';
    redraw();
  });
});
document.querySelectorAll('.weight-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.weight-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    S.weight = parseInt(btn.dataset.w);
  });
});
document.addEventListener('keydown', e => {
  if (!overlay.classList.contains('open')) return;
  const tag = document.activeElement.tagName;
  if (tag==='INPUT'||tag==='TEXTAREA') return;
  if (e.key==='Enter') { commitPath(); redraw(); }
  if (e.key==='Escape') closeAndKeep();
  if ((e.ctrlKey||e.metaKey)&&e.key==='z') document.getElementById('btn-undo').click();
  /* ⭐ 続けて描くための矢印。ベジェを引いている最中は点の操作を邪魔しないよう素通しする。 */
  if (e.key==='ArrowLeft'  && !S.pathSegs.length) { e.preventDefault(); step(-1); }
  if (e.key==='ArrowRight' && !S.pathSegs.length) { e.preventDefault(); step( 1); }
});

// ── pen tool ──────────────────────────────────────────────────
function penDown(e) { S.penDrawing=true; S.penPts=[getPos(e)]; }
function penMove(e) {
  if (!S.penDrawing) return;
  const p=getPos(e), l=S.penPts[S.penPts.length-1];
  if (Math.hypot(p.x-l.x,p.y-l.y)<2) return;
  S.penPts.push(p); redraw();
}
function penUp() {
  if (!S.penDrawing) return;
  S.penDrawing=false;
  if (S.penPts.length>1) S.layers.push({type:'stroke',points:simplify(S.penPts,2),width:S.weight});
  S.penPts=[]; redraw();
}

// ── path (bezier pen) tool ────────────────────────────────────
function commitPath() {
  if (S.pathSegs.length>=2)
    S.layers.push({type:'path',segs:S.pathSegs.map(s=>({...s,cpIn:s.cpIn?{...s.cpIn}:null,cpOut:s.cpOut?{...s.cpOut}:null})),closed:S.pathDone});
  S.pathSegs=[]; S.pathDragging=false; S.pathDragIdx=null;
  S.pathCursor=null; S.pathHoverClose=false; S.pathDone=false;
}
function nearFirst(pos) {
  if (S.pathSegs.length<2) return false;
  const f=S.pathSegs[0];
  return Math.hypot(pos.x-f.x,pos.y-f.y)<CLOSE_DIST;
}
function pathDown(e) {
  if (S.pathDone) return;
  const pos=getPos(e);
  if (nearFirst(pos)) { S.pathDone=true; commitPath(); redraw(); return; }
  S.pathSegs.push({x:pos.x,y:pos.y,cpIn:null,cpOut:null});
  S.pathDragging=true; S.pathDragIdx=S.pathSegs.length-1;
}
function pathMove(e) {
  const pos=getPos(e);
  S.pathCursor=pos; S.pathHoverClose=nearFirst(pos);
  if (S.pathDragging && S.pathDragIdx!==null) {
    const seg=S.pathSegs[S.pathDragIdx];
    const dx=pos.x-seg.x, dy=pos.y-seg.y;
    seg.cpOut={x:seg.x+dx,y:seg.y+dy}; seg.cpIn={x:seg.x-dx,y:seg.y-dy};
  }
  redraw();
}
function pathUp() { S.pathDragging=false; S.pathDragIdx=null; }

// ── unified canvas events ─────────────────────────────────────
function onDown(e){e.preventDefault();S.tool==='pen'?penDown(e):pathDown(e);}
function onMove(e){e.preventDefault();S.tool==='pen'?penMove(e):pathMove(e);}
function onUp(e)  {e.preventDefault();S.tool==='pen'?penUp()  :pathUp();}

// ── SVG import ────────────────────────────────────────────────
function importSVGText(text) {
  let paths=[];
  try {
    const doc=new DOMParser().parseFromString(text,'image/svg+xml');
    if (!doc.querySelector('parsererror'))
      doc.querySelectorAll('path,rect,circle,ellipse,polygon,polyline').forEach(el => {
        const d=svgElToD(el); if(d) paths.push(d);
      });
  } catch(e){}
  if (!paths.length) {
    const m=text.match(/d="([^"]+)"/i)||text.match(/d='([^']+)'/i);
    if (m) paths.push(m[1]);
    else if (/^[MmLlCcQqZzHhVvSsTtAa]/.test(text.trim())) paths.push(text.trim());
  }
  if (!paths.length){ alert('SVG path が見つかりませんでした'); return; }
  const combined=paths.join(' ');
  let bbox={x:0,y:0,width:CW,height:CH};
  try {
    const ns='http://www.w3.org/2000/svg', sv=document.createElementNS(ns,'svg');
    sv.style.cssText='position:absolute;visibility:hidden;width:0;height:0';
    document.body.appendChild(sv);
    const pe=document.createElementNS(ns,'path'); pe.setAttribute('d',combined); sv.appendChild(pe);
    const bb=pe.getBBox(); document.body.removeChild(sv);
    if (bb.width>0.1&&bb.height>0.1) bbox=bb;
  } catch(e){}
  const PAD=24, sc=Math.min((CW-PAD*2)/bbox.width,(CH-PAD*2)/bbox.height);
  const tx=PAD-bbox.x*sc+(CW-PAD*2-bbox.width*sc)/2;
  const ty=PAD-bbox.y*sc+(CH-PAD*2-bbox.height*sc)/2;
  paths.forEach(d=>S.layers.push({type:'svg',d,tx,ty,sc}));
  redraw();
}
function svgElToD(el) {
  const tag=el.tagName.toLowerCase().replace(/.*:/,'');
  if (tag==='path') return el.getAttribute('d');
  if (tag==='rect') {
    const x=+el.getAttribute('x')||0,y=+el.getAttribute('y')||0;
    const w=+el.getAttribute('width')||0,h=+el.getAttribute('height')||0;
    return `M${x},${y}h${w}v${h}h-${w}z`;
  }
  return null;
}

  const v=svgPasteInput.value.trim();if(!v)return;importSVGText(v);svgPasteInput.value='';
});
document.getElementById('svg-file-input').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=ev=>importSVGText(ev.target.result);r.readAsText(f);e.target.value='';
});

  const f=e.dataTransfer.files[0];
  if(f&&(f.type.includes('svg')||f.name.endsWith('.svg'))){
    const r=new FileReader();r.onload=ev=>importSVGText(ev.target.result);r.readAsText(f);
  } else if(e.dataTransfer.getData('text')) importSVGText(e.dataTransfer.getData('text'));
});

// ── draw utilities ────────────────────────────────────────────
function simplify(pts, minD) {
  if (pts.length<3) return pts;
  const r=[pts[0]];
  for(let i=1;i<pts.length;i++){
    const l=r[r.length-1];
    if(Math.hypot(pts[i].x-l.x,pts[i].y-l.y)>=minD) r.push(pts[i]);
  }
  if(r[r.length-1]!==pts[pts.length-1]) r.push(pts[pts.length-1]);
  return r;
}
function smooth(pts,n){
  for(let k=0;k<(n||2);k++){
    const r=[pts[0]];
    for(let i=0;i<pts.length-1;i++){
      r.push({x:.75*pts[i].x+.25*pts[i+1].x,y:.75*pts[i].y+.25*pts[i+1].y});
      r.push({x:.25*pts[i].x+.75*pts[i+1].x,y:.25*pts[i].y+.75*pts[i+1].y});
    }
    r.push(pts[pts.length-1]); pts=r;
  }
  return pts;
}
function drawLayers(ctx,layers,sx,sy,ink){
  sx=sx||1;sy=sy||1;ink=ink||inkColor();
  layers.forEach(l=>{
    if(l.type==='stroke') drawStrokeLayer(ctx,l,sx,sy,ink);
    else if(l.type==='path') drawPathLayer(ctx,l,sx,sy,ink);
    else if(l.type==='svg') drawSVGLayer(ctx,l,sx,sy,ink);
  });
}
function drawStrokeLayer(ctx,layer,sx,sy,ink){
  const pts=smooth(layer.points,1);
  if(pts.length<2)return;
  ctx.beginPath();ctx.moveTo(pts[0].x*sx,pts[0].y*sy);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x*sx,pts[i].y*sy);
  ctx.strokeStyle=ink;ctx.lineWidth=layer.width*sx;
  ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();
}
function applyBez(ctx,segs,closed,sx,sy){
  if(!segs||segs.length<2)return false;
  ctx.beginPath();ctx.moveTo(segs[0].x*sx,segs[0].y*sy);
  for(let i=1;i<segs.length;i++){
    const p=segs[i-1],c=segs[i];
    ctx.bezierCurveTo(
      (p.cpOut?p.cpOut.x:p.x)*sx,(p.cpOut?p.cpOut.y:p.y)*sy,
      (c.cpIn?c.cpIn.x:c.x)*sx,(c.cpIn?c.cpIn.y:c.y)*sy,
      c.x*sx,c.y*sy);
  }
  if(closed){
    const l=segs[segs.length-1],f=segs[0];
    ctx.bezierCurveTo(
      (l.cpOut?l.cpOut.x:l.x)*sx,(l.cpOut?l.cpOut.y:l.y)*sy,
      (f.cpIn?f.cpIn.x:f.x)*sx,(f.cpIn?f.cpIn.y:f.y)*sy,
      f.x*sx,f.y*sy);
    ctx.closePath();
  }
  return true;
}
function drawPathLayer(ctx,layer,sx,sy,ink){
  if(!applyBez(ctx,layer.segs,layer.closed,sx,sy))return;
  if(layer.closed){ctx.fillStyle=ink;ctx.fill('nonzero');}
  else{ctx.strokeStyle=ink;ctx.lineWidth=1.8*sx;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();}
}
function drawSVGLayer(ctx,layer,sx,sy,ink){
  ctx.save();ctx.scale(sx,sy);
  ctx.translate(layer.tx||0,layer.ty||0);ctx.scale(layer.sc||1,layer.sc||1);
  try{ctx.fillStyle=ink;ctx.fill(new Path2D(layer.d),'nonzero');}catch(e){}
  ctx.restore();
}

// ── faint guide letter (Glyphs-style reference) ───────────────
function drawGuideLetter(ctx, ch) {
  if (!ch) return;
  const capY  = CH * G.cap;
  const baseY = CH * G.base;
  const fh    = baseY - capY;
  ctx.save();
  ctx.font = `bold ${fh}px sans-serif`;
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'alphabetic';
  /* 🔴 5.5% では出ていないのと同じだった（機能はあるのに無いのと同じ）。
     ⭐ なぞる足場になる濃さまで上げ、切りたい人のために札を付ける。
     ⚠️ これ以上濃くすると「手本をなぞっただけの字」になる。 */
  ctx.fillStyle = isDark() ? 'rgba(255,255,255,0.11)' : 'rgba(26,22,18,0.13)';
  ctx.fillText(ch, CW / 2, baseY);
  ctx.restore();
}

// ── main redraw ───────────────────────────────────────────────
function redraw(){
  drawGrid(dc);
  if (S.cur && S.showRef) drawGuideLetter(dc, S.cur);
  drawLayers(dc,S.layers);
  if(S.penDrawing&&S.penPts.length>1){
    const pts=smooth(S.penPts,1);
    dc.beginPath();dc.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<pts.length;i++) dc.lineTo(pts[i].x,pts[i].y);
    dc.strokeStyle=inkColor();dc.lineWidth=S.weight;dc.lineCap='round';dc.lineJoin='round';dc.stroke();
  }
  if(S.tool==='path') renderPathInProgress();
}

function renderPathInProgress(){
  const segs=S.pathSegs, ink=inkColor(), hdl=hdlColor();
  if(segs.length>=2){
    applyBez(dc,segs,false,1,1);
    dc.strokeStyle=ink;dc.lineWidth=1.8;dc.lineCap='round';dc.lineJoin='round';dc.stroke();
  }
  if(S.pathCursor&&segs.length>=1&&!S.pathDone){
    const last=segs[segs.length-1];
    dc.beginPath();dc.setLineDash([3,6]);
    dc.strokeStyle=isDark()?'rgba(240,237,232,0.35)':'rgba(26,26,24,0.3)';
    dc.lineWidth=1;dc.moveTo(last.x,last.y);
    dc.bezierCurveTo(last.cpOut?last.cpOut.x:last.x,last.cpOut?last.cpOut.y:last.y,
      S.pathCursor.x,S.pathCursor.y,S.pathCursor.x,S.pathCursor.y);
    dc.stroke();dc.setLineDash([]);
  }
  segs.forEach((seg,idx)=>{
    dc.lineWidth=1;
    if(seg.cpIn){
      dc.beginPath();dc.strokeStyle=hdl;dc.moveTo(seg.x,seg.y);dc.lineTo(seg.cpIn.x,seg.cpIn.y);dc.stroke();
      dc.beginPath();dc.fillStyle=hdl;dc.arc(seg.cpIn.x,seg.cpIn.y,3.5,0,Math.PI*2);dc.fill();
    }
    if(seg.cpOut){
      dc.beginPath();dc.strokeStyle=hdl;dc.moveTo(seg.x,seg.y);dc.lineTo(seg.cpOut.x,seg.cpOut.y);dc.stroke();
      dc.beginPath();dc.fillStyle=hdl;dc.arc(seg.cpOut.x,seg.cpOut.y,3.5,0,Math.PI*2);dc.fill();
    }
    const hc=idx===0&&S.pathHoverClose&&segs.length>=2;
    dc.beginPath();dc.rect(seg.x-4.5,seg.y-4.5,9,9);
    dc.strokeStyle=hc?hdl:ink;dc.lineWidth=hc?2:1.5;
    dc.fillStyle=hc?hdl+'44':(isDark()?'rgba(13,13,13,.75)':'rgba(250,250,248,.75)');
    dc.fill();dc.stroke();
  });
}

// ── preview ───────────────────────────────────────────────────
function renderPreview(){
  const raw=(previewInput.value||'');
  const fh=S.previewSize;
  const scl=fh/CH;
  const advW=CW*scl*0.76, spcW=advW*0.42;
  const chars=raw.split('');
  const totalW=chars.reduce((s,c)=>s+(c===' '?spcW:advW),0);
  const cssW=Math.max(totalW+48,300), cssH=fh+48;
  initPreviewCanvas(cssW,cssH);
  pc.fillStyle=canvasBg();pc.fillRect(0,0,cssW,cssH);
  // baseline
  pc.strokeStyle=isDark()?'rgba(232,224,32,0.12)':'rgba(180,80,20,0.18)';
  pc.lineWidth=1;pc.beginPath();pc.moveTo(20,24+fh*G.base);pc.lineTo(cssW-20,24+fh*G.base);pc.stroke();
  let x=20;
  for(const ch of chars){
    if(ch===' '){x+=spcW;continue;}
    const upper=ch.toUpperCase();
    const layers=S.glyphs[upper]||S.glyphs[ch];
    if(!layers?.length){
      pc.fillStyle=isDark()?'rgba(255,255,255,0.06)':'rgba(26,26,24,0.06)';
      pc.fillRect(x,24,advW-2,fh);
      pc.fillStyle=isDark()?'rgba(255,255,255,0.2)':'rgba(26,26,24,0.22)';
      pc.font=`${fh*0.32}px sans-serif`;pc.textAlign='center';
      pc.fillText(ch,x+advW/2,24+fh*0.62);
      x+=advW;continue;
    }
    pc.save();pc.translate(x,24);
    drawLayers(pc,layers,scl,scl,inkColor());
    pc.restore();x+=advW;
  }
}

// ── OTF export ────────────────────────────────────────────────
function buildOTF(){
  if(typeof opentype==='undefined'){alert('opentype.js の読み込みに失敗しました');return;}
  const UPM=1000,ASC=800,DESC=-200,ADV=700,PAD=50;
  function cv(x,y){
    return{x:Math.round(x/CW*(ADV-PAD*2)+PAD),y:Math.round((1-y/CH)*(ASC-DESC)+DESC)};
  }
  function expandStroke(pts,w){
    const hw=w/2,L=[],R=[];
    for(let i=0;i<pts.length;i++){
      let nx,ny;
      if(i===0){const dx=pts[1].x-pts[0].x,dy=pts[1].y-pts[0].y,len=Math.hypot(dx,dy)||1;nx=-dy/len;ny=dx/len;}
      else if(i===pts.length-1){const dx=pts[i].x-pts[i-1].x,dy=pts[i].y-pts[i-1].y,len=Math.hypot(dx,dy)||1;nx=-dy/len;ny=dx/len;}
      else{
        const dx1=pts[i].x-pts[i-1].x,dy1=pts[i].y-pts[i-1].y,l1=Math.hypot(dx1,dy1)||1;
        const dx2=pts[i+1].x-pts[i].x,dy2=pts[i+1].y-pts[i].y,l2=Math.hypot(dx2,dy2)||1;
        nx=(-dy1/l1-dy2/l2)/2;ny=(dx1/l1+dx2/l2)/2;
        const nl=Math.hypot(nx,ny)||1;nx/=nl;ny/=nl;
      }
      L.push({x:pts[i].x+nx*hw,y:pts[i].y+ny*hw});
      R.push({x:pts[i].x-nx*hw,y:pts[i].y-ny*hw});
    }
    return [...L,...R.reverse()];
  }
  function layerToOTPath(layer){
    const p=new opentype.Path();
    if(layer.type==='stroke'){
      const pts=simplify(smooth(layer.points,2),3);
      if(pts.length<2)return p;
      const poly=expandStroke(pts,layer.width);
      const p0=cv(poly[0].x,poly[0].y);p.moveTo(p0.x,p0.y);
      for(let i=1;i<poly.length;i++){const q=cv(poly[i].x,poly[i].y);p.lineTo(q.x,q.y);}
      p.close();
    } else if(layer.type==='path'){
      const segs=layer.segs;if(!segs||segs.length<2)return p;
      const p0=cv(segs[0].x,segs[0].y);p.moveTo(p0.x,p0.y);
      for(let i=1;i<segs.length;i++){
        const prev=segs[i-1],curr=segs[i];
        const cp1=cv(prev.cpOut?prev.cpOut.x:prev.x,prev.cpOut?prev.cpOut.y:prev.y);
        const cp2=cv(curr.cpIn?curr.cpIn.x:curr.x,curr.cpIn?curr.cpIn.y:curr.y);
        const pt=cv(curr.x,curr.y);
        p.curveTo(cp1.x,cp1.y,cp2.x,cp2.y,pt.x,pt.y);
      }
      if(layer.closed){
        const l=segs[segs.length-1],f=segs[0];
        const cp1=cv(l.cpOut?l.cpOut.x:l.x,l.cpOut?l.cpOut.y:l.y);
        const cp2=cv(f.cpIn?f.cpIn.x:f.x,f.cpIn?f.cpIn.y:f.y);
        const pt=cv(f.x,f.y);
        p.curveTo(cp1.x,cp1.y,cp2.x,cp2.y,pt.x,pt.y);p.close();
      }
    } else if(layer.type==='svg'){
      const tmpC=document.createElement('canvas');
      tmpC.width=CW;tmpC.height=CH;
      const tx=tmpC.getContext('2d');
      tx.save();tx.translate(layer.tx||0,layer.ty||0);tx.scale(layer.sc||1,layer.sc||1);
      try{
        tx.fillStyle='#fff';tx.fill(new Path2D(layer.d),'nonzero');tx.restore();
        const img=tx.getImageData(0,0,CW,CH);
        const step=4,bPts=[];
        for(let y=0;y<CH;y+=step)for(let x=0;x<CW;x+=step){
          if(img.data[(y*CW+x)*4+3]>64){
            const l2=x>0?img.data[(y*CW+x-step)*4+3]:0;
            const r2=x<CW-step?img.data[(y*CW+x+step)*4+3]:0;
            const u=y>0?img.data[((y-step)*CW+x)*4+3]:0;
            const d=y<CH-step?img.data[((y+step)*CW+x)*4+3]:0;
            if(l2<64||r2<64||u<64||d<64) bPts.push({x,y});
          }
        }
        if(bPts.length>=3){
          const p0=cv(bPts[0].x,bPts[0].y);p.moveTo(p0.x,p0.y);
          for(let i=1;i<bPts.length;i++){const q=cv(bPts[i].x,bPts[i].y);p.lineTo(q.x,q.y);}
          p.close();
        }
      }catch(e){tx.restore();}
    }
    return p;
  }

  const notdef=new opentype.Glyph({name:'.notdef',unicode:0,advanceWidth:ADV,path:new opentype.Path()});
  const space=new opentype.Glyph({name:'space',unicode:32,advanceWidth:Math.round(ADV*.42),path:new opentype.Path()});
  const glyphs=[notdef,space];
  const allChars=[...CHAR_SETS.upper,...CHAR_SETS.lower,...CHAR_SETS.num,...CHAR_SETS.sym,...CHAR_SETS.hira,...CHAR_SETS.kata];
  const seen=new Set();
  for(const ch of allChars){
    const layers=S.glyphs[ch];
    if(!layers?.length||seen.has(ch.codePointAt(0)))continue;
    seen.add(ch.codePointAt(0));
    const combined=new opentype.Path();
    layers.forEach(l=>{const lp=layerToOTPath(l);lp.commands.forEach(cmd=>combined.commands.push(cmd));});
    const code=ch.codePointAt(0);
    glyphs.push(new opentype.Glyph({name:'u'+code.toString(16).toUpperCase(),unicode:code,advanceWidth:ADV,path:combined}));
    /* 🔴 ここで大文字ごとに【空の小文字】を足していた。
       ① 自分で小文字を描いても、空の方と同じ番号(0x61等)が二重に入って消えることがある
       ② 描いていない小文字は【真っ白】で出る＝打っても何も出ない
       ⭐ 小文字は「描いてあればそれ／無ければ大文字の形を借りる」。画面の下見と同じ扱いにする。 */
    if(ch>='A'&&ch<='Z'){
      const lc=ch.toLowerCase(), lcode=lc.charCodeAt(0);
      if(!S.glyphs[lc]?.length && !seen.has(lcode)){
        seen.add(lcode);
        glyphs.push(new opentype.Glyph({name:lc,unicode:lcode,advanceWidth:ADV,path:combined}));
      }
    }
  }
  const familyName=document.getElementById('font-name-input').value.trim()||'Disaster';
  try{
    new opentype.Font({familyName,styleName:'Regular',unitsPerEm:UPM,ascender:ASC,descender:DESC,glyphs})
      .download(familyName.replace(/\s+/g,'-')+'.otf');
  }catch(e){alert('フォント生成エラー: '+e.message);console.error(e);}
}
