<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>お問い合わせ — 盛本翼 / Tsubasa Morimoto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#181410; --paper:#fffaf2;
    --pink:#ff4d8d; --yellow:#ffd23f; --cyan:#28c7e0; --lime:#bff24b; --purple:#7b5cff;
    --jp:"Zen Maru Gothic",sans-serif; --pop:"Mochiy Pop One",sans-serif;
    --en:"Bricolage Grotesque",sans-serif; --mono:"Space Mono",monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{overflow-x:hidden;width:100%;-webkit-text-size-adjust:100%}
  body{font-family:var(--jp);color:var(--ink);background:var(--paper);min-height:100svh;
    -webkit-font-smoothing:antialiased;font-feature-settings:"palt" 1;touch-action:pan-y}
  a{color:inherit;text-decoration:none}

  /* 動く色付きグラデ背景（indexと同系） */
  .bgfx{position:fixed;top:-6vh;left:0;right:0;bottom:-6vh;z-index:0;overflow:hidden;
    background:linear-gradient(130deg,#ffd6e6,#ffe6cf 28%,#d6f0ff 55%,#e3ffd6 80%,#efdcff);
    background-size:230% 230%;animation:bgshift 20s ease-in-out infinite}
  @keyframes bgshift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  .blob{position:absolute;filter:blur(60px);opacity:.4;mix-blend-mode:multiply;border-radius:46% 54% 60% 40%/52% 44% 56% 48%}
  .b1{width:46vw;height:46vw;background:var(--pink);left:-12vw;top:-10vw;animation:fl 16s ease-in-out infinite}
  .b2{width:40vw;height:40vw;background:var(--cyan);right:-12vw;bottom:-12vw;animation:fl 20s ease-in-out infinite reverse}
  @keyframes fl{0%,100%{transform:translate(0,0) rotate(0) scale(1)}50%{transform:translate(8vw,6vw) rotate(50deg) scale(1.2)}}

  .wrap{position:relative;z-index:2;max-width:680px;margin:0 auto;padding:30px 22px 80px}

  /* top bar */
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}
  .logo{font-family:var(--pop);font-size:19px}.logo b{color:var(--pink)}
  .back{font-family:var(--pop);font-size:13px;border:2px solid var(--ink);border-radius:30px;
    padding:8px 16px;background:#fff;box-shadow:3px 3px 0 var(--ink);transition:.15s}
  .back:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}

  header{text-align:center;margin:18px 0 30px}
  .badge{display:inline-block;font-family:var(--pop);font-size:13px;background:var(--ink);color:#fff;
    padding:6px 16px;border-radius:30px;transform:rotate(-2deg);margin-bottom:14px}
  h1{font-family:var(--en);font-weight:800;font-size:clamp(40px,11vw,72px);line-height:.92;text-transform:uppercase}
  header p{font-family:var(--jp);font-weight:700;color:#5b5347;margin-top:14px;line-height:1.9;font-size:15px}

  /* card form */
  form{background:#fff;border:2.5px solid var(--ink);border-radius:24px;box-shadow:8px 8px 0 var(--ink);
    padding:28px 24px 30px}
  .field{margin-bottom:20px}
  label{display:block;font-family:var(--pop);font-size:13px;margin-bottom:8px}
  label .req{color:var(--pink);margin-left:4px}
  input,select,textarea{width:100%;font-family:var(--jp);font-weight:500;font-size:16px;color:var(--ink);
    background:#fff8;border:2px solid var(--ink);border-radius:14px;padding:13px 15px;transition:.15s}
  input:focus,select:focus,textarea:focus{outline:none;box-shadow:0 0 0 3px var(--yellow);background:#fff}
  textarea{min-height:140px;resize:vertical;line-height:1.8}
  .row{display:flex;gap:16px}.row .field{flex:1}
  @media(max-width:540px){.row{flex-direction:column;gap:0}}

  .submit{width:100%;font-family:var(--pop);font-size:18px;color:#fff;background:var(--pink);
    border:2.5px solid var(--ink);border-radius:40px;padding:16px;cursor:pointer;
    box-shadow:5px 5px 0 var(--ink);transition:.16s;margin-top:6px}
  .submit:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink);background:#ff3a80}
  .note{font-family:var(--mono);font-size:11px;color:#8a8275;text-align:center;margin-top:16px;line-height:1.7}

  /* alt links */
  .alt{text-align:center;margin-top:30px}
  .alt span{font-family:var(--pop);font-size:13px;color:#5b5347}
  .alt .links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .alt .links a{font-family:var(--pop);font-size:14px;border:2px solid var(--ink);border-radius:30px;
    padding:11px 22px;background:#fff;box-shadow:3px 3px 0 var(--ink);transition:.15s}
  .alt .links a:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}

  footer{position:relative;z-index:2;text-align:center;font-family:var(--mono);font-size:11px;color:#5b5347;padding:30px 20px}
  footer a{border-bottom:2px solid var(--pink);font-weight:700}
</style>
</head>
<body>

<div class="bgfx"><div class="blob b1"></div><div class="blob b2"></div></div>

<div class="wrap">
  <div class="top">
    <a href="index.html" class="logo">盛本<b>翼</b>.</a>
    <a href="index.html" class="back">← もどる</a>
  </div>

  <header>
    <div class="badge">CONTACT 連絡</div>
    <h1>はなそう</h1>
    <p>登壇・お仕事のご相談・取材など、お気軽にどうぞ。<br>滋賀で、おもしろいことを一緒に。</p>
  </header>

  <form id="contactForm">
    <div class="row">
      <div class="field">
        <label for="name">お名前<span class="req">*</span></label>
        <input id="name" name="name" type="text" required placeholder="盛本 翼">
      </div>
      <div class="field">
        <label for="org">ご所属（任意）</label>
        <input id="org" name="org" type="text" placeholder="会社・団体・学校など">
      </div>
    </div>

    <div class="field">
      <label for="email">メールアドレス<span class="req">*</span></label>
      <input id="email" name="email" type="email" required placeholder="you@example.com">
    </div>

    <div class="field">
      <label for="purpose">ご用件<span class="req">*</span></label>
      <select id="purpose" name="purpose" required>
        <option value="">選んでください</option>
        <option>登壇・イベントのご依頼</option>
        <option>お仕事・ご相談（デザイン/地域プロジェクト等）</option>
        <option>取材・メディア</option>
        <option>Friends of Figma Shiga について</option>
        <option>その他</option>
      </select>
    </div>

    <div class="field">
      <label for="message">メッセージ<span class="req">*</span></label>
      <textarea id="message" name="message" required placeholder="ご用件の詳細をどうぞ。"></textarea>
    </div>

    <button type="submit" class="submit">この内容で送る ✉</button>
    <p class="note">※ 送信ボタンでお使いのメールアプリが開きます（内容が自動入力されます）。<br>うまく開かない場合は下記SNSのDMでもOK。</p>
  </form>

  <div class="alt">
    <span>SNSからでも気軽に</span>
    <div class="links">
      <a href="#" target="_blank" rel="noopener">X</a>
      <a href="#" target="_blank" rel="noopener">note</a>
      <a href="#" target="_blank" rel="noopener">Discord</a>
    </div>
  </div>
</div>

<footer>Site by <a href="https://kinoshita.studio" target="_blank" rel="noopener">Kinoshita Studio</a> — Tsubasa Morimoto</footer>

<script>
  // ※ 本公開時：宛先メールを本人のものに差し替え（or Formspree等に置換してページ内送信化）
  const TO = "your-email@example.com"; // 仮アドレス
  document.getElementById('contactForm').addEventListener('submit', function(e){
    e.preventDefault();
    const v = id => (document.getElementById(id).value || '').trim();
    const name=v('name'), org=v('org'), email=v('email'), purpose=v('purpose'), message=v('message');
    const subject = `【サイトより】${purpose}（${name}様）`;
    const body =
`お名前: ${name}
ご所属: ${org || '-'}
メール: ${email}
ご用件: ${purpose}

${message}`;
    window.location.href = `mailto:${TO}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  });
</script>

</body>
</html>
