<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>TSUBASA MORIMOTO ロゴ v4</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1a1714;--pink:#ff4d8d;--cyan:#28c7e0;--lime:#bff24b;--yellow:#ffd23f}
  *{box-sizing:border-box}
  body{margin:0;background:#eceae3;font-family:"Space Mono",monospace;color:var(--ink);padding:30px 22px 90px}
  h1{text-align:center;font-size:16px;letter-spacing:.08em;margin:0 0 4px}
  .sub{text-align:center;font-size:12px;color:#777;margin:0 0 26px}
  h2{max-width:1040px;margin:36px auto 16px;font-size:13px;letter-spacing:.12em;border-bottom:2px solid var(--ink);padding-bottom:8px}
  .panel{max-width:1040px;margin:0 auto 18px;background:#fff;border:2.5px solid var(--ink);border-radius:18px;
    box-shadow:7px 7px 0 var(--ink);padding:34px;text-align:center}
  .panel.dark{background:var(--ink)}
  .cap{font-size:11px;color:#999;margin-top:14px}

  /* icon lockup */
  .iconrow{display:flex;align-items:center;justify-content:center;gap:26px;flex-wrap:wrap}
  .iconrow svg{height:104px;width:auto;display:block}

  /* wordmark treatment */
  .word{font-family:"Archivo Black";font-size:clamp(46px,12vw,128px);line-height:1;display:inline-flex;align-items:flex-end;
    letter-spacing:.005em}
  .word .L{position:relative;display:inline-block}
  .eyes{position:absolute;left:50%;top:6%;transform:translateX(-50%);width:.92em;height:.42em;pointer-events:none}
  .tgt{position:absolute;width:.3em;height:.3em;border-radius:50%;background:#fff;border:.07em solid var(--ink);
    display:flex;align-items:center;justify-content:center}
  .tgt::after{content:"";width:38%;height:38%;border-radius:50%;background:var(--ink)}
  .c-pink{color:var(--pink)}
  .word.mono .L{color:var(--ink)}
</style></head><body>
<h1>TSUBASA MORIMOTO — ロゴ v4（アイコン＝マスコット＋MT / 文字にあしらい）</h1>
<p class="sub">これは"あしらい付き書体"のproof。OKなら清書SVGにします</p>

<h2>A. アイコン（マスコット ＋ MT を横並び）</h2>
<div class="panel">
  <div class="iconrow">
    <!-- mascot -->
    <svg viewBox="0 0 150 130">
      <rect x="20" y="16" width="98" height="98" rx="24" fill="#1a1714"/>
      <circle cx="55" cy="60" r="17" fill="#fff"/><circle cx="59" cy="62" r="7.5" fill="#1a1714"/>
      <circle cx="92" cy="60" r="12.5" fill="#fff"/><circle cx="95" cy="62" r="5.5" fill="#1a1714"/>
      <path d="M118 64 q22 -9 20 13 q-13 5 -20 -3 z" fill="#1a1714"/>
    </svg>
    <!-- MT 2-color -->
    <svg viewBox="0 0 250 128">
      <g fill="#1a1714"><rect x="8" y="20" width="28" height="86"/><rect x="96" y="20" width="28" height="86"/>
        <path d="M8 20 L66 80 L124 20 L124 46 L66 106 L8 46 Z"/></g>
      <g fill="#ff4d8d"><rect x="150" y="20" width="92" height="26"/><rect x="183" y="20" width="26" height="86"/></g>
      <circle cx="196" cy="40" r="11" fill="#fff"/><circle cx="196" cy="40" r="4" fill="#ff4d8d"/>
    </svg>
  </div>
  <div class="cap">マスコット（角丸・ギョロ目＋小翼） ＋ MTモノグラム（M黒／Tピンク＋的ドット）</div>
</div>

<h2>B. KV ワードマーク "TSUBASA"（Tにギョロ目＋あしらい）</h2>
<div class="panel">
  <div class="word">
    <span class="L">T
      <svg class="eyes" viewBox="0 0 92 42">
        <circle cx="30" cy="21" r="18" fill="#fff" stroke="#1a1714" stroke-width="4"/><circle cx="33" cy="23" r="8" fill="#1a1714"/>
        <circle cx="66" cy="21" r="13" fill="#fff" stroke="#1a1714" stroke-width="4"/><circle cx="69" cy="23" r="6" fill="#1a1714"/>
      </svg>
    </span><span class="L">S</span><span class="L">U</span><span class="L">B<i class="tgt" style="top:24%;left:30%"></i></span><span class="L">A</span><span class="L">S</span><span class="L">A</span>
  </div>
  <div class="cap">先頭Tにギョロ目／Bの上の穴に"的ドット"（madoのO作法）。色・位置は調整可</div>
</div>

<div class="panel dark">
  <div class="word" style="color:#fff">
    <span class="L">T
      <svg class="eyes" viewBox="0 0 92 42">
        <circle cx="30" cy="21" r="18" fill="#fff" stroke="#1a1714" stroke-width="4"/><circle cx="33" cy="23" r="8" fill="#1a1714"/>
        <circle cx="66" cy="21" r="13" fill="#fff" stroke="#1a1714" stroke-width="4"/><circle cx="69" cy="23" r="6" fill="#1a1714"/>
      </svg>
    </span><span class="L">S</span><span class="L">U</span><span class="L c-pink">B</span><span class="L">A</span><span class="L">S</span><span class="L">A</span>
  </div>
  <div class="cap">暗背景＋Bだけ差し色（KVではpop配色で各文字を彩る案も）</div>
</div>
</body></html>
