<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>滲 NIJIMI — 作字 / 木下スタジオ</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:#141414;}
  body{font-family:"Space Mono",ui-monospace,monospace;color:#fff;
    -webkit-tap-highlight-color:transparent;touch-action:none;
    display:flex;align-items:center;justify-content:center;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{display:block;box-shadow:0 0 0 1px rgba(255,255,255,.06), 0 30px 90px rgba(0,0,0,.55);}

  /* 文字入力（上部中央） */
  #txt{
    position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:20;
    background:rgba(20,20,20,.6);backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.16);color:#fff;text-align:center;
    font:inherit;font-size:15px;letter-spacing:.15em;padding:9px 18px;width:min(340px,72vw);border-radius:2px;
  }
  #txt:focus{outline:none;border-color:rgba(255,255,255,.4);}
  #txt::placeholder{color:rgba(255,255,255,.3);}

  #ctl{
    position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:10;
    display:flex;gap:13px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(20,20,20,.55);backdrop-filter:blur(12px);
    padding:10px 16px;border:1px solid rgba(255,255,255,.12);border-radius:2px;max-width:97vw;
  }
  #ctl .grp{display:flex;gap:7px;align-items:center;}
  #ctl .sep{width:1px;height:20px;background:rgba(255,255,255,.14);}
  #ctl label{font-size:8px;letter-spacing:.1em;opacity:.55;white-space:nowrap;}
  #ctl input[type=range]{-webkit-appearance:none;appearance:none;width:60px;height:1px;background:rgba(255,255,255,.28);outline:none;cursor:pointer;}
  #ctl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:9px;border-radius:50%;background:#fff;cursor:pointer;}
  #ctl input[type=range]::-moz-range-thumb{width:9px;height:9px;border:none;border-radius:50%;background:#fff;cursor:pointer;}
  #ctl .val{font-size:8px;opacity:.45;width:22px;text-align:right;}
  input[type=color]{-webkit-appearance:none;appearance:none;width:22px;height:22px;padding:0;border:1px solid rgba(255,255,255,.25);background:none;cursor:pointer;border-radius:2px;}
  input[type=color]::-webkit-color-swatch-wrapper{padding:2px;}
  input[type=color]::-webkit-color-swatch{border:none;border-radius:1px;}
  .seg{display:flex;border:1px solid rgba(255,255,255,.18);}
  .seg button{background:none;border:none;color:#fff;opacity:.4;cursor:pointer;font:inherit;font-size:8px;
    letter-spacing:.06em;padding:5px 8px;border-right:1px solid rgba(255,255,255,.18);white-space:nowrap;}
  .seg button:last-child{border-right:none;}
  .seg button.on{opacity:1;background:rgba(255,255,255,.92);color:#000;}
  .btn{background:none;border:1px solid rgba(255,255,255,.22);color:#fff;opacity:.75;cursor:pointer;
    font:inherit;font-size:8px;letter-spacing:.1em;padding:6px 10px;transition:background .12s,color .12s;}
  .btn:hover{background:#fff;color:#000;opacity:1;}
  .chips{display:flex;gap:5px;}
  .chip{width:20px;height:20px;border:1px solid rgba(255,255,255,.2);cursor:pointer;border-radius:2px;}
  #hud{position:fixed;top:16px;left:16px;z-index:10;font-size:8px;letter-spacing:.14em;opacity:.42;line-height:1.8;pointer-events:none;}
  #err{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:30;font-size:9px;color:#e0564e;letter-spacing:.1em;}
  @media(max-width:820px){ #ctl{gap:8px;padding:8px 9px;bottom:8px;} #ctl .sep{display:none;} }
</style>
</head>
<body>

<div id="wrap"><canvas id="c"></canvas></div>
<div id="hud">滲 NIJIMI — 作字 v0.3</div>
<input id="txt" value="作字" maxlength="8" placeholder="文字を入力" spellcheck="false">
<div id="err"></div>

<div id="ctl">
  <div class="grp"><div class="seg" id="seg-mode">
    <button data-v="0" class="on">スプレー</button><button data-v="1">拡散</button><button data-v="2">輪郭</button></div></div>
  <div class="sep"></div>
  <div class="grp"><label>粒</label><input id="s-grain" type="range" min="0" max="100" value="55"><span class="val" id="v-grain"></span></div>
  <div class="grp"><label>広がり</label><input id="s-spread" type="range" min="2" max="100" value="34"><span class="val" id="v-spread"></span></div>
  <div class="grp"><label>荒さ</label><input id="s-fine" type="range" min="40" max="100" value="70"><span class="val" id="v-fine"></span></div>
  <div class="sep"></div>
  <div class="grp"><label>字</label><input type="color" id="ink1" value="#ff2d55"></div>
  <div class="grp"><label>グラデ</label><div class="seg" id="seg-grad"><button data-v="0" class="on">切</button><button data-v="1">入</button></div>
    <input type="color" id="ink2" value="#ffcc00"></div>
  <div class="grp"><label>地</label><input type="color" id="bg" value="#b8b8b0"></div>
  <div class="sep"></div>
  <div class="grp"><div class="chips" id="chips"></div></div>
  <div class="sep"></div>
  <button class="btn" id="b-reroll">替</button>
  <button class="btn" id="b-export">PNG</button>
</div>

<script type="module">
/* ═══════════════════════════════════════════════════════════
   滲 NIJIMI — 作字（レタリング）ツール
   文字をラスタ化 → 反応拡散/スプレー/輪郭の質感をエッジに纏わせ、
   インク色（グラデ可）＋背景色で着色。参照＝『作字作法』表紙(蛍光赤×銀×スプレー粒)。
   ═══════════════════════════════════════════════════════════ */

const cvs=document.getElementById('c');
const gl=cvs.getContext('webgl2',{antialias:false,preserveDrawingBuffer:false});
const errEl=document.getElementById('err');
if(!gl){ errEl.textContent='WebGL2 に未対応のブラウザです'; }
const extCBF=gl&&gl.getExtension('EXT_color_buffer_float');

const LETTER=1024, SIM=512, EXPORT_RES=2048;
const P={ mode:0, grain:0.55, spread:34, fine:0.70, grad:0, simSteps:10,
  ink1:[1,0.176,0.333], ink2:[1,0.8,0], bg:[0.722,0.722,0.627], text:'作字' };

/* ── GL ヘルパ ── */
function sh(t,src){ const s=gl.createShader(t); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){ console.error(gl.getShaderInfoLog(s),src); throw new Error('shader'); } return s; }
const VERT=`#version 300 es
out vec2 vUv; void main(){ vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2)); vUv=p; gl_Position=vec4(p*2.0-1.0,0.0,1.0); }`;
function prog(f){ const p=gl.createProgram(); gl.attachShader(p,sh(gl.VERTEX_SHADER,VERT)); gl.attachShader(p,sh(gl.FRAGMENT_SHADER,f));
  gl.linkProgram(p); if(!gl.getProgramParameter(p,gl.LINK_STATUS)){ console.error(gl.getProgramInfoLog(p)); throw new Error('link'); } return p; }
function tex8(res){ const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,res,res,0,gl.RGBA,gl.UNSIGNED_BYTE,null); texParams(); return t; }
function texF(res){ const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,res,res,0,gl.RGBA,gl.HALF_FLOAT,null); texParams(); return t; }
function texParams(){ gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE); }
function fbo(t){ const f=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0); return f; }
function draw(){ gl.drawArrays(gl.TRIANGLES,0,3); }
function u1(p,n,v){ gl.uniform1f(gl.getUniformLocation(p,n),v); }
function u2(p,n,a,b){ gl.uniform2f(gl.getUniformLocation(p,n),a,b); }
function u3(p,n,a){ gl.uniform3f(gl.getUniformLocation(p,n),a[0],a[1],a[2]); }
function ui(p,n,v){ gl.uniform1i(gl.getUniformLocation(p,n),v); }
function samp(p,n,unit,t){ gl.activeTexture(gl.TEXTURE0+unit); gl.bindTexture(gl.TEXTURE_2D,t); gl.uniform1i(gl.getUniformLocation(p,n),unit); }

const HASH=`
  float hash(vec2 p){ vec3 p3=fract(vec3(p.xyx)*0.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }`;

/* ── ブラー（スプレーの広がり用・分離ガウス）── */
const F_BLUR=`#version 300 es
precision highp float; in vec2 vUv; out vec4 o;
uniform sampler2D uSrc; uniform vec2 uDir; uniform float uRad;
void main(){ float s=0.0,w=0.0; float sig=max(uRad*0.5,0.5);
  for(int i=-16;i<=16;i++){ float fi=float(i); float wi=exp(-fi*fi/(2.0*sig*sig));
    s+=texture(uSrc, vUv+uDir*(fi*uRad/16.0)).r*wi; w+=wi; }
  o=vec4(vec3(s/w),1.0); }`;

/* ── 反応拡散（拡散モード）── */
const F_SEED=`#version 300 es
precision highp float; in vec2 vUv; out vec4 o; uniform sampler2D uLetter;
void main(){ float m=texture(uLetter,vUv).r; o=vec4(1.0-m*0.5, m, 0.0, 1.0); }`;
const F_SIM=`#version 300 es
precision highp float; in vec2 vUv; out vec4 o;
uniform sampler2D uPrev,uLetter; uniform vec2 uTexel;
const float Du=0.16,Dv=0.08,dt=1.0,F=0.045,K=0.062;
void main(){ vec2 c=texture(uPrev,vUv).xy; vec2 lap=c*(-1.0);
  lap+=texture(uPrev,vUv+vec2(uTexel.x,0)).xy*0.2; lap+=texture(uPrev,vUv-vec2(uTexel.x,0)).xy*0.2;
  lap+=texture(uPrev,vUv+vec2(0,uTexel.y)).xy*0.2; lap+=texture(uPrev,vUv-vec2(0,uTexel.y)).xy*0.2;
  lap+=texture(uPrev,vUv+uTexel).xy*0.05; lap+=texture(uPrev,vUv-uTexel).xy*0.05;
  lap+=texture(uPrev,vUv+vec2(uTexel.x,-uTexel.y)).xy*0.05; lap+=texture(uPrev,vUv+vec2(-uTexel.x,uTexel.y)).xy*0.05;
  float u=c.x,v=c.y,uvv=u*v*v;
  float du=Du*lap.x-uvv+F*(1.0-u); float dv=Dv*lap.y+uvv-(F+K)*v;
  float nu=clamp(u+du*dt,0.0,1.0), nv=clamp(v+dv*dt,0.0,1.0);
  // 文字を薄く再注入して形を保つ
  float m=texture(uLetter,vUv).r; nv=max(nv, m*0.35);
  o=vec4(nu,nv,0.0,1.0); }`;

/* ── 表示＋着色 ── */
const F_DISP=`#version 300 es
precision highp float; in vec2 vUv; out vec4 o;
uniform sampler2D uLetter,uBlur,uSim;
uniform int uMode; uniform vec3 uInk1,uInk2,uBg;
uniform float uGrain,uSpray,uGrad,uFine,uAspect;
${HASH}
void main(){
  vec2 gp=vUv*uFine;
  float ink=0.0;
  if(uMode==0){                     // スプレー
    float sharp=texture(uLetter,vUv).r;
    float m=texture(uBlur,vUv).r;
    float core=step(0.5,sharp);
    float dens=pow(clamp(m,0.0,1.0),1.7)*(0.3+uSpray*1.7);
    float dots=step(hash(gp),dens);
    ink=max(core,dots);
    if(core>0.5 && hash(gp*2.1+3.0)>0.988) ink=0.0;   // 字の中に僅かな抜け
  } else if(uMode==1){              // 拡散
    float v=texture(uSim,vUv).y;
    float n=hash(gp)-0.5;
    ink=step(0.32, v+n*uSpray*0.9);
  } else {                          // 輪郭
    float m=texture(uBlur,vUv).r;
    float ring=smoothstep(0.30,0.5,m)*(1.0-smoothstep(0.5,0.62,m));
    float n=hash(gp)-0.5;
    ink=step(0.45, ring*3.0+n*uSpray*0.6);
  }
  float g=dot(vUv-0.5, vec2(cos(2.2),sin(2.2)))+0.5;
  vec3 inkc = uGrad>0.5? mix(uInk1,uInk2,clamp(g,0.0,1.0)) : uInk1;
  vec3 col=mix(uBg, inkc, ink);
  col*=1.0-(hash(gp*0.7+9.0)-0.5)*0.035;   // 地のかすかな粒
  o=vec4(col,1.0);
}`;

const pBlur=prog(F_BLUR), pSeed=prog(F_SEED), pSim=prog(F_SIM), pDisp=prog(F_DISP);

/* ── リソース ── */
const letterTex=tex8(LETTER);
const blurA=tex8(LETTER), blurB=tex8(LETTER), fBlurA=fbo(blurA), fBlurB=fbo(blurB);
let simA,simB,fSimA,fSimB,read=0;
if(extCBF){ simA=texF(SIM); simB=texF(SIM); fSimA=fbo(simA); fSimB=fbo(simB); }
function curSim(){ return read?simB:simA; } function curSimF(){ return read?fSimB:fSimA; }
function othSim(){ return read?simA:simB; } function othSimF(){ return read?fSimA:fSimB; }

/* ── 文字ラスタ化 ── */
const lc=document.createElement('canvas'); lc.width=lc.height=LETTER; const lx=lc.getContext('2d');
function renderLetter(){
  lx.fillStyle='#000'; lx.fillRect(0,0,LETTER,LETTER);
  lx.fillStyle='#fff'; lx.textAlign='center'; lx.textBaseline='middle';
  const txt=P.text||'作';
  const FONT='900 SIZEpx "Hiragino Sans","Hiragino Kaku Gothic StdN","Yu Gothic",sans-serif';
  let fs=LETTER*0.72;
  lx.font=FONT.replace('SIZE',fs);
  let w=lx.measureText(txt).width;
  if(w>LETTER*0.86){ fs*=LETTER*0.86/w; lx.font=FONT.replace('SIZE',fs); }
  lx.fillText(txt, LETTER/2, LETTER/2+fs*0.04);
  gl.bindTexture(gl.TEXTURE_2D,letterTex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,gl.RGBA,gl.UNSIGNED_BYTE,lc);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  buildBlur(); seedSim();
}
function buildBlur(){
  const rad=P.spread/LETTER;
  gl.useProgram(pBlur); gl.viewport(0,0,LETTER,LETTER);
  gl.bindFramebuffer(gl.FRAMEBUFFER,fBlurA); samp(pBlur,'uSrc',0,letterTex); u2(pBlur,'uDir',1,0); u1(pBlur,'uRad',rad); draw();
  gl.bindFramebuffer(gl.FRAMEBUFFER,fBlurB); samp(pBlur,'uSrc',0,blurA); u2(pBlur,'uDir',0,1); u1(pBlur,'uRad',rad); draw();
}
function seedSim(){ if(!extCBF) return; read=0;
  gl.useProgram(pSeed); gl.viewport(0,0,SIM,SIM); gl.bindFramebuffer(gl.FRAMEBUFFER,curSimF());
  samp(pSeed,'uLetter',0,letterTex); draw(); }
function simStep(){ gl.useProgram(pSim); gl.viewport(0,0,SIM,SIM); gl.bindFramebuffer(gl.FRAMEBUFFER,othSimF());
  samp(pSim,'uPrev',0,curSim()); samp(pSim,'uLetter',1,letterTex); u2(pSim,'uTexel',1/SIM,1/SIM); draw(); read=read?0:1; }

/* ── 表示 ── */
function display(fb,res){
  gl.useProgram(pDisp); gl.viewport(0,0,res,res); gl.bindFramebuffer(gl.FRAMEBUFFER,fb);
  samp(pDisp,'uLetter',0,letterTex); samp(pDisp,'uBlur',1,blurB); samp(pDisp,'uSim',2, extCBF?curSim():letterTex);
  ui(pDisp,'uMode',P.mode); u3(pDisp,'uInk1',P.ink1); u3(pDisp,'uInk2',P.ink2); u3(pDisp,'uBg',P.bg);
  u1(pDisp,'uGrad',P.grad); u1(pDisp,'uSpray',P.grain); u1(pDisp,'uFine',600+P.fine*1600); draw();
}

/* ── ループ ── */
function loop(){ requestAnimationFrame(loop);
  if(P.mode===1 && extCBF){ for(let i=0;i<P.simSteps;i++) simStep(); }
  display(null,cvs.width);
}

/* ── リサイズ ── */
function resize(){ const s=Math.floor(Math.min(innerWidth,innerHeight)*0.9); const dpr=Math.min(devicePixelRatio,2);
  cvs.style.width=s+'px'; cvs.style.height=s+'px'; cvs.width=Math.floor(s*dpr); cvs.height=Math.floor(s*dpr); }
addEventListener('resize',resize);

/* ── 書き出し ── */
function exportPNG(){ const R=EXPORT_RES;
  const et=tex8(R); const ef=fbo(et); display(ef,R);
  const px=new Uint8Array(R*R*4); gl.readPixels(0,0,R,R,gl.RGBA,gl.UNSIGNED_BYTE,px);
  const oc=document.createElement('canvas'); oc.width=R; oc.height=R; const octx=oc.getContext('2d'); const img=octx.createImageData(R,R);
  for(let y=0;y<R;y++){ const s=(R-1-y)*R*4,d=y*R*4; img.data.set(px.subarray(s,s+R*4),d); }
  octx.putImageData(img,0,0);
  oc.toBlob(b=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='sakuji_'+Date.now()+'.png'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000); },'image/png');
  gl.deleteFramebuffer(ef); gl.deleteTexture(et); }

/* ── UI ── */
const hex2rgb=h=>{ h=h.replace('#',''); return [parseInt(h.slice(0,2),16)/255,parseInt(h.slice(2,4),16)/255,parseInt(h.slice(4,6),16)/255]; };
const rgb2hex=c=>'#'+c.map(v=>('0'+Math.round(v*255).toString(16)).slice(-2)).join('');

document.getElementById('txt').addEventListener('input',e=>{ P.text=e.target.value||'作'; renderLetter(); });

function bindRange(id,key,vid,scale){ const el=document.getElementById(id),v=document.getElementById(vid);
  const f=()=>{ P[key]=(+el.value)*scale; if(v)v.textContent=el.value; }; el.addEventListener('input',f); f(); }
bindRange('s-grain','grain','v-grain',0.01);
bindRange('s-fine','fine','v-fine',0.01);
{ const el=document.getElementById('s-spread'),v=document.getElementById('v-spread');
  const f=()=>{ P.spread=+el.value; v.textContent=el.value; buildBlur(); }; el.addEventListener('input',f); f(); }

function seg(id,key,after){ document.querySelectorAll('#'+id+' button').forEach(b=>{ b.onclick=()=>{
  document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); P[key]=+b.dataset.v; if(after)after(); }; }); }
seg('seg-mode','mode',()=>{ if(P.mode===1) seedSim(); });
seg('seg-grad','grad');

function bindColor(id,key){ const el=document.getElementById(id); el.value=rgb2hex(P[key]);
  el.addEventListener('input',()=>{ P[key]=hex2rgb(el.value); }); }
bindColor('ink1','ink1'); bindColor('ink2','ink2'); bindColor('bg','bg');

/* プリセット色 */
const CHIPS=[
  { n:'蛍光赤×銀', ink1:'#ff2d55', ink2:'#ffcc00', bg:'#b8b8b0', grad:0 },
  { n:'墨×生成',  ink1:'#141210', ink2:'#141210', bg:'#efe9db', grad:0 },
  { n:'白×黒',    ink1:'#ffffff', ink2:'#ffffff', bg:'#000000', grad:0 },
  { n:'夕焼グラデ', ink1:'#ff3b30', ink2:'#ffd60a', bg:'#0e0e12', grad:1 },
  { n:'藍×白',    ink1:'#0b2a4a', ink2:'#3b7fbf', bg:'#e8eef2', grad:0 },
];
const chipsEl=document.getElementById('chips');
CHIPS.forEach(c=>{ const d=document.createElement('div'); d.className='chip'; d.title=c.n;
  d.style.background = c.grad? `linear-gradient(135deg,${c.ink1},${c.ink2})` : c.ink1;
  d.style.boxShadow=`inset 0 0 0 3px ${c.bg}`;
  d.onclick=()=>{ P.ink1=hex2rgb(c.ink1); P.ink2=hex2rgb(c.ink2); P.bg=hex2rgb(c.bg); P.grad=c.grad;
    document.getElementById('ink1').value=c.ink1; document.getElementById('ink2').value=c.ink2; document.getElementById('bg').value=c.bg;
    document.querySelectorAll('#seg-grad button').forEach(x=>x.classList.toggle('on', +x.dataset.v===c.grad)); };
  chipsEl.appendChild(d); });

document.getElementById('b-reroll').onclick=()=>{ if(P.mode===1) seedSim(); };
document.getElementById('b-export').onclick=exportPNG;

/* ── 起動 ── */
if(gl){ resize(); renderLetter(); requestAnimationFrame(loop);
  if(!extCBF){ errEl.textContent='拡散モードは float 非対応のため無効（スプレー/輪郭は動作）'; } }
</script>
</body>
</html>
