<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>滲 NIJIMI — 作字 / 木下スタジオ</title>
<meta name="description" content="滲 NIJIMI は、黒い紙に手で描いた線を反応拡散で滲ませ、粒立った作字にするブラウザの道具。塗りと線・滲み・字色と地色・囲みごとのグラデーションを調整して、2048pxのPNGで書き出せる。木下スタジオ（滋賀・木下貴博）制作。">
<link rel="canonical" href="https://kinoshita.studio/nijimi/">
<meta property="og:title" content="滲 NIJIMI — 作字">
<meta property="og:description" content="手で描いた線を反応拡散で滲ませ、粒立った作字にする。塗りと線・滲み・字色と地色を追い込んで2048pxで書き出す。">
<meta property="og:image" content="https://kinoshita.studio/assets/img/img-ui-nijimi.jpg">
<meta property="og:url" content="https://kinoshita.studio/nijimi/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="木下スタジオ">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://kinoshita.studio/assets/img/img-ui-nijimi.jpg">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:#0a0a0a;}
  body{
    font-family:"Space Mono",ui-monospace,monospace;color:#fff;
    -webkit-tap-highlight-color:transparent;
    /* 🔴 ここに touch-action:none があった（2026-08-01 に外した）。
       キャンバスで描く／回すために要る指定だが、body に掛けると
       【パネルのスクロールとスライダーのドラッグまで殺す】＝モバイルで動きが渋くなる。
       ⭐ SAKUJI / MAKU に既にある作法＝「touch-action:none はキャンバスだけ」に揃えた。 */

    display:flex;align-items:center;justify-content:center;
  }
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{display:block;background:#000;
    /* ⚠️ 盤の枠。8% だと黒地に溶けて「どこまでが盤か」が分からない（木下・2026-07-31）。
       ⭐ 描いたものより目立たせないため、太さは 1px のまま濃さだけ上げる。 */
    box-shadow:0 0 0 1px rgba(255,255,255,.26), 0 30px 90px rgba(0,0,0,.6);
    touch-action:none;cursor:crosshair;}

  /* WebGL2 が使えない時だけ出る一行（普段は空＝場所も取らない） */
  #boot-err{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:50;
    font-size:10px;letter-spacing:.12em;color:#b4241e;text-align:center;pointer-events:none;}

  #ctl{
    position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:10;
    display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(10,10,10,.5);backdrop-filter:blur(12px);
    padding:10px 15px;border:1px solid rgba(255,255,255,.12);border-radius:2px;max-width:97vw;
  }
  #ctl .grp{display:flex;gap:7px;align-items:center;}
  #ctl .grp.hide{display:none;}
  /* ⭐ 効かない時は【消さずに灰色】＝何があるかは見えたまま、触っても動かない。
     ⚠️ 押せてしまうと結局「触れるのに効かない」に戻るので pointer-events も殺す。 */
  #ctl .grp.dim{opacity:.3;pointer-events:none;}
  #ctl .sep{width:1px;height:20px;background:rgba(255,255,255,.14);}
  #ctl label{font-size:8px;letter-spacing:.1em;opacity:.55;white-space:nowrap;}
  #ctl input[type=range]{-webkit-appearance:none;appearance:none;width:58px;height:1px;background:rgba(255,255,255,.28);outline:none;cursor:pointer;}
  #ctl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:9px;border-radius:50%;background:#fff;cursor:pointer;}
  #ctl input[type=range]::-moz-range-thumb{width:9px;height:9px;border:none;border-radius:50%;background:#fff;cursor:pointer;}
  #ctl .val{font-size:8px;opacity:.45;width:24px;text-align:right;}
  /* ⭐ 出る大きさと書き出し中の進み具合（2026-08-13）。この道具は【暗い地に白い字】。
     ⚠️ 説明用のクラスに入れない＝いつでも見えないと、大きさも進み具合も分からない。 */
  #tvSize{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:9px;line-height:1.6;
    color:#fff;opacity:.82;border:1px solid rgba(255,255,255,.18);border-radius:6px;
    padding:5px 7px;margin:2px 0;white-space:normal;}
  #tvSize b{font-weight:600;opacity:1;}
  #tvPx{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);color:#fff;
    font:inherit;font-size:10px;width:62px;padding:3px 5px;border-radius:5px;}
  .seg{display:flex;border:1px solid rgba(255,255,255,.18);}
  .seg button{background:none;border:none;color:#fff;opacity:.4;cursor:pointer;
    font:inherit;font-size:8px;letter-spacing:.06em;padding:5px 7px;border-right:1px solid rgba(255,255,255,.18);white-space:nowrap;}
  .seg button:last-child{border-right:none;}
  .seg button.on{opacity:1;background:rgba(255,255,255,.92);color:#000;}
  /* ⭐ 作品の色 ── チップ自体をその色で塗る（KUMI の「刷り」と同じ作法）。
     ⚠️ 名前は title に入れる＝並べたときに色そのものが選ぶ手がかりになる。 */
  .kata{display:flex;flex-wrap:wrap;gap:3px;}
  .kata button{background:none;border:1px solid rgba(255,255,255,.18);color:#fff;opacity:.5;cursor:pointer;
    font:inherit;font-size:8px;letter-spacing:.05em;padding:4px 6px;border-radius:2px;white-space:nowrap;}
  .kata button.on{opacity:1;background:rgba(255,255,255,.92);color:#000;}
  body.ui-light .kata button{border-color:rgba(10,10,10,.2);color:#1c1c1e;}
  body.ui-light .kata button.on{background:#1c1c1e;color:#fff;}
  .iro{display:flex;flex-wrap:wrap;gap:4px;}
  .iro button{width:26px;height:20px;padding:0;font-size:0;cursor:pointer;border-radius:2px;
    border:1px solid rgba(255,255,255,.25);}
  .iro button.on{box-shadow:0 0 0 2px #fff;}
  body.ui-light .iro button{border-color:rgba(10,10,10,.25);}
  body.ui-light .iro button.on{box-shadow:0 0 0 2px #1c1c1e;}
  .btn{background:none;border:1px solid rgba(255,255,255,.22);color:#fff;opacity:.75;cursor:pointer;
    font:inherit;font-size:8px;letter-spacing:.1em;padding:6px 10px;transition:background .12s,color .12s;}
  .btn:hover{background:#fff;color:#000;opacity:1;}
  /* ⚠️ 録画中は押し直すまで止まらない＝気づけるように赤く光らせる */
  .btn.on{background:#e0483a;color:#fff;border-color:#e0483a;opacity:1;}
  input[type=color]{-webkit-appearance:none;appearance:none;width:20px;height:20px;padding:0;border:1px solid rgba(255,255,255,.25);background:none;cursor:pointer;border-radius:2px;}
  input[type=color]::-webkit-color-swatch-wrapper{padding:2px;}
  input[type=color]::-webkit-color-swatch{border:none;border-radius:1px;}

  #hud{position:fixed;top:14px;left:16px;z-index:10;font-size:8px;letter-spacing:.14em;
    opacity:.5;line-height:1.9;mix-blend-mode:difference;pointer-events:none;}
  /* ── モバイル：上=描画 / 下=スクロールするコントロールパネル（縦1列・HORI/KUMI/TSUBUと統一） ── */
  @media(max-width:760px){
    #wrap{ top:0; bottom:auto; height:54dvh; }
    #ctl{
      left:0; right:0; bottom:0; top:auto; transform:none; max-width:none;
      max-height:46dvh; overflow-y:auto; overflow-x:hidden;
      flex-direction:column; flex-wrap:nowrap; align-items:stretch; gap:11px;
      padding:12px 12px calc(12px + env(safe-area-inset-bottom));
      border-radius:0; border-left:none; border-right:none;
      background:rgba(10,10,10,.94); backdrop-filter:none;
    }
    #ctl .grp{ flex-wrap:wrap; justify-content:flex-start; gap:8px; width:100%; }
    #ctl .sep{ display:none; }
    #ctl input[type=range]{ flex:1 1 120px; height:22px; }
    #ctl label{ font-size:9px; }
    #ctl .val{ width:auto; }
    .seg{ flex-wrap:wrap; }
    .seg button{ padding:8px 11px; font-size:9px; }
    .btn{ width:100%; padding:12px; font-size:9.5px; }
  }

  /* ══════════════════════════════════════════════════════════════
     見た目 ── SwiftUI（Apple）の作法に寄せる          2026-07-31
     ⭐ ここは【浮かぶコントロールバー】の系統（NIJIMI / UTSU）。
        SAKUJI・MAKU・TSUBU は右のパネル、HORI・KUMI はラック。この2本は
        画面の下に浮くバーなので、macOS の浮かぶツールバーに寄せる。

     ⭐ ここは【いちばん最後に書いた上書きブロック】。上のCSSは1行も触っていない。
        気に入らなければ、このブロックごと消せば完全に元へ戻る。
     ⭐ HTML の構造・並び・id も触っていない＝機能は同じ。見た目だけ。
     ⚠️（起動画面 #boot は 2026-07-31 に廃止＝開いたらすぐ描ける。この行は経緯として残す）
     ⚠️ #hud の mix-blend-mode:difference はそのまま（背景に応じて反転するのが効いている）。
     ⚠️ モバイルの「掴める領域」は上の @media で確保してある。ここでも同じ大きさを守ること。
     ── ダーク側の階調（Apple のシステムグレー）──
     ══════════════════════════════════════════════════════════════ */
  :root{
    --uline:rgba(255,255,255,.10);
    --ufill:rgba(120,120,128,.28);
    --ufill2:rgba(120,120,128,.20);
    --uglass:rgba(40,40,42,.72);
    --ushadow:0 10px 34px rgba(0,0,0,.5), 0 1px 2px rgba(0,0,0,.35);
  }
  /* 浮かぶコントロールバー */
  #ctl{
    background:var(--uglass); border:.5px solid var(--uline); border-radius:14px;
    box-shadow:var(--ushadow); padding:11px 16px; gap:13px;
    -webkit-backdrop-filter:blur(30px) saturate(180%);
            backdrop-filter:blur(30px) saturate(180%);
  }
  #ctl label{ font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans",sans-serif;
    font-size:11px; letter-spacing:0; opacity:.62 }
  #ctl .val{ font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:11px;
    opacity:.62; width:28px; font-variant-numeric:tabular-nums }
  #ctl .sep{ background:var(--uline) }

  /* スライダー＝太いトラック＋大きな白いつまみ */
  #ctl input[type=range]{ -webkit-appearance:none; appearance:none; background:none; height:24px }
  #ctl input[type=range]::-webkit-slider-runnable-track{
    height:4px; border-radius:2px; background:var(--ufill) }
  #ctl input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:19px; height:19px; margin-top:-7.5px;
    border-radius:50%; background:#fff; border:none;
    box-shadow:0 1px 3px rgba(0,0,0,.5), 0 0 0 .5px rgba(0,0,0,.2) }
  #ctl input[type=range]::-moz-range-track{ height:4px; border-radius:2px; background:var(--ufill) }
  #ctl input[type=range]::-moz-range-thumb{ width:19px; height:19px; border:none; border-radius:50%;
    background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.5) }

  /* セグメンテッド＝選んだところに白いカプセルが浮く */
  .seg, #ctl .seg{ background:var(--ufill2); border:none; border-radius:9px; padding:2px; gap:2px }
  .seg button, #ctl .seg button{
    border:none; border-right:none; border-radius:7px; background:none;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans",sans-serif;
    font-size:11px; letter-spacing:0; font-weight:450; color:#fff; opacity:.6;
    padding:6px 10px; transition:.16s }
  .seg button:hover, #ctl .seg button:hover{ opacity:1; background:rgba(255,255,255,.08) }
  .seg button.on, #ctl .seg button.on{
    opacity:1; background:#fff; color:#000; font-weight:590;
    box-shadow:0 1px 3px rgba(0,0,0,.3) }

  /* ボタン・色 */
  .btn{ background:var(--ufill); border:none; border-radius:9px; color:#fff; opacity:1;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans",sans-serif;
    font-size:11px; letter-spacing:0; font-weight:450; padding:7px 12px; transition:.14s }
  .btn:hover{ background:rgba(120,120,128,.42); color:#fff }
  .btn:active{ transform:scale(.985); opacity:.8 }
  input[type=color]{ -webkit-appearance:none; appearance:none; border:none; border-radius:6px;
    background:var(--ufill); padding:2px; width:24px; height:24px; cursor:pointer }
  input[type=color]::-webkit-color-swatch-wrapper{ padding:0 }
  input[type=color]::-webkit-color-swatch{ border:none; border-radius:4px }

  /* ── グラデの色列（2026-08-04）──
     ⭐ ＋／− で色を足したり減らしたりする。色そのものは普通の色スウォッチのまま。
     ⚠️ 「字」は【グラデが入の間は使われない】＝薄くして触れなくしてある。
        これが「字の色を変えても反映されない」の正体だった。 */
  #ctl .gstops{ display:flex; gap:4px; align-items:center; flex-wrap:wrap }
  #ctl .pair{ display:flex; gap:7px; align-items:center }
  #ctl .pair.dim{ opacity:.3; pointer-events:none }
  #ctl .mini{ -webkit-appearance:none; appearance:none; background:var(--ufill); border:none; border-radius:6px;
    color:#fff; width:24px; height:24px; padding:0; line-height:1; font-size:12px; cursor:pointer; transition:.14s }
  #ctl .mini:hover{ background:rgba(120,120,128,.42) }
  #ctl .mini:disabled{ opacity:.28; cursor:default; background:var(--ufill) }
  body.ui-light #ctl .mini{ color:#1c1c1e }

  #hud{ font-family:ui-monospace,"SF Mono",Menlo,monospace }

  /* ⚠️ モバイル＝掴める領域を確保し直す */
  @media(max-width:760px){
    #ctl{ border-radius:14px 14px 0 0; border:none; border-top:.5px solid var(--uline);
      background:rgba(28,28,30,.94) }
    #ctl input[type=range]{ height:36px }
    #ctl input[type=range]::-webkit-slider-runnable-track{ height:4px }
    #ctl input[type=range]::-webkit-slider-thumb{ width:24px; height:24px; margin-top:-10px }
    #ctl input[type=range]::-moz-range-thumb{ width:24px; height:24px }
    .seg button, #ctl .seg button{ padding:10px 12px; font-size:11px; min-height:38px }
    .btn{ padding:12px; font-size:12px; min-height:40px }
    #ctl .mini{ width:34px; height:34px; font-size:14px }
  }

  /* ══════════════════════════════════════════════════════════════
     配置 ── 下の浮かぶバーをやめ、右の縦パネルにする      2026-07-31
     木下＝「下に中途半端にツールパネルがあるので他のと同じで右側に。
             ボードは全体を使用できるようにしたい」
     ⭐ SAKUJI / MAKU / TSUBU と同じ【右のパネル】系統に移した。
        （それまで NIJIMI は UTSU と同じ「浮かぶバー」系統だった）
     ⭐ ここは【いちばん最後に書いた上書きブロック】。上のCSSは1行も触っていない。
        気に入らなければ、このブロックごと消せば浮かぶバーに戻る。
     ⚠️ 盤の大きさは CSS でなく JS の resize() が #wrap の実寸から決めている。
        パネル幅を変えたら見た目は自動で追従する（--panel を変えるだけ）。
     ⚠️ モバイル（≤760px）は上=盤 / 下=パネルのまま。ここは触らない。
     ══════════════════════════════════════════════════════════════ */
  :root{ --panel:264px; }

  @media(min-width:761px){
    /* 盤＝パネルを除いた残り全部 */
    #wrap{ right:var(--panel); }

    /* パネル＝右いっぱいの縦一列 */
    #ctl{
      left:auto; right:0; top:0; bottom:0; transform:none;
      width:var(--panel); max-width:none; max-height:none;
      flex-direction:column; flex-wrap:nowrap;
      align-items:stretch; justify-content:flex-start;
      gap:13px; overflow-y:auto; overflow-x:hidden;
      border-radius:0; border:none; border-left:.5px solid var(--uline);
      box-shadow:none;
      padding:18px 14px 24px;
      background:rgba(28,28,30,.94);
      -webkit-backdrop-filter:none; backdrop-filter:none;
    }
    /* 1行に収まらないので、行ごとに折り返して左揃え */
    #ctl .grp{ flex-wrap:wrap; justify-content:flex-start; gap:8px; width:100%; }
    #ctl .sep{ width:100%; height:1px; background:var(--uline); margin:1px 0; }
    #ctl label{ flex:none; }
    #ctl input[type=range]{ flex:1 1 96px; width:auto; min-width:80px; }
    #ctl .val{ width:30px; flex:none; }
    #ctl .seg{ flex-wrap:wrap; }
    #ctl .btn{ width:100%; }
    /* 見出し（HUD）はパネルに被らせない */
    #hud{ left:16px; }
  }
  /* ── 道具の明るさ（ライト／ダーク）── 2026-07-31
     ⭐ SAKUJI と同じ考え方＝【道具側の明るさ】。作品（盤）の地色は「地」のつまみで別に決める。
     ⚠️ NIJIMI は暗いのが既定。だから足すのは明るい方（body.ui-light）＝HORI/KUMI/TSUBU と向きが逆。
     ⚠️ #ctl まわりは白（#fff）を直に書いている所が多いので、明るい時は色を明示して潰す。 */
  body.ui-light{
    --uline:rgba(60,60,67,.16);
    --ufill:rgba(120,120,128,.16);
    --ufill2:rgba(120,120,128,.12);
    --uglass:rgba(242,242,247,.92);
    --ushadow:0 10px 30px rgba(0,0,0,.13), 0 1px 2px rgba(0,0,0,.07);
  }
  /* ⚠️ 枠は盤の【外】に出るので、対比する相手は盤の地色でなくページの地。
     明るい道具モードでは白線が見えないので、暗い線に差し替える。 */
  body.ui-light canvas{ box-shadow:0 0 0 1px rgba(10,10,10,.28), 0 20px 60px rgba(0,0,0,.16); }
  body.ui-light #ctl{ background:rgba(242,242,247,.94); }
  body.ui-light #ctl label,
  body.ui-light #ctl .val{ color:#1c1c1e }
  body.ui-light #ctl .seg button{ color:#1c1c1e }
  body.ui-light #ctl .seg button.on{ background:#fff; color:#000 }
  body.ui-light #ctl input[type=range]::-webkit-slider-thumb{ background:#1c1c1e }
  body.ui-light #ctl input[type=range]::-moz-range-thumb{ background:#1c1c1e }
  body.ui-light .btn{ color:#1c1c1e }
  body.ui-light #boards{ background:rgba(242,242,247,.98); }
  body.ui-light .bd-head, body.ui-light .bd-item{ color:#1c1c1e }
  body.ui-light .bd-x{ color:#1c1c1e }
  body.ui-light .bd-item.on{ background:rgba(10,10,10,.10) }
  body.ui-light .bd-item:hover{ background:rgba(10,10,10,.06) }
  #themeBtn{
    position:fixed; left:16px; top:52px; z-index:60;
    width:18px; height:18px; padding:0; border-radius:50%;
    border:1px solid currentColor; background:none; color:currentColor;
    font-family:ui-monospace,Menlo,monospace; font-size:9.5px; line-height:1;
    cursor:pointer; opacity:.45; mix-blend-mode:difference;
  }
  #themeBtn:hover{ opacity:1 }
  @media(max-width:760px){ #themeBtn{ left:12px; top:58px; width:26px; height:26px; font-size:12px } }


  /* ── 盤の置き場（ボード） ───────────────────────────
     ⭐ パネルの手前に重ねる小さな棚。盤を選ぶ・増やす・複製する・捨てる。 */
  #boards{
    position:fixed; z-index:30; right:calc(var(--panel) + 12px); top:12px;
    width:270px; max-height:calc(100dvh - 24px); display:flex; flex-direction:column;
    background:rgba(28,28,30,.97); border:.5px solid var(--uline); border-radius:14px;
    box-shadow:var(--ushadow); overflow:hidden;
    -webkit-backdrop-filter:blur(30px) saturate(180%); backdrop-filter:blur(30px) saturate(180%);
  }
  #boards[hidden]{ display:none; }
  .bd-head{ display:flex; align-items:center; justify-content:space-between;
    padding:12px 14px 10px; border-bottom:.5px solid var(--uline);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans",sans-serif;
    font-size:12.5px; font-weight:590; }
  .bd-x{ background:none; border:none; color:#fff; opacity:.5; cursor:pointer;
    font-size:17px; line-height:1; padding:2px 4px; }
  .bd-x:hover{ opacity:1 }
  .bd-list{ overflow-y:auto; padding:6px; display:flex; flex-direction:column; gap:4px; min-height:60px; }
  .bd-item{ display:flex; align-items:center; gap:10px; padding:7px 8px; border-radius:9px;
    cursor:pointer; border:none; background:none; width:100%; text-align:left; color:#fff;

<body>

<div id="wrap"><canvas id="c"></canvas></div>
<div id="hud">滲 NIJIMI — 作字<br><span id="stat">—</span></div>
<button id="themeBtn" title="道具の明るさ">◐</button>

<!-- ⚠️ 起動画面（#boot / はじめる）は 2026-07-31 に削除。開いたらすぐ描ける。
     ⭐ WebGL2 が使えない時だけ、この行に理由が出る（普段は空＝見えない）。 -->
<div id="boot-err"></div>

<div id="ctl">
  <div class="grp">
    <!-- ⭐ ボードは「モード」ではなく【盤の置き場】を開くボタン。拡散/干渉の左に並べる -->

    <div class="seg" id="seg-mode"><button data-v="blank">白紙</button><button data-v="diff" class="on">拡散</button><button data-v="wave">干渉</button></div>
  </div>
  <div class="sep"></div>
  <div class="grp mode-diff rd" id="g-preset"><div class="seg" id="seg-preset">
    <button data-p="0" class="on">珊瑚</button><button data-p="1">迷路</button><button data-p="2">指紋</button><button data-p="3">斑</button><button data-p="4">孔</button>
  </div></div>
  <!-- ⭐ FACET は英語のままだと何のことか読めない（木下＝「FACETとの違いもわかりにくいな」）。
       中身は【面ごとに模様の種類を散らす】＝すぐ下の「面数」と対になる。data-seg は互換のため facet のまま。 -->
  <div class="grp mode-diff rd"><label>面で割る</label><div class="seg" id="seg-facet"><button data-v="0" class="on">切</button><button data-v="1">入</button></div></div>
  <!-- ⭐ 手を止めても反応拡散を回し続けるか。入＝ぬるっと育ち続ける／切＝描いた形で止まる -->
  <div class="grp mode-diff"><label>育つ</label><div class="seg" id="seg-grow"><button data-v="0" class="on">切</button><button data-v="1">入</button></div></div>
  <!-- ⭐ 1フレームに何ステップ進めるか。v0.2 は 12 だった（1だと遅すぎて動いて見えない） -->
  <div class="grp mode-diff rd"><label>速さ</label><input id="s-steps" type="range" min="1" max="24" value="12"><span class="val" id="v-steps"></span></div>
  <!-- ⭐ 何秒で元の字に巻き戻すか。育つ＝再生、周期＝一巡の長さ -->
  <div class="grp mode-diff rd"><label>周期</label><input id="s-cycle" type="range" min="2" max="30" value="8"><span class="val" id="v-cycle"></span></div>
  <div class="grp mode-diff"><div class="seg" id="seg-draw"><button data-v="0" class="on">塗り</button><button data-v="1">線</button></div></div>
  <div class="grp mode-diff"><label>筆</label><input id="s-brush" type="range" min="6" max="180" value="45"><span class="val" id="v-brush"></span></div>
  <div class="grp mode-diff"><label>滲み</label><input id="s-bleed" type="range" min="0" max="16" value="8"><span class="val" id="v-bleed"></span></div>
  <div class="grp rd-cells"><label id="l-cells">面数</label><input id="s-cells" type="range" min="2" max="12" value="7"><span class="val" id="v-cells"></span></div>
  <div class="grp mode-wave hide"><label>歪み</label><input id="s-warp" type="range" min="0" max="100" value="18"><span class="val" id="v-warp"></span></div>
  <!-- ⭐ 白紙／拡散で描いた字を型にして、その中だけ干渉の縞を出す -->
  <div class="grp mode-wave hide"><label>字で抜く</label><div class="seg" id="seg-mask"><button data-v="0" class="on">切</button><button data-v="1">入</button></div></div>
  <div class="sep"></div>
  <div class="grp"><label>しきい</label><input id="s-thr" type="range" min="5" max="90" value="24"><span class="val" id="v-thr"></span></div>
  <div class="grp"><label>粒</label><input id="s-noise" type="range" min="0" max="120" value="34"><span class="val" id="v-noise"></span></div>

  <div class="grp" id="grp-gcy"><label>中心たて</label><input id="s-gcy" type="range" min="0" max="100" value="50"><span class="val" id="v-gcy"></span></div>
  <div class="grp" id="grp-gstops"><label>色</label><span class="gstops" id="gstops"></span><button class="mini" id="g-del" title="色を減らす">−</button><button class="mini" id="g-add" title="色を足す">＋</button></div>

       ⚠️ 上の「粒」「細かさ」は【しきい値のゆらぎ】で別物。こちらは【拾う場所をマス目に丸める】。 -->

  <div class="grp" id="grp-celljit"><label>ばらつき</label><input id="s-celljit" type="range" min="0" max="100" value="0"><span class="val" id="v-celljit"></span></div>
  <div class="grp" id="grp-cellasp"><label>マスの形</label><input id="s-cellasp" type="range" min="-100" max="100" value="0"><span class="val" id="v-cellasp"></span></div>
  <!-- ⭐⭐ アニメーション（2026-08-12 木下＝「グラデーションの縦を流れるようなアニメーション。
       これはさっきの Sakuji の流れ・FPS のアニメーションと同じだね。別セクションでボタンをおすと流れていく」）
       ⚠️ 動くのは【帯を引く位置】だけ＝字の形も滲みも1つも変わらない。書き出しにも入らない。 -->

  <button class="btn" id="b-flow">流す</button>

  <!-- ⭐⭐ 動画で出す（2026-08-13・SAKUJI/TSUBU/TSUBUTE/SUDARE と同じ作法へ置き換え）
       🔴 古い REC（captureStream + MediaRecorder）を捨てた。あれは【実時間で画面のドットを録る】ので
          ・重いとコマ落ち／スローモーション ・webm しか出ない ・継ぎ目のないループが作れない
          ・出る大きさを選べない（「録りたい大きさに窓を広げてから押す」と書いてあった）
       ⭐ 帯の位相は 0→1 でちょうど一周（流している間は帯を環に焼いてある）＝
          位相を「i ÷ 総コマ数」で刻めば、コマ落ちゼロで【継ぎ目のないループ】が出る。
       ⭐ 絵は exportPNG と同じ道＝オフスクリーンに任意の大きさで焼く（画面のドットではない）。 -->
  <div class="seg" id="tvFmt"><button data-v="mp4" class="on">mp4</button><button data-v="png">PNG連番</button></div>

    ><button data-v="2048">2048</button><button data-v="px">px</button></div>
  <div class="grp" id="tvPxRow"><label>辺</label>
    <input id="tvPx" type="number" min="64" max="4096" step="2" value="1080"><span class="val">px</span></div>

  <button class="btn" id="tvGo">動画</button>

  <div class="sep"></div>
  <button class="btn mode-seed" id="b-seed">まく</button>
  <button class="btn" id="b-clear">リセット</button>
  <button class="btn" id="b-reroll">替</button>
  <button class="btn" id="b-export">PNG</button>

       理由＝実時間で画面のドットを録る作りなので、コマ落ち・webm 固定・ループ不可・大きさが選べない。 -->
  <button class="btn" id="b-json">JSON書出</button>
  <button class="btn" id="b-jsonin">JSON読込</button>

<!-- ⭐ 盤の置き場。閉じても中身が残るよう、盤ごと（描いた場＋設定）ブラウザに保存する -->

  <div class="bd-head">
    <span>ボード</span>
    <button class="bd-x" id="bd-close" aria-label="閉じる">×</button>
  </div>
  <div class="bd-list" id="bd-list"></div>
  <div class="bd-foot">
    <button class="btn" id="bd-new">＋新しい盤</button>
    <button class="btn" id="bd-dup">複製</button>
    <button class="btn" id="bd-del">削除</button>
  </div>
  <div class="bd-note" id="bd-note">自動で保存されます</div>
</div>

<script type="module">
/* ═══════════════════════════════════════════════════════════
   滲 NIJIMI — GPU 生成テクスチャ（拡散／干渉）
   ・拡散 = Gray-Scott 反応拡散（Du0.16 Dv0.08, 9点ラプラシアン, FACETでボロノイ面ごとに質感）
   ・干渉 = 複数波源の円形波＋花弁(角度項)の重ね合わせ → 花/星/レンズ縞
   仕上げ = ノイズ摂動しきい値（縁が散る）＋塵（ピクセル反転）＋色味の2値マッピング。
   ═══════════════════════════════════════════════════════════ */

const cvs = document.getElementById('c');
const gl = cvs.getContext('webgl2', { antialias:false, preserveDrawingBuffer:false });
const bootErr = document.getElementById('boot-err');
if(!gl){ bootErr.textContent='WebGL2 に未対応のブラウザです'; }
const extCBF = gl && gl.getExtension('EXT_color_buffer_float');
if(gl && !extCBF){ bootErr.textContent='float フレームバッファに未対応（EXT_color_buffer_float）'; }

const PRESETS = [
  [0.0545, 0.0620],  // 珊瑚
  [0.0290, 0.0570],  // 迷路
  [0.0580, 0.0650],  // 指紋
  [0.0367, 0.0649],  // 斑
  [0.0300, 0.0550],  // 孔（Pearson δ）
];
const TONES = {
  sumi:   [[0,0,0],[1,1,1]],
  kinari: [[0.078,0.067,0.051],[0.941,0.918,0.855]],   // 墨インク / 生成り紙
  ai:     [[0.035,0.086,0.161],[0.898,0.925,0.945]],   // 藍 / 白
};
/* ⭐⭐ 作品の色（2026-08-12）── 木下が NIJIMI で作った実物から【実測して】採った組。
   木下＝「この頃の json がなく、プリセットを他ツールみたいに用意してくれる？色合いのね」。
   ⚠️ 変えるのは【色だけ】。描いた場・筆・反応拡散のつまみには触らない
      ＝作り込みを消さない（[[feedback_state_needs_undo_and_export]] と同じ構え）。
   ⭐ grad:1 の組は【字グラデも入れる】＝色列がその作品の見え方そのものだから。
      grad:0 の組は字が単色なので、逆にグラデを切る（切らないと前の色列が残って別物になる）。 */
const IRO = [
  { n:'粒',   bg:'#1b3c2d', grad:1, ink:'#e6e0d0', g:['#aa2e36','#e6e0d0','#8fb9c9'] },
  { n:'白青', bg:'#000000', grad:1, ink:'#fbfbfe', g:['#50508f','#8f8fcf','#d4d4f5','#fbfbfe'] },
  { n:'白藤', bg:'#000000', grad:1, ink:'#fefefe', g:['#5959a9','#8080da','#b5b5f4','#fefefe'] },
  { n:'藤青', bg:'#000000', grad:1, ink:'#e6e6fc', g:['#121263','#4a4aef','#9f9ff7','#e6e6fc'] },
  { n:'緑青', bg:'#000000', grad:1, ink:'#449738', g:['#449738','#367761','#2f6779','#254ea3'] },
  { n:'輪郭', bg:'#000000', grad:0, ink:'#2525f1', g:['#1d1d8b','#9696e5'] },
  { n:'赤輪', bg:'#bfbcd0', grad:0, ink:'#c92c1f', g:['#c92c1f','#f0eef5'] },
  { n:'青地', bg:'#2424f4', grad:0, ink:'#10101b', g:['#10101b','#8080cc'] },
  /* ⭐ ここから下は 2026-08-12 に足した組。
     ⚠️ 上の8つは【木下が作った実物から採ったもの】、下は性質が違う：
        「紅水」は木下の画面（kinoshita.studio/nijimi/ 2026-08-12）から【目で採った近似】、
        残りの3つは新しく組んだもの。だから違うと思ったら遠慮なく差し替えてください。 */
  { n:'紅水', bg:'#0f1c33', grad:1, ink:'#f03b30', g:['#0f1c33','#f03b30','#5ee7e7','#f03b30'] },
  { n:'黄墨', bg:'#000000', grad:1, ink:'#f5e6a3', g:['#241a00','#c9a227','#f5e6a3','#ffffff'] },
  { n:'橙藍', bg:'#06121f', grad:1, ink:'#ffd9a0', g:['#0a2540','#1f6feb','#ff7a18','#ffd9a0'] },
  { n:'桃灰', bg:'#e8e6e3', grad:1, ink:'#2b2b2b', g:['#2b2b2b','#b06070','#e8b4bc','#f7f2f0'] },
];
const P = {
  mode:'diff', preset:0, facet:0, cells:7,
  thr:0.24, noise:0.34, dust:0, grain:0.82, warp:0.18,
  invert:0, tone:'sumi', bleed:8, outline:0, grow:0, steps:12, cycle:8, mask:0,
  /* ⭐ gStops＝グラデの色列。2色固定（旧 gA/gB）をやめて何色でも並べられるようにした（2026-08-04）。
     ⚠️ 旧い盤は gA/gB で保存されている＝読み込む時に色列へ読み替える（applyBoardParams）。 */
  /* ⭐ グラデの形（2026-08-12）＝0流す 1中心 2渦 3まわり 4沿う。
     ⚠️ 「沿う」は元は別のセグ（直線／沿う）だった＝同じ「どう渡すか」の話が2箇所に分かれていて
        木下から見て違いが読めない。⭐ 形ひとつに畳んだ（gfollow は内部の互換用に残す）。 */
  grad:0, gAng:2.2, gShape:0, gCx:50, gCy:50, gfollow:0,
  gStops:[[0.14,0.14,1.0],[1,1,1]], ink:[1,1,1], bg:[0,0,0],
  bgGrad:0, bgStops:[[0.05,0.05,0.09],[0.35,0.20,0.45]],
  /* ⭐ マス目に落とす（2026-08-12・膜 MAKU から）。0＝なし＝これまでどおり。
     ⚠️ 上の noise（粒）／grain（細かさ）は【しきい値のゆらぎ】で別物。名前を分けてある。 */
  cell:0, cellInk:1, cellJit:0, cellAsp:0,
};
const SIM = 640;
const EXPORT_RES = 2048;
const MAXSRC = 12;
let seed = Math.random()*1000;
let mode = 'diff';

/* ── GL ヘルパ ── */
function sh(type,src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){ console.error(gl.getShaderInfoLog(s),src); throw new Error('shader'); } return s; }
const VERT = `#version 300 es
out vec2 vUv;
void main(){ vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2)); vUv=p; gl_Position=vec4(p*2.0-1.0,0.0,1.0); }`;
function prog(fsrc){ const p=gl.createProgram(); gl.attachShader(p,sh(gl.VERTEX_SHADER,VERT)); gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fsrc));
  gl.linkProgram(p); if(!gl.getProgramParameter(p,gl.LINK_STATUS)){ console.error(gl.getProgramInfoLog(p)); throw new Error('link'); } return p; }
function tex(res){ const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,res,res,0,gl.RGBA,gl.HALF_FLOAT,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.REPEAT); return t; }
function fbo(t){ const f=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0); return f; }

const HASH = `
  float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
  vec2 hash2(vec2 p){ return vec2(hash(p),hash(p+19.19)); }
  float vnoise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);
    float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));
    return mix(mix(a,b,f.x),mix(c,d,f.x),f.y); }`;

/* ── シェーダ ── */
const F_INIT = `#version 300 es
precision highp float; in vec2 vUv; out vec4 o; uniform float uSeed;
${HASH}
void main(){ float v=0.0; vec2 g=floor(vUv*70.0); if(hash(g+uSeed)>0.86) v=1.0; o=vec4(1.0,v,0.0,1.0); }`;

const F_BAKE = `#version 300 es
precision highp float; in vec2 vUv; out vec4 o;
uniform float uSeed,uCells,uFacet,uF,uK;
${HASH}
const int NP=5;
vec2 preset(int i){
  if(i==0) return vec2(0.0545,0.0620);
  if(i==1) return vec2(0.0290,0.0570);
  if(i==2) return vec2(0.0580,0.0650);
  if(i==3) return vec2(0.0367,0.0649);
  return vec2(0.0300,0.0550);
}
void main(){
  if(uFacet<0.5){ o=vec4(uF,uK,0.0,1.0); return; }
  float best=1e9; int id=0; int n=int(uCells);
  for(int i=0;i<24;i++){ if(i>=n) break;
    vec2 pt=hash2(vec2(float(i)*7.1+uSeed,float(i)*3.3+uSeed*0.7));
    float d=distance(vUv,pt); if(d<best){ best=d; id=i; } }
  int pi=int(hash(vec2(float(id)*2.7+uSeed,5.0))*float(NP)); pi=pi>=NP?NP-1:pi;
  vec2 fk=preset(pi); fk+=(hash2(vec2(float(id),uSeed))-0.5)*vec2(0.0025,0.0020);
  o=vec4(fk,0.0,1.0);
}`;

const F_SIM = `#version 300 es
precision highp float; in vec2 vUv; out vec4 o;
uniform sampler2D uPrev,uParam; uniform vec2 uTexel;
const float Du=0.16,Dv=0.08,dt=1.0;
void main(){
  vec2 c=texture(uPrev,vUv).xy; vec2 lap=c*(-1.0);
  lap+=texture(uPrev,vUv+vec2( uTexel.x,0.0)).xy*0.2;
  lap+=texture(uPrev,vUv+vec2(-uTexel.x,0.0)).xy*0.2;
  lap+=texture(uPrev,vUv+vec2(0.0, uTexel.y)).xy*0.2;
  lap+=texture(uPrev,vUv+vec2(0.0,-uTexel.y)).xy*0.2;
  lap+=texture(uPrev,vUv+uTexel).xy*0.05;
  lap+=texture(uPrev,vUv-uTexel).xy*0.05;
  lap+=texture(uPrev,vUv+vec2(uTexel.x,-uTexel.y)).xy*0.05;
  lap+=texture(uPrev,vUv+vec2(-uTexel.x,uTexel.y)).xy*0.05;
  vec2 fk=texture(uParam,vUv).xy; float u=c.x,v=c.y,uvv=u*v*v;
  float du=Du*lap.x-uvv+fk.x*(1.0-u);
  float dv=Dv*lap.y+uvv-(fk.x+fk.y)*v;
  o=vec4(clamp(u+du*dt,0.0,1.0),clamp(v+dv*dt,0.0,1.0),0.0,1.0);
}`;

const F_PAINT = `#version 300 es
precision highp float; in vec2 vUv; out vec4 o;
uniform sampler2D uPrev; uniform vec2 uBrush; uniform float uR,uAdd;
void main(){ vec2 c=texture(uPrev,vUv).xy; float d=distance(vUv,uBrush);
  float m=smoothstep(uR,uR*0.35,d)*uAdd; c.y=min(1.0,c.y+m); c.x=mix(c.x,0.5,m); o=vec4(c,0.0,1.0); }`;

// 干渉: 複数波源の重ね合わせ（円形波＋花弁の角度項）→ .y に 0..1 の場
const F_WAVE = `#version 300 es
precision highp float; in vec2 vUv; out vec4 o;
uniform vec4 uSrc[${MAXSRC}];   // xy=位置, z=周波数, w=花弁数
uniform float uPh[${MAXSRC}];   // 位相
uniform int uN; uniform float uWarp,uSeed;
${HASH}
void main(){
  vec2 uv=vUv;
  vec2 w=uv+uWarp*vec2(vnoise(uv*3.0+uSeed)-0.5, vnoise(uv*3.0+uSeed+7.3)-0.5);
  float s=0.0;
  for(int i=0;i<${MAXSRC};i++){ if(i>=uN) break;
    vec2 rel=w-uSrc[i].xy; float d=length(rel); float a=atan(rel.y,rel.x);
    s+=cos(uSrc[i].z*d + uSrc[i].w*a + uPh[i]);
  }
  s/=max(float(uN),1.0);
  o=vec4(0.0, s*0.5+0.5, 0.0, 1.0);
}`;

// 表示: ノイズ摂動しきい値 → 塵 → 色味の2値マッピング
const F_DISP = `#version 300 es
precision highp float; in vec2 vUv; out vec4 o;
uniform sampler2D uSim,uGradTex,uMask,uGradLUT,uBgLUT; uniform float uThr,uNoise,uDust,uGrainRes,uInvert,uBleed,uOutline,uGrad,uGAng,uGFollow,uMaskOn,uBgGrad,uFlow;
uniform vec2 uTexel; uniform vec3 uLo,uHi;
/* ⭐⭐ 育つのフェード（2026-08-12）── 1=そのまま／0=完全に消える。
   🔴 反応拡散を進めるだけでは【消えない】。連続スクショで確かめたら、指紋のようなプリセットは
      字がザラつくだけで形はそのまま残っていた（平均の明るさは下がるので数値だけ見ると
      「溶けた」と誤判定する）。木下＝「ループでゆっくり消え、ゆっくりまた表示される」。
   ⭐ だから【字の濃さそのもの】を時間で上げ下げする。溶け方（模様）は反応拡散が受け持ち、
      消える／現れるはここが受け持つ＝2つが同時に効く。 */
uniform float uFade;
/* ⭐⭐ マス目に落とす（2026-08-12）── 膜 MAKU の「粒」をそのまま持ってきたもの。
   ⭐ やっていることは【拾う場所をマス目の中心に丸める】だけ。ここを1回通せば、
      下流（滲み・しきい・グラデ・地）はぜんぶそのまま粒になる＝式を増やさない。
   ⚠️ NIJIMI に元からある「粒」「細かさ」は【しきい値のゆらぎ】で、これとは別物。
      同じ名前で足すと違いが読めなくなるので、まとまりごと分けてある。 */
uniform float uCell;      // マスの数（0=なし。大きいほど細かい）
uniform float uCellInk;   // 0=形だけ 1=形も色も 2=色だけ
uniform float uCellJit;   // ばらつき（マスごとに色を散らす＝ドット感）
uniform float uCellAsp;   // マスの形（-1=横長 0=正方 +1=縦長）
float cellRand(vec2 c){ return fract(sin(dot(c, vec2(127.1,311.7))) * 43758.5453); }
${HASH}
void main(){
  /* ⭐ 場を拾う場所（sUV＝形）と、色を引く場所（gUV）を分ける。
     🔴 形にかけると字の輪郭が階段になる。輪郭はなめらかのまま塗りだけ粒にしたい時があるので、
        MAKU と同じく「形だけ／形も色も／色だけ」を選べるようにしてある。 */
  vec2 sUV=vUv, gUV=vUv; float jit=0.0;
  if(uCell >= 4.0){
    vec2 cn = vec2(uCell);
    // ⚠️ マスの形＝縦のマス数を減らすと1マスが縦に長くなる（0なら正方）
    if(abs(uCellAsp) > 0.001) cn.y = max(1.0, cn.y * pow(2.0, -uCellAsp*2.0));
    vec2 cell = floor(vUv*cn);
    vec2 q = (cell+0.5)/cn;
    if(uCellInk < 1.5) sUV = q;                     // 0=形だけ / 1=形も色も
    if(uCellInk > 0.5) gUV = q;                     // 1=形も色も / 2=色だけ
    /* ⭐ ばらつき ── マス1つごとに色を引く位置をずらす＝隣のマスと違う色が出る。
       ⚠️ 向きに沿った段だけでは【縞】にしかならない。散らすには向きと無関係に散らす。 */
    jit = (cellRand(cell)-0.5)*uCellJit;
  }
  vec2 gp=vUv*uGrainRes;
  float n1=hash(gp),n2=hash(gp*0.41+13.0);
  float noise=n1*0.72+n2*0.28;
  float t;
  if(uOutline>0.5){               // 線モード：塗りの境界だけを描く（滲み=線の太さ）
    float R=max(uBleed,1.0); float mn=1.0,mx=0.0;
    for(int i=0;i<12;i++){ float a=float(i)/12.0*6.2831853; vec2 d=vec2(cos(a),sin(a))*R*uTexel;
      float s=texture(uSim,sUV+d).y; mn=min(mn,s); mx=max(mx,s); }
    float th=uThr+(noise-0.5)*uNoise;
    t=step(th,mx)*(1.0-step(th,mn));
  } else {                        // 塗りモード：中身は塗りのまま、縁だけ滲む
    float v;
    if(uBleed>0.5){ float s=texture(uSim,sUV).y,w=1.0;
      for(int i=0;i<16;i++){ float a=float(i)/16.0*6.2831853; vec2 d=vec2(cos(a),sin(a))*uBleed*uTexel;
        s+=texture(uSim,sUV+d).y+texture(uSim,sUV+d*0.5).y; w+=2.0; } v=s/w; }
    else { v=texture(uSim,sUV).y; }
    t=step(uThr, v+(noise-0.5)*uNoise);
  }
  float sp=hash(gp*1.93+7.0);
  if(sp>1.0-uDust*0.06) t=1.0-t;
  if(uInvert>0.5) t=1.0-t;
  /* ⭐「字で抜く」＝手で描いた字を型にして、その中だけに模様を出す（2026-07-31）。
     ⚠️ 干渉は自分の手が入らないモードなので、これが唯一「手」と繋がる道になる。
     型は別テクスチャ（uMask）＝干渉の場を壊さないので、抜くのを切れば元どおり。 */
  if(uMaskOn>0.5){
    float m=texture(uMask,sUV).g;           // 描いた場の V（塗った所が高い）
    t *= smoothstep(0.20,0.30,m);           // 字の外は地色のまま
  }
  // ⭐ 育つのフェード＝字の濃さそのものを上げ下げする（1でこれまでどおり）
  t *= uFade;
  vec3 inkc=uHi;                            // 塗り/線の色
  if(uGrad>0.5){
    float gg;
    if(uGFollow>0.5){                        // 沿う：線の太さ→中心が明るい立体チューブ状
      float th2=texture(uSim,gUV).y, w2=1.0;
      for(int i=0;i<16;i++){ float a=float(i)/16.0*6.2831853; vec2 d=vec2(cos(a),sin(a))*28.0*uTexel;
        th2+=texture(uSim,gUV+d).y; w2+=1.0; }
      gg=clamp(th2/w2*1.7,0.0,1.0);
    } else {                                 // 囲みごと：連結成分ごとに A→B を正規化（各字が全色域を持つ）
      gg=texture(uGradTex,gUV).r;
    }
    // ⭐ ばらつき＝マスごとに色を引く位置を散らす（マス目に落とすが切なら 0＝何も起きない）
    gg=clamp(gg+jit,0.0,1.0);
    /* ⭐ 流す（2026-08-12 木下＝「グラデーションの縦を流れるようなアニメーション」）。
       帯を引く位置を uFlow ぶんずらすだけ＝形も滲みも1つも動かない。
       ⚠️ 端で色が飛ばないよう、流している間は帯を【環】に焼く（JS 側 updateGradLUT）。 */
    gg=fract(gg+uFlow);
    /* ⭐ 色は2色固定をやめ、256×1 の帯（uGradLUT）を1回引くだけにした（2026-08-04）。
       色を何色に増やしてもシェーダは書き換え不要＝JS側で帯を焼き直すだけ。
       ⚠️ テクセルの真ん中を引く＝両端の色がちゃんと端まで出る。 */
    inkc=texture(uGradLUT, vec2((clamp(gg,0.0,1.0)*255.0+0.5)/256.0, 0.5)).rgb;
  }
  /* ⭐ 地のグラデ（2026-08-04）。字は【一字ごと】に色を渡すが、地は【盤ぜんたい】を
        「向き」の方向に1回だけ渡る＝一枚の紙に光が当たっているように見える。
     ⚠️ 向きのつまみは字グラデと共用＝どちらも同じ方角に流れる。 */
  vec3 lo=uLo;
  if(uBgGrad>0.5){
    vec2 gd=vec2(cos(uGAng),sin(uGAng));
    float bt=dot(gUV-0.5,gd)/max(abs(gd.x)+abs(gd.y),1e-4)+0.5;   // 盤の端から端で 0→1
    lo=texture(uBgLUT, vec2((fract(clamp(bt+jit,0.0,1.0)+uFlow)*255.0+0.5)/256.0, 0.5)).rgb;
  }
  vec3 col=mix(lo,inkc,t);
  col*=1.0-(hash(gp*0.83+3.0)-0.5)*0.05;   // 紙のかすかな粒
  o=vec4(col,1.0);
}`;

const F_MASK=`#version 300 es
precision highp float; in vec2 vUv; out vec4 o; uniform sampler2D uSim;
void main(){ o=vec4(vec3(texture(uSim,vUv).y),1.0); }`;

/* ⭐ 盤の保存・復元用。場（U,V）をそのまま写すだけの通し。
   ⚠️ 場は RGBA16F なので readPixels で直接は読めない。いったん RGBA8 に写して読む＝
      U,V が 8bit に丸まる。描いたものを取り戻すには十分だが、完全な同一ではない。 */
const F_COPY=`#version 300 es
precision highp float; in vec2 vUv; out vec4 o; uniform sampler2D uSrc;
void main(){ o = vec4(clamp(texture(uSrc,vUv).xy, 0.0, 1.0), 0.0, 1.0); }`;

const pInit=prog(F_INIT), pBake=prog(F_BAKE), pSim=prog(F_SIM), pPaint=prog(F_PAINT), pWave=prog(F_WAVE), pDisp=prog(F_DISP), pMask=prog(F_MASK), pCopy=prog(F_COPY);

/* ── リソース ── */
let texA,texB,texParam,fboA,fboB,fboParam,read=0;
function tex8f(res){ const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,res,res,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE); return t; }
const maskTex8=tex8f(SIM), fMask8=fbo(maskTex8), gradTex=tex8f(SIM);

/* ⭐ グラデの「帯」＝色列（P.gStops）を 256×1 のテクスチャに焼いたもの（2026-08-04）。
   色を2色から何色にも増やせるようにするため、色そのものを uniform で渡すのをやめた。
   ⚠️ 焼き直すのは色を触った時だけ＝毎フレームの負担はゼロ。 */
function makeLUT(){ const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,256,1,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE); return t; }
const gradLUT = makeLUT();   // 字のグラデ
const bgLUT   = makeLUT();   // 地のグラデ（2026-08-04）
const lutPx = new Uint8Array(256*4);
/* ⚠️ 渦・まわりは【一周して戻ってくる】ので、色を環にしないと継ぎ目が1本出る。
   ⭐ 環にする＝色列の先頭を末尾にもう1つ足すだけ（TSUBUTE / HORI 2 / KUMI で同じ所を踏んでいる）。 */
function bakeLUT(tex, stops, ring){
  let st = (Array.isArray(stops) && stops.length>=2) ? stops : [[0,0,0],[1,1,1]];
  if(ring) st = st.concat([st[0]]);
  const n = st.length;
  for(let i=0;i<256;i++){
    const f = i/255*(n-1), k = Math.min(Math.floor(f), n-2), m = f-k;   // 隣り合う2色の間を渡る
    for(let c=0;c<3;c++){ const v = st[k][c] + (st[k+1][c]-st[k][c])*m;
      lutPx[i*4+c] = Math.round(Math.min(Math.max(v,0),1)*255); }
    lutPx[i*4+3]=255;
  }
  gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,256,1,gl.RGBA,gl.UNSIGNED_BYTE,lutPx);

// ⭐ 渦（2）・まわり（3）のときだけ色を環にする
/* ⚠️ 流している間は【必ず環にする】。環にしないと、色列の先頭と末尾が違うぶんだけ
   一周ごとに色が飛ぶ（SAKUJI で同じ所を踏んだ：木下＝「2秒間に1回角つきます」）。
   ⚠️ window を見るのは、この関数が起動のごく早い時期にも呼ばれるため（const は TDZ）。 */
function updateGradLUT(){ bakeLUT(gradLUT, P.gStops, !!window.__njFlow || (P.gShape>1.5 && P.gShape<3.5)); }
function updateBgLUT(){   bakeLUT(bgLUT,   P.bgStops, !!window.__njFlow); }
updateGradLUT(); updateBgLUT();
// ペンを離した時に描画を連結成分でラベル付けし、各成分内で向き方向に A→B を正規化した座標を gradTex に焼く
function computeGradCoords(){ if(!extCBF) return; try{
  gl.useProgram(pMask); gl.bindFramebuffer(gl.FRAMEBUFFER,fMask8); gl.viewport(0,0,SIM,SIM);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,curTex()); gl.uniform1i(gl.getUniformLocation(pMask,'uSim'),0); draw();
  const px=new Uint8Array(SIM*SIM*4); gl.readPixels(0,0,SIM,SIM,gl.RGBA,gl.UNSIGNED_BYTE,px);
  const N=SIM*SIM, bin=new Uint8Array(N), label=new Int32Array(N).fill(-1), stack=new Int32Array(N);
  for(let i=0;i<N;i++) bin[i]= px[i*4]>64?1:0;
  /* ⭐⭐ グラデの【形】（2026-08-12）── 他の道具（TSUBUTE / HORI 2 / TSUBU / KUMI）は
     流す／中心／渦／まわりの4形を持っていて、NIJIMI だけ「流す」1つだった。
     ⭐ 足すのは【同じグラデを、どの座標に流すか】だけ。シェーダは1行も変わらない
        （シェーダは gradTex を1回引くだけで、形の違いはここで焼き込まれる）。
     ⭐ 一字ごとに 0→1 という NIJIMI の芯はそのまま＝どの形でも【各字が全色域を持つ】。
     ⚠️ 中心・渦・まわりは、その字の外接の中心を基準にする（盤の中心ではない）。
        盤の中心にすると、字ごとに色が渡らず「一枚の紙に模様が乗っている」だけになる。 */
  const ca=Math.cos(P.gAng), sa=Math.sin(P.gAng);
  const shape = Math.round(P.gShape||0);
  const cmin=[], cmax=[], bx0=[], by0=[], bx1=[], by1=[]; let comp=0;
  for(let s=0;s<N;s++){ if(!bin[s]||label[s]!==-1) continue;
    let sp=0; stack[sp++]=s; label[s]=comp; let mn=1e9,mx=-1e9;
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    while(sp>0){ const idx=stack[--sp], x=idx%SIM, y=(idx/SIM)|0, p=(x/SIM)*ca+(y/SIM)*sa;
      if(p<mn)mn=p; if(p>mx)mx=p;

let running=false;

/* ── リサイズ ── */
/* ⭐ 盤は「窓の大きさ」でなく【パネルを除いた残りの領域】いっぱいに取る（2026-07-31）。
   ⚠️ innerWidth/innerHeight を見ると、右のパネルのぶんだけ盤が小さくなる。#wrap の実寸を見ること。 */
const wrapEl = document.getElementById('wrap');
/* 🔴 動画の入れ物の宣言はここ（resize / loop より前）に置く。let も const も巻き上げでは TDZ なので、
   宣言より前で参照すると ReferenceError で止まる＝起動しなくなる（元の rec もこの理由でここにあった）。 */
const TV = { on:false, stop:false };
function resize(){
  if(TV.on) return;            // ⚠️ 書き出し中に盤の大きさを変えない
  const box = wrapEl.getBoundingClientRect();
  const s = Math.floor(Math.min(box.width, box.height) * 0.98);
  const dpr = Math.min(devicePixelRatio, 2);
  cvs.style.width=s+'px'; cvs.style.height=s+'px'; cvs.width=Math.floor(s*dpr); cvs.height=Math.floor(s*dpr); }
addEventListener('resize',resize);

/* ── ポインタ ── */
const brush={ down:false, x:0.5, y:0.5, r:0.045 };
function toUv(e){ const r=cvs.getBoundingClientRect(); const px=(e.clientX-r.left)/r.width, py=(e.clientY-r.top)/r.height;
  return { x:Math.min(Math.max(px,0),1), y:1-Math.min(Math.max(py,0),1) }; }
cvs.addEventListener('pointerdown',e=>{ cvs.setPointerCapture(e.pointerId); const p=toUv(e);
  if(mode==='wave'){ addSource(p.x,p.y); }
  else { brush.x=p.x; brush.y=p.y; brush.down=true;
    if(P.grow>0.5) strokeRec = [];    // ⭐ 育てている最中は軌跡を覚える（元の字へ足すため）
  } });
cvs.addEventListener('pointermove',e=>{ if(mode==='wave'||!brush.down) return; const p=toUv(e); brush.x=p.x; brush.y=p.y; });
addEventListener('pointerup',()=>{ if(brush.down){ brush.down=false; if(mode!=='wave') computeGradCoords();
  /* ⭐ 育てながら描き足した分は【そのストロークだけ】を元の字に足す。
     🔴 ここで growStart() を呼んでいた＝溶けかけの場が元の字になり、二度と戻らなかった。 */
  if(P.grow>0.5){ growAddStroke(strokeRec); strokeRec = null; }
  saveSoon(); } });

/* ── 書き出し ── */
function exportPNG(){
  const R=EXPORT_RES;
  let fieldTex=curTex(), tmpF=null,tmpT=null;
  if(mode==='wave'){ tmpT=tex(R); tmpF=fbo(tmpT); computeWave(performance.now(),tmpF,R); fieldTex=tmpT; }
  const et=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,et);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,R,R,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
  const ef=fbo(et); display(ef,R,fieldTex);
  const px=new Uint8Array(R*R*4); gl.readPixels(0,0,R,R,gl.RGBA,gl.UNSIGNED_BYTE,px);
  const oc=document.createElement('canvas'); oc.width=R; oc.height=R; const octx=oc.getContext('2d');
  const img=octx.createImageData(R,R);
  for(let y=0;y<R;y++){ const s=(R-1-y)*R*4, d=y*R*4; img.data.set(px.subarray(s,s+R*4),d); }
  octx.putImageData(img,0,0);
  oc.toBlob(b=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='nijimi_'+P.mode+'_'+Date.now()+'.png'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000); },'image/png');
  gl.deleteFramebuffer(ef); gl.deleteTexture(et);
  if(tmpF){ gl.deleteFramebuffer(tmpF); gl.deleteTexture(tmpT); }
}

/* ⭐ マス目の細かさ ── つまみの目盛り（0-100）と実際のマス数を分ける（MAKU と同じ作法）。

function applyCellUI(){

// ⭐ 入にした時に1回焼く＝切の間に向きを動かしていても、入れた瞬間その向きになる
seg('seg-grad','grad',()=>{ if(P.grad>0.5 && P.gfollow<0.5 && mode!=='wave') computeGradCoords(); applyGradUI(); saveSoon(); });
/* ⭐ 形＝流す/中心/渦/まわり/沿う。⚠️ 「沿う」だけはシェーダ側（線の太さ）で作るので
   gfollow に読み替える。⭐ 渦・まわりは色を環にする必要があるので LUT も焼き直す。 */
seg('seg-gshape','gShape',()=>{
  P.gfollow = (P.gShape > 3.5) ? 1 : 0;
  updateGradLUT();
  if(P.grad>0.5 && P.gfollow<0.5 && mode!=='wave') computeGradCoords();

});
