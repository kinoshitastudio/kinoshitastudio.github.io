bindRange('s-steps','steps','v-steps',1);
bindRange('s-cycle','cycle','v-cycle',1);
bindRange('s-gang','gAng','v-gang',Math.PI/180);
/* ⭐ 中心のずらし（形が 中心/渦/まわり のとき効く）。向きと同じで、焼き直しが要る＝
   入力中は間引いて追従させ、離した時に必ず1回決める（下の gang と同じ扱い）。 */
for(const [id,key,vid] of [['s-gcx','gCx','v-gcx'],['s-gcy','gCy','v-gcy']]){
  const el=document.getElementById(id); if(!el) continue;
  let last=0;
  const put=()=>{ P[key]=+el.value; const v=document.getElementById(vid); if(v) v.textContent=el.value; };
  el.addEventListener('input',()=>{ put();
    const t=performance.now(); if(t-last<120) return; last=t;
    if(P.grad>0.5 && P.gfollow<0.5 && mode!=='wave') computeGradCoords(); });
  el.addEventListener('change',()=>{ put();
    if(P.grad>0.5 && P.gfollow<0.5 && mode!=='wave') computeGradCoords(); saveSoon(); });
  put();
}
/* 🔴「向きを変えても何の反応もない」（木下・2026-07-31）の正体：
     ⭐ 向きは画面に直接効かず、gradTex に【焼き込む】もの（computeGradCoords）。
        それを change＝スライダーを離した時にしか呼んでいなかったので、
        ドラッグしながら見ている間はまったく変わらなかった。
     ⚠️ 焼き直しは連結成分のラベリング（640×640 を JS で走査）で重いので、
        毎フレームは回さない。⭐入力中は間引いて追従させ、離した時に必ず1回決める。
     ⚠️「沿う」は線の太さから作るので向きは元から効かない（仕様）。
     ⚠️ 地グラデ（2026-08-04）は向きを【シェーダで直に】使う＝焼き直しは要らない。
        なので字グラデが切の間は焼かない。⭐その代わり、字グラデを入にした時に1回焼く
        （切の間に向きを動かしていても、入にした瞬間ちゃんと今の向きになる）。 */
(function(){
  const el = document.getElementById('s-gang');
  let last = 0, pending = null;
  const needBake = () => mode!=='wave' && P.grad>0.5 && P.gfollow<0.5;
  const bakeGrad = () => { if(needBake()) computeGradCoords(); last = performance.now(); };
  el.addEventListener('input', () => {
    if(!needBake()) return;                            // 沿う／干渉／字グラデ切では焼く意味がない
    const now = performance.now();
    if(now - last > 120){ bakeGrad(); }
    else if(!pending){ pending = setTimeout(()=>{ pending=null; bakeGrad(); }, 120); }
  });
  el.addEventListener('change', () => { if(pending){ clearTimeout(pending); pending=null; } bakeGrad(); });
})();
const hex2rgb=h=>{ h=h.replace('#',''); return [parseInt(h.slice(0,2),16)/255,parseInt(h.slice(2,4),16)/255,parseInt(h.slice(4,6),16)/255]; };
const rgb2hex=c=>'#'+c.map(v=>('0'+Math.round(Math.min(Math.max(v,0),1)*255).toString(16)).slice(-2)).join('');
{ const ink=document.getElementById('ink'), bg=document.getElementById('bg');
  ink.addEventListener('input',()=>{P.ink=hex2rgb(ink.value); saveSoon();});
  bg.addEventListener('input',()=>{P.bg=hex2rgb(bg.value); saveSoon();}); }

/* ── グラデの色列（2026-08-04）──
   ⭐ 2色固定をやめ、色を足して並べられるようにした。並びの左から右が gg=0→1。
   ⚠️ 色を触ったら updateGradLUT で帯を焼き直す。焼き直さないと画面は前の色のまま。 */
const GMIN=2, GMAX=6;
/* ⭐ 字と地は【同じ仕組み】の色列にしてある（2026-08-04）。違いは渡り方だけ＝
      字は一字ごとに 0→1、地は盤ぜんたいで 0→1。だから作り方も1つで済ませる。 */
const STOPS = {
  ink: { key:'gStops',  host:'gstops',  add:'g-add',  del:'g-del',  bake:()=>updateGradLUT(),
         fallback:()=>[ (P.gA||[0.14,0.14,1.0]).slice(), (P.gB||[1,1,1]).slice() ] },   // 旧い盤の gA/gB から読み替え
  bg:  { key:'bgStops', host:'bgstops', add:'bg-add', del:'bg-del', bake:()=>updateBgLUT(),
         fallback:()=>[ (P.bg||[0,0,0]).slice(), [0.35,0.20,0.45] ] },                  // 地グラデが無い盤は地色から始める
};
function normStops(s){
  if(!Array.isArray(P[s.key]) || P[s.key].length<GMIN) P[s.key] = s.fallback();
  if(P[s.key].length>GMAX) P[s.key].length=GMAX;
}
function renderStops(s){
  normStops(s);
  const host=document.getElementById(s.host); host.textContent='';
  P[s.key].forEach((c,i)=>{
    const el=document.createElement('input'); el.type='color'; el.value=rgb2hex(c);
    el.title='色 '+(i+1);
    el.addEventListener('input',()=>{ P[s.key][i]=hex2rgb(el.value); s.bake(); saveSoon(); });
    host.appendChild(el);
  });
  document.getElementById(s.add).disabled = P[s.key].length>=GMAX;
  document.getElementById(s.del).disabled = P[s.key].length<=GMIN;
  s.bake();
}
function renderGStops(){ renderStops(STOPS.ink); renderStops(STOPS.bg); }
/* ⭐ 足す色は【最後の色の反転】＝押した瞬間に見た目が変わる。
      同じ色を足すと「押しても何も起きない」ように見えるので、そうしていない。 */
Object.values(STOPS).forEach(s=>{
  document.getElementById(s.add).onclick=()=>{
    normStops(s); if(P[s.key].length>=GMAX) return;
    const last=P[s.key][P[s.key].length-1];
    P[s.key].push([1-last[0],1-last[1],1-last[2]]); renderStops(s); saveSoon(); };
  document.getElementById(s.del).onclick=()=>{
    normStops(s); if(P[s.key].length<=GMIN) return;
    P[s.key].pop(); renderStops(s); saveSoon(); };
});

/* 🔴「字と地はちゃんと反映してる？」（木下・2026-08-04）への答え：
     ⭐ 地は【いつも】効く。字は【グラデが切の時だけ】効く＝入の間はグラデが字の色を置き換える。
     ⚠️ 見た目では区別がつかなかったので、効かない項目を薄くして分かるようにした。
        ・字グラデ入 → 「字」を薄く（字の色列がその代わり）
        ・字グラデ切 → 字の「色」の列を薄く
        ・地グラデ入 → 「地」を薄く（地の色列がその代わり）／切 → 地の「色」の列を薄く
        ・【向き】は字グラデ(直線)か地グラデのどちらかが要る時だけ効く
          （「沿う」は線の太さから作るので向きは元から効かない＝仕様） */
function applyGradUI(){
  const on = P.grad>0.5, bgOn = P.bgGrad>0.5;
  document.getElementById('ink-pair').classList.toggle('dim', on);
  document.getElementById('grp-gstops').classList.toggle('dim', !on);
  document.getElementById('bg-pair').classList.toggle('dim', bgOn);      // 地グラデ入なら地色は使われない
  document.getElementById('grp-bgstops').classList.toggle('dim', !bgOn);
  // ⚠️ 向きは【字グラデの直線】か【地グラデ】のどちらかが要るときだけ効く
  document.getElementById('grp-gang').classList.toggle('dim', !((on && P.gfollow<0.5) || bgOn));
  /* ⭐ 形（2026-08-12）── 字グラデが切なら形そのものが効かない。
     ⚠️ 中心よこ／たては【中心・渦・まわり】でしか効かない＝流す／沿うでは薄くする
        （効かないつまみを触れる状態にしない＝NIJIMI で繰り返し出ている木下の原則）。 */
  const sh = Math.round(P.gShape||0);
  document.getElementById('grp-gshape').classList.toggle('dim', !on);
  const centerOn = on && sh>=1 && sh<=3;
  document.getElementById('grp-gcx').classList.toggle('dim', !centerOn);
  document.getElementById('grp-gcy').classList.toggle('dim', !centerOn);
}
renderGStops(); applyGradUI();
// 色プリセット（墨/生成/藍）は字色・地色を一括セット
document.querySelectorAll('#seg-tone button').forEach(b=>{ b.onclick=()=>{
  document.querySelectorAll('#seg-tone button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  const T=TONES[b.dataset.v]; P.bg=T[0].slice(); P.ink=T[1].slice();
  document.getElementById('bg').value=rgb2hex(P.bg); document.getElementById('ink').value=rgb2hex(P.ink); }; });

/* ⭐⭐ グラデの型（2026-08-12）── 【渡り方】（形・向き・中心）だけをまとめたもの。
   ⭐ 色には触らない＝「作品の色」（色列）と直交する。だから自由に掛け合わせられる。
   ⚠️ 焼き直し（computeGradCoords）が要る＝向きや中心を変えたのと同じ扱いにする。 */
const GKATA = [
  { n:'流す',   s:0, a:126 },
  { n:'上から', s:0, a:90  },
  { n:'横から', s:0, a:0   },
  { n:'中心',   s:1, cx:50, cy:50 },
  { n:'片寄せ', s:1, cx:30, cy:32 },
  { n:'渦',     s:2, a:90,  cx:50, cy:50 },
  { n:'まわり', s:3, a:0,   cx:50, cy:50 },
  { n:'沿う',   s:4 },
];
function applyKata(t){
  P.gShape = t.s;
  P.gfollow = (t.s > 3.5) ? 1 : 0;
  if(t.a  !== undefined){ P.gAng = t.a*Math.PI/180;
    const e=document.getElementById('s-gang'); if(e){ e.value=t.a; const v=document.getElementById('v-gang'); if(v) v.textContent=t.a; } }
  for(const [k,id,vid] of [['cx','s-gcx','v-gcx'],['cy','s-gcy','v-gcy']]){
    if(t[k] === undefined) continue;
    P[k==='cx'?'gCx':'gCy'] = t[k];
    const e=document.getElementById(id); if(e){ e.value=t[k]; const v=document.getElementById(vid); if(v) v.textContent=t[k]; }
  }
  // ⭐ 形のセグも合わせる（P → UI の結線忘れは NIJIMI が一度踏んでいる）
  document.querySelectorAll('#seg-gshape button').forEach(b=>b.classList.toggle('on', +b.dataset.v === t.s));
  updateGradLUT();                                   // 渦・まわりは色を環にする
  if(P.grad>0.5 && P.gfollow<0.5 && mode!=='wave') computeGradCoords();
  applyGradUI(); saveSoon();
}
(function(){
  const host = document.getElementById('gkata'); if(!host) return;
  GKATA.forEach(t => {
    const b = document.createElement('button');
    b.textContent = t.n;
    b.onclick = () => { host.querySelectorAll('button').forEach(x=>x.classList.toggle('on', x===b)); applyKata(t); };
    host.appendChild(b);
  });
})();

/* ⭐⭐ 作品の色 ── 押すと【色だけ】まとめて入る（場・筆・反応拡散のつまみは触らない）。
   🔴 P に入れただけでは駄目で、input の見た目と字グラデの入切ボタンまで戻すこと。
      NIJIMI は 2026-08-04 に「P → UI の結線忘れ」で【保存は正しいのに嘘の色が出る】を踏んでいる。 */
function applyIro(t){
  P.bg  = hex2rgb(t.bg);
  P.ink = hex2rgb(t.ink);
  P.grad = t.grad;
  P.gStops = t.g.map(hex2rgb);
  document.getElementById('bg').value  = t.bg;
  document.getElementById('ink').value = t.ink;
  document.querySelectorAll('#seg-grad button').forEach(b =>
    b.classList.toggle('on', +b.dataset.v === t.grad));
  renderStops(STOPS.ink);      // ⭐ 色列のスウォッチを描き直す＝ここで帯（LUT）も焼き直る
  /* ⚠️ ここで draw() を呼んではいけない ── draw() は生の drawArrays で、
     直前に使われていたプログラムと uniform のまま描いてしまう。
     色は display() が毎フレーム uLo/uHi と LUT を送り直すので、ループに任せる
     （既存の字色・地色ピッカーも同じで、何も呼ばずに反映されている）。 */
  applyGradUI(); saveSoon();
}
(function(){
  const host = document.getElementById('iro'); if(!host) return;
  IRO.forEach((t, i) => {
    const b = document.createElement('button');
    b.title = t.n + '（' + (t.grad ? '字グラデ入' : '字は単色') + '）';
    // ⭐ 地と、その作品の主な色の2色をチップに出す＝色そのものが選ぶ手がかりになる
    b.style.background = 'linear-gradient(135deg,' + t.bg + ' 0 50%,' + t.g[t.g.length-1] + ' 50% 100%)';
    b.onclick = () => {
      host.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      applyIro(t);
    };
    host.appendChild(b);
  });
})();

function applyModeUI(){
  // ⭐ 白紙は拡散と同じ道具立て（筆・滲み・塗り/線）を使う。違いは「種をまかない」ことだけ。
  document.querySelectorAll('.mode-diff').forEach(e=>e.classList.toggle('hide', mode==='wave'));
  document.querySelectorAll('.mode-wave').forEach(e=>e.classList.toggle('hide', mode!=='wave'));
  // ⚠️ 白紙で「まく」を出すと全面が埋まって、まっさらの意味が消える
  document.querySelectorAll('.mode-seed').forEach(e=>e.classList.toggle('hide', mode==='blank'));
  /* ⭐ 珊瑚/迷路/… ・FACET・速さ・周期 は【反応拡散が回っている時だけ】効く＝育つが切なら灰色。
     ⚠️ 面数は干渉では「波源の数」として効くので、拡散/白紙で育つが切の時だけ灰色にする。 */
  const rdOff = (mode!=='wave' && P.grow<0.5);
  document.querySelectorAll('.rd').forEach(e=>e.classList.toggle('dim', rdOff));
  document.querySelectorAll('.rd-cells').forEach(e=>e.classList.toggle('dim', rdOff));
  document.getElementById('l-cells').textContent = mode==='wave'?'波源':'面数';
}
function setThr(val){ P.thr=val*0.01; const el=document.getElementById('s-thr'); el.value=val; document.getElementById('v-thr').textContent=val; }
function setNoise(val){ P.noise=val*0.01; const el=document.getElementById('s-noise'); el.value=val; document.getElementById('v-noise').textContent=val; }
/* 🔴 モードを切り替えると描いたものが消えていた（2026-07-31 修正）。原因は2つ。
     ① 干渉は拡散と同じ場に書き込む＝出た瞬間に拡散の場が潰れる
     ② 拡散に戻る時に必ず seedField() を呼んでいた＝戻った瞬間にランダムな種で塗り直す
   ⭐ 出る前にその場を畳んで持っておき、戻る時に戻す。初めて入る時だけ種をまく。 */
const fieldCache = {};
seg('seg-mode','mode',()=>{
  const from = mode, to = P.mode;
  // ⭐ 出る前にその場を畳んで持っておく（拡散と白紙は別々の場として覚える）
  if(from !== 'wave'){ const snap = snapshotField(); if(snap) fieldCache[from] = snap; }
  mode = to; applyModeUI();
  if(to==='wave'){ setThr(50); setNoise(50); if(!sources.length) genSources(); uploadMask(); }
  else {
    setThr(24); setNoise(34); bake();
    if(fieldCache[to]) restoreField(fieldCache[to]);      // ⭐ 描いたものが戻る
    else if(to === 'blank') clearField();                 // ⭐ 白紙＝空から。種をまかない
    else seedField();                                     // 拡散は初回だけ種をまく
    computeGradCoords();
  }
  refreshStat(); saveSoon();
});

/* 🔴 場を作り替えるボタンは【畳んで持っている控えも捨てる】＋【盤にも保存する】。
     そうしないと、リセットしても
       ・モードを行き来すると控え(fieldCache)から古い絵が戻ってくる
       ・リロードすると盤に残った古い絵が戻ってくる
     ＝「リセットしたのに消えない」になる（木下・2026-07-31）。 */
function fieldChanged(){ delete fieldCache[mode]; refreshStat(); saveSoon(); }
document.getElementById('b-seed').onclick=()=>{ if(mode==='wave') genSources(); else seedField(); fieldChanged(); };
document.getElementById('b-clear').onclick=()=>{ if(mode==='wave'){ sources=[]; } else { clearField(); computeGradCoords(); } fieldChanged(); };
document.getElementById('b-reroll').onclick=()=>{ if(mode==='wave') genSources(); else { seed=Math.random()*1000; bake(); } fieldChanged(); };
document.getElementById('b-export').onclick=()=>{ exportPNG(); };
/* 🔴 REC（captureStream + MediaRecorder）は 2026-08-13 に捨てた。
   ⚠️ 実時間で【画面のドット】を録る作りなので、重いとコマ落ち／スローモーションになり、
      webm しか出ず、継ぎ目のないループも作れず、出る大きさも選べなかった
      （「録りたい大きさに窓を広げてから押す」と自分で書いてあった）。
   ⭐ 置き換え先＝この下の「動画で出す」。位相をコマ番号で刻み、exportPNG と同じ
      オフスクリーンの道で任意の大きさに焼く。 */

/* ══════════════════════════════════════════════════════════════
   JSON＝【設定の持ち運び】                              2026-08-04
   ⭐ 中身は「つまみ・色・グラデの色列・波源」＝もう一度この見え方を出すための一式。
      SAKUJI と同じ考え方で、プリセット代わりに使える。
   ⚠️ 描いた場（手で描いた字）は入れていない。あれは 640×640 の絵で、
      JSON に入れると桁が変わって持ち運べなくなる＝場はボード（IndexedDB）が持つ。
      なので【読み込んでも描いた字は消えない】。見え方だけが乗り換わる。
   ══════════════════════════════════════════════════════════════ */
/* ⭐⭐ JSON に【描いた場】も入れる（2026-08-12 木下＝「これを JSON で再現できる？」）
   🔴 これまでは設定（色・グラデ・滲み）だけで、手で描いた線は入っていなかった。
      ＝同じ設定は戻るが、字は描き直しになる＝作品そのものは戻せなかった。
   ⭐ 盤（IndexedDB）が使っている畳み方をそのまま借りる（fieldToBlob → PNG）。
      生のままだと 1盤 1.6MB なので PNG に畳む。
   ⚠️ wave（数式でつくる模様）は場を持たない＝種と波源だけで完全に戻るので入れない。
   ⚠️ 8bit に丸まる（盤と同じ）＝描いたものは戻るが、浮動小数の場が寸分違わず
      戻るわけではない。戻した直後からまた育っていく。
   ⚠️ 古い JSON（場が無いもの）もそのまま読める。 */
function blobToDataURL(b){
  return new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });
}
async function exportJSON(){
  const data = { tool:'nijimi', v:2, mode, seed, sources:JSON.parse(JSON.stringify(sources)),
                 P:JSON.parse(JSON.stringify(P)) };
  if(mode !== 'wave'){
    try{
      const px = snapshotField();
      if(px) data.field = await blobToDataURL(await fieldToBlob(px));
    }catch(err){ console.warn('場を JSON に入れられなかった', err); }
  }
  const b = new Blob([JSON.stringify(data,null,1)], {type:'application/json'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(b);
  a.download = 'nijimi_'+P.mode+'_'+Date.now()+'.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
async function applyJSON(data){
  if(!data || data.tool!=='nijimi') throw new Error('NIJIMI の JSON ではありません');
  const from = mode;
  // ⭐ モードが変わる時は、出る前にいまの場を畳んでおく（モード切替と同じ作法）
  if(from!=='wave'){ const snap=snapshotField(); if(snap) fieldCache[from]=snap; }
  applyBoardParams({ P:data.P||{}, seed:data.seed, sources:data.sources });
  if(mode!==from){
    if(mode==='wave'){ if(!sources.length) genSources(); uploadMask(); }
    else { bake();
      if(fieldCache[mode]) restoreField(fieldCache[mode]);
      else if(mode==='blank') clearField();
      else seedField(); }
  } else if(mode==='wave'){ uploadMask(); } else { bake(); }
  /* ⭐ 描いた場を戻す。⚠️【上の初期化がぜんぶ終わってから】＝先に戻すと
     seedField / clearField に上書きされて消える。 */
  if(data.field && mode !== 'wave'){
    try{
      const blob = await (await fetch(data.field)).blob();
      restoreField(await blobToField(blob));
    }catch(err){ console.warn('場を戻せなかった', err); }
  }
  computeGradCoords(); refreshStat(); saveSoon();
}
document.getElementById('b-json').onclick=()=>{ exportJSON(); };
document.getElementById('b-jsonin').onclick=()=>{ document.getElementById('f-json').click(); };
document.getElementById('f-json').onchange=async (e)=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  try{ await applyJSON(JSON.parse(await f.text())); }
  catch(err){ console.warn('JSON読込',err); alert('読み込めませんでした：'+err.message); }
  e.target.value='';   // ⚠️ 同じファイルをもう一度選べるように空にしておく
};

/* ── 起動 ── */
/* ⚠️ 起動画面（はじめる）は 2026-07-31 に廃止。開いた時点で回し始める。
   ⭐ WebGL2 が無い時は回さない＝#boot-err に理由だけ出る。 */

/* ══════════════════════════════════════════════════════════════
   盤の置き場（ボード）                                2026-07-31
   木下＝「既存のものに書いてもそれを干渉にしてしまうと戻した時に
           書いていたのがなくなる」「パソコンローカル保存もお願い」

   ⭐ 盤＝【描いた場 ＋ その時の設定】をひとまとめにしたもの。
      切り替えても・閉じても残る。判断を後回しにできる＝捨てなくていい。
   ⚠️ 保存先は IndexedDB。localStorage には入らない（場が 640×640＝1.6MB あり、
      localStorage の上限 5MB をすぐ超えるため）。場は PNG に畳んで持つ。
   ⚠️ 8bit に丸めて保存している（上の snapshotField 参照）。描いたものは戻るが、
      浮動小数の場が寸分違わず戻るわけではない。戻した直後から再び育っていく。
   ══════════════════════════════════════════════════════════════ */
const DB_NAME='nijimi', DB_STORE='boards';
let db=null, boards=[], curId=null, saveTimer=null;

function openDB(){ return new Promise((res,rej)=>{
  const r=indexedDB.open(DB_NAME,1);
  r.onupgradeneeded=()=>{ const d=r.result; if(!d.objectStoreNames.contains(DB_STORE)) d.createObjectStore(DB_STORE,{keyPath:'id'}); };
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function dbAll(){ return new Promise((res,rej)=>{ const t=db.transaction(DB_STORE,'readonly').objectStore(DB_STORE).getAll();
  t.onsuccess=()=>res(t.result||[]); t.onerror=()=>rej(t.error); }); }
function dbPut(v){ return new Promise((res,rej)=>{ const t=db.transaction(DB_STORE,'readwrite').objectStore(DB_STORE).put(v);
  t.onsuccess=()=>res(); t.onerror=()=>rej(t.error); }); }
function dbDel(id){ return new Promise((res,rej)=>{ const t=db.transaction(DB_STORE,'readwrite').objectStore(DB_STORE).delete(id);
  t.onsuccess=()=>res(); t.onerror=()=>rej(t.error); }); }

/* 場（Uint8Array）↔ PNG。生のまま持つと1盤1.6MBなので畳む */
function fieldToBlob(px){ const cv=document.createElement('canvas'); cv.width=cv.height=SIM;
  const cx=cv.getContext('2d'); const im=cx.createImageData(SIM,SIM);
  im.data.set(px); cx.putImageData(im,0,0);
  return new Promise(r=>cv.toBlob(r,'image/png')); }
async function blobToField(b){ const bmp=await createImageBitmap(b);
  const cv=document.createElement('canvas'); cv.width=cv.height=SIM;
  const cx=cv.getContext('2d'); cx.drawImage(bmp,0,0);
  return new Uint8Array(cx.getImageData(0,0,SIM,SIM).data.buffer); }
/* 一覧に出す小さい絵＝いま見えている盤をそのまま縮める */
function thumbURL(){ const cv=document.createElement('canvas'); cv.width=cv.height=84;
  cv.getContext('2d').drawImage(cvs,0,0,84,84); return cv.toDataURL('image/jpeg',0.72); }

const nowStamp = () => new Date().toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});

async function saveCur(){
  if(!db || !curId || !gl || !extCBF) return;
  const b = boards.find(x=>x.id===curId); if(!b) return;
  const px = (P.grow>0.5 && growOrigin) ? growOrigin : snapshotField();   // ⚠️育てている最中は溶けかけでなく元の字を保存する
  b.mode = mode; b.P = JSON.parse(JSON.stringify(P)); b.seed = seed;
  b.sources = JSON.parse(JSON.stringify(sources));
  if(px) b.field = await fieldToBlob(px);
  try{ b.thumb = thumbURL(); }catch(e){}
  b.updatedAt = Date.now(); b.stamp = nowStamp();
  await dbPut(b); renderBoards();
}
/* ⚠️ 描くたびに書き込むと重い。少し待ってからまとめて1回だけ保存する */
function saveSoon(){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>saveCur().catch(e=>console.warn('save',e)), 1200); }

function applyBoardParams(b){
  Object.assign(P, b.P||{}); mode = P.mode || 'diff'; seed = b.seed ?? seed;
  sources = b.sources ? JSON.parse(JSON.stringify(b.sources)) : [];
  // つまみ・セグメントを保存された値に合わせ直す
  document.querySelectorAll('#ctl .seg').forEach(sg=>{
    const key = ({'seg-mode':'mode','seg-preset':'preset','seg-facet':'facet','seg-draw':'outline',
                  'seg-tone':'tone','seg-grad':'grad','seg-gshape':'gShape','seg-bggrad':'bgGrad',
                  'seg-inv':'invert','seg-grow':'grow','seg-mask':'mask'})[sg.id];
    if(key===undefined) return;
    sg.querySelectorAll('button').forEach(bt=>{
      const raw = bt.dataset.p!==undefined? bt.dataset.p : bt.dataset.v;
      const v = isNaN(+raw)? raw : +raw;
      bt.classList.toggle('on', v === P[key]);
    });
  });
  const setRange=(id,vid,val)=>{ const e=document.getElementById(id); if(!e) return;
    e.value=val; const v=document.getElementById(vid); if(v) v.textContent=Math.round(val); };
  setRange('s-cells','v-cells',P.cells); setRange('s-thr','v-thr',Math.round(P.thr*100));
  setRange('s-noise','v-noise',Math.round(P.noise*100)); setRange('s-dust','v-dust',Math.round(P.dust*100));
  setRange('s-grain','v-grain',Math.round(P.grain*100)); setRange('s-gang','v-gang',Math.round(P.gAng*180/Math.PI));
  setRange('s-bleed','v-bleed',P.bleed); setRange('s-warp','v-warp',Math.round(P.warp*100));
  setRange('s-steps','v-steps',P.steps); setRange('s-cycle','v-cycle',P.cycle);
  /* 🔴 盤を読み込んでも色スウォッチだけ前の盤の色のままだった（2026-08-04 修正）。
     ⭐ P には入っているのに、input の見た目を合わせ直していなかった＝「反映してない」ように見える。 */
  document.getElementById('ink').value = rgb2hex(P.ink);
  document.getElementById('bg').value  = rgb2hex(P.bg);
  /* ⭐ 旧い盤は「直線／沿う」（gfollow）で保存されている＝形に読み替える（2026-08-12）。
     ⚠️ 読み替えないと、沿うで保存した盤が「流す」で開いて別物になる。 */
  if(b.gShape === undefined) P.gShape = (P.gfollow > 0.5) ? 4 : 0;
  P.gfollow = (P.gShape > 3.5) ? 1 : 0;
  document.querySelectorAll('#seg-gshape button').forEach(bt=>bt.classList.toggle('on', +bt.dataset.v === Math.round(P.gShape)));
  setRange('s-gcx','v-gcx',P.gCx==null?50:P.gCx); setRange('s-gcy','v-gcy',P.gCy==null?50:P.gCy);
  if(P.gCx==null) P.gCx=50; if(P.gCy==null) P.gCy=50;
  renderGStops();     // 旧い盤（gA/gB）はここで色列に読み替わる
  applyGradUI();
  applyModeUI();
}
async function loadBoard(id){
  const b = boards.find(x=>x.id===id); if(!b) return;
  curId = id; localStorage.setItem('nijimi.cur', id);
  applyBoardParams(b); bake();
  if(b.field){ restoreField(await blobToField(b.field)); } else { clearField(); }
  computeGradCoords(); refreshStat(); renderBoards();
}
async function newBoard(from){
  const id = 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  const n = boards.length + 1;
  const b = from
    ? { ...from, id, name: from.name + ' の複製', updatedAt: Date.now(), stamp: nowStamp() }
    : { id, name: '盤 ' + String(n).padStart(2,'0'), mode:'diff', P:JSON.parse(JSON.stringify(P)),
        seed, sources:[], field:null, thumb:null, updatedAt:Date.now(), stamp:nowStamp() };
  boards.push(b); await dbPut(b);
  curId = id; localStorage.setItem('nijimi.cur', id);
  /* ⚠️ 白紙で種をまいてはいけない（＝まっさらの意味が消える）。
     起動時に盤が1枚も無いとここが走るので、白紙で開いても全面が埋まっていた。 */
  if(!from){ clearField(); if(mode !== 'blank') seedField(); computeGradCoords(); saveSoon(); }
  else { await loadBoard(id); }
  renderBoards();
}
function renderBoards(){
  const list = document.getElementById('bd-list'); if(!list) return;
  boards.sort((a,b)=>b.updatedAt-a.updatedAt);
  list.innerHTML = '';
  boards.forEach(b=>{
    const el = document.createElement('button');
    el.className = 'bd-item' + (b.id===curId?' on':'');
    // ⚠️ 空の <img src=""> は環境によって壊れ画像が出る。絵が無い盤は枠だけ描く
    el.innerHTML = (b.thumb ? `<img class="bd-thumb" alt="" src="${b.thumb}">`
                            : `<span class="bd-thumb"></span>`)
      + `<span class="bd-meta"><span class="bd-name"></span>`
      + `<span class="bd-sub">${b.mode==='wave'?'干渉':'拡散'} · ${b.stamp||''}</span></span>`;
    el.querySelector('.bd-name').textContent = b.name;
    el.onclick = ()=>{ if(b.id!==curId) saveCur().then(()=>loadBoard(b.id)); };
    el.ondblclick = ()=>{ const v = prompt('盤の名前', b.name); if(v){ b.name=v; dbPut(b).then(renderBoards); } };
    list.appendChild(el);
  });
}
document.getElementById('b-boards').onclick = ()=>{
  const p = document.getElementById('boards');
  p.hidden = !p.hidden; if(!p.hidden){ saveCur(); renderBoards(); }
};
document.getElementById('bd-close').onclick = ()=>{ document.getElementById('boards').hidden = true; };
document.getElementById('bd-new').onclick = ()=> saveCur().then(()=>newBoard(null));
document.getElementById('bd-dup').onclick = async ()=>{ await saveCur();
  const b = boards.find(x=>x.id===curId); if(b) await newBoard(b); };
document.getElementById('bd-del').onclick = async ()=>{
  if(boards.length<=1){ alert('最後の1枚は消せません'); return; }
  const b = boards.find(x=>x.id===curId); if(!b) return;
  if(!confirm(`「${b.name}」を削除します。戻せません。`)) return;
  await dbDel(b.id); boards = boards.filter(x=>x.id!==b.id);
  await loadBoard(boards[0].id);
};
/* 閉じる直前にも書き込む（自動保存の待ち時間ぶんを取りこぼさない） */
addEventListener('visibilitychange', ()=>{ if(document.hidden) saveCur(); });
addEventListener('pagehide', ()=>{ saveCur(); });

async function initBoards(){
  try{
    db = await openDB(); boards = await dbAll();
    if(!boards.length){ await newBoard(null); }
    else {
      const want = localStorage.getItem('nijimi.cur');
      const pick = boards.find(x=>x.id===want) || boards.sort((a,b)=>b.updatedAt-a.updatedAt)[0];
      await loadBoard(pick.id);
    }
  }catch(e){
    console.warn('boards', e);
    document.getElementById('bd-note').textContent = 'このブラウザでは保存できません';
  }
  renderBoards();
}

if(gl && extCBF){ resize(); allocSim(); applyModeUI(); bake(); clearField(); genSources(); computeGradCoords(); refreshStat();
  running=true; loop(); initBoards(); }
/* 道具の明るさ（ライト／ダーク）。盤の地色（「地」のつまみ）とは別もの。
   ⚠️ NIJIMI は暗いのが既定＝DEF='dark'。HORI/KUMI/TSUBU とは向きが逆。 */
(function(){
  const KEY='nijimi_uitheme', DEF='dark';
  const apply = v => {
    document.body.classList.toggle('ui-light', v==='light');
    document.body.classList.toggle('ui-dark',  v==='dark');
    try{ localStorage.setItem(KEY, v); }catch(e){}
  };
  let cur = DEF;
  try{ cur = localStorage.getItem(KEY) || DEF; }catch(e){}
  apply(cur);
  document.getElementById('themeBtn')?.addEventListener('click', () => {
    cur = (cur==='light') ? 'dark' : 'light'; apply(cur);
  });
})();

/* ══════════════════════════════════════════════════════════════
   ⭐⭐ アニメーション ── 帯を流す（2026-08-12）
   木下＝「グラデーションの縦を流れるようなアニメーション。これはさっきの
          Sakuji の流れ・FPS のアニメーションと同じだね。別セクションでボタンをおすと流れていく」

   ⭐ 動かすのは【帯（色列）を引く位置】だけ。字の形も滲みも1つも変わらない。
      シェーダ側は gg / bt に uFlow を足して fract するだけ＝式を増やしていない。
   ⚠️ 流している間は帯を【環】に焼く（先頭を末尾へ足す）。
      環にしないと、色列の先頭と末尾が違うぶんだけ一周ごとに色が飛ぶ
      ＝SAKUJI で木下に「2秒間に1回角つきます」と言われた所と同じ型。
   ⚠️ 位相は保存しない＝開き直せば必ず元の見え方。書き出し（PNG / JSON）にも入らない。
   ══════════════════════════════════════════════════════════════ */
(function(){
  const btn = document.getElementById('b-flow');
  const sF  = document.getElementById('s-flow'), vF = document.getElementById('v-flow');
  const sP  = document.getElementById('s-ffps'), vP = document.getElementById('v-ffps');
  if(!btn || !sF || !sP) return;
  const NJF = { on:false, ph:0, last:0, raf:0, timer:0 };
  const sync = () => { if(vF) vF.textContent = sF.value; if(vP) vP.textContent = sP.value; };
  sF.addEventListener('input', sync); sP.addEventListener('input', sync); sync();

  const paint = () => { try{ display(null, cvs.width); }catch(e){} };
  function stop(){
    NJF.on = false; window.__njFlow = false; window.__njPh = 0;
    clearTimeout(NJF.timer); cancelAnimationFrame(NJF.raf);
    NJF.ph = 0;
    updateGradLUT(); updateBgLUT();          // ⭐ 環をやめて元の帯に戻す
    paint();
    btn.textContent = '流す';
  }
  function tick(){
    if(!NJF.on) return;
    const flow = +sF.value, fps = Math.max(4, +sP.value);
    /* ⭐ 進み方は【経過時間】で決める（コマが落ちても流れの速さは変わらない）。
       SAKUJI で同じ形にしてある。 */
    const now = performance.now();
    const dt = Math.min(0.25, (now - (NJF.last || now)) / 1000);
    NJF.last = now;
    NJF.ph = (NJF.ph + flow / 100 * 0.6 * dt) % 1;
    window.__njPh = NJF.ph;
    paint();
    NJF.timer = setTimeout(() => { NJF.raf = requestAnimationFrame(tick); }, 1000 / fps);
  }
  btn.addEventListener('click', () => {
    if(NJF.on){ stop(); return; }
    NJF.on = true; NJF.ph = 0; NJF.last = 0;
    window.__njFlow = true; window.__njPh = 0;
    updateGradLUT(); updateBgLUT();          // ⭐ 環に焼き直す＝一周しても色が飛ばない
    btn.textContent = '止める';
    tick();
  });
})();

/* ══════════════════════════════════════════════════════════════
   ⭐⭐ 動画で出す ── 古い REC の置き換え（2026-08-13・5つ目）

   ⭐ 帯の位相（`__njPh`）は 0→1 でちょうど一周し、流している間は帯を【環】に焼いてある。
      ＝整数周ぶんで撮れば、頭と尻が数値レベルで一致する【継ぎ目のないループ】。
   ⭐ 位相は「i ÷ 総コマ数」で刻む＝時計を見ないので、機械が遅くてもコマは1枚も落ちない。
   ⭐ 絵は `exportPNG` と同じ道＝オフスクリーンの FBO に【任意の大きさ】で焼く。
      ＝画面のドットを録っていた古い REC と違い、窓の大きさに縛られない。
   ⚠️ 撮るのは【帯の流れ】だけ。「育つ」は反応拡散が場そのものを進める＝位相では戻せないので、
      これまでどおり画面で見るもの（撮ると頭と尻が合わない）。
   ⚠️ この道具は【正方形】（`display` は一辺しか取らない）＝出るのも正方形。
   ══════════════════════════════════════════════════════════════ */
(function(){
  const goBtn = document.getElementById('tvGo');
  if(!goBtn) return;
  const seg = (id, dflt) => { const b = document.querySelector('#'+id+' button.on'); return b ? b.dataset.v : dflt; };
  document.querySelectorAll('#tvFmt button, #tvQ button, #tvLoop button, #tvSz button').forEach(b =>
    b.addEventListener('click', () => {
      b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      syncUI(); sizeSync();
    }));
  const pxRow = document.getElementById('tvPxRow'), pxEl = document.getElementById('tvPx');
  function syncUI(){ if(pxRow) pxRow.style.display = (seg('tvSz','1080') === 'px') ? '' : 'none'; }
  pxEl?.addEventListener('input', () => sizeSync());

  function side(){
    const v = seg('tvSz','1080');
    const n = (v === 'px') ? (+pxEl?.value || 1080) : +v;
    return Math.max(64, Math.min(4096, Math.round(n)));
  }
  function plan(){
    const sF = document.getElementById('s-flow'), sP = document.getElementById('s-ffps');
    const flow = +(sF?.value || 60), fps = Math.max(4, +(sP?.value || 30));
    const spd = flow / 100 * 0.6;                       // 1秒あたりに進む「周」（tick と同じ式）
    if(spd <= 0) return { err:'「流れ」が 0 なので何も動きません' };
    const loops = +seg('tvLoop','1') || 1;
    const sec = loops / spd;
    return { fps, loops, sec, total: Math.max(2, Math.round(sec * fps)) };
  }
  /* ⭐ 出る大きさは【押す前に】必ず出す。⚠️ H.264 の上限＝辺4096・マクロブロック36864。 */
  function sizeSync(){
    const el = document.getElementById('tvSize'); if(!el) return;
    let R = side();
    const isMp4 = seg('tvFmt','mp4') === 'mp4';
    if(isMp4) R -= R % 2;
    const mb = Math.ceil(R/16) * Math.ceil(R/16);
    const ok = mb <= 36864 && R <= 4096;                 // 正方形なら 3072 まで
    const p = plan();
    el.innerHTML = '出力 <b>' + R + ' × ' + R + '</b> px'
      + (isMp4 && !ok ? '<br>⚠️ mp4 の上限超え（正方形は 3072px まで）' : '')
      + (p.err ? '<br>⚠️ ' + p.err
          : '<br>' + p.total + ' コマ・' + p.sec.toFixed(1) + '秒・' + p.fps + 'fps・' + p.loops + '周');
  }

  /* ══ ZIP（圧縮なし＝store）══ */
  let CRCT = null;
  function crc32(u8){
    if(!CRCT){ CRCT = new Uint32Array(256);
      for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); CRCT[n]=c>>>0; } }
    let c = 0xFFFFFFFF;
    for(let i=0;i<u8.length;i++) c = CRCT[(c ^ u8[i]) & 0xFF] ^ (c>>>8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  function zip(files){
    const te = new TextEncoder(), parts = [], cent = [];
    let off = 0;
    for(const f of files){
      const nm = te.encode(f.name), crc = crc32(f.data), sz = f.data.length;
      const L = new DataView(new ArrayBuffer(30));
      L.setUint32(0,0x04034b50,true); L.setUint16(4,20,true);
      L.setUint32(14,crc,true); L.setUint32(18,sz,true); L.setUint32(22,sz,true);
      L.setUint16(26,nm.length,true);
      parts.push(new Uint8Array(L.buffer), nm, f.data);
      const C = new DataView(new ArrayBuffer(46));
      C.setUint32(0,0x02014b50,true); C.setUint16(4,20,true); C.setUint16(6,20,true);
      C.setUint32(16,crc,true); C.setUint32(20,sz,true); C.setUint32(24,sz,true);
      C.setUint16(28,nm.length,true); C.setUint32(42,off,true);
      cent.push(new Uint8Array(C.buffer), nm);
      off += 30 + nm.length + sz;
    }
    let csz = 0; for(const c of cent) csz += c.length;
    const E = new DataView(new ArrayBuffer(22));
    E.setUint32(0,0x06054b50,true);
    E.setUint16(8,files.length,true); E.setUint16(10,files.length,true);
    E.setUint32(12,csz,true); E.setUint32(16,off,true);
    return new Blob(parts.concat(cent, [new Uint8Array(E.buffer)]), { type:'application/zip' });
  }
  /* ⭐ mp4 の器は押したときだけ取りに行く（この道具は外の部品を1つも使っていない） */
  let muxP = null;
  function loadMuxer(){
    if(window.Mp4Muxer) return Promise.resolve(true);
    if(!muxP) muxP = new Promise(res => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.1/build/mp4-muxer.min.js';
      s.onload = () => res(!!window.Mp4Muxer); s.onerror = () => res(false);
      document.head.appendChild(s);
    });
    return muxP;
  }
  const QB = { hi:0.30, mid:0.15, lo:0.06 };
  async function pickCodec(R, fps, bitrate){
    const cands = ['avc1.640034','avc1.640033','avc1.640032','avc1.64002a','avc1.640028','avc1.4d0034','avc1.42003c'];
    for(const codec of cands){
      try{ const s = await VideoEncoder.isConfigSupported({ codec, width:R, height:R, bitrate, framerate:fps });
        if(s && s.supported) return s.config; }catch(_){}
    }
    return null;
  }
  const idle = () => new Promise(r => setTimeout(r, 0));
  function dl(blob, name){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 8000);
  }

  async function run(){
    if(TV.on){ TV.stop = true; return; }
    const p = plan();
    const el = document.getElementById('tvSize');
    const say = t => { if(el) el.innerHTML = t; };
    if(p.err){ say('🔴 ' + p.err); return; }

    let fmt = seg('tvFmt','mp4');
    const q = seg('tvQ','mid');
    let R = side();
    if(fmt === 'mp4') R -= R % 2;
    R = Math.max(2, R);

    /* ⚠️ 画面で流していたら止める（位相を取り合わないため）。stop() は閉じの中なので押して止める。 */
    const flowBtn = document.getElementById('b-flow');
    const wasFlowing = !!window.__njFlow;
    if(wasFlowing) flowBtn?.click();

    const keepPh = window.__njPh || 0, keepFlow = !!window.__njFlow;
    TV.on = true; TV.stop = false;
    goBtn.textContent = 'やめる';
    let msg = '', ef = null, et = null, tmpF = null, tmpT = null;
    try{
      /* ⭐ 帯を【環】に焼く＝一周しても色が飛ばない（画面の「流す」と同じ下ごしらえ） */
      window.__njFlow = true;
      updateGradLUT(); updateBgLUT();

      /* ⭐ 焼き先＝exportPNG と同じ作り。⚠️ 1回だけ作って使い回す（毎コマ作ると GPU が詰まる） */
      let fieldTex = curTex();
      if(mode === 'wave'){
        /* ⚠️ 干渉の場は時刻で変わる。撮る間は【1枚に止めて】帯だけ流す＝そうしないと頭と尻が合わない。 */
        tmpT = tex(R); tmpF = fbo(tmpT); computeWave(performance.now(), tmpF, R); fieldTex = tmpT;
      }
      et = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, et);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, R, R, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
      ef = fbo(et);

      const px = new Uint8Array(R*R*4);
      const out = document.createElement('canvas'); out.width = R; out.height = R;
      const octx = out.getContext('2d');
      const img = octx.createImageData(R, R);

      let enc = null, muxer = null, target = null, encErr = null, why = '';
      if(fmt === 'mp4'){
        const bitrate = Math.min(80e6, Math.round(R * R * p.fps * (QB[q] || 0.15)));
        const have = (typeof VideoEncoder !== 'undefined') ? await loadMuxer() : false;
        const cfg = have ? await pickCodec(R, p.fps, bitrate) : null;
        if(cfg){
          target = new Mp4Muxer.ArrayBufferTarget();
          muxer = new Mp4Muxer.Muxer({ target,
            video:{ codec:'avc', width:R, height:R, frameRate:Math.max(1, Math.round(p.fps)) },
            fastStart:'in-memory' });
          enc = new VideoEncoder({
            output:(c,m)=>{ try{ muxer.addVideoChunk(c,m); }catch(e){ encErr = e; } },
            error: e => { encErr = e; } });
          enc.configure(cfg);
        }else{
          /* 🔴 黙って別のものにしない。理由を言って PNG連番へ回す。 */
          why = (typeof VideoEncoder === 'undefined') ? 'このブラウザは mp4 を作れない'
              : !have ? 'mp4 の器を取りに行けなかった（つながっていない）'
              : ('この大きさ（' + R + '×' + R + '）は mp4 の上限を超えている（正方形は 3072px まで）');
          fmt = 'png';
        }
      }
      const shots = [], pad = i => String(i).padStart(4,'0');
      let bytes = 0, i = 0;

      for(; i < p.total; i++){
        if(TV.stop) break;
        if(encErr) throw encErr;
        window.__njPh = (i / p.total * p.loops) % 1;     // ⭐ 時計ではなくコマ番号
        display(ef, R, fieldTex);
        gl.readPixels(0, 0, R, R, gl.RGBA, gl.UNSIGNED_BYTE, px);
        /* ⚠️ WebGL の y は下から数える。drawImage/PNG は上から＝行を入れ替える（exportPNG と同じ） */
        for(let y=0; y<R; y++){ const s=(R-1-y)*R*4, d=y*R*4; img.data.set(px.subarray(s,s+R*4), d); }
        octx.putImageData(img, 0, 0);
        if(fmt === 'mp4'){
          const vf = new VideoFrame(out, { timestamp:Math.round(i*1e6/p.fps), duration:Math.round(1e6/p.fps) });
          enc.encode(vf, { keyFrame:(i % (p.fps*2)) === 0 });
          vf.close();
          while(enc.encodeQueueSize > 8 && !encErr) await idle();
        }else{
          const b = await new Promise(r => out.toBlob(r, 'image/png'));
          if(!b) throw new Error('PNG が作れなかった（大きすぎる可能性）');
          const u8 = new Uint8Array(await b.arrayBuffer());
          bytes += u8.length;
          shots.push({ name:'nijimi_'+pad(i)+'.png', data:u8 });
          if(bytes > 1.5e9) throw new Error('PNG連番が大きすぎます（'+Math.round(bytes/1e6)+'MB）— 周か大きさを下げてください');
        }
        if((i % 3) === 0 || i === p.total - 1){
          say('書き出し中 <b>'+(i+1)+' / '+p.total+'</b> コマ　'+R+' × '+R
              + (fmt === 'png' ? '（'+Math.round(bytes/1e6)+'MB）' : '')
              + '<br>「やめる」で止められます');
        }
        await idle();                                    // ⚠️ 画面を返す（進み具合と「やめる」のため）
      }
      const shot = i;

      if(fmt === 'mp4'){
        await enc.flush();
        if(encErr) throw encErr;
        muxer.finalize(); enc.close();
        if(shot > 1){
          const blob = new Blob([target.buffer], { type:'video/mp4' });
          dl(blob, 'nijimi_'+P.mode+'_'+Date.now()+'.mp4');
          msg = 'mp4 — '+R+' × '+R+'・'+shot+'コマ・'+(shot/p.fps).toFixed(1)+'秒・'
              + Math.round(blob.size/1e6)+'MB' + (TV.stop ? '（途中で止めた）' : '・継ぎ目なしループ');
        }
      }else if(shots.length){
        const blob = zip(shots);
        dl(blob, 'nijimi_'+P.mode+'_'+Date.now()+'_seq.zip');
        msg = (why ? '⚠️ mp4 にできず PNG連番にしました — '+why+'／' : '')
            + 'PNG連番 — '+R+' × '+R+'・'+shots.length+'枚・'
            + Math.round(blob.size/1e6)+'MB（'+p.fps+'fps で束ねてください）';
      }
      if(shot <= 1) msg = '止めました（1コマも出していません）';
    }catch(err){
      msg = '🔴 ' + (err && err.message || err);          // 🔴 何が起きても必ず理由を出す
    }finally{
      /* 🔴 何が起きても必ず片づける（GPU の資源も、帯も、位相も） */
      try{ if(ef) gl.deleteFramebuffer(ef); if(et) gl.deleteTexture(et); }catch(_){}
      try{ if(tmpF) gl.deleteFramebuffer(tmpF); if(tmpT) gl.deleteTexture(tmpT); }catch(_){}
      window.__njFlow = keepFlow; window.__njPh = keepPh;
      updateGradLUT(); updateBgLUT();                     // ⭐ 環をやめて元の帯へ戻す
      TV.on = false; TV.stop = false;
      goBtn.textContent = '動画';
      try{ display(null, cvs.width); }catch(_){}
      sizeSync();
      if(msg) setTimeout(() => say(msg), 30);
      if(wasFlowing) flowBtn?.click();                    // ⭐ 画面で流していたなら戻す
    }
  }
  goBtn.addEventListener('click', () => run());
  /* 🔴 最初の1回はここ（かたまりの最後）で呼ぶ。上で呼ぶと、まだ宣言していないものに
     触って TDZ で止まり、この下の登録が丸ごと走らなくなる（TSUBU で実際に踏んだ）。 */
  syncUI(); sizeSync();
})();
</script>

<!-- ══════════════════════════════════════════════════════════════
     モバイルの保存 ── 2026-08-15
     🔴 木下＝「アンドロイドモバイルで試したら、ほぼ png ダウンロードなどもできなかった」
     ⚠️ 原因になりやすい作り＝<a download> に blob: を渡す形。
        iOS Safari は保存せず開くだけ／Android は click 直後に remove すると中断される。
     ⭐ 触る端末のときだけ【端末の共有シート】へファイルを渡す。無ければ今までどおり落とす。
     🔴🔴 PC は最初の1行で必ず素通りする（pointer:coarse かつ hover が無いときだけ通る）
          ＝マウスの端末の挙動は1バイトも変えない。
     ⚠️ 共有を断られた／使えないときは、元の click をそのまま呼ぶ＝今までの動きに戻るだけ。
     ⭐ 消せば完全に元へ戻る（このブロックだけ）。
     ══════════════════════════════════════════════════════════════ -->
<script>
(function(){
  var touchOnly = window.matchMedia
    && matchMedia('(pointer:coarse)').matches && !matchMedia('(hover:hover)').matches;
  if(!touchOnly) return;                       /* 🔴 PC はここで終わり */
  if(!window.HTMLAnchorElement) return;
  var orig = HTMLAnchorElement.prototype.click;
  HTMLAnchorElement.prototype.click = function(){
    var href = this.getAttribute('href') || '';
    var name = this.getAttribute('download');
    /* 落とすためのアンカー（blob: ＋ download）以外はそのまま */
    if(!name || href.slice(0,5) !== 'blob:' || this.dataset.plainSave)
      return orig.apply(this, arguments);
    var self = this, args = arguments;
    var plain = function(){                    /* ⚠️ 今までの動きに戻す（すぐ消さない） */
      try{
        var a = document.createElement('a');
        a.href = href; a.download = name; a.dataset.plainSave = '1';
        document.body.appendChild(a);
        orig.apply(a, []);
        setTimeout(function(){ if(a.parentNode) a.remove(); }, 20000);
      }catch(_){ try{ orig.apply(self, args); }catch(__){} }
    };
    /* ⚠️ blob: は道具側が数秒で捨てるので【すぐ】中身を取っておく */
    fetch(href).then(function(r){ return r.blob(); }).then(function(b){
      var f;
      try{ f = new File([b], name, { type: b.type || 'application/octet-stream' }); }
      catch(_){ return plain(); }
      if(navigator.share && navigator.canShare && navigator.canShare({ files:[f] })){
        return navigator.share({ files:[f], title:name })
          .catch(function(err){ if(!(err && err.name === 'AbortError')) plain(); });
      }
      plain();
    }).catch(plain);
    return undefined;
  };
})();
</script>
</body>
