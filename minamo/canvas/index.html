<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
<meta name="robots" content="noindex,follow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MINAMO — calm your tabs</title>
  <link rel="icon" href="../icons/icon128.png" />
  <link rel="stylesheet" href="canvas.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand__mark">
        <svg class="brand__logo" viewBox="0 0 40 24" aria-hidden="true">
          <g fill="currentColor">
            <path d="M0,15 L5,7 L10,15 Z M8,15 L15,2 L22,15 Z M19,15 L24,8 L29,15 Z M27,15 L33,5 L39,15 Z"/>
            <path opacity=".26" d="M0,15 L5,22 L10,15 Z M8,15 L15,24 L22,15 Z M19,15 L24,21 L29,15 Z M27,15 L33,23 L39,15 Z"/>
          </g>
        </svg>
        <span>MINAMO</span>
      </span>
      <span class="brand__tag">calm your tabs</span>
    </div>

    <label class="search">
      <span class="search__icon">⌕</span>
      <input id="search" type="search" placeholder="Search tabs…" autocomplete="off" spellcheck="false" />
      <kbd>/</kbd>
    </label>

    <div class="stats">
      <div class="stat"><b id="stat-tabs">0</b><span>tabs</span></div>
      <div class="stat"><b id="stat-islands">0</b><span>islands</span></div>
      <div class="stat stat--stale" id="stale-row"><b id="stat-stale">0</b><span>stale</span></div>
    </div>

    <div class="controls">
      <button id="btn-merge" class="iconbtn iconbtn--text hidden" title="Merge all windows into this one">⤿ Merge all</button>
      <button id="btn-view" class="iconbtn" title="View" aria-label="Switch view">☰</button>
      <button id="btn-full" class="iconbtn" title="Open full view ↗" aria-label="Open full view">⤢</button>
      <button id="btn-settings" class="iconbtn" title="Settings" aria-label="Settings">⚙</button>
    </div>
  </header>

  <main id="islands"></main>

  <script type="module" src="canvas.js"></script>
</body>
</html>
