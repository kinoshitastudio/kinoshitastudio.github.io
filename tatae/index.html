<!-- 2026-11-18 木下：「白黒でも粒としての表現で、シンプルなフォントに」を探す中で、参考（液体の字が枠を埋める・黒地に灰2色・大小の枠）を
     Python で試した → 「丸ゴ・うねり弱」を改良 → ほかの字・色違い・xtianmiller のように字で紙を埋める →「これ道具ないよね？」「作ろう」。
     仕組み（Python 版 make_ekitai_kana_kairyo.py と同じ順）：
       1. 字を書体で描き、外接枠を切り出して、枠（セル）の縦横いっぱいに伸ばす
       2. 太らせる（ぼかして低いしきい値で切る＝角が出ない太らせ）
       3. うねらせる（ゆっくり変わる揺れで座標をずらす）
       4. なめらかにする（ぼかして 0.5 で切る）
       5. 縁をたどって輪郭にし、角を丸めて線にする（画面・PNG・SVG は同じ輪郭から描く）
     字の形は書体から取る。道具が持つのは「満たし方（太さ・うねり・なめらかさ）」と「割り方・向き・色」だけ。 -->

  <p class="lead" style="margin-top:12px">字は書体から描き、枠の縦横いっぱいに伸ばしてから、太らせ・うねらせ・なめらかにする。太らせると字の中の空きが小さな穴になり、うねらせると液体のような形になる。画数の多い漢字は泥の塊になりやすい＝かな・カタカナ向き。この道具の SVG は読むと字と設定に戻る。ほかの SVG は形として枠に足す（字と同じように満たす）。</p>

<script>
const $=id=>document.getElementById(id);
const K=['tilt','gap','margin','bias','fat','wob','per','smooth'];
const TXT=['txt','mode','ratio','turn','font','c0','c1','c2','c2rule','paper'];
const RATIO={'4:5':[2000,2500],'2:3':[2000,3000],'1:1':[2400,2400],'3:2':[3000,2000],'2:1':[3200,1600]};
const FONTS={maru:['"Hiragino Maru Gothic ProN","Zen Maru Gothic"',500],kaku:['"Zen Kaku Gothic New"',900]};
const WR=0.5;                      // 形を作る細かさ（紙の 1px あたり）＝輪郭を作ってから拡大して描く
const cv=$('cv'),ctx=cv.getContext('2d');
let BW=2000,BH=2500,Q=0.4,SEED=7,EXTRA=[],LAST=[];
const v=id=>+$(id).value;
const mkR=s=>{let a=(s>>>0)||1;return()=>{a=(a*1664525+1013904223)>>>0;return a/4294967296}};

// ── 1つの枠の字の形（作った輪郭は覚えておく）
const CACHE=new Map();
function boxBlur(src,w,h,r){if(r<1)return src;let a=src,b=new Float32Array(w*h);
  for(let pass=0;pass<3;pass++){
    for(let y=0;y<h;y++){let acc=0;const o=y*w;for(let i=-r;i<=r;i++)acc+=a[o+Math.min(w-1,Math.max(0,i))];
      for(let x=0;x<w;x++){b[o+x]=acc/(2*r+1);acc+=a[o+Math.min(w-1,x+r+1)]-a[o+Math.max(0,x-r)]}}
    for(let x=0;x<w;x++){let acc=0;for(let i=-r;i<=r;i++)acc+=b[Math.min(h-1,Math.max(0,i))*w+x];
      for(let y=0;y<h;y++){a===src&&(a=new Float32Array(w*h));a[y*w+x]=acc/(2*r+1);acc+=b[Math.min(h-1,y+r+1)*w+x]-b[Math.max(0,y-r)*w+x]}}}
  return a}
function sourceMask(src){   // 字（または読んだ SVG の絵）を描いて、外接枠で切り出す
  const S=720,c=document.createElement('canvas');c.width=c.height=S;const g=c.getContext('2d',{willReadFrequently:true});
  g.fillStyle='#000';
  if(typeof src==='string'){const [fam,w]=FONTS[$('font').value];g.font=`${w} ${S*0.8}px ${fam},sans-serif`;g.textAlign='center';g.textBaseline='middle';g.fillText(src,S/2,S/2+S*0.03)}
  else{const im=src.img,w=im.naturalWidth||im.width||S,h=im.naturalHeight||im.height||S,s=S*0.9/Math.max(w,h);g.drawImage(im,(S-w*s)/2,(S-h*s)/2,w*s,h*s)}
  const d=g.getImageData(0,0,S,S).data;let x0=S,y0=S,x1=-1,y1=-1;
  for(let y=0;y<S;y++)for(let x=0;x<S;x++)if(d[(y*S+x)*4+3]>127){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  if(x1<0)return null;return {c,x0,y0,w:x1-x0+1,h:y1-y0+1}}
// 2026-11-18 木下「道具での出来とあなたが作った画像の出来が違う」→ Python 版（make_ekitai_kana_kairyo.py）と同じ計算に揃えた：
//   太らせ＝ひし形に1画素ずつ広げる（scipy の binary_dilation と同じ）／うねり＝白色雑音をガウスでぼかした揺れ・最大で割って量をそろえる
//   なめらか＝2倍に広げてからぼかして 0.5 で切る。つまみの値は Python の数字の100倍（太さ5＝0.05）
function normals(R,n){const a=new Float32Array(n);for(let i=0;i<n;i+=2){const u=Math.max(1e-12,R()),t=R(),q=Math.sqrt(-2*Math.log(u));a[i]=q*Math.cos(2*Math.PI*t);if(i+1<n)a[i+1]=q*Math.sin(2*Math.PI*t)}return a}
function dilateL1(on,w,h,r){const d=new Float32Array(w*h);for(let i=0;i<w*h;i++)d[i]=on[i]?0:1e9;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;let q=d[i];if(x>0&&d[i-1]+1<q)q=d[i-1]+1;if(y>0&&d[i-w]+1<q)q=d[i-w]+1;d[i]=q}
  for(let y=h-1;y>=0;y--)for(let x=w-1;x>=0;x--){const i=y*w+x;let q=d[i];if(x<w-1&&d[i+1]+1<q)q=d[i+1]+1;if(y<h-1&&d[i+w]+1<q)q=d[i+w]+1;d[i]=q}
  const o=new Uint8Array(w*h);for(let i=0;i<w*h;i++)o[i]=d[i]<=r?1:0;return o}
function bilinear(m,w,h,x,y){x=Math.min(w-1,Math.max(0,x));y=Math.min(h-1,Math.max(0,y));const ix=Math.floor(x),iy=Math.floor(y),tx=x-ix,ty=y-iy,ix1=Math.min(w-1,ix+1),iy1=Math.min(h-1,iy+1);
  return (m[iy*w+ix]*(1-tx)+m[iy*w+ix1]*tx)*(1-ty)+(m[iy1*w+ix]*(1-tx)+m[iy1*w+ix1]*tx)*ty}
function shape(src,key,gw,gh,seed){
  // gw,gh＝枠の大きさ（紙の px）。返すのは枠の左上を 0,0 とする輪郭（紙の px）
  const P=[v('fat'),v('wob'),v('per'),v('smooth'),$('font').value].join(','), k=key+'|'+Math.round(gw)+'x'+Math.round(gh)+'|'+P+'|'+seed;
  if(CACHE.has(k))return CACHE.get(k);
  const w=Math.max(8,Math.round(gw*WR)),h=Math.max(8,Math.round(gh*WR)),s=Math.min(w,h);
  const sm=sourceMask(src);if(!sm){CACHE.set(k,[]);return []}
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d',{willReadFrequently:true});
  // 1. 枠の縦横いっぱいに伸ばす
  // 2026-11-19 木下「伸ばし棒がこんなに分厚くなる」＝ー・一・～のような細長い字は、細い向きまで枠いっぱいに伸ばすと四角い塊になる。
  //   外接枠が3:1より細長い字だけ、細い向きは「ふつうの字の高さ（字の大きさの0.85）に対する線の太さ」の割合で枠に置く
  //   ＝となりの字の横画を伸ばしたときと同じ太さの帯になる（Python 版の「ー＝帯」と同じ考え）。真ん中に置く
  let dx=0,dy=0,dw=w,dh=h;const ar=sm.w/sm.h,EM=sm.c.width*0.8*0.85;
  if(ar>3){dh=Math.min(h,h*sm.h/EM);dy=(h-dh)/2}
  else if(ar<1/3){dw=Math.min(w,w*sm.w/EM);dx=(w-dw)/2}
  g.imageSmoothingQuality='high';g.drawImage(sm.c,sm.x0,sm.y0,sm.w,sm.h,dx,dy,dw,dh);
  const d=g.getImageData(0,0,w,h).data;let on=new Uint8Array(w*h);for(let i=0;i<w*h;i++)on[i]=d[i*4+3]>127?1:0;
  // 2. 太らせる（ひし形に r 画素）
  const r=Math.floor(s*v('fat')/100);if(r>0)on=dilateL1(on,w,h,r);
  let m=new Float32Array(w*h);for(let i=0;i<w*h;i++)m[i]=on[i];
  // 3. うねらせる（白色雑音をぼかした揺れ・最大で割って量をそろえる）
  const wob=v('wob')/100;
  if(wob>0){const R=mkR(seed*7919+101),sg=Math.max(1,Math.round(s*v('per')/100));
    const DX=boxBlur(normals(R,w*h),w,h,sg),DY=boxBlur(normals(R,w*h),w,h,sg);let mx=1e-9;for(let i=0;i<w*h;i++){const a=Math.abs(DX[i]);if(a>mx)mx=a}
    const kk=s*wob/mx,o=new Float32Array(w*h);
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;o[i]=bilinear(m,w,h,x+DX[i]*kk,y+DY[i]*kk)}
    m=o}
  // 4. なめらかに（2倍に広げてからぼかして 0.5 で切る）
  const W2=w*2,H2=h*2;let u=new Float32Array(W2*H2);for(let y=0;y<H2;y++)for(let x=0;x<W2;x++)u[y*W2+x]=bilinear(m,w,h,(x+.5)/2-.5,(y+.5)/2-.5);
  const sr=Math.round(2*s*v('smooth')/100);if(sr>0)u=boxBlur(u,W2,H2,sr);
  // 5. 縁をたどる（外側に1画素の空きを足して、枠の縁でも輪が閉じるように）
  const N=W2+2,M=H2+2,bin=new Uint8Array(N*M);for(let y=0;y<H2;y++)for(let x=0;x<W2;x++)if(u[y*W2+x]>0.5)bin[(y+1)*N+x+1]=1;
  const loops=trace(bin,N,M).map(L=>rounded(simplify(L,0.7))).filter(L=>L.length>=3).map(L=>L.map(([x,y])=>[(x-1)/W2*gw,(y-1)/H2*gh]));
  CACHE.set(k,loops);if(CACHE.size>600)CACHE.delete(CACHE.keys().next().value);return loops}
function trace(on,N,M){
  const nxt=new Map(),key=(x,y)=>y*(N+1)+x;
  const add=(x1,y1,x2,y2)=>{const k=key(x1,y1);let a=nxt.get(k);if(!a)nxt.set(k,a=[]);a.push([x2,y2])};
  for(let y=1;y<M-1;y++)for(let x=1;x<N-1;x++){if(!on[y*N+x])continue;
    if(!on[(y-1)*N+x])add(x,y,x+1,y);if(!on[y*N+x+1])add(x+1,y,x+1,y+1);
    if(!on[(y+1)*N+x])add(x+1,y+1,x,y+1);if(!on[y*N+x-1])add(x,y+1,x,y)}
  const loops=[];
  for(const [k0,arr] of nxt){while(arr.length){const L=[[k0%(N+1),Math.floor(k0/(N+1))]];let [nx,ny]=arr.pop(),guard=0;
    while(guard++<400000){L.push([nx,ny]);const a=nxt.get(key(nx,ny));if(!a||!a.length)break;[nx,ny]=a.pop();if(nx===L[0][0]&&ny===L[0][1])break}
    if(L.length>6)loops.push(L)}}
  return loops}
function simplify(P,eps){if(P.length<5)return P;
  const d2=(p,a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1],L=dx*dx+dy*dy||1e-9;let t=((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L;t=Math.max(0,Math.min(1,t));const x=a[0]+t*dx-p[0],y=a[1]+t*dy-p[1];return x*x+y*y};
  const rec=(Q,s,e,out)=>{let mx=-1,mi=-1;for(let i=s+1;i<e;i++){const d=d2(Q[i],Q[s],Q[e]);if(d>mx){mx=d;mi=i}}if(mx>eps*eps){rec(Q,s,mi,out);rec(Q,mi,e,out)}else out.push(Q[s])};
  const h=P.length>>1,A=P.slice(0,h+1),B=P.slice(h).concat([P[0]]),o1=[],o2=[];rec(A,0,A.length-1,o1);rec(B,0,B.length-1,o2);return o1.concat(o2)}
function rounded(P){   // 角を丸める（Chaikin 2回）＝画素の階段を消す
  for(let it=0;it<2;it++){const o=[];for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length];o.push([a[0]*.75+b[0]*.25,a[1]*.75+b[1]*.25],[a[0]*.25+b[0]*.75,a[1]*.25+b[1]*.75])}P=o}return P}

// ── 割る
function cells(){
  const R=mkR(SEED*104729+7),m=v('margin')/1000*BW,bias=v('bias')/100;
  const lines=$('txt').value.split('\n').map(l=>[...l]).filter(l=>l.length);
  const items=[];lines.forEach(l=>l.forEach(ch=>items.push(ch)));EXTRA.forEach((e,i)=>items.push({img:e.img,id:'svg'+i}));
  let rects=[];
  if($('mode').value==='rows'&&!EXTRA.length){
    const wts=lines.map(l=>1/l.length),sum=wts.reduce((a,b)=>a+b,0);let y=m;
    lines.forEach((l,i)=>{const hh=(BH-2*m)*wts[i]/sum,ww=(BW-2*m)/l.length;l.forEach((ch,j)=>rects.push([m+j*ww,y,ww,hh]));y+=hh})}
  else{
    rects=[[m,m,BW-2*m,BH-2*m]];
    while(rects.length<items.length){rects.sort((a,b)=>a[2]*a[3]-b[2]*b[3]);const [x,y,w,h]=rects.pop(),t=0.5+(R()*2-1)*bias;
      if(w>h)rects.push([x,y,w*t,h],[x+w*t,y,w*(1-t),h]);else rects.push([x,y,w,h*t],[x,y+h*t,w,h*(1-t)])}
    rects.sort((a,b)=>Math.round(a[1]/(BH*0.08))-Math.round(b[1]/(BH*0.08))||a[0]-b[0])}
  const gap=v('gap')/1000*BW,turn=+$('turn').value,tilt=v('tilt');
  const areas=rects.map(r=>r[2]*r[3]),mean=areas.reduce((a,b)=>a+b,0)/Math.max(1,areas.length);
  return items.map((it,i)=>{const [x,y,w,h]=rects[i];const w2=Math.max(4,w-gap),h2=Math.max(4,h-gap);
    let rot=0;if(turn){const r=R();rot=turn===2?(r<0.25?0:r<0.62?90:-90):(r<0.5?0:r<0.75?90:-90)}
    const ang=rot+(tilt?(R()*2-1)*tilt:0);
    const blank=typeof it==='string'&&!it.trim();
    return {src:it,key:typeof it==='string'?it:it.id,blank,cx:x+w/2,cy:y+h/2,gw:rot?h2:w2,gh:rot?w2:h2,ang,big:areas[i]>mean*1.05,i,seed:SEED*31+i}})}
function colorOf(c,k){const r=$('c2rule').value;const two=r==='big'?c.big:r==='first'?k===0:r==='alt'?k%2===1:false;return two?$('c2').value:$('c1').value}
function build(){const cs=cells();let k=0;cs.forEach(c=>{c.loops=c.blank?[]:shape(c.src,c.key,c.gw,c.gh,c.seed);if(!c.blank){c.col=colorOf(c,k);k++}});return cs}
function pathOf(c){const p=new Path2D();c.loops.forEach(L=>{L.forEach(([x,y],i)=>i?p.lineTo(x,y):p.moveTo(x,y));p.closePath()});return p}
function draw(g,cs,q){g.setTransform(q,0,0,q,0,0);g.clearRect(0,0,BW,BH);
  if($('paper').value==='on'){g.fillStyle=$('c0').value;g.fillRect(0,0,BW,BH)}
  cs.forEach(c=>{if(c.blank)return;g.save();g.translate(c.cx,c.cy);g.rotate(c.ang*Math.PI/180);g.translate(-c.gw/2,-c.gh/2);g.fillStyle=c.col;g.fill(pathOf(c),'evenodd');g.restore()})}
function fitQ(){const st=$('stage');const mw=Math.max(200,st.clientWidth-48),mh=Math.max(200,(innerWidth<=760?innerHeight*0.52:innerHeight-48));
  Q=Math.min(mw/BW,mh/BH,1)*(devicePixelRatio>1?2:1)}
let raf=0;
function render(){cancelAnimationFrame(raf);$('busy').textContent='…';raf=requestAnimationFrame(()=>{
  [BW,BH]=RATIO[$('ratio').value];fitQ();cv.width=Math.round(BW*Q);cv.height=Math.round(BH*Q);
  LAST=build();draw(ctx,LAST,Q);$('busy').textContent='';
  K.forEach(k=>{const s=$(k).parentElement.querySelector('.v');if(s)s.textContent=$(k).value})})}
K.forEach(k=>$(k).oninput=render);TXT.forEach(k=>$(k).oninput=render);
$('reroll').onclick=()=>{SEED=(SEED*48271+11)%99991||7;render()};

const PRESETS=[
  {name:'参考の組み（段）',txt:'あいうえ\n　お\nつぶ',mode:'rows',ratio:'4:5',turn:'0',k:{tilt:0,gap:0,margin:36,bias:12,fat:5,wob:6,per:20,smooth:3},pal:0,seed:7},
  {name:'しずけさ＋みずうみ',txt:'しずけさ\nみず\nうみ',mode:'rows',ratio:'4:5',turn:'0',k:{tilt:0,gap:0,margin:36,bias:12,fat:5,wob:6,per:20,smooth:3},pal:5,seed:7},

  {name:'ことばのつぶ（割る・回す）',txt:'ことばのつぶ',mode:'split',ratio:'4:5',turn:'1',k:{tilt:0,gap:10,margin:36,bias:12,fat:5,wob:6,per:20,smooth:3},pal:2,seed:5},
  {name:'さざなみ（割る・傾け）',txt:'さざなみのしずけさ',mode:'split',ratio:'4:5',turn:'1',k:{tilt:9,gap:10,margin:36,bias:12,fat:5,wob:6,per:20,smooth:3},pal:1,seed:7},
  {name:'うねり強め',txt:'ゆらぐ\nみなも',mode:'rows',ratio:'1:1',turn:'0',k:{tilt:0,gap:0,margin:36,bias:12,fat:7,wob:10,per:30,smooth:4},pal:3,seed:9},
];
const PALS=[['黒・灰',['#000000','#767676','#b6b6b6']],['黒地・生成り',['#1e2022','#8a877f','#e8e4da']],['生成り・墨＋朱',['#e8e4da','#181818','#d63e26']],
  ['紺・水色',['#121c3e','#5068a0','#a8c8e4']],['深緑・薄荷',['#102e24','#5c8054','#aae2c4']],['生成り・青',['#eeeade','#82b4e1','#2246c8']],['黄・黒',['#f4cc28','#e8781e','#101010']],['朱・生成り',['#d63e26','#f0a0a0','#f8eede']]];
const pb=$('presets');PRESETS.forEach(p=>{const b=document.createElement('button');b.textContent=p.name;b.onclick=()=>{

  $('txt').value=p.txt;$('mode').value=p.mode;$('font').value=p.font||'maru';$('ratio').value=p.ratio;$('turn').value=p.turn;for(const k in p.k)$(k).value=p.k[k];SEED=p.seed;setPal(p.pal)};pb.appendChild(b)});
const qb=$('palettes');function setPal(i){const c=PALS[i][1];$('c0').value=c[0];$('c1').value=c[1];$('c2').value=c[2];render()}
PALS.forEach((p,i)=>{const b=document.createElement('button');b.textContent=p[0];b.style.background=`linear-gradient(90deg,${p[1][0]} 0 40%,${p[1][1]} 40% 70%,${p[1][2]} 70%)`;b.style.color='transparent';b.title=p[0];b.style.height='22px';b.onclick=()=>setPal(i);qb.appendChild(b)});

// ── 保存・読む
function settings(){const s={tool:'tatae',v:1,seed:SEED};K.forEach(k=>s[k]=v(k));TXT.forEach(k=>s[k]=$(k).value);s.extra=EXTRA.map(e=>e.svg);return s}
function applySettings(s){K.forEach(k=>{if(s[k]!=null)$(k).value=s[k]});TXT.forEach(k=>{if(s[k]!=null)$(k).value=s[k]});SEED=s.seed||7;
  EXTRA=[];const ex=s.extra||[];if(!ex.length){render();return}
  Promise.all(ex.map(t=>loadImg(t).then(img=>({img,svg:t})).catch(()=>null))).then(a=>{EXTRA=a.filter(Boolean);render()})}
function loadImg(t){return new Promise((ok,ng)=>{const img=new Image(),u=URL.createObjectURL(new Blob([t],{type:'image/svg+xml'}));img.onload=()=>{URL.revokeObjectURL(u);ok(img)};img.onerror=()=>{URL.revokeObjectURL(u);ng()};img.src=u})}
function stamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');return`${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`}
function fname(ext){return 'tatae_'+$('txt').value.replace(/[\\/:*?"<>|\s]/g,'').slice(0,16)+'_'+stamp()+'.'+ext}
function save(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},8000)}
function msg(t){$('msg').textContent=t}
$('png').onclick=()=>{const c=document.createElement('canvas');c.width=BW;c.height=BH;draw(c.getContext('2d'),LAST,1);
  c.toBlob(b=>{save(b,fname('png'));msg(`PNG を書き出した（${BW}×${BH}）`)},'image/png')};
function svgText(){const f=n=>Math.round(n*10)/10;
  let s=`<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${BW} ${BH}" width="${BW}" height="${BH}">\n`;
  s+=`<metadata id="tatae-data">${JSON.stringify(settings()).replace(/&/g,'&amp;').replace(/</g,'&lt;')}</metadata>\n`;
  if($('paper').value==='on')s+=`<rect id="地" width="${BW}" height="${BH}" fill="${$('c0').value}"/>\n`;
  s+=`<g id="字" fill-rule="evenodd">\n`;
  LAST.forEach((c,n)=>{if(c.blank)return;const a=c.ang*Math.PI/180,ca=Math.cos(a),sa=Math.sin(a);
    const T=([x,y])=>{x-=c.gw/2;y-=c.gh/2;return[c.cx+x*ca-y*sa,c.cy+x*sa+y*ca]};   // 回転は座標に焼く（Illustrator でそのまま触れる）
    const nm=typeof c.src==='string'?c.src:'SVG';
    s+=`<path id="字${n+1}_${nm}" fill="${c.col}" d="${c.loops.map(L=>'M'+L.map(p=>T(p).map(f).join(',')).join(' L')+'Z').join(' ')}"/>\n`});
  return s+'</g>\n</svg>\n'}
$('svg').onclick=()=>{save(new Blob([svgText()],{type:'image/svg+xml'}),fname('svg'));msg('SVG を書き出した（1字1パス・この道具で読むと字と設定に戻る）')};
$('jsave').onclick=()=>save(new Blob([JSON.stringify(settings(),null,1)],{type:'application/json'}),fname('json'));
$('jload').onclick=()=>$('jfile').click();
$('jfile').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{applySettings(JSON.parse(t));msg('設定を読んだ')}catch(_){alert('この設定は読めませんでした')}});e.target.value=''};
$('svgin').onclick=()=>$('svgfile').click();
$('svgfile').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{
  const m=t.match(/<metadata id="tatae-data">([\s\S]*?)<\/metadata>/);
  if(m){try{applySettings(JSON.parse(m[1].replace(/&lt;/g,'<').replace(/&amp;/g,'&')));msg('TATAE の SVG＝字と設定に戻した');return}catch(_){}}
  loadImg(t).then(img=>{EXTRA.push({img,svg:t});$('mode').value='split';msg(`SVG の形を枠に足した（いま ${EXTRA.length} つ）。字と同じように満たす`);render()}).catch(()=>alert('この SVG は読めませんでした'))});e.target.value=''};
window.addEventListener('resize',render);
window.__tatae={render,settings,applySettings,svgText,get cells(){return LAST}};
pb.querySelector('button').classList.add('on');
{const q=+new URLSearchParams(location.search).get('p');if(q&&pb.children[q])pb.children[q].click();else render()}
Promise.all([document.fonts.load('500 100px "Zen Maru Gothic"','あいうえおつぶしずけさみかぜそよぐことばのさざなみゆらぐも'),document.fonts.load('900 100px "Zen Kaku Gothic New"','あいう')]).then(()=>{CACHE.clear();render()}).catch(()=>{});
document.fonts.addEventListener&&document.fonts.addEventListener('loadingdone',()=>{CACHE.clear();render()});

<!-- ══════════════════════════════════════════════════════════════
     モバイルの保存 ── 2026-08-15（KUMI と同じもの・2026-11-18 にこの道具へ入れた）
     ⭐ 触る端末のときだけ【端末の共有シート】へファイルを渡す。無ければ今までどおり落とす。
     🔴🔴 PC は最初の1行で必ず素通りする（pointer:coarse かつ hover が無いときだけ通る）
     ══════════════════════════════════════════════════════════════ -->
<script>
(function(){
  var touchOnly = window.matchMedia
    && matchMedia('(pointer:coarse)').matches && !matchMedia('(hover:hover)').matches;
  if(!touchOnly) return;                       /* 🔴 PC はここで終わり */
  if(!window.HTMLAnchorElement) return;
  var orig = HTMLAnchorElement.prototype.click;
  HTMLAnchorElement.prototype.click = function(){
    var href = this.getAttribute('href') || '';
    var name = this.getAttribute('download');
    if(!name || href.slice(0,5) !== 'blob:' || this.dataset.plainSave)
      return orig.apply(this, arguments);
    var self = this, args = arguments;
    var plain = function(){
      try{
        var a = document.createElement('a');
        a.href = href; a.download = name; a.dataset.plainSave = '1';
        document.body.appendChild(a);
        orig.apply(a, []);
        setTimeout(function(){ if(a.parentNode) a.remove(); }, 20000);
      }catch(_){ try{ orig.apply(self, args); }catch(__){} }
    };
    fetch(href).then(function(r){ return r.blob(); }).then(function(b){
      var f;
      try{ f = new File([b], name, { type: b.type || 'application/octet-stream' }); }
      catch(_){ return plain(); }
      if(navigator.share && navigator.canShare && navigator.canShare({ files:[f] })){
        return navigator.share({ files:[f], title:name })
          .catch(function(err){ if(!(err && err.name === 'AbortError')) plain(); });
      }
      plain();
    }).catch(plain);
    return undefined;
  };
})();
</script>
