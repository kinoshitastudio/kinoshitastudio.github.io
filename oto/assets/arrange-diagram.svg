<svg xmlns="http://www.w3.org/2000/svg" width="780" height="446" viewBox="0 0 780 446" font-family="-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif">
  <rect x="0" y="0" width="780" height="446" rx="10" fill="#15181c"/>

  <!-- ============ Panel A : SONG ① 縦に積む＝同時 ============ -->
  <text x="26" y="30" fill="#e6e8ec" font-size="15" font-weight="600">▦ SONG ①：縦に積む ＝ 同時に鳴る</text>
  <text x="26" y="49" fill="#8b95a1" font-size="11">同じ小節（縦の同じ列）にフレームを重ねる ＝ その全部が"同時"に鳴る（合奏）</text>

  <!-- board -->
  <rect x="24" y="60" width="330" height="330" rx="8" fill="#1d2127" stroke="#2a3038"/>
  <text x="40" y="80" fill="#5a636e" font-size="10">board（盤）</text>

  <!-- stack brace -->
  <path d="M70 96 q-8 0 -8 8 v258 q0 8 8 8" fill="none" stroke="#9bd36b" stroke-width="2"/>
  <text x="46" y="232" fill="#9bd36b" font-size="10" transform="rotate(-90 46 232)" text-anchor="middle">同じ列</text>

  <!-- frame 1 : melody -->
  <rect x="92" y="96" width="244" height="84" rx="6" fill="#262b33" stroke="#3a424c"/>
  <text x="102" y="113" fill="#cfd5dd" font-size="11">① 鍵盤 / メロディ</text>
  <circle cx="120" cy="150" r="3.5" fill="#9bd36b"/><circle cx="150" cy="138" r="3.5" fill="#9bd36b"/>
  <circle cx="186" cy="160" r="3.5" fill="#9bd36b"/><circle cx="225" cy="142" r="3.5" fill="#9bd36b"/>
  <circle cx="265" cy="152" r="3.5" fill="#9bd36b"/><circle cx="300" cy="136" r="3.5" fill="#9bd36b"/>

  <!-- frame 2 : drum -->
  <rect x="92" y="196" width="244" height="72" rx="6" fill="#262b33" stroke="#3a424c"/>
  <text x="102" y="213" fill="#cfd5dd" font-size="11">② ドラム（楽器オフ＝リズム専用）</text>
  <rect x="118" y="236" width="8" height="14" rx="2" fill="#e6c84a"/><rect x="158" y="236" width="8" height="14" rx="2" fill="#e6c84a"/>
  <rect x="198" y="236" width="8" height="14" rx="2" fill="#e6c84a"/><rect x="238" y="236" width="8" height="14" rx="2" fill="#e6c84a"/>
  <rect x="278" y="236" width="8" height="14" rx="2" fill="#e6c84a"/>

  <!-- frame 3 : bass -->
  <rect x="92" y="284" width="244" height="72" rx="6" fill="#262b33" stroke="#3a424c"/>
  <text x="102" y="301" fill="#cfd5dd" font-size="11">③ ベース</text>
  <rect x="118" y="322" width="200" height="10" rx="3" fill="#2f8fff" opacity="0.7"/>

  <text x="24" y="382" fill="#6e7884" font-size="10">→ 役割で縦に積むだけ。小節（横位置）が同じ＝同時に鳴る。</text>

  <!-- ============ Panel B : SONG ② 横に並べる＝進行 ============ -->
  <text x="426" y="30" fill="#e6e8ec" font-size="15" font-weight="600">▦ SONG ②：横に並べる ＝ 時間が進む</text>
  <text x="426" y="49" fill="#8b95a1" font-size="11">位置が意味を持つ：横=小節（時間）／ 縦=レーン ／ 空白=休符</text>

  <!-- board -->
  <rect x="424" y="60" width="332" height="330" rx="8" fill="#1d2127" stroke="#2a3038"/>

  <!-- ruler -->
  <text x="470" y="80" fill="#5a636e" font-size="10" text-anchor="middle">1</text>
  <text x="542" y="80" fill="#5a636e" font-size="10" text-anchor="middle">2</text>
  <text x="613" y="80" fill="#5a636e" font-size="10" text-anchor="middle">3</text>
  <text x="685" y="80" fill="#5a636e" font-size="10" text-anchor="middle">4</text>

  <!-- lane labels -->
  <text x="444" y="125" fill="#6e7884" font-size="9" text-anchor="middle" font-family="monospace">L1</text>
  <text x="444" y="217" fill="#6e7884" font-size="9" text-anchor="middle" font-family="monospace">L2</text>
  <text x="444" y="309" fill="#6e7884" font-size="9" text-anchor="middle" font-family="monospace">L3</text>

  <!-- tracks (grid) -->
  <!-- lane1 -->
  <rect x="456" y="92" width="286" height="66" rx="5" fill="#23262b" stroke="#2a3038"/>
  <line x1="528" y1="92" x2="528" y2="158" stroke="#2a3038"/><line x1="599" y1="92" x2="599" y2="158" stroke="#2a3038"/><line x1="671" y1="92" x2="671" y2="158" stroke="#2a3038"/>
  <rect x="459" y="96" width="137" height="58" rx="4" fill="#9bd36b" opacity="0.55"/><text x="468" y="129" fill="#15181c" font-size="10">鍵盤</text>
  <rect x="674" y="96" width="65" height="58" rx="4" fill="#9bd36b" opacity="0.55"/><text x="683" y="129" fill="#15181c" font-size="10">鍵盤</text>
  <text x="635" y="129" fill="#46505a" font-size="9" text-anchor="middle">休符</text>

  <!-- lane2 -->
  <rect x="456" y="184" width="286" height="66" rx="5" fill="#23262b" stroke="#2a3038"/>
  <line x1="528" y1="184" x2="528" y2="250" stroke="#2a3038"/><line x1="599" y1="184" x2="599" y2="250" stroke="#2a3038"/><line x1="671" y1="184" x2="671" y2="250" stroke="#2a3038"/>
  <rect x="459" y="188" width="280" height="58" rx="4" fill="#e6c84a" opacity="0.55"/><text x="468" y="221" fill="#15181c" font-size="10">ドラム（4小節通し）</text>

  <!-- lane3 -->
  <rect x="456" y="276" width="286" height="66" rx="5" fill="#23262b" stroke="#2a3038"/>
  <line x1="528" y1="276" x2="528" y2="342" stroke="#2a3038"/><line x1="599" y1="276" x2="599" y2="342" stroke="#2a3038"/><line x1="671" y1="276" x2="671" y2="342" stroke="#2a3038"/>
  <rect x="459" y="280" width="65" height="58" rx="4" fill="#2f8fff" opacity="0.55"/><text x="468" y="313" fill="#15181c" font-size="10">低音</text>
  <rect x="602" y="280" width="65" height="58" rx="4" fill="#2f8fff" opacity="0.55"/><text x="611" y="313" fill="#15181c" font-size="10">低音</text>
  <text x="563" y="313" fill="#46505a" font-size="9" text-anchor="middle">休符</text>

  <text x="424" y="368" fill="#6e7884" font-size="10">→ 左→右に再生。各列で縦に居る音が同時に鳴り、空白は休む。</text>
  <text x="424" y="382" fill="#46505a" font-size="9.5">ラフでOK：同じ段に並べる／だいたい等間隔／幅は揃える、くらいの意識。</text>

  <!-- footer -->
  <text x="26" y="423" fill="#6e7884" font-size="10">①と②は同じ ▦SONG の二つの顔。曲の範囲＝ヘッダーのドロップダウン（選択中／盤全体／▦Section名）。📌固定でボードを触っても曲は変わらない。</text>
  <text x="26" y="439" fill="#46505a" font-size="9.5">◉ LIVE は別モード：1フレームをループ → 別フレームを選ぶと次の小節で切替（その場演奏）。</text>
</svg>
