<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="-apple-system,'Helvetica Neue',sans-serif">
  <rect x="0" y="0" width="900" height="460" rx="16" fill="#0a0a0a"/>

  <!-- 左：フレーム（デザイン） -->
  <rect x="90" y="86" width="320" height="300" rx="30" fill="none" stroke="#ffffff" stroke-width="5"/>
  <rect x="140" y="150" width="170" height="38" rx="9" fill="#ffffff"/>
  <rect x="140" y="214" width="220" height="38" rx="9" fill="#ffffff"/>
  <circle cx="166" cy="305" r="26" fill="#ffffff"/>
  <rect x="212" y="283" width="130" height="44" rx="11" fill="#ffffff"/>
  <rect x="140" y="352" width="110" height="30" rx="8" fill="#ffffff"/>

  <!-- 再生ヘッド（赤の点線） -->
  <line x1="282" y1="96" x2="282" y2="376" stroke="#ec3b22" stroke-width="6" stroke-linecap="round" stroke-dasharray="3 16"/>

  <!-- 矢印 -->
  <path d="M452 235 h70 m-16 -11 l16 11 -16 11" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 右：譜面（ピアノロール） -->
  <g stroke="#ffffff" stroke-width="2" opacity="0.32">
    <line x1="588" y1="170" x2="864" y2="170"/>
    <line x1="588" y1="250" x2="864" y2="250"/>
    <line x1="588" y1="330" x2="864" y2="330"/>
  </g>
  <rect x="600" y="148" width="78" height="44" rx="10" fill="#ffffff"/>
  <rect x="762" y="228" width="78" height="44" rx="10" fill="#ffffff"/>
  <rect x="678" y="308" width="86" height="44" rx="10" fill="#ffffff"/>

  <!-- ラベル -->
  <text x="90" y="424" fill="#6e7884" font-size="13">配置（frame）＝ 横:時間 / 縦:音程 / 大きさ:音量 / 余白:休符</text>
  <text x="588" y="424" fill="#6e7884" font-size="13">→ そのまま譜面に翻訳される</text>
</svg>
