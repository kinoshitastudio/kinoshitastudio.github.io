<svg xmlns="http://www.w3.org/2000/svg" width="770" height="250" viewBox="0 0 770 250" font-family="-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif">
  <rect x="0" y="0" width="770" height="250" rx="10" fill="#15181c"/>

  <!-- ① ノブの操作 -->
  <text x="22" y="28" fill="#e6e8ec" font-size="13" font-weight="600">① ノブの操作</text>
  <circle cx="92" cy="108" r="36" fill="#262b33" stroke="#3a424c" stroke-width="2"/>
  <circle cx="92" cy="108" r="36" fill="none" stroke="#9bd36b" stroke-width="3" stroke-dasharray="150 226" transform="rotate(135 92 108)"/>
  <line x1="92" y1="108" x2="112" y2="86" stroke="#9bd36b" stroke-width="3" stroke-linecap="round"/>
  <!-- up/down arrow -->
  <g stroke="#8b95a1" stroke-width="1.5" fill="none">
    <line x1="150" y1="84" x2="150" y2="132"/>
    <path d="M145 90 L150 82 L155 90"/><path d="M145 126 L150 134 L155 126"/>
  </g>
  <text x="162" y="104" fill="#8b95a1" font-size="10">ドラッグ↑↓</text>
  <text x="162" y="120" fill="#6e7884" font-size="10">＝ 増減</text>
  <text x="22" y="176" fill="#cfd5dd" font-size="10.5">● ドラッグ ↑↓ ＝ 増やす／減らす</text>
  <text x="22" y="196" fill="#cfd5dd" font-size="10.5">● <tspan fill="#9bd36b">ダブルクリック ＝ 既定値にリセット</tspan></text>
  <text x="22" y="216" fill="#cfd5dd" font-size="10.5">● マウスホイール ＝ 微調整</text>

  <line x1="246" y1="20" x2="246" y2="230" stroke="#2a3038"/>

  <!-- ② ADSR -->
  <text x="266" y="28" fill="#e6e8ec" font-size="13" font-weight="600">② ADSR ＝ 音の出方・消え方</text>
  <line x1="272" y1="190" x2="512" y2="190" stroke="#3a424c"/>
  <line x1="272" y1="60" x2="272" y2="190" stroke="#3a424c"/>
  <polyline points="272,190 300,72 338,128 432,128 470,190" fill="none" stroke="#9bd36b" stroke-width="2.5" stroke-linejoin="round"/>
  <g stroke="#3a424c" stroke-dasharray="2 3"><line x1="300" y1="72" x2="300" y2="190"/><line x1="338" y1="128" x2="338" y2="190"/><line x1="432" y1="128" x2="432" y2="190"/><line x1="470" y1="128" x2="470" y2="190"/></g>
  <text x="282" y="205" fill="#e6c84a" font-size="10" text-anchor="middle">A</text>
  <text x="319" y="205" fill="#e6c84a" font-size="10" text-anchor="middle">D</text>
  <text x="385" y="205" fill="#e6c84a" font-size="10" text-anchor="middle">S</text>
  <text x="451" y="205" fill="#e6c84a" font-size="10" text-anchor="middle">R</text>
  <text x="266" y="228" fill="#6e7884" font-size="9.5">A 立ち上がり / D 減衰 / S 押してる間の保持 / R 余韻</text>

  <line x1="522" y1="20" x2="522" y2="230" stroke="#2a3038"/>

  <!-- ③ CUT / RES -->
  <text x="542" y="28" fill="#e6e8ec" font-size="13" font-weight="600">③ CUT / RES ＝ 音色</text>
  <line x1="548" y1="185" x2="752" y2="185" stroke="#3a424c"/>
  <line x1="548" y1="70" x2="548" y2="185" stroke="#3a424c"/>
  <polyline points="548,108 632,108 652,104 661,82 686,150 750,182" fill="none" stroke="#9bd36b" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="600" y1="120" x2="700" y2="120" stroke="#8b95a1" stroke-width="1" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="650" y="135" fill="#8b95a1" font-size="9.5" text-anchor="middle">CUT（←暗 / 明→）</text>
  <text x="668" y="74" fill="#e6c84a" font-size="9.5">RES（山＝クセ）</text>
  <text x="542" y="228" fill="#6e7884" font-size="9.5">CUT=明るさ / RES=カットオフ付近の強調（上げすぎでピーッ）</text>
  <defs><marker id="a" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0 3.5 L7 0 L7 7 Z" fill="#8b95a1"/></marker></defs>
</svg>
