<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Takahiro Kinoshita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400&family=DM+Sans:ital,wght@0,200;0,300;1,200;1,300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}

:root{
  --bg:#fff;
  --ink:#0e0e0e;
  --faint:rgba(14,14,14,0.07);
  --mid:rgba(14,14,14,0.28);
  --sub:rgba(14,14,14,0.52);
}

html,body{width:100%;height:100%;background:var(--bg);overflow:hidden;cursor:none;font-family:'DM Sans',sans-serif;}

/* カーソル */
#cursor{position:fixed;width:5px;height:5px;background:var(--ink);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:width .18s,height .18s,background .18s,border .18s;mix-blend-mode:multiply;}
#cursor.hovering{width:38px;height:38px;background:transparent;border:1px solid var(--ink);}

/* グレイン */
body::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.026'/%3E%3C/svg%3E");pointer-events:none;z-index:500;}

/* 背景グラデ */
#bg-grad{position:fixed;inset:0;z-index:0;transition:background 1.4s ease;}
#bg-grad.none{background:#fff;}
#bg-grad.subtle{background:radial-gradient(ellipse 70% 60% at 8% 12%,rgba(14,14,14,0.042) 0%,transparent 65%),radial-gradient(ellipse 50% 50% at 92% 88%,rgba(14,14,14,0.032) 0%,transparent 60%),#fff;}
#bg-grad.warm{background:radial-gradient(ellipse 80% 70% at 50% 50%,rgba(14,14,14,0.038) 0%,transparent 70%),#fff;}

/* ━━ ナビ（黒・はっきり） */
#nav{position:fixed;top:28px;left:24px;display:flex;flex-direction:column;gap:11px;z-index:300;opacity:0;animation:fadeUp .8s ease 2.5s forwards;}
#nav a{font-family:'DM Sans',sans-serif;font-weight:300;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:var(--ink);text-decoration:none;cursor:none;border:none;outline:none;transition:opacity .2s;}
#nav a:hover{opacity:.5;}
#nav a.active{opacity:.45;}

/* ━━ スピーカーアイコン（上部中央） */
#speaker{position:fixed;top:26px;left:50%;transform:translateX(-50%);z-index:300;opacity:0;animation:fadeUp .8s ease 3s forwards;cursor:none;background:none;border:none;outline:none;padding:6px;}
#speaker svg{width:18px;height:18px;display:block;}
#speaker .wave{transition:opacity .3s;}
#speaker.muted .wave{opacity:0;}

/* ━━ グラデ切り替え + スタジオリンク（黒） */
#bottom-bar{position:fixed;bottom:24px;left:24px;right:24px;display:flex;justify-content:space-between;align-items:center;z-index:20;opacity:0;animation:fadeUp .8s ease 4s forwards;}
#grad-switcher{display:flex;gap:14px;}
#grad-switcher button{font-family:'DM Sans',sans-serif;font-weight:300;font-size:9px;letter-spacing:0.22em;text-transform:uppercase;background:none;border:none;outline:none;cursor:none;color:rgba(14,14,14,0.45);padding:4px 0;transition:color .2s;-webkit-appearance:none;}
#grad-switcher button:hover{color:var(--ink);}
#grad-switcher button.active{color:var(--ink);text-decoration:underline;text-underline-offset:4px;text-decoration-color:rgba(14,14,14,0.5);}
.studio-link{font-family:'DM Sans',sans-serif;font-weight:300;font-size:9px;letter-spacing:0.24em;text-transform:uppercase;color:var(--ink);text-decoration:none;cursor:none;border:none;outline:none;transition:opacity .2s;}
.studio-link:hover{opacity:.5;}

/* ━━ メインステージ */
#home-stage{position:fixed;inset:0;z-index:1;overflow:hidden;animation:fadeUp 1.4s ease 0.1s both;transition:opacity .6s,transform .6s;}
#home-stage.hidden{opacity:0;pointer-events:none;transform:translateY(-8px);}

.fragment{position:absolute;cursor:none;user-select:none;}

/* 日本語 */
.char-jp{font-family:'Noto Sans JP',sans-serif;font-weight:300;color:var(--ink);opacity:0;animation:fadeUp 1.8s ease forwards;line-height:0.88;letter-spacing:-0.01em;pointer-events:none;}
.char-jp.faint{color:var(--faint);}
.char-jp.mid{color:var(--mid);}
.char-jp.sub{color:var(--sub);}

/* 欧文 */
.char-en{font-family:'DM Sans',sans-serif;font-weight:200;color:var(--ink);opacity:0;animation:fadeUp 1.8s ease forwards;line-height:0.88;letter-spacing:-0.02em;pointer-events:none;}
.char-en.faint{color:var(--faint);}
.char-en.mid{color:var(--mid);}
.char-en.sub{color:var(--sub);}

/* 石（トップ） */
.stone{opacity:0;animation:fadeUp 2s ease forwards;position:absolute;cursor:none;}
.stone svg{display:block;width:100%;height:auto;filter:drop-shadow(0 3px 12px rgba(0,0,0,0.09));transition:filter .4s;}
.stone:hover svg{filter:drop-shadow(0 7px 22px rgba(0,0,0,0.16));}
.stone.ringing{animation:stoneRing 0.07s ease infinite alternate;}

/* 音波リング */
.sound-ring{position:fixed;border-radius:50%;border:2px solid rgba(14,14,14,0.45);pointer-events:none;width:300px;height:300px;margin-left:-150px;margin-top:-150px;transform:scale(0);transform-origin:center center;animation:soundRingOut var(--dur,1.8s) cubic-bezier(0.2,0.6,0.4,1) forwards;z-index:200;}

/* 意味テキスト */
#meaning{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;z-index:50;opacity:0;transition:opacity .9s;}
#meaning.visible{opacity:1;}
#meaning p{font-family:'Noto Sans JP',sans-serif;font-weight:300;font-size:clamp(11px,3.5vw,17px);color:var(--ink);letter-spacing:0.18em;line-height:1.6;}
#meaning em{color:var(--mid);font-style:normal;}

/* ━━ 下層ページ共通 */
.sub-page{position:fixed;inset:0;z-index:2;background:var(--bg);overflow:hidden;opacity:0;pointer-events:none;transition:opacity .5s,transform .5s;transform:translateY(12px);}
.sub-page.active{opacity:1;pointer-events:all;transform:translateY(0);}
.sub-title{position:absolute;top:28px;left:24px;font-family:'DM Sans',sans-serif;font-weight:300;font-size:10px;letter-spacing:0.28em;text-transform:uppercase;color:var(--ink);}
.sub-close{position:absolute;top:26px;right:24px;font-family:'DM Sans',sans-serif;font-weight:300;font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:var(--ink);cursor:none;background:none;border:none;outline:none;transition:opacity .2s;}
.sub-close:hover{opacity:.5;}

/* ━━ ポートフォリオ */
#portfolio-stage{position:absolute;inset:0;overflow:hidden;}
.p-stone{position:absolute;cursor:none;opacity:0;animation:fadeUp 1.6s ease forwards;}
.p-stone svg{display:block;width:100%;height:auto;filter:drop-shadow(0 3px 14px rgba(0,0,0,0.1));transition:filter .4s;}
.p-stone:hover svg{filter:drop-shadow(0 8px 24px rgba(0,0,0,0.18));}
.p-stone .p-label{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-family:'DM Sans',sans-serif;font-weight:200;font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--ink);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .3s;}
.p-stone:hover .p-label{opacity:1;}
.p-stone.ringing{animation:stoneRing 0.07s ease infinite alternate;}




/* ━━ モーダル（黒・テキスト黒） */
#case-modal{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.75);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .45s;}
#case-modal.open{opacity:1;pointer-events:all;}
#case-box{background:#fff;border:2px solid var(--ink);width:min(540px,90vw);max-height:84vh;overflow-y:auto;position:relative;scrollbar-width:thin;scrollbar-color:var(--mid) transparent;}
#modal-close{position:sticky;top:0;right:0;float:right;clear:right;font-family:'DM Sans',sans-serif;font-weight:300;font-size:9px;letter-spacing:0.22em;text-transform:uppercase;color:var(--ink);cursor:none;background:rgba(255,255,255,0.96);border:none;outline:none;transition:opacity .2s;padding:16px 20px 0 0;}
#modal-close:hover{opacity:.5;}
#case-content{padding:28px 32px 40px;clear:both;}
#case-content .case-tag{font-family:'DM Sans',sans-serif;font-weight:300;font-size:9px;letter-spacing:0.26em;text-transform:uppercase;color:var(--ink);display:block;margin-bottom:14px;opacity:.55;}
#case-content .case-title{font-family:'Noto Sans JP',sans-serif;font-weight:300;font-size:clamp(18px,5vw,26px);line-height:1.3;color:var(--ink);margin-bottom:4px;letter-spacing:0.02em;}
#case-content .case-sub{font-family:'DM Sans',sans-serif;font-weight:200;font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink);opacity:.5;margin-bottom:24px;}
#case-content .case-img{width:100%;display:block;margin-bottom:22px;background:#f4f4f4;min-height:160px;object-fit:cover;}
#case-content .case-img.placeholder{display:flex;align-items:center;justify-content:center;min-height:180px;}
#case-content .case-img.placeholder span{font-family:'DM Sans',sans-serif;font-weight:200;font-size:9px;letter-spacing:0.2em;color:var(--ink);opacity:.4;}
#case-content .case-desc{font-family:'Noto Sans JP',sans-serif;font-weight:300;font-size:clamp(12px,3.5vw,14px);line-height:2.2;color:var(--ink);margin-bottom:28px;letter-spacing:0.04em;opacity:.7;}
#case-content .case-more{display:inline-block;font-family:'DM Sans',sans-serif;font-weight:300;font-size:10px;letter-spacing:0.26em;text-transform:uppercase;color:var(--ink);text-decoration:none;cursor:none;border-bottom:1px solid rgba(14,14,14,0.35);padding-bottom:3px;transition:opacity .2s;}
#case-content .case-more:hover{opacity:.6;}

/* ━━ About / 体験翻訳 */
.simple-sub{display:flex;align-items:center;justify-content:center;text-align:center;}
.simple-sub-inner{max-width:500px;padding:0 24px;}
.simple-sub-inner .s-title{font-family:'DM Sans',sans-serif;font-weight:300;font-size:9px;letter-spacing:0.28em;text-transform:uppercase;color:var(--ink);opacity:.5;margin-bottom:24px;display:block;}
.simple-sub-inner p{font-family:'Noto Sans JP',sans-serif;font-weight:300;font-size:clamp(13px,4vw,16px);line-height:2.5;color:var(--ink);letter-spacing:0.06em;}
.simple-sub-inner .about-img{width:min(200px,55vw);height:min(200px,55vw);border-radius:50%;object-fit:cover;display:block;margin:0 auto 28px;filter:grayscale(20%);}
.simple-sub-inner .about-name{font-family:'DM Sans',sans-serif;font-weight:300;font-size:clamp(16px,5vw,22px);letter-spacing:0.14em;color:var(--ink);margin-bottom:20px;display:block;}
.simple-sub-inner a{display:inline-block;margin-top:32px;font-family:'DM Sans',sans-serif;font-weight:300;font-size:10px;letter-spacing:0.24em;text-transform:uppercase;color:var(--ink);text-decoration:none;cursor:none;border-bottom:1px solid rgba(14,14,14,0.35);padding-bottom:3px;transition:opacity .2s;}
.simple-sub-inner a:hover{opacity:.55;}

/* ━━ 音楽再生インジケーター（右上・再生中） */
#music-indicator{position:fixed;top:52px;right:24px;z-index:299;opacity:0;transition:opacity .5s;pointer-events:none;}
#music-indicator.playing{opacity:1;}
#music-indicator span{display:inline-block;width:3px;height:14px;background:var(--ink);margin:0 1px;animation:musicBar var(--speed,.6s) ease-in-out infinite alternate;border-radius:1px;}
#music-indicator span:nth-child(2){--speed:.45s;animation-delay:.1s;}
#music-indicator span:nth-child(3){--speed:.7s;animation-delay:.2s;}
#music-indicator span:nth-child(4){--speed:.5s;animation-delay:.05s;}

@keyframes musicBar{0%{transform:scaleY(.3);}100%{transform:scaleY(1);}}

/* ━━ キーフレーム */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
@keyframes stoneRing{0%{transform:rotate(-1.4deg) translateY(0);}100%{transform:rotate(1.4deg) translateY(-2px);}}
@keyframes soundRingOut{0%{opacity:.65;transform:scale(0);}40%{opacity:.45;}100%{opacity:0;transform:scale(1);}}

/* ━━ モバイル調整 */
@media(max-width:600px){
  #nav{top:20px;left:16px;}
  #speaker{top:18px;left:50%;transform:translateX(-50%);}
  #bottom-bar{bottom:16px;left:16px;right:16px;}
  .sub-title{top:20px;left:16px;}
  .sub-close{top:18px;right:16px;}
}
</style>
</head>
<body>

<div id="cursor"></div>
<div id="bg-grad"></div>

<!-- ナビ（黒） -->
<nav id="nav">
  <a href="#" data-page="portfolio">Portfolio</a>
  <a href="#" data-page="translator">体験翻訳</a>

<button id="speaker" title="Music">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 5L6 9H2v6h4l5 4V5z"/>
    <path class="wave" d="M15.54 8.46a5 5 0 010 7.07"/>
    <path class="wave" d="M19.07 4.93a10 10 0 010 14.14"/>
  </svg>
</button>

<!-- 音楽再生インジケーター -->
<div id="music-indicator">
  <span></span><span></span><span></span><span></span>
</div>

<!-- 下部バー（グラデ切り替え + スタジオリンク） -->
<div id="bottom-bar">
  <div id="grad-switcher">
    <button data-grad="none">None</button>
    <button data-grad="subtle" class="active">Subtle</button>
    <button data-grad="warm">Warm</button>

<!-- Portfolio -->
<div class="sub-page" id="page-portfolio">
  <span class="sub-title">Portfolio</span>
  <button class="sub-close" data-close>← Back</button>

</div>

<!-- 体験翻訳 -->
<div class="sub-page simple-sub" id="page-translator">
  <span class="sub-title">体験翻訳</span>
  <button class="sub-close" data-close>← Back</button>
  <div class="simple-sub-inner">
    <span class="s-title">Experience Translation</span>
    <p>届けたい体験と、<br>届いている体験のあいだには<br>必ずズレがある。<br><br>そのズレを発見して、<br>揃える。</p>
    <a href="https://kinoshitastudio.github.io/experience-translator.html" target="_blank">木下スタジオ 体験翻訳ページ →</a>
  </div>
</div>

<!-- About -->
<div class="sub-page simple-sub" id="page-about">
  <span class="sub-title">About</span>
  <button class="sub-close" data-close>← Back</button>
  <div class="simple-sub-inner">

    <span class="s-title">Takahiro Kinoshita</span>

    <p>音から始まった。<br><br>UX / UI Design — 10yr+<br>Music — 99LETTERS<br>Base — Shiga, Japan</p>
    <a href="https://kinoshitastudio.github.io/" target="_blank">Kinoshita Studio →</a>
  </div>
</div>

<!-- モーダル -->
<div id="case-modal">
  <div id="case-box">
    <button id="modal-close">Close</button>
    <div id="case-content"></div>
  </div>
</div>

<script>
const vw=window.innerWidth, vh=window.innerHeight;
const isMobile=vw<=600;
const rng=(seed,n)=>Math.abs(Math.sin(seed*9301+n*49297));

// ━━ カーソル
const cursor=document.getElementById('cursor');
document.addEventListener('mousemove',e=>{cursor.style.left=e.clientX+'px';cursor.style.top=e.clientY+'px';});
function addHover(el){
  el.addEventListener('mouseenter',()=>cursor.classList.add('hovering'));
  el.addEventListener('mouseleave',()=>cursor.classList.remove('hovering'));
}

// ━━ グラデ
const bgGrad=document.getElementById('bg-grad');
bgGrad.className='subtle';
document.querySelectorAll('#grad-switcher button').forEach(btn=>{
  addHover(btn);
  btn.addEventListener('click',()=>{
    document.querySelectorAll('#grad-switcher button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    bgGrad.className=btn.dataset.grad;
  });
});
addHover(document.querySelector('.studio-link'));

// ━━ ページ遷移
const homeStage=document.getElementById('home-stage');
const subPages=document.querySelectorAll('.sub-page');
const navEl=document.getElementById('nav');
const bottomBar=document.getElementById('bottom-bar');
const speakerEl=document.getElementById('speaker');
const musicInd=document.getElementById('music-indicator');

function showPage(id){
  homeStage.classList.toggle('hidden',!!id);
  subPages.forEach(p=>p.classList.toggle('active',p.id==='page-'+id));
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.page===id));
  // サブページ表示中はナビ・底部バー・スピーカーを非表示
  const hide=!!id;
  navEl.style.opacity=hide?'0':'';
  navEl.style.pointerEvents=hide?'none':'';
  bottomBar.style.opacity=hide?'0':'';
  bottomBar.style.pointerEvents=hide?'none':'';
  speakerEl.style.opacity=hide?'0':'';
  speakerEl.style.pointerEvents=hide?'none':'';
  musicInd.style.opacity=hide?'0':'';
}
document.querySelectorAll('#nav a').forEach(a=>{
  addHover(a);
  a.addEventListener('click',e=>{e.preventDefault();showPage(a.classList.contains('active')?null:a.dataset.page);});
});
document.querySelectorAll('[data-close]').forEach(btn=>{addHover(btn);btn.addEventListener('click',()=>showPage(null));});

// ━━ Audio (Web Audio)
let audioCtx=null;
function ensureAudio(){
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
}
function playHichiriki(freq,dur){
  ensureAudio();const t=audioCtx.currentTime;
  const o1=audioCtx.createOscillator();o1.type='sawtooth';o1.frequency.value=freq;
  const o2=audioCtx.createOscillator();o2.type='square';o2.frequency.value=freq*2.01;
  const lfo=audioCtx.createOscillator();lfo.frequency.value=5.2;
  const lg=audioCtx.createGain();lg.gain.value=freq*0.013;
  lfo.connect(lg);lg.connect(o1.frequency);
  const filt=audioCtx.createBiquadFilter();filt.type='bandpass';filt.frequency.value=freq*2.4;filt.Q.value=2.8;
  const g=audioCtx.createGain();
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.14,t+.07);
  g.gain.setValueAtTime(0.14,t+dur*.5);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  const dly=audioCtx.createDelay(.5);dly.delayTime.value=.09;
  const dg=audioCtx.createGain();dg.gain.value=.22;
  o1.connect(filt);o2.connect(filt);filt.connect(g);
  g.connect(audioCtx.destination);g.connect(dly);dly.connect(dg);dg.connect(dly);dg.connect(audioCtx.destination);
  [o1,o2,lfo].forEach(o=>{o.start(t);o.stop(t+dur+.6);});
}
function playShō(dur){
  ensureAudio();const t=audioCtx.currentTime;
  [293.66,369.99,440,554.37,659.25].forEach((freq,i)=>{
    const o=audioCtx.createOscillator();o.type='sine';o.frequency.value=freq;
    const g=audioCtx.createGain();
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.032,t+.18+i*.06);
    g.gain.setValueAtTime(.032,t+dur*.65);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+dur+.4);
  });
}

// ━━ BGM（ループ再生 — 99LETTERSの音楽を流す）
// 実際の音源URLをここに設定。現在はWebAudio合成でアンビエントループをデモ
let bgmPlaying=false;
let bgmSource=null;
let bgmGain=null;
const musicIndicator=document.getElementById('music-indicator');
const speakerBtn=document.getElementById('speaker');

function startBGM(){
  ensureAudio();
  if(bgmPlaying) return;
  bgmPlaying=true;
  musicIndicator.classList.add('playing');
  speakerBtn.classList.remove('muted');
  // アンビエントループ合成（本番は実際の音源に差し替え）
  bgmGain=audioCtx.createGain();bgmGain.gain.value=0.06;
  bgmGain.connect(audioCtx.destination);
  function loop(){
    if(!bgmPlaying) return;
    const t=audioCtx.currentTime;
    [[220,.9],[329.6,.7],[440,.5],[554.4,.4],[261.6,.6]].forEach(([f,v],i)=>{
      const o=audioCtx.createOscillator();o.type='sine';o.frequency.value=f;
      const g=audioCtx.createGain();
      g.gain.setValueAtTime(0,t+i*.18);
      g.gain.linearRampToValueAtTime(v*0.06,t+i*.18+.4);
      g.gain.linearRampToValueAtTime(0,t+i*.18+2.8);
      o.connect(g);g.connect(bgmGain);
      o.start(t+i*.18);o.stop(t+i*.18+3);
    });
    setTimeout(loop,3200);
  }
  loop();
}
function stopBGM(){
  bgmPlaying=false;

}

// 音波リング
function emitSoundRings(x,y,count,dur){
  for(let i=0;i<count;i++){
    setTimeout(()=>{
      const r=document.createElement('div');r.className='sound-ring';
      r.style.setProperty('--dur',(dur*.85)+'s');
      r.style.left=x+'px';r.style.top=y+'px';
      r.style.borderColor=`rgba(14,14,14,${Math.max(.45-i*.08,.12)})`;
      document.body.appendChild(r);
      setTimeout(()=>r.remove(),dur*1000+200);
    },i*(dur*240));
  }
}

// ━━ 石SVG
function makeStone(seed){
  let d='';
  const pts=11+Math.floor(rng(seed,50)*4);
  for(let i=0;i<pts;i++){
    const a=(i/pts)*Math.PI*2-Math.PI/2;
    const r=50*(.74+rng(seed,i)*.46);
    const asp=0.58+rng(seed,i+100)*0.36;
    d+=(i===0?'M':'L')+`${(100+Math.cos(a)*r).toFixed(1)},${(80+Math.sin(a)*r*asp).toFixed(1)} `;
  }
  d+='Z';
  const L=74+rng(seed,99)*16,H=24+rng(seed,88)*24,S=6+rng(seed,77)*7;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160">
    <defs>
      <radialGradient id="sg${seed}" cx="${30+rng(seed,10)*16}%" cy="${28+rng(seed,11)*12}%" r="64%">
        <stop offset="0%"   stop-color="hsl(${H},${S+4}%,${L+12}%)"/>
        <stop offset="50%"  stop-color="hsl(${H},${S}%,${L}%)"/>
        <stop offset="100%" stop-color="hsl(${H},${S-2}%,${L-18}%)"/>
      </radialGradient>
      <filter id="sf${seed}" x="-8%" y="-8%" width="116%" height="116%">
        <feTurbulence type="fractalNoise" baseFrequency="${.54+rng(seed,20)*.14}" numOctaves="3" result="n"/>
        <feColorMatrix type="saturate" values="0" in="n" result="gn"/>
        <feBlend in="SourceGraphic" in2="gn" mode="multiply" result="b"/>
        <feComposite in="b" in2="SourceGraphic" operator="in"/>
      </filter>
    </defs>
    <path d="${d}" fill="url(#sg${seed})" filter="url(#sf${seed})"/>
  </svg>`;
}




// ━━ ゾーン
function makeZones(cols,rows){
  const z=[];
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++)
    z.push({xMin:vw*(c/cols+.04),xMax:vw*((c+1)/cols-.04),yMin:vh*(r/rows+.06),yMax:vh*((r+1)/rows-.06)});
  return z;
}
function pickZone(zones,used){
  const avail=zones.map((_,i)=>i).filter(i=>!used.has(i));
  const zi=avail[Math.floor(Math.random()*avail.length)]??0;
  used.add(zi);
  const z=zones[zi];
  return{x:z.xMin+Math.random()*(z.xMax-z.xMin),y:z.yMin+Math.random()*(z.yMax-z.yMin)};
}

// ━━ パラックス
document.addEventListener('mousemove',e=>{
  if(homeStage.classList.contains('hidden')) return;
  const px=(e.clientX/vw-.5)*2,py=(e.clientY/vh-.5)*2;
  document.querySelectorAll('#home-stage .char-jp').forEach((el,i)=>{
    const d=.003+(i%3)*.002;
    const rot=el.style.transform.match(/rotate\([^)]+\)/)?.[0]||'';
    el.style.transform=(rot?rot+' ':'')+`translate(${px*-13*d}px,${py*-9*d}px)`;
  });
  document.querySelectorAll('#home-stage .char-en').forEach((el,i)=>{
    const d=.002+(i%2)*.002;
    const rot=el.style.transform.match(/rotate\([^)]+\)/)?.[0]||'';
    el.style.transform=(rot?rot+' ':'')+`translate(${px*-10*d}px,${py*-7*d}px)`;
  });
  document.querySelectorAll('#home-stage .stone').forEach((el,i)=>{
    if(el.classList.contains('ringing')) return;
    const d=.007+i*.003;
    el.style.transform=`translate(${px*-16*d}px,${py*-11*d}px)`;
  });
});
</script>
</body>
</html>
