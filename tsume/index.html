<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>詰 TSUME — 作字を、プロの見る所に沿って詰める道具 / 木下スタジオ</title>
<meta name="robots" content="noindex">
<!-- 2026-11-07 木下「作字のフェーズで俺を導いてくれる道具を作ってくれないか？HABA とは違う」「パスツールでいじれるようにし、行きすぎたら赤くなるような。スライダーではなくパスをアームで掴む」
     仕組み：SVG を読み、パスのアンカーとハンドル（アーム）を直接掴んで動かす。動かすたびに測り、行きすぎ・足りない所を赤で示す。
     測れる所＝丸のはみ出し／まっすぐな字の下の線／線のつなぎ目の太り／字の間の白。測れない所（曲線の気持ちよさ・切り口の表情）は木下の目。
     ⚠️ 赤を全部消したら完成、ではない。赤は「見る所」の合図。わざとなら「狙い」で残す -->
<script src="https://cdn.jsdelivr.net/npm/paper@0.12.18/dist/paper-core.min.js"></script>
<script src="carve.js"></script>
<style>
:root{--bg:#1b1a19;--panel:#24221f;--line:#3a3733;--tx:#e9e4da;--sub:#9a9388;--red:#e0453a;--ok:#5fae6a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hiragino Kaku Gothic ProN",sans-serif;display:flex;height:100vh;overflow:hidden}
#panel{width:330px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:16px;overflow:auto}
h1{font-size:15px;margin:0 0 2px;letter-spacing:.1em}h1 b{font-size:17px}.lead{font-size:11px;color:var(--sub);line-height:1.6;margin:0 0 12px}
.grp{border-top:1px solid var(--line);padding:10px 0 6px}.t{font-size:11px;letter-spacing:.16em;color:var(--sub);margin-bottom:6px}
button{background:#33302c;color:var(--tx);border:1px solid var(--line);border-radius:4px;padding:8px 6px;font-size:12px;cursor:pointer;flex:1}button.on{background:var(--tx);color:#111}
.row{display:flex;gap:6px;margin-top:6px}
.step{display:grid;grid-template-columns:26px 1fr 34px;gap:8px;align-items:center;padding:8px 6px;border-radius:4px;cursor:pointer;margin-top:4px;border:1px solid transparent}
.step:hover{background:#2c2a26}.step.on{border-color:var(--tx);background:#2c2a26}.step .n{font-weight:800;color:var(--sub)}.step .c{font-size:12px;text-align:center;border-radius:10px;padding:1px 0;background:#333}
.step .c.ng{background:var(--red);color:#fff}.step .c.ok{background:var(--ok);color:#111}.step b{font-size:13px}
#coach{background:#151413;border:1px solid var(--line);border-radius:6px;padding:12px;font-size:12.5px;line-height:1.75;margin-top:8px}
#coach h3{margin:0 0 6px;font-size:14px}#coach .how{color:#ffd28a}#coach .ng{color:#ff8a80}
#stage{flex:1;position:relative;display:flex;flex-direction:column}
#cv{flex:1;width:100%;background:#f3f1ec;cursor:default}
#bar{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--panel);border-top:1px solid var(--line);font-size:12px;color:var(--sub)}
#bar button{flex:none;padding:6px 10px}
#mini{position:absolute;right:14px;bottom:56px;background:#fff;border-radius:6px;padding:8px 10px;display:none;gap:14px;align-items:flex-end;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#mini div{font-size:10px;color:#777;text-align:center}
#msg{min-height:1.4em}
label.ck{display:flex;gap:8px;align-items:center;font-size:12px;margin-top:6px;cursor:pointer}
</style></head><body>
<div id="panel">
  <h1><b>詰</b> TSUME</h1>
  <p class="lead">作字を、プロの見る所に沿って1つずつ詰める。パスのアンカーとハンドル（アーム）を掴んで動かすと、その場で測って、行きすぎ・足りない所が赤くなる。</p>
  <div class="grp"><div class="t">ファイル</div>
    <div class="row"><button id="bLoad">SVG を読む</button><button id="bSave">SVG で書き出す</button></div>
    <div class="row"><button id="bSample">見本（esta）</button><button id="bUndo">元に戻す ⌘Z</button></div>
    <div class="row"><button id="bModel">お手本を重ねる</button><button id="bModelLoad">お手本を読む</button></div>
    <div class="row"><button id="bCarve" style="flex:1">面にして、つなぎ目を削る（自動）</button></div>
    <input type="file" id="file" accept=".svg,image/svg+xml" hidden>
  </div>
  <div class="grp"><div class="t">今日見る所（上から順に）</div><div id="steps"></div>
    <label class="ck"><input type="checkbox" id="aim">この赤は「狙い」（わざと）＝数えない</label>
    <div id="coach"></div>
  </div>
  <div class="grp"><div class="t">見方を変える（プロの確かめ方）</div>
    <div class="row"><button id="vFlip">逆さ</button><button id="vMirror">左右反転</button><button id="vSmall">小さく</button><button id="vClean">印を隠す</button></div>
  </div>
  <div class="grp"><div class="t">使い方</div><p class="lead" style="margin:0">字をクリック → アンカー（四角）とハンドル（丸）が出る。<b>アンカー</b>を掴むと点が動き、<b>ハンドル</b>を掴むと曲がりが変わる（反対側も一緒に動く。Option を押しながらだと片側だけ）。青い点線（ガイド）も掴んで上下できる。矢印キーで1ずつ、Shift で10ずつ。</p></div>
</div>
<div id="stage"><canvas id="cv" resize></canvas><div id="mini"></div><div id="bar"><span id="msg"></span></div></div>
<script>
paper.setup('cv');
const {Path,Point,Layer,Group,Color,Rectangle,PointText}=paper;
const modelL=new Layer(),artL=new Layer(),guideL=new Layer(),markL=new Layer();artL.activate();let MODEL=false,MODELTXT=null,MODELFILE='model.svg';
let XH=0,BASE=0,STEP=0,VIEW={flip:false,mirror:false,clean:false},UNDO=[],FILE='sample',AIM={};
const $=id=>document.getElementById(id);const msg=t=>$('msg').textContent=t;
// ── 測る所（ステップ）
const STEPS=[
 {k:'over',goal:'緑の点線の帯（x の高さの 1〜4%）の中に、丸の一番下が入れば正解',t:'丸のはみ出し',what:'丸い字（e・s・a・o・c）の一番下は、並びの線から<b>少しだけ</b>下へ出す。出さないと丸だけ小さく見え、出しすぎると沈んで見える。',how:'丸の一番下のアンカーを掴んで、上下に動かす。目安は x の高さの <b>1〜4%</b>。⚠️ 一番下の点だけ動かすと丸がへこむ＝左右の点とハンドルも少し寄せて、丸みを保つ（お手本を重ねてその線に寄せる）'},
 {k:'flat',goal:'丸印が緑（並びの線から ±1% 以内）',t:'まっすぐな字の下',what:'縦の棒で終わる字（r・t の縦・a の縦など）の下は、並びの線に<b>ぴったり</b>。ずれると字が浮く・沈む。',how:'縦の棒の一番下のアンカーを掴んで、並びの線に合わせる（ずれ ±1% まで）。'},
 {k:'join',goal:'赤い丸が消える。r の肩なら、曲がりを低い所から始めて右へ伸ばし、内側の白を開ける。⚠️ 太さが一定の線（一本線）のままでは寄る所は少し太る＝<b>「面にして、つなぎ目を削る」ボタン</b>で面にする（まっすぐな線は削らず、平行に寄る曲線の側だけ細くする＝プロの仕上げと同じ考え）。そのあと気になる所だけ Illustrator で整える',t:'つなぎ目の太り',what:'線と線が重なる所は、黒が溜まって<b>太って見える</b>。プロはここを内側から少し削る。',how:'赤い丸の所。重なっている線のどちらかの端を短くするか、曲がりを少し内側へ。太さの目安は、ふつうの所の <b>1.5倍まで</b>（直角に交わる十字・T字は どう描いても √2＝1.41倍太る＝数えない）。'},
 {k:'gap',goal:'全部の帯が緑（白の量が ±25%）',t:'字の間の白',what:'字の間は、箱の間ではなく<b>白の量</b>でそろえる。斜め・丸の字の間は広く見え、縦の棒どうしは狭く見える。',how:'赤い帯の字を、字ごと左右に動かす（字をクリック → 線の上をドラッグで字ごと動く）。白がほかと <b>±25%</b> に入れば緑。'},
 {k:'look',goal:'逆さ・反転・小さくしても、1字だけ重い・軽い・浮くが無い。t の上の出っぱりなど「こぶ」に見える所は、伸ばすか無くすかを決める',t:'見方を変える',what:'慣れた向きで見ると、釣り合いの崩れに気づけない。<b>逆さ・左右反転・小さく</b>して見る。',how:'下のボタンで向きを変えて、気になる字を探す。ここは道具ではなく、木下の目。'},
 {k:'goal',t:'ゴール',what:'①方向の意味を一言で言える ②上の赤が全部消えた（または狙い）③16px・1色でも読める ④商品ロゴにも広げられる ⑤<b>一晩置いて</b>、翌日見ても直したい所が無い。',how:'⑤だけが木下の塩梅。1〜4 は確かめれば分かる。'}];
let RES={};
function renderSteps(){$('steps').innerHTML=STEPS.map((s,i)=>{const r=RES[s.k];const c=r==null?'':r>0?`<span class="c ng">${r}</span>`:'<span class="c ok">✓</span>';return `<div class="step ${i===STEP?'on':''}" data-i="${i}"><span class="n">${i+1}</span><b>${s.t}</b>${c||'<span class="c">—</span>'}</div>`}).join('');
  document.querySelectorAll('.step').forEach(e=>e.onclick=()=>{STEP=+e.dataset.i;renderSteps();analyze()});
  const s=STEPS[STEP];const r=RES[s.k];$('coach').innerHTML=`<h3>${STEP+1}. ${s.t}</h3><div>${s.what}</div><div class="how" style="margin-top:6px">直し方：${s.how}</div>${s.goal?`<div style="margin-top:6px;color:#9fe0a8">正解の目安：${s.goal}</div>`:''}${r>0?`<div class="ng" style="margin-top:6px">いま赤が ${r} か所</div>`:''}<div style="margin-top:6px;color:var(--sub)">迷ったら「お手本を重ねる」＝薄い赤の線にアンカーを寄せる</div>`;
  $('aim').checked=!!AIM[s.k]}
$('aim').onchange=()=>{AIM[STEPS[STEP].k]=$('aim').checked;analyze()};
// ── 読み込み
function letters(){return artL.getItems({class:paper.Path}).concat(artL.getItems({class:paper.CompoundPath})).filter(p=>!p.parent||!(p.parent instanceof paper.CompoundPath))}
function isLine(p){const all=artL.bounds;return p.bounds.width>all.width*0.6||/線|line/i.test(p.name||'')}
function loadSVG(txt,name){
  snapshot();artL.removeChildren();const it=artL.importSVG(txt,{expandShapes:true});FILE=name||'tsume';
  const doc=new DOMParser().parseFromString(txt,'image/svg+xml').documentElement;
  // プロの作法＝アンカーは字の一番上・下・左・右（極点）に置く。読んだ SVG に無ければ足す（弧で描いた円は半端な所に点が付く）
  let added=0;letters().forEach(p=>{for(let guard=0;guard<4;guard++){let did=false;
    for(const c of p.curves.slice()){if(!c.hasHandles())continue;const ts=[];
      [new Point(1,0),new Point(0,1)].forEach(tg=>{(c.getTimesWithTangent?c.getTimesWithTangent(tg):[]).forEach(t=>{if(t>0.02&&t<0.98)ts.push(t)})});
      if(ts.length){c.divideAtTime(ts.sort((x,y)=>x-y)[0]);added++;did=true;break}}
    if(!did)break}});
  // ガイド：SVG に data-xh / data-base があれば使う。無ければ字の下と上から推す
  const ls=letters().filter(p=>!isLine(p));
  const bots=ls.map(p=>p.strokeBounds.bottom).sort((a,b)=>a-b),tops=ls.map(p=>p.strokeBounds.top).sort((a,b)=>a-b);
  const ox=it.bounds.x,oy=it.bounds.y;  // importSVG はそのままの座標
  XH=doc.getAttribute('data-xh')!=null?+doc.getAttribute('data-xh'):tops[Math.floor(tops.length/2)];
  BASE=doc.getAttribute('data-base')!=null?+doc.getAttribute('data-base'):bots[0];
  fit();drawGuides();drawModel();analyze();msg(`${name||''} を読んだ：字 ${ls.length}・線 ${letters().length-ls.length}`+(added?`／極点にアンカーを ${added} 個足した（プロの作法）`:''))}
function fit(){const b=artL.bounds.unite(new Rectangle(artL.bounds.x,XH-40,10,BASE-XH+80));const v=paper.view;const z=Math.min(v.viewSize.width/(b.width+160),v.viewSize.height/(b.height+200));v.zoom=z;v.center=b.center;applyView()}
function applyView(){const v=paper.view;v.matrix=new paper.Matrix();const b=artL.bounds.unite(new Rectangle(artL.bounds.x,XH-40,10,BASE-XH+80));const z=Math.min(v.viewSize.width/(b.width+160),v.viewSize.height/(b.height+200));
  v.zoom=z;v.center=b.center;if(VIEW.flip)v.rotate(180,b.center);if(VIEW.mirror)v.scale(-1,1,b.center)}
// ── ガイド
let GL={};
function drawGuides(){guideL.removeChildren();guideL.activate();const b=artL.bounds;const x1=b.left-200,x2=b.right+200;
  const mk=(y,name,lab)=>{const l=new Path.Line(new Point(x1,y),new Point(x2,y));l.strokeColor='#2f6fb2';l.strokeWidth=1.5/paper.view.zoom;l.dashArray=[8/paper.view.zoom,6/paper.view.zoom];l.name=name;
    const t=new PointText(new Point(x1+6/paper.view.zoom,y-6/paper.view.zoom));t.content=lab;t.fillColor='#2f6fb2';t.fontSize=12/paper.view.zoom;GL[name]=l};
  mk(XH,'xh','x の高さ');mk(BASE,'base','並びの線');artL.activate()}
// ── 測る
function strokeHalf(p){return p.strokeColor&&p.strokeWidth&&(!p.fillColor||p.fillColor.alpha===0)?p.strokeWidth/2:0}
function bottomInfo(p){ // 一番下の点と、そこが曲線かどうか
  let best=null;p.curves.forEach(c=>{for(let i=0;i<=20;i++){const t=i/20;const pt=c.getPointAtTime(t);if(!best||pt.y>best.pt.y)best={pt,c,t}}});
  if(!best)return null;
  // 線（ストローク）の外側：平らな端（butt）で縦に終わる所は線の太さを足さない。横向きに終わる・曲がっている所は半分足す
  const tg=best.c.getTangentAtTime(Math.min(Math.max(best.t,0.001),0.999));const h=strokeHalf(p)*Math.abs(tg.x);
  // 丸＝一番下が「曲線の途中」か「両側が曲線の点」。開いたパスの端（t の下の曲がりの終わりなど）は線の端＝丸ではない
  let round=false;if(best.t>0.02&&best.t<0.98)round=best.c.hasHandles();
  else{const seg=best.t<=0.02?best.c.segment1:best.c.segment2;const end=!p.closed&&(seg.isFirst()||seg.isLast());
    // 面（アウトライン）で一番下が「角」＝線の切り口（t の曲がりの終わりなど）。丸ではない
    const ti=seg.curve&&seg.previous?seg.previous.curve.getTangentAtTime(1):null,to=seg.curve?seg.curve.getTangentAtTime(0):null;const corner=ti&&to&&Math.abs(ti.getDirectedAngle(to))>30;
    round=!end&&!corner&&(!seg.handleIn.isZero()||!seg.handleOut.isZero())}
  return {y:best.pt.y+h,x:best.pt.x,round}}
function rowsEdge(p,y,side){ // y の高さで、字の右端／左端（線の太さ込み）
  const l=new Path.Line({from:[p.bounds.left-1000,y],to:[p.bounds.right+1000,y],insert:false});const xs=p.getIntersections(l).map(i=>i.point.x);l.remove();
  if(!xs.length)return null;const h=strokeHalf(p);return side==='r'?Math.max(...xs)+h:Math.min(...xs)-h}
function rasterThick(cb){ // 線の太り：書き出した絵で距離を測る
  const svgS=artL.exportSVG({asString:true,bounds:'content'});const b=artL.strokeBounds;
  const sc=Math.min(3,1400/b.width);const W=Math.ceil(b.width*sc)+4,H=Math.ceil(b.height*sc)+4;
  const wrap=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="${b.x-2/sc} ${b.y-2/sc} ${W/sc} ${H/sc}">${svgS}</svg>`;
  const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');g.drawImage(img,0,0);
    const d=g.getImageData(0,0,W,H).data;const D=new Float32Array(W*H);for(let i=0;i<W*H;i++)D[i]=d[i*4+3]>127?1e9:0;
    const a=1,dg=1.4142;for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x;if(!D[i])continue;let m=D[i];if(x>0)m=Math.min(m,D[i-1]+a);if(y>0){m=Math.min(m,D[i-W]+a);if(x>0)m=Math.min(m,D[i-W-1]+dg);if(x<W-1)m=Math.min(m,D[i-W+1]+dg)}D[i]=m}
    for(let y=H-1;y>=0;y--)for(let x=W-1;x>=0;x--){const i=y*W+x;if(!D[i])continue;let m=D[i];if(x<W-1)m=Math.min(m,D[i+1]+a);if(y<H-1){m=Math.min(m,D[i+W]+a);if(x<W-1)m=Math.min(m,D[i+W+1]+dg);if(x>0)m=Math.min(m,D[i+W-1]+dg)}D[i]=m}
    const pts=[];for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const i=y*W+x,v=D[i];if(v<2)continue;let mx=true;for(const o of [-1,1,-W,W,-W-1,-W+1,W-1,W+1])if(D[i+o]>v){mx=false;break}if(mx)pts.push([x,y,v])}
    const ws=pts.map(p=>p[2]).sort((a,b)=>a-b);const med=ws[Math.floor(ws.length*0.5)]||1;
    const bins={};pts.forEach(([x,y,v])=>{if(v>med*1.5){const k=Math.round(x/40)+','+Math.round(y/40);if(!bins[k]||bins[k][2]<v)bins[k]=[x,y,v]}});
    cb(Object.values(bins).map(([x,y,v])=>({p:new Point(b.x+(x-2)/sc,b.y+(y-2)/sc),r:v/sc,ratio:v/med})),med*2/sc)};
  img.src='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(wrap)))}
let busy=0;
function analyze(){clearTimeout(busy);busy=setTimeout(analyzeNow,60)}
function analyzeNow(){
  markL.removeChildren();markL.activate();const z=paper.view.zoom;const H=BASE-XH||1;const ls=letters().filter(p=>!isLine(p));RES={};
  const show=k=>!VIEW.clean&&(STEPS[STEP].k===k||STEPS[STEP].k==='goal');
  const RED_=()=>new Color(0.88,0.27,0.23),GRN_=()=>new Color(0.37,0.68,0.42);const red=RED_(),green=GRN_();   // ⚠️ 色は使うたびに作る（共有すると帯の半透明が文字にまで移る）
  const lab=(pt,t,c)=>{const x=new PointText(pt);x.content=t;x.fillColor=c;x.fontSize=13/z;x.fontWeight='bold';return x};
  // 1・2 はみ出し／まっすぐ
  let nOver=0,nFlat=0;
  ls.forEach(p=>{const bi=bottomInfo(p);if(!bi)return;const dev=(bi.y-BASE)/H*100;
    if(bi.round){const bad=dev>4.5||dev<0.8;if(bad)nOver++;
      if(show('over')){const zb=new Path.Rectangle(new Rectangle(new Point(p.bounds.left-6/z,BASE+H*0.01),new Point(p.bounds.right+6/z,BASE+H*0.04)));zb.fillColor=GRN_();zb.fillColor.alpha=.18;zb.strokeColor=green;zb.strokeWidth=1/z;zb.dashArray=[4/z,3/z]}
      if(show('over')){const r=new Path.Rectangle(new Rectangle(new Point(p.bounds.left,BASE),new Point(p.bounds.right,bi.y)));r.fillColor=bad?RED_():GRN_();r.fillColor.alpha=.35;
        lab(new Point(p.bounds.center.x-30/z,bi.y+22/z),(dev>4.5?'出すぎ ':dev<0.8?'足りない ':'')+dev.toFixed(1)+'%',bad?red:green)}}
    else{const bad=Math.abs(dev)>1.0;if(bad)nFlat++;
      if(show('flat')){const c=new Path.Circle(new Point(bi.x,bi.y),10/z);c.strokeColor=bad?red:green;c.strokeWidth=3/z;lab(new Point(bi.x+14/z,bi.y+18/z),(dev>0?'+':'')+dev.toFixed(1)+'%',bad?red:green)}}});
  RES.over=AIM.over?0:nOver;RES.flat=AIM.flat?0:nFlat;
  // 4 字の間
  const S=ls.slice().sort((a,b)=>a.bounds.left-b.bounds.left);const gaps=[];
  for(let i=0;i<S.length-1;i++){const A=S[i],B=S[i+1];const gs=[];for(let k=1;k<30;k++){const y=XH+H*k/30;let r=rowsEdge(A,y,'r'),l=rowsEdge(B,y,'l');if(r==null)r=A.bounds.left;if(l==null)l=B.bounds.right;gs.push(l-r)}
    const mn=Math.min(...gs),cap=mn+H*0.22;gaps.push({A,B,w:gs.reduce((s,g)=>s+Math.min(g,cap),0)/gs.length})}
  const med=gaps.map(g=>g.w).sort((a,b)=>a-b)[Math.floor(gaps.length/2)]||1;let nGap=0;
  gaps.forEach(g=>{const d=g.w/med-1,bad=Math.abs(d)>0.25;if(bad)nGap++;if(show('gap')){const x1=g.A.bounds.right,x2=g.B.bounds.left;const r=new Path.Rectangle(new Rectangle(new Point(Math.min(x1,x2),XH),new Point(Math.max(x1,x2)+(x1>x2?0:0),BASE)));r.fillColor=bad?RED_():GRN_();r.fillColor.alpha=.22;
    lab(new Point((x1+x2)/2-16/z,BASE+40/z),(d>0?'+':'')+(d*100).toFixed(0)+'%',bad?red:green)}});
  RES.gap=AIM.gap?0:nGap;
  // 3 つなぎ目（非同期）
  rasterThick((spots,w)=>{RES.join=AIM.join?0:spots.length;if(show('join')){markL.activate();spots.forEach(s=>{const c=new Path.Circle(s.p,Math.max(s.r*1.6,14/z));c.strokeColor=red;c.strokeWidth=3/z;lab(s.p.add(new Point(s.r*1.6+4/z,-4/z)),'×'+s.ratio.toFixed(2),red)})}renderSteps();paper.view.update()});
  renderSteps();artL.activate()}
// ── 掴む
let drag=null,sel=null;const tool=new paper.Tool();
function selectItem(p){artL.getItems({}).forEach(i=>i.selected=false);sel=p;if(p){p.fullySelected=true}}
tool.onMouseDown=e=>{const z=paper.view.zoom;
  const gh=guideL.hitTest(e.point,{stroke:true,tolerance:8/z});if(gh&&gh.item&&(gh.item.name==='xh'||gh.item.name==='base')){snapshot();drag={guide:gh.item.name};return}
  const h=artL.hitTest(e.point,{segments:true,handles:true,stroke:true,fill:true,tolerance:9/z});
  if(!h){selectItem(null);drag=null;return}
  snapshot();
  if(h.type==='handle-in'||h.type==='handle-out'){drag={seg:h.segment,which:h.type==='handle-in'?'handleIn':'handleOut',alt:e.modifiers.option||e.modifiers.alt};selectItem(h.item);return}
  if(h.type==='segment'){drag={seg:h.segment};selectItem(h.item);return}
  selectItem(h.item);drag={item:h.item}};
tool.onMouseDrag=e=>{if(!drag)return;
  if(drag.guide){if(drag.guide==='xh')XH=e.point.y;else BASE=e.point.y;drawGuides();analyze();return}
  if(drag.seg&&drag.which){const s=drag.seg;s[drag.which]=s[drag.which].add(e.delta);if(!drag.alt){const o=drag.which==='handleIn'?'handleOut':'handleIn';if(!s[o].isZero()){const len=s[o].length;s[o]=s[drag.which].normalize(-len)}}}
  else if(drag.seg)drag.seg.point=drag.seg.point.add(e.delta);
  else if(drag.item)drag.item.position=drag.item.position.add(new Point(e.delta.x,0));   // 字ごとは横だけ（字の間を詰める）
  analyze()};
tool.onMouseUp=()=>{drag=null};
tool.onKeyDown=e=>{if((e.modifiers.meta||e.modifiers.control)&&e.key==='z'){undo();return false}
  const st=e.modifiers.shift?10:1;const dv={left:[-st,0],right:[st,0],up:[0,-st],down:[0,st]}[e.key];if(!dv)return;
  const segs=artL.getItems({}).flatMap(i=>i.segments?i.segments.filter(s=>s.selected):[]);snapshot();
  if(segs.length&&segs.length<(sel&&sel.segments?sel.segments.length:1e9))segs.forEach(s=>s.point=s.point.add(dv));else if(sel)sel.position=sel.position.add(new Point(dv[0],0));
  analyze();return false};
// ── 元に戻す・保存
function snapshot(){UNDO.push({j:artL.exportJSON(),XH,BASE});if(UNDO.length>60)UNDO.shift()}
function undo(){const s=UNDO.pop();if(!s)return;artL.removeChildren();artL.importJSON(s.j);XH=s.XH;BASE=s.BASE;drawGuides();analyze();msg('元に戻した')}
$('bUndo').onclick=undo;
$('bSave').onclick=()=>{selectItem(null);const s=artL.exportSVG({asString:true,bounds:'content'});const b=artL.strokeBounds;
  const out=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${b.x} ${b.y} ${b.width} ${b.height}" data-xh="${XH}" data-base="${BASE}">${s}</svg>`;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'image/svg+xml'}));const d=new Date(),p=n=>String(n).padStart(2,'0');a.download=`tsume_${FILE}_${d.getMonth()+1}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.svg`;a.click();msg('SVG を書き出した（ガイドの位置も入っている）')};
$('bLoad').onclick=()=>$('file').click();
// お手本＝木下へのたたき（正解の一つの目安）。薄い赤で下に重ねる。掴んだアンカーをお手本の線に合わせていけばいい
function drawModel(){modelL.removeChildren();if(!MODEL||!MODELTXT)return;modelL.activate();const it=modelL.importSVG(MODELTXT);it.getItems({class:paper.Path}).forEach(q=>{q.strokeColor=new Color(0.88,0.27,0.23,0.35)});artL.activate();paper.view.update()}
$('bCarve').onclick=()=>{selectItem(null);const ls=letters();if(!ls.some(p=>p.strokeColor&&p.strokeWidth&&(!p.fillColor||p.fillColor.alpha===0))){msg('もう面になっている（削るのは線の字のときだけ）');return}
  const inner=artL.exportSVG({asString:true});const b=artL.strokeBounds;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${b.x} ${b.y} ${b.width} ${b.height}" data-xh="${XH}" data-base="${BASE}">${inner}</svg>`;
  let r;try{r=tsumeCarve(svg)}catch(e){msg('削れなかった：'+e.message);return}
  loadSVG(r.sep,FILE+'_面');msg('面にして、つなぎ目を削った（'+r.report+'）＝まっすぐな線はそのまま・曲線の寄る側だけ細く。⌘Z で線に戻る')};
$('bModel').onclick=()=>{MODEL=!MODEL;$('bModel').classList.toggle('on',MODEL);if(MODEL&&!MODELTXT){fetch(MODELFILE).then(r=>r.text()).then(t=>{MODELTXT=t;drawModel()})}else drawModel();msg(MODEL?'お手本（薄い赤）を下に重ねた＝アンカーをこの線に寄せていく':'お手本を外した')};
$('bModelLoad').onclick=()=>fetch(MODELFILE).then(r=>r.text()).then(t=>{MODELTXT=t;loadSVG(t,'お手本');msg('お手本を読んだ＝赤が少ない状態の一例（つなぎ目の赤は、最後に Illustrator で面にして削る所）')});
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>loadSVG(t,f.name.replace(/\.svg$/,'')));e.target.value=''};
$('bSample').onclick=()=>fetch('sample.svg').then(r=>r.text()).then(t=>loadSVG(t,'esta'));
// ── 見方
const tg=(id,k)=>$(id).onclick=()=>{VIEW[k]=!VIEW[k];$(id).classList.toggle('on',VIEW[k]);applyView();drawGuides();analyze()};
tg('vFlip','flip');tg('vMirror','mirror');tg('vClean','clean');
$('vSmall').onclick=()=>{const m=$('mini');if(m.style.display==='flex'){m.style.display='none';$('vSmall').classList.remove('on');return}
  selectItem(null);const s=artL.exportSVG({asString:true,bounds:'content'});const b=artL.strokeBounds;const src='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${b.x} ${b.y} ${b.width} ${b.height}">${s}</svg>`)));
  m.innerHTML=[48,24,16].map(h=>`<div><img src="${src}" style="height:${h}px;display:block"><span>${h}px</span></div>`).join('');m.style.display='flex';$('vSmall').classList.add('on')};
paper.view.onResize=()=>{applyView();drawGuides();analyze()};
window.__tsume={analyzeNow,get RES(){return RES},letters,loadSVG,get XH(){return XH},get BASE(){return BASE},bottomInfo};
renderSteps();$('bSample').click();
</script>
