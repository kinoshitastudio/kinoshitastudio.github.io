<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#1d1d1b;--panel:#252522;--ink:#e8e5de;--faint:#8a8a80;--line:#33332f;--gold:#a89060;--live:#5a9c6a}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'SF Mono','Space Mono',ui-monospace,monospace;font-size:11px;display:flex;flex-direction:column}
  header{padding:12px 14px 9px;border-bottom:1px solid var(--line);flex-shrink:0;position:relative}
  .langbtn{position:absolute;top:11px;right:12px;font-family:inherit;font-size:9px;letter-spacing:.1em;border:1px solid var(--line);background:var(--panel);color:var(--faint);border-radius:5px;padding:4px 8px;cursor:pointer}
  .langbtn:hover{border-color:var(--gold);color:var(--gold)}
  .logo{font-weight:700;letter-spacing:.26em;font-size:11px}
  .logo svg{vertical-align:-3px;margin-right:8px}
  .logo span{color:var(--gold)}
  .sub{color:var(--faint);font-size:9px;letter-spacing:.1em;margin-top:3px;line-height:1.5}
  .body{flex:1;display:flex;flex-direction:column;padding:10px 14px;gap:8px;min-height:0}
  label{color:var(--faint);font-size:9px;letter-spacing:.18em;text-transform:uppercase}
  textarea{flex:1;width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;
    font-family:inherit;font-size:10.5px;line-height:1.55;padding:10px;resize:none;outline:none;tab-size:2}
  textarea:focus{border-color:var(--gold)}
  .btns{display:flex;gap:8px;flex-shrink:0}
  button{font-family:inherit;font-size:10px;letter-spacing:.12em;text-transform:uppercase;border-radius:6px;
    padding:9px 12px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);transition:.15s;white-space:nowrap}
  button:hover{border-color:var(--gold);color:#fff}
  button.primary{background:var(--gold);color:#1a1a18;border-color:var(--gold);font-weight:700;flex:1}
  button.primary:hover{filter:brightness(1.08)}
  .hint{color:var(--faint);font-size:9px;letter-spacing:.04em;line-height:1.6}
  .hint code{color:var(--gold)}
  .live-box{border:1px solid var(--line);border-radius:6px;padding:9px 10px;display:flex;flex-direction:column;gap:8px;flex-shrink:0}
  .live-top{display:flex;align-items:center;gap:8px}
  .dot{width:7px;height:7px;border-radius:50%;background:#555;flex-shrink:0;transition:.2s}
  .dot.on{background:var(--live);box-shadow:0 0 7px var(--live)}
  .live-title{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  .live-status{margin-left:auto;font-size:9px;color:var(--faint)}
  .live-row{display:flex;gap:8px}
  input[type=text]{flex:1;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:5px;
    font-family:inherit;font-size:10px;padding:7px 9px;outline:none}
  input[type=text]:focus{border-color:var(--gold)}
  input[type=text]:disabled{opacity:.5}
  button.live-btn{flex-shrink:0}
  button.live-btn.on{background:var(--live);color:#0e1a12;border-color:var(--live);font-weight:700}
  .nav{display:flex;gap:8px;flex-shrink:0}
  .nav button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px}
  .nav button .ic{font-size:12px;letter-spacing:0}
  /* チャット（パネル内蔵） */
  .chat{flex:1;display:flex;flex-direction:column;min-height:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .chat-head{display:flex;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);background:var(--panel);flex-shrink:0}
  .chat-head .ct{font-size:8.5px;letter-spacing:.12em;color:var(--faint);text-transform:uppercase}
  .chat-head button{margin-left:auto;border:none;background:none;color:var(--faint);font-size:13px;padding:2px 6px;cursor:pointer}
  .chat-head button:hover{color:var(--gold)}
  .feed{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:9px;min-height:70px}
  .msg{display:flex;flex-direction:column;gap:2px}
  .msg .who{font-size:8px;letter-spacing:.12em;color:var(--faint);text-transform:uppercase}
  .msg .bd{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:11px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
  .msg.me .bd{background:#2a2a22;border-color:#3a3a30}
  .msg.ms .bd{border-color:#46402f}
  .msg.err .bd{border-color:#a5564e;color:#e6b3ac}
  .msg.think .bd{color:var(--gold)}
  .spin{display:inline-block;animation:rot 1.1s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}
  .loadring{display:inline-block;width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;vertical-align:-2px;margin-right:7px;animation:rot .7s linear infinite}
  .secs{color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
  .hello{color:var(--faint);font-size:10px;line-height:1.7;text-align:center;padding:12px 6px}
  .hello b{color:var(--gold)}
  .ex{display:flex;flex-direction:column;gap:6px;margin-top:10px}
  .ex button{font-family:inherit;font-size:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:14px;padding:6px 10px;cursor:pointer;text-transform:none;letter-spacing:0}
  .ex button:hover{border-color:var(--gold);color:#fff}
  .composer{display:flex;flex-direction:column;gap:7px;padding:8px;border-top:1px solid var(--line);flex-shrink:0}
  .composer textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:7px;font-family:inherit;font-size:11px;line-height:1.4;padding:8px;resize:none;outline:none;max-height:120px;min-height:40px}
  .composer textarea:focus{border-color:var(--gold)}
  .composer button{padding:10px 13px}
  .composer-row{display:flex;gap:7px}
  .composer-row .primary{flex:1}
  .composer .iconbtn{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--ink);font-size:14px;padding:9px 12px}
  .composer .iconbtn:hover{border-color:var(--gold)}
  .composer .iconbtn.on{border-color:var(--gold);color:var(--gold)}
  .attachchip{display:none;align-items:center;gap:8px;padding:6px 8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;font-size:10px;color:var(--faint)}
  .attachchip.show{display:flex}
  .attachchip img{width:32px;height:32px;object-fit:cover;border-radius:5px}
  .attachchip .x{margin-left:auto;border:none;background:none;color:var(--faint);cursor:pointer;font-size:12px;padding:2px 4px}
  .chat.dragover{outline:2px dashed var(--gold);outline-offset:-4px}
  .msg .bd img{max-width:100%;border-radius:6px;margin-top:5px;display:block}
  .manual{flex-shrink:0}
  .manual summary{cursor:pointer;color:var(--faint);font-size:9px;letter-spacing:.14em;text-transform:uppercase;list-style:none;padding:4px 0;display:flex;align-items:center}
  .manual summary .credit{margin-left:auto;color:var(--faint);letter-spacing:.16em;text-transform:none}
  .manual summary::-webkit-details-marker{display:none}
  .manual textarea{flex:none;height:150px;margin-top:8px}
  .nav button.on{background:var(--gold);color:#1a1a18;border-color:var(--gold);font-weight:700}
  .savelib{flex-shrink:0;width:100%;font-family:inherit;font-size:10px;letter-spacing:.08em;padding:8px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--faint);cursor:pointer;transition:.15s}
  .savelib:hover{border-color:var(--gold);color:var(--gold)}
  .view{flex:1;display:flex;flex-direction:column;min-height:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .frameview iframe{flex:1;width:100%;border:none;background:#1b1b19}
  /* オンボーディング（初回モーダル） */
  .onboard{position:fixed;inset:0;z-index:200;background:var(--bg);display:none;flex-direction:column;padding:20px 20px 16px}
  .onboard.show{display:flex}
  .ob-top{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .ob-top .lg{font-weight:700;letter-spacing:.2em;font-size:11px}
  .ob-skip{margin-left:auto;background:none;border:none;color:var(--faint);font-family:inherit;font-size:10px;letter-spacing:.1em;cursor:pointer;padding:4px}
  .ob-skip:hover{color:var(--ink)}
  .ob-card{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:11px;padding:8px 4px}
  .ob-ico{font-size:30px;line-height:1}
  .ob-step{font-size:9px;letter-spacing:.22em;color:var(--gold);text-transform:uppercase}
  .ob-t{font-size:16px;font-weight:700;color:#fff;letter-spacing:.02em}
  .ob-d{font-size:11.5px;line-height:1.75;color:var(--faint)}
  .ob-d b{color:var(--ink)}
  .ob-code{font-family:inherit;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px 12px;font-size:11px;line-height:1.6;white-space:pre;text-align:left;color:#e7dcc6;overflow-x:auto}
  .ob-dots{display:flex;gap:6px;justify-content:center;margin:8px 0 12px}
  .ob-dots i{width:6px;height:6px;border-radius:50%;background:var(--line);transition:.2s}
  .ob-dots i.on{background:var(--gold);transform:scale(1.15)}
  .ob-nav{display:flex;gap:8px;flex-shrink:0}
  .ob-nav button{flex:1}
  .ob-nav .back{flex:0 0 auto;padding-left:14px;padding-right:14px}
</style>
</head>
<body>
  <header>
    <button class="langbtn" id="helpbtn" style="right:46px;padding:4px 9px" title="使い方">?</button>
    <button class="langbtn" id="langbtn">EN</button>
    <div class="logo"><svg width="22" height="15" viewBox="2 9 46 32" fill="none" stroke="#a89060" stroke-width="4.2" stroke-linecap="round"><path d="M25 25 C25 11 4 11 4 25 C4 39 25 39 25 25 C25 11 46 11 46 25 C46 39 25 39 25 25 Z"/></svg>M O T H E R S H I P<span> ·</span></div>
  </header>
  <div class="body">

    <div class="nav">
      <button id="nav-studio"><span class="ic">✎</span><span data-i18n="studio">編集 ↗</span></button>
      <button id="nav-library"><span class="ic">▤</span><span data-i18n="library">ライブラリ ↗</span></button>
    </div>

    <div class="live-box">
      <div class="live-top">
        <span class="dot" id="dot"></span>
        <span class="live-title" data-i18n="live">Live — Claude Code 連携</span>
        <span class="live-status" id="status">未接続</span>
      </div>
      <div class="live-row">
        <input type="text" id="relay" value="http://localhost:4575" spellcheck="false">
        <button class="live-btn" id="connect">接続</button>
      </div>
    </div>

    <!-- ===== チャット（パネル内蔵） ===== -->
    <div class="view chat" id="view-chat">
      <div class="chat-head"><span class="ct" data-i18n="chat_head">💬 Mothershipに話しかける</span><button id="chatclear" title="チャットをクリア" style="margin-left:auto">🗑</button><button class="pop" data-url="/chat.html" data-i18n="pop" style="margin-left:0">↗ 大きい画面</button></div>
      <div class="feed" id="feed">
        <div class="hello" id="hello">
          <div><b data-i18n="hello1">依頼するとデザインができる。</b></div>
          <div data-i18n="hello2">claude が mothership.json を編集 → 接続中のFigmaに生成（Maxで動作・API課金なし）</div>
          <div class="ex">
            <button data-i18n="ex1">シンプルな料金表を3プランで作って</button>
            <button data-i18n="ex2">木下スタジオ調のミニマルなKVを作って</button>
            <button data-i18n="ex3">見出しをもっと大きく、余白を広げて</button>
          </div>
        </div>
      </div>
      <div class="composer">
        <div class="attachchip" id="attachchip"><img id="attachthumb" alt=""><span id="attachname">画像</span><button class="x" id="attachclear">✕</button></div>
        <textarea id="cinput" rows="1" placeholder="作りたいデザインを書いて Enter（改行 Shift+Enter）"></textarea>
        <div class="composer-row">
          <button class="iconbtn" id="attachbtn" title="画像を添付（ドラッグでもOK）">📎</button>
          <button class="iconbtn" id="imgbtn" title="画像プロンプト生成モード（MJ/DALL·E用のプロンプトを作る）">🎨</button>
          <button class="primary" id="csend" data-i18n="send">送信</button>
        </div>
        <input type="file" id="attachinput" accept="image/*" style="display:none">
      </div>
    </div>

    <!-- ===== 手動JSON（折りたたみ） ===== -->
    <details class="manual">
      <summary><span data-i18n="manual">⚙ 手動JSON / 生成</span><span class="credit">Kinoshita Studio</span></summary>
      <textarea id="json" spellcheck="false"></textarea>
      <div class="hint" data-i18n="mhint">tokens を @colors.accent で参照可。type: frame / text / rect / ellipse / line / image。</div>
      <div class="btns">
        <button id="example" data-i18n="example">例を読込</button>
        <button id="generate" class="primary" data-i18n="generate">Figmaに生成 →</button>
      </div>
    </details>
  </div>

<div class="onboard" id="onboard"></div>

<script>
  var EXAMPLE = {
    "name": "Sample Screen",
    "tokens": {
      "colors": { "bg": "#1a1a18", "panel": "#2a2a28", "ink": "#e8e5de", "faint": "#8a8a80", "accent": "#a89060" },
      "text": { "h1": 26, "body": 13, "label": 10 }
    },
    "root": {
      "type": "frame", "name": "Screen", "w": 390, "h": 720, "fill": "@colors.bg",
      "layout": { "mode": "vertical", "gap": 20, "padding": 28, "align": "stretch" },
      "children": [
        { "type": "text", "name": "Eyebrow", "text": "— KINOSHITA STUDIO", "fill": "@colors.accent", "font": { "size": "@text.label", "weight": 500 } },
        { "type": "text", "name": "Title", "text": "体験を、翻訳する。", "fill": "@colors.ink", "font": { "size": "@text.h1", "weight": 700 } },
        { "type": "text", "name": "Lead", "text": "届けたい体験と届いている体験のズレを揃える。設計から実装まで一人で担う。", "fill": "@colors.faint", "font": { "size": "@text.body", "weight": 400, "lineHeight": 22 } },
        {
          "type": "frame", "name": "Card", "fill": "@colors.panel", "radius": 14, "stretch": true,
          "layout": { "mode": "vertical", "gap": 8, "padding": 18 },
          "children": [
            { "type": "text", "name": "Card Title", "text": "Card", "fill": "@colors.ink", "font": { "size": 15, "weight": 600 } },
            { "type": "text", "name": "Card Body", "text": "オートレイアウトで縦に積まれた本物のFigmaフレーム。そのまま編集できます。", "fill": "@colors.faint", "font": { "size": 12, "weight": 400, "lineHeight": 20 } }
          ]
        },
        {
          "type": "frame", "name": "Button", "fill": "@colors.accent", "radius": 999, "stretch": true,
          "layout": { "mode": "horizontal", "gap": 8, "padding": { "top": 13, "bottom": 13 }, "justify": "center", "align": "center" },
          "children": [
            { "type": "text", "name": "Button Label", "text": "詳しく見る →", "fill": "#1a1a18", "font": { "size": 12, "weight": 700 } }
          ]
        }
      ]
    }
  };

  var ta = document.getElementById('json');
  ta.value = JSON.stringify(EXAMPLE, null, 2);

  document.getElementById('example').onclick = function () { ta.value = JSON.stringify(EXAMPLE, null, 2); };
  document.getElementById('generate').onclick = function () {
    parent.postMessage({ pluginMessage: { type: 'generate', json: ta.value } }, '*');
  };

  /* ---------- i18n (EN / 日本語) ---------- */
  var I18N = {
    ja: { sub:'設計の原本(JSON)を、編集可能な本物のFigmaノードに翻訳する。', studio:'編集 ↗', library:'ライブラリ ↗', live:'Live — Claude Code 連携', chat_head:'💬 Mothershipに話しかける', pop:'↗ 大きい画面', hello1:'依頼するとデザインができる。', hello2:'claude が mothership.json を編集 → 接続中のFigmaに生成（Maxで動作・API課金なし）', ex1:'シンプルな料金表を3プランで作って', ex2:'木下スタジオ調のミニマルなKVを作って', ex3:'見出しをもっと大きく、余白を広げて', ph:'作りたいデザインを書いて Enter（改行 Shift+Enter）', send:'送信', manual:'⚙ 手動JSON / 生成', mhint:'tokens を @colors.accent で参照可。type: frame / text / rect / ellipse / line / image。', example:'例を読込', generate:'Figmaに生成 →', off:'未接続', connect:'接続', disconnect:'切断', wait:'relay待機中…', connecting:'接続中…', conn:'接続中', you:'あなた', think:'考え中…（mothership.json を編集）', done:'（完了）', err:'エラー', fail:'失敗', noconn:'relayに接続できません。cd mothership && node relay.js で起動してね', savelib:'＋ 現在のデザインをライブラリに保存', saved:'ライブラリに保存しました', savefail:'保存に失敗', notconn:'未接続：「接続」を押すとFigmaに反映されます', langlabel:'EN' },
    en: { sub:'Translate one source-of-truth JSON into real, editable Figma nodes.', studio:'Edit ↗', library:'Library ↗', live:'Live — Claude Code', chat_head:'💬 Talk to Mothership', pop:'↗ Full screen', hello1:'Describe it — Mothership builds it.', hello2:'claude edits mothership.json → builds natively in the connected Figma (runs on Max, no API cost).', ex1:'Make a simple 3-plan pricing table', ex2:'Make a minimal hero, Kinoshita Studio style', ex3:'Make the heading bigger, add whitespace', ph:'Describe a design, press Enter (Shift+Enter = newline)', send:'Send', manual:'⚙ Manual JSON / Generate', mhint:'Reference tokens via @colors.accent. type: frame / text / rect / ellipse / line / image.', example:'Load example', generate:'Generate in Figma →', off:'Offline', connect:'Connect', disconnect:'Disconnect', wait:'waiting for relay…', connecting:'connecting…', conn:'connected', you:'You', think:'Thinking… (editing mothership.json)', done:'(done)', err:'Error', fail:'failed', noconn:'Cannot reach relay. Run: cd mothership && node relay.js', savelib:'＋ Save current design to Library', saved:'Saved to Library', savefail:'Save failed', notconn:'Not connected — press Connect to build in Figma', langlabel:'日本語' }
  };
  var lang = (function () { try { return localStorage.getItem('ms_lang') || 'ja'; } catch (e) { return 'ja'; } })();
  function tr(k) { return (I18N[lang] || I18N.ja)[k]; }
  function applyLang() {
    document.querySelectorAll('[data-i18n]').forEach(function (e) { var v = tr(e.getAttribute('data-i18n')); if (v != null) e.textContent = v; });
    document.getElementById('langbtn').textContent = tr('langlabel');
    var ci = document.getElementById('cinput'); if (ci) ci.placeholder = tr('ph');
    var cb = document.getElementById('connect'); if (cb) cb.textContent = connected ? tr('disconnect') : tr('connect');
    if (!connected) { var s = document.getElementById('status'); if (s) s.textContent = tr('off'); }
    document.documentElement.lang = lang;
  }
  function toggleLang() { lang = (lang === 'ja') ? 'en' : 'ja'; try { localStorage.setItem('ms_lang', lang); } catch (e) {} applyLang(); }
  document.getElementById('langbtn').onclick = toggleLang;

  /* ---------- Live (relay polling) ---------- */
  var timer = null, lastVer = -1, connected = false;
  var dot = document.getElementById('dot'), statusEl = document.getElementById('status');
  var connectBtn = document.getElementById('connect'), relayInput = document.getElementById('relay');

  function setStatus(t, on) { statusEl.textContent = t; dot.classList.toggle('on', !!on); }

  async function poll() {
    var url = relayInput.value.replace(/\/+$/, '') + '/pull';
    try {
      var r = await fetch(url, { cache: 'no-store' });
      var data = await r.json();
      setStatus(tr('conn') + ' · v' + data.version, true);
      if (data.version !== lastVer && data.json && data.json !== '{}') {
        lastVer = data.version;
        ta.value = data.json;
        parent.postMessage({ pluginMessage: { type: 'live', json: data.json } }, '*');
      }
    } catch (e) {
      setStatus(tr('wait'), false);
    }
  }

  function connect() {
    connected = true;
    try { localStorage.setItem('ms_conn', '1'); } catch (e) {}  // 切断するまで接続を保つ
    connectBtn.textContent = tr('disconnect');
    connectBtn.classList.add('on');
    relayInput.disabled = true;
    lastVer = -1;
    setStatus(tr('connecting'), true);
    poll();
    timer = setInterval(poll, 1200);
  }
  function disconnect() {
    connected = false;
    try { localStorage.setItem('ms_conn', '0'); } catch (e) {}  // ユーザーが明示的に切断
    connectBtn.textContent = tr('connect');
    connectBtn.classList.remove('on');
    relayInput.disabled = false;
    if (timer) clearInterval(timer);
    setStatus(tr('off'), false);
  }
  connectBtn.onclick = function () { connected ? disconnect() : connect(); };

  /* ---------- Nav / タブ切替（パネル内）＋外部オープン ---------- */
  function relayBase() { return relayInput.value.replace(/\/+$/, '') || 'http://localhost:4575'; }
  function openExt(path) { parent.postMessage({ pluginMessage: { type: 'open', url: relayBase() + path } }, '*'); }

  // 既に開いてるブラウザがあれば同じタブで切替、無ければ新規で開く（窓を増やさない）
  async function navTo(view) {
    try {
      var s = await (await fetch(relayBase() + '/nav-status', { cache: 'no-store' })).json();
      if (s.alive) { await fetch(relayBase() + '/nav', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ view: view }) }); }
      else { openExt('/' + view + '.html'); }
    } catch (e) { openExt('/' + view + '.html'); }
  }
  document.getElementById('nav-studio').onclick = function () { navTo('studio'); };
  document.getElementById('nav-library').onclick = function () { navTo('library'); };
  document.querySelectorAll('.pop').forEach(function (b) { b.onclick = function () { navTo((b.getAttribute('data-url') || '').replace(/^\/|\.html$/g, '')); }; });

  /* ---------- チャット（履歴保存 / 画像添付 / クリア） ---------- */
  var feed = document.getElementById('feed'), cinput = document.getElementById('cinput'), csend = document.getElementById('csend'), cbusy = false, pendingImg = null;
  var chatLog = [], lastChatStr = '';
  function saveChat() { // relayに共有保存（パネルと大きい画面で双方向同期）。画像は保存しない
    var s = JSON.stringify(chatLog.slice(-60).map(function (e) { return { cls: e.cls, text: e.text }; }));
    lastChatStr = s;
    try { fetch(relayBase() + '/chat-log', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: s }); } catch (e) {}
  }
  async function loadChatLog() { try { var r = await fetch(relayBase() + '/chat-log', { cache: 'no-store' }); var txt = await r.text(); lastChatStr = txt; var a = JSON.parse(txt); chatLog = Array.isArray(a) ? a : []; } catch (e) { chatLog = []; lastChatStr = ''; } renderChatLog(); }
  async function pollChat() { if (cbusy) return; try { var r = await fetch(relayBase() + '/chat-log', { cache: 'no-store' }); var txt = await r.text(); if (txt !== lastChatStr) { lastChatStr = txt; var a = JSON.parse(txt); chatLog = Array.isArray(a) ? a : []; renderChatLog(); } } catch (e) {} }
  function cscroll() { feed.scrollTop = feed.scrollHeight; }
  function labelFor(cls) { return cls === 'me' ? tr('you') : cls === 'err' ? tr('err') : 'Mothership'; }
  function cbubble(who, cls, text, img) {
    var m = document.createElement('div'); m.className = 'msg ' + cls;
    var w = document.createElement('div'); w.className = 'who'; w.textContent = who;
    var b = document.createElement('div'); b.className = 'bd';
    if (text) b.textContent = text;
    if (img) { var im = document.createElement('img'); im.src = img; b.appendChild(im); }
    m.appendChild(w); m.appendChild(b); feed.appendChild(m); cscroll(); return b;
  }
  function renderChatLog() {
    Array.prototype.slice.call(feed.querySelectorAll('.msg')).forEach(function (n) { n.remove(); });
    chatLog.forEach(function (e) { cbubble(labelFor(e.cls), e.cls, e.text, e.img); });
    var h = document.getElementById('hello'); if (h) h.style.display = chatLog.length ? 'none' : '';
  }
  function logPush(cls, text, img) { chatLog.push({ cls: cls, text: text, img: img || null }); saveChat(); var h = document.getElementById('hello'); if (h) h.style.display = 'none'; return cbubble(labelFor(cls), cls, text, img); }

  /* 画像添付（ボタン / ドラッグ&ドロップ） */
  var attachInput = document.getElementById('attachinput'), attachChip = document.getElementById('attachchip'),
      attachThumb = document.getElementById('attachthumb'), attachName = document.getElementById('attachname'), attachBtn = document.getElementById('attachbtn');
  function setPending(d, name) { pendingImg = d; attachThumb.src = d; attachName.textContent = name || '画像'; attachChip.classList.add('show'); attachBtn.classList.add('on'); }
  function clearPending() { pendingImg = null; attachChip.classList.remove('show'); attachBtn.classList.remove('on'); attachInput.value = ''; }
  function readImg(file) { if (!file || file.type.indexOf('image') !== 0) return; var rd = new FileReader(); rd.onload = function () { setPending(rd.result, file.name); }; rd.readAsDataURL(file); }
  attachBtn.onclick = function () { attachInput.click(); };
  attachInput.onchange = function () { if (this.files[0]) readImg(this.files[0]); };
  document.getElementById('attachclear').onclick = clearPending;

  /* 🎨 画像プロンプト生成モード（claudeはファイルを編集せず、画像生成プロンプトを返す） */
  var imgMode = false, imgBtn = document.getElementById('imgbtn');
  var IMG_PREFIX = '【画像プロンプト生成モード】ファイルは一切編集しないこと。現在の mothership.json のデザイン（配色・雰囲気）を読んで踏まえ、下記の要望に合うKV/写真用の画像生成プロンプトを作る。Midjourney用（--ar等のフラグ付き・横長KV比）と DALL·E/Gemini用（文章調・純白背景を明記）の2種を、それぞれコードブロックで返す。説明は最小限。\n\n要望: ';
  imgBtn.onclick = function () { imgMode = !imgMode; imgBtn.classList.toggle('on', imgMode); cinput.placeholder = imgMode ? '🎨 画像生成プロンプトを作る（MJ/DALL·E用）— どんな画像？' : tr('ph'); cinput.focus(); };
  var chatView = document.getElementById('view-chat');
  ['dragenter', 'dragover'].forEach(function (ev) { chatView.addEventListener(ev, function (e) { e.preventDefault(); chatView.classList.add('dragover'); }); });
  chatView.addEventListener('dragleave', function (e) { e.preventDefault(); chatView.classList.remove('dragover'); });
  chatView.addEventListener('drop', function (e) { e.preventDefault(); chatView.classList.remove('dragover'); var f = e.dataTransfer && e.dataTransfer.files[0]; if (f) readImg(f); });

  async function chatSend() {
    if (cbusy) return;
    var text = cinput.value.trim();
    if (!text && !pendingImg) return;
    cbusy = true; csend.disabled = true;
    var img = pendingImg; cinput.value = ''; cinput.style.height = 'auto'; clearPending();
    var useImg = imgMode; if (imgMode) { imgMode = false; imgBtn.classList.remove('on'); cinput.placeholder = tr('ph'); }  // 1回限り
    var sendMsg = useImg ? (IMG_PREFIX + text) : text;
    logPush('me', (useImg ? '🎨 ' : '') + text, img);
    var t0 = Date.now();
    var tb = cbubble('Mothership', 'think', '');
    function tick() { var s = ((Date.now() - t0) / 1000).toFixed(1); tb.innerHTML = '<span class="loadring"></span>' + (useImg ? '🎨 プロンプトを作成中…' : tr('think')) + '  <span class="secs">' + s + 's</span>'; }
    tick(); var ti = setInterval(tick, 100);
    try {
      var r = await fetch(relayBase() + '/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: sendMsg, image: img || '' }) });
      var data = await r.json(); clearInterval(ti); tb.parentElement.remove();
      var secs = ((Date.now() - t0) / 1000).toFixed(1);
      var note = connected ? '' : '\n\n⚠ ' + tr('notconn');
      if (data.ok) logPush('ms', (data.text || tr('done')) + '  ·  ⏱' + secs + 's' + note);
      else logPush('err', (data.error || tr('fail')) + (data.text ? '\n\n' + data.text : ''));
    } catch (e) {
      clearInterval(ti); tb.parentElement.remove();
      logPush('err', tr('noconn') + '\n' + (e.message || e));
    }
    cbusy = false; csend.disabled = false; cinput.focus();
  }
  csend.onclick = chatSend;
  cinput.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); chatSend(); } });
  cinput.addEventListener('input', function () { this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 110) + 'px'; });
  document.querySelectorAll('.ex button').forEach(function (b) { b.onclick = function () { cinput.value = b.textContent; chatSend(); }; });
  document.getElementById('chatclear').onclick = function () { chatLog = []; saveChat(); renderChatLog(); };
  loadChatLog();
  setInterval(pollChat, 1500);  // パネル↔大きい画面の双方向同期
  try { if (localStorage.getItem('ms_conn') !== '0') connect(); } catch (e) { connect(); }  // 切断するまで自動接続を維持

  /* ---------- オンボーディング（初回モーダル / ?で再表示） ---------- */
  var OB = {
    ja:{ slides:[
      {ico:'∞', step:'Welcome', t:'Mothership へようこそ', d:'設計の母艦。<b>チャットで頼む</b>と、claude が原本(JSON)を編集し、Figmaに<b>本物のレイヤー</b>として生成されます。'},
      {ico:'▸_', step:'Step 1', t:'relay を起動', d:'ターミナルでこれを1回だけ実行。Mothershipの中継サーバーが立ち上がります。', code:'cd mothership\nnode relay.js'},
      {ico:'◉', step:'Step 2', t:'接続する', d:'下の <b>「接続」</b> ボタンを押す。緑の「接続中」になればライブ連携OK。'},
      {ico:'💬', step:'Step 3', t:'話しかける', d:'下のチャットに「<b>シンプルな料金表を作って</b>」など入力 → Enter。Figmaにネイティブ生成されます。'}
    ], next:'次へ', back:'戻る', start:'はじめる', skip:'スキップ' },
    en:{ slides:[
      {ico:'∞', step:'Welcome', t:'Welcome to Mothership', d:'The design mothership. <b>Ask in chat</b> and claude edits the source JSON, building <b>real Figma layers</b>.'},
      {ico:'▸_', step:'Step 1', t:'Start the relay', d:'Run this once in your terminal. It launches the local relay.', code:'cd mothership\nnode relay.js'},
      {ico:'◉', step:'Step 2', t:'Connect', d:'Press <b>Connect</b> below. When it turns green, live sync is ready.'},
      {ico:'💬', step:'Step 3', t:'Ask', d:'Type e.g. "<b>Make a simple pricing table</b>" in the chat → Enter. It builds natively in Figma.'}
    ], next:'Next', back:'Back', start:"Let's go", skip:'Skip' }
  };
  var obIdx = 0;
  function obData(){ return OB[lang] || OB.ja; }
  function renderOb(){
    var d = obData(), s = d.slides[obIdx], el = document.getElementById('onboard');
    el.innerHTML =
      '<div class="ob-top"><span class="lg">∞ MOTHERSHIP</span><button class="ob-skip" id="ob-skip">'+d.skip+' ✕</button></div>'
      +'<div class="ob-card"><div class="ob-ico">'+s.ico+'</div><div class="ob-step">'+s.step+'</div><div class="ob-t">'+s.t+'</div><div class="ob-d">'+s.d+'</div>'
      +(s.code?'<div class="ob-code">'+s.code+'</div>':'')+'</div>'
      +'<div class="ob-dots">'+d.slides.map(function(_,i){return '<i class="'+(i===obIdx?'on':'')+'"></i>';}).join('')+'</div>'
      +'<div class="ob-nav">'+(obIdx>0?'<button class="back" id="ob-back">'+d.back+'</button>':'')+'<button class="primary" id="ob-next">'+(obIdx<d.slides.length-1?d.next:d.start)+'</button></div>';
    document.getElementById('ob-skip').onclick = closeOb;
    document.getElementById('ob-next').onclick = function(){ if(obIdx < d.slides.length-1){ obIdx++; renderOb(); } else closeOb(); };
    var b = document.getElementById('ob-back'); if(b) b.onclick = function(){ if(obIdx>0){ obIdx--; renderOb(); } };
  }
  function openOb(){ obIdx = 0; renderOb(); document.getElementById('onboard').classList.add('show'); }
  function closeOb(){ document.getElementById('onboard').classList.remove('show'); try{ localStorage.setItem('ms_onboarded','1'); }catch(e){} }
  document.getElementById('helpbtn').onclick = openOb;

  applyLang(); // 初期言語を適用
  try{ if(!localStorage.getItem('ms_onboarded')) openOb(); }catch(e){}  // 初回のみ自動表示
</script>
</body>
</html>
