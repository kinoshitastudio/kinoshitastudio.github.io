<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#1d1d1b;--panel:#252522;--ink:#e8e5de;--faint:#8a8a80;--line:#33332f;--gold:#a89060;--live:#5a9c6a}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'SF Mono','Space Mono',ui-monospace,monospace;font-size:11px;display:flex;flex-direction:column}
  header{padding:12px 14px 9px;border-bottom:1px solid var(--line);flex-shrink:0}
  .logo{font-weight:700;letter-spacing:.26em;font-size:11px}
  .logo svg{vertical-align:-3px;margin-right:8px}
  .logo span{color:var(--gold)}
  .sub{color:var(--faint);font-size:9px;letter-spacing:.1em;margin-top:3px;line-height:1.5}
  .body{flex:1;display:flex;flex-direction:column;padding:10px 14px;gap:8px;min-height:0}
  label{color:var(--faint);font-size:9px;letter-spacing:.18em;text-transform:uppercase}
  textarea{flex:1;width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;
    font-family:inherit;font-size:10.5px;line-height:1.55;padding:10px;resize:none;outline:none;tab-size:2}
  textarea:focus{border-color:var(--gold)}
  .btns{display:flex;gap:8px;flex-shrink:0}
  button{font-family:inherit;font-size:10px;letter-spacing:.12em;text-transform:uppercase;border-radius:6px;
    padding:9px 12px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);transition:.15s;white-space:nowrap}
  button:hover{border-color:var(--gold);color:#fff}
  button.primary{background:var(--gold);color:#1a1a18;border-color:var(--gold);font-weight:700;flex:1}
  button.primary:hover{filter:brightness(1.08)}
  .hint{color:var(--faint);font-size:9px;letter-spacing:.04em;line-height:1.6}
  .hint code{color:var(--gold)}
  .live-box{border:1px solid var(--line);border-radius:6px;padding:9px 10px;display:flex;flex-direction:column;gap:8px;flex-shrink:0}
  .live-top{display:flex;align-items:center;gap:8px}
  .dot{width:7px;height:7px;border-radius:50%;background:#555;flex-shrink:0;transition:.2s}
  .dot.on{background:var(--live);box-shadow:0 0 7px var(--live)}
  .live-title{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  .live-status{margin-left:auto;font-size:9px;color:var(--faint)}
  .live-row{display:flex;gap:8px}
  input[type=text]{flex:1;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:5px;
    font-family:inherit;font-size:10px;padding:7px 9px;outline:none}
  input[type=text]:focus{border-color:var(--gold)}
  input[type=text]:disabled{opacity:.5}
  button.live-btn{flex-shrink:0}
  button.live-btn.on{background:var(--live);color:#0e1a12;border-color:var(--live);font-weight:700}
  .nav{display:flex;gap:8px;flex-shrink:0}
  .nav button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px}
  .nav button .ic{font-size:12px;letter-spacing:0}
</style>
</head>
<body>
  <header>
    <div class="logo"><svg width="22" height="15" viewBox="2 9 46 32" fill="none" stroke="#a89060" stroke-width="4.2" stroke-linecap="round"><path d="M25 25 C25 11 4 11 4 25 C4 39 25 39 25 25 C25 11 46 11 46 25 C46 39 25 39 25 25 Z"/></svg>M O T H E R S H I P<span> ·</span></div>
    <div class="sub">設計の原本(JSON)を、編集可能な本物のFigmaノードに翻訳する。<br>Kinoshita Studio</div>
  </header>
  <div class="body">

    <div class="nav">
      <button id="nav-chat"><span class="ic">💬</span>チャット</button>
      <button id="nav-studio"><span class="ic">✎</span>詰める</button>
      <button id="nav-library"><span class="ic">▤</span>ライブラリ</button>
    </div>

    <div class="live-box">
      <div class="live-top">
        <span class="dot" id="dot"></span>
        <span class="live-title">Live — Claude Code 連携</span>
        <span class="live-status" id="status">未接続</span>
      </div>
      <div class="live-row">
        <input type="text" id="relay" value="http://localhost:4575" spellcheck="false">
        <button class="live-btn" id="connect">接続</button>
      </div>
      <div class="hint">relay に繋ぐと、Claude Code が <code>mothership.json</code> を書き換えるたびに Figma が自動更新されます。</div>
    </div>

    <label>Mothership JSON（手動）</label>
    <textarea id="json" spellcheck="false"></textarea>
    <div class="hint">tokens を <code>@colors.accent</code> で参照可。type: frame / text / rect / ellipse / line / image。frame に layout でオートレイアウト。</div>
    <div class="btns">
      <button id="example">例を読込</button>
      <button id="generate" class="primary">Figmaに生成 →</button>
    </div>
  </div>

<script>
  var EXAMPLE = {
    "name": "Sample Screen",
    "tokens": {
      "colors": { "bg": "#1a1a18", "panel": "#2a2a28", "ink": "#e8e5de", "faint": "#8a8a80", "accent": "#a89060" },
      "text": { "h1": 26, "body": 13, "label": 10 }
    },
    "root": {
      "type": "frame", "name": "Screen", "w": 390, "h": 720, "fill": "@colors.bg",
      "layout": { "mode": "vertical", "gap": 20, "padding": 28, "align": "stretch" },
      "children": [
        { "type": "text", "name": "Eyebrow", "text": "— KINOSHITA STUDIO", "fill": "@colors.accent", "font": { "size": "@text.label", "weight": 500 } },
        { "type": "text", "name": "Title", "text": "体験を、翻訳する。", "fill": "@colors.ink", "font": { "size": "@text.h1", "weight": 700 } },
        { "type": "text", "name": "Lead", "text": "届けたい体験と届いている体験のズレを揃える。設計から実装まで一人で担う。", "fill": "@colors.faint", "font": { "size": "@text.body", "weight": 400, "lineHeight": 22 } },
        {
          "type": "frame", "name": "Card", "fill": "@colors.panel", "radius": 14, "stretch": true,
          "layout": { "mode": "vertical", "gap": 8, "padding": 18 },
          "children": [
            { "type": "text", "name": "Card Title", "text": "Card", "fill": "@colors.ink", "font": { "size": 15, "weight": 600 } },
            { "type": "text", "name": "Card Body", "text": "オートレイアウトで縦に積まれた本物のFigmaフレーム。そのまま編集できます。", "fill": "@colors.faint", "font": { "size": 12, "weight": 400, "lineHeight": 20 } }
          ]
        },
        {
          "type": "frame", "name": "Button", "fill": "@colors.accent", "radius": 999, "stretch": true,
          "layout": { "mode": "horizontal", "gap": 8, "padding": { "top": 13, "bottom": 13 }, "justify": "center", "align": "center" },
          "children": [
            { "type": "text", "name": "Button Label", "text": "詳しく見る →", "fill": "#1a1a18", "font": { "size": 12, "weight": 700 } }
          ]
        }
      ]
    }
  };

  var ta = document.getElementById('json');
  ta.value = JSON.stringify(EXAMPLE, null, 2);

  document.getElementById('example').onclick = function () { ta.value = JSON.stringify(EXAMPLE, null, 2); };
  document.getElementById('generate').onclick = function () {
    parent.postMessage({ pluginMessage: { type: 'generate', json: ta.value } }, '*');
  };

  /* ---------- Live (relay polling) ---------- */
  var timer = null, lastVer = -1, connected = false;
  var dot = document.getElementById('dot'), statusEl = document.getElementById('status');
  var connectBtn = document.getElementById('connect'), relayInput = document.getElementById('relay');

  function setStatus(t, on) { statusEl.textContent = t; dot.classList.toggle('on', !!on); }

  async function poll() {
    var url = relayInput.value.replace(/\/+$/, '') + '/pull';
    try {
      var r = await fetch(url, { cache: 'no-store' });
      var data = await r.json();
      setStatus('接続中 · v' + data.version, true);
      if (data.version !== lastVer && data.json && data.json !== '{}') {
        lastVer = data.version;
        ta.value = data.json;
        parent.postMessage({ pluginMessage: { type: 'live', json: data.json } }, '*');
      }
    } catch (e) {
      setStatus('relay待機中…', false);
    }
  }

  function connect() {
    connected = true;
    connectBtn.textContent = '切断';
    connectBtn.classList.add('on');
    relayInput.disabled = true;
    lastVer = -1;
    setStatus('接続中…', true);
    poll();
    timer = setInterval(poll, 1200);
  }
  function disconnect() {
    connected = false;
    connectBtn.textContent = '接続';
    connectBtn.classList.remove('on');
    relayInput.disabled = false;
    if (timer) clearInterval(timer);
    setStatus('未接続', false);
  }
  connectBtn.onclick = function () { connected ? disconnect() : connect(); };

  /* ---------- Nav (ハブ導線) ---------- */
  function relayBase() { return relayInput.value.replace(/\/+$/, '') || 'http://localhost:4575'; }
  function openExt(path) { parent.postMessage({ pluginMessage: { type: 'open', url: relayBase() + path } }, '*'); }
  document.getElementById('nav-chat').onclick = function () { openExt('/chat.html'); };
  document.getElementById('nav-studio').onclick = function () { openExt('/studio.html'); };
  document.getElementById('nav-library').onclick = function () { openExt('/library.html'); };
</script>
</body>
</html>
