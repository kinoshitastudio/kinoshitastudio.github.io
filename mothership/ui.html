<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mothership</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--blue:#5457E8;--ink:#14142B;--mint:#9FE3C8;--mint2:#6FD3AE;--paper:#EDEDF7;--coral:#FF6B5A}
  html,body{height:100%}
  body{font-family:"Helvetica Neue","Arial",system-ui,sans-serif;color:var(--ink);overflow:hidden;
    background:var(--blue);
    background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);
    background-size:30px 30px}
  .app{height:100vh;display:flex;flex-direction:column;width:100%}
  /* header */
  header{display:flex;align-items:center;gap:10px;padding:12px 12px 8px}
  .logo{display:flex;align-items:center;gap:8px}
  .logo .mk{width:26px;height:26px;border-radius:50%;background:var(--ink);position:relative;flex:0 0 auto}
  .logo .mk::before,.logo .mk::after{content:"";position:absolute;top:50%;width:8px;height:8px;border:2.2px solid var(--mint);border-radius:50%;transform:translateY(-50%)}
  .logo .mk::before{left:3px}.logo .mk::after{right:3px}
  .logo b{font-size:15px;font-weight:900;letter-spacing:-.02em;color:var(--ink)}
  .hic{margin-left:auto;display:flex;gap:6px}
  .hic div{width:28px;height:28px;background:var(--ink);color:var(--mint);display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;font-weight:900;user-select:none}
  .hic div:hover{background:#000}
  /* stage / core */
  .stage{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0 2px;position:relative}
  .target{width:112px;height:112px;display:block}
  .status{font-size:8px;font-weight:900;letter-spacing:.26em;color:var(--ink);opacity:.5;margin-top:4px}
  .hero{display:none;flex-direction:column;align-items:center;text-align:center;margin:0}
  .huge{font-size:30px;font-weight:900;line-height:.92;letter-spacing:-.03em;color:var(--ink);transform:scaleY(1.06)}
  .huge .o{color:var(--paper)}
  .subline{font-size:11px;font-weight:700;color:var(--ink);opacity:.72;margin-top:8px}
  .egs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:14px;max-width:300px}
  .app.empty .stage{flex:1;justify-content:center;gap:12px;padding:0}
  .app.empty .target{width:172px;height:172px}
  .app.empty .status{display:none}
  .app.empty .hero{display:flex}
  .app.empty .convo{display:none}
  /* convo */
  .convo{flex:1;overflow-y:auto;padding:6px 12px;display:flex;flex-direction:column;gap:11px}
  .convo::-webkit-scrollbar{width:0}
  .me{align-self:flex-end;max-width:82%;background:var(--ink);color:var(--paper);font-weight:800;font-size:12.5px;padding:9px 12px;line-height:1.4;white-space:pre-wrap}
  .me img{display:block;max-width:150px;border:2px solid var(--paper);margin-bottom:5px}
  .reply{align-self:flex-start;max-width:88%;background:var(--paper);border:2px solid var(--ink);border-left:5px solid var(--mint2);padding:10px 12px}
  .reply .rh{font-size:9px;font-weight:900;letter-spacing:.14em;color:var(--mint2);margin-bottom:5px}
  .reply .rt{font-size:12px;font-weight:700;line-height:1.65;color:var(--ink);white-space:pre-wrap}
  .card.err{align-self:flex-start;max-width:90%;background:var(--paper);border:2px solid var(--coral)}
  .card.err .top{background:var(--coral);color:#fff;font-weight:900;font-size:10px;letter-spacing:.1em;padding:5px 11px}
  .card.err .bd{padding:9px 11px;font-size:11.5px;font-weight:700;line-height:1.55;white-space:pre-wrap}
  .think{align-self:flex-start;max-width:88%;background:var(--ink);color:var(--mint);font-size:11.5px;font-weight:800;padding:9px 12px;display:flex;align-items:center;gap:8px}
  .loadring{width:9px;height:9px;border-radius:50%;background:var(--mint);animation:tl .8s ease-in-out infinite;flex:0 0 auto}
  .think .secs{margin-left:auto;opacity:.6;font-size:10px}
  @keyframes tl{50%{transform:scale(1.6);opacity:.4}}
  .sys{align-self:center;max-width:92%;text-align:center;font-size:11px;font-weight:800;color:var(--ink);background:rgba(255,72,72,.14);border:2px solid var(--coral);padding:7px 12px}
  /* 道標チップ */
  .qr{align-self:flex-start;max-width:92%;display:flex;flex-wrap:wrap;margin-top:-4px}
  .chipq{font-size:10.5px;font-weight:800;line-height:1;border:2.5px solid var(--ink);color:var(--ink);background:transparent;cursor:pointer;padding:6px 9px;margin:0 -2.5px -2.5px 0;transition:.12s}
  .chipq:hover{background:var(--ink);color:var(--mint)}
  .chipq .a{color:var(--mint2);font-weight:900;margin-right:4px}
  .chipq:hover .a{color:var(--mint)}
  .egs .chipq{margin:0}
  .setup{margin-top:16px;font-size:10.5px;font-weight:700;color:var(--ink);opacity:.72}
  .setup a{text-decoration:underline;cursor:pointer;font-weight:900;color:var(--ink)}
  /* composer */
  .composer{padding:8px 12px 12px}
  .engs{display:flex;gap:0;margin-bottom:8px;flex-wrap:wrap;align-items:center}
  .eng{font-size:10px;font-weight:900;letter-spacing:.02em;padding:6px 10px;border:2.5px solid var(--ink);color:var(--ink);cursor:pointer;margin-right:-2.5px;background:transparent;display:flex;align-items:center;gap:6px}
  .eng .dt{width:8px;height:8px;border-radius:50%}
  .eng.on{background:var(--ink);color:var(--mint)}
  .eng.off{opacity:.35;cursor:not-allowed}
  .conn{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:10px;font-weight:900;padding:6px 10px;border:2.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
  .cdot{width:8px;height:8px;border-radius:50%;background:var(--coral);flex:0 0 auto}
  .conn.on{background:var(--ink);color:var(--mint)} .conn.on .cdot{background:#22C55E}
  .conn.connecting .cdot{background:#F0B429;animation:tl .8s ease-in-out infinite}
  .attach{display:none;gap:8px;margin-bottom:8px;align-items:center}
  .attach.on{display:flex}
  .thumb{position:relative;width:44px;height:44px;border:2.5px solid var(--ink);background-size:cover;background-position:center;flex:0 0 auto}
  .thumb .x{position:absolute;top:-8px;right:-8px;width:18px;height:18px;background:var(--ink);color:var(--mint);font-weight:900;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid var(--paper)}
  .dock{display:flex;align-items:stretch;border:3px solid var(--ink);background:var(--paper)}
  .dock .plus{width:38px;background:var(--ink);color:var(--mint);font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  #inp{flex:1;border:none;outline:none;background:transparent;font-size:12.5px;font-weight:700;color:var(--ink);padding:0 10px;min-width:0;font-family:inherit;resize:none;line-height:38px;max-height:38px}
  #inp::placeholder{color:#6b6b8a}
  .send{background:var(--mint);border:none;border-left:3px solid var(--ink);cursor:pointer;padding:0 12px;display:flex;align-items:center;transition:.15s;color:var(--ink);font-weight:900;font-size:16px}
  .send:hover{background:var(--mint2)}
  .send.stop{background:var(--coral)}
  .stopsq{display:inline-block;width:11px;height:11px;background:#fff}
  /* dark */
  body.dark{--blue:#15152e;--ink:#EAEAFB;--paper:#23233f}
  body.dark .huge .o{color:var(--mint)}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:20}
  #screenflash{position:fixed;inset:0;background:var(--mint);opacity:0;pointer-events:none;z-index:40}
  #screenflash.go{animation:flash2 .62s ease-out}
  @keyframes flash2{0%{opacity:0}10%{opacity:.48}23%{opacity:0}38%{opacity:.48}52%{opacity:0}100%{opacity:0}}
  @media(prefers-reduced-motion:reduce){#screenflash.go{animation:none}}
  .app.dragover{outline:3px dashed var(--ink);outline-offset:-6px}
</style></head><body>
<div class="app empty" id="app">
  <header>
    <div class="logo"><span class="mk"></span><b>MOTHERSHIP</b></div>
    <div class="hic">
      <div id="btnClear" title="会話をリセット"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2.6-6.4"/><path d="M3 3.5V9h5.5"/></svg></div>
      <div id="btnEdit" title="編集（studio）">✎</div>
      <div id="btnLib" title="ライブラリ">▤</div>
      <div id="btnTheme" title="ダーク/ライト">◐</div>
      <div id="btnLang" title="EN/JP" style="font-size:10px">JP</div>
    </div>
  </header>
  <div class="stage">
    <canvas class="target" id="target"></canvas>
    <div class="status" id="status">未接続</div>
    <div class="hero" id="hero">
      <div class="huge">THROW<br>IT <span class="o">IN.</span></div>
      <div class="subline">作りたいものを、母艦へ放り込む。</div>
      <div class="egs" id="egs"></div>
      <div class="setup" id="setup"><span id="setupmsg">はじめて？ relay を起動して［接続］</span> · <a id="setuplink">セットアップ →</a></div>
    </div>
  </div>
  <div class="convo" id="convo"></div>
  <div class="composer">
    <div class="engs" id="engs">
      <button class="conn" id="conn"><span class="cdot"></span><span id="connlab">接続</span></button>
    </div>
    <div class="attach" id="attach"></div>
    <input type="file" id="file" accept="image/*" style="display:none">
    <div class="dock">
      <div class="plus" id="plus" title="画像を添付">+</div>
      <input id="inp" placeholder="作る・聞く・相談…" autocomplete="off">
      <button class="send" id="send" title="送信">›</button>
    </div>
  </div>
</div>
<canvas id="fx"></canvas>
<div id="screenflash"></div>
<script>
// ============ relay 設定 ============
var RELAY = 'http://localhost:4575';
var inIframe = (window.parent && window.parent !== window);
function toParent(msg){ if(inIframe) parent.postMessage({pluginMessage:msg},'*'); }
function openExt(path){ if(inIframe) toParent({type:'open', url:RELAY+path}); else window.open(RELAY+path,'_blank'); }

// ============ 母艦コア：canvas状態機械（idle→gather→thinking→done） ============
var cvs=document.getElementById('target'),X=cvs.getContext('2d');
var CS=180,C=90,D2=2;cvs.width=CS*D2;cvs.height=CS*D2;X.scale(D2,D2);
var RINGS=[{r:70,n:28},{r:48,n:18},{r:26,n:10}];
var ps=[];
RINGS.forEach(function(ring,ri){for(var i=0;i<ring.n;i++){var mint=(i%(ri===0?7:4))===0;ps.push({x:C,y:C,vx:0,vy:0,ri:ri,baseA:(i/ring.n)*Math.PI*2,rr:ring.r,base:mint?'#6FD3AE':'#EDEDF7',col:mint?'#6FD3AE':'#EDEDF7',sz:ri===0?5.4:ri===1?5:5.2,grp:ps.length%3});}});
var N=ps.length,statusEl=document.getElementById('status');
var PHASE_SEC=6;
var state='idle',st=0,rot=0,spd=0.006,flash=0,doneR=0,ripples=[],CORE='#14142B',thinkT0=0,thinkPhase=0;
function ripple(r,g){ripples.push({r:r,o:0.85,g:g});}
function setState(s){if(state===s)return;state=s;st=0;
  if(s==='thinking'){thinkT0=performance.now();thinkPhase=0;}
  if(s==='gather'){flash=1;}
  if(s==='done'){flash=1;doneR=1;ps.forEach(function(p){var a=Math.random()*6.283,sp=2.5+Math.random()*3.4;p.vx=Math.cos(a)*sp;p.vy=Math.sin(a)*sp;p.col='#9FE3C8';});}}
function react(){if(state!=='idle')return;spd=0.06;ripple(10,3.4);for(var k=0;k<4;k++){var p=ps[(Math.random()*N)|0];p.vx+=(Math.random()-.5)*3.6;p.vy+=(Math.random()-.5)*3.6;}}
function loop(t){st++;X.clearRect(0,0,CS,CS);
  rot+=spd;spd+=(0.006-spd)*0.05;
  for(var i=ripples.length-1;i>=0;i--){var rp=ripples[i];rp.r+=rp.g;rp.o-=0.024;if(rp.o<=0){ripples.splice(i,1);continue;}X.beginPath();X.arc(C,C,Math.max(0,rp.r),0,6.283);X.strokeStyle='rgba(159,227,200,'+rp.o.toFixed(2)+')';X.lineWidth=(2.2*rp.o).toFixed(2);X.stroke();}
  if(doneR>0){doneR-=0.03;X.beginPath();X.arc(C,C,(1-doneR)*82,0,6.283);X.strokeStyle='rgba(159,227,200,'+doneR.toFixed(2)+')';X.lineWidth=(6*doneR).toFixed(2);X.stroke();}
  ps.forEach(function(p){var tx,ty,tsz=p.sz;
    if(state==='idle'){var a=p.baseA+rot;tx=C+Math.cos(a)*p.rr;ty=C+Math.sin(a)*p.rr;}
    else if(state==='gather'){tx=C;ty=C;}
    else if(state==='thinking'){thinkPhase=Math.floor((t-thinkT0)/1000/PHASE_SEC)%3;
      if(thinkPhase===0){var g=p.grp;tx=C+(g-1)*32;ty=C-Math.abs(Math.sin(t*0.006+g*2.09))*24;tsz=p.sz*1.5;}
      else if(thinkPhase===1){var a2=p.baseA*3+t*0.02;tx=C+Math.cos(a2)*30;ty=C+Math.sin(a2)*30;tsz=p.sz*1.15;}
      else{var r2=15+(Math.sin(t*0.004+p.baseA*2)+1)/2*26;tx=C+Math.cos(p.baseA)*r2;ty=C+Math.sin(p.baseA)*r2;tsz=p.sz*1.1;}}
    if(state==='done'){if(st>24){var a3=p.baseA+rot,rx=C+Math.cos(a3)*p.rr,ry=C+Math.sin(a3)*p.rr;p.vx+=(rx-p.x)*0.14;p.vy+=(ry-p.y)*0.14;}p.vx*=0.85;p.vy*=0.85;}
    else{var k=state==='gather'?0.22:(state==='thinking'?0.2:0.14);p.vx+=(tx-p.x)*k;p.vy+=(ty-p.y)*k;p.vx*=0.6;p.vy*=0.6;}
    p.x+=p.vx;p.y+=p.vy;
    X.beginPath();X.arc(p.x,p.y,tsz,0,6.283);X.fillStyle=p.col;X.fill();});
  if(state==='idle'){X.beginPath();X.arc(C,C,6,0,6.283);X.fillStyle=CORE;X.fill();}
  if(flash>0){flash-=0.09;X.beginPath();X.arc(C,C,12+(1-flash)*12,0,6.283);X.fillStyle='rgba(255,255,255,'+(flash*0.85).toFixed(2)+')';X.fill();}
  if(state==='gather'&&st>24)setState('thinking');
  if(state==='done'&&st>44){setState('idle');ps.forEach(function(p){p.col=p.base;});}
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);

// ============ chat 描画 ============
var convo=document.getElementById('convo'),app=document.getElementById('app'),inp=document.getElementById('inp');
function esc(s){return String(s).replace(/[&<>]/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[m];});}
function scrollEnd(){convo.scrollTop=convo.scrollHeight;}
function bubble(cls,text,img){
  var m=document.createElement('div');
  if(cls==='me'){m.className='me';if(img){var im=document.createElement('img');im.src=img;m.appendChild(im);}if(text){var tx=document.createElement('div');tx.textContent=text;m.appendChild(tx);}}
  else if(cls==='ms'){m.className='reply';m.innerHTML='<div class="rh">◎ 母艦</div><div class="rt">'+esc(text)+'</div>';}
  else if(cls==='err'){m.className='card err';m.innerHTML='<div class="top">⚠ 失敗</div><div class="bd">'+esc(text)+'</div>';}
  convo.appendChild(m);scrollEnd();return m;
}
// 会話ログ（relayが正本）
var chatLog=[],lastChatStr='';
function renderChatLog(){
  Array.prototype.slice.call(convo.querySelectorAll('.me,.reply,.card,.qr')).forEach(function(n){n.remove();});
  chatLog.forEach(function(e){bubble(e.cls,e.text,e.img);
    if(e.cls==='ms') appendQR(e.text);});
  app.classList.toggle('empty', chatLog.length===0 && !thinkEl && sendQueue.length===0);
}

// ============ 接続 / pull→live / engines ============
var connected=false, timer=null, lastVer=-1, aiEngine='claude';
var connEl=document.getElementById('conn'), connLab=document.getElementById('connlab');
function setStatus(t){statusEl.textContent=t;}
function updateSetup(){var m=document.getElementById('setupmsg');if(!m)return;
  if(lang==='en') m.textContent=connected?'Connected. Tap an example or type & send.':'First time? Start the relay, then [Connect].';
  else m.textContent=connected?'接続済。例をタップ or 入力して送信。':'はじめて？ relay を起動して［接続］';}
document.getElementById('setuplink').onclick=function(){var u='https://kinoshita.studio/mothership/guide.html';if(inIframe)toParent({type:'open',url:u});else window.open(u,'_blank');};
function setConnUI(s){connEl.classList.remove('on','connecting');
  if(s==='connecting'){connEl.classList.add('connecting');connLab.textContent=(lang==='en'?'Connecting…':'接続中…');}
  else if(s===true){connEl.classList.add('on');connLab.textContent=(lang==='en'?'Connected':'接続済');}
  else{connLab.textContent=(lang==='en'?'Connect':'接続');}
  updateSetup();}
async function poll(){
  try{var r=await fetch(RELAY+'/pull',{cache:'no-store'});var d=await r.json();
    setStatus('接続済 · v'+d.version);
    if(d.version!==lastVer && d.json && d.json!=='{}'){lastVer=d.version;toParent({type:'live',json:d.json});}
  }catch(e){setStatus('relay待機中…');}
}
async function connect(){
  setConnUI('connecting');setStatus('接続中…');
  var ok=false,probe=null;
  try{var r=await fetch(RELAY+'/pull',{cache:'no-store'});if(r.ok){probe=await r.json();ok=true;}}catch(e){}
  if(!ok){connected=false;setConnUI(false);setStatus('relay待機中…');ripple(60,-3.2);flash=1;return;}
  connected=true;setConnUI(true);
  try{localStorage.setItem('ms_conn','1');}catch(e){}
  lastVer=(probe&&typeof probe.version!=='undefined')?probe.version:-1;
  poll();timer=setInterval(poll,1200);
  loadChatLog();loadEngines();
  setInterval(pollChat,1400);setInterval(pollBusy,700);
}
function disconnect(){connected=false;setConnUI(false);setStatus('未接続');if(timer)clearInterval(timer);
  try{localStorage.setItem('ms_conn','0');}catch(e){}
  var e=document.getElementById('engine-wrap');if(e)e.remove();}
connEl.onclick=function(){connected?disconnect():connect();};

async function loadEngines(){
  var engs=document.getElementById('engs');
  var old=document.getElementById('engine-wrap');if(old)old.remove();
  try{var r=await fetch(RELAY+'/engines',{cache:'no-store'});var d=await r.json();var list=d.engines||[];
    var wrap=document.createElement('span');wrap.id='engine-wrap';wrap.style.display='contents';
    var COL={claude:'#C6785C',gemini:'#4C8DF6',codex:'#22C55E'};
    if(!list.some(function(e){return e.key===aiEngine&&e.available;})){var av=list.filter(function(e){return e.available;})[0];if(av)aiEngine=av.key;}
    list.forEach(function(e){var b=document.createElement('button');b.className='eng'+(e.key===aiEngine?' on':'')+(e.available?'':' off');
      b.innerHTML='<span class="dt" style="background:'+(COL[e.key]||'#888')+'"></span>'+e.label.toUpperCase().split(' ')[0];
      if(e.available)b.onclick=function(){aiEngine=e.key;wrap.querySelectorAll('.eng').forEach(function(x){x.classList.remove('on');});b.classList.add('on');};
      wrap.appendChild(b);});
    engs.insertBefore(wrap,connEl);
  }catch(e){}
}
// chat-log 同期
async function loadChatLog(){if(!connected){renderChatLog();return;}try{var r=await fetch(RELAY+'/chat-log',{cache:'no-store'});var txt=await r.text();lastChatStr=txt;var a=JSON.parse(txt);chatLog=Array.isArray(a)?a:[];}catch(e){chatLog=[];lastChatStr='';}renderChatLog();}
async function pollChat(){if(!connected||cbusy)return;try{var r=await fetch(RELAY+'/chat-log',{cache:'no-store'});var txt=await r.text();if(txt!==lastChatStr){lastChatStr=txt;var a=JSON.parse(txt);chatLog=Array.isArray(a)?a:[];renderChatLog();}}catch(e){}}
var remoteBusy=false;
async function pollBusy(){if(!connected){return;}try{var b=await(await fetch(RELAY+'/chat-busy',{cache:'no-store'})).json();remoteBusy=!!b.busy;}catch(e){remoteBusy=false;}
  if((remoteBusy||cbusy)&&state==='idle')setState('gather');}

// ============ 送信 ============
var cbusy=false,thinkEl=null,sendQueue=[],pendingImg=null;
var sendBtn=document.getElementById('send');
function setBusy(b){cbusy=b;if(b){sendBtn.classList.add('stop');sendBtn.innerHTML='<span class="stopsq"></span>';setState('gather');}else{sendBtn.classList.remove('stop');sendBtn.innerHTML='›';}}
function phaseMsg(s){var A=[[0,'うーん、考えてるよ…！'],[12,'読み解いてるよ〜'],[28,'構成を練ってるよ！'],[48,'組み立ててるよ〜！'],[78,'細部を整えてるよ、もう少し！'],[120,'大物だ…！あと少し待ってね🙏']];var m=A[0][1];for(var i=0;i<A.length;i++)if(s>=A[i][0])m=A[i][1];return m;}
async function doSend(p){
  setBusy(true);app.classList.remove('empty');
  bubble('me',p.disp,p.img);
  var t0=Date.now();
  thinkEl=document.createElement('div');thinkEl.className='think';thinkEl.innerHTML='<span class="loadring"></span><span class="ph"></span><span class="secs">0.0s</span>';convo.appendChild(thinkEl);scrollEnd();
  var ph=thinkEl.querySelector('.ph'),secs=thinkEl.querySelector('.secs');
  function upd(){var s=(Date.now()-t0)/1000;secs.textContent=s.toFixed(1)+'s';ph.textContent=phaseMsg(s);}upd();
  var ti=setInterval(upd,200);
  try{
    var r=await fetch(RELAY+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:p.sendMsg,image:p.img||'',display:p.disp,engine:aiEngine,lang:lang})});
    var d=await r.json();clearInterval(ti);if(thinkEl){thinkEl.remove();thinkEl=null;}
    var sc=((Date.now()-t0)/1000).toFixed(1);
    if(d.aborted){bubble('ms','⏹ 停止しました  ·  ⏱'+sc+'s');}
    else if(d.ok){setState('done');flashScreen();bubble('ms',(d.text||'（完了）')+'  ·  ⏱'+sc+'s');appendQR(d.text||'');}
    else{setState('idle');bubble('err',(d.error||'失敗')+(d.text?'\n\n'+d.text:''));}
  }catch(e){clearInterval(ti);if(thinkEl){thinkEl.remove();thinkEl=null;}setState('idle');bubble('err','relayに繋がりません\n'+(e.message||e));}
  setBusy(false);inp.focus();scrollEnd();pollChat();
  if(sendQueue.length){var nx=sendQueue.shift();doSend(nx);}
}
function suck(txt){ ripple(9,3.4); flash=1; }   // 送信フィードバック（コアに波紋＋閃光）
function flashScreen(){ var f=document.getElementById('screenflash'); if(!f)return; f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); }   // 母艦が答える瞬間＝画面全体2回フラッシュ
function chatSend(){
  var text=inp.value.trim();
  if(!text&&!pendingImg)return;
  if(!connected){app.classList.remove('empty');var s=document.createElement('div');s.className='sys';s.textContent='⚠ 母艦に未接続です。右下の「接続」を押してください。';convo.appendChild(s);scrollEnd();ripple(60,-3.2);flash=1;return;}
  var img=pendingImg;clearPending();
  var payload={sendMsg:text,disp:text,img:img};
  inp.value='';
  suck(text);
  if(cbusy){sendQueue.push(payload);var q=bubble('me','⏳ '+payload.disp,payload.img);q.style.opacity='.55';scrollEnd();return;}
  doSend(payload);
}
sendBtn.onclick=function(){if(cbusy)chatAbort();else chatSend();};
inp.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229){e.preventDefault();if(!cbusy)chatSend();}});
inp.addEventListener('input',react);
async function chatAbort(){sendQueue=[];try{await fetch(RELAY+'/abort',{method:'POST'});}catch(e){}}

// ============ 道標チップ / 空状態の例 ============
function fillSend(t){if(cbusy)return;inp.value=t;chatSend();}
var EG={ja:['料金表を3プランで','ログイン画面を作って','ロゴ案を3つ','URLからサイトを再現'],en:['A 3-tier pricing table','Build a login screen','3 logo ideas','Reproduce a site from URL']};
function chip(lab){var b=document.createElement('button');b.className='chipq';b.innerHTML='<span class="a">›</span>'+esc(lab);b.onclick=function(){fillSend(lab);};return b;}
function renderEgs(){var box=document.getElementById('egs');if(!box)return;box.innerHTML='';(EG[lang]||EG.ja).forEach(function(t){box.appendChild(chip(t));});}
function quickReplies(v){var ja,en;
  if(/レイアウト|整え|整理|余白|崩れ|調整/.test(v)){ja=['適用して','別のフレームも','8ptで揃える'];en=['Apply it','Another frame','Snap to 8pt'];}
  else if(/モーション|motion|アニメ|動き|入場/i.test(v)){ja=['入場を付ける','強調を付ける','書き出す'];en=['Add entrance','Add emphasis','Export'];}
  else if(/書き出|export|コード|svg|json|持ち出/i.test(v)){ja=['Reactで書き出す','library JSONで所有','別の画面も'];en=['Export React','Own as JSON','Another'];}
  else{ja=['色を整える','モーションを付ける','SVGで書き出す'];en=['Tidy colors','Add motion','Export SVG'];}
  return lang==='en'?en:ja;}
function appendQR(v){if(!v)return;var row=document.createElement('div');row.className='qr';quickReplies(v).forEach(function(lab){row.appendChild(chip(lab));});convo.appendChild(row);scrollEnd();}

// ============ 画像添付 ============
function renderAttach(){var a=document.getElementById('attach');if(!a)return;if(!pendingImg){a.className='attach';a.innerHTML='';return;}
  a.className='attach on';a.innerHTML='';var t=document.createElement('div');t.className='thumb';t.style.backgroundImage='url('+pendingImg+')';
  var x=document.createElement('div');x.className='x';x.textContent='×';x.onclick=function(){pendingImg=null;renderAttach();};t.appendChild(x);a.appendChild(t);}
function clearPending(){pendingImg=null;renderAttach();document.getElementById('file').value='';}
document.getElementById('plus').onclick=function(){document.getElementById('file').click();};
document.getElementById('file').onchange=function(e){var f=e.target.files&&e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){pendingImg=r.result;renderAttach();};r.readAsDataURL(f);e.target.value='';};
['dragenter','dragover'].forEach(function(ev){app.addEventListener(ev,function(e){e.preventDefault();app.classList.add('dragover');});});
app.addEventListener('dragleave',function(e){e.preventDefault();app.classList.remove('dragover');});
app.addEventListener('drop',function(e){e.preventDefault();app.classList.remove('dragover');var f=e.dataTransfer&&e.dataTransfer.files[0];if(f&&f.type.indexOf('image')===0){var r=new FileReader();r.onload=function(){pendingImg=r.result;renderAttach();};r.readAsDataURL(f);}});

};
