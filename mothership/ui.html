<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mothership</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--blue:#5457E8;--ink:#14142B;--mint:#9FE3C8;--mint2:#6FD3AE;--paper:#EDEDF7;--coral:#FF6B5A}
  html,body{height:100%}
  body{font-family:"Helvetica Neue","Arial",system-ui,sans-serif;color:var(--ink);overflow:hidden;
    background:var(--blue);
    background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);
    background-size:30px 30px}
  .app{height:100vh;display:flex;flex-direction:column;width:100%}
  /* header */
  header{display:flex;align-items:center;gap:10px;padding:12px 12px 8px}
  .logo{display:flex;align-items:center;gap:8px}
  .logo .mk{width:26px;height:26px;border-radius:50%;background:var(--ink);position:relative;flex:0 0 auto}
  .logo .mk::before,.logo .mk::after{content:"";position:absolute;top:50%;width:8px;height:8px;border:2.2px solid var(--mint);border-radius:50%;transform:translateY(-50%)}
  .logo .mk::before{left:3px}.logo .mk::after{right:3px}
  .logo b{font-size:15px;font-weight:900;letter-spacing:-.02em;color:var(--ink)}
  .hic{margin-left:auto;display:flex;gap:6px}
  .hic div{width:28px;height:28px;background:var(--ink);color:var(--mint);display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;font-weight:900;user-select:none}
  .hic div:hover{background:#000}
  /* stage / core */
  .stage{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0 2px;position:relative}
  .target{width:112px;height:112px;display:block}
  .status{font-size:8px;font-weight:900;letter-spacing:.26em;color:var(--ink);opacity:.5;margin-top:4px}
  .hero{display:none;flex-direction:column;align-items:center;text-align:center;margin:0}
  .huge{font-size:30px;font-weight:900;line-height:.92;letter-spacing:-.03em;color:var(--ink);transform:translateX(.26em) scaleY(1.06)}
  .huge .o{color:var(--paper)}
  .subline{font-size:11px;font-weight:700;color:var(--ink);opacity:.72;margin-top:8px}
  .egs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:14px;max-width:300px}
  /* オンボ 5問アンケート（heroに差し込む・1タップで進む） */
  .survey{display:none;flex-direction:column;align-items:stretch;gap:8px;margin-top:14px;width:270px;max-width:82vw}
  .hero.surv .subline,.hero.surv .egs,.hero.surv .setup{display:none}
  .hero.surv .survey{display:flex}
  .svdots{display:flex;gap:5px;justify-content:center;margin-bottom:3px}
  .svdots span{width:6px;height:6px;border:2px solid var(--ink);background:transparent}
  .svdots span.on{background:var(--ink)}
  .svdots span.cur{background:var(--mint2);border-color:var(--mint2)}
  .svq{font-size:13px;font-weight:900;color:var(--ink);text-align:center;line-height:1.32;margin-bottom:3px}
  .svopt{font-size:12px;font-weight:900;border:2.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;padding:9px 10px;font-family:inherit;transition:.12s;text-align:center}
  .svopt:hover{background:var(--ink);color:var(--mint)}
  .svskip{font-size:10px;font-weight:800;color:var(--ink);opacity:.5;text-decoration:underline;cursor:pointer;margin-top:2px;background:none;border:none;font-family:inherit}
  .svskip:hover{opacity:.85}
  .app.empty .stage{flex:1;min-height:0;overflow-y:auto;justify-content:flex-start;gap:12px;padding:14px 0 6px}
  .app.empty .stage::-webkit-scrollbar{width:0}
  .app.empty .target{width:172px;height:172px}
  .app.empty .status{display:none}
  .app.empty .hero{display:flex}
  .app.empty .convo{display:none}
  /* convo */
  .convo{flex:1;overflow-y:auto;padding:6px 12px;display:flex;flex-direction:column;gap:11px}
  .convo::-webkit-scrollbar{width:0}
  .me{align-self:flex-end;max-width:82%;background:var(--ink);color:var(--paper);font-weight:800;font-size:12.5px;padding:9px 12px;line-height:1.4;white-space:pre-wrap}
  .me img{display:block;max-width:150px;border:2px solid var(--paper);margin-bottom:5px}
  .reply{align-self:flex-start;max-width:88%;background:var(--paper);border:2px solid var(--ink);border-left:5px solid var(--mint2);padding:10px 12px}
  .reply .rh{font-size:9px;font-weight:900;letter-spacing:.14em;color:var(--mint2);margin-bottom:5px}
  .reply .rt{font-size:12px;font-weight:700;line-height:1.65;color:var(--ink);white-space:pre-wrap}
  .card.err{align-self:flex-start;max-width:90%;background:var(--paper);border:2px solid var(--coral)}
  .card.err .top{background:var(--coral);color:#fff;font-weight:900;font-size:10px;letter-spacing:.1em;padding:5px 11px}
  .card.err .bd{padding:9px 11px;font-size:11.5px;font-weight:700;line-height:1.55;white-space:pre-wrap}
  .think{align-self:flex-start;max-width:88%;background:var(--ink);color:var(--mint);font-size:11.5px;font-weight:800;padding:9px 12px;display:flex;align-items:center;gap:8px}
  .loadring{width:9px;height:9px;border-radius:50%;background:var(--mint);animation:tl .8s ease-in-out infinite;flex:0 0 auto}
  .think .secs{margin-left:auto;opacity:.6;font-size:10px}
  @keyframes tl{50%{transform:scale(1.6);opacity:.4}}
  .sys{align-self:center;max-width:92%;text-align:center;font-size:11px;font-weight:800;color:var(--ink);background:rgba(255,72,72,.14);border:2px solid var(--coral);padding:7px 12px}
  /* 道標チップ */
  .qr{align-self:flex-start;max-width:92%;display:flex;flex-wrap:wrap;margin-top:-4px}
  .chipq{font-size:10.5px;font-weight:800;line-height:1;border:2.5px solid var(--ink);color:var(--ink);background:transparent;cursor:pointer;padding:6px 9px;margin:0 -2.5px -2.5px 0;transition:.12s}
  .chipq:hover{background:var(--ink);color:var(--mint)}
  .chipq .a{color:var(--mint2);font-weight:900;margin-right:4px}
  .chipq:hover .a{color:var(--mint)}
  .egs .chipq{margin:0}
  .setup{margin-top:16px;font-size:10.5px;font-weight:700;color:var(--ink);opacity:.72}
  .setup a{text-decoration:underline;cursor:pointer;font-weight:900;color:var(--ink)}
  /* オンボの5問アンケート */
  .survey{display:none;flex-direction:column;align-items:stretch;width:290px;max-width:88vw;text-align:left}
  .svhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
  .svk{font-size:10px;font-weight:900;letter-spacing:.16em;color:var(--ink);opacity:.55}
  .svprog{font-size:9px;font-weight:900;letter-spacing:.1em;color:var(--ink);opacity:.5}
  .svq{font-size:17px;font-weight:900;line-height:1.24;letter-spacing:-.01em;color:var(--ink);margin-bottom:11px}
  .svopts{display:flex;flex-direction:column;gap:7px}
  .svopt{font-size:12.5px;font-weight:800;text-align:left;border:2.5px solid var(--ink);color:var(--ink);background:var(--paper);cursor:pointer;padding:10px 12px;font-family:inherit;transition:.12s;display:flex;align-items:center;gap:9px}
  .svopt:hover{background:var(--ink);color:var(--mint)}
  .svopt .n{font-weight:900;color:var(--mint2);flex:0 0 auto}
  .svopt:hover .n{color:var(--mint)}
  .svfoot{margin-top:11px;text-align:center}
  .svfoot a{font-size:10px;font-weight:800;color:var(--ink);opacity:.6;text-decoration:underline;cursor:pointer}
  .svdone{display:none;margin-top:14px;font-size:10px;font-weight:800;color:var(--ink);opacity:.66;text-align:center}
  .svdone a{text-decoration:underline;cursor:pointer;font-weight:900;color:var(--ink)}
  .app.empty.surv .huge,.app.empty.surv .subline,.app.empty.surv .egs,.app.empty.surv .setup{display:none}
  .app.empty.surv .survey{display:flex}
  /* composer */
  .selbar{display:none;align-items:center;gap:6px;font-size:10px;font-weight:800;color:var(--ink);background:var(--mint);border:2.5px solid var(--ink);padding:5px 9px;margin-bottom:8px}
  .selbar.on{display:flex} .selbar b{font-weight:900}
  .reng{font-size:13px;font-weight:900;padding:5px 10px;border:2.5px solid var(--ink);color:var(--ink);background:transparent;cursor:pointer;margin-right:-2.5px;user-select:none;line-height:1}
  .reng:hover{background:var(--ink);color:var(--mint)}
  .modal{position:fixed;inset:0;background:rgba(20,20,43,.55);display:none;align-items:center;justify-content:center;z-index:60}
  .modal.on{display:flex}
  .sheet{width:calc(100% - 36px);max-width:400px;background:var(--paper);border:3px solid var(--ink);padding:14px}
  .sheet h3{font-size:13px;font-weight:900;margin-bottom:8px}
  .sheet label{display:block;font-size:9px;font-weight:900;letter-spacing:.1em;opacity:.7;margin:8px 0 4px}
  .sheet input[type=text]{width:100%;border:2.5px solid var(--ink);background:#fff;padding:8px 10px;font-size:12px;font-weight:700;color:var(--ink);font-family:inherit}
  .sheet .row{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:11px;font-weight:800;cursor:pointer}
  .sheet .h2{font-size:9px;font-weight:700;opacity:.55;margin-top:5px;line-height:1.5}
  .sheet .acts{display:flex;margin-top:13px}
  .sheet .acts button{flex:1;border:3px solid var(--ink);font-size:11px;font-weight:900;padding:8px;cursor:pointer;font-family:inherit}
  .sheet .sv{background:var(--mint);color:var(--ink);margin-right:-3px} .sheet .cx{background:var(--paper);color:var(--ink)}
  .toast{position:fixed;left:50%;bottom:66px;transform:translateX(-50%);background:var(--ink);color:var(--mint);font-size:10.5px;font-weight:800;padding:7px 12px;z-index:70;opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center}
  .toast.on{opacity:1}
  .propchip{align-self:flex-start;font-size:10.5px;font-weight:900;border:2.5px solid var(--ink);background:var(--mint);color:var(--ink);cursor:pointer;padding:6px 10px;margin-bottom:8px}
  .propchip:hover{background:var(--mint2)}
  .propset{align-self:stretch;background:var(--paper);border:3px solid var(--ink);margin:2px 0 4px}
  .propset .ph{background:var(--ink);color:var(--paper);display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:10.5px;font-weight:900}
  .propset .ph .re{margin-left:auto;font-size:9.5px;font-weight:900;color:var(--ink);background:var(--mint);padding:4px 8px;cursor:pointer}
  .propset .ph .re:hover{background:var(--mint2)}
  .popt{padding:9px 11px;border-top:2px solid #d5d5ea;cursor:pointer;position:relative}
  .popt:hover{background:#fff}
  .popt.sel{background:var(--ink)} .popt.sel *{color:var(--paper)!important}
  .popt .nm{font-size:12.5px;font-weight:900;margin-bottom:3px}
  .popt .why{font-size:10.5px;font-weight:700;line-height:1.5;color:#3a3a55}
  .popt .trade{font-size:9.5px;font-weight:700;color:#8a8ab0;margin-top:4px}
  .popt .pick{position:absolute;top:9px;right:10px;width:16px;height:16px;border:2.5px solid #bcbcd6;border-radius:50%}
  .popt.sel .pick{border-color:var(--mint);background:var(--mint)}
  .pfoot{display:none;padding:8px 10px;border-top:2px solid var(--ink)}
  .pfoot.on{display:flex}
  .pfoot button{flex:1;border:2.5px solid var(--ink);font-size:10.5px;font-weight:900;padding:7px;cursor:pointer;font-family:inherit}
  .pfoot .pbuild{background:var(--mint);color:var(--ink);margin-right:-2.5px} .pfoot .pbuild:hover{background:var(--mint2)}
  .pfoot .pdig{background:var(--paper);color:var(--ink)}
  .composer{padding:8px 12px 12px;flex:0 0 auto}
  .engs{display:flex;gap:0;margin-bottom:8px;flex-wrap:wrap;align-items:center}
  .eng{font-size:10px;font-weight:900;letter-spacing:.02em;padding:6px 10px;border:2.5px solid var(--ink);color:var(--ink);cursor:pointer;margin-right:-2.5px;background:transparent;display:flex;align-items:center;gap:6px}
  .eng .dt{width:8px;height:8px;border-radius:50%}
  .eng.on{background:var(--ink);color:var(--mint)}
  .eng.off{opacity:.35;cursor:not-allowed}
  .conn{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:10px;font-weight:900;padding:6px 10px;border:2.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
  .cdot{width:8px;height:8px;border-radius:50%;background:var(--coral);flex:0 0 auto}
  .conn.on{background:var(--ink);color:var(--mint)} .conn.on .cdot{background:#22C55E}
  .conn.connecting .cdot{background:#F0B429;animation:tl .8s ease-in-out infinite}
  .attach{display:none;gap:8px;margin-bottom:8px;align-items:center}
  .attach.on{display:flex}
  .thumb{position:relative;width:44px;height:44px;border:2.5px solid var(--ink);background-size:cover;background-position:center;flex:0 0 auto}
  .thumb .x{position:absolute;top:-8px;right:-8px;width:18px;height:18px;background:var(--ink);color:var(--mint);font-weight:900;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid var(--paper)}
  .dock{display:flex;align-items:stretch;border:3px solid var(--ink);background:var(--paper)}
  .dock .plus{width:38px;background:var(--ink);color:var(--mint);font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  #inp{flex:1;border:none;outline:none;background:transparent;font-size:12.5px;font-weight:700;color:var(--ink);padding:0 10px;min-width:0;font-family:inherit;resize:none;line-height:38px;max-height:38px}
  #inp::placeholder{color:#6b6b8a}
  .send{background:var(--mint);border:none;border-left:3px solid var(--ink);cursor:pointer;padding:0 12px;display:flex;align-items:center;transition:.15s;color:var(--ink);font-weight:900;font-size:16px}
  .send:hover{background:var(--mint2)}
  .send.stop{background:var(--coral)}
  .stopsq{display:inline-block;width:11px;height:11px;background:#fff}
  /* dark */
  body.dark{--blue:#15152e;--ink:#EAEAFB;--paper:#23233f}
  body.dark .huge .o{color:var(--mint)}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:20}
  .grip{position:fixed;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;z-index:50;touch-action:none;background:linear-gradient(135deg,transparent 52%,var(--ink) 52%,var(--ink) 64%,transparent 64%,transparent 78%,var(--ink) 78%)}
  #screenflash{position:fixed;inset:0;background:var(--mint);opacity:0;pointer-events:none;z-index:40}
  #screenflash.go{animation:flash2 .62s ease-out}
  @keyframes flash2{0%{opacity:0}10%{opacity:.48}23%{opacity:0}38%{opacity:.48}52%{opacity:0}100%{opacity:0}}
  @media(prefers-reduced-motion:reduce){#screenflash.go{animation:none}}
  .app.dragover{outline:3px dashed var(--ink);outline-offset:-6px}
</style></head><body>
<div class="app empty" id="app">
  <header>
    <div class="logo" id="brandLogo" style="cursor:pointer" title="Mothershipサイトを開く"><span class="mk"></span><b>MOTHERSHIP</b><span id="verTag" style="margin-left:2px;font-size:9px;font-weight:900;letter-spacing:.02em;color:var(--ink);border:1.6px solid var(--ink);border-radius:999px;padding:1px 5px;line-height:1;align-self:center;opacity:.72">V3</span></div>
    <div class="hic">
      <div id="btnEdit" title="編集（studio）">✎</div>
      <div id="btnLib" title="ライブラリ">▤</div>
      <div id="btnFzMinus" title="文字を小さく" style="font-size:11px">A−</div>
      <div id="btnFzPlus" title="文字を大きく" style="font-size:11px">A+</div>
      <div id="btnCfg" title="会話の保存設定" style="font-size:12px">⚙</div>
    </div>
  </header>
  <div class="stage">
    <canvas class="target" id="target"></canvas>
    <div class="status" id="status">未接続</div>
    <div class="hero" id="hero">
      <div class="huge">なぜから、<br><span class="o">かたちまで。</span></div>
      <div class="subline">UX体験設計を、対話で立てる。</div>
      <div class="survey" id="survey"></div>
      <div class="egs" id="egs"></div>
      <div class="setup" id="setup"><span id="setupmsg">はじめて？ relay を起動して［接続］</span> · <a id="setuplink">セットアップ →</a></div>
    </div>
  </div>
  <div class="convo" id="convo"></div>
  <div class="composer">
    <div class="selbar" id="selbar"></div>
    <div class="engs" id="engs">
      <div class="reng" id="btnClear" title="新規会話（リセット）">↻</div>
      <button class="conn" id="conn"><span class="cdot"></span><span id="connlab">接続</span></button>
    </div>
    <div class="attach" id="attach"></div>
    <input type="file" id="file" accept="image/*" style="display:none">
    <button class="propchip" id="propBtn">✦ この相談に3案ください</button>
    <div class="dock">
      <div class="plus" id="plus" title="画像を添付">+</div>
      <input id="inp" placeholder="作る・聞く・相談…" autocomplete="off">
      <button class="send" id="send" title="送信">›</button>
    </div>
  </div>
</div>
<div class="modal" id="cfgModal">
  <div class="sheet" style="position:relative">
    <button id="cfgX" title="閉じる" style="position:absolute;top:8px;right:8px;width:26px;height:26px;border:2.5px solid var(--ink);background:var(--paper);color:var(--ink);font-weight:900;font-size:13px;cursor:pointer;line-height:1">✕</button>
    <h3>⚙ 会話の保存</h3>
    <label>保存先フォルダ（絶対パス / ~ 可）</label>
    <div style="display:flex;gap:0"><input type="text" id="cfgDir" placeholder="~/Documents/Mothership/chats" style="flex:1;min-width:0"><button id="cfgPick" style="border:2.5px solid var(--ink);border-left:none;background:var(--ink);color:var(--mint);font-weight:900;font-size:11px;padding:0 12px;cursor:pointer;font-family:inherit;white-space:nowrap">選ぶ</button></div>
    <div class="h2">会話を .md で保存。無いフォルダは自動作成。Obsidianのフォルダを指定すればそのまま蓄積できます。Enterで確定。</div>
    <div class="row"><input type="checkbox" id="cfgAuto"><span>返信ごとに自動保存する</span></div>
    <div class="row"><input type="checkbox" id="cfgDark"><span>ダークモード</span></div>
    <div class="row"><input type="checkbox" id="cfgLang"><span>英語で表示・会話（EN）</span></div>
    <div class="acts"><button class="sv" id="cfgSave">保存</button><button class="cx" id="cfgClose">閉じる</button></div>
    <div class="acts" style="margin-top:7px"><button class="cx" id="cfgSaveNow" style="margin:0">この会話を今すぐ .md 書き出し</button></div>
    <div class="acts" style="margin-top:7px"><button class="sv" id="cfgSaveDoc" style="margin:0">この相談を「設計書」にまとめて保存</button></div>
    <div style="margin-top:12px;text-align:center;font-size:10px;font-weight:800"><a id="linkSite" style="color:var(--blue);cursor:pointer;text-decoration:underline">Mothership サイト</a><span style="opacity:.4"> · </span><a id="linkStudio" style="color:var(--blue);cursor:pointer;text-decoration:underline">木下スタジオ</a></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="grip" id="grip" title="ドラッグで窓をリサイズ"></div>
<canvas id="fx"></canvas>
<div id="screenflash"></div>
<script>
// ============ relay 設定 ============
var RELAY = 'http://localhost:4575';
var inIframe = (window.parent && window.parent !== window);
function toParent(msg){ if(inIframe) parent.postMessage({pluginMessage:msg},'*'); }
function openExt(path){ if(inIframe) toParent({type:'open', url:RELAY+path}); else window.open(RELAY+path,'_blank'); }
function openUrl(u){ if(inIframe) toParent({type:'open', url:u}); else window.open(u,'_blank'); }

// ============ 母艦コア：canvas状態機械（idle→gather→thinking→done） ============
var cvs=document.getElementById('target'),X=cvs.getContext('2d');
var CS=180,C=90,D2=2;cvs.width=CS*D2;cvs.height=CS*D2;X.scale(D2,D2);
var RINGS=[{r:70,n:28},{r:48,n:18},{r:26,n:10}];
var ps=[];
RINGS.forEach(function(ring,ri){for(var i=0;i<ring.n;i++){var mint=(i%(ri===0?7:4))===0;ps.push({x:C,y:C,vx:0,vy:0,ri:ri,baseA:(i/ring.n)*Math.PI*2,rr:ring.r,base:mint?'#6FD3AE':'#EDEDF7',col:mint?'#6FD3AE':'#EDEDF7',sz:ri===0?5.4:ri===1?5:5.2,grp:ps.length%3,_i:ps.length});}});
var N=ps.length,statusEl=document.getElementById('status');
function _catPts(N){var a=[],cx=90,cy=97,R=33,ears=[[66,58],[55,41],[80,64],[114,58],[125,41],[100,64]],eyes=[[78,93],[103,93]],nose=[[90,102]],fx=ears.concat(eyes,nose),hn=N-fx.length;for(var i=0;i<hn;i++){var an=(i/hn)*6.283;a.push([cx+Math.cos(an)*R,cy+Math.sin(an)*R*0.94]);}return a.concat(fx);}
function _qPts(N){var a=[],cx=90,hn=Math.round(N*0.5),sn=Math.round(N*0.3),dn=N-hn-sn,a0=Math.PI*1.2,a1=-Math.PI*0.2,hr=21,hcy=60,ex=cx,ey=hcy;for(var i=0;i<hn;i++){var f=hn>1?i/(hn-1):0,an=a0+(a1-a0)*f;ex=cx+Math.cos(an)*hr;ey=hcy+Math.sin(an)*hr;a.push([ex,ey]);}for(i=0;i<sn;i++){var ff=sn>1?i/(sn-1):0;a.push([ex+(cx-ex)*Math.min(1,ff*1.7),ey+(100-ey)*ff]);}for(i=0;i<dn;i++){var ad=(i/Math.max(1,dn))*6.283;a.push([cx+Math.cos(ad)*3.2,112+Math.sin(ad)*3.2]);}return a;}
var CAT=_catPts(N),QM=_qPts(N);
function _heartPts(N){var a=[];for(var i=0;i<N;i++){var tt=(i/N)*6.283;var x=16*Math.pow(Math.sin(tt),3);var y=13*Math.cos(tt)-5*Math.cos(2*tt)-2*Math.cos(3*tt)-Math.cos(4*tt);a.push([90+x*1.9,86-y*1.9]);}return a;}
function _starPts(N){var cx=90,cy=93,R=40,r=17,v=[];for(var k=0;k<10;k++){var an=-Math.PI/2+k*Math.PI/5,rr=(k%2===0)?R:r;v.push([cx+Math.cos(an)*rr,cy+Math.sin(an)*rr]);}var a=[];for(var i=0;i<N;i++){var pos=(i/N)*10,sg=Math.floor(pos),f=pos-sg,p0=v[sg%10],p1=v[(sg+1)%10];a.push([p0[0]+(p1[0]-p0[0])*f,p0[1]+(p1[1]-p0[1])*f]);}return a;}
var HEART=_heartPts(N),STAR=_starPts(N);
var PHASE_SEC=4;
var state='idle',st=0,rot=0,spd=0.006,flash=0,doneR=0,ripples=[],CORE='#14142B',thinkT0=0,thinkPhase=0,LAST_MS=20;
function ripple(r,g){ripples.push({r:r,o:0.85,g:g});}
function setState(s){if(state===s)return;state=s;st=0;
  if(s==='thinking'){thinkT0=performance.now();thinkPhase=0;}
  if(s==='gather'){flash=1;}
  if(s==='done'){flash=1;doneR=1;ps.forEach(function(p){var a=Math.random()*6.283,sp=2.5+Math.random()*3.4;p.vx=Math.cos(a)*sp;p.vy=Math.sin(a)*sp;p.col='#9FE3C8';});}}
function react(){if(state!=='idle')return;spd=0.06;ripple(10,3.4);for(var k=0;k<4;k++){var p=ps[(Math.random()*N)|0];p.vx+=(Math.random()-.5)*3.6;p.vy+=(Math.random()-.5)*3.6;}}
function loop(t){st++;X.clearRect(0,0,CS,CS);
  rot+=spd;spd+=(0.006-spd)*0.05;
  for(var i=ripples.length-1;i>=0;i--){var rp=ripples[i];rp.r+=rp.g;rp.o-=0.024;if(rp.o<=0){ripples.splice(i,1);continue;}X.beginPath();X.arc(C,C,Math.max(0,rp.r),0,6.283);X.strokeStyle='rgba(159,227,200,'+rp.o.toFixed(2)+')';X.lineWidth=(2.2*rp.o).toFixed(2);X.stroke();}
  if(doneR>0){doneR-=0.03;X.beginPath();X.arc(C,C,(1-doneR)*82,0,6.283);X.strokeStyle='rgba(159,227,200,'+doneR.toFixed(2)+')';X.lineWidth=(6*doneR).toFixed(2);X.stroke();}
  ps.forEach(function(p){var tx,ty,tsz=p.sz;
    if(state==='idle'){var a=p.baseA+rot;tx=C+Math.cos(a)*p.rr;ty=C+Math.sin(a)*p.rr;}
    else if(state==='gather'){tx=C;ty=C;}
    else if(state==='thinking'){thinkPhase=Math.floor((t-thinkT0)/1000/PHASE_SEC)%8;var fx=Math.sin(t*0.0022+p._i*0.7)*2.6,fy=Math.cos(t*0.0025+p._i)*2.6;
      if(thinkPhase===0){var g=p.grp;tx=C+(g-1)*32;ty=C-Math.abs(Math.sin(t*0.006+g*2.09))*24;tsz=p.sz*1.5;}
      else if(thinkPhase===1){var a2=p.baseA*3+t*0.02;tx=C+Math.cos(a2)*30;ty=C+Math.sin(a2)*30;tsz=p.sz*1.15;}
      else if(thinkPhase===2){var r2=15+(Math.sin(t*0.004+p.baseA*2)+1)/2*26;tx=C+Math.cos(p.baseA)*r2;ty=C+Math.sin(p.baseA)*r2;tsz=p.sz*1.1;}
      else if(thinkPhase===3){var qc=CAT[p._i]||[C,C];tx=qc[0]+fx;ty=qc[1]+fy;tsz=p.sz;}
      else if(thinkPhase===4){var qq=QM[p._i]||[C,C];tx=qq[0]+fx;ty=qq[1]+fy;tsz=p.sz;}
      else if(thinkPhase===5){var qh=HEART[p._i]||[C,C];tx=qh[0]+fx;ty=qh[1]+fy;tsz=p.sz;}
      else if(thinkPhase===6){var qs=STAR[p._i]||[C,C];tx=qs[0]+fx;ty=qs[1]+fy;tsz=p.sz;}
      else{var an5=p.baseA+rot;tx=C+Math.cos(an5)*42;ty=C+Math.sin(an5)*42;tsz=p.sz*0.85;}}
    if(state==='done'){if(st>24){var a3=p.baseA+rot,rx=C+Math.cos(a3)*p.rr,ry=C+Math.sin(a3)*p.rr;p.vx+=(rx-p.x)*0.14;p.vy+=(ry-p.y)*0.14;}p.vx*=0.85;p.vy*=0.85;}
    else{var k=state==='gather'?0.22:(state==='thinking'?0.2:0.14);p.vx+=(tx-p.x)*k;p.vy+=(ty-p.y)*k;p.vx*=0.6;p.vy*=0.6;}
    p.x+=p.vx;p.y+=p.vy;
    X.beginPath();X.arc(p.x,p.y,tsz,0,6.283);X.fillStyle=p.col;X.fill();});
  if(state==='idle'){X.beginPath();X.arc(C,C,6,0,6.283);X.fillStyle=CORE;X.fill();}
  if(state==='thinking'&&thinkPhase===7){var _rem=Math.max(0,Math.round(LAST_MS)-Math.floor((t-thinkT0)/1000));X.save();X.font='900 34px "Helvetica Neue",Arial,sans-serif';X.textAlign='center';X.textBaseline='middle';X.fillStyle=CORE;X.fillText(String(_rem),C,C+2);X.restore();}
  if(flash>0){flash-=0.09;X.beginPath();X.arc(C,C,12+(1-flash)*12,0,6.283);X.fillStyle='rgba(255,255,255,'+(flash*0.85).toFixed(2)+')';X.fill();}
  if(state==='gather'&&st>24)setState('thinking');
  if(state==='done'&&st>44){setState('idle');ps.forEach(function(p){p.col=p.base;});}
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);

async function poll(){
  try{var r=await fetch(RELAY+'/pull',{cache:'no-store'});var d=await r.json();
    setStatus('接続済 · v'+d.version);
    if(d.version!==lastVer && d.json && d.json!=='{}'){lastVer=d.version;toParent({type:'live',json:d.json});}
  }catch(e){setStatus('relay待機中…');}
}
async function connect(){
  setConnUI('connecting');setStatus('接続中…');
  var ok=false,probe=null;
  try{var r=await fetch(RELAY+'/pull',{cache:'no-store'});if(r.ok){probe=await r.json();ok=true;}}catch(e){}
  if(!ok){connected=false;setConnUI(false);setStatus('relay待機中…');ripple(60,-3.2);flash=1;return;}
  connected=true;setConnUI(true);
  try{localStorage.setItem('ms_conn','1');}catch(e){}
  lastVer=(probe&&typeof probe.version!=='undefined')?probe.version:-1;
  poll();timer=setInterval(poll,1200);
  loadChatLog();loadEngines();
  setInterval(pollChat,1400);setInterval(pollBusy,700);
}
function disconnect(){connected=false;setConnUI(false);setStatus('未接続');if(timer)clearInterval(timer);
  try{localStorage.setItem('ms_conn','0');}catch(e){}
  var e=document.getElementById('engine-wrap');if(e)e.remove();}
connEl.onclick=function(){connected?disconnect():connect();};

var cbusy=false,thinkEl=null,sendQueue=[],pendingImg=null;
var sendBtn=document.getElementById('send');
function setBusy(b){cbusy=b;if(b){sendBtn.classList.add('stop');sendBtn.innerHTML='<span class="stopsq"></span>';setState('gather');}else{sendBtn.classList.remove('stop');sendBtn.innerHTML='›';}try{updateSelbar();}catch(e){}}
function phaseMsg(s){var A=[[0,'うーん、考えてるよ…！'],[12,'読み解いてるよ〜'],[28,'構成を練ってるよ！'],[48,'組み立ててるよ〜！'],[78,'細部を整えてるよ、もう少し！'],[120,'大物だ…！あと少し待ってね🙏']];var m=A[0][1];for(var i=0;i<A.length;i++)if(s>=A[i][0])m=A[i][1];return m;}
async function doSend(p){
  setBusy(true);app.classList.remove('empty');
  bubble('me',p.disp,p.img);
  var t0=Date.now();
  thinkEl=document.createElement('div');thinkEl.className='think';thinkEl.innerHTML='<span class="loadring"></span><span class="ph"></span><span class="secs">0.0s</span>';convo.appendChild(thinkEl);scrollEnd();
  var ph=thinkEl.querySelector('.ph'),secs=thinkEl.querySelector('.secs');
  function upd(){var s=(Date.now()-t0)/1000;secs.textContent=s.toFixed(1)+'s';ph.textContent=phaseMsg(s);}upd();
  var ti=setInterval(upd,200);
  try{
    var r=await fetch(RELAY+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:p.sendMsg,image:p.img||'',display:p.disp,engine:aiEngine,lang:lang})});
    var d=await r.json();clearInterval(ti);if(thinkEl){thinkEl.remove();thinkEl=null;}
    var sc=((Date.now()-t0)/1000).toFixed(1);
    if(d.aborted){bubble('ms','⏹ 停止しました  ·  ⏱'+sc+'s');}
    else if(d.ok){LAST_MS=parseFloat(sc)||LAST_MS;setState('done');flashScreen();streamReply(d.text,sc);}
    else{setState('idle');bubble('err',(d.error||'失敗')+(d.text?'\n\n'+d.text:''));}
  }catch(e){clearInterval(ti);if(thinkEl){thinkEl.remove();thinkEl=null;}setState('idle');bubble('err','relayに繋がりません\n'+(e.message||e));}
  setBusy(false);inp.focus();scrollEnd();pollChat();
  if(CFG_AUTO)setTimeout(function(){saveChatMd(true);},1400);   // タスク5：返信後に自動で.md保存（chatLog同期を待つ）
  if(sendQueue.length){var nx=sendQueue.shift();doSend(nx);}
}
function suck(txt){ ripple(9,3.4); flash=1; }   // 送信フィードバック（コアに波紋＋閃光）
function flashScreen(){ var f=document.getElementById('screenflash'); if(!f)return; f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); }   // 母艦が答える瞬間＝画面全体2回フラッシュ
function chatSend(){
  var text=inp.value.trim();
  if(!text&&!pendingImg)return;
  if(!connected){app.classList.remove('empty');var s=document.createElement('div');s.className='sys';s.textContent='⚠ 母艦に未接続です。右下の「接続」を押してください。';convo.appendChild(s);scrollEnd();ripple(60,-3.2);flash=1;return;}
  var img=pendingImg;clearPending();
  var sm=text;                                              // 送信本文（画面表示dispとは別。オンボの回答を初回だけ隠しコンテキストとして前置）
  if(pendingProfile){sm=pendingProfile+(text?('\n\n'+text):'');pendingProfile='';}
  var payload={sendMsg:sm,disp:text,img:img};
  inp.value='';
  suck(text);
  if(cbusy){sendQueue.push(payload);var q=bubble('me','⏳ '+payload.disp,payload.img);q.style.opacity='.55';scrollEnd();return;}
  doSend(payload);
}

var CFG_AUTO=true,_chatFile=null;
function _cfile(){if(!_chatFile){var d=new Date(),z=function(n){return String(n).padStart(2,'0');};_chatFile='会話_'+d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+'_'+z(d.getHours())+z(d.getMinutes())+'.md';}return _chatFile;}
function _ctitle(){var f=chatLog.find(function(e){return e.cls==='me';});return f?('母艦: '+String(f.text||'').slice(0,24)):'母艦 会話ログ';}
function _cmsgs(){return chatLog.filter(function(e){return e.cls==='me'||e.cls==='ms';}).map(function(e){return{role:e.cls==='me'?'user':'assistant',text:e.text||''};});}
function toast(m){var t=document.getElementById('toast');if(!t)return;t.textContent=m;t.classList.add('on');setTimeout(function(){t.classList.remove('on');},2200);}
async function saveChatMd(silent){if(!connected){if(!silent)toast('relayに接続してください');return;}var msgs=_cmsgs();if(!msgs.length){if(!silent)toast('まだ会話がありません');return;}
  try{var r=await fetch(RELAY+'/save-chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:_ctitle(),file:_cfile(),messages:msgs})});var d=await r.json();if(d.ok){if(!silent)toast('保存しました → '+d.file);}else if(!silent)toast('保存失敗');}catch(e){if(!silent)toast('保存失敗（relay?）');}}
var cfgModal=document.getElementById('cfgModal');
function _saveCfg(){var dir=document.getElementById('cfgDir').value.trim(),auto=document.getElementById('cfgAuto').checked;fetch(RELAY+'/chat-config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({saveDir:dir,autoSave:auto})}).then(function(r){return r.json();}).then(function(d){if(d.ok){CFG_AUTO=d.config.autoSave;toast('設定を保存しました');cfgModal.classList.remove('on');}else toast('設定保存失敗');}).catch(function(){toast('設定保存失敗（relay?）');});}
document.getElementById('btnCfg').onclick=function(){document.getElementById('cfgDark').checked=document.body.classList.contains('dark');document.getElementById('cfgLang').checked=(lang==='en');fetch(RELAY+'/chat-config').then(function(r){return r.json();}).then(function(c){document.getElementById('cfgDir').value=c.saveDir||'';document.getElementById('cfgAuto').checked=c.autoSave!==false;CFG_AUTO=c.autoSave!==false;cfgModal.classList.add('on');}).catch(function(){cfgModal.classList.add('on');});};
document.getElementById('cfgDark').onchange=function(){setDark(this.checked);};
document.getElementById('cfgLang').onchange=function(){setLang(this.checked?'en':'ja');};
// タスク1：選べる提案セット（AIが方向違いの3案→カード・選択・もう一周）
function _lastUserMsg(){var a=chatLog.filter(function(e){return e.cls==='me';});return a.length?String(a[a.length-1].text||''):'';}
function renderProps(opts,ask){var box=document.createElement('div');box.className='propset';box.innerHTML='<div class="ph">✦ 提案 '+opts.length+'案 <span class="re">↻ もう一周</span></div><div class="opts"></div><div class="pfoot"><button class="pbuild">▶ この案でFigmaに作る</button><button class="pdig">深掘りする</button></div>';
  var opd=box.querySelector('.opts'),foot=box.querySelector('.pfoot'),selName=null;
  opts.forEach(function(o,i){var nm=o.name||('案'+(i+1));var el=document.createElement('div');el.className='popt';el.innerHTML='<div class="pick"></div><div class="nm">'+esc(nm)+'</div><div class="why">'+esc(o.why||'')+'</div>'+(o.trade?'<div class="trade">△ '+esc(o.trade)+'</div>':'');
    el.onclick=function(){box.querySelectorAll('.popt').forEach(function(x){x.classList.remove('sel');});el.classList.add('sel');selName=nm;foot.classList.add('on');};opd.appendChild(el);});
  foot.querySelector('.pbuild').onclick=function(){if(!selName)return;inp.value='「'+selName+'」の方向で作って。';chatSend();};
  foot.querySelector('.pdig').onclick=function(){if(!selName)return;inp.value='「'+selName+'」を選んだ。なぜそれが効くか・実装で気をつける点を深掘りして。';chatSend();};
  box.querySelector('.re').onclick=function(){box.remove();propose(ask);};convo.appendChild(box);scrollEnd();}
async function propose(ask){if(!ask||!ask.trim()){var s=document.createElement('div');s.className='sys';s.textContent='相談を入力するか、先に会話してから押してね。';convo.appendChild(s);scrollEnd();return;}
  if(!connected){app.classList.remove('empty');var s2=document.createElement('div');s2.className='sys';s2.textContent='⚠ 母艦に未接続です。右下の「接続」を。';convo.appendChild(s2);scrollEnd();return;}
  app.classList.remove('empty');var th=document.createElement('div');th.className='think';th.innerHTML='<span class="loadring"></span>✦ 方向違いの3案を考え中…';convo.appendChild(th);scrollEnd();setState('gather');
  try{var msgs=chatLog.filter(function(e){return e.cls==='me'||e.cls==='ms';}).map(function(e){return{role:e.cls==='me'?'user':'assistant',text:e.text||''};});
    var r=await fetch(RELAY+'/propose',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ask:ask,history:msgs,engine:aiEngine})});var d=await r.json();th.remove();
    if(d.ok&&d.options&&d.options.length){setState('done');flashScreen();renderProps(d.options,ask);}else{bubble('err','提案に失敗: '+(d.error||''));setState('idle');}
  }catch(e){th.remove();bubble('err','提案に失敗（relay?）');setState('idle');}}
document.getElementById('propBtn').onclick=function(){propose(inp.value.trim()||_lastUserMsg());};
document.getElementById('cfgClose').onclick=function(){cfgModal.classList.remove('on');};
document.getElementById('cfgX').onclick=function(){cfgModal.classList.remove('on');};
document.getElementById('linkSite').onclick=function(){openUrl('https://kinoshita.studio/mothership/');};
document.getElementById('linkStudio').onclick=function(){openUrl('https://kinoshita.studio/');};
var _bl1=document.getElementById('brandLogo');if(_bl1)_bl1.onclick=function(){openUrl('https://kinoshita.studio/mothership/');};
document.getElementById('cfgSave').onclick=_saveCfg;
document.getElementById('cfgPick').onclick=function(){var b=this;b.textContent='…';fetch(RELAY+'/pick-folder').then(function(r){return r.json();}).then(function(d){b.textContent='選ぶ';if(d.ok&&d.path){document.getElementById('cfgDir').value=d.path;}else if(d.error&&d.error.indexOf('キャンセル')<0){toast(d.error);}}).catch(function(){b.textContent='選ぶ';toast('選択に失敗（relay?）');});};
document.getElementById('cfgSaveNow').onclick=function(){saveChatMd(false);};
document.getElementById('cfgSaveDoc').onclick=async function(){if(!connected){toast('relayに接続してください');return;}var msgs=_cmsgs();if(!msgs.length){toast('まだ会話がありません');return;}toast('設計書を作成中…（少し待ってね）');
  try{var r=await fetch(RELAY+'/save-doc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:_ctitle(),messages:msgs,engine:aiEngine})});var d=await r.json();if(d.ok){toast('設計書を保存 → '+d.file);}else toast('設計書失敗: '+(d.error||''));}catch(e){toast('設計書失敗（relay?）');}};
document.getElementById('cfgDir').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();_saveCfg();}});
try{fetch(RELAY+'/chat-config').then(function(r){return r.json();}).then(function(c){CFG_AUTO=c.autoSave!==false;}).catch(function(){});}catch(e){}

// ============ 言語 ============
var lang='ja';
function setLang(l){lang=l;var bl=document.getElementById('btnLang');if(bl)bl.textContent=l==='ja'?'JP':'EN';
  var sub=document.querySelector('.subline'),ph=document.getElementById('inp'),hg=document.querySelector('.huge');
  if(l==='en'){if(hg)hg.innerHTML='FROM THE WHY,<br><span class="o">TO THE FORM.</span>';if(sub)sub.textContent='Design the experience, through dialogue.';if(ph)ph.placeholder='Build · Ask · Consult…';connLab.textContent=connected?'Connected':'Connect';}
  else{if(hg)hg.innerHTML='なぜから、<br><span class="o">かたちまで。</span>';if(sub)sub.textContent='UX体験設計を、対話で立てる。';if(ph)ph.placeholder='作る・聞く・相談…';connLab.textContent=connected?'接続済':'接続';}
  renderEgs();updateSetup();}
var _bl0=document.getElementById('btnLang');if(_bl0)_bl0.onclick=function(){setLang(lang==='ja'?'en':'ja');};

// ============ オンボ：最初の5問アンケート（1タップで進み、答えを"あなた仕様"に流し込む） ============
var SURVEY=[
 {k:'make',q:{ja:'何をつくる人？',en:'What do you make?'},opts:[
   {v:'ui',ja:'UI・プロダクト',en:'UI · Product'},{v:'brand',ja:'ブランド・ロゴ',en:'Brand · Logo'},
   {v:'lp',ja:'資料・LP',en:'Deck · LP'},{v:'explore',ja:'これから探す',en:'Still exploring'}]},
 {k:'hand',q:{ja:'今いちばん欲しい手は？',en:'The hand you want most?'},opts:[
   {v:'make',ja:'作る',en:'Build'},{v:'why',ja:'なぜを立てる',en:'Frame the why'},
   {v:'tidy',ja:'整える',en:'Tidy up'},{v:'export',ja:'書き出す',en:'Export'}]},
 {k:'engine',q:{ja:'動かすエンジンは？',en:'Which engine?'},opts:[
   {v:'claude',ja:'Claude',en:'Claude'},{v:'gemini',ja:'Gemini',en:'Gemini'},{v:'codex',ja:'Codex',en:'Codex'}]},
 {k:'tone',q:{ja:'相棒のトーンは？',en:'Partner’s tone?'},opts:[
   {v:'friendly',ja:'親しみ',en:'Friendly'},{v:'polite',ja:'丁寧',en:'Polite'},{v:'casual',ja:'フランク',en:'Casual'}]},
 {k:'lang',q:{ja:'言語は？',en:'Language?'},opts:[
   {v:'ja',ja:'日本語',en:'日本語'},{v:'en',ja:'English',en:'English'}]}
];
var EGP={
 ui:{ja:['オンボーディングの体験を設計したい','ダッシュボードを一画面つくる','この画面、なぜ迷うか診断して'],en:['Design the onboarding experience','Build a dashboard screen','Why is this screen confusing?']},
 brand:{ja:['ロゴ案を3つ','ブランドの世界観を言葉にしたい','配色とタイポを決めたい'],en:['3 logo ideas','Put the brand world into words','Decide palette & type']},
 lp:{ja:['料金表を3プランで','LPのファーストビューを作る','CTAの文言を練りたい'],en:['A 3-tier pricing table','Build an LP hero','Sharpen the CTA copy']},
 explore:null
};
var EGH={make:{ja:'まず一画面つくってみる',en:'Build a first screen'},why:{ja:'なにを作るべきか整理したい',en:'Figure out what to build'},tidy:{ja:'このフレームを整えて',en:'Tidy this frame'},export:{ja:'library JSONで持ち出す',en:'Export as library JSON'}};
var LMK={ui:{ja:'UI・プロダクト',en:'UI/product'},brand:{ja:'ブランド・ロゴ',en:'brand/logo'},lp:{ja:'資料・LP',en:'decks/LP'},explore:{ja:'これから探す',en:'still exploring'}};
var LHD={make:{ja:'作る',en:'build'},why:{ja:'なぜを立てる',en:'frame the why'},tidy:{ja:'整える',en:'tidy up'},export:{ja:'書き出す',en:'export'}};
var LTN={friendly:{ja:'親しみのある相棒',en:'friendly partner'},polite:{ja:'丁寧な言葉づかい',en:'polite tone'},casual:{ja:'フランクに砕けて',en:'casual/frank'}};
var svIdx=0,svAns={};
function surveyDone(){try{return !!localStorage.getItem('ms_survey');}catch(e){return false;}}
function startSurvey(){svIdx=0;svAns={};var h=document.getElementById('hero');if(h)h.classList.add('surv');renderSurvey();}
function renderSurvey(){var box=document.getElementById('survey');if(!box)return;box.innerHTML='';var q=SURVEY[svIdx];
  var dots=document.createElement('div');dots.className='svdots';for(var i=0;i<SURVEY.length;i++){var d=document.createElement('span');d.className=i<svIdx?'on':(i===svIdx?'cur':'');dots.appendChild(d);}box.appendChild(dots);
  var qt=document.createElement('div');qt.className='svq';qt.textContent=(svIdx+1)+'. '+(q.q[lang]||q.q.ja);box.appendChild(qt);
  q.opts.forEach(function(o){var b=document.createElement('button');b.className='svopt';b.textContent=(o[lang]||o.ja);b.onclick=function(){answerSurvey(q.k,o.v);};box.appendChild(b);});
  var sk=document.createElement('button');sk.className='svskip';sk.textContent=lang==='en'?'Set up later →':'あとで設定する →';sk.onclick=function(){finishSurvey(true);};box.appendChild(sk);}
function answerSurvey(k,v){svAns[k]=v;
  if(k==='engine'){aiEngine=v;var w=document.getElementById('engine-wrap');if(w){w.querySelectorAll('.eng').forEach(function(x){x.classList.toggle('on',x.textContent.toLowerCase().indexOf(v)===0);});}}
  if(k==='lang'){setLang(v);}
  svIdx++;if(svIdx>=SURVEY.length)finishSurvey(false);else renderSurvey();}
function buildEgOverride(a){var base=a.make&&EGP[a.make]?EGP[a.make]:null,h=a.hand&&EGH[a.hand]?EGH[a.hand]:null;if(!base&&!h)return null;
  function mk(l){var arr=[];if(h)arr.push(h[l]);(base?base[l]:EG[l]).forEach(function(x){arr.push(x);});return arr.filter(function(v,i,arr2){return arr2.indexOf(v)===i;}).slice(0,4);}
  return {ja:mk('ja'),en:mk('en')};}
function buildProfile(a){if(!a||(!a.make&&!a.hand&&!a.tone))return '';
  if(lang==='en'){var p=['(Mothership onboarding profile — respond tailored to this from now on.)'];
    if(a.make&&LMK[a.make])p.push('Makes: '+LMK[a.make].en+'.');if(a.hand&&LHD[a.hand])p.push('Wants most: '+LHD[a.hand].en+'.');
    if(a.tone&&LTN[a.tone])p.push('Tone: '+LTN[a.tone].en+'.');return p.join(' ');}
  var q=['（母艦オンボのプロフィール。以降これに沿って"あなた仕様"で応じて。）'];
  if(a.make&&LMK[a.make])q.push('つくるもの：'+LMK[a.make].ja+'。');if(a.hand&&LHD[a.hand])q.push('いちばん欲しい手：'+LHD[a.hand].ja+'。');
  if(a.tone&&LTN[a.tone])q.push('トーン：'+LTN[a.tone].ja+'。');return q.join('');}
function applyProfile(a,firstRun){if(!a)return;if(a.lang&&a.lang!==lang)setLang(a.lang);if(a.engine)aiEngine=a.engine;
  egOverride=buildEgOverride(a);renderEgs();
  if(a.tone==='casual'&&document.body)document.body.setAttribute('data-tone','casual');
  if(firstRun)pendingProfile=buildProfile(a);}
function finishSurvey(skipped){try{localStorage.setItem('ms_survey',JSON.stringify(svAns));}catch(e){}
  var h=document.getElementById('hero');if(h)h.classList.remove('surv');
  applyProfile(svAns,true);
  var sub=document.querySelector('.subline');if(sub){if(skipped)sub.textContent=lang==='en'?'The hand that builds, the head that asks "why". Into the mothership.':'作る手も、"なぜこの体験か"を立てる頭も。母艦へ。';
    else sub.textContent=lang==='en'?'Got your profile. Pick an example below, or just throw it in.':'プロフィール受け取ったよ。下の例から選ぶか、そのまま投げて。';}}

(function(){try{var raw=localStorage.getItem('ms_survey');if(raw){applyProfile(JSON.parse(raw),false);}}catch(e){}})();
renderEgs();renderChatLog();
if(!surveyDone()&&(typeof chatLog==='undefined'||!chatLog.length))startSurvey();

// パネルサイズ通知（Figma）
var _gripDragging=false;
function notifySize(){if(_gripDragging)return;toParent({type:'panelsize', w:Math.round(window.innerWidth), h:Math.round(window.innerHeight), remember:false});}
window.addEventListener('resize',notifySize);
// タスク3：右下グリップをドラッグで窓を自由リサイズ（rAFで滑らかに間引き・ドラッグ中は保存せず離した時だけ保存）
// ドラッグ中は _gripDragging=true にして、figma側リサイズが起こすwindow'resize'→notifySizeの送り返し（競合カクつき）を止める
(function(){var grip=document.getElementById('grip'),rz=null,pend=null,raf=0;if(!grip)return;
  function flush(){raf=0;if(!pend)return;toParent({type:'panelsize',w:pend.w,h:pend.h,remember:false});pend=null;}
  grip.addEventListener('pointerdown',function(e){e.preventDefault();_gripDragging=true;rz={x:e.screenX,y:e.screenY,w:window.innerWidth,h:window.innerHeight};try{grip.setPointerCapture(e.pointerId);}catch(_){}});
  grip.addEventListener('pointermove',function(e){if(!rz)return;pend={w:Math.max(320,rz.w+(e.screenX-rz.x)),h:Math.max(380,rz.h+(e.screenY-rz.y))};if(!raf)raf=requestAnimationFrame(flush);});
  var end=function(){if(!rz)return;var fw=pend?pend.w:window.innerWidth,fh=pend?pend.h:window.innerHeight;toParent({type:'panelsize',w:fw,h:fh,remember:true});pend=null;rz=null;_gripDragging=false;};
  grip.addEventListener('pointerup',end);grip.addEventListener('pointercancel',end);})();
</script>
