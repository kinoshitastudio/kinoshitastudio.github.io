<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1920" viewBox="0 0 1920 1920">
  <!-- 1920x1920 正方。中央の y=480..1440 (1920x960) が書き出しバンド。qlmanage で正方描画→中央クロップ -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="48%" r="34%">
      <stop offset="0" stop-color="#c2a25b" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#c2a25b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c0c0e"/>
      <stop offset="1" stop-color="#08080a"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1920" fill="url(#bg)"/>
  <rect width="1920" height="1920" fill="url(#glow)"/>
  <rect x="40" y="520" width="1840" height="880" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- eyebrow -->
  <text x="960" y="676" text-anchor="middle"
        font-family="-apple-system,'SF Pro Text',system-ui,sans-serif" font-size="26"
        letter-spacing="7" font-weight="600" fill="#c2a25b" opacity="0.9">KINOSHITA STUDIO</text>

  <!-- infinity mark (center ~ y970) -->
  <g transform="translate(688,702) scale(8.4)">
    <path d="M32 32 C32 18.5 11 18.5 11 32 C11 45.5 32 45.5 32 32 C32 18.5 53 18.5 53 32 C53 45.5 32 45.5 32 32 Z"
          fill="none" stroke="#c8a559" stroke-width="4.4" stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <text x="960" y="1090" text-anchor="middle"
        font-family="-apple-system,'SF Pro Display',system-ui,sans-serif" font-size="116"
        letter-spacing="16" font-weight="600" fill="#ededee">MOTHERSHIP</text>

  <!-- tagline -->
  <text x="960" y="1170" text-anchor="middle"
        font-family="-apple-system,'SF Pro Text',system-ui,sans-serif" font-size="34"
        letter-spacing="1" font-weight="400" fill="#c7c7cf">Chat your way to real, editable Figma nodes.</text>

  <!-- sub -->
  <text x="960" y="1318" text-anchor="middle"
        font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="23"
        letter-spacing="2" font-weight="400" fill="#8a8a93">Judgment is human  ·  Translation is AI  ·  Pro / Max</text>
</svg>
