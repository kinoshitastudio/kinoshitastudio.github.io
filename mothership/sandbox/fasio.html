<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,follow">
<title>FASIO KV — HTML authoring (Mothership sandbox)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#cfcfcf;display:flex;justify-content:center;align-items:flex-start;padding:40px;font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif}
  .kv{position:relative;width:800px;height:800px;background:#f3ede1;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.18)}

  /* 写真エリア（実写真のプレースホルダ：ボタニカルなグラデ＋上の光） */
  .photo{position:absolute;inset:0 0 auto 0;height:566px;
    background:
      radial-gradient(120% 90% at 62% 18%, rgba(255,255,255,.55), rgba(255,255,255,0) 46%),
      linear-gradient(125deg,#d8e7c7 0%,#a7c489 48%,#b8c89f 100%);}
  .photo .ph-note{position:absolute;left:24px;top:22px;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.12em;color:rgba(40,60,40,.4)}

  .catch{position:absolute;top:42px;right:44px;text-align:right;color:#3a4a36;font-weight:600;font-size:25px;line-height:35px;letter-spacing:.04em}
  .botanical{position:absolute;top:126px;right:44px;font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;font-weight:600;letter-spacing:.28em;color:#566a4c}

  .tagline{position:absolute;top:404px;right:46px;color:#fff;font-size:16px;font-weight:500;letter-spacing:.08em}
  .fasio{position:absolute;top:420px;right:40px;color:#fff;
    font-family:'Futura','Century Gothic','Avenir Next',sans-serif;
    font-size:96px;font-weight:600;letter-spacing:.06em;line-height:1}

  /* 下パネル */
  .band{position:absolute;left:0;top:566px;width:100%;height:9px;background:#e7dcc6}
  .panel{position:absolute;left:0;top:575px;width:100%;height:225px;background:#f3ede1}

  .badge{position:absolute;left:36px;top:548px;width:104px;height:104px;border-radius:50%;
    background:#5e7a52;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    box-shadow:0 5px 14px rgba(52,68,44,.3)}
  .badge .d{font-family:'Helvetica Neue',Arial,sans-serif;font-size:24px;font-weight:800;letter-spacing:.02em}
  .badge .s{font-size:11.5px;font-weight:500;letter-spacing:.04em}

  .product{position:absolute;left:164px;top:572px;font-size:24px;font-weight:700;color:#262422;letter-spacing:.02em}
  .colors{position:absolute;left:166px;top:614px;font-size:13px;color:#6a665e;letter-spacing:.02em}
  .swatches{position:absolute;left:40px;top:676px;display:flex;gap:12px}
  .swatches i{width:16px;height:72px;border-radius:8px;display:block}
  .note{position:absolute;left:166px;top:760px;font-size:10.5px;color:#9a958c}
</style>
</head>
<body>
  <div class="kv">
    <div class="photo"><span class="ph-note">PHOTO — placeholder（実写真に差し替え）</span></div>

    <div class="catch">まつ毛に、<br>ふわりと春が来た</div>
    <div class="botanical">BOTANICAL COLLECTION</div>

    <div class="tagline">なじむ、らしさ、つづく。</div>
    <div class="fasio">FASIO</div>

    <div class="band"></div>
    <div class="panel"></div>

    <div class="badge"><span class="d">2.16</span><span class="s">限定発売</span></div>
    <div class="product">パーマネントカール マスカラWP（ロング）</div>
    <div class="colors">全3色（ロージーピンク / セージグリーン / ヘーゼルナッツベージュ）</div>
    <div class="swatches"><i style="background:#b56a72"></i><i style="background:#7f9a64"></i><i style="background:#b39877"></i></div>
    <div class="note">※限定品は数に限りがございますので、品切れの際はご容赦ください。</div>
  </div>
</body>
</html>
