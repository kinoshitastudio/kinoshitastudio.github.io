<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mothership — ライブラリ</title>
<style>
  :root{--bg:#1b1b19;--panel:#23231f;--ink:#e8e5de;--faint:#8a8a80;--line:#33332f;--gold:#a89060;--live:#5a9c6a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'SF Mono','Space Mono',ui-monospace,monospace;font-size:13px}
  header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px}
  .logo{font-weight:700;letter-spacing:.26em;font-size:13px}
  .logo svg{vertical-align:-3px;margin-right:8px}
  .logo span{color:var(--gold)}
  .nav{margin-left:auto;display:flex;gap:8px}
  a.btn,button{font-family:inherit;font-size:11px;letter-spacing:.1em;border-radius:6px;padding:8px 13px;cursor:pointer;
    border:1px solid var(--line);background:var(--panel);color:var(--ink);text-decoration:none;transition:.15s;white-space:nowrap}
  a.btn:hover,button:hover{border-color:var(--gold);color:#fff}
  button.gold{background:var(--gold);color:#1a1a18;border-color:var(--gold);font-weight:700}
  .wrap{padding:22px;max-width:1100px;margin:0 auto}
  .sub{color:var(--faint);font-size:11px;letter-spacing:.06em;margin:0 0 18px;line-height:1.6}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
  .card{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:15px;display:flex;flex-direction:column;gap:10px}
  .card .name{font-size:14px;font-weight:700;letter-spacing:.02em}
  .card .file{color:var(--faint);font-size:10px;letter-spacing:.04em;word-break:break-all}
  .card .row{display:flex;gap:8px;margin-top:2px}
  .card .row button{flex:1}
  .empty{color:var(--faint);padding:40px;text-align:center}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2a2a24;border:1px solid var(--gold);
    color:#fff;padding:10px 16px;border-radius:8px;font-size:12px;opacity:0;transition:.2s;pointer-events:none}
  #toast.on{opacity:1}
</style>
</head>
<body>
  <header>
    <div class="logo"><svg width="22" height="15" viewBox="2 9 46 32" fill="none" stroke="#a89060" stroke-width="4.2" stroke-linecap="round"><path d="M25 25 C25 11 4 11 4 25 C4 39 25 39 25 25 C25 11 46 11 46 25 C46 39 25 39 25 25 Z"/></svg>M O T H E R S H I P<span> · ライブラリ</span></div>
    <div class="nav">
      <a class="btn" href="/studio.html">✎ 詰める</a>
    </div>
  </header>
  <div class="wrap">
    <p class="sub">詰め済みパターンの蓄積。「Figmaに送る」で原本(mothership.json)に流し込み → 接続中のプラグインがネイティブ生成。「詰める」はそのまま studio で開いて調整。</p>
    <div class="grid" id="grid"><div class="empty">読み込み中…</div></div>
  </div>
  <div id="toast"></div>
<script>
  var RELAY = location.origin; // relay自身が配信
  var toastT;
  function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove('on');},1800); }

  async function send(file){
    var r = await fetch(RELAY+'/'+file, {cache:'no-store'});
    var txt = await r.text();
    await fetch(RELAY+'/push', {method:'POST', body:txt});
    return txt;
  }

  async function load(){
    var grid = document.getElementById('grid');
    try{
      var list = await (await fetch(RELAY+'/list',{cache:'no-store'})).json();
      if(!list.length){ grid.innerHTML='<div class="empty">まだパターンがありません。studioで詰めて library/ に保存してね。</div>'; return; }
      grid.innerHTML='';
      list.forEach(function(it){
        var c=document.createElement('div'); c.className='card';
        c.innerHTML='<div class="name"></div><div class="file"></div><div class="row">'
          +'<button class="gold send">Figmaに送る</button><button class="tune">詰める</button></div>';
        c.querySelector('.name').textContent=it.name;
        c.querySelector('.file').textContent=it.file;
        c.querySelector('.send').onclick=async function(){ await send(it.file); toast('Figmaに送りました（接続中のプラグインに反映）'); };
        c.querySelector('.tune').onclick=async function(){ await send(it.file); location.href='/studio.html'; };
        grid.appendChild(c);
      });
    }catch(e){ grid.innerHTML='<div class="empty">relayに接続できません。<br>cd mothership && node relay.js で起動してください。</div>'; }
  }
  load();
</script>
</body>
</html>
