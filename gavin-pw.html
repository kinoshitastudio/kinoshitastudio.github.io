<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Gavin PW</title>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Space+Mono:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{overflow:hidden;width:100%;height:100%;-webkit-text-size-adjust:100%;overscroll-behavior:none}
:root{
  --bg:#111;--surface:#1c1c1c;--surface2:#222;--border:#2a2a2a;
  --text:#f0f0f0;--muted:#555;--muted2:#888;
  --c-green:#5ecf5a;--c-green-s:#3a9c37;
  --c-red:#ff6b6b;--c-red-s:#cc4040;
  --c-blue:#74c0fc;--c-blue-s:#3a8fd4;
  --c-yellow:#ffd43b;--c-yellow-s:#c8a800;
  --c-purple:#cc5de8;--c-purple-s:#9b2eb0;
  --c-orange:#ff922b;--c-orange-s:#cc6600;
  --c-teal:#3ecf8e;--c-teal-s:#2a9e6a;
  --c-grey:#adb5bd;--c-grey-s:#6c757d;
  --c-pink:#f783ac;--c-pink-s:#c44f77;
}
body{font-family:'Zen Kaku Gothic New',sans-serif;background:var(--bg);color:var(--text);height:100%;font-size:14px;overflow:hidden;overscroll-behavior:none}
input,textarea,button,select{font-family:inherit;font-size:inherit}
button{cursor:pointer;border:none;background:none;color:inherit}

/* ── BG DECORATIONS ── */
#bg-deco{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.clay-deco{
  position:absolute;border-radius:60% 40% 55% 45% / 50% 60% 40% 55%;
  pointer-events:none;z-index:0;
  animation:blobDrift 8s linear infinite;
}
.clay-deco:nth-child(1){width:180px;height:130px;background:var(--c-green);top:-50px;left:-40px;opacity:.22;animation-delay:0s}
.clay-deco:nth-child(2){width:130px;height:100px;background:var(--c-blue);top:22%;right:-35px;opacity:.2;animation-delay:1.5s;border-radius:40% 60% 45% 55% / 60% 40% 55% 45%}
.clay-deco:nth-child(3){width:150px;height:110px;background:var(--c-yellow);bottom:12%;left:-40px;opacity:.2;animation-delay:3s}
.clay-deco:nth-child(4){width:110px;height:85px;background:var(--c-purple);bottom:-30px;right:-20px;opacity:.22;animation-delay:4.5s;border-radius:45% 55% 60% 40% / 55% 45% 50% 50%}
.clay-deco:nth-child(5){width:80px;height:65px;background:var(--c-orange);top:58%;left:33%;opacity:.1;animation-delay:6s}
.clay-deco:nth-child(6){width:100px;height:75px;background:var(--c-pink);top:40%;left:-25px;opacity:.15;animation-delay:2s;border-radius:50% 50% 40% 60% / 45% 55% 60% 40%}
.clay-deco:nth-child(7){width:90px;height:70px;background:var(--c-teal);top:5%;right:15%;opacity:.12;animation-delay:3.5s;border-radius:55% 45% 60% 40% / 40% 60% 45% 55%}
@keyframes blobDrift{
  0%  {animation-timing-function:steps(1,end);border-radius:60% 40% 55% 45% / 50% 60% 40% 55%;transform:translateY(0) rotate(0deg)}
  16% {animation-timing-function:steps(1,end);border-radius:50% 60% 45% 55% / 60% 40% 55% 45%;transform:translateY(-12px) rotate(3deg)}
  33% {animation-timing-function:steps(1,end);border-radius:45% 55% 60% 40% / 45% 55% 50% 50%;transform:translateY(6px) rotate(-2deg)}
  50% {animation-timing-function:steps(1,end);border-radius:55% 45% 50% 50% / 55% 45% 60% 40%;transform:translateY(-14px) rotate(4deg)}
  66% {animation-timing-function:steps(1,end);border-radius:48% 52% 58% 42% / 52% 48% 45% 55%;transform:translateY(4px) rotate(-1deg)}
  83% {animation-timing-function:steps(1,end);border-radius:52% 48% 44% 56% / 48% 58% 52% 42%;transform:translateY(-8px) rotate(2deg)}
  100%{border-radius:60% 40% 55% 45% / 50% 60% 40% 55%;transform:translateY(0) rotate(0deg)}
}

/* ── LOCK SCREEN ── */
#lock-screen{
  position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:36px;z-index:100
}
#lock-screen.hidden{display:none}

/* Clay sign scene */
.clay-sign-scene{position:relative;width:220px;height:230px;flex-shrink:0;animation:sceneBob 2.4s linear infinite}
.clay-blob-base{
  position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:210px;height:90px;
  background:radial-gradient(ellipse at 35% 30%, #80e87c, var(--c-green));
  border-radius:62% 38% 55% 45% / 50% 62% 38% 50%;
  box-shadow:0 10px 0 var(--c-green-s),0 16px 40px rgba(0,0,0,.7),inset 0 4px 8px rgba(255,255,255,.35);
  animation:blobBounce 1.6s linear infinite;
}
@keyframes signWobble{
  0%  {animation-timing-function:steps(1,end);transform:translateX(calc(-50% + 8px)) rotate(-5deg)}
  14% {animation-timing-function:steps(1,end);transform:translateX(calc(-50% + 11px)) rotate(-8deg)}
  28% {animation-timing-function:steps(1,end);transform:translateX(calc(-50% + 6px)) rotate(-2deg)}
  42% {animation-timing-function:steps(1,end);transform:translateX(calc(-50% + 10px)) rotate(-7deg)}
  57% {animation-timing-function:steps(1,end);transform:translateX(calc(-50% + 7px)) rotate(-3deg)}
  71% {animation-timing-function:steps(1,end);transform:translateX(calc(-50% + 9px)) rotate(-6deg)}
  85% {animation-timing-function:steps(1,end);transform:translateX(calc(-50% + 8px)) rotate(-4deg)}
  100%{transform:translateX(calc(-50% + 8px)) rotate(-5deg)}
}
@keyframes stickSway{
  0%  {animation-timing-function:steps(1,end);transform:translateX(calc(-50% + 4px)) rotate(-4deg)}
  14% {animation-timing-function:steps(1,end);transform:translateX(calc(-50% + 6px)) rotate(-6deg)}
  28% {animation-timing-function:steps(1,end);transform:translateX(calc(-50% + 3px)) rotate(-2deg)}
  42% {animation-timing-function:steps(1,end);transform:translateX(calc(-50% + 5px)) rotate(-5deg)}
  57% {animation-timing-function:steps(1,end);transform:translateX(calc(-50% + 3px)) rotate(-2deg)}
  71% {animation-timing-function:steps(1,end);transform:translateX(calc(-50% + 5px)) rotate(-4deg)}
  85% {animation-timing-function:steps(1,end);transform:translateX(calc(-50% + 4px)) rotate(-3deg)}
  100%{transform:translateX(calc(-50% + 4px)) rotate(-4deg)}
}
@keyframes blobBounce{
  0%  {animation-timing-function:steps(1,end);transform:translateX(-50%) scaleX(1) scaleY(1);border-radius:62% 38% 55% 45% / 50% 62% 38% 50%}
  25% {animation-timing-function:steps(1,end);transform:translateX(-50%) scaleX(1.07) scaleY(.94);border-radius:55% 45% 62% 38% / 45% 55% 50% 50%}
  50% {animation-timing-function:steps(1,end);transform:translateX(-50%) scaleX(.97) scaleY(1.04);border-radius:50% 60% 45% 55% / 62% 38% 55% 45%}
  75% {animation-timing-function:steps(1,end);transform:translateX(-50%) scaleX(1.05) scaleY(.95);border-radius:58% 42% 52% 48% / 48% 58% 42% 52%}
  100%{transform:translateX(-50%) scaleX(1) scaleY(1);border-radius:62% 38% 55% 45% / 50% 62% 38% 50%}
}
@keyframes sceneBob{
  0%  {animation-timing-function:steps(1,end);transform:translateY(0px)}
  20% {animation-timing-function:steps(1,end);transform:translateY(-8px)}
  40% {animation-timing-function:steps(1,end);transform:translateY(-3px)}
  60% {animation-timing-function:steps(1,end);transform:translateY(-10px)}
  80% {animation-timing-function:steps(1,end);transform:translateY(-2px)}
  100%{transform:translateY(0px)}
}
.clay-stick{
  position:absolute;bottom:52px;left:50%;
  animation:stickSway 1.8s linear infinite;
  width:16px;height:110px;
  background:linear-gradient(to right,#d4a96a 0%,#e8c07a 40%,#c8975a 100%);
  border-radius:4px 4px 2px 2px;
  box-shadow:3px 3px 6px rgba(0,0,0,.5);
}
.clay-paper{
  position:absolute;bottom:140px;left:50%;
  animation:signWobble 1.8s linear infinite;
  width:130px;height:88px;
  background:linear-gradient(160deg,#fdfcf5,#f5f0e0);
  border-radius:3px 5px 4px 2px;
  box-shadow:3px 5px 12px rgba(0,0,0,.5),inset 0 0 0 1px rgba(0,0,0,.06);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:'Permanent Marker',cursive;font-size:26px;color:#1a1a3a;line-height:1.15;
  padding:8px;text-align:center;
}
.clay-paper::before{
  content:'';position:absolute;top:0;left:0;right:0;bottom:0;
  background:repeating-linear-gradient(transparent,transparent 22px,rgba(100,140,200,.12) 22px,rgba(100,140,200,.12) 23px);
  border-radius:inherit;pointer-events:none;
}

.lock-form{display:flex;flex-direction:column;gap:10px;width:260px;position:relative;z-index:1}
.lock-form input{
  background:#1e1e1e;border:2px solid #333;border-radius:16px;
  padding:13px 18px;color:var(--text);outline:none;
  letter-spacing:.08em;transition:border-color .2s;font-size:14px;
  box-shadow:0 4px 0 #0a0a0a,inset 0 2px 4px rgba(0,0,0,.3);
}
.lock-form input:focus{border-color:#555}
.lock-form input::placeholder{color:var(--muted)}
.lock-btn{
  background:radial-gradient(ellipse at 40% 30%,#80e87c,var(--c-green));
  color:#1a3a1a;border-radius:18px;padding:14px;
  font-family:'Space Mono',monospace;font-size:12px;font-weight:700;letter-spacing:.15em;
  text-transform:uppercase;
  box-shadow:0 6px 0 var(--c-green-s),0 8px 20px rgba(0,0,0,.5),inset 0 2px 4px rgba(255,255,255,.4);
  transition:transform .1s,box-shadow .1s;
}
.lock-btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--c-green-s),0 4px 10px rgba(0,0,0,.5)}
.lock-err{font-size:11px;color:var(--c-red);text-align:center;min-height:16px;letter-spacing:.05em}
.lock-hint{font-size:11px;color:var(--muted2);text-align:center;letter-spacing:.05em}
.lock-tagline{text-align:center;color:var(--muted2);font-size:11px;line-height:1.9;letter-spacing:.04em;max-width:300px;padding:0 24px;margin-top:-12px}

/* ── ANIMATIONS ── */
@keyframes clayPop{
  0%  {animation-timing-function:steps(1,end);transform:scale(.65) rotate(-8deg);opacity:0}
  30% {animation-timing-function:steps(1,end);transform:scale(.85) rotate(4deg);opacity:.5}
  60% {animation-timing-function:steps(1,end);transform:scale(1.08) rotate(-2deg);opacity:1}
  80% {animation-timing-function:steps(1,end);transform:scale(.97) rotate(1deg);opacity:1}
  100%{transform:scale(1) rotate(var(--card-rot,0deg));opacity:1}
}
@keyframes addPulse{
  0%  {animation-timing-function:steps(1,end);transform:scale(1);box-shadow:0 4px 0 var(--c-green-s),0 6px 14px rgba(0,0,0,.4),inset 0 1px 3px rgba(255,255,255,.4)}
  33% {animation-timing-function:steps(1,end);transform:scale(1.14);box-shadow:0 7px 0 var(--c-green-s),0 10px 28px rgba(94,207,90,.6),inset 0 1px 3px rgba(255,255,255,.4)}
  66% {animation-timing-function:steps(1,end);transform:scale(1.07);box-shadow:0 5px 0 var(--c-green-s),0 8px 20px rgba(94,207,90,.4),inset 0 1px 3px rgba(255,255,255,.4)}
  100%{transform:scale(1);box-shadow:0 4px 0 var(--c-green-s),0 6px 14px rgba(0,0,0,.4),inset 0 1px 3px rgba(255,255,255,.4)}
}
@keyframes copyBounce{
  0%  {animation-timing-function:steps(1,end);transform:translateY(0) scale(1)}
  30% {animation-timing-function:steps(1,end);transform:translateY(-7px) scale(1.22)}
  60% {animation-timing-function:steps(1,end);transform:translateY(2px) scale(.9)}
  100%{transform:translateY(0) scale(1)}
}

/* ── MAIN APP ── */
#app{display:none;flex-direction:column;height:100vh;position:relative;z-index:1;overflow-x:hidden;max-width:100vw}
#app.visible{display:flex}

/* Header */
#header{
  display:flex;align-items:center;gap:12px;padding:14px 20px;
  border-bottom:2px solid #1e1e1e;flex-shrink:0;background:var(--bg);
  background:linear-gradient(180deg,#181818,#111);
}
.app-logo{
  font-family:'Permanent Marker',cursive;font-size:22px;color:var(--c-green);
  text-shadow:3px 3px 0 var(--c-green-s),0 0 30px rgba(94,207,90,.3);
  white-space:nowrap;letter-spacing:.02em
}
#search{
  flex:1;min-width:0;background:#1a1a1a;border:2px solid #2a2a2a;border-radius:14px;
  padding:9px 16px;color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s;
  box-shadow:0 4px 0 #0a0a0a,inset 0 2px 4px rgba(0,0,0,.4);font-size:13px;
}
#search:focus{border-color:#3a3a3a;box-shadow:0 4px 0 #0a0a0a,0 0 0 3px rgba(94,207,90,.15),inset 0 2px 4px rgba(0,0,0,.4)}
#search::placeholder{color:var(--muted)}
.hdr-btn{
  width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;transition:transform .1s,box-shadow .1s;
}
#add-btn{
  background:radial-gradient(ellipse at 35% 25%,#90ee8a,var(--c-green));color:#0d2a0d;font-weight:900;
  box-shadow:0 5px 0 var(--c-green-s),0 7px 18px rgba(0,0,0,.5),inset 0 2px 4px rgba(255,255,255,.45);
  animation:addPulse 2.4s linear infinite;
}
#add-btn:active{transform:translateY(4px)!important;box-shadow:0 1px 0 var(--c-green-s)!important;animation:none}
#lock-btn{
  background:radial-gradient(ellipse at 35% 25%,#999,#555);color:#fff;
  box-shadow:0 5px 0 #2a2a2a,0 7px 18px rgba(0,0,0,.5);
}
#lock-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #2a2a2a}

/* Category bar */
#cat-bar{
  display:flex;gap:8px;padding:12px 20px;border-bottom:1px solid #1e1e1e;
  overflow-x:auto;flex-shrink:0;scrollbar-width:none;background:#0e0e0e;
}
#cat-bar::-webkit-scrollbar{display:none}
.cat-chip{
  padding:8px 16px;border-radius:22px;font-size:11px;font-weight:700;letter-spacing:.07em;
  white-space:nowrap;transition:transform .1s,box-shadow .1s,filter .1s;
  box-shadow:0 5px 0 rgba(0,0,0,.5),inset 0 2px 3px rgba(255,255,255,.25);
  color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4);
}
.cat-chip:hover{filter:brightness(1.1);transform:translateY(-1px)}
.cat-chip:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.5)}
.cat-chip[data-cat="all"]   {background:radial-gradient(ellipse at 35% 25%,#ccc,#888);box-shadow:0 5px 0 var(--c-grey-s)}
.cat-chip[data-cat="Gmail"] {background:radial-gradient(ellipse at 35% 25%,#ff9a9a,var(--c-red));box-shadow:0 5px 0 var(--c-red-s)}
.cat-chip[data-cat="GitHub"]{background:radial-gradient(ellipse at 35% 25%,#d5d5d5,var(--c-grey));box-shadow:0 5px 0 var(--c-grey-s);color:#222}
.cat-chip[data-cat="Supabase"]{background:radial-gradient(ellipse at 35% 25%,#7af0be,var(--c-teal));box-shadow:0 5px 0 var(--c-teal-s);color:#0d2a1a}
.cat-chip[data-cat="ドメイン"]{background:radial-gradient(ellipse at 35% 25%,#b0d8ff,var(--c-blue));box-shadow:0 5px 0 var(--c-blue-s);color:#0d1a2a}
.cat-chip[data-cat="サービス"]{background:radial-gradient(ellipse at 35% 25%,#e898ff,var(--c-purple));box-shadow:0 5px 0 var(--c-purple-s)}
.cat-chip[data-cat="銀行"]  {background:radial-gradient(ellipse at 35% 25%,#ffec70,var(--c-yellow));box-shadow:0 5px 0 var(--c-yellow-s);color:#2a1a00}
.cat-chip[data-cat="APIキー"]{background:radial-gradient(ellipse at 35% 25%,#f9a8c8,var(--c-pink));box-shadow:0 5px 0 var(--c-pink-s)}
.cat-chip[data-cat="シード"]{background:radial-gradient(ellipse at 35% 25%,#90ee8a,var(--c-green));box-shadow:0 5px 0 var(--c-green-s);color:#0d2a0d}
.cat-chip[data-cat="ライセンス"]{background:radial-gradient(ellipse at 35% 25%,#d5d5d5,var(--c-grey));box-shadow:0 5px 0 var(--c-grey-s);color:#222}
.cat-chip[data-cat="その他"]{background:radial-gradient(ellipse at 35% 25%,#ffb06a,var(--c-orange));box-shadow:0 5px 0 var(--c-orange-s)}
.cat-chip.active{transform:translateY(4px)!important;box-shadow:0 1px 0 rgba(0,0,0,.5)!important;filter:brightness(1.15)!important}

/* Entry list */
#entry-list{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.empty-msg{
  display:flex;flex-direction:column;align-items:center;gap:16px;padding:60px 0;
  font-family:'Permanent Marker',cursive;font-size:20px;color:var(--muted2);letter-spacing:.05em;
}
.empty-blobs{display:flex;gap:10px;justify-content:center}
.empty-blob{
  border-radius:60% 40% 55% 45% / 50% 60% 40% 55%;
  animation:blobWobble 3s ease-in-out infinite;
}

/* Entry row — full clay card */
.entry-row{
  border-radius:22px;overflow:hidden;
  transition:transform .15s cubic-bezier(.34,1.56,.64,1),box-shadow .15s;
  border-left:9px solid #444;
  animation:clayPop .48s linear both;
}
.entry-row:hover{transform:translateY(-5px) rotate(0deg) scale(1.015)!important}
.entry-row.expanded{transform:translateY(-4px) rotate(0deg)!important}
.entry-header{display:flex;align-items:center;gap:12px;padding:16px 18px;cursor:pointer}
.entry-cat-badge{
  padding:6px 13px;border-radius:14px;font-size:10px;font-weight:700;
  letter-spacing:.07em;text-transform:uppercase;flex-shrink:0;
  box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 2px 3px rgba(255,255,255,.25);
}
.entry-info{flex:1;min-width:0}
.entry-service{
  font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;color:var(--text);letter-spacing:.01em;
}
.entry-login{font-size:11px;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px;font-family:'Space Mono',monospace}
.entry-quick-copy{
  font-size:12px;font-weight:700;padding:9px 16px;border-radius:14px;flex-shrink:0;
  background:radial-gradient(ellipse at 35% 25%,#90ee8a,var(--c-green));
  color:#0d2a0d;
  box-shadow:0 4px 0 var(--c-green-s),0 6px 16px rgba(0,0,0,.4),inset 0 2px 3px rgba(255,255,255,.35);
  transition:transform .1s,box-shadow .1s;letter-spacing:.05em;
}
.entry-quick-copy:active{transform:translateY(3px);box-shadow:0 1px 0 var(--c-green-s)}
.entry-quick-copy.copied{
  background:radial-gradient(ellipse at 35% 25%,#7af0be,var(--c-teal));
  color:#0d2a1a;box-shadow:0 4px 0 var(--c-teal-s);
  animation:copyBounce .4s linear;
}

/* Entry detail */
.entry-detail{padding:0 16px;max-height:0;overflow:hidden;transition:max-height .25s ease,padding .25s ease}
.entry-detail.open{max-height:400px;padding:0 16px 16px}
.detail-divider{height:1px;background:var(--border);margin-bottom:14px}
.detail-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.detail-label{font-size:9px;color:var(--muted2);letter-spacing:.12em;text-transform:uppercase;width:72px;flex-shrink:0;padding-top:3px}
.detail-val{flex:1;min-width:0}
.detail-text{font-family:'Space Mono',monospace;font-size:12px;word-break:break-all;color:var(--text)}
.detail-pw{letter-spacing:.12em}
.detail-actions{display:flex;gap:6px;margin-top:6px}
.detail-btn{
  font-size:10px;font-weight:700;padding:4px 10px;border-radius:8px;
  background:var(--surface2);color:var(--muted2);
  box-shadow:0 2px 0 #0a0a0a,inset 0 1px 2px rgba(255,255,255,.05);
  transition:all .1s;letter-spacing:.04em;
}
.detail-btn:hover{color:var(--text);background:#2a2a2a}
.detail-btn:active{transform:translateY(1px);box-shadow:none}
.detail-btn.copied{background:radial-gradient(ellipse at 40% 30%,#6ee8b0,var(--c-teal));color:#1a3a2a;box-shadow:0 2px 0 var(--c-teal-s)}
.detail-link{color:var(--c-blue);text-decoration:none;font-family:'Space Mono',monospace;font-size:12px;word-break:break-all}
.detail-link:hover{color:var(--text)}
.detail-notes{font-size:12px;color:var(--muted2);line-height:1.7;white-space:pre-wrap}
.detail-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.edit-btn{
  font-size:11px;padding:6px 14px;border-radius:10px;
  background:radial-gradient(ellipse at 40% 30%,#a0d4ff,var(--c-blue));
  color:#1a2a3a;font-weight:700;
  box-shadow:0 3px 0 var(--c-blue-s),inset 0 1px 2px rgba(255,255,255,.3);
  transition:transform .1s,box-shadow .1s;
}
.edit-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--c-blue-s)}
.del-btn{
  font-size:11px;padding:6px 14px;border-radius:10px;

#modal-overlay{

  background:var(--surface);border:1px solid #333;border-radius:20px;

  position:absolute;right:10px;top:50%;transform:translateY(-50%);

<script>
const SALT_LEN=16,IV_LEN=12,ITER=100000;
async function deriveKey(p,s){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptData(d,p){const s=crypto.getRandomValues(new Uint8Array(SALT_LEN)),iv=crypto.getRandomValues(new Uint8Array(IV_LEN)),k=await deriveKey(p,s),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(JSON.stringify(d)));const o=new Uint8Array(SALT_LEN+IV_LEN+ct.byteLength);o.set(s,0);o.set(iv,SALT_LEN);o.set(new Uint8Array(ct),SALT_LEN+IV_LEN);return btoa(String.fromCharCode(...o))}
async function decryptData(e,p){const b=Uint8Array.from(atob(e),c=>c.charCodeAt(0)),s=b.slice(0,SALT_LEN),iv=b.slice(SALT_LEN,SALT_LEN+IV_LEN),ct=b.slice(SALT_LEN+IV_LEN),k=await deriveKey(p,s),pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},k,ct);return JSON.parse(new TextDecoder().decode(pt))}

const STORAGE_KEY='gavin_pw_v1';
let vault={version:1,entries:[]},masterPassword=null,currentCat='all',expandedId=null,editingId=null,lockTimer=null,towerMode=false;
const SESSION_KEY='gavin_pw_session';
const LOCK_MINUTES=15;

function hasVault(){return!!localStorage.getItem(STORAGE_KEY)}
async function saveVault(){localStorage.setItem(STORAGE_KEY,await encryptData(vault,masterPassword))}
async function loadVault(p){const e=localStorage.getItem(STORAGE_KEY);if(!e)return false;try{vault=await decryptData(e,p);return true}catch{return false}}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function genPassword(n=16){const c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*';let pw='';const a=crypto.getRandomValues(new Uint8Array(n*2));for(const b of a){if(pw.length>=n)break;if(b<c.length*Math.floor(256/c.length))pw+=c[b%c.length]}while(pw.length<n)pw+=c[Math.floor(Math.random()*c.length)];return pw}
async function copyText(t,btn,label='✓'){try{await navigator.clipboard.writeText(t)}catch{const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta)}if(!btn)return;const o=btn.textContent;btn.textContent=label;btn.classList.add('copied');setTimeout(()=>{btn.textContent=o;btn.classList.remove('copied')},2000)}

const CAT_COLORS={Gmail:{bg:'radial-gradient(ellipse at 40% 30%,#ff8f8f,#ff6b6b)',sh:'#cc4040',tx:'#fff'},GitHub:{bg:'radial-gradient(ellipse at 40% 30%,#ccc,#adb5bd)',sh:'#6c757d',tx:'#333'},Supabase:{bg:'radial-gradient(ellipse at 40% 30%,#6ee8b0,#3ecf8e)',sh:'#2a9e6a',tx:'#1a3a2a'},ドメイン:{bg:'radial-gradient(ellipse at 40% 30%,#a0d4ff,#74c0fc)',sh:'#3a8fd4',tx:'#1a2a3a'},サービス:{bg:'radial-gradient(ellipse at 40% 30%,#e088f8,#cc5de8)',sh:'#9b2eb0',tx:'#fff'},銀行:{bg:'radial-gradient(ellipse at 40% 30%,#ffe566,#ffd43b)',sh:'#c8a800',tx:'#3a2a00'},APIキー:{bg:'radial-gradient(ellipse at 40% 30%,#f9a8c8,#f783ac)',sh:'#c44f77',tx:'#fff'},シード:{bg:'radial-gradient(ellipse at 40% 30%,#90ee8a,#5ecf5a)',sh:'#3a9c37',tx:'#0d2a0d'},ライセンス:{bg:'radial-gradient(ellipse at 40% 30%,#d5d5d5,#adb5bd)',sh:'#6c757d',tx:'#333'},その他:{bg:'radial-gradient(ellipse at 40% 30%,#ffa85a,#ff922b)',sh:'#cc6600',tx:'#fff'}};
function catStyle(cat){const c=CAT_COLORS[cat]||CAT_COLORS['その他'];return`background:${c.bg};box-shadow:0 2px 0 ${c.sh},inset 0 1px 2px rgba(255,255,255,.2);color:${c.tx}`}
function catBorderColor(cat){const m={Gmail:'#ff6b6b',GitHub:'#adb5bd',Supabase:'#3ecf8e',ドメイン:'#74c0fc',サービス:'#cc5de8',銀行:'#ffd43b','APIキー':'#f783ac','シード':'#5ecf5a','ライセンス':'#adb5bd',その他:'#ff922b'};return m[cat]||'#555'}

function resetLockTimer(){clearTimeout(lockTimer);lockTimer=setTimeout(lockApp,LOCK_MINUTES*60*1000)}

function getFiltered(){const q=document.getElementById('search').value.toLowerCase();return vault.entries.filter(e=>{const ok=currentCat==='all'||e.category===currentCat;if(!ok)return false;if(!q)return true;return(e.service+e.login+e.url+e.notes).toLowerCase().includes(q)})}

function render(){
  const list=document.getElementById('entry-list'),entries=getFiltered();
  document.getElementById('entry-count').textContent=`${entries.length} 件`;
  if(!entries.length){list.innerHTML='<div class="empty-msg"><div class="empty-blobs"><div class="empty-blob" style="width:40px;height:32px;background:#5ecf5a;animation-delay:0s"></div><div class="empty-blob" style="width:34px;height:28px;background:#ff6b6b;animation-delay:.4s"></div><div class="empty-blob" style="width:38px;height:30px;background:#74c0fc;animation-delay:.8s"></div><div class="empty-blob" style="width:36px;height:29px;background:#ffd43b;animation-delay:1.2s"></div></div>まだ何もない</div>';return}
  const catBg={Gmail:'rgba(255,107,107,.08)',GitHub:'rgba(173,181,189,.05)',Supabase:'rgba(62,207,142,.08)',ドメイン:'rgba(116,192,252,.08)',サービス:'rgba(204,93,232,.08)',銀行:'rgba(255,212,59,.08)',その他:'rgba(255,146,43,.08)'};
  const catGlow={Gmail:'rgba(255,107,107,.3)',GitHub:'rgba(173,181,189,.2)',Supabase:'rgba(62,207,142,.28)',ドメイン:'rgba(116,192,252,.28)',サービス:'rgba(204,93,232,.28)',銀行:'rgba(255,212,59,.28)',その他:'rgba(255,146,43,.28)'};
  const rots=['-.5deg','.4deg','-.3deg','.5deg','-.4deg','.3deg'];
  list.innerHTML=entries.map((e,i)=>{
    const ex=expandedId===e.id;
    const rot=ex?'0deg':rots[i%rots.length];
    const bg=catBg[e.category]||'transparent';
    const glow=catGlow[e.category]||'transparent';
    const shadow=ex
      ?`0 10px 0 #080808,0 14px 40px rgba(0,0,0,.6),0 6px 30px ${glow}`
      :`0 7px 0 #080808,0 9px 24px rgba(0,0,0,.5),0 4px 20px ${glow}`;
    return`<div class="entry-row${ex?' expanded':''}" style="border-left-color:${catBorderColor(e.category)};background:linear-gradient(135deg,${bg},#1a1a1a);box-shadow:${shadow};--card-rot:${rot};transform:rotate(${rot})">
      <div class="entry-header" onclick="toggleExpand('${e.id}')">
        <div class="entry-cat-badge" style="${catStyle(e.category)}">${esc(e.category)}</div>
        <div class="entry-info">
          <div class="entry-service">${esc(e.service)}</div>
          <div class="entry-login">${esc(e.login||'—')}</div>
        </div>
        <button class="entry-quick-copy" onclick="event.stopPropagation();quickCopyPw('${e.id}',this)">PW</button>
      </div>
      <div class="entry-detail${ex?' open':''}">
        <div class="detail-divider"></div>
        ${e.login?`<div class="detail-row"><div class="detail-label">ログイン</div><div class="detail-val"><div class="detail-text">${esc(e.login)}</div><div class="detail-actions"><button class="detail-btn" onclick="copyField('${e.id}','login',this)">コピー</button></div></div></div>`:''}
        ${e.password?`<div class="detail-row"><div class="detail-label">PW</div><div class="detail-val"><div class="detail-text detail-pw" id="pw-${e.id}">••••••••</div><div class="detail-actions"><button class="detail-btn" onclick="togglePwVisible('${e.id}',this)">表示</button><button class="detail-btn" onclick="copyField('${e.id}','password',this)">コピー</button></div></div></div>`:''}
        ${e.url?`<div class="detail-row"><div class="detail-label">URL</div><div class="detail-val"><a class="detail-link" href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.url)}</a></div></div>`:''}
        ${e.notes?`<div class="detail-row"><div class="detail-label">メモ</div><div class="detail-val"><div class="detail-notes">${esc(e.notes)}</div></div></div>`:''}
        ${e.products&&e.products.length?`<div class="detail-row"><div class="detail-label">使用先</div><div class="detail-val"><div class="detail-text">${e.products.map(esc).join(' · ')}</div></div></div>`:''}
        ${e.role?`<div class="detail-row"><div class="detail-label">役割</div><div class="detail-val"><div class="detail-text">${esc(e.role)}${e.criticality?` <span style="opacity:.55">(${esc(e.criticality)})</span>`:''}</div></div></div>`:''}
        ${e.renewal?`<div class="detail-row"><div class="detail-label">更新/失効</div><div class="detail-val"><div class="detail-text">${esc(e.renewal)}</div></div></div>`:''}
        <div class="detail-footer">
          <button class="del-btn" onclick="deleteEntry('${e.id}')">削除</button>
          <button class="edit-btn" onclick="openEdit('${e.id}')">編集</button>
        </div>
      </div>
    </div>`}).join('');
  updateRenewalAlert();
}

function updateRenewalAlert(){const el=document.getElementById('renewal-alert');if(!el)return;const now=new Date();const soon=vault.entries.filter(e=>{if(!e.renewal)return false;return Math.round((new Date(e.renewal)-now)/86400000)<=30});if(!soon.length){el.classList.add('hidden');return}el.classList.remove('hidden');const over=soon.filter(e=>new Date(e.renewal)<now).length;el.textContent='⚠ 更新期限が近い項目 '+soon.length+'件'+(over?'（うち'+over+'件 超過）':'')+' — タップで管制塔へ';}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function toggleExpand(id){expandedId=expandedId===id?null:id;render()}
async function quickCopyPw(id,btn){const e=vault.entries.find(x=>x.id===id);if(e&&e.password)await copyText(e.password,btn,'✓')}
async function copyField(id,field,btn){const e=vault.entries.find(x=>x.id===id);if(e)await copyText(e[field]||'',btn,'✓')}
function togglePwVisible(id,btn){const el=document.getElementById('pw-'+id),e=vault.entries.find(x=>x.id===id);if(!el||!e)return;if(el.textContent==='••••••••'){el.textContent=e.password;btn.textContent='隠す'}else{el.textContent='••••••••';btn.textContent='表示'}}
async function deleteEntry(id){if(!confirm('削除しますか？'))return;vault.entries=vault.entries.filter(e=>e.id!==id);if(expandedId===id)expandedId=null;await saveVault();render()}

function openAdd(){editingId=null;document.getElementById('modal-title').textContent='新規追加';document.getElementById('f-cat').value='Gmail';['f-service','f-login','f-pw','f-url','f-notes','f-products','f-renewal'].forEach(id=>document.getElementById(id).value='');document.getElementById('f-role').value='';document.getElementById('f-criticality').value='';document.getElementById('f-pw').type='password';document.getElementById('pw-toggle-modal').textContent='表示';document.getElementById('modal-err').textContent='';document.getElementById('modal-overlay').classList.remove('hidden');setTimeout(()=>document.getElementById('f-service').focus(),50)}
function openEdit(id){const e=vault.entries.find(x=>x.id===id);if(!e)return;editingId=id;document.getElementById('modal-title').textContent='編集';document.getElementById('f-cat').value=e.category||'その他';document.getElementById('f-service').value=e.service||'';document.getElementById('f-login').value=e.login||'';document.getElementById('f-pw').value=e.password||'';document.getElementById('f-url').value=e.url||'';document.getElementById('f-notes').value=e.notes||'';document.getElementById('f-products').value=(e.products||[]).join(', ');document.getElementById('f-role').value=e.role||'';document.getElementById('f-criticality').value=e.criticality||'';document.getElementById('f-renewal').value=e.renewal||'';document.getElementById('f-pw').type='password';document.getElementById('pw-toggle-modal').textContent='表示';document.getElementById('modal-err').textContent='';document.getElementById('modal-overlay').classList.remove('hidden')}
function closeModal(){document.getElementById('modal-overlay').classList.add('hidden')}
async function saveEntry(){const errEl=document.getElementById('modal-err');errEl.textContent='';const service=document.getElementById('f-service').value.trim();const login=document.getElementById('f-login').value.trim();const pw=document.getElementById('f-pw').value;if(!service){errEl.textContent='⚠ サービス名は必須です';document.getElementById('f-service').focus();return}if(!login&&!pw){errEl.textContent='⚠ ログインかパスワードのどちらかは入力してください';document.getElementById('f-login').focus();return}const entry={id:editingId||uid(),category:document.getElementById('f-cat').value,service,login:document.getElementById('f-login').value.trim(),password:document.getElementById('f-pw').value,url:document.getElementById('f-url').value.trim(),notes:document.getElementById('f-notes').value.trim(),products:document.getElementById('f-products').value.split(',').map(s=>s.trim()).filter(Boolean),role:document.getElementById('f-role').value,criticality:document.getElementById('f-criticality').value,renewal:document.getElementById('f-renewal').value,updatedAt:new Date().toISOString()};if(editingId){const i=vault.entries.findIndex(e=>e.id===editingId);if(i>=0)vault.entries[i]=entry}else vault.entries.unshift(entry);await saveVault();closeModal();render()}

function lockApp(){masterPassword=null;expandedId=null;try{sessionStorage.removeItem(SESSION_KEY)}catch(e){}if(towerMode){towerMode=false;document.getElementById('tower-view').classList.add('hidden');document.getElementById('entry-list').classList.remove('hidden');document.getElementById('cat-bar').style.display='';document.getElementById('search').style.visibility='';document.getElementById('tower-btn').classList.remove('active')}document.getElementById('app').classList.remove('visible');document.getElementById('lock-screen').classList.remove('hidden');document.getElementById('master-input').value='';document.getElementById('lock-err').textContent='';clearTimeout(lockTimer)}
async function unlock(){const pw=document.getElementById('master-input').value;if(!pw)return;const errEl=document.getElementById('lock-err'),btn=document.getElementById('unlock-btn');btn.textContent='...';btn.disabled=true;errEl.textContent='';if(!hasVault()){if(pw.length<6){errEl.textContent='6文字以上で設定してください';btn.textContent='Set';btn.disabled=false;return}masterPassword=pw;vault={version:1,entries:[]};await saveVault()}else{const ok=await loadVault(pw);if(!ok){errEl.textContent='パスワードが違います';btn.textContent='Unlock';btn.disabled=false;return}masterPassword=pw}try{sessionStorage.setItem(SESSION_KEY,masterPassword)}catch(e){}document.getElementById('lock-screen').classList.add('hidden');document.getElementById('app').classList.add('visible');btn.textContent=hasVault()?'Unlock':'Set';btn.disabled=false;resetLockTimer();render()}

function toggleTower(){towerMode=!towerMode;document.getElementById('tower-btn').classList.toggle('active',towerMode);document.getElementById('cat-bar').style.display=towerMode?'none':'';document.getElementById('search').style.visibility=towerMode?'hidden':'';document.getElementById('entry-list').classList.toggle('hidden',towerMode);document.getElementById('tower-view').classList.toggle('hidden',!towerMode);if(towerMode)renderTower()}
function renderTower(){
  const tv=document.getElementById('tower-view');const map={},noProd=[];
  vault.entries.forEach(e=>{if(e.products&&e.products.length)e.products.forEach(p=>{(map[p]=map[p]||[]).push(e)});else noProd.push(e)});
  const prods=Object.keys(map).sort((a,b)=>a.localeCompare(b,'ja'));
  if(!prods.length&&!noProd.length){tv.innerHTML='<div class="tower-empty">まだ管制塔データがありません。<br>エントリを編集して「使用先プロダクト」を入れると、<br>ここに依存マップが現れます。</div>';return}
  const cw={high:0,mid:1,low:2};const now=new Date();
  function depRow(e){let renew='';if(e.renewal){const d=new Date(e.renewal);const days=Math.round((d-now)/86400000);const soon=days<=60;renew=`<span class="tower-renew${soon?' soon':''}">${soon?'⚠ ':''}${esc(e.renewal)}</span>`}return`<div class="tower-dep"><div class="tower-dep-svc">${esc(e.service)}</div>${e.role?`<span class="tower-role">${esc(e.role)}</span>`:''}${e.criticality?`<span class="tower-crit ${esc(e.criticality)}">${esc(e.criticality)}</span>`:''}${renew}</div>`}
  let html=prods.map(p=>{const list=map[p].slice().sort((a,b)=>(cw[a.criticality]??3)-(cw[b.criticality]??3));return`<div class="tower-card"><div class="tower-prod">${esc(p)}<span class="tower-prod-count">${list.length} 依存</span></div>${list.map(depRow).join('')}</div>`}).join('');
  if(noProd.length){html+=`<div class="tower-card"><div class="tower-prod unsorted">未分類<span class="tower-prod-count">${noProd.length} 件</span></div>${noProd.map(depRow).join('')}</div>`}
  tv.innerHTML=html;
}
function exportVault(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(vault,null,2)],{type:'application/json'}));a.download=`gavin-pw-${new Date().toISOString().slice(0,10)}.json`;a.click()}
function importVault(file){const r=new FileReader();r.onload=async e=>{try{const d=JSON.parse(e.target.result);if(!d.entries)throw 0;if(!confirm(`${d.entries.length} 件をインポートします。よろしいですか？`))return;const ids=new Set(vault.entries.map(x=>x.id));d.entries.forEach(e=>{if(!ids.has(e.id))vault.entries.push(e)});await saveVault();render()}catch{alert('読み込めませんでした')}};r.readAsText(file)}

document.addEventListener('DOMContentLoaded',()=>{
  const hintEl=document.getElementById('lock-hint'),btnEl=document.getElementById('unlock-btn');
  if(!hasVault()){hintEl.textContent='初回: マスターパスワードを設定します';btnEl.textContent='Set'}
  document.getElementById('unlock-btn').addEventListener('click',unlock);
  document.getElementById('master-input').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
  document.getElementById('add-btn').addEventListener('click',openAdd);
  document.getElementById('lock-btn').addEventListener('click',lockApp);
  document.getElementById('search').addEventListener('input',render);
  document.getElementById('cat-bar').addEventListener('click',e=>{const c=e.target.closest('.cat-chip');if(!c)return;document.querySelectorAll('.cat-chip').forEach(x=>x.classList.remove('active'));c.classList.add('active');currentCat=c.dataset.cat;render()});
  document.getElementById('modal-close').addEventListener('click',closeModal);
  document.getElementById('modal-cancel').addEventListener('click',closeModal);
  document.getElementById('modal-save').addEventListener('click',saveEntry);
  document.getElementById('modal-overlay').addEventListener('click',e=>{if(e.target===document.getElementById('modal-overlay'))closeModal()});
  document.getElementById('pw-toggle-modal').addEventListener('click',()=>{const inp=document.getElementById('f-pw'),btn=document.getElementById('pw-toggle-modal');inp.type=inp.type==='password'?'text':'password';btn.textContent=inp.type==='password'?'表示':'隠す'});
  document.getElementById('gen-btn').addEventListener('click',()=>{document.getElementById('f-pw').value=genPassword();document.getElementById('f-pw').type='text';document.getElementById('pw-toggle-modal').textContent='隠す'});
  document.getElementById('gen-copy-btn').addEventListener('click',async()=>{const pw=genPassword();document.getElementById('f-pw').value=pw;document.getElementById('f-pw').type='text';document.getElementById('pw-toggle-modal').textContent='隠す';await copyText(pw,document.getElementById('gen-copy-btn'),'✓ コピー済み')});
  document.getElementById('tower-btn').addEventListener('click',toggleTower);
  document.getElementById('renewal-alert').addEventListener('click',()=>{if(!towerMode)toggleTower()});
  document.getElementById('export-btn').addEventListener('click',exportVault);
  document.getElementById('import-file').addEventListener('change',e=>{if(e.target.files[0]){importVault(e.target.files[0]);e.target.value=''}});
  ['click','keydown','mousemove'].forEach(ev=>document.addEventListener(ev,resetLockTimer,{passive:true}));
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.metaKey||e.ctrlKey)&&e.key==='n'){e.preventDefault();if(masterPassword)openAdd()}});
  // セッション中（タブを閉じるまで）はリロードしてもマスターPW再入力不要。手動/自動ロックでは破棄される
  try{const sp=sessionStorage.getItem(SESSION_KEY);if(sp&&hasVault()){loadVault(sp).then(ok=>{if(ok){masterPassword=sp;document.getElementById('lock-screen').classList.add('hidden');document.getElementById('app').classList.add('visible');resetLockTimer();render()}else{sessionStorage.removeItem(SESSION_KEY)}})}}catch(e){}
});
</script>
</body>
</html>
