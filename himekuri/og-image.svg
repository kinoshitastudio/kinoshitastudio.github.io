<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>日めくり献立 — 10クルー・16バッジで楽しく組む、ローカル完結型の献立アプリ</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFCF3"/>
      <stop offset="60%" stop-color="#FBEFC2"/>
      <stop offset="100%" stop-color="#FCE5D2"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#B5462A" opacity="0.10"/>
    </pattern>
    <pattern id="stripes" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect x="0" y="0" width="2" height="60" fill="#F0CB59" opacity="0.10"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#stripes)"/>

  <!-- カラフルなブロブ -->
  <circle cx="80"   cy="60"   r="120" fill="#F0A878" opacity="0.30"/>
  <circle cx="1140" cy="80"   r="100" fill="#F0CB59" opacity="0.40"/>
  <circle cx="60"   cy="600"  r="140" fill="#F5DBE5" opacity="0.50"/>
  <circle cx="1130" cy="580"  r="120" fill="#ECF1DF" opacity="0.55"/>

  <!-- 装飾の星 -->
  <g fill="#F0CB59" opacity="0.55">
    <path transform="translate(310 60) rotate(15) scale(1.3)" d="M 0 -16 L 4 -5 L 16 -5 L 6 3 L 9 15 L 0 8 L -9 15 L -6 3 L -16 -5 L -4 -5 Z"/>
    <path transform="translate(870 60) rotate(-20) scale(1.0)" d="M 0 -16 L 4 -5 L 16 -5 L 6 3 L 9 15 L 0 8 L -9 15 L -6 3 L -16 -5 L -4 -5 Z" fill="#B5462A"/>
    <path transform="translate(170 540) rotate(25) scale(0.9)" d="M 0 -16 L 4 -5 L 16 -5 L 6 3 L 9 15 L 0 8 L -9 15 L -6 3 L -16 -5 L -4 -5 Z" fill="#98B777"/>
  </g>

  <!-- スクラップ風 washi tape -->
  <rect x="48" y="90"  width="160" height="22" fill="#B5462A" opacity="0.85" transform="rotate(-12 48 90)"/>
  <rect x="48" y="92"  width="160" height="3"  fill="#fff" opacity="0.4" transform="rotate(-12 48 92)"/>
  <rect x="930" y="60" width="160" height="22" fill="#F0CB59" opacity="0.95" transform="rotate(8 930 60)"/>
  <rect x="930" y="62" width="160" height="3"  fill="#fff" opacity="0.4" transform="rotate(8 930 62)"/>

  <!-- ═══ タイトルブロック ═══ -->
  <g transform="translate(80 158)">
    <!-- eyebrow -->
    <rect x="0" y="0" width="220" height="34" rx="17" fill="#2C2A26" transform="rotate(-2 0 0)"/>
    <text x="110" y="22" font-family="Inter, 'Noto Sans JP', sans-serif" font-size="14" font-weight="800"
          letter-spacing="3" fill="#F0CB59" text-anchor="middle" transform="rotate(-2 110 22)">
      KINOSHITA STUDIO · 2026
    </text>

    <!-- メインタイトル -->
    <text x="0" y="120" font-family="'Noto Sans JP', 'Inter', sans-serif" font-size="100" font-weight="900"
          letter-spacing="-4" fill="#2C2A26">
      日めくり献立
    </text>

    <!-- サブタイトル：黄色アンダーライン + 黒テキスト -->
    <rect x="-8" y="170" width="540" height="22" fill="#F0CB59" opacity="0.7"/>
    <text x="0" y="190" font-family="'Noto Sans JP', sans-serif" font-size="32" font-weight="800"
          letter-spacing="-1" fill="#2C2A26">
      毎日のごはん、楽しくなる。
    </text>

    <!-- 説明文 -->
    <text x="0" y="240" font-family="'Noto Sans JP', sans-serif" font-size="20" font-weight="600"
          fill="#4A4944">
      お気に入りを中心に、一週間のリズムを作る。
    </text>
    <text x="0" y="266" font-family="'Noto Sans JP', sans-serif" font-size="20" font-weight="600"
          fill="#4A4944">
      アカウント不要・サーバーなし・100% ローカル保存。
    </text>

    <!-- ステータスピル -->
    <g font-family="Inter, 'Noto Sans JP', sans-serif" font-size="16" font-weight="800">
      <rect x="0"   y="300" width="120" height="36" rx="18" fill="#fff" stroke="#2C2A26" stroke-width="2"/>
      <text x="60"  y="324" text-anchor="middle" fill="#B5462A">
        <tspan font-size="20" font-weight="900">10</tspan> クルー
      </text>
      <rect x="130" y="300" width="120" height="36" rx="18" fill="#fff" stroke="#2C2A26" stroke-width="2"/>
      <text x="190" y="324" text-anchor="middle" fill="#B5462A">
        <tspan font-size="20" font-weight="900">16</tspan> バッジ
      </text>
      <rect x="260" y="300" width="160" height="36" rx="18" fill="#B5462A"/>
      <text x="340" y="324" text-anchor="middle" fill="#fff">100% ローカル保存</text>
    </g>
  </g>

  <!-- ═══ クルー集合（右側） ═══ -->
  <!-- 1. ごはんちゃん -->
  <g transform="translate(710 118)">
    <circle cx="50" cy="50" r="54" fill="#fff"/>
    <circle cx="50" cy="50" r="50" fill="#FAF6EE"/>
    <g transform="translate(2 2) scale(0.6)">
      <path d="M 22 108 Q 80 130 138 108 L 132 150 Q 132 162 80 162 Q 28 162 28 150 Z" fill="#9B6B47"/>
      <path d="M 28 108 Q 36 60 80 50 Q 124 60 132 108 Q 80 120 28 108 Z" fill="#FBFBFA"/>
      <circle cx="64" cy="92" r="3.6" fill="#2C2A26"/>
      <circle cx="96" cy="92" r="3.6" fill="#2C2A26"/>
      <ellipse cx="50" cy="100" rx="6" ry="3" fill="#F2B89A" opacity="0.7"/>
      <ellipse cx="110" cy="100" rx="6" ry="3" fill="#F2B89A" opacity="0.7"/>
      <path d="M 70 102 Q 80 108, 90 102" stroke="#2C2A26" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    </g>
  </g>
  <!-- 2. みそしるくん -->
  <g transform="translate(840 96)">
    <circle cx="55" cy="55" r="59" fill="#fff"/>
    <circle cx="55" cy="55" r="55" fill="#F4E5C8"/>
    <g transform="translate(7 7) scale(0.6)">
      <path d="M 50 50 Q 45 30 60 26 Q 66 36 70 28 Q 76 18 82 30 Q 90 22 95 36 Q 105 28 108 46 Q 113 60 100 64 L 60 64 Q 46 60 50 50 Z" fill="#F4EDD8"/>
      <path d="M 18 76 Q 80 100 142 76 L 134 145 Q 134 162 80 162 Q 26 162 26 145 Z" fill="#5C3D2A"/>
      <rect x="22" y="74" width="116" height="8" rx="3" fill="#3E2818"/>
      <ellipse cx="80" cy="84" rx="60" ry="10" fill="#A87C4A"/>
      <circle cx="65" cy="86" r="2.6" fill="#2C2A26"/>
      <circle cx="95" cy="86" r="2.6" fill="#2C2A26"/>
      <path d="M 73 92 Q 80 96, 87 92" stroke="#2C2A26" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
  </g>
  <!-- 3. うめぼし爺 -->
  <g transform="translate(990 130)">
    <circle cx="48" cy="48" r="52" fill="#fff"/>
    <circle cx="48" cy="48" r="48" fill="#F8D8D0"/>
    <g transform="translate(0 0) scale(0.6)">
      <circle cx="80" cy="100" r="58" fill="#B33838"/>
      <path d="M 76 42 Q 80 32 84 42" stroke="#5A8A5A" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 56 96 Q 62 100, 68 96" stroke="#2C2A26" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 92 96 Q 98 100, 104 96" stroke="#2C2A26" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="80" cy="116" rx="5" ry="3" fill="#5A1010"/>
      <ellipse cx="50" cy="110" rx="7" ry="4" fill="#7A1A1A" opacity="0.45"/>
      <ellipse cx="110" cy="110" rx="7" ry="4" fill="#7A1A1A" opacity="0.45"/>
    </g>
  </g>

  <!-- 下段 -->
  <!-- 4. たまごちゃん -->
  <g transform="translate(680 280)">
    <circle cx="55" cy="55" r="59" fill="#fff"/>
    <circle cx="55" cy="55" r="55" fill="#FFF7D0"/>
    <g transform="translate(7 7) scale(0.6)">
      <path d="M 80 30 C 50 30, 30 78, 30 116 C 30 148, 50 162, 80 162 C 110 162, 130 148, 130 116 C 130 78, 110 30, 80 30 Z" fill="#FFFAEC"/>
      <circle cx="50" cy="110" r="14" fill="#F5C842"/>
      <circle cx="110" cy="110" r="14" fill="#F5C842"/>
      <circle cx="65" cy="100" r="3.8" fill="#2C2A26"/>
      <circle cx="95" cy="100" r="3.8" fill="#2C2A26"/>
      <ellipse cx="80" cy="120" rx="6" ry="4" fill="#2C2A26"/>
    </g>
  </g>
  <!-- 5. だいこんマン -->
  <g transform="translate(820 270)">
    <circle cx="60" cy="60" r="64" fill="#fff"/>
    <circle cx="60" cy="60" r="60" fill="#F0EBDC"/>
    <g transform="translate(8 8) scale(0.65)">
      <path d="M 60 28 Q 50 12 65 12 Q 70 22 78 16 Q 80 6 86 16 Q 92 12 95 24 Q 105 16 102 32 Q 95 38 78 36 Q 65 38 60 28 Z" fill="#5A8A5A"/>
      <path d="M 56 46 Q 52 80 58 130 Q 60 158 80 160 Q 100 158 102 130 Q 108 80 104 46 Q 80 38 56 46 Z" fill="#F5F0E0"/>
      <rect x="50" y="74" width="60" height="8" fill="#C03030"/>
      <text x="80" y="81" font-size="6" font-weight="900" text-anchor="middle" fill="#fff">必勝</text>
      <path d="M 64 96 L 72 96 M 70 94 L 70 98" stroke="#2C2A26" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M 88 96 L 96 96 M 90 94 L 90 98" stroke="#2C2A26" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M 72 110 L 88 110" stroke="#2C2A26" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>
  </g>
  <!-- 6. にんじんさん -->
  <g transform="translate(970 290)">
    <circle cx="48" cy="48" r="52" fill="#fff"/>
    <circle cx="48" cy="48" r="48" fill="#FFD8B0"/>
    <g transform="translate(-2 -2) scale(0.6)">
      <path d="M 55 32 Q 45 12 60 16 Q 65 26 72 22 Q 78 6 85 22 Q 92 12 96 30 Q 110 22 105 40 L 50 40 Q 48 38 55 32 Z" fill="#7A9B7E"/>
      <path d="M 50 40 L 110 40 Q 108 80 95 130 Q 88 158 80 160 Q 72 158 65 130 Q 52 80 50 40 Z" fill="#E08838"/>
      <circle cx="68" cy="65" r="3" fill="#2C2A26"/>
      <circle cx="92" cy="65" r="3" fill="#2C2A26"/>
      <ellipse cx="60" cy="74" rx="5" ry="2.5" fill="#FFB888" opacity="0.7"/>
      <ellipse cx="100" cy="74" rx="5" ry="2.5" fill="#FFB888" opacity="0.7"/>
      <path d="M 73 78 Q 80 84, 87 78" stroke="#2C2A26" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 最下段 -->
  <!-- 7. おにぎり王子 -->
  <g transform="translate(750 430)">
    <circle cx="55" cy="55" r="59" fill="#fff"/>
    <circle cx="55" cy="55" r="55" fill="#F0E8D8"/>
    <g transform="translate(7 7) scale(0.6)">
      <path d="M 60 28 L 70 36 L 80 22 L 90 36 L 100 28 L 100 44 L 60 44 Z" fill="#F0CB59"/>
      <path d="M 80 50 L 124 140 Q 120 150 80 150 Q 40 150 36 140 Z" fill="#FBFBFA" stroke="#E0DCC8" stroke-width="2"/>
      <path d="M 56 130 L 104 130 L 108 145 Q 100 150 80 150 Q 60 150 52 145 Z" fill="#2C2A26"/>
      <circle cx="68" cy="105" r="3.6" fill="#2C2A26"/>
      <circle cx="92" cy="105" r="3.6" fill="#2C2A26"/>
      <ellipse cx="55" cy="113" rx="5" ry="3" fill="#F2B89A" opacity="0.7"/>
      <ellipse cx="105" cy="113" rx="5" ry="3" fill="#F2B89A" opacity="0.7"/>
      <path d="M 73 115 Q 80 121 87 115" stroke="#2C2A26" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    </g>
  </g>
  <!-- 8. メカブ姫 -->
  <g transform="translate(890 460)">
    <circle cx="50" cy="50" r="54" fill="#fff"/>
    <circle cx="50" cy="50" r="50" fill="#A6C5A6"/>
    <g transform="translate(2 2) scale(0.6)">
      <path d="M 30 80 Q 22 110 32 140 Q 26 152 40 156 Q 50 162 60 156 Q 70 162 80 156 Q 90 162 100 156 Q 110 162 120 156 Q 134 152 128 140 Q 138 110 130 80 Q 122 50 80 45 Q 38 50 30 80 Z" fill="#3A5C3A"/>
      <path d="M 65 42 L 70 32 L 75 42 L 80 28 L 85 42 L 90 32 L 95 42 Z" fill="#F4A898"/>
      <circle cx="66" cy="95" r="3.5" fill="#FBFBFA"/>
      <circle cx="94" cy="95" r="3.5" fill="#FBFBFA"/>
      <circle cx="66" cy="95" r="1.8" fill="#2C2A26"/>
      <circle cx="94" cy="95" r="1.8" fill="#2C2A26"/>
      <ellipse cx="80" cy="115" rx="4" ry="2.5" fill="#FBFBFA"/>
    </g>
  </g>
  <!-- 9. さばくん -->
  <g transform="translate(1040 440)">
    <circle cx="48" cy="48" r="52" fill="#fff"/>
    <circle cx="48" cy="48" r="48" fill="#C8D4DC"/>
    <g transform="translate(-2 -2) scale(0.6)">
      <path d="M 28 110 Q 40 70 80 65 Q 120 70 132 110 Q 120 150 80 152 Q 40 150 28 110 Z" fill="#5C7A8A"/>
      <path d="M 35 115 Q 80 130 125 115 Q 120 145 80 148 Q 40 145 35 115 Z" fill="#C8D4DC"/>
      <path d="M 132 110 L 152 88 L 148 110 L 152 132 Z" fill="#5C7A8A"/>
      <path d="M 60 60 L 70 50 L 75 60 Z" fill="#2E4A5C"/>
      <path d="M 85 60 L 95 50 L 100 60 Z" fill="#2E4A5C"/>
      <circle cx="68" cy="105" r="6" fill="#FFFFFF"/>
      <circle cx="68" cy="105" r="3.5" fill="#2C2A26"/>
    </g>
  </g>

  <!-- 吹き出し風コメント -->
  <g transform="translate(450 500) rotate(-3)">
    <rect x="-130" y="-22" width="260" height="44" rx="22" fill="#fff" stroke="#2C2A26" stroke-width="2.5"/>
    <text x="0" y="6" font-family="'Noto Sans JP', sans-serif" font-size="20" font-weight="800"
          fill="#2C2A26" text-anchor="middle">
      今日なに食べる？に、もう迷わない
    </text>
  </g>

  <!-- フッター -->
  <text x="80" y="600" font-family="Inter, 'Noto Sans JP', sans-serif" font-size="14" letter-spacing="3"
        fill="#6E6A62" font-weight="700">
    HIMEKURI · WEEKLY MENU · LOCAL-FIRST · OPEN-SOURCE-FRIENDLY
  </text>
</svg>
