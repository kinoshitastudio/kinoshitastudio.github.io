<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo / Movie | Kinoshita Studio</title>
  <meta name="description" content="木下貴博による写真・映像作品。風景・自然・フィルム・ポートフォリオ・街・スナップ。">
  <meta property="og:title" content="Photo / Movie | Kinoshita Studio">
  <meta property="og:image" content="https://kinoshitastudio.github.io/ogp-studio.png">
  <link rel="icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+JP:wght@200;300&family=Space+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #EBE8E2; --bg-mid: #e0ddd7; --ink: #1a1a18;
      --ink-light: #6b6760; --ink-faint: #b0ada8;
      --gold: #a89060; --line: rgba(26,26,24,0.1); --line-mid: rgba(26,26,24,0.18);
    }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--ink); font-family: 'Noto Serif JP', serif; font-weight: 200; overflow-x: hidden; }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 1000; opacity: 0.6;
    }

    /* NAV */
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 2.5rem; background: rgba(235,232,226,0.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
    .nav-logo { font-family: 'Space Mono', monospace; font-size: 0.7rem; letter-spacing: 0.12em; color: var(--ink); text-decoration: none; line-height: 1.4; }
    .nav-hamburger { background: none; border: none; cursor: crosshair; padding: 0; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; }
    .nav-hamburger:hover svg { opacity: 0.5; }
    .nav-menu { position: fixed; top: 0; right: 0; width: 280px; height: 100vh; background: #2a2a28; border-left: 1px solid rgba(235,232,226,0.1); z-index: 200; display: flex; flex-direction: column; justify-content: center; padding: 4rem 3rem; transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    .nav-menu.open { transform: translateX(0); }
    .nav-menu-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 199; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; }
    .nav-menu-overlay.open { opacity: 1; pointer-events: all; }
    .nav-menu-close { position: absolute; top: 2rem; right: 2rem; background: none; border: none; cursor: crosshair; font-family: 'Space Mono', monospace; font-size: 0.55rem; color: #6b6760; letter-spacing: 0.2em; text-transform: uppercase; transition: color 0.3s; }
    .nav-menu-close:hover { color: #EBE8E2; }
    .nav-menu-label { font-family: 'Space Mono', monospace; font-size: 0.48rem; color: #5a5652; letter-spacing: 0.3em; text-transform: uppercase; margin-bottom: 2.5rem; }
    .nav-menu a { font-family: 'Space Mono', monospace; font-size: 0.7rem; letter-spacing: 0.2em; color: #6b6760; text-decoration: none; text-transform: uppercase; transition: color 0.3s; padding: 0.8rem 0; border-bottom: 1px solid rgba(235,232,226,0.1); display: block; }
    .nav-menu a:first-of-type { border-top: 1px solid rgba(235,232,226,0.1); }
    .nav-menu a:hover { color: #EBE8E2; }

    /* HERO */
    .hero {
      padding: 140px 60px 60px;
      max-width: 1100px;
      margin: 0 auto;
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      align-items: end;
    }
    .hero-label { font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 0.3em; color: var(--gold); margin-bottom: 20px; }
    .hero-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(48px, 7vw, 80px); font-weight: 300; line-height: 1.0; }
    .hero-desc { font-size: 13px; line-height: 2.0; color: var(--ink-light); }

    /* TABS */
    .tab-bar {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 60px 0;
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tab-bar::-webkit-scrollbar { display: none; }
    .tab-btn {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-faint);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 12px 20px;
      cursor: crosshair;
      transition: color 0.3s, border-color 0.3s;
      white-space: nowrap;
      margin-bottom: -1px;
    }
    .tab-btn:hover { color: var(--ink-light); }
    .tab-btn.active { color: var(--ink); border-bottom-color: var(--ink); }

    /* GALLERY */
    .gallery-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 48px 60px 80px;
    }
    .gallery-count {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.2em;
      color: var(--ink-faint);
      margin-bottom: 32px;
    }
    .photo-grid {
      columns: 3;
      column-gap: 2px;
    }
    .photo-item {
      break-inside: avoid;
      margin-bottom: 2px;
      overflow: hidden;
      cursor: crosshair;
      position: relative;
    }
    .photo-item img {
      width: 100%;
      display: block;
      transition: transform 0.5s ease, filter 0.3s ease;
      filter: grayscale(0.05);
    }
    .photo-item:hover img { transform: scale(1.04); filter: grayscale(0); }
    .photo-item .photo-overlay {
      position: absolute;
      inset: 0;
      background: rgba(26,26,24,0);
      transition: background 0.3s;
      display: flex;
      align-items: flex-end;
      padding: 16px;
    }
    .photo-item:hover .photo-overlay { background: rgba(26,26,24,0.2); }
    .photo-caption {
      font-family: 'Space Mono', monospace;
      font-size: 8px;
      letter-spacing: 0.15em;
      color: #fff;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .photo-item:hover .photo-caption { opacity: 1; }

    /* PLACEHOLDER */
    .photo-placeholder {
      background: var(--bg-mid);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
    }
    .photo-placeholder span {
      font-family: 'Space Mono', monospace;
      font-size: 8px;
      letter-spacing: 0.15em;
      color: var(--ink-faint);
    }

    /* VIDEO GRID */
    .video-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px;
    }
    .video-item { position: relative; }
    .video-thumb {
      position: relative;
      aspect-ratio: 16/9;
      background: var(--bg-mid);
      overflow: hidden;
      cursor: crosshair;
    }
    .video-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.5s ease; }
    .video-thumb:hover img { transform: scale(1.04); }
    .play-btn {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(26,26,24,0.2);
      transition: background 0.3s;
    }
    .video-thumb:hover .play-btn { background: rgba(26,26,24,0.4); }
    .play-icon {
      width: 48px; height: 48px;
      border: 1px solid rgba(235,232,226,0.8);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .play-icon svg { margin-left: 3px; }
    .video-info { padding: 16px 0 24px; }
    .video-cat { font-family: 'Space Mono', monospace; font-size: 8px; letter-spacing: 0.2em; color: var(--gold); margin-bottom: 6px; }
    .video-title { font-family: 'Noto Serif JP', serif; font-weight: 200; font-size: 13px; color: var(--ink); margin-bottom: 4px; }
    .video-meta { font-family: 'Space Mono', monospace; font-size: 8px; letter-spacing: 0.12em; color: var(--ink-faint); }

    /* HIDDEN */
    .gallery-section { display: none; }
    .gallery-section.active { display: block; }

    /* LIGHTBOX */
    .lightbox {
      position: fixed; inset: 0; background: rgba(10,10,8,0.96);
      z-index: 500; display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .lightbox.open { opacity: 1; pointer-events: all; }
    .lightbox-img { max-width: 90vw; max-height: 88vh; object-fit: contain; display: block; }
    .lightbox-close {
      position: absolute; top: 2rem; right: 2rem;
      font-family: 'Space Mono', monospace; font-size: 0.55rem;
      color: #6b6760; letter-spacing: 0.2em; text-transform: uppercase;
      background: none; border: none; cursor: crosshair; transition: color 0.3s;
    }
    .lightbox-close:hover { color: #EBE8E2; }
    .lightbox-caption {
      position: absolute; bottom: 2rem; left: 50%; transform: translateX(-50%);
      font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 0.2em;
      color: #6b6760; white-space: nowrap;
    }
    .lightbox-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      font-family: 'Space Mono', monospace; font-size: 11px;
      color: #6b6760; background: none; border: none; cursor: crosshair;
      transition: color 0.3s; padding: 16px;
    }
    .lightbox-nav:hover { color: #EBE8E2; }
    .lightbox-prev { left: 1.5rem; }
    .lightbox-next { right: 1.5rem; }

    /* VIDEO MODAL */
    .video-modal {
      position: fixed; inset: 0; background: rgba(10,10,8,0.96);
      z-index: 500; display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .video-modal.open { opacity: 1; pointer-events: all; }
    .video-modal-inner { width: min(880px, 92vw); }
    .video-modal-inner iframe { width: 100%; aspect-ratio: 16/9; display: block; border: none; }
    .video-modal-close {
      position: absolute; top: 2rem; right: 2rem;
      font-family: 'Space Mono', monospace; font-size: 0.55rem;
      color: #6b6760; letter-spacing: 0.2em; text-transform: uppercase;
      background: none; border: none; cursor: crosshair; transition: color 0.3s;
    }
    .video-modal-close:hover { color: #EBE8E2; }

    /* FOOTER */
    .back-section { max-width: 1100px; margin: 0 auto; padding: 60px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
    .back-label { font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 0.3em; color: var(--ink-faint); }
    .back-link { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 300; color: var(--ink); text-decoration: none; transition: color 0.3s; }
    .back-link:hover { color: var(--gold); }
    footer { border-top: 1px solid var(--line); padding: 40px 60px; display: flex; justify-content: space-between; align-items: center; }
    footer span, footer a { font-family: 'Space Mono', monospace; font-size: 9px; color: var(--ink-faint); letter-spacing: 0.12em; text-decoration: none; }
    footer a:hover { color: var(--ink); }

    @media (max-width: 768px) {
      nav { padding: 20px 24px; }
      .hero { grid-template-columns: 1fr; padding: 100px 24px 48px; gap: 24px; }
      .tab-bar { padding: 32px 24px 0; }
      .gallery-wrap { padding: 40px 24px 60px; }
      .photo-grid { columns: 2; }
      .video-grid { grid-template-columns: 1fr; }
      .back-section { flex-direction: column; gap: 24px; padding: 60px 24px; }
      footer { flex-direction: column; gap: 16px; padding: 40px 24px; }
    }
    @media (max-width: 480px) {
      .photo-grid { columns: 1; }
    }
  </style>
</head>

// youtubeId: YouTubeのURLの ?v=XXXXXXXX の部分

// 以下は変更不要

// プレースホルダーSVG生成
function placeholderSrc(aspect) {
  const h = aspect === 'tall' ? 480 : aspect === 'sq' ? 320 : 240;
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='320' height='${h}'><rect fill='%23d8d5cf' width='320' height='${h}'/><text fill='%23b0ada8' font-family='monospace' font-size='10' x='50%25' y='50%25' text-anchor='middle' dy='.3em'>photo</text></svg>`;
  return `data:image/svg+xml,${svg}`;
}

function isPlaceholder(src) { return src.startsWith('photo-placeholder'); }

// 写真カード生成
function makePhotoCard(photo, index, allPhotos) {
  const div = document.createElement('div');
  div.className = 'photo-item';
  const imgSrc = isPlaceholder(photo.src) ? placeholderSrc(photo.aspect) : photo.src;
  div.innerHTML = `
    <img src="${imgSrc}" alt="${photo.caption}" loading="lazy">
    <div class="photo-overlay">
      <span class="photo-caption">${photo.caption}</span>
    </div>`;
  div.addEventListener('click', () => openLightbox(allPhotos, index));
  return div;
}

// 動画カード生成（サムネイル取得）
function makeVideoCard(video) {
  const div = document.createElement('div');
  div.className = 'video-item';
  const thumbUrl = `https://img.youtube.com/vi/${video.youtubeId}/hqdefault.jpg`;
  div.innerHTML = `
    <div class="video-thumb" data-yt="${video.youtubeId}">
      <img src="${thumbUrl}" alt="${video.title}" loading="lazy">
      <div class="play-btn">
        <div class="play-icon">
          <svg width="14" height="16" viewBox="0 0 14 16" fill="none">
            <path d="M1 1L13 8L1 15V1Z" fill="#EBE8E2"/>
          </svg>
        </div>
      </div>
    </div>
    <div class="video-info">
      <p class="video-cat">${video.cat}</p>
      <p class="video-title">${video.title}</p>
      <p class="video-meta">${video.year}</p>
    </div>`;
  div.querySelector('.video-thumb').addEventListener('click', () => openVideoModal(video.youtubeId));
  return div;
}

// グリッド構築
function buildGrids() {
  const cats = ['film', 'portfolio'];

  // All グリッド
  const allGrid = document.getElementById('all-grid');
  PHOTOS.forEach((p, i) => allGrid.appendChild(makePhotoCard(p, i, PHOTOS)));

  // カテゴリ別グリッド
  cats.forEach(cat => {
    const filtered = PHOTOS.filter(p => p.cat === cat);
    const grid = document.getElementById(`${cat}-grid`);
    filtered.forEach((p, i) => grid.appendChild(makePhotoCard(p, i, filtered)));
  });

  // Video グリッド
  const videoGrid = document.getElementById('video-grid');
  VIDEOS.forEach(v => videoGrid.appendChild(makeVideoCard(v)));
}

// カウント更新
function updateCount(tab) {
  const countEl = document.getElementById('gallery-count');
  if (tab === 'video') {
    countEl.textContent = `— ${String(VIDEOS.length).padStart(2,'0')} videos`;
  } else if (tab === 'all') {
    countEl.textContent = `— ${String(PHOTOS.length).padStart(2,'0')} photos`;
  } else {
    const n = PHOTOS.filter(p => p.cat === tab).length;
    countEl.textContent = `— ${String(n).padStart(2,'0')} photos`;
  }
}

// タブ切り替え
function initTabs() {
  const btns = document.querySelectorAll('.tab-btn');
  const sections = document.querySelectorAll('.gallery-section');
  btns.forEach(btn => {
    btn.addEventListener('click', () => {
      const tab = btn.dataset.tab;
      btns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      sections.forEach(s => {
        s.classList.toggle('active', s.dataset.section === tab);
      });
      updateCount(tab);
    });
  });
  updateCount('all');
}

// Lightbox
let lbPhotos = [], lbIndex = 0;
function openLightbox(photos, index) {
  lbPhotos = photos; lbIndex = index;
  showLbPhoto();
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function showLbPhoto() {
  const p = lbPhotos[lbIndex];
  const src = isPlaceholder(p.src) ? placeholderSrc(p.aspect) : p.src;
  document.getElementById('lb-img').src = src;
  document.getElementById('lb-caption').textContent = `${p.caption} — ${lbIndex + 1} / ${lbPhotos.length}`;
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}
function initLightbox() {
  document.getElementById('lb-close').addEventListener('click', closeLightbox);
  document.getElementById('lightbox').addEventListener('click', e => { if (e.target === e.currentTarget) closeLightbox(); });
  document.getElementById('lb-prev').addEventListener('click', () => { lbIndex = (lbIndex - 1 + lbPhotos.length) % lbPhotos.length; showLbPhoto(); });
  document.getElementById('lb-next').addEventListener('click', () => { lbIndex = (lbIndex + 1) % lbPhotos.length; showLbPhoto(); });
  document.addEventListener('keydown', e => {
    if (!document.getElementById('lightbox').classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') { lbIndex = (lbIndex - 1 + lbPhotos.length) % lbPhotos.length; showLbPhoto(); }
    if (e.key === 'ArrowRight') { lbIndex = (lbIndex + 1) % lbPhotos.length; showLbPhoto(); }
  });
}

// Video Modal
function openVideoModal(ytId) {
  document.getElementById('vm-iframe').src = `https://www.youtube.com/embed/${ytId}?autoplay=1`;
  document.getElementById('video-modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeVideoModal() {
  document.getElementById('vm-iframe').src = '';
  document.getElementById('video-modal').classList.remove('open');
  document.body.style.overflow = '';
}
function initVideoModal() {
  document.getElementById('vm-close').addEventListener('click', closeVideoModal);
  document.getElementById('video-modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeVideoModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeVideoModal(); });
}

// NAV
function initNav() {
  const btn = document.getElementById('nav-hamburger');
  const menu = document.getElementById('nav-menu');
  const overlay = document.getElementById('nav-overlay');
  const close = document.getElementById('nav-close');
  const links = document.querySelectorAll('.nav-menu a');
  function open() { menu.classList.add('open'); overlay.classList.add('open'); document.body.style.overflow = 'hidden'; }
  function closeNav() { menu.classList.remove('open'); overlay.classList.remove('open'); document.body.style.overflow = ''; }
  btn.addEventListener('click', open);
  close.addEventListener('click', closeNav);
  overlay.addEventListener('click', closeNav);
  links.forEach(a => a.addEventListener('click', closeNav));
}

// Init
buildGrids();
initTabs();
initLightbox();
initVideoModal();
initNav();
</script>
