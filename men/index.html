<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>面 MEN — 私を通して道具が出る</title>
<meta name="description" content="カメラに写った自分の顔と体を通して、これまで作ってきた道具の表現が出る。目には MASU の素材が乗り、口を開けると TSUBU の粒が周りを回る。木下スタジオ（木下貴博 / 滋賀・琵琶湖）制作。">
<style>
  /* ⭐ 木下スタジオの美学＝ミニマル・モノクローム。画面はカメラが主役、UI は最小 */
  :root{ --ink:#f4f4f2; --fg2:#8b8b88; --line:rgba(255,255,255,.14); --glass:rgba(18,18,20,.72) }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;color:var(--ink);
    font-family:"Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
    overflow:hidden;overscroll-behavior:none}
  #stage{position:fixed;inset:0}
  canvas#cv{width:100%;height:100%;display:block;touch-action:none}
  /* 起動の入口＝許可を押すまで何も始めない（カメラは黙って開かない） */
  #gate{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;background:#000;z-index:20;padding:24px;text-align:center}
  #gate h1{margin:0;font-size:15px;font-weight:400;letter-spacing:.22em}
  #gate p{margin:0;max-width:30em;font-size:12px;line-height:1.9;color:var(--fg2)}
  .btn{appearance:none;border:.5px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);
    border-radius:999px;padding:12px 22px;font-size:12.5px;letter-spacing:.06em;cursor:pointer;
    font-family:inherit;touch-action:manipulation}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.on{background:var(--ink);color:#000}
  #err{color:#ff6b6b;font-size:11.5px;min-height:1.2em}
  /* 下のバー＝触れるものだけを並べる。横に送れる（モバイルで詰まらない） */
  #bar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;gap:8px;align-items:center;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));overflow-x:auto;overscroll-behavior-x:contain;
    background:linear-gradient(to top,rgba(0,0,0,.75),transparent)}
  #bar::-webkit-scrollbar{height:0}
  #bar .btn{flex:0 0 auto;padding:9px 14px;font-size:11.5px}
  #hud{position:fixed;left:14px;top:12px;z-index:10;font-family:"Space Mono",ui-monospace,monospace;
    font-size:9px;letter-spacing:.16em;color:var(--fg2);line-height:1.8;pointer-events:none}
  #hud b{color:var(--ink);font-weight:400}
  a.home{position:fixed;left:14px;top:38px;z-index:10;font-family:"Space Mono",ui-monospace,monospace;
    font-size:8px;letter-spacing:.18em;color:#fff;opacity:.4;text-decoration:none}
</style>

<div id="stage"><canvas id="cv"></canvas></div>

<div id="hud">面 MEN / KINOSHITA STUDIO<br><span id="stat">—</span></div>
<a class="home" href="/interaction-design.html">← KINOSHITA STUDIO</a>

<div id="bar">
  <button class="btn" id="b_print">刷る</button>
  <button class="btn" id="b_form">粒：素材</button>
  <button class="btn" id="b_bg">地：なし</button>
  <button class="btn" id="b_masu">顔をマス目に</button>
  <button class="btn" id="b_edge">輪郭に流す</button>
  <button class="btn on" id="b_eye">目</button>
  <button class="btn on" id="b_grain">粒</button>
  <button class="btn" id="b_hold">粒をとめる</button>

  <button class="btn" id="b_shot">写真</button>
  <button class="btn" id="b_rec">動画</button>

<div id="gate">
  <h1>面　M E N</h1>
  <p><b>私を通して、作ってきた道具の表現が出る。</b><br>
    目には <b>枡 MASU</b> の素材が乗り、口を開けると <b>粒 TSUBU</b> の粒が周りを回る。<br>
    カメラの映像はこの端末から出ません（どこにも送りません）。</p>
  <button class="btn" id="start" disabled>読み込み中…</button>
  <div id="err"></div>
</div>

<script type="module">
/* ══════════════════════════════════════════════════════════════
   面 MEN（2026-08-19）
   木下＝「utsu のようになんらかのアクションを起こすとさまざまなことができる。
           たとえば Tsubu の粒グラデーションが私の周りをぐるぐると動いていたりと、
           私がこれまで作成してきたツールを私を通して表現できます」

   ⭐ 芯＝【身体が入口】。顔と体を読んで、道具の表現をその上に出す。
   ⭐ 素材は【作った道具から持ってくる】＝MASU に同梱されている素材をそのまま使う
      （新しく絵を作らない＝道具どうしが繋がる）。
   ⚠️ 認識は utsu と同じ MediaPipe。作法（起動の入口・鏡・軽さ）も utsu に合わせる。
   ══════════════════════════════════════════════════════════════ */
import { FaceLandmarker, FilesetResolver }
  from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.20/vision_bundle.mjs';

const el = id => document.getElementById(id);
const cv = el('cv'), g = cv.getContext('2d');
const stat = m => { el('stat').textContent = m; };

/* ── 触れるもの ── */
const P = { eye:1, grain:1, hold:0, mirror:1, print:0, form:0, bg:0, masu:0, edge:0 };
/* ⭐ 粒の形・地のかたち＝押すたびに送る（道具から持ってきた語彙をそのまま使う） */
const FORMS = ['素材','錐','玉'], BGS = ['なし','縞','点','ひび'];
const toggle = (id, key, label) => {
  const b = el(id);
  b.onclick = () => { P[key] = P[key] ? 0 : 1; b.classList.toggle('on', !!P[key]);
    if(label) b.textContent = label(P[key]); };
};
toggle('b_print','print'); toggle('b_eye','eye'); toggle('b_grain','grain');
const cycle = (id, key, list) => {
  const b = el(id), base = b.textContent.split('：')[0];
  const put = () => { b.textContent = base + '：' + list[P[key]]; b.classList.toggle('on', P[key] > 0); };
  b.onclick = () => { P[key] = (P[key] + 1) % list.length; put(); };
  put();
};
cycle('b_form','form',FORMS); cycle('b_bg','bg',BGS);
toggle('b_masu','masu'); toggle('b_edge','edge');
toggle('b_hold','hold', v => v ? '粒をうごかす' : '粒をとめる');
toggle('b_mirror','mirror');
el('b_mirror').classList.toggle('on', !!P.mirror);

/* ── 素材（作った道具から持ってきたもの） ── */
const IMG = {}, INNER = {};
function loadImg(name, src){
  return new Promise(res => { const i = new Image();
    i.onload = () => { IMG[name] = i; INNER[name] = innerRadius(i); res(i); };
    i.onerror = () => res(null); i.src = src; });
}
/* ⭐⭐ 素材の【輪の内側の半径】を測る（2026-08-19 木下「枠の中は黒く塗りつぶしてくれ」）
   ⚠️ 数字を決め打ちにしない＝素材を差し替えても自動で合う。
   ⭐ 中心から外へ走査して、最初に不透明になった所が内径。8方向の中央値を取る（欠けに強い）。 */
function innerRadius(img){
  const S = 128;
  const c = document.createElement('canvas'); c.width = c.height = S;
  const q = c.getContext('2d'); q.drawImage(img, 0, 0, S, S);
  const d = q.getImageData(0, 0, S, S).data;
  const R = S/2, hits = [];
  for(let k = 0; k < 8; k++){
    const a = k/8 * Math.PI*2, ca = Math.cos(a), sa = Math.sin(a);
    for(let r = 2; r < R; r++){
      const x = Math.round(R + ca*r), y = Math.round(R + sa*r);
      if(x < 0 || y < 0 || x >= S || y >= S) break;
      if(d[(y*S + x)*4 + 3] > 90){ hits.push(r/R); break; }
    }
  }
  if(!hits.length) return 0;
  hits.sort((a,b) => a-b);
  return hits[hits.length >> 1] * 0.96;      /* 中央値。線に少し食い込ませて隙間を作らない */
}

/* ⭐ 中を測れるようにする（回帰テストから読む。module はスコープが閉じているので窓を1つ開ける） */
window.MEN = { IMG, INNER, P };   /* REC はあとで足す（下で作るので） */

/* ── カメラ ── */
let video = null, started = false, faceMarker = null;
let LMK = null, faceOn = false, lastT = -1;

async function initModels(){
  const fs = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.20/wasm');
  faceMarker = await FaceLandmarker.createFromOptions(fs, {
    baseOptions:{ modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task', delegate:'GPU' },
    outputFaceBlendshapes:true, runningMode:'VIDEO', numFaces:1 });
  const b = el('start'); b.disabled = false; b.textContent = 'カメラを許可して始める';
}
Promise.all([ loadImg('eye','parts/eye.png'), loadImg('grain','parts/grain.png'), initModels() ])
  .catch(e => { el('err').textContent = String(e && e.message || e); });

el('start').onclick = async () => {
  let stream;
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ width:{ideal:1280}, height:{ideal:720}, frameRate:{ideal:30}, facingMode:'user' }, audio:false });
  }catch(e){
    el('err').textContent = { NotAllowedError:'カメラを断られました — 設定から許可してください',
      NotFoundError:'カメラが見つかりません', NotReadableError:'カメラが他のアプリで使われています',
      SecurityError:'HTTPS か localhost が要ります' }[e.name] || e.name || 'カメラが開けません';
    return;
  }
  video = document.createElement('video');
  video.srcObject = stream; video.muted = true; video.playsInline = true; video.autoplay = true;
  await video.play();
  el('gate').style.display = 'none';
  started = true;
  stat('顔を写してください');
};

/* ── 顔 ── */
/* ⚠️ 目の点は【端2つ】から中心・幅・傾きを出す（虹彩の点に頼らない＝端末差で消えることがある） */
const EYE = { R:[33,133], L:[362,263] };     /* 画面の左＝本人の右 */
const MOUTH = { up:13, dn:14, l:78, r:308 };
let jaw = 0, spin = 0, burst = 0;

function readFace(res){
  if(!res || !res.faceLandmarks || !res.faceLandmarks.length){ faceOn = false; LMK = null; return; }
  faceOn = true; LMK = res.faceLandmarks[0];
  /* 口の開き＝上下の唇の距離を顔の幅で割る（顔の遠近に影響されない） */
  const a = LMK[MOUTH.up], b = LMK[MOUTH.dn], l = LMK[MOUTH.l], r = LMK[MOUTH.r];
  const w = Math.hypot(r.x-l.x, r.y-l.y) || 1;
  const open = Math.max(0, Math.min(1, (Math.hypot(b.x-a.x, b.y-a.y) / w - 0.08) / 0.5));
  jaw += (open - jaw) * 0.35;
}

/* 画面の座標へ（カメラは「切り取って画面いっぱい」に敷く＝比が崩れない） */
let cover = { s:1, ox:0, oy:0 };
function toScreen(p){
  const x = P.mirror ? 1 - p.x : p.x;
  return { x: cover.ox + x * video.videoWidth * cover.s,
           y: cover.oy + p.y * video.videoHeight * cover.s };
}

function drawEye(pair){
  const a = toScreen(LMK[pair[0]]), b = toScreen(LMK[pair[1]]);
  const cx = (a.x+b.x)/2, cy = (a.y+b.y)/2;
  const w = Math.hypot(b.x-a.x, b.y-a.y);
  const th = Math.atan2(b.y-a.y, b.x-a.x);
  /* ⭐ 素材は目の幅の 2.2 倍＝瞼の外まで覆う（参考の見え方） */
  const s = w * 2.2;
  const im = IMG.eye; if(!im) return;
  g.save();
  g.translate(cx, cy); g.rotate(th);
  /* ⭐ 輪の内側を黒く塗ってから素材を乗せる＝目が隠れて【面になる】（木下の注文） */
  const ri = (INNER.eye || 0.38) * s/2;
  if(ri > 0){ g.fillStyle = '#000'; g.beginPath(); g.arc(0, 0, ri, 0, Math.PI*2); g.fill(); }
  g.imageSmoothingEnabled = false;              /* ⚠️ 素材はドット絵＝ぼかさない */
  g.drawImage(im, -s/2, -s/2, s, s);
  g.restore();
}

/* ⭐ 粒が周りを回る（木下＝「Tsubu の粒が私の周りをぐるぐる」）
   ⚠️ 口を開けると増えて速くなる＝【アクションが表現を起こす】この道具の芯 */
function drawGrain(){
  const im = IMG.grain; if(!im || !LMK) return;
  let minx=1,miny=1,maxx=0,maxy=0;
  for(const p of LMK){ if(p.x<minx)minx=p.x; if(p.x>maxx)maxx=p.x; if(p.y<miny)miny=p.y; if(p.y>maxy)maxy=p.y; }
  const c = toScreen({ x:(minx+maxx)/2, y:(miny+maxy)/2 });
  const fw = Math.abs(toScreen({x:maxx,y:0}).x - toScreen({x:minx,y:0}).x);
  const fh = (maxy-miny) * video.videoHeight * cover.s;
  const R0 = Math.max(fw, fh) * 0.85;
  const n = 18 + Math.round(jaw * 22);           /* 口を開けると粒が増える */
  const sz = Math.max(6, fw * (0.10 + jaw*0.06));
  g.save();
  g.imageSmoothingEnabled = false;
  for(let i = 0; i < n; i++){
    const t = i / n;
    /* 2つの輪＝内と外で速さを変える（同じ速さだと1枚の板に見える） */
    const ring = i % 2;
    const rad = R0 * (ring ? 1.24 : 1.0) + Math.sin(spin*1.7 + i)*fw*0.03;
    const a = t * Math.PI*2 + spin * (ring ? -0.6 : 1.0);
    const x = c.x + Math.cos(a)*rad, y = c.y + Math.sin(a)*rad*0.92;
    const s = sz * (0.7 + 0.5*Math.sin(spin*2 + i*1.3)) * (1 + burst*0.8);
    g.save(); g.translate(x, y); g.rotate(a + spin*0.5);
    g.globalAlpha = 0.55 + 0.45*Math.sin(spin*1.1 + i);
    g.drawImage(im, -s/2, -s/2, s, s);
    g.restore();
  }
  g.restore();
}

/* ══⭐⭐ 刷る（2026-08-19 木下「ここからもっと派手にできることはないか」）
   ⭐ 芯＝【カメラの映像を、木下の道具の目で刷り直す】。
      明るさを読んで、その濃さで素材の大きさを決める＝TSUBU / NURI と同じ規則。
      色は【場所で変わるグラデ】＝木下のスタイル（どこを見てもグラデがある）。
   ⚠️ 毎フレーム走るので、読むのは小さい写し（160px 幅）＝画素は少なく、格子は画面で数える。
   ⚠️ 顔の上だけ素材を大きくする＝顔が【作品の中心】になる。 */
const SMALL = document.createElement('canvas'), SG = SMALL.getContext('2d', { willReadFrequently:true });
let SDATA = null;
function readSmall(){
  const w = 160, h = Math.max(1, Math.round(w * video.videoHeight / video.videoWidth));
  if(SMALL.width !== w || SMALL.height !== h){ SMALL.width = w; SMALL.height = h; }
  SG.save();
  if(P.mirror){ SG.translate(w, 0); SG.scale(-1, 1); }
  SG.drawImage(video, 0, 0, w, h);
  SG.restore();
  SDATA = SG.getImageData(0, 0, w, h);
}
/* ══⭐⭐ 錐（NURI から持ってきた・2026-08-19）
   ⭐ 正方形を中心から4つの三角に割り、光の向きとの角度で面ごとに塗る。
      面の中も【中心が明るく外辺へ落ちる】グラデーション＝ぼやけた玉でなく硬い粒になる。
   ⚠️ 色ごとに焼いて使い回す（色は 32 段に丸める）＝毎粒 作り直さない。 */
const KADO = new Map();
function kadoSprite(col){
  const q = v => Math.round(v/32)*32;
  const key = q(col[0])+','+q(col[1])+','+q(col[2]);
  let c = KADO.get(key); if(c) return c;
  const S = 64, R = S/2, base = [q(col[0]), q(col[1]), q(col[2])];
  c = document.createElement('canvas'); c.width = c.height = S;
  const t = c.getContext('2d');
  const a = -0.78, lx = Math.cos(a), ly = Math.sin(a);   /* 光は左上から */
  const faces = [[0,-1],[1,0],[0,1],[-1,0]], pts = [[0,0],[S,0],[S,S],[0,S]];
  const mix = (c1, c2, k) => [0,1,2].map(i => Math.round(c1[i] + (c2[i]-c1[i])*k));
  for(let i = 0; i < 4; i++){
    const n2 = faces[i], k = 0.5 + 0.5*(n2[0]*lx + n2[1]*ly);
    const up = Math.max(0, k - 0.35) * 1.9;
    const cCol = base.map(v => Math.min(255, Math.round(v*(1 + up*1.7) + 255*up*0.45)));
    const dn = 0.45 * (1 - k*0.45);
    const eCol = base.map(v => Math.max(0, Math.round(v*(1 - dn))));
    const p1 = pts[i], p2 = pts[(i+1)%4];
    const gr = t.createLinearGradient(R, R, (p1[0]+p2[0])/2, (p1[1]+p2[1])/2);
    gr.addColorStop(0, `rgb(${cCol})`); gr.addColorStop(0.55, `rgb(${mix(cCol,eCol,0.45)})`);
    gr.addColorStop(1, `rgb(${eCol})`);
    t.beginPath(); t.moveTo(R,R); t.lineTo(p1[0],p1[1]); t.lineTo(p2[0],p2[1]); t.closePath();
    t.fillStyle = gr; t.fill();
  }
  if(KADO.size > 400) KADO.clear();
  KADO.set(key, c);
  return c;
}

/* ══⭐ 地のかたち（NURI から持ってきた）── 塗っていない所（暗い所）を埋める */
function drawBg(t){
  const w = cv.width, h = cv.height, kind = BGS[P.bg];
  if(kind === 'なし' || !SDATA) return;
  const d = SDATA.data, sw = SMALL.width, sh = SMALL.height;
  const gap = Math.max(6, cv.width/110);
  const dark = (x, y) => {                       /* その場所が暗い（＝地）か */
    const u = (x - cover.ox)/(video.videoWidth*cover.s), v = (y - cover.oy)/(video.videoHeight*cover.s);
    if(u < 0 || v < 0 || u >= 1 || v >= 1) return true;
    const i = ((Math.min(sh-1, v*sh|0))*sw + (Math.min(sw-1, u*sw|0)))*4;
    return (d[i]*0.3 + d[i+1]*0.59 + d[i+2]*0.11)/255 < 0.34;
  };
  g.save();
  const col = grad(0.5, 0.5, t*0.6);
  g.strokeStyle = g.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},.75)`;
  g.lineWidth = Math.max(0.6, gap*0.14);
  if(kind === '点'){
    for(let y = 0; y < h; y += gap) for(let x = 0; x < w; x += gap){
      if(!dark(x, y)) continue;
      g.beginPath(); g.arc(x, y, gap*0.16, 0, Math.PI*2); g.fill();
    }
  }else if(kind === '縞'){
    const th = 0.42 + Math.sin(t*0.2)*0.12, ca = Math.cos(th), sa = Math.sin(th);
    const R = Math.hypot(w,h)/2, cx = w/2, cy = h/2, st = Math.max(2, gap*0.5);
    for(let v = -R; v <= R; v += gap){
      let on = false; g.beginPath();
      for(let u = -R; u <= R; u += st){
        const x = cx + u*ca - v*sa, y = cy + u*sa + v*ca;
        const ok = x>=0 && y>=0 && x<=w && y<=h && dark(x, y);
        if(ok){ if(!on){ g.moveTo(x,y); on = true; } else g.lineTo(x,y); } else on = false;
      }
      g.stroke();
    }
  }else{   /* ひび＝格子をずらして割った線 */
    const n = Math.ceil(w/gap);
    for(let i = 0; i <= n; i++){
      const x = i*gap + Math.sin(i*1.7 + t*0.3)*gap*0.4;
      let on = false; g.beginPath();
      for(let y = 0; y < h; y += gap*0.6){
        const xx = x + Math.sin(y*0.01 + i)*gap*0.5;
        const ok = dark(xx, y);
        if(ok){ if(!on){ g.moveTo(xx,y); on = true; } else g.lineTo(xx,y); } else on = false;
      }
      g.stroke();
    }
  }
  g.restore();
}

/* 場所で色が変わる（2色の間を斜めに送る）＝地のグラデ */
function grad(u, v, t){
  const k = (u*0.7 + v*0.5 + t*0.06) % 1;
  const a = [58,60,232], b = [232,64,64], c = [244,244,242];
  const x = k < 0.5 ? k*2 : (k-0.5)*2;
  const p = k < 0.5 ? [a,b] : [b,c];
  return [0,1,2].map(i => Math.round(p[0][i] + (p[1][i]-p[0][i]) * x));
}
function drawPrint(t){
  if(!SDATA) return;
  const w = cv.width, h = cv.height;
  const d = SDATA.data, sw = SMALL.width, sh = SMALL.height;
  const step = Math.max(8, Math.round(w / 78));        /* 画面の幅を約78マスで刻む */
  const im = IMG.grain;
  /* 顔の場所（あれば）＝そこだけ大きく刷る */
  let fx = -1, fy = -1, fr = 0;
  if(faceOn && LMK){
    let minx=1,miny=1,maxx=0,maxy=0;
    for(const q of LMK){ if(q.x<minx)minx=q.x; if(q.x>maxx)maxx=q.x; if(q.y<miny)miny=q.y; if(q.y>maxy)maxy=q.y; }
    const c0 = toScreen({ x:(minx+maxx)/2, y:(miny+maxy)/2 });
    fx = c0.x; fy = c0.y;
    fr = Math.abs(toScreen({x:maxx,y:0}).x - toScreen({x:minx,y:0}).x) * 0.9;
  }
  g.save();
  g.fillStyle = '#000'; g.fillRect(0, 0, w, h);        /* 地は黒＝粒が浮く */
  g.imageSmoothingEnabled = false;
  for(let y = step/2; y < h; y += step){
    for(let x = step/2; x < w; x += step){
      /* 画面の点 → 小さい写しの点（カメラは切り取って敷いてある） */
      const u = (x - cover.ox) / (video.videoWidth * cover.s);
      const v = (y - cover.oy) / (video.videoHeight * cover.s);
      if(u < 0 || v < 0 || u >= 1 || v >= 1) continue;
      const si = ((Math.min(sh-1, v*sh|0)) * sw + (Math.min(sw-1, u*sw|0))) * 4;
      const lum = (d[si]*0.30 + d[si+1]*0.59 + d[si+2]*0.11) / 255;
      let sz = step * (0.25 + lum * 0.95);
      /* ⭐ 顔の上は大きく＝顔が作品の中心になる。口を開けるとさらに膨らむ */
      if(fr > 0){
        const nd = Math.hypot(x - fx, y - fy) / fr;
        if(nd < 1.25) sz *= 1 + (1.25 - nd) * (0.55 + jaw*0.9);
      }
      if(sz < 1.2) continue;
      const col = grad(u, v, t);
      const form = FORMS[P.form];
      g.save(); g.translate(x, y);
      g.rotate((u*2 + v*3 + t*0.4) % (Math.PI*2));
      if(form === '錐'){
        const sp = kadoSprite(col);
        g.drawImage(sp, -sz/2, -sz/2, sz, sz);
      }else if(form === '玉'){
        const gr = g.createRadialGradient(-sz*0.18, -sz*0.18, sz*0.05, 0, 0, sz*0.55);
        gr.addColorStop(0, '#fff');
        gr.addColorStop(0.45, `rgb(${col[0]},${col[1]},${col[2]})`);
        gr.addColorStop(1, `rgb(${(col[0]*0.35)|0},${(col[1]*0.35)|0},${(col[2]*0.35)|0})`);
        g.fillStyle = gr; g.beginPath(); g.arc(0, 0, sz/2, 0, Math.PI*2); g.fill();
      }else if(im){
        g.globalCompositeOperation = 'source-over';
        g.drawImage(im, -sz/2, -sz/2, sz, sz);
        /* ⭐ 素材は白黒＝上から色を乗せて【グラデを持たせる】（単色にしない） */
        g.globalCompositeOperation = 'source-atop';
        g.fillStyle = `rgb(${col[0]},${col[1]},${col[2]})`;
        g.fillRect(-sz/2, -sz/2, sz, sz);
      }else{
        g.fillStyle = `rgb(${col[0]},${col[1]},${col[2]})`;
        g.beginPath(); g.arc(0, 0, sz/2, 0, Math.PI*2); g.fill();
      }
      g.restore();
    }
  }
  g.restore();
  drawBg(t);                     /* ⭐ 地は粒の上から＝暗い所だけに乗る */
}

/* ══⭐⭐ 顔をマス目に（MASU から・2026-08-19）
   ⭐ MASU の芯＝【マス目が先。一マスずつ中身を選ぶ】。
      だから濃さで大きさを変えない＝マスいっぱいに敷き詰める。明るさは【どの素材か】に効かせる。
   ⚠️ 顔の中だけ＝顔が版面になる。 */
const FACE_OVAL = [10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,
                   148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];
function facePath(){
  const pts = FACE_OVAL.map(i => toScreen(LMK[i]));
  g.beginPath();
  pts.forEach((q, i) => i ? g.lineTo(q.x, q.y) : g.moveTo(q.x, q.y));
  g.closePath();
  return pts;
}
function drawMasu(t){
  if(!faceOn || !LMK || !SDATA) return;
  const d = SDATA.data, sw = SMALL.width, sh = SMALL.height;
  g.save();
  const pts = facePath(); g.clip();                 /* ⭐ 顔の形に切る＝顔が版面 */
  let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  for(const q of pts){ if(q.x<minx)minx=q.x; if(q.x>maxx)maxx=q.x; if(q.y<miny)miny=q.y; if(q.y>maxy)maxy=q.y; }
  const cell = Math.max(10, (maxx-minx)/11);        /* 顔の幅を11マスで割る */
  g.imageSmoothingEnabled = false;
  for(let y = miny; y < maxy; y += cell){
    for(let x = minx; x < maxx; x += cell){
      const u = (x + cell/2 - cover.ox)/(video.videoWidth*cover.s);
      const v = (y + cell/2 - cover.oy)/(video.videoHeight*cover.s);
      if(u < 0 || v < 0 || u >= 1 || v >= 1) continue;
      const si = ((Math.min(sh-1, v*sh|0))*sw + (Math.min(sw-1, u*sw|0)))*4;
      const lum = (d[si]*0.30 + d[si+1]*0.59 + d[si+2]*0.11)/255;
      const col = grad(u, v, t*0.5);
      /* ⭐ 明るさで【中身を選ぶ】＝暗いマスは空ける（MASU の消しゴム）、明るいほど素材が乗る */
      if(lum < 0.22) continue;
      g.save(); g.translate(x + cell/2, y + cell/2);
      g.rotate(Math.floor(lum*4) * Math.PI/2);      /* 明るさで向きが変わる＝並びが揺れる */
      if(IMG.grain){
        g.drawImage(IMG.grain, -cell/2, -cell/2, cell, cell);
        g.globalCompositeOperation = 'source-atop';
        g.fillStyle = `rgb(${col[0]},${col[1]},${col[2]})`;
        g.fillRect(-cell/2, -cell/2, cell, cell);
      }
      g.restore();
    }
  }
  g.restore();
}

/* ══⭐⭐ 輪郭に沿って流す（SUDARE / HIDA から・2026-08-19）
   ⭐ 輪郭の点列を一定の間隔で歩いて、そこへ素材を並べる。位相で流す＝簾が回る。
   ⚠️ 顔が動いても点列は毎フレーム取り直す＝輪郭に貼り付いたまま流れる。 */
function drawEdge(t){
  if(!faceOn || !LMK) return;
  const pts = FACE_OVAL.map(i => toScreen(LMK[i]));
  /* 周の長さを測って、等間隔に置く */
  const seg = [];
  let total = 0;
  for(let i = 0; i < pts.length; i++){
    const a = pts[i], b2 = pts[(i+1)%pts.length];
    const len = Math.hypot(b2.x-a.x, b2.y-a.y);
    seg.push({ a, b:b2, len }); total += len;
  }
  const fw = Math.max(...pts.map(q=>q.x)) - Math.min(...pts.map(q=>q.x));
  const sz = Math.max(8, fw*0.11);
  const n = Math.max(12, Math.round(total / (sz*0.72)));
  g.save();
  g.imageSmoothingEnabled = false;
  for(let k = 0; k < n; k++){
    let dist = ((k/n + spin*0.12) % 1) * total;     /* ⭐ 位相で流す */
    let i = 0;
    while(i < seg.length && dist > seg[i].len){ dist -= seg[i].len; i++; }
    if(i >= seg.length) i = seg.length-1;
    const sgm = seg[i], f = sgm.len ? dist/sgm.len : 0;
    const x = sgm.a.x + (sgm.b.x-sgm.a.x)*f, y = sgm.a.y + (sgm.b.y-sgm.a.y)*f;
    const ang = Math.atan2(sgm.b.y-sgm.a.y, sgm.b.x-sgm.a.x);
    const col = grad(k/n, 0.5, t*0.8);
    const s2 = sz * (0.75 + 0.45*Math.sin(spin*2 + k*0.7) + jaw*0.5);
    g.save(); g.translate(x, y); g.rotate(ang);
    if(IMG.eye){
      g.drawImage(IMG.eye, -s2/2, -s2/2, s2, s2);
      g.globalCompositeOperation = 'source-atop';
      g.fillStyle = `rgb(${col[0]},${col[1]},${col[2]})`;
      g.fillRect(-s2/2, -s2/2, s2, s2);
    }
    g.restore();
  }
  g.restore();
}

/* ── まわす ── */
let last = 0;
function frame(t){
  requestAnimationFrame(frame);
  if(!started || !video) return;
  const dt = Math.min(0.05, (t - last)/1000 || 0); last = t;

  const dpr = Math.min(2, devicePixelRatio || 1);
  const w = Math.round(innerWidth*dpr), h = Math.round(innerHeight*dpr);
  if(cv.width !== w || cv.height !== h){ cv.width = w; cv.height = h; }

  if(video.readyState >= 2 && video.currentTime !== lastT){
    lastT = video.currentTime;
    if(faceMarker){ try{ readFace(faceMarker.detectForVideo(video, performance.now())); }catch(_){} }
  }
  if(!faceOn) jaw += (0 - jaw) * 0.15;

  /* カメラを画面いっぱいに敷く（切り取る＝比は崩さない） */
  const vw = video.videoWidth || 16, vh = video.videoHeight || 9;
  const s = Math.max(w/vw, h/vh);
  cover = { s, ox:(w - vw*s)/2, oy:(h - vh*s)/2 };

  g.setTransform(1,0,0,1,0,0);
  g.fillStyle = '#000'; g.fillRect(0,0,w,h);
  if(P.print){
    readSmall();
    drawPrint(t/1000);
  }else{
    g.save();
    if(P.mirror){ g.translate(w,0); g.scale(-1,1); }
    g.drawImage(video, P.mirror ? (w - vw*s - cover.ox) : cover.ox, cover.oy, vw*s, vh*s);
    g.restore();
  }

  if(faceOn && LMK){
    if(!P.hold) spin += dt * (0.5 + jaw*2.2);
    burst += ((jaw > 0.5 ? 1 : 0) - burst) * 0.12;
    if(P.masu) drawMasu(t/1000);
    if(P.grain) drawGrain();
    if(P.edge) drawEdge(t/1000);
    if(P.eye){ drawEye(EYE.R); drawEye(EYE.L); }
    stat(`顔 <b>あり</b>　口 ${(jaw*100)|0}`.replace(/<[^>]+>/g,''));
  }else{
    stat(REC.on ? el('stat').textContent : '顔を写してください');
  }
  if(REC.on) recFrame();          /* ⭐ 画面が出来上がってから1コマ撮る */
}
requestAnimationFrame(frame);

/* ══⭐⭐ 動画で出す（2026-08-19）
   ⚠️ MediaRecorder は使わない（コマ落ち・webm固定・大きさが選べない）。
   ⭐ 画面をそのまま【1コマずつ VideoEncoder へ渡して mp4 に焼く】。
      ＝カメラの実時間を撮るので、TSUBU / NURI の「位相をコマ番号で刻む」とは別の道。
   ⚠️ 器を取りに行けない環境では、理由を言って PNG連番（zip）へ回す。 */
const REC = { on:false, enc:null, muxer:null, target:null, n:0, t0:0, shots:[], fmt:'mp4', err:null };
async function loadMuxer(){
  if(window.Mp4Muxer) return true;
  try{ await new Promise((res, rej) => { const sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.1/build/mp4-muxer.min.js';
    sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); });
    return !!window.Mp4Muxer; }catch(_){ return false; }
}
async function recStart(){
  const W = cv.width - (cv.width % 2), H = cv.height - (cv.height % 2);
  REC.fmt = 'mp4'; REC.err = null; REC.shots = []; REC.n = 0; REC.W = W; REC.H = H;
  let cfg = null;
  const have = (typeof VideoEncoder !== 'undefined') ? await loadMuxer() : false;
  if(have){
    const bitrate = Math.min(60e6, Math.round(W*H*30*0.16));
    for(const codec of ['avc1.640034','avc1.4d0034','avc1.42003e']){
      try{ const sup = await VideoEncoder.isConfigSupported({ codec, width:W, height:H, bitrate, framerate:30 });
        if(sup && sup.supported){ cfg = { codec, width:W, height:H, bitrate, framerate:30 }; break; } }catch(_){}
    }
  }
  if(cfg){
    REC.target = new Mp4Muxer.ArrayBufferTarget();
    REC.muxer = new Mp4Muxer.Muxer({ target:REC.target,
      video:{ codec:'avc', width:W, height:H, frameRate:30 }, fastStart:'in-memory' });
    REC.enc = new VideoEncoder({ output:(c,m) => { try{ REC.muxer.addVideoChunk(c,m); }catch(e){ REC.err = e; } },
                                 error:e => { REC.err = e; } });
    REC.enc.configure(cfg);
  }else{
    REC.fmt = 'png';
    stat((typeof VideoEncoder === 'undefined') ? 'このブラウザは mp4 を作れない → PNG連番で撮ります'
                                              : 'mp4 の器を用意できない → PNG連番で撮ります');
  }
  REC.on = true; REC.t0 = performance.now();
  el('b_rec').textContent = '止める'; el('b_rec').classList.add('on');
}
async function recFrame(){
  if(!REC.on) return;
  if(REC.err){ await recStop(); return; }
  const ts = Math.round((performance.now() - REC.t0) * 1000);
  if(REC.fmt === 'mp4'){
    try{
      const vf = new VideoFrame(cv, { timestamp:ts, duration:33333 });
      REC.enc.encode(vf, { keyFrame:(REC.n % 60) === 0 });
      vf.close();
    }catch(e){ REC.err = e; }
  }else if((REC.n % 2) === 0 && REC.shots.length < 300){
    const b = await new Promise(r => cv.toBlob(r, 'image/png'));
    if(b) REC.shots.push({ name:'men_'+String(REC.shots.length).padStart(4,'0')+'.png',
                           data:new Uint8Array(await b.arrayBuffer()) });
  }
  REC.n++;
  if((REC.n % 15) === 0) stat(`撮っています ${((performance.now()-REC.t0)/1000).toFixed(1)}秒　もう一度押すと止まる`);
}
async function recStop(){
  REC.on = false;
  el('b_rec').textContent = '動画'; el('b_rec').classList.remove('on');
  try{
    if(REC.fmt === 'mp4' && REC.enc){
      await REC.enc.flush(); REC.muxer.finalize(); REC.enc.close();
      const blob = new Blob([REC.target.buffer], { type:'video/mp4' });
      dl(blob, 'men_' + Date.now() + '.mp4');
      stat(`mp4 を出した — ${REC.W} × ${REC.H}・${REC.n}コマ`);
    }else if(REC.shots.length){
      dl(zip(REC.shots), 'men_seq_' + Date.now() + '.zip');
      stat(`PNG連番を出した — ${REC.shots.length}枚（15fps で束ねてください）`);
    }else{
      stat('1コマも撮れていません');
    }
  }catch(e){ stat('🔴 ' + (e && e.message || e)); }
  REC.enc = null; REC.muxer = null; REC.shots = [];
}
el('b_rec').onclick = () => { REC.on ? recStop() : recStart(); };
window.MEN.REC = REC;   /* ⭐ 回帰テストから撮れているか読む */

function dl(b, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 8000);
}
/* ZIP（圧縮なし＝store）。PNG はもう圧縮済みなので縮まない */
let CRCT = null;
function crc32(u8){
  if(!CRCT){ CRCT = new Uint32Array(256);
    for(let n = 0; n < 256; n++){ let c = n;
      for(let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); CRCT[n] = c >>> 0; } }
  let c = 0xFFFFFFFF;
  for(let i = 0; i < u8.length; i++) c = CRCT[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zip(files){
  const enc = new TextEncoder(), parts = [], dirs = []; let off = 0;
  for(const f of files){
    const name = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length;
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true);
    h.setUint32(14,crc,true); h.setUint32(18,sz,true); h.setUint32(22,sz,true);
    h.setUint16(26,name.length,true);
    parts.push(new Uint8Array(h.buffer), name, f.data);
    const d = new DataView(new ArrayBuffer(46));
    d.setUint32(0,0x02014b50,true); d.setUint16(4,20,true); d.setUint16(6,20,true);
    d.setUint32(16,crc,true); d.setUint32(20,sz,true); d.setUint32(24,sz,true);
    d.setUint16(28,name.length,true); d.setUint32(42,off,true);
    dirs.push(new Uint8Array(d.buffer), name);
    off += 30 + name.length + sz;
  }
  let dsz = 0; for(const d of dirs) dsz += d.length;
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true);
  e.setUint32(12,dsz,true); e.setUint32(16,off,true);
  return new Blob([...parts, ...dirs, new Uint8Array(e.buffer)], { type:'application/zip' });
}

/* ── 写真 ── */
el('b_shot').onclick = () => {
  cv.toBlob(b => { if(!b) return; dl(b, 'men_' + Date.now() + '.png'); stat('写真を出した'); }, 'image/png');
};
</script>
