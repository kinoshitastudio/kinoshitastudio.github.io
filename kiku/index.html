<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>聴 KIKU — 1曲で1枚 / 木下スタジオ</title>
<meta name="description" content="1曲かけて、字を置き、切って、白で消す。13cm角の枠の中で、切り貼りと修正液とテープの手の工程をそのまま画面で。PNG（物の質感／雑誌向けに明るく）・JSON で出せる。木下スタジオ（木下貴博 / 滋賀・琵琶湖）制作。">
<link rel="canonical" href="https://kinoshita.studio/kiku/">
<meta property="og:type" content="website">
<meta property="og:title" content="聴 KIKU — 1曲で1枚 / 木下スタジオ">
<meta property="og:description" content="1曲かけて、字を置き、切って、白で消す。">
<meta property="og:url" content="https://kinoshita.studio/kiku/">
<meta property="og:image" content="https://kinoshita.studio/assets/img/img-ui-kiku.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;900&family=Zen+Old+Mincho:wght@900&family=Klee+One:wght@600&display=swap" rel="stylesheet">
<style>
  /* ⚠️ 外枠（並び方・見た目）は 捺 NATSU / 掃 SOU と同じ＝道具ごとに作りを変えない */
  :root{
    --bg:#e8e4dc; --paper:#f4f2ec; --line:rgba(28,28,30,.14);
    --fg:#1c1c1e; --fg2:rgba(28,28,30,.62); --fg3:rgba(28,28,30,.40);
    --fill:rgba(28,28,30,.10); --fill2:rgba(28,28,30,.07);
    --capsule:#fffdf8; --glass:rgba(246,244,238,.84); --r:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Zen Kaku Gothic New",sans-serif;
    font-weight:400;overflow:hidden;display:flex;align-items:stretch}
  button{touch-action:manipulation}
  #stage{flex:1;position:relative;min-width:0;overflow:hidden;touch-action:none}
  canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
  #tools{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:5;display:flex;gap:2px;
    background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
    border:.5px solid var(--line);border-radius:12px;padding:3px;box-shadow:0 4px 14px rgba(28,28,30,.10);max-width:calc(100% - 20px);overflow-x:auto}
  #tools button{border:none;background:none;border-radius:9px;color:var(--fg);cursor:pointer;font-family:inherit;
    font-size:12px;padding:8px 11px;opacity:.75;white-space:nowrap}
  #tools button.on{opacity:1;background:var(--capsule);font-weight:600;box-shadow:0 1px 3px rgba(28,28,30,.16)}
  #viewbtn{position:absolute;right:12px;bottom:40px;z-index:5;border:.5px solid var(--line);border-radius:11px;
    background:var(--glass);font:inherit;font-size:12px;padding:7px 12px;cursor:pointer;color:var(--fg)}
  #timer{position:absolute;left:12px;bottom:40px;z-index:5;font:11px ui-monospace,"SF Mono",Menlo,monospace;color:var(--fg2);
    background:var(--glass);border:.5px solid var(--line);border-radius:10px;padding:6px 9px}
  #stat{position:absolute;left:0;right:0;bottom:0;padding:8px 14px;font-size:11px;color:var(--fg3);
    font-family:ui-monospace,"SF Mono",Menlo,monospace;pointer-events:none;text-align:center;z-index:4}
  #drop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(244,242,236,.92);
    border:1px dashed rgba(28,28,30,.35);font-size:13px;color:var(--fg2);z-index:20;text-align:center;line-height:1.8}
  body.dragging #drop{display:flex}

  #panel{width:308px;flex:0 0 308px;height:100%;overflow-y:auto;
    background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
    border-left:.5px solid var(--line);padding:16px 16px 80px}
  #panel::-webkit-scrollbar{width:0}
  h1{font-size:12px;font-weight:590;letter-spacing:.12em;margin-bottom:2px}
  .sub{font-size:11.5px;color:var(--fg2);margin-bottom:16px;line-height:1.6}
  .grp{margin-bottom:20px}
  label.h{position:sticky;top:-16px;z-index:3;display:block;margin:0 -16px 8px;padding:7px 16px 6px;
    background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
    border-bottom:.5px solid var(--line);font-size:11px;font-weight:590;letter-spacing:.04em;color:var(--fg2)}
  .seg{display:flex;flex-wrap:wrap;background:var(--fill2);border-radius:9px;padding:2px;gap:2px;margin:6px 0 10px}
  .seg button{flex:1 1 auto;min-width:0;border:none;border-radius:7px;background:none;font-family:inherit;font-size:11.5px;
    color:var(--fg);opacity:.72;padding:6px 4px;cursor:pointer;white-space:nowrap}
  .seg button.on{opacity:1;background:var(--capsule);font-weight:590;box-shadow:0 1px 3px rgba(28,28,30,.14)}
  .btn{width:100%;background:var(--fill);border:none;border-radius:var(--r);color:var(--fg);font-family:inherit;font-size:12px;
    font-weight:500;padding:11px 0;margin-top:6px;cursor:pointer}
  .btn:hover{background:rgba(28,28,30,.16)}
  .btn.solid{background:var(--fg);color:var(--paper);font-weight:590}
  .btns2{display:flex;gap:6px}
  .row{display:flex;align-items:center;gap:10px;padding:2px 0;margin-bottom:2px}
  .row span.n{flex:0 0 70px;font-size:11.5px}
  .row output{font:11px ui-monospace,Menlo,monospace;color:var(--fg2);width:40px;flex:0 0 40px;text-align:right}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;min-width:0;background:none;height:26px;cursor:pointer;touch-action:pan-y}
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--fill)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;margin-top:-8px;border-radius:50%;background:var(--fg);border:none;box-shadow:0 1px 3px rgba(28,28,30,.30)}
  input[type=text],textarea{width:100%;font-family:inherit;font-size:13px;padding:9px 11px;border:.5px solid var(--line);
    border-radius:var(--r);background:var(--capsule);color:var(--fg)}
  textarea{resize:vertical;min-height:44px;line-height:1.5}
  .chk{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;margin:4px 0}
  .note{font-size:10.5px;line-height:1.65;color:var(--fg2);opacity:.8;margin-top:7px}
  #selbox{background:var(--capsule);border-radius:var(--r);padding:10px 11px;box-shadow:0 1px 3px rgba(28,28,30,.12)}
  .hide{display:none!important}
  @media (max-width:820px){
    body{flex-direction:column;overscroll-behavior:none}
    #stage{flex:0 0 58vh;flex-basis:58dvh}
    #panel{width:100%;flex:1 1 auto;height:auto;border-left:0;border-top:.5px solid var(--line);
      padding:16px 14px calc(80px + env(safe-area-inset-bottom));overscroll-behavior:contain}
    label.h{margin:0 -14px 8px;padding:7px 14px 6px}
    input[type=text],textarea{font-size:16px}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="tools">
    <button data-t="move" class="on">動かす</button><button data-t="cut">切る</button><button data-t="card">白を引く</button><button data-t="fluid">修正液</button><button data-t="tape">テープ</button>
  </div>
  <div id="timer">0:00</div>
  <button id="viewbtn">紙全体</button>
  <div id="stat"></div>
</div>
<div id="drop">曲（mp3・m4a・wav）・画像（粒の PNG など）・JSON を置く</div>

<div id="panel">
  <h1>聴 KIKU</h1>
  <p class="sub">1曲かけて、字を置き、切って、白で消す。13cm の枠の中で、手の工程をそのまま。</p>

  <div class="grp">
    <label class="h">字を置く</label>
    <textarea id="word" spellcheck="false">俺には関係ない</textarea>
    <div class="seg" id="size">
      <button data-v="60" class="on">特大60</button><button data-v="45">45</button><button data-v="35">中35</button><button data-v="27">大27</button><button data-v="14.4">小14</button>
    </div>
    <div class="seg" id="face">
      <button data-v="G" class="on">ゴシック</button><button data-v="M">明朝</button>
    </div>
    <div class="row"><span class="n">1行の字数</span><input type="range" id="perrow" min="1" max="8" value="2"><output></output></div>
    <button class="btn solid" id="bPlace">置く</button>
    <div class="btns2"><button class="btn" id="bImg">画像を置く</button><button class="btn" id="bGround">地に白を引く</button></div>
    <input type="file" id="imgfile" accept="image/*" class="hide">
    <p class="note">字は1字ずつ紙の欠片になる。「切る」で欠片の上を線でなぞると2つに割れる。画像（粒の PNG など）も同じように切れる。</p>
  </div>

  <div class="grp hide" id="selgrp">
    <label class="h">選んだ欠片</label>
    <div id="selbox">
      <div class="btns2"><button class="btn" id="bR90">90°回す</button><button class="btn" id="bFlip">鏡にする</button></div>
      <div class="btns2"><button class="btn" id="bRm">少し左へ</button><button class="btn" id="bRp">少し右へ</button></div>
      <div class="row"><span class="n">大きさ</span><input type="range" id="pscale" min="40" max="250" value="100"><output></output></div>
      <div class="btns2"><button class="btn" id="bFront">前へ</button><button class="btn" id="bBack">後ろへ</button><button class="btn" id="bDel">消す</button></div>
    </div>
  </div>

  <div class="grp">
    <label class="h">白・修正液・テープ</label>
    <div class="row"><span class="n">白の幅</span><input type="range" id="cw" min="6" max="70" value="30"><output></output></div>
    <div class="row"><span class="n">白の濃さ</span><input type="range" id="cop" min="20" max="100" value="75"><output></output></div>
    <div class="row"><span class="n">修正液</span><input type="range" id="fw" min="4" max="30" value="12"><output></output></div>
    <label class="chk">乾いてひびが入る<input type="checkbox" id="crack" checked></label>
    <label class="chk">下へ垂れる<input type="checkbox" id="drip" checked></label>
    <div class="seg" id="tapek"><button data-v="medical" class="on">医療用</button><button data-v="clear">透明</button><button data-v="mask">マスキング</button></div>
    <label class="chk">字が糊でよれる<input type="checkbox" id="wrinkle" checked></label>
    <div class="btns2"><button class="btn" id="bUndo">1回戻す</button><button class="btn" id="bRedo">やり直す</button></div>
  </div>

  <div class="grp">
    <label class="h">曲（かけながら作る）</label>
    <div class="btns2"><button class="btn" id="bSong">曲を選ぶ</button><button class="btn" id="bPlay">鳴らす</button></div>
    <input type="file" id="songfile" accept="audio/*" class="hide">
    <p class="note" id="songname">曲は無くてもいい。右下の時計は始めてからの時間（30分くらいで1枚）。</p>
  </div>

  <div class="grp">
    <label class="h">記録（右下）</label>
    <input type="text" id="title" placeholder="曲名・言葉（空なら書かない）">
    <input type="text" id="sign" value="Takahiro Kinoshita" style="margin-top:6px">
  </div>

  <div class="grp">
    <label class="h">保存・書き出し</label>
    <button class="btn" id="bPng">紙全体をPNG（物の質感）</button>
    <button class="btn" id="bMag">雑誌向け（明るく・コントラスト）</button>
    <button class="btn" id="bInsta">Instagram 4:5</button>
    <div class="btns2"><button class="btn" id="bSave">JSONで保存</button><button class="btn" id="bLoad">JSONを開く</button></div>
    <input type="file" id="jfile" accept=".json,application/json" class="hide">
    <button class="btn hide" id="bResume">前のつづきを開く</button>
    <button class="btn" id="bNew">新しい1枚</button>
  </div>
</div>

<script>
'use strict';
// ── 紙と枠（単位は mm）───────────────────
// ⭐ 11×17インチの紙に 13cm 角の枠。大半は余白
const SW = 279.4, SH = 431.8, F = 130, FX = (SW - F) / 2, FY = 105;
const $ = id => document.getElementById(id);
const cv = $('cv'), cx = cv.getContext('2d');
const FONT = { G: ['900', '"Zen Kaku Gothic New"'], M: ['900', '"Zen Old Mincho"'] };
const st = { tool: 'move', size: 60, face: 'G', tapek: 'medical', view: 'frame' };
let ops = [];            // 描く順＝作った順。piece（字・画像の欠片）／card（白）／fluid（修正液）／tape
let sel = -1, nextId = 1;
const imgs = new Map();  // src → Image
let undoS = [], redoS = [];
const t0 = Date.now();

function stat(m) { $('stat').textContent = m || ''; }
function hash(a, b, c) { let h = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul((c | 0) + 7, 2246822519); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function snap() { return JSON.stringify(ops); }
function push() { undoS.push(snap()); if (undoS.length > 60) undoS.shift(); redoS = []; autosave(); }

// ── 字の形を測る（字の形の中心を欠片の中心に）───────
const mc = document.createElement('canvas').getContext('2d');
const metr = new Map();
function metrics(ch, face) {
  const key = ch + face;
  if (metr.has(key)) return metr.get(key);
  mc.font = `${FONT[face][0]} 100px ${FONT[face][1]}`;
  const m = mc.measureText(ch);
  const L = m.actualBoundingBoxLeft, R = m.actualBoundingBoxRight, A = m.actualBoundingBoxAscent, D = m.actualBoundingBoxDescent;
  const r = { w: (L + R) / 100, h: (A + D) / 100, ox: -((R - L) / 2) / 100, oy: ((A - D) / 2) / 100 };
  metr.set(key, r); return r;
}
function glyphPoly(ch, face, size) {
  const m = metrics(ch, face), pad = 0.7;   // 字のきわで切る
  const hw = m.w * size / 2 + pad, hh = m.h * size / 2 + pad;
  return [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]];
}

// ── 欠片 ─────────────────────────────
function pieceTf(p) { return { c: Math.cos(p.rot * Math.PI / 180), s: Math.sin(p.rot * Math.PI / 180), k: p.sc || 1, f: p.flip ? -1 : 1 }; }
function toLocal(p, x, y) { const t = pieceTf(p), dx = x - p.x, dy = y - p.y; const u = (dx * t.c + dy * t.s) / t.k, v = (-dx * t.s + dy * t.c) / t.k; return [u * t.f, v]; }
function inPoly(poly, u, v) { let o = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const [xi, yi] = poly[i], [xj, yj] = poly[j]; if ((yi > v) !== (yj > v) && u < (xj - xi) * (v - yi) / (yj - yi) + xi) o = !o; } return o; }
function hitPiece(x, y) { for (let i = ops.length - 1; i >= 0; i--) { const o = ops[i]; if (o.t === 'piece') { const [u, v] = toLocal(o, x, y); if (inPoly(o.poly, u, v)) return i; } } return -1; }
// 線で多角形を2つに割る（半平面で切る）
function clipHalf(poly, a, b, side) {
  const out = [], n = poly.length, sd = p => ((b[0] - a[0]) * (p[1] - a[1]) - (b[1] - a[1]) * (p[0] - a[0])) * side;
  for (let i = 0; i < n; i++) {
    const P = poly[i], Q = poly[(i + 1) % n], dp = sd(P), dq = sd(Q);
    if (dp >= 0) out.push(P);
    if ((dp >= 0) !== (dq >= 0)) { const t = dp / (dp - dq); out.push([P[0] + (Q[0] - P[0]) * t, P[1] + (Q[1] - P[1]) * t]); }
  }
  return out;
}
function area(poly) { let s = 0; for (let i = 0; i < poly.length; i++) { const [a, b] = poly[i], [c, d] = poly[(i + 1) % poly.length]; s += a * d - b * c; } return Math.abs(s) / 2; }
function cutAt(a, b) {
  // 線が通る欠片を上から探して、1つだけ割る
  for (let i = ops.length - 1; i >= 0; i--) {
    const o = ops[i]; if (o.t !== 'piece') continue;
    const la = toLocal(o, a[0], a[1]), lb = toLocal(o, b[0], b[1]);
    const A = clipHalf(o.poly, la, lb, 1), B = clipHalf(o.poly, la, lb, -1);
    if (A.length < 3 || B.length < 3 || area(A) < 4 || area(B) < 4) continue;
    push();
    // 割れた2つを少し離す（切れ目が見える）
    const nx = -(lb[1] - la[1]), ny = lb[0] - la[0], nl = Math.hypot(nx, ny) || 1, t = pieceTf(o);
    const off = 0.8, ux = nx / nl * off * t.f, uy = ny / nl * off;
    const wx = (ux * t.c - uy * t.s) * t.k, wy = (ux * t.s + uy * t.c) * t.k;
    const p1 = { ...o, id: nextId++, poly: A, x: o.x + wx, y: o.y + wy };
    const p2 = { ...o, id: nextId++, poly: B, x: o.x - wx, y: o.y - wy };
    ops.splice(i, 1, p1, p2); sel = i + 1; showSel();
    stat('切った＝欠片が2つになった（動かして組み直せる）'); return true;
  }
  stat('線が欠片を横切っていない'); return false;
}

// ── 置く ─────────────────────────────
function placeWord() {
  const chars = [...$('word').value].filter(c => c.trim());
  if (!chars.length) return;
  push();
  const size = st.size, per = +$('perrow').value, pitch = size * 1.02;
  const already = ops.filter(o => o.t === 'piece').length;
  const x0 = FX + 8 + pitch / 2 + (already ? 10 : 0), y0 = FY + 8 + pitch / 2 + (already ? 10 : 0);
  chars.forEach((ch, i) => {
    const r = Math.floor(i / per), c = i % per, id = nextId++;
    ops.push({ t: 'piece', id, kind: 'ch', ch, face: st.face, size, x: x0 + c * pitch + (hash(id, 1, 2) - 0.5) * size * 0.06,
      y: y0 + r * pitch + (hash(id, 3, 4) - 0.5) * size * 0.06, rot: (hash(id, 5, 6) - 0.5) * 3, flip: false, sc: 1, poly: glyphPoly(ch, st.face, size) });
  });
  sel = ops.length - 1; showSel(); draw();
  stat(`${chars.length}字を置いた（${size}mm・${st.face === 'G' ? 'ゴシック' : '明朝'}）`);
}
function placeImage(src, w0, h0) {
  push();
  const id = nextId++, w = 60, h = w * h0 / w0;
  ops.push({ t: 'piece', id, kind: 'img', src, iw: w, ih: h, x: FX + F / 2, y: FY + F / 2, rot: 0, flip: false, sc: 1,
    poly: [[-w / 2, -h / 2], [w / 2, -h / 2], [w / 2, h / 2], [-w / 2, h / 2]] });
  sel = ops.length - 1; showSel(); draw(); stat('画像を置いた（切れる）');
}
function loadImg(src) { return new Promise(r => { if (imgs.has(src)) return r(imgs.get(src)); const im = new Image(); im.onload = () => { imgs.set(src, im); r(im); }; im.onerror = () => r(null); im.src = src; }); }

// ── 描く ─────────────────────────────
let paperPat = null, crackPath = null;
function paperPattern(g) {
  if (paperPat) return paperPat;
  const t = document.createElement('canvas'); t.width = t.height = 256; const p = t.getContext('2d'), im = p.createImageData(256, 256);
  for (let i = 0; i < 65536; i++) { const v = 128 + (hash(i, 7, 3) - 0.5) * 30; im.data[i * 4] = im.data[i * 4 + 1] = im.data[i * 4 + 2] = v; im.data[i * 4 + 3] = 22; }
  p.putImageData(im, 0, 0); return paperPat = g.createPattern(t, 'repeat');
}
// ひびの網（点を升目から少しずらし、隣とつなぐ・3割は途切れさせる）
function cracks() {
  if (crackPath) return crackPath;
  const P = new Path2D(), s = 4.2, nx = Math.ceil(SW / s) + 1, ny = Math.ceil(SH / s) + 1, pt = (i, j) => [i * s + (hash(i, j, 11) - 0.5) * s * 0.9, j * s + (hash(i, j, 13) - 0.5) * s * 0.9];
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const a = pt(i, j);
    if (hash(i, j, 17) > 0.3) { const b = pt(i + 1, j); P.moveTo(a[0], a[1]); P.lineTo(b[0], b[1]); }
    if (hash(i, j, 19) > 0.3) { const b = pt(i, j + 1); P.moveTo(a[0], a[1]); P.lineTo(b[0], b[1]); }
  }
  return crackPath = P;
}
function resample(pts, step) {
  if (pts.length < 2) return pts.slice();
  const out = [pts[0]]; let acc = 0;
  for (let i = 1; i < pts.length; i++) { const [x0, y0] = pts[i - 1], [x1, y1] = pts[i]; const d = Math.hypot(x1 - x0, y1 - y0); let t = step - acc;

$('bPng').onclick = () => { render(SC, SHEET).toBlob(b => download(b, `kiku_${safe()}_${stampName()}.png`)); stat(`紙全体を ${Math.round(SW * SC)}×${Math.round(SH * SC)} で書き出した`); };
$('bMag').onclick = () => { const w = F + 24, reg = { x: FX - 12, y: FY - 12, w, h: w }; render(20, reg, true).toBlob(b => download(b, `kiku_${safe()}_雑誌_${stampName()}.png`)); stat('雑誌向け（枠のまわりだけ・明るく）で書き出した'); };
$('bInsta').onclick = () => { const w = F * 1.7, h = w * 1.25, reg = { x: FX + F / 2 - w / 2, y: FY + F / 2 - h / 2 + 6, w, h }; render(1080 / w, reg).toBlob(b => download(b, `kiku_${safe()}_4x5_${stampName()}.png`)); stat('Instagram 4:5（1080×1350）で書き出した'); };
function snapshot() { return { tool: 'kiku', v: 2, ops, title: $('title').value, sign: $('sign').value }; }
async function restore(s) { if (!s || s.v !== 2) { stat('この JSON は前の版の聴（粒）のものです'); return; } ops = s.ops || []; $('title').value = s.title || ''; $('sign').value = s.sign || '';
  nextId = Math.max(1, ...ops.map(o => o.id || 0)) + 1; sel = -1; showSel(); await Promise.all(ops.filter(o => o.kind === 'img').map(o => loadImg(o.src))); undoS = []; redoS = []; draw(); }
$('bSave').onclick = () => { download(new Blob([JSON.stringify(snapshot())], { type: 'application/json' }), `kiku_${safe()}_${stampName()}.json`); stat('JSONで保存した'); };
$('bLoad').onclick = () => $('jfile').click();
$('jfile').onchange = e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { try { restore(JSON.parse(rd.result)).then(() => stat(`${f.name} を開いた`)); } catch (er) { stat('JSONが読めませんでした'); } }; rd.readAsText(f); e.target.value = ''; };
let tSave = 0;
function autosave() { clearTimeout(tSave); tSave = setTimeout(() => { try { localStorage.setItem('kiku2.current', JSON.stringify(snapshot())); } catch (e) {} }, 600); }
$('bResume').onclick = () => { try { restore(JSON.parse(localStorage.getItem('kiku2.current'))).then(() => { stat('前のつづきを開いた'); $('bResume').classList.add('hide'); }); } catch (e) {} };
$('bNew').onclick = () => { push(); ops = []; sel = -1; showSel(); draw(); stat('新しい1枚（「1回戻す」で戻せる）'); };

// ── つまみ ─────────────────────────────
function segOn(id, v) { [...$(id).children].forEach(b => b.classList.toggle('on', b.dataset.v === v)); }
function seg(id, fn) { $(id).onclick = e => { const b = e.target.closest('button'); if (!b) return; segOn(id, b.dataset.v); fn(b.dataset.v); }; }
seg('size', v => st.size = +v); seg('face', v => st.face = v); seg('tapek', v => st.tapek = v);
$('tools').onclick = e => { const b = e.target.closest('button'); if (!b) return; st.tool = b.dataset.t; [...$('tools').children].forEach(x => x.classList.toggle('on', x === b));
  stat({ move: '欠片を押して動かす', cut: '欠片の上を線でなぞると2つに割れる', card: '白をカードで引く（なぞった所に筋）', fluid: '修正液を流す（なぞった所が厚い白に）', tape: '線を引いた所にテープ' }[st.tool]); };
['cw', 'cop', 'fw', 'perrow'].forEach(k => { const show = () => $(k).nextElementSibling.textContent = $(k).value + (k === 'cop' ? '%' : k === 'perrow' ? '字' : 'mm'); show(); $(k).addEventListener('input', show); });
['wrinkle'].forEach(k => $(k).addEventListener('change', draw));
$('title').addEventListener('input', () => { draw(); autosave(); }); $('sign').addEventListener('input', () => { draw(); autosave(); });
$('bPlace').onclick = () => loadFonts().then(placeWord);
$('bImg').onclick = () => $('imgfile').click();
$('imgfile').onchange = e => { const f = e.target.files[0]; if (f) readImage(f); e.target.value = ''; };
function readImage(f) { const rd = new FileReader(); rd.onload = () => loadImg(rd.result).then(im => im && placeImage(rd.result, im.naturalWidth || 1, im.naturalHeight || 1)); rd.readAsDataURL(f); }
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  if ((e.metaKey || e.ctrlKey) && e.key === 'z') { e.preventDefault(); (e.shiftKey ? $('bRedo') : $('bUndo')).click(); }
  else if ((e.key === 'Delete' || e.key === 'Backspace') && sel >= 0) { e.preventDefault(); $('bDel').click(); }
  else if (e.key === 'r' && sel >= 0) $('bR90').click();
});
addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragging'); });
addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('dragging'); });
addEventListener('drop', e => { e.preventDefault(); document.body.classList.remove('dragging'); const f = e.dataTransfer.files[0]; if (!f) return;
  if (f.name.endsWith('.json')) { const rd = new FileReader(); rd.onload = () => restore(JSON.parse(rd.result)); rd.readAsText(f); }
  else if (f.type.startsWith('image/')) readImage(f);
  else if (f.type.startsWith('audio/')) { const dt = new DataTransfer(); dt.items.add(f); $('songfile').files = dt.files; $('songfile').onchange({ target: $('songfile') }); } });
function loadFonts() { return Promise.all(['900 100px "Zen Kaku Gothic New"', '900 100px "Zen Old Mincho"', '600 20px "Klee One"'].map(f => document.fonts.load(f, $('word').value + 'Takahiro Kinoshita').catch(() => {}))).then(() => metr.clear()); }

// ── 見本（#demo：俺には関係ない を置いて、切って、白と修正液とテープ）──
function demo() {
  $('word').value = '俺関係'; st.size = 60; placeWord(); ops.forEach(o => o.t === 'piece' && (o.x -= 2));
  // 並べ直し：俺 左上・関 左下・係 右下
  const P = ops.filter(o => o.t === 'piece'); P[0].x = FX + 36; P[0].y = FY + 40; P[1].x = FX + 38; P[1].y = FY + 96; P[2].x = FX + 96; P[2].y = FY + 96;
  cutAt([FX + 20, FY + 34], [FX + 60, FY + 50]); cutAt([FX + 70, FY + 120], [FX + 120, FY + 70]);
  ops.filter(o => o.t === 'piece').forEach((o, i) => { o.x += (hash(o.id, i, 1) - 0.5) * 3; o.rot += (hash(o.id, i, 2) - 0.5) * 3; });
  st.face = 'M'; st.size = 35; $('word').value = 'には'; placeWord(); let q = ops.filter(o => o.t === 'piece'); q[q.length - 2].x = FX + 88; q[q.length - 2].y = FY + 22; q[q.length - 1].x = FX + 104; q[q.length - 1].y = FY + 50;
  st.size = 14.4; st.face = 'G'; $('word').value = 'ない'; placeWord(); q = ops.filter(o => o.t === 'piece'); q[q.length - 2].x = FX + 118; q[q.length - 2].y = FY + 112; q[q.length - 1].x = FX + 118; q[q.length - 1].y = FY + 124;
  const card = (y, w, op, id) => ops.push({ t: 'card', id: nextId++, pts: Array.from({ length: 34 }, (_, i) => [FX - 4 + i * 4.2, y + Math.sin(i / 3 + id) * 1.2]), w, op });
  card(FY + 16, 26, 0.8, 1); card(FY + 62, 18, 0.55, 2);
  ops.push({ t: 'card', id: nextId++, pts: Array.from({ length: 30 }, (_, i) => [FX + 112 + Math.sin(i / 4) * 1.5, FY + 4 + i * 3]), w: 20, op: 0.7 });
  ops.push({ t: 'fluid', id: nextId++, pts: Array.from({ length: 18 }, (_, i) => [FX + 20 + i * 1.8, FY + 38 + Math.sin(i / 3) * 4]), w: 13, crack: true, drip: true });
  ops.push({ t: 'tape', id: nextId++, a: [FX + 70, FY + 130], b: [FX + 138, FY + 118], kind: 'medical' });
  $('title').value = ''; sel = -1; showSel(); draw();
}

// ── はじめ ─────────────────────────────
loadFonts().then(() => {
  fitView();
  try { const s = localStorage.getItem('kiku2.current'); if (s && JSON.parse(s).ops.length) $('bResume').classList.remove('hide'); } catch (e) {}
  if (location.hash.includes('demo')) demo();
  else stat('字を打って「置く」→ 動かす・切る → 白を引く・修正液・テープ');
});
</script>
