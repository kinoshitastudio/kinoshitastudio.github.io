<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>聴 KIKU — 1曲で1枚 / 木下スタジオ</title>
<meta name="description" content="曲を1曲かけて、鳴っている間だけ手で粒を置く道具。音の大きさが粒の細かさを、音の明るさがグラデを決め、曲が終わったら完成。13cm角の枠と鉛筆の記録を付けて PNG・JSON で出せる。木下スタジオ（木下貴博 / 滋賀・琵琶湖）制作。">
<link rel="canonical" href="https://kinoshita.studio/kiku/">
<meta property="og:type" content="website">
<meta property="og:title" content="聴 KIKU — 1曲で1枚 / 木下スタジオ">
<meta property="og:description" content="鳴っている間だけ、手で置ける。曲が終わったら完成。">
<meta property="og:url" content="https://kinoshita.studio/kiku/">
<meta property="og:image" content="https://kinoshita.studio/assets/img/img-ui-kiku.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;900&family=Zen+Old+Mincho:wght@900&family=Oswald:wght@600&family=DotGothic16&family=Klee+One:wght@600&display=swap" rel="stylesheet">
<style>
  /* ⚠️ 外枠（並び方・見た目）は 捺 NATSU / 掃 SOU と同じ＝道具ごとに作りを変えない */
  :root{
    --bg:#e8e4dc; --paper:#f4f2ec; --line:rgba(28,28,30,.14);
    --fg:#1c1c1e; --fg2:rgba(28,28,30,.62); --fg3:rgba(28,28,30,.40);
    --fill:rgba(28,28,30,.10); --fill2:rgba(28,28,30,.07);
    --capsule:#fffdf8; --glass:rgba(246,244,238,.84); --r:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Zen Kaku Gothic New",sans-serif;
    font-weight:400;overflow:hidden;display:flex;align-items:stretch}
  button{touch-action:manipulation}
  #stage{flex:1;position:relative;min-width:0;overflow:hidden;touch-action:none}
  canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
  #hud{position:absolute;left:12px;top:12px;z-index:5;display:flex;gap:6px;align-items:center;
    background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
    border:.5px solid var(--line);border-radius:11px;padding:6px 10px;font:11px ui-monospace,"SF Mono",Menlo,monospace;color:var(--fg2)}
  #hud b{color:var(--fg);font-weight:600}
  #lv{width:60px;height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
  #lv i{display:block;height:100%;width:0;background:var(--fg)}
  #viewbtn{position:absolute;right:12px;top:12px;z-index:5;border:.5px solid var(--line);border-radius:11px;
    background:var(--glass);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);font:inherit;font-size:12px;padding:7px 12px;cursor:pointer;color:var(--fg)}
  #stat{position:absolute;left:0;right:0;bottom:0;padding:8px 14px;font-size:11px;color:var(--fg3);
    font-family:ui-monospace,"SF Mono",Menlo,monospace;pointer-events:none;text-align:center;z-index:4}
  #drop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(244,242,236,.92);border:1px dashed rgba(28,28,30,.35);
    font-size:13px;letter-spacing:.08em;color:var(--fg2);z-index:20;text-align:center;line-height:1.8}
  body.dragging #drop{display:flex}

  #panel{width:308px;flex:0 0 308px;height:100%;overflow-y:auto;
    background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
    border-left:.5px solid var(--line);padding:16px 16px 80px}
  #panel::-webkit-scrollbar{width:0}
  h1{font-size:12px;font-weight:590;letter-spacing:.12em;margin-bottom:2px}
  .sub{font-size:11.5px;color:var(--fg2);margin-bottom:16px;line-height:1.6}
  .grp{margin-bottom:20px}
  label.h{position:sticky;top:-16px;z-index:3;display:block;margin:0 -16px 8px;padding:7px 16px 6px;
    background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
    border-bottom:.5px solid var(--line);font-size:11px;font-weight:590;letter-spacing:.04em;color:var(--fg2)}
  .seg{display:flex;flex-wrap:wrap;background:var(--fill2);border-radius:9px;padding:2px;gap:2px;margin:6px 0 10px}
  .seg button{flex:1 1 auto;min-width:0;border:none;border-radius:7px;background:none;font-family:inherit;font-size:11.5px;
    color:var(--fg);opacity:.72;padding:6px 4px;cursor:pointer;white-space:nowrap}
  .seg button.on{opacity:1;background:var(--capsule);font-weight:590;box-shadow:0 1px 3px rgba(28,28,30,.14)}
  .btn{width:100%;background:var(--fill);border:none;border-radius:var(--r);color:var(--fg);font-family:inherit;font-size:12px;
    font-weight:500;padding:11px 0;margin-top:6px;cursor:pointer}
  .btn:hover{background:rgba(28,28,30,.16)}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.solid{background:var(--fg);color:var(--paper);font-weight:590;font-size:13px;padding:14px 0}
  .btns2{display:flex;gap:6px}
  input[type=text],textarea{width:100%;font-family:inherit;font-size:13px;padding:9px 11px;border:.5px solid var(--line);
    border-radius:var(--r);background:var(--capsule);color:var(--fg)}
  textarea{resize:vertical;min-height:48px;line-height:1.5}
  .colors{display:flex;gap:6px;margin-top:4px}
  .colors label{flex:1;font-size:10.5px;color:var(--fg2)}
  input[type=color]{width:100%;height:30px;padding:0;border:.5px solid var(--line);border-radius:var(--r);background:transparent;margin-top:3px}
  #prog{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin:8px 0 2px}
  #prog i{display:block;height:100%;width:0;background:var(--fg)}
  #song{font-size:11.5px;color:var(--fg2);margin-top:4px;min-height:1.2em;word-break:break-all}
  .note{font-size:10.5px;line-height:1.65;color:var(--fg2);opacity:.8;margin-top:7px}
  #gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  #gal img{width:100%;display:block;border:.5px solid var(--line);background:#fff}
  #gal div{font:9.5px ui-monospace,Menlo,monospace;color:var(--fg2);margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .hide{display:none!important}

  @media (max-width:820px){
    body{flex-direction:column;overscroll-behavior:none}
    #stage{flex:0 0 56vh;flex-basis:56dvh}
    #panel{width:100%;flex:1 1 auto;height:auto;border-left:0;border-top:.5px solid var(--line);
      padding:16px 14px calc(80px + env(safe-area-inset-bottom));overscroll-behavior:contain}
    label.h{margin:0 -14px 8px;padding:7px 14px 6px}
    input[type=text],textarea{font-size:16px}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="hud">res <b id="hres">—</b><span id="lv"><i></i></span><span id="htime">0:00</span></div>
  <button id="viewbtn">紙全体</button>
  <div id="stat"></div>
</div>
<div id="drop">曲（mp3・m4a・wav）か画像を置く</div>

<div id="panel">
  <h1>聴 KIKU</h1>
  <p class="sub">1曲かけて、鳴っている間だけ手で置く。音の大きさが粒の細かさを、音の明るさがグラデを決める。曲が終わったら完成。</p>

  <div class="grp">
    <label class="h">曲</label>
    <div class="btns2">
      <button class="btn" id="bFile">曲を選ぶ</button>
      <button class="btn" id="bMic">マイクで聞く</button>
    </div>
    <input type="file" id="file" accept="audio/*" class="hide">
    <div id="song">まだ曲がありません</div>
    <div id="prog"><i></i></div>
    <button class="btn solid" id="bPlay" disabled>鳴らす</button>
    <p class="note">鳴っている間だけ、枠の中を指かマウスでなぞると置ける。止めてもいいが、戻せない。曲が終わる（マイクは「終わる」を押す）と完成。</p>
  </div>

  <div class="grp">
    <label class="h">言葉（版）</label>
    <textarea id="word" spellcheck="false">プール
サイド</textarea>
    <div class="seg" id="face">
      <button data-v="gothic" class="on">ゴシック</button><button data-v="mincho">明朝</button><button data-v="oswald">コンデンス</button><button data-v="dot">ドット</button>
    </div>
    <div class="seg" id="where">
      <button data-v="in" class="on">字の中だけ置く</button><button data-v="any">どこでも置く</button>
    </div>
  </div>

  <div class="grp">
    <label class="h">手</label>
    <div class="seg" id="tool">
      <button data-v="put" class="on">置く</button><button data-v="white">修正液で消す</button>
    </div>
    <button class="btn" id="bUndo">1回戻す</button>
  </div>

  <div class="grp">
    <label class="h">色</label>
    <div class="seg" id="pal">
      <button data-v="red" class="on">赤</button><button data-v="blue">青銀</button><button data-v="ink">墨</button><button data-v="free">自由</button>
    </div>
    <div class="colors hide" id="freec">
      <label>濃い<input type="color" id="cDark" value="#1d3a5f"></label>
      <label>明るい<input type="color" id="cLight" value="#f2d49b"></label>
    </div>
  </div>

  <div class="grp">
    <label class="h">記録（右下の鉛筆）</label>
    <input type="text" id="title" placeholder="曲名">
    <p class="note">日付と res（使った粒の細かさ）は自動で入る。</p>
  </div>

  <div class="grp">
    <label class="h">保存・書き出し</label>
    <button class="btn" id="bPng">紙全体をPNG</button>
    <button class="btn" id="bInsta">Instagram 4:5 をPNG</button>
    <div class="btns2">
      <button class="btn" id="bSave">JSONで保存</button>
      <button class="btn" id="bLoad">JSONを開く</button>
    </div>
    <input type="file" id="jfile" accept=".json,application/json" class="hide">
    <button class="btn hide" id="bResume">前のつづきを開く</button>
    <button class="btn" id="bNew">新しい1枚</button>
  </div>

  <div class="grp">
    <label class="h">これまで</label>
    <div id="gal"></div>
    <p class="note" id="galnote">完成した1枚はここに並ぶ（このブラウザだけに残る）。</p>
  </div>
</div>

<script>
'use strict';
// ── 紙と枠 ─────────────────────────────
// ⭐ 11×17インチの紙に 5×5インチの枠（Chris Ashworth の Sound in Print と同じ比率）。大半は余白
const SW = 1100, SH = 1700, F = 500, FX = (SW - F) / 2, FY = 470;
const LEVELS = [32, 24, 16, 12, 8];           // 静か → 大きい（大きいほど粗い）
const PALS = {
  red:  ['#6e0c10', '#d8262c', '#ffc1bb'],
  blue: ['#1f5f7c', '#5fbfd9', '#eef8f9'],
  ink:  ['#141414', '#5a5a5a', '#e2e2e0'],
};
const $ = id => document.getElementById(id);
const cv = $('cv'), cx = cv.getContext('2d');
const st = { face: 'gothic', where: 'in', tool: 'put', pal: 'red', view: 'frame' };
let cells = [], strokes = [], groups = [];     // 置いた升／修正液の線／1回ぶんの区切り（戻す用）
let done = false, dur = 0, startedAt = '';
let listening = false, audio = null, actx = null, analyser = null, src = null, micStream = null;
let feat = { db: -90, bright: 0.5, n: 32, t: 0 };

function stat(m) { $('stat').textContent = m || ''; }
function hex(h) { return [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16)); }
function mix(a, b, t) { return a.map((v, i) => Math.round(v + (b[i] - v) * t)); }
function hash(a, b, c) { let h = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul(c | 0, 2246822519); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function palette() {
  if (st.pal === 'free') { const d = hex($('cDark').value), l = hex($('cLight').value); return [d, mix(d, l, 0.5), l]; }
  return PALS[st.pal].map(hex);
}

// ── 言葉の版（どこに置けるか） ─────────────
const FONTS = { gothic: '900 100px "Zen Kaku Gothic New"', mincho: '900 100px "Zen Old Mincho"', oswald: '600 100px "Oswald", "Zen Kaku Gothic New"', dot: '400 100px "DotGothic16"' };
const MR = 400;                                // 版の細かさ（枠を400×400で持つ）
let mask = new Float32Array(MR * MR), maskCanvas = null;
function buildMask() {
  const c = document.createElement('canvas'); c.width = c.height = MR;
  const g = c.getContext('2d');
  const lines = ($('word').value || '').split('\n').filter(s => s.length);
  g.fillStyle = '#000'; g.textAlign = 'center'; g.textBaseline = 'middle';
  if (lines.length) {
    g.font = FONTS[st.face];
    const wmax = Math.max(...lines.map(l => g.measureText(l).width));
    const lh = 1.08, k = Math.min(MR * 0.88 / wmax, MR * 0.88 / (lines.length * 100 * lh));
    g.font = FONTS[st.face].replace('100px', (100 * k) + 'px');
    lines.forEach((l, i) => g.fillText(l, MR / 2, MR / 2 + (i - (lines.length - 1) / 2) * 100 * k * lh + 100 * k * 0.04));
  }
  const d = g.getImageData(0, 0, MR, MR).data;
  for (let i = 0; i < mask.length; i++) mask[i] = d[i * 4 + 3] / 255;
  maskCanvas = c;
}
// 升が字にどれだけ掛かっているか（5×5点で測る）
function coverage(i, j, n) {
  const s = MR / n; let a = 0;
  for (let y = 0; y < 5; y++) for (let x = 0; x < 5; x++) a += mask[Math.min(MR - 1, (j * s + (y + 0.5) * s / 5) | 0) * MR + Math.min(MR - 1, (i * s + (x + 0.5) * s / 5) | 0)];
  return a / 25;
}

// ── 音を聞く ───────────────────────────
function ensureCtx() { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); }
function makeAnalyser() { analyser = actx.createAnalyser(); analyser.fftSize = 2048; analyser.smoothingTimeConstant = 0.6; }
const tbuf = new Float32Array(2048), fbuf = new Float32Array(1024);
function listen() {
  if (!listening || !analyser) return;
  analyser.getFloatTimeDomainData(tbuf);
  let s = 0; for (let i = 0; i < tbuf.length; i++) s += tbuf[i] * tbuf[i];
  const db = 10 * Math.log10(s / tbuf.length + 1e-12);
  analyser.getFloatFrequencyData(fbuf);
  let num = 0, den = 0; const hz = actx.sampleRate / 2 / fbuf.length;
  for (let i = 2; i < fbuf.length; i++) { const m = Math.pow(10, fbuf[i] / 20); num += m * i * hz; den += m; }
  const cen = den ? num / den : 1000;
  // 大きくなるのは速く、静かになるのはゆっくり（音の立ち上がりに粒が反応する）
  feat.db += (db - feat.db) * (db > feat.db ? 0.35 : 0.06);
  const b = Math.max(0, Math.min(1, (Math.log2(cen) - Math.log2(250)) / (Math.log2(6000) - Math.log2(250))));
  feat.bright += (b - feat.bright) * 0.12;
  const k = Math.max(0, Math.min(1, (feat.db + 48) / 36));
  feat.n = LEVELS[Math.round(k * (LEVELS.length - 1))];
  feat.t = audio ? audio.currentTime : (performance.now() - micT0) / 1000;
  $('hres').textContent = feat.n; $('lv').firstChild.style.width = Math.round(k * 100) + '%';
  $('htime').textContent = fmt(feat.t);
  if (audio && audio.duration) $('prog').firstChild.style.width = (100 * audio.currentTime / audio.duration) + '%';
  draw();
  requestAnimationFrame(listen);
}
function fmt(t) { t = Math.max(0, t | 0); return (t / 60 | 0) + ':' + String(t % 60).padStart(2, '0'); }

$('bFile').onclick = () => $('file').click();
$('file').onchange = e => { const f = e.target.files[0]; if (f) loadSong(f); e.target.value = ''; };
function loadSong(f) {
  if (done) newPiece(true);
  stopMic();
  if (audio) { audio.pause(); }
  audio = new Audio(URL.createObjectURL(f)); audio.preload = 'auto';
  src = null;
  const name = f.name.replace(/\.[^.]+$/, '');
  $('song').textContent = name; if (!$('title').value) $('title').value = name;
  $('bPlay').disabled = false; $('bPlay').textContent = '鳴らす';
  audio.onended = () => finish('曲が終わった');
  audio.onloadedmetadata = () => { dur = audio.duration; stat(`${name}（${fmt(audio.duration)}）を入れた。「鳴らす」で始まる`); };
}
$('bPlay').onclick = () => {
  if (done) return;
  if (micStream) { finish('マイクを終えた'); return; }
  if (!audio) return;
  ensureCtx();
  if (!src) { src = actx.createMediaElementSource(audio); makeAnalyser(); src.connect(analyser); analyser.connect(actx.destination); }
  if (audio.paused) {
    audio.play(); listening = true; if (!startedAt) startedAt = new Date().toISOString();
    $('bPlay').textContent = '止める'; stat('鳴っている間だけ置ける'); listen();
  } else { audio.pause(); listening = false; $('bPlay').textContent = '続きを鳴らす'; stat('止めた（戻せない）'); draw(); }
};
let micT0 = 0;
$('bMic').onclick = async () => {
  if (done) newPiece(true);
  if (micStream) { finish('マイクを終えた'); return; }
  try {
    ensureCtx();
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    if (audio) { audio.pause(); audio = null; }
    makeAnalyser(); actx.createMediaStreamSource(micStream).connect(analyser);   // 🔴 スピーカーへは繋がない（ハウリング）
    listening = true; micT0 = performance.now(); if (!startedAt) startedAt = new Date().toISOString();
    $('song').textContent = 'マイクで聞いている'; $('bPlay').disabled = false; $('bPlay').textContent = '終わる'; $('bMic').textContent = '終わる';
    stat('マイクで聞いている。「終わる」で完成'); listen();
  } catch (e) { stat('マイクが使えませんでした（許可が要ります）'); }
};
function stopMic() { if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; $('bMic').textContent = 'マイクで聞く'; } }

// ── 手 ─────────────────────────────────
let pressing = false, lastKey = '', group = null, stroke = null;
function toBoard(e) { const r = cv.getBoundingClientRect(); return { x: view.x + (e.clientX - r.left) / r.width * view.w, y: view.y + (e.clientY - r.top) / r.height * view.h }; }
$('stage').addEventListener('pointerdown', e => {
  if (e.target !== cv) return;
  if (done) { stat('この1枚は完成している（「新しい1枚」で次へ）'); return; }
  if (!listening) { stat(audio || micStream ? '鳴っている間だけ置ける（「鳴らす」）' : 'まず曲を選ぶか、マイクで聞く'); return; }
  $('stage').setPointerCapture(e.pointerId);
  pressing = true; lastKey = ''; group = { c: 0, s: 0 };
  if (st.tool === 'white') { stroke = { w: 18 + feat.n * 0.6, pts: [] }; strokes.push(stroke); group.s = 1; }
  handAt(toBoard(e));
});
$('stage').addEventListener('pointermove', e => { if (pressing && listening && !done) handAt(toBoard(e)); });
function endPress() { if (!pressing) return; pressing = false; if (group && (group.c || group.s)) groups.push(group); group = null; stroke = null; autosave(); }
$('stage').addEventListener('pointerup', endPress);
$('stage').addEventListener('pointercancel', endPress);
function handAt(p) {
  if (st.tool === 'white') { stroke.pts.push([Math.round(p.x), Math.round(p.y)]); draw(); return; }
  const n = feat.n, s = F / n;
  const i = Math.floor((p.x - FX) / s), j = Math.floor((p.y - FY) / s);
  if (i < 0 || j < 0 || i >= n || j >= n) return;
  const key = n + ':' + i + ':' + j;
  if (key === lastKey) return;
  lastKey = key;
  if (st.where === 'in' && coverage(i, j, n) < 0.3) return;
  const q = cells.length;
  // 手のずれ＝置いた瞬間に決めて持つ（描き直しても同じ）
  cells.push({ i, j, n, b: +feat.bright.toFixed(3), l: +Math.max(0, Math.min(1, (feat.db + 48) / 36)).toFixed(3),
    dx: +((hash(q, i, j) - 0.5) * s * 0.08).toFixed(2), dy: +((hash(j, q, i) - 0.5) * s * 0.08).toFixed(2), r: +((hash(i, j, q) - 0.5) * 3).toFixed(2), t: +feat.t.toFixed(2) });
  group.c++;
  draw();
}
$('bUndo').onclick = () => {
  const g = groups.pop(); if (!g) { stat('戻すものがありません'); return; }
  cells.length -= g.c; if (g.s) strokes.pop(); draw(); autosave(); stat(`戻した（升${g.c}つ${g.s ? '・修正液1本' : ''}）`);
};

// ── 描く ───────────────────────────────
// 升＝粒と同じ「段のあるグラデ」。明るい音ほど明るい色へ・向きも変わる
function drawCell(g, c, pal) {
  const s = F / c.n, x = FX + c.i * s + c.dx, y = FY + c.j * s + c.dy;
  const c1 = mix(pal[0], pal[1], 0.15 + c.b * 0.55), c2 = mix(pal[1], pal[2], 0.25 + c.b * 0.75);
  const bands = 5 + Math.round(c.l * 3), ang = (c.b * 150 + c.l * 40) * Math.PI / 180;
  g.save(); g.translate(x + s / 2, y + s / 2); g.rotate(c.r * Math.PI / 180);
  g.beginPath(); g.rect(-s / 2, -s / 2, s, s); g.clip();
  g.rotate(ang);
  const R = s * 0.75, bw = 2 * R / bands;
  for (let k = 0; k < bands; k++) { const col = mix(c1, c2, k / (bands - 1)); g.fillStyle = `rgb(${col})`; g.fillRect(-R + k * bw - 0.5, -R, bw + 1, 2 * R); }
  g.restore();
}
// 紙の目（小さな板を敷き詰める）
let paperPat = null;
function paperPattern(g) {
  if (paperPat) return paperPat;
  const t = document.createElement('canvas'); t.width = t.height = 256; const p = t.getContext('2d');
  const im = p.createImageData(256, 256);
  for (let i = 0; i < 256 * 256; i++) { const v = 128 + (hash(i, 7, 3) - 0.5) * 34 + (hash(i >> 3, 11, 5) - 0.5) * 14; im.data[i * 4] = im.data[i * 4 + 1] = im.data[i * 4 + 2] = v; im.data[i * 4 + 3] = 26; }
  p.putImageData(im, 0, 0);
  for (let k = 0; k < 90; k++) { p.strokeStyle = `rgba(90,85,75,${0.05 + hash(k, 1, 2) * 0.06})`; p.lineWidth = 0.7; const x = hash(k, 3, 4) * 256, y = hash(k, 5, 6) * 256, a = hash(k, 7, 8) * 6.28, L = 4 + hash(k, 9, 1) * 12; p.beginPath(); p.moveTo(x, y); p.lineTo(x + Math.cos(a) * L, y + Math.sin(a) * L); p.stroke(); }
  return paperPat = g.createPattern(t, 'repeat');
}
function pencilLine(g, x0, y0, x1, y1, w, seed) {
  for (let k = 0; k < 3; k++) { g.strokeStyle = `rgba(60,60,64,${0.28 - k * 0.07})`; g.lineWidth = w * (1 - k * 0.25); g.beginPath();
    g.moveTo(x0 + (hash(seed, k, 1) - 0.5) * 1.2, y0 + (hash(seed, k, 2) - 0.5) * 1.2); g.lineTo(x1 + (hash(seed, k, 3) - 0.5) * 1.2, y1 + (hash(seed, k, 4) - 0.5) * 1.2); g.stroke(); }
}
function resRange() { if (!cells.length) return null; let a = 99, b = 0; cells.forEach(c => { a = Math.min(a, c.n); b = Math.max(b, c.n); }); return [a, b]; }
function mostRes() { const m = {}; cells.forEach(c => m[c.n] = (m[c.n] || 0) + 1); let best = 16, bc = -1; for (const k in m) if (m[k] > bc) { bc = m[k]; best = +k; } return best; }
function recordText() {
  const d = startedAt ? new Date(startedAt) : new Date();
  const date = `${String(d.getFullYear()).slice(2)} / ${d.getMonth() + 1} / ${d.getDate()}`;
  const rr = resRange();
  return [date, ($('title').value || '').trim(), rr ? (rr[0] === rr[1] ? `res ${rr[0]}` : `res ${rr[0]}–${rr[1]}`) : ''];
}
// 1枚ぶんを描く（画面も書き出しも同じ関数）
function scene(g, overlay) {
  g.fillStyle = '#f6f4ee'; g.fillRect(0, 0, SW, SH);
  g.fillStyle = paperPattern(g); g.fillRect(0, 0, SW, SH);
  // 鉛筆の枠：角で線を突き抜けさせる
  const o = 22;
  pencilLine(g, FX - o, FY, FX + F + o, FY, 1.3, 1); pencilLine(g, FX - o, FY + F, FX + F + o, FY + F, 1.3, 2);
  pencilLine(g, FX, FY - o, FX, FY + F + o, 1.3, 3); pencilLine(g, FX + F, FY - o, FX + F, FY + F + o, 1.3, 4);
  // 右の目盛り＝いちばん多く使った細かさ
  const tn = cells.length ? mostRes() : 16;
  for (let k = 1; k < tn; k++) { const y = FY + F * k / tn, big = k % 4 === 0; if (tn > 16 && !big && k % 2) continue; pencilLine(g, FX + F + (big ? 12 : 15), y, FX + F + (big ? 24 : 21), y, 1, 10 + k); }
  // 升（字の版は画面だけに薄く出す）
  if (overlay && maskCanvas && !done) { g.save(); g.globalAlpha = 0.07; g.drawImage(maskCanvas, FX, FY, F, F); g.restore(); }
  const pal = palette();
  cells.forEach(c => drawCell(g, c, pal));
  // 修正液：白く厚い線。縁に影と照り
  strokes.forEach(s => {
    if (s.pts.length < 1) return;
    const path = () => { g.beginPath(); g.moveTo(s.pts[0][0], s.pts[0][1]); s.pts.forEach(p => g.lineTo(p[0], p[1])); if (s.pts.length === 1) g.lineTo(s.pts[0][0] + 0.1, s.pts[0][1]); };
    g.lineCap = 'round'; g.lineJoin = 'round';
    g.save(); g.translate(1.5, 2); path(); g.strokeStyle = 'rgba(40,36,30,.12)'; g.lineWidth = s.w + 2; g.stroke(); g.restore();
    path(); g.strokeStyle = '#f7f6f1'; g.lineWidth = s.w; g.stroke();
    g.save(); g.translate(-1, -1.2); path(); g.strokeStyle = 'rgba(255,255,255,.45)'; g.lineWidth = s.w * 0.3; g.stroke(); g.restore();
  });
  // 鉛筆の記録（右下・枠の外）
  const [date, title, res] = recordText();
  g.fillStyle = 'rgba(60,60,64,.62)'; g.textAlign = 'right'; g.textBaseline = 'alphabetic';
  // 彼の記録は小さい（枠13cmに対して字高5mmほど）
  g.font = '600 13px "Klee One", cursive'; g.fillText(date, FX + F, FY + F + 40);
  g.font = '600 11px "Klee One", cursive';
  g.fillText([title, res].filter(Boolean).join('  —  '), FX + F, FY + F + 58);
  // 画面だけ：いまの粒の升目
  if (overlay && listening && !done) {
    const n = feat.n, s = F / n; g.strokeStyle = 'rgba(45,125,246,.18)'; g.lineWidth = 0.6;
    g.beginPath(); for (let k = 1; k < n; k++) { g.moveTo(FX + k * s, FY); g.lineTo(FX + k * s, FY + F); g.moveTo(FX, FY + k * s); g.lineTo(FX + F, FY + k * s); } g.stroke();
  }
}
const view = { x: 0, y: 0, w: SW, h: SH };
function fitView() {
  const r = $('stage').getBoundingClientRect(), dpr = Math.min(3, devicePixelRatio || 1);
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  // 枠に寄る＝枠と記録が収まる所／紙全体
  const tgt = st.view === 'frame' ? { x: FX - 70, y: FY - 70, w: F + 140, h: F + 170 } : { x: 0, y: 0, w: SW, h: SH };
  const k = Math.min(r.width / tgt.w, (r.height - 30) / tgt.h);
  view.w = r.width / k; view.h = r.height / k; view.x = tgt.x + tgt.w / 2 - view.w / 2; view.y = tgt.y + tgt.h / 2 - view.h / 2 - 8 / k;
  draw();
}
let raf = 0;
function draw() { if (raf) return; raf = requestAnimationFrame(() => { raf = 0; const k = cv.width / view.w;
  cx.setTransform(1, 0, 0, 1, 0, 0); cx.fillStyle = '#e8e4dc'; cx.fillRect(0, 0, cv.width, cv.height);
  cx.setTransform(k, 0, 0, k, -view.x * k, -view.y * k);
  cx.save(); cx.shadowColor = 'rgba(28,28,30,.18)'; cx.shadowBlur = 30; cx.shadowOffsetY = 10; cx.fillStyle = '#f6f4ee'; cx.fillRect(0, 0, SW, SH); cx.restore();
  scene(cx, true); }); }
$('viewbtn').onclick = () => { st.view = st.view === 'frame' ? 'sheet' : 'frame'; $('viewbtn').textContent = st.view === 'frame' ? '紙全体' : '枠に寄る'; fitView(); };
addEventListener('resize', fitView);

// ── 完成 ───────────────────────────────
function finish(why) {
  if (done) return;
  listening = false; done = true; pressing = false;
  if (audio) audio.pause(); stopMic();
  $('bPlay').disabled = true; $('bPlay').textContent = '完成';
  draw();
  const rr = resRange();
  stat(`${why} ＝ 完成（升${cells.length}つ${rr ? '・res ' + rr[0] + '–' + rr[1] : ''}）`);
  addToGallery(); autosave();
}
function newPiece(silent) {
  cells = []; strokes = []; groups = []; done = false; startedAt = ''; listening = false;
  if (audio) { audio.pause(); audio.currentTime = 0; }
  stopMic();
  $('bPlay').disabled = !audio; $('bPlay').textContent = '鳴らす'; $('prog').firstChild.style.width = '0';
  try { localStorage.removeItem('kiku.current'); } catch (e) {}
  $('bResume').classList.add('hide');
  if (!silent) stat('新しい1枚'); draw();
}
$('bNew').onclick = () => newPiece();

// ── 書き出し・保存 ─────────────────────
function render(scale, region) {
  const c = document.createElement('canvas'); c.width = Math.round(region.w * scale); c.height = Math.round(region.h * scale);
  const g = c.getContext('2d'); g.setTransform(scale, 0, 0, scale, -region.x * scale, -region.y * scale); scene(g, false); return c;
}
function stampName() { const d = new Date(), p = v => String(v).padStart(2, '0'); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`; }
function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 3000); }
function safeTitle() { return (($('title').value || 'kiku').replace(/[\\/:*?"<>|]/g, '').slice(0, 30)) || 'kiku'; }
$('bPng').onclick = () => { render(2, { x: 0, y: 0, w: SW, h: SH }).toBlob(b => download(b, `kiku_${safeTitle()}_${stampName()}.png`)); stat(`紙全体を ${SW * 2}×${SH * 2} で書き出した`); };
$('bInsta').onclick = () => {
  const w = F * 1.9, h = w * 1.25, reg = { x: FX + F / 2 - w / 2, y: FY + F / 2 - h / 2 + 30, w, h };
  render(1080 / w, reg).toBlob(b => download(b, `kiku_${safeTitle()}_4x5_${stampName()}.png`)); stat('Instagram 4:5（1080×1350）で書き出した');
};
function snapshot() { return { tool: 'kiku', v: 1, word: $('word').value, face: st.face, where: st.where, pal: st.pal, dark: $('cDark').value, light: $('cLight').value,
  title: $('title').value, startedAt, done, dur, cells, strokes, groups }; }
async function restore(s) {
  $('word').value = s.word || ''; st.face = s.face || 'gothic'; st.where = s.where || 'in'; st.pal = s.pal || 'red';
  $('cDark').value = s.dark || '#1d3a5f'; $('cLight').value = s.light || '#f2d49b'; $('title').value = s.title || '';
  ['face', 'where', 'pal'].forEach(k => segOn(k, st[k])); $('freec').classList.toggle('hide', st.pal !== 'free');
  cells = s.cells || []; strokes = s.strokes || []; groups = s.groups || []; startedAt = s.startedAt || ''; done = !!s.done; dur = s.dur || 0;
  await loadFonts(); buildMask(); fitView();
  $('bPlay').disabled = done || !audio; $('bPlay').textContent = done ? '完成' : '鳴らす';
}
$('bSave').onclick = () => { download(new Blob([JSON.stringify(snapshot())], { type: 'application/json' }), `kiku_${safeTitle()}_${stampName()}.json`); stat('JSONで保存した（曲そのものは入らない）'); };
$('bLoad').onclick = () => $('jfile').click();
$('jfile').onchange = e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { try { restore(JSON.parse(rd.result)).then(() => stat(`${f.name} を開いた（升${cells.length}つ）`)); } catch (er) { stat('JSONが読めませんでした'); } }; rd.readAsText(f); e.target.value = ''; };
// 控え：自動で保存するが、自動では開かない（毎回まっさらで始まる）
let tSave = 0;
function autosave() { clearTimeout(tSave); tSave = setTimeout(() => { try { localStorage.setItem('kiku.current', JSON.stringify(snapshot())); } catch (e) {} }, 600); }
$('bResume').onclick = () => { try { const s = JSON.parse(localStorage.getItem('kiku.current')); restore(s).then(() => { stat(`前のつづきを開いた（升${cells.length}つ）`); $('bResume').classList.add('hide'); }); } catch (e) { stat('つづきが読めませんでした'); } };
function addToGallery() {
  try {
    const t = render(0.22, { x: FX - 60, y: FY - 60, w: F + 120, h: F + 150 });
    const list = JSON.parse(localStorage.getItem('kiku.gallery') || '[]');
    const [date, title, res] = recordText();
    list.unshift({ date, title, res, img: t.toDataURL('image/jpeg', 0.8) });
    localStorage.setItem('kiku.gallery', JSON.stringify(list.slice(0, 60)));
  } catch (e) {}
  showGallery();
}
function showGallery() {
  let list = []; try { list = JSON.parse(localStorage.getItem('kiku.gallery') || '[]'); } catch (e) {}
  $('gal').innerHTML = list.map(x => `<figure><img src="${x.img}" alt=""><div>${x.date} ${x.title || ''}</div></figure>`).join('');
  $('galnote').textContent = list.length ? `${list.length}枚（このブラウザだけに残る）` : '完成した1枚はここに並ぶ（このブラウザだけに残る）。';
}

// ── つまみ ─────────────────────────────
function segOn(id, v) { [...$(id).children].forEach(b => b.classList.toggle('on', b.dataset.v === v)); }
function seg(id, fn) { $(id).onclick = e => { const b = e.target.closest('button'); if (!b) return; segOn(id, b.dataset.v); fn(b.dataset.v); }; }
function loadFonts() { return Promise.all([FONTS[st.face], '600 20px "Klee One"'].map(f => document.fonts.load(f, $('word').value + '0123456789 /–').catch(() => {}))); }
seg('face', v => { st.face = v; loadFonts().then(() => { buildMask(); draw(); }); });
seg('where', v => { st.where = v; stat(v === 'in' ? '字の中だけに置ける' : 'どこにでも置ける'); });
seg('tool', v => { st.tool = v; stat(v === 'put' ? '置く' : '修正液で消す（太さは音の大きさで変わる）'); });
seg('pal', v => { st.pal = v; $('freec').classList.toggle('hide', v !== 'free'); draw(); autosave(); });
['cDark', 'cLight'].forEach(k => $(k).addEventListener('input', () => { draw(); autosave(); }));
let tW = 0;
$('word').addEventListener('input', () => { clearTimeout(tW); tW = setTimeout(() => loadFonts().then(() => { buildMask(); draw(); autosave(); }), 200); });
$('title').addEventListener('input', () => { draw(); autosave(); });
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  if (e.key === ' ') { e.preventDefault(); if (!$('bPlay').disabled) $('bPlay').click(); }
  else if ((e.metaKey || e.ctrlKey) && e.key === 'z') { e.preventDefault(); $('bUndo').click(); }
});
addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragging'); });
addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('dragging'); });
addEventListener('drop', e => { e.preventDefault(); document.body.classList.remove('dragging'); const f = e.dataTransfer.files[0]; if (!f) return;
  if (f.name.endsWith('.json')) { const rd = new FileReader(); rd.onload = () => restore(JSON.parse(rd.result)); rd.readAsText(f); } else if (f.type.startsWith('audio/') || /\.(mp3|m4a|wav|aac|ogg|flac)$/i.test(f.name)) loadSong(f); });

// ── 見本（確かめ用：#demo で、作りものの曲の起伏に沿って置いた1枚を出す） ──
function demo() {
  const words = $('word').value; let q = 0;
  for (let t = 0; t < 200; t += 0.5) {
    const env = 0.5 + 0.5 * Math.sin(t / 9) * Math.sin(t / 23 + 1);            // 音の大きさの起伏
    const n = LEVELS[Math.round(Math.max(0, Math.min(1, env)) * (LEVELS.length - 1))], s = F / n;
    for (let k = 0; k < 5; k++) {
      const i = Math.floor(hash(q, 1, 9) * n), j = Math.floor(hash(q, 2, 9) * n); q++;
      if (coverage(i, j, n) < 0.3) continue;
      cells.push({ i, j, n, b: +(0.5 + 0.5 * Math.sin(t / 5)).toFixed(3), l: +env.toFixed(3), dx: (hash(q, i, j) - 0.5) * s * 0.08, dy: (hash(j, q, i) - 0.5) * s * 0.08, r: (hash(i, j, q) - 0.5) * 3, t });
    }
  }
  strokes.push({ w: 26, pts: [[FX - 30, FY + F - 70], [FX + 60, FY + F - 64], [FX + 150, FY + F - 72], [FX + 230, FY + F - 66]] });
  $('title').value = 'POOLSIDE'; startedAt = new Date().toISOString(); done = true;
  $('bPlay').textContent = '完成'; draw();
}

// ── はじめ ─────────────────────────────
loadFonts().then(() => {
  buildMask(); fitView(); showGallery();
  try { const s = localStorage.getItem('kiku.current'); if (s && JSON.parse(s).cells.length) $('bResume').classList.remove('hide'); } catch (e) {}
  if (location.hash.includes('demo')) demo();
  else stat('曲を選ぶ（か、マイクで聞く）→「鳴らす」→ 鳴っている間だけ枠の中をなぞる');
});
</script>
