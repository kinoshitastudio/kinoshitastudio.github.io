<script>
/* ══════════════════════════════════════════════════════════════
   奔 HON ── 骨で書いた欧文を、筆で走らせる
   2026-08-30 木下「YASUKO との筆記体のフォント、どちらもないものであれば
                    道具で UWASA のように作成して」
   （参考＝映画『ゆきてかへらぬ』ポスターの赤い手書き）

   ⭐⭐ 噂UWASA と芯が違う。
     UWASA ＝ **すでにある字の輪郭を崩す**
     HON   ＝ **1本の骨から書く**（線に筆を着せる）
   ⭐ 参考の赤い字は「崩した明朝」では絶対に出ない。速く走った1本の線だから
     入りと抜きで細り、角が尖り、交点をはみ出す。**骨から起こすしかない。**

   ⚠️ ばらつき（震え・傾き・大きさ・上下）は【全部の字に同じ規則で】掛ける
     ＝1字ずつ手で描くのではなく「書体」にするため。
   ══════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const cv = $('cv'), cx = cv.getContext('2d');

const S = {
  text:'YASUKO',
  /* ⭐ 既定は【参考の実測】に寄せる（映画『ゆきてかへらぬ』の赤い手書き）。
     線幅は字の高さの 3.6%／字は縦長（幅:高さ ≒ 0.64）／1字は版面の幅の 21%。
     ⚠️ 直す前は 線幅 5.8%・正方の箱だったので「全然違う」形になっていた。 */
  /* ⭐ 参考は【ブロック体を崩したもの】ではなく【続け書き】── 角が丸く、終筆が長く鋭い。
     だから 流れ（角を丸める）と 払い（終筆を伸ばす）を持つ。 */
  pen:{ w:58, taper:58, flow:62, sweep:64, vary:58, over:58, trace:2, dry:0, cap:0 },
  /* ⭐ 参考は【字ごとの不揃いが強い】── 傾き・大きさ・上下がかなりばらつく。
     直す前の既定は整いすぎていて「機械が並べた」ように見えていた。 */
  hand:{ warp:44, jit:38, jg:30, jr:48, js:46, jy:42, seed:7 },
  run:{ size:230, adv:62, ang:10, x:8, y:14, wide:66, tall:118, w:1000, h:1500, col:'#e8452a' },
  view:'run',
  out:{ long:2400 },
};
let photo = null;

/* ⭐ 種で振れる乱数。🔴 素の線形合同法は【1発目が種にほぼ比例する】ので潰してから使う */
function rnd(seed){
  let s = (seed|0) || 1;
  s = Math.imul(s ^ 0x9e3779b9, 0x85ebca6b);
  s = (s ^ (s >>> 13)) | 0;
  const next = () => { s = (s*1664525 + 1013904223)|0; return ((s>>>8) & 0xffffff) / 0xffffff; };
  next(); next(); next();
  return next;
}

/* ══════════════════════════════════════════════════════════════
   ① 骨 ── 大文字を【数本の線】で持つ
   ⚠️ 箱は 0〜1（左上が 0,0）。em の箱に属する＝字ごとに箱を切らない。
   ⭐ 閉じた輪郭ではなく【書き順の線】。だから入りと抜きが作れる。
   ══════════════════════════════════════════════════════════════ */
const BONE = {
  A:[[[0,1],[.5,0],[1,1]],[[.18,.66],[.82,.66]]],
  B:[[[0,0],[0,1]],[[0,0],[.62,.06],[.72,.26],[.58,.47],[0,.5]],[[0,.5],[.68,.55],[.82,.76],[.62,.96],[0,1]]],
  C:[[[.96,.16],[.62,0],[.22,.12],[.06,.5],[.22,.88],[.62,1],[.96,.84]]],
  D:[[[0,0],[0,1]],[[0,0],[.58,.08],[.86,.5],[.58,.92],[0,1]]],
  E:[[[0,0],[0,1]],[[0,0],[.9,0]],[[0,.5],[.72,.5]],[[0,1],[.94,1]]],
  F:[[[0,0],[0,1]],[[0,0],[.9,0]],[[0,.48],[.68,.48]]],
  G:[[[.96,.16],[.62,0],[.22,.12],[.06,.5],[.22,.88],[.62,1],[.96,.82],[.96,.54],[.6,.54]]],
  H:[[[0,0],[0,1]],[[1,0],[1,1]],[[0,.52],[1,.52]]],
  I:[[[.5,0],[.5,1]]],
  J:[[[.82,0],[.82,.78],[.62,.98],[.24,.9],[.12,.68]]],
  K:[[[0,0],[0,1]],[[.94,0],[.04,.56]],[[.34,.44],[1,1]]],
  L:[[[0,0],[0,1]],[[0,1],[.9,1]]],
  M:[[[0,1],[.06,0],[.5,.68],[.94,0],[1,1]]],
  N:[[[0,1],[.02,0],[.98,1],[1,0]]],
  O:[[[.5,0],[.14,.16],[.02,.5],[.14,.84],[.5,1],[.86,.84],[.98,.5],[.86,.16],[.5,0]]],
  P:[[[0,0],[0,1]],[[0,0],[.7,.08],[.82,.3],[.64,.52],[0,.55]]],
  Q:[[[.5,0],[.14,.16],[.02,.5],[.14,.84],[.5,1],[.86,.84],[.98,.5],[.86,.16],[.5,0]],[[.62,.72],[1,1.06]]],
  R:[[[0,0],[0,1]],[[0,0],[.7,.08],[.82,.3],[.62,.52],[0,.55]],[[.36,.54],[.96,1]]],
  S:[[[.92,.14],[.5,0],[.1,.2],[.46,.46],[.88,.7],[.5,1],[.08,.86]]],
  T:[[[0,0],[1,0]],[[.5,0],[.5,1]]],
  U:[[[0,0],[.02,.74],[.5,1],[.98,.74],[1,0]]],
  V:[[[0,0],[.5,1],[1,0]]],
  W:[[[0,0],[.24,1],[.5,.34],[.76,1],[1,0]]],
  X:[[[0,0],[1,1]],[[1,0],[0,1]]],
  Y:[[[0,0],[.5,.52],[1,0]],[[.5,.52],[.5,1]]],
  Z:[[[.02,0],[.98,0],[.04,1],[1,1]]],
  '0':[[[.5,0],[.12,.5],[.5,1],[.88,.5],[.5,0]]],
  '1':[[[.24,.18],[.5,0],[.5,1]]],
  '2':[[[.08,.18],[.5,0],[.9,.22],[.06,1],[.96,1]]],
  '3':[[[.08,.1],[.6,0],[.86,.26],[.4,.48],[.9,.62],[.7,.98],[.1,.92]]],
  '4':[[[.72,1],[.72,0],[.04,.72],[.98,.72]]],
  '5':[[[.9,0],[.16,0],[.1,.44],[.6,.4],[.9,.66],[.62,1],[.08,.92]]],
  '6':[[[.86,.06],[.4,.02],[.1,.5],[.14,.86],[.5,1],[.86,.84],[.84,.56],[.44,.48],[.12,.62]]],
  '7':[[[.04,0],[.96,0],[.42,1]]],
  '8':[[[.5,.46],[.14,.28],[.42,.02],[.8,.2],[.5,.46],[.9,.68],[.6,.99],[.16,.82],[.5,.46]]],
  '9':[[[.16,.94],[.6,.98],[.9,.5],[.86,.14],[.5,0],[.14,.16],[.16,.44],[.56,.52],[.88,.38]]],
  '.':[[[.5,.96],[.52,1]]],
  ',':[[[.55,.94],[.4,1.12]]],
  "'":[[[.5,0],[.44,.24]]],
  '-':[[[.1,.52],[.9,.52]]],
  '&':[[[.9,1],[.2,.2],[.5,0],[.62,.24],[.1,.7],[.3,1],[.86,.6]]],
};
const boneOf = ch => BONE[ch.toUpperCase()] || null;

/* ══════════════════════════════════════════════════════════════
   ② 筆を着せる ── 骨（線）→ 輪郭
   ⭐ 骨を細かく刻んで、法線の左右へ 幅/2 ずつ振る＝1本の帯になる。
   ⭐ 入り抜き＝端で幅を細らせる（速く払った線の形）。
   ⭐ はみ出し＝端を少し伸ばす（交点を越えて走る）。
   ⚠️ 震えは【道のりに沿ったなめらかな乱れ】＝画素ごとの乱数だと「ざらざら」になる。
   ══════════════════════════════════════════════════════════════ */
/* ══⭐⭐ 流れ ── 骨の角を丸めて【続け書き】にする ══
   🔴 骨は直線のポリライン＝そのまま筆を着せると「ブロック体を崩した字」になる。
     参考（ゆきてかへらぬの赤い字）は**続け書き**で、角がぜんぶ丸い。
   ⭐ Chaikin の切り落とし＝各辺の 1/4 と 3/4 に点を打ち直す。回すほど丸くなる。
   ⚠️ 端の点は動かさない（払いの先が縮むと、抜きが効かなくなる）。 */
function chaikin(pts, k, times){
  if(k <= 0 || pts.length < 3) return pts;
  let P = pts;
  for(let t=0;t<times;t++){
    const out = [P[0]];
    for(let i=0;i<P.length-1;i++){
      const a = P[i], b = P[i+1];
      out.push([ a[0] + (b[0]-a[0])*(0.25*k), a[1] + (b[1]-a[1])*(0.25*k) ]);
      out.push([ a[0] + (b[0]-a[0])*(1-0.25*k), a[1] + (b[1]-a[1])*(1-0.25*k) ]);
    }
    out.push(P[P.length-1]);
    P = out;
  }
  return P;
}
function resample(pts, step){
  const out = [pts[0]];
  let carry = 0;
  for(let i=1;i<pts.length;i++){
    const a = out[out.length-1], b = pts[i];
    let d = Math.hypot(b[0]-a[0], b[1]-a[1]);
    let px = a[0], py = a[1];
    while(carry + d >= step){
      const t = (step - carry)/d;
      px = px + (b[0]-px)*t; py = py + (b[1]-py)*t;
      out.push([px,py]);
      d = Math.hypot(b[0]-px, b[1]-py); carry = 0;
    }
    carry += d;
  }
  const last = pts[pts.length-1];
  if(Math.hypot(last[0]-out[out.length-1][0], last[1]-out[out.length-1][1]) > 1e-6) out.push(last);
  return out;
}
/* 骨1本 → 閉じた輪郭（帯） */
function strokeOutline(pts, w, seed){
  const P = S.pen, H = S.hand;
  /* はみ出し＝端を伸ばす */
  /* ⭐ 流れ＝角を丸める（続け書きにする）。⚠️ 筆を着せる前に掛ける */
  pts = chaikin(pts, P.flow/100, 2);
  /* ⭐ はみ出し＝入り側／⭐⭐ 払い＝【終筆だけ】長く伸ばす。
     ⚠️ 参考は入りより抜きが圧倒的に長い（速く払った跡）。両端おなじだと「ただの延長」に見える。 */
  const ovIn = (P.over/100) * w * 0.9;
  const ovOut = ovIn + (P.sweep/100) * w * 4.2;
  if(pts.length >= 2){
    const ext = (a,b,d0) => { const d = Math.hypot(b[0]-a[0], b[1]-a[1]) || 1;
      return [ a[0] + (a[0]-b[0])/d*d0, a[1] + (a[1]-b[1])/d*d0 ]; };
    pts = [ext(pts[0], pts[1], ovIn), ...pts, ext(pts[pts.length-1], pts[pts.length-2], ovOut)];
  }
  const step = Math.max(2, w*0.22);
  const R = resample(pts, step);
  const n = R.length;
  if(n < 2) return null;
  /* 震え＝道のりに沿ったなめらかな乱れ */
  const r = rnd(seed);
  const cell = Math.max(2, Math.round(H.jg*0.14));
  const m = Math.ceil(n/cell)+2, nz = [];
  for(let i=0;i<m;i++) nz.push(r()*2-1);
  const wob = i => { const f=i/cell, k=f|0, t=f-k, s=t*t*(3-2*t);
    return (nz[k%m])*(1-s) + (nz[(k+1)%m])*s; };
  const amp = (H.jit/100) * w * 0.42;
  /* ══⭐⭐ 線幅のムラ ── 【速さ】から作る（結果でなく原因から）══
     ⭐ 手で速く書くと、**曲がる所は遅くなって太り、まっすぐな所は速くて細る**。
       だから太さを乱数でばらすのではなく、**骨の曲がり具合**から出す。
     ⭐ そのうえに筆圧のゆらぎ（道のりに沿ったなめらかな乱れ）を少し足す。
     ⚠️ 曲がりは【前後のベクトルの角度差】で測る。⚠️ 急に変えると角が出るので、
       出したあと隣どうしで均す（筆は1コマで太さが跳ばない）。 */
  const vk = P.vary/100;
  const raw = new Array(n);
  for(let i=0;i<n;i++){
    const a = R[Math.max(0,i-1)], c = R[i], b = R[Math.min(n-1,i+1)];
    const a1 = Math.atan2(c[1]-a[1], c[0]-a[0]), a2 = Math.atan2(b[1]-c[1], b[0]-c[0]);
    let d = Math.abs(a2-a1); if(d > Math.PI) d = Math.PI*2 - d;
    const slow = Math.min(1, d/(Math.PI*0.55));        /* 曲がるほど遅い＝太い */
    raw[i] = 1 + vk*(slow*1.35 - 0.34 + wob(i+97)*0.62);
  }
  const vary = new Array(n);
  for(let i=0;i<n;i++){
    const a = raw[Math.max(0,i-1)], c = raw[i], b = raw[Math.min(n-1,i+1)];
    vary[i] = Math.max(0.18, (a + c*2 + b)/4);
  }
  const L = [], Rt = [];
  for(let i=0;i<n;i++){
    const a = R[Math.max(0,i-1)], b = R[Math.min(n-1,i+1)];
    let nx = -(b[1]-a[1]), ny = (b[0]-a[0]);
    const len = Math.hypot(nx,ny) || 1; nx/=len; ny/=len;
    const t = i/(n-1);
    /* 入り抜き＝両端で細る（真ん中は太いまま） */
    /* ⭐ 入りは短く鈍く・抜きは長く鋭く（速く払った跡）。⚠️ 左右対称だと「両端が細い棒」に見える */
    const k = P.taper/100;
    const eIn = Math.min(1, t*7), eOut = Math.min(1, (1-t)*2.2);
    const e = Math.min(eIn, eOut);
    const wid = w * vary[i] * (1 - k*(1 - Math.pow(e, 0.85))) * 0.5;
    const cxp = R[i][0] + nx*wob(i)*amp, cyp = R[i][1] + ny*wob(i)*amp;
    L.push([cxp + nx*wid, cyp + ny*wid]);
    Rt.push([cxp - nx*wid, cyp - ny*wid]);
  }
  return L.concat(Rt.reverse());
}
/* 1字ぶんの輪郭（複数の帯） */
const cache = new Map();
function glyph(ch, i){
  const H = S.hand, P = S.pen;
  const key = ch + '|' + i + '|' + [P.w,P.taper,P.flow,P.sweep,P.vary,P.over,P.trace,P.cap,H.warp,H.jit,H.jg,H.seed].join(',');
  if(cache.has(key)) return cache.get(key);
  const bone = boneOf(ch);
  if(!bone){ cache.set(key, []); return []; }
  const w = P.w;
  /* 🔴 直す前はここで w を10倍していた＝線幅が字の高さの62%になり、
     字が【1つの塊】に潰れていた。参考（ゆきてかへらぬの赤い字）を実測すると
     線幅は字の高さの **約6%**。⭐ つまみの数字をそのまま em1000 の単位で使う。 */
  /* ⭐⭐ なぞり＝同じ骨を【別の震えで】もう一度書く。
     参考の赤い字は、線が1本でなく **2本以上が少しずれて重なっている**
     （速く書いて、足りない所をもう一度なぞった跡）。
     ⚠️ 同じ震えで重ねても1本にしか見えない＝種を変えるのが要点。 */
  const tr = Math.max(1, Math.round(P.trace||1));
  const g = [];
  bone.forEach((st, si) => {
    for(let t=0;t<tr;t++){
      /* 🔴 直す前は「同じ骨に別の震えを掛ける」だけ＝2本が重なって1本にしか見えなかった。
         ⭐ なぞりは【骨ごと少しずらして・少し回す】＝人がもう一度なぞるときの外し方。
         ⚠️ ずらす量は筆の太さに付ける（大きく書いても同じ外れ方になる）。 */
      const rr = rnd(H.seed*331 + i*77 + si*13 + t*911 + ch.charCodeAt(0));
      /* ⚠️ ずらしを大きくすると【平行な2本線】に見える。⭐ 回して外すと交差して重なる */
      const off = t === 0 ? [0,0,0] : [ (rr()-0.5)*w*1.1, (rr()-0.5)*w*1.1, (rr()-0.5)*0.10 ];
      const ca2 = Math.cos(off[2]), sa2 = Math.sin(off[2]);
      /* ══⭐⭐ 形のくずれ ── 骨の【点そのもの】を動かす ══
         ⭐ 手書きが手書きに見えるのは「線が揺れる」からではない。
           **狙った位置に点が置けない**から。だから震え（線に沿った揺れ）とは別に、
           骨の角の位置を字ごとにずらす。⚠️ ずらすのは字の大きさに対する割合。
         ⚠️ 端の点は少し強めに（払いの先ほど狙いが外れる）。 */
      const wr = rnd(H.seed*457 + i*211 + si*29 + ch.charCodeAt(0)*3);
      const wa = (H.warp/100) * 90;
      const pts = st.map((p, pi) => {
        const edge = (pi === 0 || pi === st.length-1) ? 1.5 : 1;
        const wx = (wr()-0.5)*wa*edge, wy = (wr()-0.5)*wa*edge;
        const x = p[0]*1000 - 500 + wx, y = p[1]*1000 - 500 + wy;
        return [ 500 + x*ca2 - y*sa2 + off[0], 500 + x*sa2 + y*ca2 + off[1] ];
      });
      const o = strokeOutline(pts, w * (t===0 ? 1 : 0.82),
        H.seed*977 + i*131 + si*17 + t*4409 + ch.charCodeAt(0));
      if(o) g.push(o);
    }
  });
  if(cache.size > 600) cache.clear();
  cache.set(key, g);
  return g;
}

/* ══ かすれ ══ ⭐ 筆が進んだ向きに走る筋（点のざらつきではない） */
let grainC = null;
function makeGrain(){
  const W=256, Hh=128;
  grainC = document.createElement('canvas'); grainC.width=W; grainC.height=Hh;
  const g = grainC.getContext('2d'), im = g.createImageData(W,Hh), d = im.data, r = rnd(11);
  const rows=[]; for(let y=0;y<Hh;y++) rows.push(r());
  for(let y=0;y<Hh;y++){ let v=0;
    for(let x=0;x<W;x++){ v = v*0.87 + (r()-0.5)*0.9;
      const a = (v + (rows[y]-0.5)*1.4) > 0.3 ? 255 : 0;
      const i=(y*W+x)*4; d[i]=d[i+1]=d[i+2]=255; d[i+3]=a; } }
  g.putImageData(im,0,0);
}
function dryOver(g, x, y, w, h, size){
  if(!(S.pen.dry > 0)) return;
  if(!grainC) makeGrain();
  const pat = g.createPattern(grainC,'repeat');
  const cell = Math.max(3, size*0.09);
  g.save();
  g.globalCompositeOperation='destination-out';
  g.globalAlpha = S.pen.dry/100 * 0.9;
  g.translate(x,y); g.scale(cell/8, cell/8);
  g.fillStyle = pat; g.fillRect(0,0,w/(cell/8),h/(cell/8));
  g.restore();
}

/* ══════════════════════════════════════════════════════════════
   ③④ 走らせる ── 字ごとのばらつきは【全部の字に同じ規則で】
   ══════════════════════════════════════════════════════════════ */
function runChars(){ return [...S.text].filter(c => c !== '\n'); }
/* 1字ぶんの置き方（大きさ・傾き・上下のずれ）＝種で決まる */
function place(i, ch, size){
  const H = S.hand, r = rnd(H.seed*613 + i*29 + ch.charCodeAt(0));
  return {
    s: 1 + (r()-0.5)*(H.js/100)*1.1,
    rot: (r()-0.5)*(H.jr/100)*44,
    dy: (r()-0.5)*(H.jy/100)*0.7,
  };
}
/* 走らせた結果の外形（版面に収めるのに要る） */
function runBox(size){
  const chars = runChars(), R = S.run;
  const a = R.ang*Math.PI/180, ca = Math.cos(a), sa = Math.sin(a);
  const adv = size*(R.adv/100);
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  chars.forEach((ch,i) => {
    const p = place(i, ch, size), sz = size*p.s;
    const cxp = i*adv*ca, cyp = i*adv*sa + p.dy*size;
    x0=Math.min(x0,cxp); x1=Math.max(x1,cxp+sz*(R.wide/100));
    y0=Math.min(y0,cyp); y1=Math.max(y1,cyp+sz*(R.tall/100));
  });
  if(x0>x1) return {x0:0,y0:0,w:size,h:size};
  return { x0, y0, w:x1-x0, h:y1-y0 };
}
function paint(g, W, H2, opt){
  const svg = (opt && opt.svg) ? [] : null;
  const [BW,BH] = boardSize(), k = W/BW;
  g.save(); g.scale(k,k);
  g.clearRect(0,0,BW,BH);
  g.fillStyle = '#ffffff'; g.fillRect(0,0,BW,BH);
  if(photo){ const kk = Math.max(BW/photo.width, BH/photo.height);
    g.drawImage(photo, (BW-photo.width*kk)/2, (BH-photo.height*kk)/2, photo.width*kk, photo.height*kk); }

  const col = S.run.col;
  if(S.view === 'sheet'){
    const chars = Object.keys(BONE);
    const cols = 9, cell = 200, size = 130;
    chars.forEach((ch,i) => {
      const px = 30 + (i%cols)*cell, py = 30 + ((i/cols)|0)*cell;
      drawGlyph(g, ch, px, py, size, 0, col, i, svg);
    });
    dryOver(g, 0,0, BW, BH, size);
  }else{
    const R = S.run, chars = runChars();
    const size = R.size/1000 * BW;
    const a = R.ang*Math.PI/180, ca = Math.cos(a), sa = Math.sin(a);
    const adv = size*(R.adv/100);
    const ox = R.x/100*BW, oy = R.y/100*BH;
    chars.forEach((ch,i) => {
      const p = place(i, ch, size);
      drawGlyph(g, ch, ox + i*adv*ca, oy + i*adv*sa + p.dy*size, size*p.s, p.rot, col, i, svg);
    });
    const B = runBox(size);
    dryOver(g, ox+B.x0-size*0.3, oy+B.y0-size*0.3, B.w+size, B.h+size, size);
  }
  g.restore();
  return svg;
}
function drawGlyph(g, ch, x, y, size, rot, col, i, svg){
  const rings = glyph(ch, i);
  if(!rings.length) return;
  const k = size/1000;
  g.save();
  g.translate(x, y);
  if(rot){ g.translate(size/2, size/2); g.rotate(rot*Math.PI/180); g.translate(-size/2, -size/2); }
  /* ⭐ 字幅・字高は【描くときに掛ける】＝骨は正方の箱のまま持つ
     （骨を潰して持つと、筆の太さまで潰れて縦横で線幅が変わる）。 */
  g.scale(k*(S.run.wide/100), k*(S.run.tall/100));
  g.beginPath();
  rings.forEach(r => { g.moveTo(r[0][0], r[0][1]);
    for(let j=1;j<r.length;j++) g.lineTo(r[j][0], r[j][1]); g.closePath(); });
  g.fillStyle = col;
  /* ⚠️ nonzero＝帯どうしが重なっても穴が空かない（交点で白く抜けない） */
  g.fill();
  g.restore();
  if(svg){
    const rad = rot*Math.PI/180, c = size/2;
    const tp = p => {
      let X = p[0]*k*(S.run.wide/100), Y = p[1]*k*(S.run.tall/100);
      if(rot){ const dx=X-c, dy=Y-c; X = c + dx*Math.cos(rad) - dy*Math.sin(rad); Y = c + dx*Math.sin(rad) + dy*Math.cos(rad); }
      return [(x+X).toFixed(1), (y+Y).toFixed(1)];
    };
    const d = rings.map(r => 'M' + r.map(p => tp(p).join(' ')).join('L') + 'Z').join('');
    svg.push(`<path d="${d}" fill="${col}"/>`);
  }
}

/* ══ 盤 ══ */
function boardSize(){
  if(S.view === 'sheet'){ const n = Object.keys(BONE).length, cols = 9;
    return [ cols*200 + 60, Math.ceil(n/cols)*200 + 60 ]; }
  return [S.run.w, S.run.h];
}
let Z=1, PX=0, PY=0, rafId=0;
function layout(){
  const [W,H2] = boardSize(), dpr = Math.min(2, devicePixelRatio||1);
  cv.width = Math.round(W*dpr); cv.height = Math.round(H2*dpr);
  cv.style.width = W+'px'; cv.style.height = H2+'px';
  cx.setTransform(dpr,0,0,dpr,0,0); place2();
}
function place2(){ cv.style.transform = `translate(${PX}px,${PY}px) scale(${Z})`;
  $('zVal').textContent = Math.round(Z*100)+'%'; }
function fit(){
  const st = $('stage').getBoundingClientRect(), [W,H2] = boardSize();
  Z = Math.min((st.width-80)/W, (st.height-110)/H2);
  PX = (st.width - W*Z)/2; PY = (st.height - H2*Z)/2 + 14; place2();
}
function draw(){ if(rafId) return; rafId = requestAnimationFrame(()=>{ rafId=0; render(); }); }
function render(){ const [W,H2] = boardSize(); paint(cx, W, H2, null); meter(); }
function meter(){
  const chars = runChars();
  const miss = chars.filter(c => c.trim() && !boneOf(c));
  let rings = 0, pts = 0;
  chars.forEach((ch,i) => glyph(ch,i).forEach(r => { rings++; pts += r.length; }));
  const size = S.run.size/1000*S.run.w, B = runBox(size);
  const ox = S.run.x/100*S.run.w, oy = S.run.y/100*S.run.h;
  const over = [ Math.max(0, Math.round(-(ox+B.x0))), Math.max(0, Math.round(ox+B.x0+B.w - S.run.w)),
                 Math.max(0, Math.round(-(oy+B.y0))), Math.max(0, Math.round(oy+B.y0+B.h - S.run.h)) ];
  $('meter').textContent =
    `骨 ${Object.keys(BONE).length}字ぶん\n字 ${chars.length} ／ 帯 ${rings} ／ 点 ${pts}\n`
    + `出す ${S.out.long}px`
    + (miss.length ? `\n🔴 骨が無い字：${miss.join('')}（欧文の大文字・数字だけ）` : '')
    + ((over[0]+over[1]+over[2]+over[3]) ? `\n🔴 版面から出ている 左${over[0]} 右${over[1]} 上${over[2]} 下${over[3]} px` : '');
}
function stat(s){ $('stat').textContent = s; }

/* ══ つまみ ══ ⭐ 配線は1か所 */
const OUTID = { pW:'oW', taper:'oTaper', flow:'oFlow', sweep:'oSweep', vary:'oVary', trace:'oTrace', over:'oOver', dry:'oDry',
  wide:'oWide', tall:'oTall',
  warp:'oWarp', jit:'oJit', jg:'oJg', jr:'oJr', js:'oJs', jy:'oJy', seed:'oSeed',
  size:'oSize', adv:'oAdv', ang:'oAng', x:'oX', y:'oY', outLong:'oOut' };
function out(id){ const o=$(OUTID[id]); if(o) o.textContent = $(id).value; }
const PEN = { pW:'w', taper:'taper', flow:'flow', sweep:'sweep', vary:'vary', trace:'trace', over:'over', dry:'dry' };
Object.entries(PEN).forEach(([id,key]) => $(id).addEventListener('input', e => {
  S.pen[key] = +e.target.value; out(id); cache.clear(); draw(); }));
const HAND = { warp:'warp', jit:'jit', jg:'jg', jr:'jr', js:'js', jy:'jy', seed:'seed' };
Object.entries(HAND).forEach(([id,key]) => $(id).addEventListener('input', e => {
  S.hand[key] = +e.target.value; out(id); cache.clear(); draw(); }));
const RUN = { size:'size', adv:'adv', ang:'ang', x:'x', y:'y', wide:'wide', tall:'tall' };
Object.entries(RUN).forEach(([id,key]) => $(id).addEventListener('input', e => {
  S.run[key] = +e.target.value; out(id); draw(); }));
$('outLong').addEventListener('input', e => { S.out.long = +e.target.value; out('outLong'); meter(); });
$('tText').addEventListener('input', e => { S.text = e.target.value.toUpperCase(); draw(); });
$('col').addEventListener('input', e => { S.run.col = e.target.value; draw(); });
function segOn(id,v){ document.querySelectorAll('#'+id+' button').forEach(b=>b.classList.toggle('on', String(b.dataset.v)===String(v))); }
document.querySelectorAll('#segCap button').forEach(b => b.onclick = () => {
  S.pen.cap = +b.dataset.v; segOn('segCap', S.pen.cap); cache.clear(); draw(); });
document.querySelectorAll('#modes button').forEach(b => b.onclick = () => {
  S.view = b.dataset.v; segOn('modes', S.view); layout(); fit(); draw(); });
document.querySelectorAll('#segRatio button').forEach(b => b.onclick = () => {
  const [w,h] = b.dataset.v.split(',').map(Number);
  S.run.w = w; S.run.h = h; segOn('segRatio', b.dataset.v);
  if(S.view !== 'run'){ S.view='run'; segOn('modes','run'); }
  layout(); fit(); draw(); });
$('bShake').onclick = () => {
  S.hand.seed = 1 + (S.hand.seed % 99);
  $('seed').value = S.hand.seed; out('seed'); cache.clear(); draw();
  stat('種を送った — 走り方が変わる（規則はそのまま）');
};
/* ⭐ 収める＝つまみ自体を動かす（裏で別の値を使わない） */
$('bFit').onclick = () => {
  const R = S.run, pad = 0.05;
  const U = runBox(1000);                       /* 大きさ1000で走らせた外形 */
  const k = Math.min(R.w*(1-pad*2)/U.w, R.h*(1-pad*2)/U.h);
  R.size = Math.max(40, Math.min(900, Math.round(1000*k/R.w*1000)));
  const B = runBox(R.size/1000*R.w);
  R.x = Math.round(((R.w - B.w)/2 - B.x0)/R.w*100);
  R.y = Math.round(((R.h - B.h)/2 - B.y0)/R.h*100);
  ['size','x','y'].forEach(id => { $(id).value = S.run[{size:'size',x:'x',y:'y'}[id]]; out(id); });
  if(S.view !== 'run'){ S.view='run'; segOn('modes','run'); layout(); fit(); }
  draw();
  stat('版面に収めた — 大きさ ' + R.size + '‰（つまみもこの値になっている）');
};
$('bPhoto').onclick = () => $('fPhoto').click();
function takePhoto(f){ const img = new Image();
  img.onload = () => { photo = img; draw(); stat('写真を敷いた'); };
  img.src = URL.createObjectURL(f); }
$('fPhoto').onchange = e => { const f = e.target.files[0]; if(f) takePhoto(f); };
['dragenter','dragover'].forEach(t => addEventListener(t, e => { e.preventDefault(); document.body.classList.add('dragging'); }));
['dragleave','drop'].forEach(t => addEventListener(t, e => { e.preventDefault(); document.body.classList.remove('dragging'); }));
addEventListener('drop', e => { const f = e.dataTransfer && e.dataTransfer.files[0]; if(!f) return;
  if(/^image\//.test(f.type)) takePhoto(f); else if(/json$/i.test(f.name)) f.text().then(loadJSON); });

/* ══ 出す ══ ⚠️ 画面を吸わない＝出す大きさで組み直す */
function bake(long){
  const [W,H2] = boardSize(), k = long/Math.max(W,H2);
  const c = document.createElement('canvas');
  c.width = Math.round(W*k); c.height = Math.round(H2*k);
  paint(c.getContext('2d'), c.width, c.height, null);
  return c;
}
function dl(blob,name){ const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000); }
$('ePNG').onclick = () => { const c = bake(S.out.long);
  c.toBlob(b => { dl(b,'hon.png'); stat('PNG を出した（'+c.width+'×'+c.height+'）'); },'image/png'); };
$('eSVG').onclick = () => {
  const [W,H2] = boardSize();
  const g = document.createElement('canvas').getContext('2d');
  const body = paint(g, W, H2, { svg:true });
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H2}" viewBox="0 0 ${W} ${H2}">`
    + `<g id="hon">${body.join('')}</g></svg>`;
  dl(new Blob([svg],{type:'image/svg+xml'}),'hon.svg');
  stat('SVG を出した — 筆の形が path で入っている（⚠️ かすれは入らない）');
};
function saveJSON(){ dl(new Blob([JSON.stringify({ text:S.text, pen:S.pen, hand:S.hand, run:S.run, out:S.out },null,1)],
  {type:'application/json'}),'hon.json'); stat('控えを保存した（⚠️ 写真は入らない）'); }
function loadJSON(txt){ try{ const o=JSON.parse(txt);
  S.text = o.text || S.text;
  Object.assign(S.pen,o.pen||{}); Object.assign(S.hand,o.hand||{});
  Object.assign(S.run,o.run||{}); Object.assign(S.out,o.out||{});
  cache.clear(); syncAll(); layout(); fit(); draw(); stat('控えを読んだ');
}catch(err){ stat('🔴 控えが読めなかった：'+err.message); } }
$('eJSON').onclick = saveJSON;
$('iJSON').onclick = () => $('fJSON').click();
$('fJSON').onchange = e => { const f=e.target.files[0]; if(f) f.text().then(loadJSON); };

function syncAll(){
  Object.entries(PEN).forEach(([id,key]) => { $(id).value = S.pen[key]; out(id); });
  Object.entries(HAND).forEach(([id,key]) => { $(id).value = S.hand[key]; out(id); });
  Object.entries(RUN).forEach(([id,key]) => { $(id).value = S.run[key]; out(id); });
  $('outLong').value = S.out.long; out('outLong');
  $('tText').value = S.text; $('col').value = S.run.col;
  segOn('segCap', S.pen.cap); segOn('modes', S.view); segOn('segRatio', S.run.w+','+S.run.h);
}

/* ══ 盤を触る・キー ══ */
let drag = null;
$('stage').addEventListener('pointerdown', e => { drag={x:e.clientX-PX,y:e.clientY-PY};
  $('stage').classList.add('panning'); });
addEventListener('pointermove', e => { if(!drag) return; PX=e.clientX-drag.x; PY=e.clientY-drag.y; place2(); });
addEventListener('pointerup', () => { drag=null; $('stage').classList.remove('panning'); });
$('stage').addEventListener('wheel', e => { e.preventDefault();
  const r = cv.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  const nz = Math.max(0.06, Math.min(8, Z*(e.deltaY<0?1.09:1/1.09)));
  PX -= mx*(nz/Z-1); PY -= my*(nz/Z-1); Z=nz; place2(); }, { passive:false });
$('zIn').onclick=()=>{Z=Math.min(8,Z*1.2);place2();};
$('zOut').onclick=()=>{Z=Math.max(0.06,Z/1.2);place2();};
$('zFit').onclick=fit;
addEventListener('resize', fit);
addEventListener('keydown', e => {
  const t=(e.target.tagName||'').toUpperCase(); if(t==='INPUT'||t==='TEXTAREA') return;
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){ e.preventDefault(); saveJSON(); return; }
  if(e.key==='0') fit();
  else if(e.key.toLowerCase()==='r') $('bShake').click();
  else if(e.key==='1'){ S.view='run'; segOn('modes','run'); layout(); fit(); draw(); }
  else if(e.key==='2'){ S.view='sheet'; segOn('modes','sheet'); layout(); fit(); draw(); }
});

syncAll(); layout();
/* ⚠️ 立ち上げで版面からはみ出したまま見せない＝1回だけ収めてから出す */
$('bFit').click();
fit(); draw();
stat('READY — ②③のつまみが【全部の字に同じ規則で】掛かる');
</script>
</body>
</html>
