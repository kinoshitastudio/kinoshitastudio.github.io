<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>baka</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#1e1e1e;color:#d4d4d4;
  font-family:'Courier New',monospace;font-size:13px;overflow:hidden}
body::before{content:'';position:fixed;inset:0;
  background-image:radial-gradient(circle,#2e2e2e 1.2px,transparent 1.2px);
  background-size:18px 18px;pointer-events:none;z-index:0}
#vsc{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh}
#tabs{display:flex;align-items:stretch;height:35px;background:#252526;
  border-bottom:1px solid #1e1e1e;flex-shrink:0}
.tab{display:flex;align-items:center;gap:8px;padding:0 16px;font-size:12px;
  color:#969696;border-right:1px solid #1e1e1e;cursor:default;white-space:nowrap}
.tab.active{background:#1e1e1e;color:#ccc;border-top:2px solid #FF6600}
.tab-dot{width:6px;height:6px;border-radius:50%;background:#FF6600}
#crumb{height:22px;background:#1e1e1e;padding:0 14px;display:flex;align-items:center;
  font-size:11px;color:#666;border-bottom:1px solid #252526;flex-shrink:0}
#crumb span{color:#ccc}
#main{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;
  padding:12px 20px 0;overflow:hidden}
#transport{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-shrink:0}
#title-lbl{font-family:'Press Start 2P',monospace;font-size:13px;color:#FF6600;
  letter-spacing:1px;margin-right:8px}
.btn{background:none;border:1px solid #3c3c3c;color:#9d9d9d;
  font-family:'Courier New',monospace;font-size:11px;padding:3px 10px;
  cursor:pointer;letter-spacing:1px}
.btn:hover{border-color:#FF6600;color:#FF6600}
.btn.on{border-color:#FF6600;color:#FF6600;background:#1f0d00}
#bpm-val{color:#FF6600;font-size:12px;min-width:28px;text-align:center}
.bpm-lbl{color:#555;font-size:11px}
#midi-lbl{color:#444;font-size:11px;margin-left:8px}
#step-header{display:flex;align-items:center;padding-left:74px;margin-bottom:2px;flex-shrink:0}
.step-num{width:38px;text-align:center;font-size:10px;color:#444;flex-shrink:0}
.step-num.beat{color:#666}
.step-num.ph{color:#FF6600}
#tracks{display:flex;flex-direction:column;gap:4px}
.track{display:flex;align-items:center}
.track-lbl{width:68px;text-align:right;padding-right:8px;font-size:10px;color:#555;
  flex-shrink:0;letter-spacing:1px}
.track-lbl.cur{color:#FF8C00}
.cells{display:flex;gap:0}
.cell{width:38px;height:30px;display:flex;align-items:center;justify-content:center;
  font-size:13px;cursor:pointer;color:#2a2a2a;border:1px solid #252525;
  font-family:'Courier New',monospace;user-select:none;flex-shrink:0}
.cell:nth-child(4n+1){border-left-color:#333}
.cell.empty{color:#2e2e2e}
.cell.on{color:#FF6600;border-color:#3a1800;background:#140a00}
.cell.ph{background:#1c1c1c}
.cell.ph.on{background:#1f0c00}
.cell.cur{outline:1px solid #cccccc;outline-offset:-1px;z-index:2}
.cell.flash{background:#FF6600!important;color:#1e1e1e!important}
#palette{margin-top:12px;display:flex;align-items:center;flex-shrink:0}
.palette-lbl{width:68px;text-align:right;padding-right:8px;font-size:10px;color:#444}
.note-key{width:38px;height:20px;display:flex;align-items:center;justify-content:center;
  font-size:9px;color:#444;border-top:1px solid #252525}
.note-key span{color:#2a5c2a;font-size:8px;margin-left:1px}
#hint{margin-top:10px;flex-shrink:0;color:#3a3a3a;font-size:10px;line-height:1.9}
#hint b{color:#555}
#statusbar{position:fixed;bottom:0;left:0;right:0;height:22px;background:#FF6600;
  display:flex;align-items:center;gap:20px;padding:0 16px;font-size:11px;
  color:#1e1e1e;z-index:10}
#sb-step{font-weight:bold}
</style>
</head>
<body>
<div id="vsc">
  <div id="tabs">
    <div class="tab active"><span class="tab-dot"></span><span>baka.seq</span></div>
    <div class="tab"><span>settings.json</span></div>
  </div>
  <div id="crumb">lifehack &gt; <span>baka.seq</span></div>
  <div id="main">
    <div id="transport">
      <span id="title-lbl">baka</span>
      <button class="btn" id="btnPlay">▶ play</button>
      <button class="btn" id="btnStop">■ stop</button>
      <span class="bpm-lbl">♩</span>
      <button class="btn" id="btnBpmDown">−</button>
      <span id="bpm-val">120</span>
      <button class="btn" id="btnBpmUp">+</button>
      <span id="midi-lbl">MIDI: ---</span>
    </div>
    <div id="step-header"></div>
    <div id="tracks"></div>
    <div id="palette"></div>
    <div id="hint">
      <b>[space]</b> play/stop &nbsp; <b>[1–8]</b> note/hit &nbsp;
      <b>[0/del]</b> clear &nbsp; <b>[←→↑↓]</b> move &nbsp; <b>[+/−]</b> bpm
    </div>
  </div>
  <div id="statusbar">
    <span id="sb-step">step: —</span>
    <span id="sb-note">—</span>
    <span id="sb-midi" style="margin-left:auto">MIDI: ---</span>
  </div>
</div>
<script>
'use strict';
const STEPS=16,TRACKS=[
  {id:'kick',lbl:'KICK'},{id:'hat',lbl:'HAT'},{id:'snare',lbl:'SNARE'},
  {id:'clap',lbl:'CLAP'},{id:'pad',lbl:'PAD'}];
const N=TRACKS.length;
const NOTE_NAMES=['ド','レ','ミ','ファ','ソ','ラ','シ','ド↑'];
const MIDI_NOTES=[60,62,64,65,67,69,71,72];
let grid=Array.from({length:N},()=>new Array(STEPS).fill(0));
let bpm=120,playing=false,curStep=-1,cRow=0,cCol=0;
let intervalId=null,audioCtx=null,midiOut=null;
function ctx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}
function playKick(v){const c=ctx(),t=c.currentTime,o=c.createOscillator(),g=c.createGain();
  o.connect(g);g.connect(c.destination);o.frequency.setValueAtTime(150,t);
  o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(v,t);
  g.gain.exponentialRampToValueAtTime(.001,t+.35);o.start(t);o.stop(t+.4);}
function playHat(v){const c=ctx(),t=c.currentTime,b=c.createBuffer(1,c.sampleRate*.15,c.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;
  const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=7000;
  const g=c.createGain();s.connect(hp);hp.connect(g);g.connect(c.destination);
  g.gain.setValueAtTime(v*.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.07);s.start(t);s.stop(t+.12);}
function playSnare(v){const c=ctx(),t=c.currentTime,o=c.createOscillator(),og=c.createGain();
  o.frequency.value=180;o.connect(og);og.connect(c.destination);og.gain.setValueAtTime(v*.4,t);
  og.gain.exponentialRampToValueAtTime(.001,t+.1);o.start(t);o.stop(t+.12);
  const b=c.createBuffer(1,c.sampleRate*.15,c.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;
  const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2500;
  const g=c.createGain();s.connect(bp);bp.connect(g);g.connect(c.destination);
  g.gain.setValueAtTime(v*.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);s.start(t);s.stop(t+.18);}
function playClap(v){const c=ctx(),t=c.currentTime;[0,.01,.02].forEach(off=>{
  const b=c.createBuffer(1,c.sampleRate*.05,c.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;
  const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=1500;
  const g=c.createGain();s.connect(hp);hp.connect(g);g.connect(c.destination);
  g.gain.setValueAtTime(v*.35,t+off);g.gain.exponentialRampToValueAtTime(.001,t+off+.1);
  s.start(t+off);s.stop(t+off+.12);});}
function playPad(mn,v){const c=ctx(),t=c.currentTime,freq=440*Math.pow(2,(mn-69)/12);
  const o1=c.createOscillator(),o2=c.createOscillator(),g=c.createGain();
  const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1600;
  o1.type='sine';o1.frequency.value=freq;o2.type='sawtooth';o2.frequency.value=freq;
  const g2=c.createGain();g2.gain.value=.12;o1.connect(g);o2.connect(g2);g2.connect(lp);lp.connect(g);g.connect(c.destination);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v*.35,t+.05);
  g.gain.setValueAtTime(v*.35,t+.25);g.gain.exponentialRampToValueAtTime(.001,t+.8);
  o1.start(t);o2.start(t);o1.stop(t+.9);o2.stop(t+.9);}
function vel(n){return .35+(n-1)*.09;}
function fire(ti,n){
  if(midiOut){const v=Math.round(vel(n)*127),t=TRACKS[ti];
    if(ti<4){midiOut.send([0x99,[36,42,38,39][ti],v]);setTimeout(()=>midiOut.send([0x89,[36,42,38,39][ti],0]),80);}
    else{const mn=MIDI_NOTES[n-1]??60;midiOut.send([0x90,mn,v]);setTimeout(()=>midiOut.send([0x80,mn,0]),500);}}
  const v2=vel(n);
  if(ti===0)playKick(v2);else if(ti===1)playHat(v2);else if(ti===2)playSnare(v2);
  else if(ti===3)playClap(v2);else playPad(MIDI_NOTES[n-1]??60,v2);}
if(navigator.requestMIDIAccess)navigator.requestMIDIAccess().then(a=>{
  const o=[...a.outputs.values()];if(o.length){midiOut=o[0];
    document.getElementById('midi-lbl').textContent='MIDI: '+o[0].name;
    document.getElementById('sb-midi').textContent='MIDI: '+o[0].name;}}).catch(()=>{});
// build UI
const hdr=document.getElementById('step-header');
for(let s=0;s<STEPS;s++){const d=document.createElement('div');
  d.className='step-num'+(s%4===0?' beat':'');d.textContent=String(s+1).padStart(2,' ');d.id='sh'+s;hdr.appendChild(d);}
const trWrap=document.getElementById('tracks');
TRACKS.forEach((t,ti)=>{const row=document.createElement('div');row.className='track';
  const lbl=document.createElement('div');lbl.className='track-lbl';lbl.textContent=t.lbl;lbl.id='lbl'+ti;row.appendChild(lbl);
  const cells=document.createElement('div');cells.className='cells';
  for(let s=0;s<STEPS;s++){const c=document.createElement('div');c.className='cell empty';c.textContent='·';
    c.id=`c${ti}_${s}`;c.addEventListener('click',()=>{cRow=ti;cCol=s;renderAll();});cells.appendChild(c);}
  row.appendChild(cells);trWrap.appendChild(row);});
const pal=document.getElementById('palette');
const pl=document.createElement('div');pl.className='palette-lbl';pl.textContent='1-8';pal.appendChild(pl);
NOTE_NAMES.forEach((n,i)=>{const d=document.createElement('div');d.className='note-key';
  d.innerHTML=`${i+1}<span>${n}</span>`;pal.appendChild(d);});
function renderCell(ti,s){const el=document.getElementById(`c${ti}_${s}`);if(!el)return;
  const v=grid[ti][s],ph=s===curStep,cur=ti===cRow&&s===cCol;
  el.className='cell'+(v?' on':' empty')+(ph?' ph':'')+(cur?' cur':'');el.textContent=v?String(v):'·';}
function renderAll(){for(let t=0;t<N;t++)for(let s=0;s<STEPS;s++)renderCell(t,s);
  for(let s=0;s<STEPS;s++){const h=document.getElementById('sh'+s);
    if(h)h.className='step-num'+(s%4===0?' beat':'')+(s===curStep?' ph':'');}
  TRACKS.forEach((_,ti)=>{const l=document.getElementById('lbl'+ti);
    if(l)l.className='track-lbl'+(ti===cRow?' cur':'');});}
function stepMs(){return 60000/bpm/4;}
function tick(){curStep=(curStep+1)%STEPS;
  for(let t=0;t<N;t++){const v=grid[t][curStep];if(v){fire(t,v);
    const el=document.getElementById(`c${t}_${curStep}`);
    if(el){el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),80);}}}
  renderAll();document.getElementById('sb-step').textContent=`step: ${curStep+1}/${STEPS}`;}
function startPlay(){if(playing)return;ctx();playing=true;document.getElementById('btnPlay').classList.add('on');
  intervalId=setInterval(tick,stepMs());}
function stopPlay(){if(!playing)return;playing=false;clearInterval(intervalId);intervalId=null;curStep=-1;
  document.getElementById('btnPlay').classList.remove('on');renderAll();}
function setBpm(v){bpm=Math.max(40,Math.min(300,v));document.getElementById('bpm-val').textContent=bpm;
  if(playing){clearInterval(intervalId);intervalId=setInterval(tick,stepMs());}}
document.addEventListener('keydown',e=>{
  const tag=e.target.tagName;if(tag==='INPUT'||tag==='BUTTON')return;
  if(e.code==='Space'){e.preventDefault();playing?stopPlay():startPlay();return;}
  if(e.key==='ArrowRight'){cCol=(cCol+1)%STEPS;renderAll();return;}
  if(e.key==='ArrowLeft'){cCol=(cCol-1+STEPS)%STEPS;renderAll();return;}
  if(e.key==='ArrowDown'){cRow=(cRow+1)%N;renderAll();return;}
  if(e.key==='ArrowUp'){cRow=(cRow-1+N)%N;renderAll();return;}
  if(e.key>='1'&&e.key<='8'){grid[cRow][cCol]=+e.key;if(audioCtx)fire(cRow,+e.key);
    cCol=(cCol+1)%STEPS;renderAll();return;}
  if(e.key==='0'||e.key==='Delete'||e.key==='Backspace'){e.preventDefault();grid[cRow][cCol]=0;renderAll();return;}
  if(e.key==='+'||e.key==='='){setBpm(bpm+4);return;}
  if(e.key==='-'){setBpm(bpm-4);return;}});
document.getElementById('btnPlay').addEventListener('click',()=>{ctx();startPlay();});
document.getElementById('btnStop').addEventListener('click',stopPlay);
document.getElementById('btnBpmUp').addEventListener('click',()=>setBpm(bpm+4));
document.getElementById('btnBpmDown').addEventListener('click',()=>setBpm(bpm-4));
renderAll();
</script>
</body>
</html>
