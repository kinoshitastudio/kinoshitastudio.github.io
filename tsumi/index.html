<!-- 2026-10-29 木下「これ作れる道具作りたい」（青地に白い立体文字・手で引いた黒い輪郭・1字だけ列から逸れる）
     積 TSUMI＝太いゴシックを【積む】（押し出して厚みを出す）・【揺らす】（線を手の震えでゆがめる）・【逸らす】（1字だけ傾けて沈める）。
     絵を置くと、線の内側を面の色・外側を地の色に塗り分けて、字と同じ紙の上に乗せる。 -->

<style>
:root{--bg:#1b1a19;--panel:#24221f;--line:#3a3733;--tx:#e9e4da;--sub:#9a9388;--ac:#3a7cd6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hiragino Kaku Gothic ProN",sans-serif;display:flex;height:100vh;overflow:hidden}
#panel{width:300px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:16px 16px 24px;overflow:auto}
h1{font-size:15px;margin:0 0 2px;letter-spacing:.1em}h1 b{color:var(--ac)}

input[type=range]{width:100%;accent-color:var(--ac)}
textarea,select,input[type=color],input[type=text]{width:100%;background:#151413;color:var(--tx);border:1px solid var(--line);border-radius:4px;font-size:14px;padding:6px}

.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:6px}.presets button{padding:7px 2px;font-size:12px}.presets button.on{background:var(--tx);color:#1b1a19}
.row{display:flex;gap:6px;margin-top:8px}

#stage{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
canvas{max-width:100%;max-height:100%;box-shadow:0 10px 40px rgba(0,0,0,.45);background:repeating-conic-gradient(#2a2826 0 25%,#222 0 50%) 0 0/20px 20px}
@media(max-width:760px){body{flex-direction:column;height:auto;overflow:auto}#panel{width:auto;border-right:0;border-bottom:1px solid var(--line)}#stage{order:-1;position:sticky;top:0;z-index:2;background:var(--bg);padding:10px;border-bottom:1px solid var(--line)}#stage canvas{max-height:42vh}}
@media (max-width:760px), (pointer:coarse) and (max-width:1024px){
  input:not([type=range]):not([type=color]):not([type=checkbox]):not([type=file]), select, textarea{ font-size:16px !important; }
  button,input,select,textarea,canvas{ touch-action:manipulation; }
}
</style></head><body>
<div id="panel">
  <div style="font-size:11px;margin-bottom:10px"><a href="/interaction-design.html" style="color:inherit;opacity:.6;text-decoration:none">← 木下スタジオ</a></div>
  <h1><b>積</b> TSUMI</h1>
  <p class="lead">太いゴシックを積み木にする。厚みを押し出し、線を手で引いたように揺らし、1字だけ列から逸らす。</p>
  <div class="grp"><div class="t">型（打った字はそのままで つまみが替わる）</div><div class="presets" id="presets"></div></div>
  <div class="grp"><div class="t">字</div>
    <textarea id="txt">逸れものの
積み木</textarea>
    <label>書体<select id="font" style="grid-column:2/4">
      <option value='"Hiragino Sans","Hiragino Kaku Gothic ProN"|900|600'>ヒラギノ角ゴ（Mac）</option>
      <option value='"Zen Kaku Gothic New"|900|500'>Zen 角ゴシック</option>
      <option value='"M PLUS 1p"|900|500'>M PLUS 1p</option>

      <option value='"Dela Gothic One"|400|400'>Dela Gothic One</option>
    </select></label>
    <label>細くする字<input type="text" id="thin" value="" style="grid-column:2/4"></label>
    <label>大きさ<input type="range" id="size" min="40" max="320" value="220"><span class="v"></span></label>
    <label>字間<input type="range" id="track" min="-30" max="60" value="8"><span class="v"></span></label>
    <label>行間<input type="range" id="lead" min="80" max="200" value="143"><span class="v"></span></label>
    <label>左右<input type="range" id="tx" min="0" max="100" value="4"><span class="v"></span></label>
    <label>上下<input type="range" id="ty" min="0" max="100" value="4"><span class="v"></span></label>
    <label>傾きのぶれ<input type="range" id="jit" min="0" max="15" value="3"><span class="v"></span></label>
    <label>上下のぶれ<input type="range" id="jy" min="0" max="20" value="4"><span class="v"></span></label>
  </div>
  <div class="grp"><div class="t">逸らす（1字だけ列から外す）</div>
    <label>何字目<input type="range" id="slip" min="0" max="40" value="1"><span class="v"></span></label>
    <div id="slipch" style="font-size:11px;color:var(--sub);margin:-2px 0 4px 86px"></div>
    <label>傾き<input type="range" id="sang" min="-45" max="45" value="22"><span class="v"></span></label>

  </div>

    <label>厚み<input type="range" id="depth" min="0" max="40" value="9"><span class="v"></span></label>

  </div>

    <label>太さ<input type="range" id="lw" min="1" max="14" value="4"><span class="v"></span></label>
    <label>手の揺れ<input type="range" id="wob" min="0" max="80" value="30"><span class="v"></span></label>
    <label>揺れの幅<input type="range" id="wsc" min="20" max="240" value="90"><span class="v"></span></label>
  </div>
  <div class="grp"><div class="t">添え字（名前など）</div>
    <textarea id="sub" style="height:40px">木下スタジオ</textarea>
    <label>大きさ<input type="range" id="ssz" min="0" max="200" value="64"><span class="v"></span></label>
    <label>左右<input type="range" id="sx" min="0" max="100" value="4"><span class="v"></span></label>
    <label>上下<input type="range" id="sy" min="0" max="100" value="86"><span class="v"></span></label>
  </div>
  <div class="grp"><div class="t">絵を置く（白地に黒い線の絵）</div>
    <div class="row" style="margin-top:0"><button id="pick">絵を選ぶ</button><button id="unpick">外す</button></div>
    <input type="file" id="pfile" accept="image/*" hidden>
    <label>大きさ<input type="range" id="psz" min="10" max="120" value="65"><span class="v"></span></label>
    <label>左右<input type="range" id="px" min="0" max="100" value="99"><span class="v"></span></label>
    <label>上下<input type="range" id="py" min="0" max="100" value="100"><span class="v"></span></label>
    <label>線の濃さ<input type="range" id="pth" min="40" max="220" value="120"><span class="v"></span></label>
  </div>
  <div class="grp"><div class="t">色・紙</div>
    <label>地<input type="color" id="bg" value="#3a7cd6" style="grid-column:2/4;height:30px;padding:2px"></label>
    <label>面<input type="color" id="face" value="#ffffff" style="grid-column:2/4;height:30px;padding:2px"></label>
    <label>線<input type="color" id="ink" value="#141414" style="grid-column:2/4;height:30px;padding:2px"></label>
    <label>地なし<input type="checkbox" id="clear"><span></span></label>
    <label>比率<select id="ratio" style="grid-column:2/4"><option>16:9</option><option>1:1</option><option>3:4</option><option>4:5</option></select></label>
    <label>種<input type="range" id="seed" min="1" max="999" value="3"><span class="v"></span></label>
  </div>
  <div class="row"><button id="re">揺れを振り直す</button><button class="p" id="png">PNGで保存</button></div>
  <div class="row"><button id="jsave">設定を保存</button><button id="jload">設定を読む</button></div>
  <input type="file" id="jfile" accept=".json,application/json" hidden>
</div>
<div id="stage"><canvas id="cv"></canvas></div>
<script>
const $=id=>document.getElementById(id);
const K=['size','track','lead','tx','ty','jit','jy','slip','sang','sdrop','snext','depth','dir','lw','wob','wsc','ssz','sx','sy','psz','px','py','pth','seed'];
const RATIO={'16:9':[1920,1080],'1:1':[1600,1600],'3:4':[1200,1600],'4:5':[1440,1800]};
// 動かしている間は半分の画素（Q=0.5）で描き、離したら原寸。大きさに比例する値は全部 Q を掛ける
let Q=1,W=1920,H=1080; const cv=$('cv'), ctx=cv.getContext('2d');
function size(){const [w,h]=RATIO[$('ratio').value]; W=Math.round(w*Q); H=Math.round(h*Q); cv.width=W; cv.height=H}
const v=id=>+$(id).value;
let rnd; function seedR(s){let a=s>>>0||1;rnd=()=>{a=(a*1664525+1013904223)>>>0;return a/4294967296}}
// iPhone の canvas メモリ上限対策＝名前ごとに1枚を使い回す
const POOL={}; function mk(name){let c=POOL[name]; if(!c)c=POOL[name]=document.createElement('canvas'); if(c.width!==W||c.height!==H){c.width=W;c.height=H}
  const g=c.getContext('2d',{willReadFrequently:true}); g.setTransform(1,0,0,1,0,0); g.globalCompositeOperation='source-over'; g.globalAlpha=1; g.clearRect(0,0,W,H); return c}

// ── 字を置く：1字ずつ傾け・上下にぶらし、「逸らす」字だけ大きく傾けて沈める
function chars(){return [...$('txt').value].filter(c=>c!=='\n')}
function layout(c){
  const g=c.getContext('2d'); const [fam,wt,wl]=$('font').value.split('|'); const sz=v('size')*Q;
  const thin=new Set([...$('thin').value]); g.fillStyle='#fff'; g.textBaseline='middle'; g.textAlign='center';
  const lines=$('txt').value.split('\n'); let n=0; const slip=v('slip');
  lines.forEach((l,i)=>{let x=v('tx')/100*W, y=v('ty')/100*H+sz/2+i*v('lead')/100*sz;
    for(const ch of l){n++;
      let rot=(rnd()-.5)*2*v('jit'), dy=(rnd()-.5)*2*v('jy')/100*sz;
      if(n===slip){rot+=v('sang');dy+=v('sdrop')/100*sz}
      if(n===slip+1&&slip>0){const k=v('snext')/100;rot+=v('sang')*k*0.45;dy+=v('sdrop')/100*sz*k*0.45}
      g.font=`${thin.has(ch)?wl:wt} ${sz}px ${fam}`; const w=g.measureText(ch).width;
      g.save(); g.translate(x+w/2,y+dy); g.rotate(rot*Math.PI/180); g.fillText(ch,0,0); g.restore();
      x+=w+v('track')/100*sz}});
}
// ── 線の太さぶんの縁＝A かつ「A を削った形」でない所（四角い窓で削る・累積和で O(N)）。画面の端は窓を縮めて数える（外を0と見ると、膨らませたときに端が全部埋まる）
function erode(A,r){const t=new Uint8Array(W*H), o=new Uint8Array(W*H), S=new Int32Array(Math.max(W,H)+1), k=2*r+1;
  for(let y=0;y<H;y++){S[0]=0;for(let x=0;x<W;x++)S[x+1]=S[x]+A[y*W+x];
    for(let x=0;x<W;x++){const a=Math.max(0,x-r),b=Math.min(W,x+r+1);t[y*W+x]=(S[b]-S[a]===b-a)?1:0}}
  for(let x=0;x<W;x++){S[0]=0;for(let y=0;y<H;y++)S[y+1]=S[y]+t[y*W+x];
    for(let y=0;y<H;y++){const a=Math.max(0,y-r),b=Math.min(H,y+r+1);o[y*W+x]=(S[b]-S[a]===b-a)?1:0}}
  return o}
function dilate(A,r){const inv=new Uint8Array(A.length);for(let i=0;i<A.length;i++)inv[i]=1-A[i];const e=erode(inv,r);for(let i=0;i<e.length;i++)e[i]=1-e[i];return e}
// ── 手の揺れ：粗い格子の乱数を滑らかにつないだずれで、面と縁を【同じずれ】でゆがめる
function wobField(){const sc=Math.max(8,v('wsc')*Q), gw=Math.ceil(W/sc)+2, gh=Math.ceil(H/sc)+2, fx=new Float32Array(gw*gh), fy=new Float32Array(gw*gh);
  for(let i=0;i<fx.length;i++){fx[i]=rnd()*2-1;fy[i]=rnd()*2-1}
  const amp=v('wob')/10*Q;
  return (A)=>{if(amp<=0)return A; const o=new Uint8Array(W*H);
    for(let y=0;y<H;y++){const gy=y/sc,iy=gy|0,ty=gy-iy; const sy=ty*ty*(3-2*ty);
      for(let x=0;x<W;x++){const gx=x/sc,ix=gx|0,tx=gx-ix; const sx=tx*tx*(3-2*tx); const i0=iy*gw+ix;
        const dx=((fx[i0]*(1-sx)+fx[i0+1]*sx)*(1-sy)+(fx[i0+gw]*(1-sx)+fx[i0+gw+1]*sx)*sy)*amp;
        const dy=((fy[i0]*(1-sx)+fy[i0+1]*sx)*(1-sy)+(fy[i0+gw]*(1-sx)+fy[i0+gw+1]*sx)*sy)*amp;
        const X=Math.round(x+dx),Y=Math.round(y+dy); o[y*W+x]=(X>=0&&Y>=0&&X<W&&Y<H)?A[Y*W+X]:0}}
    return o}}
const alpha=c=>{const d=c.getContext('2d').getImageData(0,0,W,H).data, A=new Uint8Array(W*H);for(let i=0;i<A.length;i++)A[i]=d[i*4+3]>127?1:0;return A};
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];

// ── 絵：線を取り出し、外につながる白を「地」、閉じた白を「面」に塗り分ける（1回だけ解析して控える）
let PIC=null; // {w,h,line:Uint8Array,inside:Uint8Array}
function analyse(img){const s=Math.min(1,1600/Math.max(img.width,img.height)); const w=Math.round(img.width*s),h=Math.round(img.height*s);
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(img,0,0,w,h);
  const d=g.getImageData(0,0,w,h).data, th=v('pth'), line=new Uint8Array(w*h); for(let i=0;i<w*h;i++)line[i]=(d[i*4]*.3+d[i*4+1]*.59+d[i*4+2]*.11)<th?1:0;
  const W0=W,H0=H; W=w;H=h; const r=Math.max(2,Math.round(Math.max(w,h)/240));
  // 画像の縁に入っている細い枠（生成画像によくある）は線と見なさない＝外側の塗りが縁から始められるように
  const m=r*3; for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(x<m||y<m||x>=w-m||y>=h-m)line[y*w+x]=0;
  const closed=dilate(line,r);
  const out=new Uint8Array(w*h), st=[]; const push=i=>{if(!out[i]&&!closed[i]){out[i]=1;st.push(i)}};
  for(let x=0;x<w;x++){push(x);push((h-1)*w+x)} for(let y=0;y<h;y++){push(y*w);push(y*w+w-1)}
  while(st.length){const i=st.pop(),x=i%w,y=(i/w)|0; if(x>0)push(i-1); if(x<w-1)push(i+1); if(y>0)push(i-w); if(y<h-1)push(i+w)}
  const outer=dilate(out,r); const inside=new Uint8Array(w*h); for(let i=0;i<w*h;i++)inside[i]=(!outer[i]||line[i])?1:0;
  W=W0;H=H0; PIC={w,h,line,inside,img}}
function drawPic(g){if(!PIC)return; const [fr,fg,fb]=hex($('face').value),[lr,lg,lb]=hex($('ink').value);
  const c=document.createElement('canvas');c.width=PIC.w;c.height=PIC.h;const pg=c.getContext('2d'); const id=pg.createImageData(PIC.w,PIC.h),d=id.data;
  for(let i=0;i<PIC.w*PIC.h;i++){if(PIC.line[i]){d[i*4]=lr;d[i*4+1]=lg;d[i*4+2]=lb;d[i*4+3]=255}else if(PIC.inside[i]){d[i*4]=fr;d[i*4+1]=fg;d[i*4+2]=fb;d[i*4+3]=255}}
  pg.putImageData(id,0,0); const h=v('psz')/100*H, w=h*PIC.w/PIC.h; g.drawImage(c,(W-w)*v('px')/100,(H-h)*v('py')/100,w,h)}

function render(){
  size(); seedR(v('seed')); K.forEach(k=>{const s=$(k).parentNode.querySelector('.v');if(s)s.textContent=$(k).value});
  const cs=chars(); $('slip').max=cs.length; $('slipch').textContent=v('slip')>0?`「${cs[v('slip')-1]||''}」を逸らす`:'逸らさない';
  const M=mk('m'); layout(M);
  const U=mk('u'), ug=U.getContext('2d'); const th=v('dir')*Math.PI/180, dep=Math.round(v('depth')*Q);
  for(let k=dep;k>=1;k--)ug.drawImage(M,Math.cos(th)*k,Math.sin(th)*k); ug.drawImage(M,0,0);
  const wob=wobField(); const Mw=wob(alpha(M)), Uw=wob(alpha(U)); const r=Math.max(1,Math.round(v('lw')*Q*0.8));
  const eU=erode(Uw,r), eM=erode(Mw,r);
  const id=ctx.createImageData(W,H), d=id.data, clear=$('clear').checked, [br,bg,bb]=hex($('bg').value),[fr,fg,fb]=hex($('face').value),[lr,lg,lb]=hex($('ink').value);
  for(let i=0;i<W*H;i++){const p=i*4; let c=null,a=255;
    if(Uw[i]&&(!eU[i]||(Mw[i]&&!eM[i])))c=[lr,lg,lb]; else if(Uw[i])c=[fr,fg,fb]; else if(!clear)c=[br,bg,bb]; else a=0;
    if(c){d[p]=c[0];d[p+1]=c[1];d[p+2]=c[2]} d[p+3]=a}
  ctx.putImageData(id,0,0);
  drawPic(ctx);
  const st=$('sub').value; if(st&&v('ssz')>0){const [fam,wt]=$('font').value.split('|'); const sz=v('ssz')*Q; ctx.font=`${wt} ${sz}px ${fam}`; ctx.fillStyle=$('ink').value; ctx.textBaseline='top'; ctx.textAlign='left';
    st.split('\n').forEach((l,i)=>ctx.fillText(l,v('sx')/100*W,v('sy')/100*H-sz+i*sz*1.2))}
}
async function go(){const [fam,wt,wl]=$('font').value.split('|'); const t=$('txt').value+$('sub').value;
  try{await Promise.all([document.fonts.load(`${wt} 100px ${fam}`,t),document.fonts.load(`${wl} 100px ${fam}`,t)])}catch(e){} render()}
let raf=0,wantQ=1; const later=(q=1)=>{wantQ=q;if(raf)return;raf=requestAnimationFrame(()=>{raf=0;Q=wantQ;go()})};
document.querySelectorAll('#panel input,#panel select,#panel textarea').forEach(e=>{if(e.type==='file')return;
  if(e.type==='range'){e.addEventListener('input',()=>later(0.5));e.addEventListener('change',()=>later(1))} else e.addEventListener('input',()=>later(1))});
$('pth').addEventListener('change',()=>{if(PIC){analyse(PIC.img);later(1)}});
$('re').onclick=()=>{$('seed').value=1+Math.floor(Math.random()*998);later(1)};
$('pick').onclick=()=>$('pfile').click(); $('unpick').onclick=()=>{PIC=null;later(1)};
$('pfile').onchange=e=>{const f=e.target.files[0];if(!f)return;const img=new Image();img.onload=()=>{analyse(img);later(1)};img.src=URL.createObjectURL(f);e.target.value=''};
function dl(blob,name){const a=document.createElement('a');a.download=name;a.href=URL.createObjectURL(blob);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
$('png').onclick=async()=>{Q=1;await go();cv.toBlob(b=>dl(b,'tsumi_'+Date.now()+'.png'))};
// 設定：つまみの値をそのまま書き出し、読むときはつまみに戻してから描き直す（絵は入れない）
const SET=[...K,'txt','font','thin','sub','bg','face','ink','clear','ratio'];
function settings(){const o={tool:'tsumi',v:1};SET.forEach(k=>{const e=$(k);o[k]=e.type==='checkbox'?e.checked:e.value});return o}
function applySettings(o){SET.forEach(k=>{if(!(k in o))return;const e=$(k);if(e.type==='checkbox')e.checked=!!o[k];else e.value=o[k]});later(1)}
$('jsave').onclick=()=>dl(new Blob([JSON.stringify(settings(),null,1)],{type:'application/json'}),'tsumi_'+Date.now()+'.json');
$('jload').onclick=()=>$('jfile').click();
$('jfile').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{applySettings(JSON.parse(t))}catch(err){alert('読めない設定です')}});e.target.value=''};
// 型：既定の上に差分だけ重ねる（字は替えない）
let DEF=null;
const PRESETS=[
  ['青い表紙',{}],
  ['黄色',{bg:'#f2c230',face:'#ffffff',ink:'#141414'}],
  ['黒地',{bg:'#141414',face:'#f2efe8',ink:'#141414',depth:12}],
  ['厚く',{depth:24,dir:60,lw:5,wob:40}],
  ['まっすぐ',{jit:0,jy:0,slip:0,wob:8}],
  ['崩す',{jit:10,jy:14,wob:70,wsc:60,sang:-30,sdrop:-45}],
  ['地なし',{clear:true}],
  ['紙',{bg:'#e9e3d6',face:'#ffffff',ink:'#2a2622'}],
];
function applyPreset(i){if(!DEF)DEF=settings(); const o=Object.assign({},DEF,PRESETS[i][1]); o.txt=$('txt').value; o.sub=$('sub').value; o.thin=$('thin').value; applySettings(o);
  document.querySelectorAll('#presets button').forEach((b,j)=>b.classList.toggle('on',j===i))}
PRESETS.forEach(([name],i)=>{const b=document.createElement('button');b.textContent=name;b.onclick=()=>applyPreset(i);$('presets').appendChild(b)});
go();
</script>
</body></html>
