<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fuxx Fox — LP Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { font-family: 'Inter', -apple-system, sans-serif; background: #f4f4f5; color: #09090b; font-size: 13px; }

.header {
  height: 52px; background: #fff; border-bottom: 1px solid #e4e4e7;
  display: flex; align-items: center; padding: 0 20px; gap: 16px;
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
}
.logo { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.logo-icon { width: 28px; height: 28px; background: #09090b; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; font-weight: 800; }
.stepper { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.step { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #71717a; }
.step.active { color: #09090b; font-weight: 600; }
.step-num { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid currentColor; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; }
.step.active .step-num { background: #09090b; border-color: #09090b; color: #fff; }
.step-arrow { color: #d4d4d8; }

.layout { display: flex; position: fixed; top: 52px; left: 0; right: 0; bottom: 52px; }

.canvas { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
.canvas-empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; color: #a1a1aa; padding: 40px 0;
}
.canvas-empty p { font-size: 13px; line-height: 1.6; text-align: center; }

.slot { background: #fff; border: 1.5px solid #e4e4e7; border-radius: 10px; overflow: hidden; transition: border-color .15s; }
.slot.active { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
.slot-header {
  display: flex; align-items: center; gap: 8px; padding: 7px 12px;
  border-bottom: 1px solid #f4f4f5; background: #fafafa;
}
.slot-type-badge { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 20px; background: #f4f4f5; color: #71717a; border: 1px solid #e4e4e7; white-space: nowrap; }
.slot-name { font-size: 12px; font-weight: 500; color: #3f3f46; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot-controls { display: flex; gap: 4px; flex-shrink: 0; }
.slot-btn { width: 24px; height: 24px; border: 1px solid #e4e4e7; border-radius: 5px; background: #fff; cursor: pointer; font-size: 11px; display: flex; align-items: center; justify-content: center; color: #71717a; transition: background .1s; }
.slot-btn:hover:not(:disabled) { background: #f4f4f5; color: #09090b; }
.slot-btn:disabled { opacity: .3; cursor: default; }
.slot-btn.danger:hover { background: #fef2f2; color: #ef4444; border-color: #fca5a5; }
.slot-btn.edit { font-size: 10px; width: auto; padding: 0 8px; }
.slot-preview { height: 88px; overflow: hidden; cursor: pointer; }
.slot-preview.empty { display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 5px; color: #a1a1aa; background: #fafafa; }
.slot-preview.empty p { font-size: 11px; }

.add-row { display: flex; gap: 6px; flex-wrap: wrap; padding: 4px 0 8px; }
.add-type-btn {
  display: flex; align-items: center; gap: 5px; padding: 7px 12px; border-radius: 7px;
  border: 1.5px dashed #d4d4d8; background: #fff; color: #71717a;
  font-size: 11px; font-weight: 500; cursor: pointer; transition: all .15s;
}
.add-type-btn:hover { border-color: #2563eb; color: #2563eb; background: #eff6ff; }

.panel { width: 300px; min-width: 300px; background: #fff; border-left: 1px solid #e4e4e7; display: flex; flex-direction: column; overflow: hidden; }
.panel-header { padding: 12px 14px 10px; border-bottom: 1px solid #e4e4e7; flex-shrink: 0; }
.panel-title { font-size: 12px; font-weight: 600; margin-bottom: 8px; color: #3f3f46; }
.filter-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.filter-tab { font-size: 10px; font-weight: 500; padding: 3px 9px; border-radius: 20px; border: 1px solid #e4e4e7; background: #fafafa; color: #71717a; cursor: pointer; transition: all .15s; }
.filter-tab.on { background: #09090b; color: #fff; border-color: #09090b; }
.panel-body { flex: 1; overflow-y: auto; padding: 10px; }
.parts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.part-item { border: 1.5px solid #e4e4e7; border-radius: 8px; overflow: hidden; cursor: pointer; transition: border-color .15s; background: #fff; }
.part-item:hover { border-color: #2563eb; }
.part-item.selected { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,.15); }
.part-thumb { height: 62px; overflow: hidden; background: #f4f4f5; }
.part-label { font-size: 10px; font-weight: 500; padding: 5px 7px; color: #3f3f46; border-top: 1px solid #f4f4f5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.panel-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #a1a1aa; gap: 8px; text-align: center; padding: 24px; }
.panel-empty .arrow { font-size: 20px; opacity: .3; }
.panel-empty p { font-size: 12px; line-height: 1.7; }

.bottom-bar { height: 52px; background: #fff; border-top: 1px solid #e4e4e7; display: flex; align-items: center; padding: 0 20px; position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; }
.slot-count { font-size: 12px; color: #71717a; }
.output-btn { margin-left: auto; background: #09090b; color: #fff; border: none; border-radius: 7px; padding: 9px 22px; font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity .15s; }
.output-btn:hover:not(:disabled) { opacity: .8; }
.output-btn:disabled { opacity: .35; cursor: default; }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.open { display: flex; }
.modal { background: #18181b; border-radius: 12px; width: 100%; max-width: 760px; max-height: 82vh; display: flex; flex-direction: column; overflow: hidden; }
.modal-header { padding: 14px 18px; border-bottom: 1px solid #3f3f46; display: flex; align-items: center; gap: 10px; }
.modal-title { color: #fafafa; font-size: 14px; font-weight: 600; flex: 1; }
.modal-close { width: 28px; height: 28px; border-radius: 6px; background: #3f3f46; border: none; color: #a1a1aa; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
.modal-close:hover { background: #52525b; color: #fff; }
.copy-btn { padding: 6px 14px; border-radius: 6px; background: #2563eb; border: none; color: #fff; font-size: 12px; font-weight: 600; cursor: pointer; }
.copy-btn:hover { background: #1d4ed8; }
pre { flex: 1; overflow: auto; padding: 18px; font-family: 'Menlo','Consolas',monospace; font-size: 11.5px; line-height: 1.6; color: #d1d5db; margin: 0; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-icon">F</div>
    Fuxx Fox
  </div>
  <div class="stepper">
    <div class="step active"><div class="step-num">1</div><span>作る</span></div>
    <div class="step-arrow">→</div>
    <div class="step"><div class="step-num">2</div><span>出力</span></div>
  </div>
</div>

<div class="layout">
  <div class="canvas" id="canvas">
    <div class="canvas-empty" id="emptyState">
      <div style="font-size:28px;opacity:.15;">⬜</div>
      <p>下のボタンでセクションを追加して<br>LPを組み立てましょう</p>
    </div>
    <div id="slotList"></div>
    <div class="add-row">
      <button class="add-type-btn" onclick="addSlot('hero')">＋ KV / Hero</button>
      <button class="add-type-btn" onclick="addSlot('nav')">＋ Navigation</button>
      <button class="add-type-btn" onclick="addSlot('section')">＋ セクション</button>
      <button class="add-type-btn" onclick="addSlot('card')">＋ カード</button>
      <button class="add-type-btn" onclick="addSlot('cta')">＋ CTA / Footer</button>
    </div>
  </div>

  <div class="panel" id="panel">
    <div id="panelEmpty" class="panel-empty">
      <div class="arrow">←</div>
      <p>セクションを追加して<br>パーツを選んでください</p>
    </div>
    <div id="panelContent" style="display:none;flex-direction:column;flex:1;overflow:hidden;">
      <div class="panel-header">
        <div class="panel-title" id="panelTitle">パーツを選ぶ</div>
        <div class="filter-tabs" id="filterTabs"></div>
      </div>
      <div class="panel-body">
        <div class="parts-grid" id="partsGrid"></div>
      </div>
    </div>
  </div>
</div>

<div class="bottom-bar">
  <span class="slot-count" id="slotCount">0 スロット</span>
  <button class="output-btn" id="outputBtn" disabled onclick="openOutput()">コードを出力 →</button>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeOutput()">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">HTML コード出力</span>
      <button class="copy-btn" onclick="copyCode()">コピー</button>
      <button class="modal-close" onclick="closeOutput()">✕</button>
    </div>
    <pre id="codeOutput"></pre>
  </div>
</div>

// ── State ─────────────────────────────────────────────────────
let slots = [];
let activeSlotId = null;
let activeFilter = 'all';
let slotCounter = 0;

function getSlot(id) { return slots.find(s => s.id === id); }

// ── Render ─────────────────────────────────────────────────────
function render() {
  const slotList = document.getElementById('slotList');
  const emptyState = document.getElementById('emptyState');
  emptyState.style.display = slots.length === 0 ? 'flex' : 'none';

  slotList.innerHTML = slots.map((slot, i) => {
    const part = PARTS.find(p => p.id === slot.partId);
    const isActive = slot.id === activeSlotId;
    return `<div class="slot${isActive ? ' active' : ''}" id="slot-${slot.id}">
      <div class="slot-header">
        <span class="slot-type-badge">${TYPES[slot.type] || slot.type}</span>
        <span class="slot-name">${part ? part.name : 'パーツ未選択'}</span>
        <div class="slot-controls">
          <button class="slot-btn" onclick="moveSlot(${slot.id},-1)" ${i === 0 ? 'disabled' : ''}>↑</button>
          <button class="slot-btn" onclick="moveSlot(${slot.id},1)" ${i === slots.length - 1 ? 'disabled' : ''}>↓</button>
          <button class="slot-btn edit" onclick="activateSlot(${slot.id})">変更</button>
          <button class="slot-btn danger" onclick="removeSlot(${slot.id})">✕</button>
        </div>
      </div>
      <div class="slot-preview${part ? '' : ' empty'}" onclick="activateSlot(${slot.id})">
        ${part
          ? `<div style="width:100%;height:100%;">${part.thumb}</div>`
          : '<p>クリックしてパーツを選ぶ</p>'
        }
      </div>
    </div>`;
  }).join('');

  const selected = slots.filter(s => s.partId).length;
  document.getElementById('slotCount').textContent = `${slots.length} スロット・${selected} パーツ選択中`;
  document.getElementById('outputBtn').disabled = selected === 0;

  renderPanel();
}

function renderPanel() {
  const panelEmpty = document.getElementById('panelEmpty');
  const panelContent = document.getElementById('panelContent');

  if (!activeSlotId) {
    panelEmpty.style.display = 'flex';
    panelContent.style.display = 'none';
    return;
  }
  panelEmpty.style.display = 'none';
  panelContent.style.display = 'flex';

  const slot = getSlot(activeSlotId);
  if (!slot) return;

  document.getElementById('panelTitle').textContent = `${TYPES[slot.type] || slot.type} を選ぶ`;

  const typeEntries = [{ id: 'all', label: 'すべて' }, ...Object.entries(TYPES).map(([id, label]) => ({ id, label }))];
  document.getElementById('filterTabs').innerHTML = typeEntries
    .map(t => `<button class="filter-tab${activeFilter === t.id ? ' on' : ''}" onclick="setFilter('${t.id}')">${t.label}</button>`)
    .join('');

  const filtered = activeFilter === 'all' ? PARTS : PARTS.filter(p => p.type === activeFilter);
  document.getElementById('partsGrid').innerHTML = filtered
    .map(part => `<div class="part-item${slot.partId === part.id ? ' selected' : ''}" onclick="selectPart('${part.id}')">
      <div class="part-thumb"><div style="width:100%;height:100%;">${part.thumb}</div></div>
      <div class="part-label">${part.name}</div>
    </div>`)
    .join('');
}

// ── Actions ────────────────────────────────────────────────────
function addSlot(type) {
  const id = ++slotCounter;
  slots.push({ id, type, partId: null });
  activeSlotId = id;
  activeFilter = type;
  render();
  requestAnimationFrame(() => {
    const el = document.getElementById(`slot-${id}`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
}

function activateSlot(id) {
  activeSlotId = id;
  const slot = getSlot(id);
  if (slot) activeFilter = slot.type;
  render();
}

function selectPart(partId) {
  if (!activeSlotId) return;
  const slot = getSlot(activeSlotId);
  if (!slot) return;
  slot.partId = partId;
  render();
}

function moveSlot(id, dir) {
  const i = slots.findIndex(s => s.id === id);
  const j = i + dir;
  if (j < 0 || j >= slots.length) return;
  [slots[i], slots[j]] = [slots[j], slots[i]];
  render();
}

function removeSlot(id) {
  slots = slots.filter(s => s.id !== id);
  if (activeSlotId === id) activeSlotId = null;
  render();
}

function setFilter(type) {
  activeFilter = type;
  renderPanel();
}

// ── Output ─────────────────────────────────────────────────────
function openOutput() {
  const parts = slots.filter(s => s.partId).map(s => PARTS.find(p => p.id === s.partId));
  const html = `<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LP</title>
</head>
<body style="margin:0;padding:0;font-family:sans-serif;">
${parts.map(p => p.html).join('\n')}
</body>
</html>`;
  document.getElementById('codeOutput').textContent = html;
  document.getElementById('modalOverlay').classList.add('open');
}

function closeOutput() {
  document.getElementById('modalOverlay').classList.remove('open');
}

function copyCode() {
  const text = document.getElementById('codeOutput').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = 'コピーしました ✓';
    setTimeout(() => btn.textContent = 'コピー', 2000);
  });
}

render();
</script>
</body>
