<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private | 木下スタジオ</title>
  <meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
  <meta name="googlebot" content="noindex, nofollow, noarchive, noimageindex">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500&family=Space+Mono&display=swap" rel="stylesheet">
  <!-- パスワード付きの見本ページ（2026-10-02）。
       中身（見出し・説明・作品の一覧・画像の置き場）は AES-GCM で暗号化してある＝ソースを見ても読めない。
       鍵はパスワードから PBKDF2（SHA-256）で作る。作り直し・PW変更は
       iCloud の作業フォルダ（_jsx/_サイトの一覧を暗号化.py） -->
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #EBE8E2; --bg-alt: #E2DED6; --ink: #1a1a18; --ink-light: #3a3a34;
      --ink-faint: #7a7770; --gold: #a89060; --border: rgba(26,26,24,0.12);
    }
    html { -webkit-text-size-adjust: 100%; }
    body { background: var(--bg); color: var(--ink); font-family: 'Zen Kaku Gothic New', sans-serif; line-height: 1.8; }
    .mono { font-family: 'Space Mono', monospace; letter-spacing: .12em; text-transform: uppercase; }
    a { color: inherit; }

    /* ── 入口（パスワード） */
    .gate { min-height: 100vh; min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
    .gate form { width: 100%; max-width: 380px; }
    .gate .mono { font-size: 11px; color: var(--ink-faint); }
    .gate h1 { font-size: 22px; font-weight: 500; margin: 10px 0 6px; }
    .gate p { font-size: 13px; color: var(--ink-light); }
    .gate .row { display: flex; margin-top: 24px; border: 1px solid var(--ink); }
    .gate input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 12px 14px; border: 0; background: transparent; color: var(--ink); outline: none; }
    .gate button { font: inherit; font-size: 13px; padding: 0 20px; border: 0; background: var(--ink); color: var(--bg); cursor: pointer; }
    .gate .err { min-height: 1.8em; margin-top: 10px; font-size: 12.5px; color: #a33; }

    /* ── 中身 */
    .page { display: none; max-width: 1200px; margin: 0 auto; padding: 64px 24px 96px; }
    body.open .gate { display: none; }
    body.open .page { display: block; }
    header .mono { font-size: 11px; color: var(--ink-faint); }
    header h1 { font-size: clamp(24px, 3.4vw, 34px); font-weight: 500; margin: 10px 0 14px; letter-spacing: .02em; }
    header p { font-size: 14px; color: var(--ink-light); max-width: 46em; }
    .specs { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 18px; font-size: 12.5px; color: var(--ink-light); }
    .specs b { font-weight: 500; color: var(--ink); }

    .group { margin-top: 56px; padding-top: 32px; border-top: 1px solid var(--ink); }
    .group h2 { font-size: 20px; font-weight: 500; letter-spacing: .02em; }
    .group > p { font-size: 13.5px; color: var(--ink-light); max-width: 46em; margin-top: 10px; }
    .filter { display: flex; gap: 0; margin: 40px 0 8px; border: 1px solid var(--ink); width: max-content; max-width: 100%; }
    .filter button { font: inherit; font-size: 12.5px; padding: 9px 16px; border: 0; background: transparent; color: var(--ink); cursor: pointer; white-space: nowrap; }
    .filter button + button { border-left: 1px solid var(--ink); }
    .filter button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

    .work { padding: 40px 0; border-top: 1px solid var(--border); }
    .work:first-of-type { border-top: 0; }
    .work .hd { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; margin-bottom: 16px; }
    .work .hd .mono { font-size: 10.5px; color: var(--ink-faint); }
    .work .hd h2 { font-size: 18px; font-weight: 500; }
    .work .hd .date { font-size: 12.5px; color: var(--ink-light); }
    .pair { display: grid; grid-template-columns: minmax(0, 2.6fr) minmax(0, 1fr); gap: 20px; align-items: start; }
    figure a { display: block; }
    figure img { display: block; width: 100%; height: auto; background: var(--bg-alt); }
    figcaption { margin-top: 8px; font-size: 11.5px; color: var(--ink-faint); }
    body[data-show="wide"] .tall, body[data-show="tall"] .wide { display: none; }
    body[data-show="wide"] .pair, body[data-show="tall"] .pair { grid-template-columns: minmax(0, 1fr); }
    body[data-show="tall"] .pair { max-width: 480px; }

    .aim { margin-top: 18px; border: 1px solid var(--border); background: var(--bg-alt); padding: 16px 20px; display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px 28px; }
    .aim dt { font-size: 11px; letter-spacing: .1em; color: var(--gold); font-weight: 500; }
    .aim dd { font-size: 12.5px; color: var(--ink-light); line-height: 1.85; margin-top: 4px; }
    @media (max-width: 720px) { .aim { grid-template-columns: 1fr; padding: 14px 16px; } }
    .notes { margin-top: 48px; border: 1px solid var(--ink); padding: 32px 36px 28px; background: var(--bg); }
    .notes h3 { font-size: 17px; font-weight: 500; letter-spacing: .04em; }
    .notes ol { list-style: none; counter-reset: n; margin-top: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px 40px; }
    .notes li { counter-increment: n; display: grid; grid-template-columns: 2.2em 1fr; gap: 2px 0; font-size: 13px; color: var(--ink-light); line-height: 1.85; }
    .notes li::before { content: counter(n, decimal-leading-zero); font-family: 'Space Mono', monospace; font-size: 11px; color: var(--gold); grid-row: span 2; padding-top: 3px; }
    .notes li b { font-size: 14px; font-weight: 500; color: var(--ink); }
    .notes-sub { margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border); display: grid; gap: 8px; font-size: 12.5px; color: var(--ink-light); }
    .notes-sub b { font-weight: 500; color: var(--ink); }
    @media (max-width: 720px) { .notes { padding: 24px 18px; } .notes ol { grid-template-columns: 1fr; } }
    footer { margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--border); font-size: 12.5px; color: var(--ink-light); }
    footer p + p { margin-top: 6px; }

    @media (max-width: 720px) {
      .page { padding: 40px 16px 72px; }
      .pair { grid-template-columns: minmax(0, 1fr); gap: 16px; }
      body:not([data-show]) .tall, body[data-show="all"] .tall { max-width: 72%; }
      .filter button { padding: 9px 12px; }
    }
  </style>
</head>

  </form>
</div>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function render(data) {
  document.getElementById('page').innerHTML = data.body;
  document.querySelectorAll('.filter button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.filter button').forEach(x => x.setAttribute('aria-pressed', x === b));
    document.body.dataset.show = b.dataset.show;
  }));
  document.getElementById('list').innerHTML = data.items.map(w => `
    <article class="work">
      <div class="hd"><span class="mono">${esc(w.cat)}</span><h2>${esc(w.t)}</h2>${w.date ? `<span class="date">${esc(w.date)}</span>` : ''}</div>
      <div class="pair">
        <figure class="wide"><a href="${esc(w.b)}" target="_blank" rel="noopener"><img src="${esc(w.b)}" width="1536" height="770" alt="${esc(w.t)} ${esc(data.lb)}" loading="lazy" decoding="async"></a><figcaption>${esc(data.lb)}　1536 × 770</figcaption></figure>
        <figure class="tall"><a href="${esc(w.s)}" target="_blank" rel="noopener"><img src="${esc(w.s)}" width="1080" height="1350" alt="${esc(w.t)} ${esc(data.ls)}" loading="lazy" decoding="async"></a><figcaption>${esc(data.ls)}　1080 × 1350</figcaption></figure>
      </div>
      ${w.tg ? `<dl class="aim"><div><dt>ターゲット</dt><dd>${esc(w.tg)}</dd></div><div><dt>ペルソナ</dt><dd>${esc(w.ps)}</dd></div><div><dt>ゴール</dt><dd>${esc(w.gl)}</dd></div></dl>` : ''}
    </article>`).join('');
  document.body.classList.add('open');
}

async function tryOpen(pw, remember) {
  try {
    const data = await decrypt(pw);
    if (remember) { try { sessionStorage.setItem('wb-pw', pw); } catch (e) {} }
    render(data);
    return true;
  } catch (e) { return false; }
}

document.getElementById('gate').addEventListener('submit', async ev => {
  ev.preventDefault();
  const err = document.getElementById('err');
  err.textContent = '';
  const ok = await tryOpen(document.getElementById('pw').value, true);
  if (!ok) err.textContent = 'パスワードが違います。';
});

(async () => {
  let saved = null;
  try { saved = sessionStorage.getItem('wb-pw'); } catch (e) {}
  if (saved) await tryOpen(saved, false);
})();
</script>
