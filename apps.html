<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>APPS — KINOSHITA STUDIO</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }

  /* ── Gruvbox DARK palette (constraint.systems と同一) ── */
  :root {
    --bg:          #000000;
    --bg-card:     #1d2021;
    --bg-card-h:   #282828;
    --fg:          #ebdbb2;
    --fg-dim:      #a89984;
    --fg-faint:    #504945;
    --line:        #3c3836;

    --green:  #b8bb26;
    --blue:   #83a598;
    --yellow: #d79921;
    --red:    #cc241d;
    --purple: #b16286;
    --aqua:   #8ec07c;
    --orange: #d65d0e;
  }

  html { -webkit-text-size-adjust: 100%; color-scheme: dark; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  a { color: inherit; text-decoration: none; }

  /* ── Header (minimal) ── */
  .head {
    padding: 20px 16px 14px;
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 16px; flex-wrap: wrap;
  }
  .brand {
    font-size: 14px; font-weight: 700;
    letter-spacing: 0.02em;
  }
  .brand em { font-style: normal; color: var(--fg-dim); font-weight: 400; }
  .head-right {
    font-size: 11px; color: var(--fg-dim);
    display: flex; gap: 14px;
  }
  .head-right a { border-bottom: 1px dashed var(--fg-faint); padding-bottom: 1px; }
  .head-right a:hover { color: var(--green); border-color: var(--green); }

  /* ── Grid (constraint.systems-style) ── */
  .grid {
    padding: 2px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 2px;
  }
  .card {
    background: var(--bg-card);
    display: flex; flex-direction: column;
    text-decoration: none; color: inherit;
    transition: background .15s;
  }
  .card:hover { background: var(--bg-card-h); }

  .thumb {
    aspect-ratio: 1 / 1;
    background: var(--bg-card);
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .thumb img {
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
  }

  /* placeholder (no-ogp) : simple centered mark */
  .thumb-ph {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .thumb-ph-inner {
    display: flex; flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .thumb-ph-mark {
    font-size: 56px;
    font-weight: 700;
    color: var(--fg);
    letter-spacing: -0.04em;
    line-height: 1;
  }
  .thumb-ph-label {
    font-size: 10px;
    color: var(--fg-dim);
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  /* meta strip below thumb */
  .meta {
    padding: 8px 10px 10px;
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 10px;
    font-size: 12px;
  }
  .title {
    color: var(--fg);
    font-weight: 500;
    letter-spacing: 0;
  }
  .date {
    color: var(--fg-dim);
    font-size: 11px;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  /* ── Footer ── */
  footer {
    padding: 20px 16px;
    margin-top: 4px;
    font-size: 11px;
    color: var(--fg-dim);
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  footer a { border-bottom: 1px dashed var(--fg-faint); }
  footer a:hover { color: var(--green); border-color: var(--green); }

  @media (max-width: 560px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
    .thumb-ph-mark { font-size: 42px; }
  }
</style>
</head>
<body>

<header class="head">
  <div class="brand">KINOSHITA_STUDIO <em>/ apps</em></div>
  <div class="head-right">
    <a href="https://github.com/kinoshitastudio" target="_blank" rel="noopener">github ↗</a>
    <a href="/">studio ↗</a>
  </div>
</header>

<main class="grid" id="grid"></main>

<footer>
  <span>not for public distribution · internal use only</span>
  <span>2026 · kinoshita studio</span>
</footer>

<script>
const BASE = 'https://kinoshitastudio.github.io';
const PROJECTS = [
  { id:'kodoco',            title:'Kodoco',            date:'2026-04', image: BASE + '/kodoco/ogp.svg' },
  { id:'himekuri_kondate',  title:'Mekuri Kondate',    date:'2026-04', image: 'assets/thumbs/himekuri.png' },
  { id:'jean_of_denim',     title:'Jean of Denim',     date:'2026-03', image: null, mark: 'J' },
  { id:'kody_typography',   title:'Kody Typography',   date:'2026-02', image: BASE + '/kody_typography/og-image.svg' },
  { id:'black_mirror',      title:'Black Mirror',      date:'2026-02', image: null, mark: '◼' },
  { id:'bent',              title:'Bent',              date:'2026-01', image: null, mark: '✂' },
  { id:'ddd',               title:'DDD',               date:'2026-01', image: 'assets/thumbs/ddd.png' },
  { id:'balance_optimizer', title:'Balance Optimizer', date:'2025-12', image: null, mark: '−' },
  { id:'bear-radar',        title:'Bear Radar',        date:'2025-11', image: 'assets/thumbs/bear.png' },
  { id:'signal',            title:'Signal',            date:'2025-10', image: null, mark: '≈' },
];

function render(list) {
  const g = document.getElementById('grid');
  g.innerHTML = list.map(p => {
    const thumb = p.image
      ? '<img src="' + p.image + '" alt="" loading="lazy">'
      : '<div class="thumb-ph"><div class="thumb-ph-inner">'
        + '<div class="thumb-ph-mark">' + p.mark + '</div>'
        + '<div class="thumb-ph-label">' + p.id + '</div>'
        + '</div></div>';
    return ''
      + '<a class="card" href="' + BASE + '/' + p.id + '/" target="_blank" rel="noopener">'
      +   '<div class="thumb">' + thumb + '</div>'
      +   '<div class="meta">'
      +     '<span class="title">' + p.title + '</span>'
      +     '<span class="date">' + p.date + '</span>'
      +   '</div>'
      + '</a>';
  }).join('');
}

render(PROJECTS);
</script>

</body>
</html>
